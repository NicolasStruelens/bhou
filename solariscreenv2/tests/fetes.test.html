<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Tests — fêtes</title>
  <style>
    body { font-family: ui-monospace, monospace; background:#0a0e14; color:#e8f0f9; padding:24px; line-height:1.6; }
    h1 { color:#00ff9c; }
    h2 { color:#93a8bf; font-size:14px; margin-top:22px; text-transform:uppercase; letter-spacing:.08em; }
    .pass { color:#00e08a; } .fail { color:#ff5470; font-weight:700; }
    table { border-collapse: collapse; margin-top:12px; width:100%; max-width:900px; }
    td, th { border:1px solid #233347; padding:6px 10px; text-align:left; font-size:13px; vertical-align:top; }
    th { color:#93a8bf; }
    #summary { font-size:18px; margin-top:16px; }
  </style>
</head>
<body>
  <h1>SOLARISCREEN — Tests fetes.js</h1>
  <div id="summary">Exécution…</div>
  <div id="out"></div>

  <script src="../assets/js/fetes.js"></script>
  <script>
    const F = window.SSFetes;

    let pass = 0, fail = 0;
    const rows = [];
    function check(nom, obtenu, attendu) {
      const a = JSON.stringify(obtenu), b = JSON.stringify(attendu);
      const ok = a === b;
      ok ? pass++ : fail++;
      rows.push('<tr><td>' + nom + '</td><td>' + a + '</td><td>' + b + '</td><td class="' + (ok ? 'pass' : 'fail') + '">' + (ok ? 'OK' : 'ÉCHEC') + '</td></tr>');
    }
    // Un vrai objet Date LOCAL : c'est précisément ce que le module doit lire, et ce qu'une
    // conversion en UTC casserait.
    const d = (a, m, j, h) => new Date(a, m - 1, j, h === undefined ? 12 : h, 0, 0);
    const nom = (x) => (x ? x.nom : null);

    // ══════════ 1. La lecture de la date est LOCALE ══════════
    // new Date().toISOString().slice(0,10) renvoie une date UTC : le 1er novembre à 00 h 30 en
    // heure belge, c'est encore le 31 octobre pour UTC. Les toiles resteraient un jour de trop.
    check('minuit et demi reste le bon jour',  F._moisJour(d(2026, 11, 1, 0)), '11-01');
    check('23 h 30 reste le bon jour',         F._moisJour(d(2026, 10, 31, 23)), '10-31');
    check('un chiffre est complété à deux',    F._moisJour(d(2026, 1, 5)), '01-05');

    // ══════════ 2. Une période normale ══════════
    check('avant la borne', F._dansLaPeriode('09-30', '10-01', '11-02'), false);
    check('le jour pile',   F._dansLaPeriode('10-01', '10-01', '11-02'), true);
    check('au milieu',      F._dansLaPeriode('10-31', '10-01', '11-02'), true);
    check('dernier jour INCLUS', F._dansLaPeriode('11-02', '10-01', '11-02'), true);
    check('le lendemain',   F._dansLaPeriode('11-03', '10-01', '11-02'), false);

    // ══════════ 3. Une période qui enjambe le 1er janvier ══════════
    // Écrite du:'12-26' au:'01-02', elle ne peut pas se tester par un simple « du <= x <= au ».
    // C'est le seul cas où la comparaison bascule, et donc le seul qui puisse casser en silence
    // le jour où l'on ajoutera le Nouvel An.
    check('fin décembre',      F._dansLaPeriode('12-28', '12-26', '01-02'), true);
    check('le 31 décembre',    F._dansLaPeriode('12-31', '12-26', '01-02'), true);
    check('le 1er janvier',    F._dansLaPeriode('01-01', '12-26', '01-02'), true);
    check('dernier jour',      F._dansLaPeriode('01-02', '12-26', '01-02'), true);
    check('le 3 janvier, non', F._dansLaPeriode('01-03', '12-26', '01-02'), false);
    check('juillet, non',      F._dansLaPeriode('07-14', '12-26', '01-02'), false);

    // ══════════ 4. Halloween, de bout en bout ══════════
    check('30 septembre : rien',     nom(F.active(d(2026, 9, 30))), null);
    check('1er octobre : Halloween', nom(F.active(d(2026, 10, 1))), 'Halloween');
    check('31 octobre : Halloween',  nom(F.active(d(2026, 10, 31))), 'Halloween');
    check('2 novembre : encore',     nom(F.active(d(2026, 11, 2))), 'Halloween');
    // Le lendemain de la Toussaint, tout disparaît SEUL. C'est la raison d'être du module :
    // sans lui, il faudrait penser à retirer les toiles à la main sur vingt pages.
    check('3 novembre : plus rien',  nom(F.active(d(2026, 11, 3))), null);
    check('en plein été : rien',     nom(F.active(d(2026, 7, 14))), null);
    check("l'année suivante aussi",  nom(F.active(d(2027, 10, 15))), 'Halloween');

    // ══════════ 4 ante. Rentrée scolaire ══════════
    check('24 août : rien',          nom(F.active(d(2026, 8, 24))), null);
    check('25 août : Rentrée',       nom(F.active(d(2026, 8, 25))), 'Rentrée');
    check('1er septembre : Rentrée', nom(F.active(d(2026, 9, 1))),  'Rentrée');
    check('7 septembre : Rentrée',   nom(F.active(d(2026, 9, 7))),  'Rentrée');
    check('8 septembre : plus rien', nom(F.active(d(2026, 9, 8))),  null);

    // ══════════ 4 bis. Décembre : Saint-Nicolas puis Noël ══════════
    check('30 novembre : rien',        nom(F.active(d(2026, 11, 30))), null);
    check('1er décembre : Saint-Nicolas', nom(F.active(d(2026, 12, 1))), 'Saint-Nicolas');
    check('6 décembre : Saint-Nicolas',   nom(F.active(d(2026, 12, 6))), 'Saint-Nicolas');
    // Entre les deux, volontairement RIEN : la Saint-Nicolas est finie, Noël n'a pas commencé.
    check('7 décembre : plus rien',    nom(F.active(d(2026, 12, 7))), null);
    check('9 décembre : toujours rien', nom(F.active(d(2026, 12, 9))), null);
    check('10 décembre : Noël',        nom(F.active(d(2026, 12, 10))), 'Noël');
    check('25 décembre : Noël',        nom(F.active(d(2026, 12, 25))), 'Noël');
    check('26 décembre : Noël',        nom(F.active(d(2026, 12, 26))), 'Noël');
    /* Le 27, Noël s'efface — mais depuis l'ajout du Nouvel An ce n'est plus le vide qui suit,
       c'est la fête suivante. L'assertion d'origine (« 27 décembre : plus rien ») a été prise en
       défaut par ce test au moment de l'ajout : c'est exactement ce qu'on lui demande. Le « ça
       disparaît tout seul » se vérifie maintenant au 3 janvier, plus bas. */
    check('27 décembre : Noël a passé la main', nom(F.active(d(2026, 12, 27))), 'Nouvel An');

    // ══════════ 4 ter. Nouvel An — la seule période qui enjambe le 1er janvier ══════════
    check('26 décembre : encore Noël',  nom(F.active(d(2026, 12, 26))), 'Noël');
    check('27 décembre : Nouvel An',    nom(F.active(d(2026, 12, 27))), 'Nouvel An');
    check('31 décembre : Nouvel An',    nom(F.active(d(2026, 12, 31))), 'Nouvel An');
    check('1er janvier : Nouvel An',    nom(F.active(d(2026, 1, 1))),  'Nouvel An');
    check('2 janvier : Nouvel An',      nom(F.active(d(2026, 1, 2))),  'Nouvel An');
    check('3 janvier : plus rien',      nom(F.active(d(2026, 1, 3))),  null);

    /* L'APERÇU force une fête hors de sa période (il sert à juger un décor de décembre en
       octobre, depuis un téléphone où la console n'existe pas). Il ne doit JAMAIS déborder sur
       une date explicite, sinon tous les tests ci-dessus se mettraient à mentir dès qu'il est
       actif — et on chercherait longtemps. */
    F.apercu('noel');
    check('aperçu : la fête courante devient Noël', nom(F.active()), 'Noël');
    check('aperçu : une date EXPLICITE reste maîtresse', nom(F.active(d(2026, 10, 15))), 'Halloween');
    F.apercu('');
    check('aperçu levé : on revient au calendrier',
      nom(F.active()), nom(F.active(new Date())));

    /* AUCUNE PÉRIODE NE DOIT EN CHEVAUCHER UNE AUTRE. `active` retient la PREMIÈRE qui
       correspond, donc deux fêtes qui se recouvrent se voleraient la vedette — et laquelle
       gagne dépendrait de l'ordre dans la table, ce qui ne se devine pas en la lisant. */
    (function () {
      const jours = [];
      for (let m = 1; m <= 12; m++) for (let j = 1; j <= 31; j++) {
        const date = new Date(2026, m - 1, j, 12);
        if (date.getMonth() === m - 1) jours.push(F._moisJour(date));
      }
      const doubles = jours.filter(function (mj) {
        return F.FETES.filter(function (f) { return F._dansLaPeriode(mj, f.du, f.au); }).length > 1;
      });
      check('aucun chevauchement sur les 365 jours', doubles.length, 0);
    })();

    // ══════════ 5. Le contrat que toute fête doit respecter ══════════
    // Ajouter une fête, c'est ajouter une entrée. Ces règles disent ce qu'une entrée doit porter,
    // et elles sont là pour la PROCHAINE fête : c'est elle qui se trompera, pas Halloween.
    const decorsDe = (f) => {
      const l = [];
      if (f.coin) { l.push(f.coin); if (f.coin.bete) l.push(f.coin.bete); }
      if (f.marque) l.push(f.marque);
      if (f.rail) { if (f.rail.coin) l.push(f.rail.coin); if (f.rail.pied) l.push(f.rail.pied); }
      if (f.tombe) l.push(f.tombe);
      return l.concat(f.volants || []);
    };
    // Une teinte s'écrit { sombre, clair } ou en valeur simple ; une valeur simple sert alors
    // dans les deux thèmes.
    const tons = (v) => (v && typeof v === 'object') ? [v.sombre, v.clair] : [v, v];

    F.FETES.forEach(function (f) {
      check(f.id + ' : a un nom', typeof f.nom === 'string' && f.nom.length > 0, true);
      check(f.id + ' : bornes au format MM-JJ', /^\d{2}-\d{2}$/.test(f.du) && /^\d{2}-\d{2}$/.test(f.au), true);
      const slots = decorsDe(f);
      check(f.id + ' : au moins un décor', slots.length > 0, true);
      // Un décor est soit du SVG en ligne, soit un fichier — jamais ni l'un ni l'autre, sinon
      // il se monte dans le vide sans la moindre erreur.
      /* Un décor porte soit du SVG en ligne, soit une LISTE de SVG (neige, confettis, feuilles :
         un seul dessin répété se voit immédiatement), soit un fichier. Jamais rien : il se
         monterait dans le vide, sans la moindre erreur. */
      const aUnDessin = function (x) {
        if (typeof x.img === 'string') return true;
        if (Array.isArray(x.svg)) return x.svg.length > 0 && x.svg.every(function (v) { return typeof v === 'string' && v.indexOf('<svg') === 0; });
        return typeof x.svg === 'string' && x.svg.indexOf('<svg') === 0;
      };
      check(f.id + ' : chaque décor porte un dessin', slots.every(aUnDessin), true);
      // Les décors ne doivent pas se lire comme un statut : ils vivent en opacité basse.
      check(f.id + ' : opacités raisonnables',
        slots.every(function (s) { return tons(s.opacite).every(function (o) { return o === undefined || (o > 0 && o <= 1); }); }), true);
      /* LES DEUX THÈMES, TOUJOURS. Les décors ont d'abord été calibrés en sombre et coloriés en
         dur : en clair — le thème réellement utilisé en production — la toile ne se voyait
         presque plus. Une teinte sans ses deux tons est donc une erreur, pas un oubli anodin. */
      check(f.id + ' : chaque teinte a ses deux tons',
        slots.every(function (s) { return tons(s.teinte).every(function (t) { return typeof t === 'string' && t.length > 0; }); }), true);
      check(f.id + ' : chaque opacité a ses deux tons',
        slots.every(function (s) { return tons(s.opacite).every(function (o) { return typeof o === 'number'; }); }), true);
      // Un volant sans durée resterait figé au bord de l'écran.
      check(f.id + ' : chaque volant a une durée et une hauteur',
        (f.volants || []).every(function (v) { return v.duree > 0 && typeof v.haut === 'string'; }), true);
      // Ce qui tombe sans nombre ne tombe pas, et sans durée reste collé en haut.
      check(f.id + ' : ce qui tombe a un nombre et une durée',
        !f.tombe || (f.tombe.nombre > 0 && f.tombe.duree > 0 && f.tombe.taille > 0), true);
    });

    // ══════════ 6. L'extinction ══════════
    check('allumé par défaut', F.estAllumee(), true);
    F.allumer(false);
    check('éteint après réglage', F.estAllumee(), false);
    F.allumer(true);
    check('rallumé', F.estAllumee(), true);

    document.getElementById('out').innerHTML =
      '<table><tr><th>Cas</th><th>Obtenu</th><th>Attendu</th><th>—</th></tr>' + rows.join('') + '</table>';
    const total = pass + fail;
    document.getElementById('summary').innerHTML = fail === 0
      ? '<span class="pass">' + pass + '/' + total + ' — tout passe.</span>'
      : '<span class="fail">' + fail + ' ÉCHEC(S)</span> sur ' + total;
    document.title = (fail === 0 ? 'OK ' + pass + '/' + total : 'ÉCHEC ' + fail) + ' — Tests fêtes';
  </script>
</body>
</html>
