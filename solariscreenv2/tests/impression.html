<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Impression — banc</title>
</head>
<body style="font-family: system-ui, sans-serif;">
  <!--
    Pas une suite — le BANC D'IMPRESSION. Il remplit le banc (le vrai serveur sur une base en mémoire) avec le
    bac à sable, puis ÉCRIT à sa place, dans CETTE fenêtre, le document demandé : un navigateur sans écran peut
    alors l'imprimer en PDF (`chrome --headless --print-to-pdf`), exactement comme « Enregistrer en PDF ».
    Une page blanche, un pied seul sur une deuxième feuille, un fond qui disparaît : ça n'existe qu'au moment
    où le moteur d'impression pagine (CLAUDE.md, règle 31 septies) — un aperçu à l'écran ne le montre pas.

      impression.html?page=app/devis.html%3Fid%3DESSAI-07
      impression.html?page=devis-review.html%3Ft%3Dessai-tok-02&action=client     (le PDF que le CLIENT imprime)
      impression.html?page=app/depenses.html&action=bordereau
      impression.html?page=app/stats.html&action=releve
      impression.html?page=app/portfolio.html&action=portfolio

    Le document prêt, la page pose `window.__imprimable = true` : le pilote d'impression (Chrome sans écran
    piloté par son protocole, `Page.printToPDF`) n'imprime qu'à ce signal. Imprimer « au bout d'un délai »
    (`--virtual-time-budget`) sortait un PDF sur trois avant que le document ne soit là.

    ⚠️ `page` est une adresse de l'ERP et rien d'autre, `action` un nom de la liste ci-dessous : ce banc est publié
    avec le reste du dossier, et une page qui exécuterait ce qu'on lui passe dans l'adresse serait une faille.
    Il n'écrit JAMAIS dans la vraie base : le banc est posé avant la première écriture.
  -->
  <p id="etat">Préparation du banc…</p>
  <script src="../assets/js/company.js"></script>
  <script src="../assets/js/ui.js"></script>
  <script src="../assets/js/config.js"></script>
  <script src="../assets/js/calc.js"></script>
  <script src="../assets/js/products.js"></script>
  <script src="../assets/js/api.js"></script>
  <script src="bac-a-sable.js"></script>
  <script src="banc-serveur.js"></script>
  <script>
  (async function () {
    'use strict';
    const P = new URLSearchParams(location.search);
    const page = P.get('page') || '', action = P.get('action') || '';
    const etat = (t) => { const e = document.getElementById('etat'); if (e) e.textContent = t; };
    if (!/^(app\/)?[a-z-]+\.html(\?[A-Za-z0-9=&%._-]*)?$/.test(page) || !/^(|client|bordereau|releve|portfolio)$/.test(action)) { etat('Adresse refusée.'); window.__imprimable = 'adresse refusée'; return; }
    const BANC = window.SSBanc, SS = window.SS;
    const attendre = (ms) => new Promise((r) => setTimeout(r, ms));
    /* Combien de temps chaque étape (chargement, première requête, calme, images) a pour aboutir. Chaque attente s'arrête DÈS
       que c'est fait : un délai long ne coûte rien quand tout va bien. Il en faut un long parce que la machine qui imprime est
       souvent chargée : mesuré le 11/11/2026 avec huit Chrome en parallèle (planning-page.test.html), jusqu'à 13 s pour que
       ui.js arrive, 20 s pour le premier rendu, plus de 35 s quand d'autres suites tournaient. Les anciens 30 s, 10 s et 4 s
       ne disaient rien en expirant : le banc imprimait quand même, un document pas fini. Désormais il ÉCHOUE, et dit pourquoi
       (`__imprimable` = « échec : … »), au lieu de livrer un PDF faux. */
    const DELAI_PAGE = 90000;
    const pasPret = (quoi) => new Error(page + ' pas prête après ' + DELAI_PAGE / 1000 + ' s (' + quoi + ') : machine trop chargée ?');
    /* ⚠️ Attendre d'abord la PREMIÈRE requête du document : ses scripts attendent ses feuilles de style
       (les polices Google comprises), et un banc « calme » parce que la page n'a pas encore commencé
       imprimait la barre d'outils seule, au format Letter. */
    async function poser(n0) {
      const t1 = Date.now();
      while (BANC.appels === n0 && Date.now() - t1 < DELAI_PAGE) await attendre(100);
      if (BANC.appels === n0) throw pasPret('aucune requête au banc');
      const t0 = Date.now(); let n = BANC.appels, calme = Date.now(), calmee = false;
      await attendre(400);
      while (Date.now() - t0 < DELAI_PAGE) {
        await attendre(100);
        if (BANC.appels !== n) { n = BANC.appels; calme = Date.now(); } else if (Date.now() - calme > 600) { calmee = true; break; }
      }
      if (!calmee) throw pasPret('le banc ne se calme pas, ' + BANC.appels + ' requêtes');
      try { await document.fonts.ready; } catch (e) {}
      await attendre(200);
    }
    async function images() {
      const t0 = Date.now();
      // Une image « lazy » hors de la fenêtre ne se charge jamais d'elle-même ici (l'ancien délai de 4 s la laissait
      // tomber en silence, et la page attendrait désormais pour rien) : le PDF doit les montrer toutes, on les charge.
      [...document.images].forEach((im) => { if (im.loading === 'lazy') im.loading = 'eager'; });
      // Une image en erreur (absente du banc) compte comme finie : c'est ce que le PDF montrera, comme en vrai.
      const enCours = () => [...document.images].filter((im) => !im.complete);
      while (enCours().length && Date.now() - t0 < DELAI_PAGE) await attendre(100);
      const reste = enCours();
      if (reste.length) throw pasPret(reste.length + ' image(s) pas chargée(s), dont ' + String(reste[0].currentSrc || reste[0].src).slice(0, 120));
    }

    await BANC.demarrer();
    BANC.installer(window);
    BANC.nouvelleBase(true); BANC.viderCaches();
    BANC.ident = P.get('qui') === 'yannick' ? BANC.YANNICK : BANC.NICOLAS;
    const rem = await window.SSBacASable.remplir(SS, {});
    if (rem.erreurs.length) { etat('Remplissage : ' + rem.erreurs.join(' · ')); window.__imprimable = 'remplissage'; return; }
    BANC.DB.exec("UPDATE devis SET data = json_set(data, '$.track_token', 'essai-trk-10') WHERE id = 'ESSAI-10'");
    /* `exemple=volets4` : le devis FICTIF de la règle 60 (quatre volets, deux écarts, un screen au milieu) — pour relire
       en vrai PDF l'encadré commun et ses différences, des deux côtés (`action=client` avec `essai-cfg-4`). */
    if (P.get('exemple') === 'volets4') {
      await SS.saveDevis(window.SSBacASable.exempleQuatreVolets({ avecScreen: true }), { creation: true });
      BANC.DB.exec("UPDATE devis SET data = json_set(data, '$.review_token', 'essai-cfg-4') WHERE id = 'ESSAI-CFG-4'");
    }

    /* `exemple=remises` : les six devis FICTIFS à remise de la règle 65 (`exemplesRemises`), pour relire en vrai PDF le
       récapitulatif « Prix de base − Votre remise (x %) = Total HTVA », des deux côtés (`action=client` avec `essai-rem-N`). */
    if (P.get('exemple') === 'remises') {
      for (const d of window.SSBacASable.exemplesRemises()) await SS.saveDevis(d, { creation: true });
      BANC.DB.exec("UPDATE devis SET data = json_set(data, '$.review_token', 'essai-rem-' || substr(id, 11)) WHERE id LIKE 'ESSAI-REM-%'");
    }

    const adresse = new URL('../' + page, location.href).href;
    const html = await (await BANC.vraiFetch(adresse, { cache: 'no-store' })).text();
    // L'impression est celle du moteur sans écran : la boîte de dialogue n'existe pas ici.
    const sansDialogue = () => { window.print = function () {}; window.alert = function () {}; window.confirm = function () { return true; }; };
    // Le chargement se guette par un écouteur posé APRÈS l'ouverture (qui efface les écouteurs de la
    // fenêtre) et AVANT l'écriture : lire `readyState` juste après `close()` peut répondre trop tôt.
    let charge = false;
    const ecrire = (h) => {
      charge = false;
      document.open();
      window.addEventListener('load', () => { charge = true; }, { once: true });
      document.write(h);
      document.close();
    };
    const chargee = async () => {
      const t = Date.now();
      while (!charge && Date.now() - t < DELAI_PAGE) await attendre(100);
      if (!charge) throw pasPret('document pas chargé');
    };
    const n0 = BANC.appels;
    history.replaceState(null, '', adresse);
    window.fetch = BANC.fetch;
    sansDialogue();
    ecrire(html);
    await chargee();
    await poser(n0);

    if (action === 'bordereau') { window.ouvrirRemise('nicolas'); await attendre(100); window.imprimerBordereau(); }
    if (action === 'releve') { window.imprimerReleve(); }
    if (action === 'portfolio') { await window.printDoc(); }
    if (action === 'client') {
      // Le document que le CLIENT imprime naît dans une fenêtre neuve : on le capture et on l'écrit ici.
      let capture = '';
      window.open = () => ({ document: { write: (h) => { capture += h; }, close() {} }, focus() {}, print() {} });
      window.printDevis();
      ecrire(capture);
      sansDialogue();
      await chargee();
      try { await document.fonts.ready; } catch (e) {}
    }
    await images();
    await attendre(300);
    // Le signal que le pilote d'impression attend (`Runtime.evaluate`) : il n'imprime qu'à ce moment-là.
    window.__imprimable = true;
  })().catch((e) => { window.__imprimable = 'échec : ' + (e && e.message); });
  </script>
</body>
</html>
