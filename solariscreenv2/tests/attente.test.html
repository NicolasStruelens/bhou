<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Tests — attente</title>
  <style>
    body { font-family: ui-monospace, monospace; background:#0a0e14; color:#e8f0f9; padding:24px; line-height:1.6; }
    h1 { color:#00ff9c; }
    .pass { color:#00e08a; } .fail { color:#ff5470; font-weight:700; }
    table { border-collapse: collapse; margin-top:12px; width:100%; max-width:900px; }
    td, th { border:1px solid #233347; padding:6px 10px; text-align:left; font-size:13px; vertical-align:top; }
    th { color:#93a8bf; }
    #summary { font-size:18px; margin-top:16px; }
  </style>
</head>
<body>
  <h1>SOLARISCREEN — Tests attente.js</h1>
  <div id="summary">Exécution…</div>
  <div id="out"></div>

  <script src="../assets/js/ui.js"></script>
  <script src="../assets/js/config.js"></script>
  <script src="../assets/js/planning.js"></script>
  <script src="../assets/js/attente.js"></script>
  <script>
    const A = window.SSAttente;
    const P = window.SSPlanning;

    let pass = 0, fail = 0;
    const rows = [];
    function check(nom, obtenu, attendu) {
      const a = JSON.stringify(obtenu), b = JSON.stringify(attendu);
      const ok = a === b;
      ok ? pass++ : fail++;
      rows.push('<tr><td>' + nom + '</td><td>' + a + '</td><td>' + b + '</td><td class="' + (ok ? 'pass' : 'fail') + '">' + (ok ? 'OK' : 'ÉCHEC') + '</td></tr>');
    }
    // Dates RELATIVES : les règles portent sur des délais, pas sur un calendrier. Un test calé sur
    // des dates fixes commencerait à mentir le lendemain.
    const ilYaH = (h) => new Date(Date.now() - h * 3600000).toISOString();
    const jour = (n) => { const d = new Date(); d.setDate(d.getDate() + n);
      return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); };
    const AUJ = jour(0), DEMAIN = jour(1), HIER = jour(-1);
    const quoi = (l) => l.map(i => i.quoi);
    const cli = (nom) => ({ nom: nom, prenom: '' });

    // ══════════ 1. Demandes de RDV ══════════
    check('R1 une demande que personne n’a prise', quoi(A.depuisRdv([
      { id: 'R1', statut: 'nouveau', assigned_to: '', client: cli('Dupont'), date_creation: ilYaH(1) },
    ])), ['Personne ne l’a prise en charge']);
    check('R2 … et elle n’appartient à personne', A.depuisRdv([
      { id: 'R1', statut: 'nouveau', assigned_to: '', client: cli('Dupont'), date_creation: ilYaH(1) },
    ])[0].qui, '');
    // Un client qui attend un jour entier appelle le concurrent : l'urgence doit monter avec l'âge.
    check('R3 urgence monte après 4 h', A.depuisRdv([
      { id: 'R1', statut: 'nouveau', assigned_to: '', client: cli('D'), date_creation: ilYaH(5) },
    ])[0].urgence, A.URGENCE.HAUTE);
    check('R4 urgence critique après 24 h', A.depuisRdv([
      { id: 'R1', statut: 'nouveau', assigned_to: '', client: cli('D'), date_creation: ilYaH(30) },
    ])[0].urgence, A.URGENCE.CRITIQUE);
    check('R5 une demande prise en charge ne remonte pas', A.depuisRdv([
      { id: 'R1', statut: 'nouveau', assigned_to: 'nicolas', client: cli('D'), date_creation: ilYaH(1), date_rdv: DEMAIN },
    ]).filter(i => i.quoi.indexOf('Personne') === 0).length, 0);
    check('R6 annulée et convertie sont ignorées', A.depuisRdv([
      { id: 'A', statut: 'annule', assigned_to: '', client: cli('X'), date_creation: ilYaH(50) },
      { id: 'B', statut: 'converti', assigned_to: '', client: cli('Y'), date_creation: ilYaH(50) },
    ]).length, 0);
    check('R7 une réponse t’est demandée', A.depuisRdv([
      { id: 'R', statut: 'a_contacter', assigned_to: 'nicolas', awaiting: 'yannick', client: cli('D'),
        date_creation: ilYaH(2), date_modification: ilYaH(2), comments: [{ ask: 'yannick', text: 'On y va ?', date: ilYaH(2) }] },
    ]).filter(i => i.quoi.indexOf('réponse') >= 0)[0].qui, 'yannick');
    check('R8 visite demain → rappel', quoi(A.depuisRdv([
      { id: 'R', statut: 'rdv_fixe', assigned_to: 'nicolas', client: cli('D'), date_rdv: DEMAIN + 'T09:00', date_creation: ilYaH(48) },
    ])), ['Visite demain — penser au rappel']);
    check('R9 demande de 3 jours sans rendez-vous', quoi(A.depuisRdv([
      { id: 'R', statut: 'a_contacter', assigned_to: 'nicolas', client: cli('D'), date_creation: ilYaH(72) },
    ])), ['À recontacter — aucun rendez-vous fixé']);
    check('R10 visite passée sans devis', quoi(A.depuisRdv([
      { id: 'R', statut: 'rdv_fixe', assigned_to: 'nicolas', client: cli('D'), date_rdv: HIER + 'T09:00', date_creation: ilYaH(96) },
    ])), ['Visite passée — et le devis ?']);
    check('R11 visité, devis pas fait', quoi(A.depuisRdv([
      { id: 'R', statut: 'visite', assigned_to: 'nicolas', client: cli('D'), devis_id: '', date_modification: ilYaH(20) },
    ])), ['Visité, en attente du devis']);
    check('R12 rappel daté échu', quoi(A.depuisRdv([
      { id: 'R', statut: 'a_contacter', assigned_to: 'nicolas', client: cli('D'), rappel_date: AUJ, date_creation: ilYaH(2), date_rdv: DEMAIN },
    ])), ['Rappel prévu aujourd’hui']);

    // ══════════ 1 bis. Apres la visite : ou en est le DEVIS ? ══════════
    // Sans ce rapprochement, une demande visitee dont le devis avait ete fait au simulateur
    // restait « en attente du devis » POUR TOUJOURS : l'ERP ne pouvait pas savoir qu'il existait.
    const VISITE = { id: 'RV', statut: 'visite', assigned_to: 'nicolas', client: { nom: 'Zurstrassen', prenom: 'Doris' },
                     devis_id: '', date_modification: ilYaH(48) };
    check('V1 aucun devis → on le reclame', quoi(A.depuisRdv([VISITE], [])), ['Visité, en attente du devis']);
    // Lien EXPLICITE (bouton « Creer le devis » : il pose devis.rdv_id).
    check('V2 devis lie en brouillon → c’est l’envoi qui manque',
      quoi(A.depuisRdv([VISITE], [{ id: 'D1', rdv_id: 'RV', statut: 'brouillon', client: { nom: 'Zurstrassen', prenom: 'Doris' } }])),
      ['Devis commencé, pas encore envoyé']);
    // Devis parti : les relances du devis prennent le relais, on ne reclame plus rien ici.
    check('V3 devis envoye → plus rien a reclamer',
      A.depuisRdv([VISITE], [{ id: 'D1', rdv_id: 'RV', statut: 'envoye_client', client: { nom: 'Zurstrassen', prenom: 'Doris' } }]).length, 0);
    check('V4 devis signe → plus rien a reclamer',
      A.depuisRdv([VISITE], [{ id: 'D1', rdv_id: 'RV', statut: 'signe', client: { nom: 'Zurstrassen', prenom: 'Doris' } }]).length, 0);
    // Lien PROBABLE : devis fait directement au simulateur, rapproche par le nom du client.
    check('V5 devis du meme client, sans lien explicite',
      quoi(A.depuisRdv([VISITE], [{ id: 'D9', statut: 'brouillon', client: { nom: 'Zurstrassen', prenom: 'Doris' } }])),
      ['Devis commencé, pas encore envoyé']);
    check('V6 le rapprochement est signale comme tel',
      A.depuisRdv([VISITE], [{ id: 'D9', statut: 'brouillon', client: { nom: 'Zurstrassen', prenom: 'Doris' } }])[0].detail.indexOf('rapproché') >= 0, true);
    check('V7 un autre client ne compte pas',
      quoi(A.depuisRdv([VISITE], [{ id: 'D9', statut: 'brouillon', client: { nom: 'Autre', prenom: 'Jean' } }])),
      ['Visité, en attente du devis']);
    // Une demande deja « convertie » mais dont le devis dort en brouillon : le travail SEMBLE fait,
    // c'est exactement celle qu'on oublie.
    check('V8 convertie avec devis en brouillon → signale quand meme',
      quoi(A.depuisRdv([{ id: 'RC', statut: 'converti', assigned_to: 'nicolas', client: { nom: 'X', prenom: 'Y' },
                         devis_id: 'D2', date_modification: ilYaH(48) }],
                       [{ id: 'D2', statut: 'brouillon', client: { nom: 'X', prenom: 'Y' } }])),
      ['Devis commencé, pas encore envoyé']);
    check('V9 un devis archive ne sert pas de rapprochement',
      A.devisDeRdv(VISITE, [{ id: 'D9', archive: 1, statut: 'brouillon', client: { nom: 'Zurstrassen', prenom: 'Doris' } }]), null);
    check('V10 le lien explicite prime sur le rapprochement',
      A.devisDeRdv(VISITE, [
        { id: 'DX', statut: 'brouillon', client: { nom: 'Zurstrassen', prenom: 'Doris' }, date_creation: '2026-09-01' },
        { id: 'DY', rdv_id: 'RV', statut: 'brouillon', client: { nom: 'Zurstrassen', prenom: 'Doris' }, date_creation: '2026-01-01' },
      ]).devis.id, 'DY');

    // ══════════ 1 ter. « Aujourd'hui » en heure LOCALE ══════════
    // toISOString() renvoie de l'UTC : une date construite a 00h30 heure belge y devient LA VEILLE.
    // Un devis cree a cette heure-la portait donc une date fausse -- et une date ECRITE en base
    // reste fausse pour toujours.
    const MINUIT30 = new Date(2026, 6, 15, 0, 30);        // 15 juillet 2026, 00h30 LOCAL
    check('U1 minuit passe reste le bon jour', window.SSUI.isoDate(MINUIT30), '2026-07-15');
    check('U2 fin de journee aussi', window.SSUI.isoDate(new Date(2026, 6, 15, 23, 45)), '2026-07-15');
    check('U3 aujourd hui = date locale du jour', window.SSUI.aujourdhui(), window.SSUI.isoDate(new Date()));
    check('U4 une date illisible ne renvoie pas n importe quoi', window.SSUI.isoDate('pas une date'), '');
    // La preuve que le defaut etait reel : sur un fuseau en avance sur UTC, les deux divergent.
    const decalage = -new Date(2026, 6, 15).getTimezoneOffset();   // minutes a l'est de UTC
    check('U5 le defaut est bien evite', decalage > 0 ? (MINUIT30.toISOString().slice(0, 10) !== window.SSUI.isoDate(MINUIT30)) : true, true);

    // ══════════ 1 quater. GARANTIE d'un SAV ══════════
    // « Facturable ou pas ? » est la premiere question devant un ticket. Elle se repondait de tete,
    // dossier par dossier ; elle se deduit de la date de pose et de la duree de garantie.
    const R12 = { prix: { garantie_mois: 12 } };
    const poseIlYa = (mois) => { const d = new Date(); d.setMonth(d.getMonth() - mois); return { chantier: { date_pose: window.SSUI.isoDate(d) } }; };
    check('W1 pose recente = sous garantie', window.SSUI.garantieDe(poseIlYa(3), R12).sous_garantie, true);
    check('W2 pose de 3 ans = hors garantie', window.SSUI.garantieDe(poseIlYa(36), R12).sous_garantie, false);
    check('W3 sans date de pose, on ne devine pas', window.SSUI.garantieDe({}, R12).connue, false);
    check('W4 la duree vient des reglages',
      window.SSUI.garantieDe(poseIlYa(18), { prix: { garantie_mois: 24 } }).sous_garantie, true);
    // Le 31 janvier + 1 mois donnerait le 3 mars : on recule au dernier jour du mois visé.
    check('W5 fin de mois courte', window.SSUI.plusMois('2026-01-31', 1), '2026-02-28');
    check('W6 mois normal', window.SSUI.plusMois('2026-03-15', 12), '2027-03-15');
    check('W7 une date absurde ne renvoie pas n importe quoi', window.SSUI.plusMois('pas-une-date', 12), '');

    // Pose PREVUE (dans le futur) : la garantie n'a pas commence. L'afficher « sous garantie »
    // pousserait a ne pas facturer une intervention qui l'est.
    check('W8 pose prevue = garantie non demarree',
      window.SSUI.garantieDe({ statut: 'signe', chantier: { date_pose: jour(20) } }, R12).sous_garantie, false);
    check('W9 … et on dit pourquoi',
      window.SSUI.garantieDe({ statut: 'signe', chantier: { date_pose: jour(20) } }, R12).avant_pose, true);
    check('W10 signe sans date = pose pas encore faite',
      window.SSUI.garantieDe({ statut: 'signe' }, R12).avant_pose, true);
    // Un SAV se cree des que le devis est SIGNE : un materiel livre defectueux se constate avant
    // la pose -- c'est le cas des 33 screens dont un seul etait casse.
    check('W11 SAV possible sur un devis signe', window.SSUI.savPossible({ statut: 'signe' }), true);
    check('W12 pas sur un brouillon', window.SSUI.savPossible({ statut: 'brouillon' }), false);
    check('W13 pas sur un dossier archive', window.SSUI.savPossible({ statut: 'signe', archive: 1 }), false);
    check('W14 mais oui s il porte deja un ticket',
      window.SSUI.savPossible({ statut: 'brouillon', sav_tickets: [{ id: 't' }] }), true);

    // ══════════ 2. SAV ══════════
    const devisSav = (t) => [{ id: 'D1', client: cli('Martin'), sav_tickets: [t] }];
    check('S1 ticket sans responsable', A.depuisSav(devisSav(
      { id: 't1', statut: 'ouvert', description: 'Moteur HS', date_creation: ilYaH(2) }))[0].quoi,
      'Ticket SAV sans responsable');
    check('S2 … et personne dessus', A.depuisSav(devisSav(
      { id: 't1', statut: 'ouvert', description: 'x', date_creation: ilYaH(2) }))[0].qui, '');
    // Trois jours sans responsable sur un client mécontent : c'est le pire cas de l'ERP.
    check('S3 sans responsable depuis 3 j = critique', A.depuisSav(devisSav(
      { id: 't1', statut: 'ouvert', description: 'x', date_creation: ilYaH(80) }))[0].urgence, A.URGENCE.CRITIQUE);
    check('S4 avec responsable → il lui appartient', A.depuisSav(devisSav(
      { id: 't1', statut: 'en_cours', pour: 'yannick', description: 'x', date_creation: ilYaH(2) }))[0].qui, 'yannick');
    check('S5 ticket résolu ignoré', A.depuisSav(devisSav(
      { id: 't1', statut: 'resolu', pour: 'yannick', description: 'x', date_creation: ilYaH(200) })).length, 0);
    check('S6 devis archivé ignoré', A.depuisSav([
      { id: 'D', archive: 1, client: cli('M'), sav_tickets: [{ id: 't', statut: 'ouvert', description: 'x', date_creation: ilYaH(2) }] },
    ]).length, 0);

    // ══════════ 3. Échanges ══════════
    check('E1 un sujet qui attend quelqu’un', A.depuisSujets([
      { id: 'S', statut: 'ouvert', titre: 'Coulisses ?', awaiting: 'nicolas', date_modification: ilYaH(2) },
    ])[0].qui, 'nicolas');
    // Une idée que personne n'attend n'est pas un blocage : elle a sa place dans les Échanges,
    // pas dans la liste de ce qui empêche d'avancer.
    check('E2 une idée sans destinataire n’est pas une attente', A.depuisSujets([
      { id: 'S', statut: 'ouvert', titre: 'Forfait entretien', awaiting: '', echeance: '', date_modification: ilYaH(2) },
    ]).length, 0);
    check('E3 un sujet classé ne remonte plus', A.depuisSujets([
      { id: 'S', statut: 'fait', titre: 'x', awaiting: 'nicolas', date_modification: ilYaH(2) },
    ]).length, 0);
    check('E4 échéance dépassée = critique', A.depuisSujets([
      { id: 'S', statut: 'ouvert', titre: 'x', awaiting: '', echeance: HIER, date_modification: ilYaH(2) },
    ])[0].urgence, A.URGENCE.CRITIQUE);
    check('E5 une question qui dort 3 j devient urgente', A.depuisSujets([
      { id: 'S', statut: 'ouvert', titre: 'x', awaiting: 'yannick', date_modification: ilYaH(80) },
    ])[0].urgence, A.URGENCE.HAUTE);
    check('E6 … et 7 j, critique', A.depuisSujets([
      { id: 'S', statut: 'ouvert', titre: 'x', awaiting: 'yannick', date_modification: ilYaH(200) },
    ])[0].urgence, A.URGENCE.CRITIQUE);

    // ══════════ 4. Planning ══════════
    const REG = { planning: { heures: { debut: '08:00', midi: '12:00', reprise: '13:00', fin: '17:00' },
      trame: { nicolas: { lun: 'journee', mar: 'journee', mer: 'journee', jeu: 'journee', ven: 'journee', sam: 'non', dim: 'non' },
               yannick: { lun: 'journee', mar: 'journee', mer: 'journee', jeu: 'journee', ven: 'journee', sam: 'non', dim: 'non' } },
      duree_visite_h: 1, duree_pose_h: 4, duree_depannage_h: 2 } };
    const EV_ORPHELIN = [
      { id: 'pose:D1', source: 'pose', date: jour(3), heure: '', duree_h: 4, qui: [], titre: 'Chantier X', ref: 'D1', href: 'vue.html?id=D1' },
      { id: 'rdv:R1', source: 'visite', date: jour(3), heure: '09:00', duree_h: 1, qui: [], titre: 'Visite Y', ref: 'R1', href: 'rdv.html?open=R1' },
    ];
    // Une visite orpheline est DÉJÀ signalée par les demandes de RDV : la reprendre ici la ferait
    // apparaître deux fois dans l'écran commun, et une liste qui se répète perd sa crédibilité.
    check('P1 écran commun : la visite orpheline n’est pas reprise',
      A.depuisPlanning(EV_ORPHELIN, [], REG).length, 1);
    check('P2 … c’est bien la pose qui reste',
      A.depuisPlanning(EV_ORPHELIN, [], REG)[0].nature, 'pose');
    check('P3 écran du planning : les deux sont montrées',
      A.depuisPlanning(EV_ORPHELIN, [], REG, { inclureVisites: true }).length, 2);
    // Deux rendez-vous pour la même personne à la même heure : le télescopage invisible d'avant.
    const EV_CONFLIT = [
      { id: 'a', source: 'pose', date: jour(2), heure: '08:00', duree_h: 4, qui: ['nicolas'], titre: 'Depaepe', ref: 'D1', href: '' },
      { id: 'b', source: 'depannage', date: jour(2), heure: '10:00', duree_h: 2, qui: ['nicolas'], titre: 'Petit', ref: 'D2', href: '' },
    ];
    check('P4 conflit détecté', A.depuisPlanning(EV_CONFLIT, [], REG).filter(i => i.quoi.indexOf('même heure') >= 0).length, 1);
    check('P5 le conflit nomme la personne', A.depuisPlanning(EV_CONFLIT, [], REG).filter(i => i.quoi.indexOf('même heure') >= 0)[0].qui, 'nicolas');
    check('P6 rendez-vous passé sans suite', A.depuisPlanning([
      { id: 'pose:D9', source: 'pose', date: jour(-4), heure: '', duree_h: 4, qui: ['yannick'], titre: 'Z', ref: 'D9', href: '' },
    ], [], REG).filter(i => i.quoi.indexOf('passé') >= 0).length, 1);
    /* ⚠️ Le libellé a changé le 06/10/2026 : « Chantier signé sans date de pose » →
       « Matériel reçu, pose à planifier ». La liste ne contient plus que des chantiers dont le
       matériel est ARRIVÉ (voir SSPlanning.aPlanifierDe) : réclamer une date sur un dossier encore
       en fabrication, c'est réclamer une décision que personne ne peut prendre. */
    check('P7 matériel reçu, pose à planifier', A.depuisPlanning([], [
      { id: 'D5', client: cli('Sans date'), date_modification: ilYaH(48) },
    ], REG).filter(i => i.quoi.indexOf('pose à planifier') >= 0).length, 1);
    /* Et sa CONTREPARTIE. Les deux listes doivent rester complémentaires : sans celle-ci, un devis
       signé jamais commandé ne serait réclamé par personne — ni pour la commande, ni pour la pose
       qu'on vient de conditionner à la réception. */
    const ACOM = A.depuisPlanning([], [], REG, null, [
      { id: 'D6', client: cli('Pas commandé'), date_modification: ilYaH(72) },
    ]);
    check('P7 bis chantier signé, matériel pas commandé',
      ACOM.filter(i => i.quoi.indexOf('pas commandé') >= 0).length, 1);
    check('P7 ter il renvoie vers la commande du dossier, pas vers le planning',
      (ACOM[0] || {}).href, 'vue.html?id=D6#commande');
    check('P7 quater les deux listes produisent deux lignes distinctes',
      A.depuisPlanning([], [{ id: 'D5', client: cli('A'), date_modification: ilYaH(1) }], REG, null,
        [{ id: 'D6', client: cli('B'), date_modification: ilYaH(1) }]).length, 2);

    // ══════════ 5. Tri et regroupements ══════════
    // L'ordre EST la règle métier : ce que personne n'a pris passe avant tout, même moins urgent.
    const MELANGE = A.trier([
      { id: '1', qui: 'nicolas', urgence: A.URGENCE.CRITIQUE, depuis: ilYaH(1) },
      { id: '2', qui: '', urgence: A.URGENCE.MOYENNE, depuis: ilYaH(1) },
      { id: '3', qui: 'nicolas', urgence: A.URGENCE.HAUTE, depuis: ilYaH(1) },
    ]);
    check('T1 sans personne passe devant, même moins urgent', MELANGE[0].id, '2');
    check('T2 puis l’urgence décide', MELANGE[1].id, '1');
    check('T3 à égalité, le plus ancien d’abord', A.trier([
      { id: 'recent', qui: 'nicolas', urgence: 1, depuis: ilYaH(1) },
      { id: 'vieux', qui: 'nicolas', urgence: 1, depuis: ilYaH(100) },
    ])[0].id, 'vieux');

    const LOT = [
      { id: 'a', qui: '', urgence: A.URGENCE.CRITIQUE, source: 'rdv', depuis: ilYaH(1) },
      { id: 'b', qui: 'nicolas', urgence: A.URGENCE.MOYENNE, source: 'sav', depuis: ilYaH(1) },
      { id: 'c', qui: 'yannick', urgence: A.URGENCE.HAUTE, source: 'echange', depuis: ilYaH(1) },
    ];
    check('G1 ce qui m’attend', A.pourQui(LOT, 'nicolas').map(i => i.id), ['b']);
    check('G2 ce que personne n’a pris', A.sansPersonne(LOT).map(i => i.id), ['a']);
    // « Me concerne » inclut ce que personne n'a pris : sinon chacun l'ignore en pensant que
    // l'autre l'a vu, ce qui est exactement le problème à résoudre.
    check('G3 me concerne = le mien + l’orphelin', A.concerne(LOT, 'nicolas').map(i => i.id), ['a', 'b']);
    check('G4 comptage', A.compter(LOT), { total: 3, sansPersonne: 1, critique: 1, parSource: { rdv: 1, sav: 1, echange: 1 } });

    // ══════════ 6. Assemblage complet ══════════
    const TOUT = A.construire({
      rdvs: [{ id: 'R', statut: 'nouveau', assigned_to: '', client: cli('Neuf'), date_creation: ilYaH(30) }],
      devis: devisSav({ id: 't', statut: 'ouvert', description: 'x', date_creation: ilYaH(2) }),
      sujets: [{ id: 'S', statut: 'ouvert', titre: 'q', awaiting: 'nicolas', date_modification: ilYaH(2) }],
      evenements: EV_CONFLIT, aPlanifier: [], reglages: REG,
    });
    check('C1 les quatre sources sont réunies',
      [...new Set(TOUT.map(i => i.source))].sort(), ['echange', 'planning', 'rdv', 'sav']);
    check('C2 les orphelins ouvrent la liste', TOUT[0].qui, '');
    check('C3 un identifiant unique par ligne', TOUT.length, [...new Set(TOUT.map(i => i.id))].length);

    /* ══════════ D. LA MISE EN ATTENTE D'UN DEVIS ══════════
       Elle vit dans ui.js (SSUI.attenteClient) et elle TOUCHE À LA CADENCE DE RELANCE, qui
       n'avait aucun test jusqu'ici. Elle est testée ICI parce que c'est le même sujet que tout
       ce fichier : de qui on attend quelque chose, et jusqu'à quand.
       ⚠️ Les dates sont construites en CHAÎNES à partir de SSUI.plusJours, jamais avec
       toISOString().slice(0,10) — celui-ci renvoie une date UTC, donc LA VEILLE entre minuit
       et 2 h du matin en heure d'été belge, et la suite se mettrait à échouer une nuit sur deux. */
    const AUJ_ATT = SSUI.aujourdhui();
    const JP_ATT = (n) => SSUI.plusJours(AUJ_ATT, n);
    // Un devis parti il y a 30 jours : la cadence réclame largement une relance.
    const devisVieux = (attentes) => ({
      id: 'D1', statut: 'relance_1', date_envoi: JP_ATT(-30), relances: [{ n: 1, date: JP_ATT(-20) }],
      attentes: attentes || [],
    });
    const ATT_ACTIVE = [{ id: 'a1', motif: 'Elle revient en novembre', revoir_le: JP_ATT(20), par: 'nicolas', le: JP_ATT(-1) }];
    const ATT_ECHUE = [{ id: 'a1', motif: 'Elle revient en novembre', revoir_le: JP_ATT(-3), par: 'nicolas', le: JP_ATT(-25) }];
    const ATT_LEVEE = [{ id: 'a1', motif: 'x', revoir_le: JP_ATT(20), par: 'nicolas', le: JP_ATT(-1), levee_le: JP_ATT(0) }];

    check('D1 sans attente, rien n\u2019est gelé', SSUI.attenteClient(devisVieux()).etat, 'aucune');
    check('D2 une attente à venir est ACTIVE', SSUI.attenteClient(devisVieux(ATT_ACTIVE)).etat, 'active');
    check('D3 une attente passée est ÉCHUE', SSUI.attenteClient(devisVieux(ATT_ECHUE)).etat, 'echue');
    // « Revenir dessus le X » : CE JOUR-LÀ le dossier doit être dans la liste, pas encore masqué.
    check('D4 le jour dit, l\u2019attente est déjà échue',
      SSUI.attenteClient(devisVieux([{ id: 'a', motif: 'm', revoir_le: AUJ_ATT }])).etat, 'echue');
    check('D5 une attente levée ne compte plus', SSUI.attenteClient(devisVieux(ATT_LEVEE)).etat, 'aucune');
    // Une attente sans date est un TROU : le dossier sortirait des compteurs sans jamais revenir.
    check('D6 une attente sans date est ignorée',
      SSUI.attenteClient(devisVieux([{ id: 'a', motif: 'm' }])).etat, 'aucune');
    check('D7 une date illisible est ignorée',
      SSUI.attenteClient(devisVieux([{ id: 'a', motif: 'm', revoir_le: 'bientôt' }])).etat, 'aucune');
    // La DERNIÈRE non levée fait foi : on peut avoir reporté plusieurs fois.
    check('D8 c\u2019est la dernière attente ouverte qui fait foi',
      SSUI.attenteClient(devisVieux([
        { id: 'a', motif: 'vieux', revoir_le: JP_ATT(-9), le: JP_ATT(-30), levee_le: JP_ATT(-8) },
        { id: 'b', motif: 'récent', revoir_le: JP_ATT(5), le: JP_ATT(-1) },
      ])).motif, 'récent');

    /* ⚠️ L'EFFET SUR LA CADENCE — c'est LA raison d'être de la fonctionnalité. Sans ces trois
       cas, on pourrait croire qu'elle marche en voyant juste le bandeau changer de texte. */
    check('D9 sans attente, la relance est due', SSUI.relanceEtat(devisVieux()).retard, true);
    check('D10 une attente ACTIVE gele la cadence', SSUI.relanceEtat(devisVieux(ATT_ACTIVE)).retard, false);
    check('D11 l\u2019échéance devient la date de reprise', SSUI.relanceEtat(devisVieux(ATT_ACTIVE)).due, JP_ATT(20));
    check('D12 une attente ÉCHUE rend la main à la cadence', SSUI.relanceEtat(devisVieux(ATT_ECHUE)).retard, true);
    /* ⚠️ ON PREND LE MAXIMUM DES DEUX, jamais la date d'attente seule : si la cadence tombe de
       toute façon APRÈS la date annoncée par le client, c'est la cadence qui gagne — sinon
       mettre en attente RAPPROCHERAIT la relance, ce qui est l'inverse du but. */
    const devisNeuf = { id: 'D2', statut: 'envoye_client', date_envoi: AUJ_ATT, relances: [],
      attentes: [{ id: 'a', motif: 'm', revoir_le: JP_ATT(1) }] };
    check('D13 une attente plus proche que la cadence ne la rapproche pas',
      SSUI.relanceEtat(devisNeuf).due, JP_ATT(4));
    // Le libellé vit dans ui.js : quatre écrans l'affichent, quatre copies diraient quatre choses.
    check('D14 le libellé court est fourni par le moteur',
      /^En attente — à revoir le /.test(SSUI.attenteClient(devisVieux(ATT_ACTIVE)).texte), true);

    /* ⚠️ OÙ LA MISE EN ATTENTE N'A PAS SA PLACE. Elle suspend ce qui POUSSE LE CLIENT À
       ACCEPTER, et seulement ça : un devis signé doit toujours être commandé, posé et encaissé,
       et un devis accepté en ligne n'attend plus rien du client. */
    check('D15 pas d\u2019attente sur un devis signé',
      SSUI.attenteApplicable({ statut: 'signe', attentes: ATT_ACTIVE }), false);
    check('D16 pas d\u2019attente sur un brouillon',
      SSUI.attenteApplicable({ statut: 'brouillon' }), false);
    check('D17 pas d\u2019attente sur un devis archivé',
      SSUI.attenteApplicable({ statut: 'relance_1', archive: 1 }), false);
    check('D18 pas d\u2019attente si le client a déjà accepté',
      SSUI.attenteApplicable({ statut: 'relance_1', client_accepted: 1 }), false);
    check('D19 attente possible sur un devis envoyé', SSUI.attenteApplicable({ statut: 'envoye_client' }), true);
    // Changer de statut ne demande AUCUNE écriture : l'attente cesse simplement de s'appliquer.
    check('D20 signer un devis éteint l\u2019attente sans rien effacer',
      SSUI.attenteClient({ statut: 'signe', attentes: ATT_ACTIVE }).etat, 'aucune');

    // ══════════ L'ANCIENNETÉ PART DU BON MOMENT (trouvé dans le bac à sable, 27/10/2026) ══════════
    // Trois alertes lisaient leur ancienneté sur « date_modification » : toute écriture sur le
    // dossier (une note, une photo de chantier) la remettait à zéro, et un chantier en attente depuis
    // des semaines s'affichait « depuis à l'instant ». Or c'est l'ancienneté qui rend une chose
    // urgente (règle 15). Chaque cas ci-dessous porte une modification « à l'instant » qui ne doit
    // plus rien changer.
    const MODIF_A_L_INSTANT = new Date().toISOString();
    const SIGNE_10J = ilYaH(240);
    const pl = (aPlan, aCom) => A.depuisPlanning([], aPlan || [], REG, {}, aCom || []);
    check('G1 « matériel pas commandé » compte depuis la SIGNATURE, pas la dernière modification',
      pl([], [{ id: 'G1', statut: 'signe', client: cli('G'), date_modification: MODIF_A_L_INSTANT, statut_history: [{ statut: 'signe', date: SIGNE_10J }] }])[0].depuis, SIGNE_10J);
    check('G2 « pose à planifier » compte depuis la RÉCEPTION du matériel (forme liste, à plat)',
      pl([{ id: 'G2', statut: 'signe', client: cli('G'), commande_statut: 'recu', commande_recu_le: jour(-6), date_modification: MODIF_A_L_INSTANT,
        statut_history: [{ statut: 'signe', date: SIGNE_10J }] }])[0].depuis, jour(-6));
    check('G3 … et sous la forme de la fiche complète (commande.recu_le)',
      pl([{ id: 'G3', statut: 'signe', client: cli('G'), commande: { statut: 'recu', recu_le: jour(-6) }, date_modification: MODIF_A_L_INSTANT }])[0].depuis, jour(-6));
    check('G4 un dossier reçu sans date de réception (avant le 27/10/2026) retombe sur la SIGNATURE, jamais sur la modification',
      pl([{ id: 'G4', statut: 'signe', client: cli('G'), commande_statut: 'recu', date_modification: MODIF_A_L_INSTANT,
        statut_history: [{ statut: 'signe', date: SIGNE_10J }] }])[0].depuis, SIGNE_10J);
    check('G5 « visité, en attente du devis » compte depuis la VISITE (ni la création, ni la modification)',
      A.depuisRdv([{ id: 'RG', statut: 'visite', assigned_to: 'nicolas', client: cli('G'), date_rdv: jour(-2) + 'T14:00',
        date_creation: ilYaH(288), date_modification: MODIF_A_L_INSTANT }], [])
        .filter(i => i.quoi === 'Visité, en attente du devis')[0].depuis, jour(-2) + 'T14:00');
    check('G6 normDevis GARDE la date de réception (la liste du tableau de bord passe par lui — c’est une liste blanche)',
      [SSUI.normDevis({ id: 'x', commande_recu_le: jour(-3) }).commande_recu_le, SSUI.dateReception({ commande: { recu_le: jour(-1) } }), SSUI.dateReception({})],
      [jour(-3), jour(-1), null]);
    check('G7 « 1,5 » et non « 1.5 » : la quantité suit UNE règle (la facture n’en avait aucune)',
      [SSUI.fmtQte(1.5), SSUI.fmtQte(2), SSUI.fmtQte('0.75'), SSUI.fmtQte(null)], ['1,5', '2', '0,75', '0']);

    // ══════════ Résultat ══════════
    document.getElementById('out').innerHTML =
      '<table><thead><tr><th>Cas</th><th>Obtenu</th><th>Attendu</th><th>Verdict</th></tr></thead><tbody>' + rows.join('') + '</tbody></table>';
    const total = pass + fail;
    document.getElementById('summary').innerHTML = fail === 0
      ? '<span class="pass">' + pass + '/' + total + ' — tout passe.</span>'
      : '<span class="fail">' + fail + ' ÉCHEC(S) sur ' + total + '.</span>';
    document.title = (fail === 0 ? 'OK ' : 'ECHEC ') + pass + '/' + total + ' — Tests attente';
  </script>
</body>
</html>
