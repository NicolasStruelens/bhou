<!DOCTYPE html>
<html lang="fr" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SolariScreen — Fiche devis</title>
  <link rel="icon" type="image/png" href="../assets/img/logo-solariscreen.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600;700&family=Orbitron:wght@600;800&display=swap" rel="stylesheet">
  <script src="../assets/js/theme.js"></script>
  <link rel="stylesheet" href="../assets/css/tokens.css">
  <link rel="stylesheet" href="../assets/css/theme-dark.css">
  <link rel="stylesheet" href="../assets/css/theme-light.css">
  <link rel="stylesheet" href="../assets/css/base.css">
  <style>
    .vue-layout { display: grid; grid-template-columns: minmax(0, 1fr) 380px; gap: var(--sp-5); align-items: start; }
    .vue-aside { position: sticky; top: calc(var(--header-h) + var(--sp-5)); display: flex; flex-direction: column; gap: var(--sp-4); }
    @media (max-width: 1040px) { .vue-layout { grid-template-columns: 1fr; } .vue-aside { position: static; } }

    /* ── Fiche client ── */
    .client-hero { display: flex; gap: var(--sp-4); align-items: flex-start; flex-wrap: wrap; }
    .client-hero .avatar {
      width: 64px; height: 64px; flex: none; border-radius: var(--r-round);
      display: grid; place-items: center; font-weight: 800; font-size: var(--fs-lg);
      background: color-mix(in srgb, var(--accent) 16%, transparent); color: var(--accent);
      border: 1px solid color-mix(in srgb, var(--accent) 35%, transparent);
    }
    .client-hero h2 { font-family: var(--font-display); font-size: var(--fs-xl); line-height: 1.2; }
    .client-hero .sub { font-family: var(--font-mono); font-size: var(--fs-2xs); color: var(--text-subtle); margin-top: 0.2rem; }
    .contact-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: var(--sp-3); margin-top: var(--sp-4); }
    .contact-item {
      display: flex; align-items: center; gap: var(--sp-1);
      border: 1px solid var(--border); border-radius: var(--r-sm); padding-right: var(--sp-1);
      background: var(--surface-2); transition: all var(--t-fast);
    }
    .contact-item:hover, .contact-item:focus-within { border-color: var(--accent); }
    .ci-primary { flex: 1; min-width: 0; display: flex; align-items: center; gap: var(--sp-3); padding: var(--sp-3); color: var(--text); text-decoration: none; }
    .ci-primary:hover { text-decoration: none; }
    .contact-item svg { flex: none; color: var(--accent); }
    .ci-k { font-family: var(--font-mono); font-size: 0.6rem; color: var(--text-subtle); text-transform: uppercase; letter-spacing: 0.08em; }
    .ci-v { font-size: var(--fs-sm); font-weight: 600; word-break: break-word; }
    .ci-copy { flex: none; width: 30px; height: 30px; display: grid; place-items: center; border: 1px solid transparent; border-radius: var(--r-sm); background: none; color: var(--text-subtle); cursor: pointer; transition: all var(--t-fast); }
    .ci-copy:hover { border-color: var(--accent-2); color: var(--accent-2); background: var(--surface); }

    /* ── Ouvertures ── */
    .ouv-card { border: 1px solid var(--border); border-radius: var(--r-md); background: var(--surface-2); padding: var(--sp-4); margin-bottom: var(--sp-4); position: relative; --tick-color: var(--accent); }
    .ouv-head { display: flex; align-items: center; gap: var(--sp-3); flex-wrap: wrap; margin-bottom: var(--sp-3); }
    .ouv-no { font-family: var(--font-display); font-weight: 800; color: var(--accent); }
    .ouv-title { font-weight: 700; font-size: var(--fs-md); }
    .ouv-price { margin-left: auto; font-family: var(--font-mono); font-weight: 700; color: var(--accent-2); font-size: var(--fs-md); }
    .specs { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: var(--sp-3); }
    .spec { border: 1px dashed var(--border); border-radius: var(--r-sm); padding: var(--sp-2) var(--sp-3); }
    .spec .s-k { font-family: var(--font-mono); font-size: 0.6rem; color: var(--text-subtle); text-transform: uppercase; letter-spacing: 0.08em; }
    .spec .s-v { font-family: var(--font-mono); font-size: var(--fs-sm); font-weight: 600; margin-top: 0.1rem; }
    .ouv-notes { margin-top: var(--sp-3); font-size: var(--fs-xs); color: var(--text-muted); border-left: 2px solid var(--border-strong); padding-left: var(--sp-3); }

    /* ── Photos ── */
    .photo-grid { display: flex; flex-wrap: wrap; gap: var(--sp-2); margin-top: var(--sp-3); }
    .photo-grid .ph {
      width: 104px; height: 104px; border-radius: var(--r-sm); overflow: hidden;
      border: 1px solid var(--border-strong); cursor: zoom-in; padding: 0; background: none;
      transition: all var(--t-fast); position: relative;
    }
    .photo-grid .ph img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform var(--t-base); }
    .photo-grid .ph:hover { border-color: var(--accent-2); box-shadow: var(--glow-soft); }
    .photo-grid .ph:hover img { transform: scale(1.06); }

    /* ── Lightbox ── */
    .lightbox {
      position: fixed; inset: 0; z-index: 9000; display: none;
      align-items: center; justify-content: center; flex-direction: column; gap: var(--sp-3);
      background: rgba(4, 8, 20, 0.88); backdrop-filter: blur(8px);
    }
    .lightbox.open { display: flex; animation: lb-in 0.18s ease; }
    @keyframes lb-in { from { opacity: 0; } to { opacity: 1; } }
    .lightbox img {
      max-width: 88vw; max-height: 80vh; border-radius: var(--r-md);
      border: 1px solid var(--border-strong); box-shadow: 0 20px 60px rgba(0,0,0,0.6);
    }
    .lb-cap { font-family: var(--font-mono); font-size: var(--fs-xs); color: #cfe0ff; letter-spacing: 0.03em; }
    .lb-btn {
      position: absolute; width: 44px; height: 44px; border-radius: var(--r-round);
      display: grid; place-items: center; cursor: pointer;
      background: rgba(14, 21, 48, 0.8); color: #e9eefb; border: 1px solid rgba(77,139,255,0.4);
      transition: all var(--t-fast);
    }
    .lb-btn:hover { border-color: #4d8bff; box-shadow: 0 0 14px rgba(77,139,255,0.35); }
    .lb-close { top: 18px; right: 18px; }
    .lb-prev { left: 18px; top: 50%; transform: translateY(-50%); }
    .lb-next { right: 18px; top: 50%; transform: translateY(-50%); }
    .lb-count { position: absolute; top: 24px; left: 50%; transform: translateX(-50%); font-family: var(--font-mono); font-size: var(--fs-2xs); color: #8fa8d8; letter-spacing: 0.1em; }

    /* ── Aside : montant hero ── */
    .hero-card { background: var(--surface); border: 1px solid var(--border-strong); border-radius: var(--r-md); box-shadow: var(--shadow); --tick-color: var(--accent-2); padding: var(--sp-5); }
    .hero-card .h-label { font-family: var(--font-mono); font-size: var(--fs-2xs); color: var(--text-subtle); text-transform: uppercase; letter-spacing: 0.1em; }
    .hero-card .h-ttc-row { display: flex; align-items: center; gap: var(--sp-2); }
    .hero-card .h-ttc { font-family: var(--font-mono); font-size: 2.1rem; font-weight: 800; color: var(--accent-2); line-height: 1.15; text-shadow: var(--glow-hero); }
    .hero-card .h-line { display: flex; justify-content: space-between; padding: 0.28rem 0; font-size: var(--fs-sm); }
    .hero-card .h-line .k { color: var(--text-muted); }
    .hero-card .h-line .v { font-family: var(--font-mono); }
    .h-line .v.v-copy { cursor: pointer; border-bottom: 1px dashed transparent; transition: all var(--t-fast); }
    .h-line .v.v-copy:hover { color: var(--accent-2); border-bottom-color: var(--accent-2); }
    .hero-card .h-sep { border-top: 1px dashed var(--border); margin: var(--sp-3) 0; }
    /* ── Pastille de statut cliquable (même mécanique que dashboard.html) ── */
    .status-pill {
      display: inline-flex; align-items: center; gap: 0.45rem;
      font-family: var(--font-mono); font-size: var(--fs-2xs); font-weight: 600;
      letter-spacing: 0.03em; text-transform: uppercase;
      padding: 0.32rem 0.6rem; border-radius: var(--r-sm); cursor: pointer; transition: all var(--t-fast);
      border: 1px solid color-mix(in srgb, var(--st, var(--border-strong)) 45%, transparent);
      color: var(--st, var(--text-muted));
      background: color-mix(in srgb, var(--st, var(--border-strong)) 10%, transparent);
      white-space: nowrap;
    }
    .status-pill .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--st, var(--text-muted)); box-shadow: 0 0 6px color-mix(in srgb, var(--st, transparent) 60%, transparent); }
    .status-pill svg { opacity: 0.55; }
    .status-pill:hover { box-shadow: var(--glow-soft); }
    .status-menu {
      position: fixed; z-index: 5000; display: none; min-width: 175px; padding: 4px;
      background: var(--surface); border: 1px solid var(--border-strong); border-radius: var(--r-md); box-shadow: var(--shadow);
    }
    .status-menu.open { display: block; }
    .status-menu button {
      display: flex; align-items: center; gap: 0.55rem; width: 100%; text-align: left;
      background: none; border: none; border-radius: var(--r-sm); padding: 0.45rem 0.6rem;
      font-family: var(--font-mono); font-size: var(--fs-2xs); font-weight: 600; text-transform: uppercase; letter-spacing: 0.03em;
      color: var(--text-muted); cursor: pointer;
    }
    .status-menu button:hover { background: var(--surface-2); color: var(--text); }
    .status-menu .dot { width: 7px; height: 7px; border-radius: 50%; flex: none; }
    .hist-btn { border-color: var(--border-strong); }
    .hist-menu { padding: var(--sp-2) var(--sp-3); max-width: 260px; }
    .hist-row { display: flex; align-items: flex-start; gap: 0.55rem; padding: 0.4rem 0; border-bottom: 1px dashed var(--border); }
    .hist-row:last-child { border-bottom: none; }
    .hist-row .dot { width: 7px; height: 7px; border-radius: 50%; flex: none; margin-top: 0.35rem; }
    .hist-label { font-family: var(--font-mono); font-size: var(--fs-2xs); font-weight: 700; text-transform: uppercase; letter-spacing: 0.03em; color: var(--text); }
    .hist-date { font-family: var(--font-mono); font-size: 0.65rem; color: var(--text-subtle); margin-top: 0.1rem; }
    .hist-empty { font-size: var(--fs-xs); color: var(--text-muted); padding: var(--sp-2) 0; }

    .action-col { display: flex; flex-direction: column; gap: var(--sp-2); }
    .action-col .btn { justify-content: flex-start; padding: 0.75rem 1rem; }
    .action-col .btn.is-gold { border-color: var(--accent-2); color: var(--accent-2); background: color-mix(in srgb, var(--accent-2) 10%, transparent); font-weight: 700; }
    .action-col .btn.is-gold:hover { background: color-mix(in srgb, var(--accent-2) 18%, transparent); box-shadow: var(--glow-soft); color: var(--accent-2); }

    .interne-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-md); --tick-color: var(--accent-3); padding: var(--sp-4) var(--sp-5); }
    .interne-card .h-line { display: flex; justify-content: space-between; padding: 0.25rem 0; font-size: var(--fs-xs); }
    .interne-card .h-line .k { color: var(--text-muted); }
    .interne-card .h-line .v { font-family: var(--font-mono); }
    .pricing-note { display: flex; gap: var(--sp-2); align-items: flex-start; background: color-mix(in srgb, var(--accent-2) 8%, transparent); border-left: 3px solid var(--accent-2); border-radius: var(--r-sm); padding: var(--sp-3); margin-bottom: var(--sp-3); font-size: var(--fs-sm); }
    .pricing-note svg { flex: none; color: var(--accent-2); margin-top: 2px; }
    .pricing-note .txt { white-space: pre-wrap; word-break: break-word; }

    /* ── Suivi commande fournisseur ── */
    .commande-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-md); --tick-color: var(--accent); padding: var(--sp-4) var(--sp-5); }
    .cc-head { display: flex; align-items: center; gap: var(--sp-2); font-family: var(--font-display); font-size: var(--fs-xs); text-transform: uppercase; letter-spacing: 0.05em; color: var(--accent); margin-bottom: var(--sp-3); }
    .cc-steps { display: flex; gap: 0.3rem; flex-wrap: wrap; }
    .cc-step { flex: 1; min-width: 62px; text-align: center; padding: 0.5rem 0.25rem; border-radius: var(--r-sm); border: 1px solid var(--border); background: var(--surface-2); font-family: var(--font-mono); font-size: var(--fs-2xs); text-transform: uppercase; letter-spacing: 0.01em; color: var(--text-subtle); cursor: pointer; transition: all var(--t-fast); word-break: break-word; overflow-wrap: break-word; hyphens: auto; line-height: 1.25; }
    .cc-step:hover { border-color: var(--accent); color: var(--accent); }
    .cc-step.done { background: color-mix(in srgb, var(--ok) 14%, transparent); border-color: color-mix(in srgb, var(--ok) 40%, transparent); color: var(--ok); }
    .cc-step.active { background: color-mix(in srgb, var(--accent) 16%, transparent); border-color: var(--accent); color: var(--accent); font-weight: 700; }
    .cc-eta { margin-top: var(--sp-3); font-size: var(--fs-xs); color: var(--text-muted); }

    /* ── Notes internes ── */
    .notes-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-md); --tick-color: var(--accent-2); }
    .notes-card .n-head { padding: var(--sp-3) var(--sp-4); border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: var(--sp-2); font-family: var(--font-display); font-size: var(--fs-xs); text-transform: uppercase; letter-spacing: 0.05em; color: var(--accent); }
    .notes-card .n-body { padding: var(--sp-3) var(--sp-4); max-height: 300px; overflow-y: auto; }
    .notes-card .n-foot { padding: var(--sp-3) var(--sp-4); border-top: 1px solid var(--border); display: flex; flex-direction: column; gap: var(--sp-2); }
    .note-row { display: flex; gap: var(--sp-2); padding: var(--sp-2) 0; border-bottom: 1px dashed var(--border); }
    .note-row:last-child { border-bottom: none; }
    .note-row .na { width: 26px; height: 26px; flex: none; border-radius: var(--r-round); display: grid; place-items: center; font-weight: 700; font-size: 0.6rem; }
    .note-row .na.nicolas { background: color-mix(in srgb, var(--accent) 18%, transparent); color: var(--accent); }
    .note-row .na.yannick { background: color-mix(in srgb, var(--accent-2) 18%, transparent); color: var(--accent-2); }
    .note-row .nt { font-size: var(--fs-xs); color: var(--text); white-space: pre-wrap; word-break: break-word; }
    .note-row .nm { font-family: var(--font-mono); font-size: 0.6rem; color: var(--text-subtle); }
    .note-row.is-important { border-left: 2px solid var(--warn); padding-left: var(--sp-2); }
    .n-foot .send-row { display: flex; gap: var(--sp-2); }
    .n-foot select { max-width: 110px; }
  </style>
</head>
<body>
  <div class="fx-grid"></div>

  <header class="app-header">
    <div class="brand">
      <span class="brand-logo"><img src="../assets/img/logo-solariscreen.png" alt="" onerror="this.style.display='none'"></span>
      <div>
        <h1><a href="dashboard.html">SOLARISCREEN</a></h1>
        <div class="module">Fiche devis</div>
      </div>
    </div>
    <div class="header-actions">
      <span class="badge badge-gold" id="devisIdBadge">—</span>
      <button class="status-pill" id="statusBadge" type="button" onclick="toggleStatusMenu(event)" aria-label="Changer le statut du devis" title="Cliquer pour changer le statut"></button>
      <button class="ci-copy hist-btn hidden" id="historyBtn" type="button" onclick="toggleHistoryMenu(event)" aria-label="Historique des statuts" title="Historique des statuts"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg></button>
      <button class="badge badge-cyan hidden" id="informatifBadge" style="cursor:pointer;" onclick="toggleInformatif()" title="Cliquer pour repasser en devis formel (signature + CGV)">Informatif</button>
      <span id="quickNav"></span>
      <span id="themeToggle"></span>
      <a class="btn btn-ghost btn-sm" href="dashboard.html"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg> Dashboard</a>
    </div>
  </header>

  <main class="container vue-layout" id="main" style="display:none;">
    <!-- ══════ COLONNE PRINCIPALE ══════ -->
    <div>
      <section class="section">
        <div class="section-head"><span class="section-title"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg> Client</span><span class="section-code">SS // FICHE</span></div>
        <div class="section-body" id="clientHost"></div>
      </section>

      <section class="section">
        <div class="section-head">
          <span class="section-title"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="1"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="12" y1="4" x2="12" y2="20"/></svg> Ouvertures</span>
          <span class="section-sub" id="ouvCount">—</span>
        </div>
        <div class="section-body" id="ouvHost"></div>
      </section>
    </div>

    <!-- ══════ COLONNE LATÉRALE ══════ -->
    <aside class="vue-aside">
      <div class="hero-card ticked">
        <div class="h-label">Total TVAC</div>
        <div class="h-ttc-row">
          <div class="h-ttc" id="hTTC">—</div>
          <button class="ci-copy" onclick="ssCopy(document.getElementById('hTTC').textContent, 'Total TVAC')" title="Copier le montant total" aria-label="Copier le montant total"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg></button>
        </div>
        <div class="h-sep"></div>
        <div id="hLines"></div>
      </div>

      <div class="action-col">
        <a class="btn btn-primary" id="btnEdit" href="#"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17 3a2.828 2.828 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5L17 3z"/></svg> Modifier le devis</a>
        <a class="btn btn-ghost" id="btnDoc" href="#"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg> Document client / PDF</a>
        <a class="btn btn-ghost" id="btnPicking" href="#"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg> Liste de pose</a>
        <a class="btn btn-ghost" id="btnFacturer" href="#"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M9 8.5c1-1.2 2.2-1.5 3.5-1.5a4 4 0 0 1 0 8c-1.3 0-2.5-.3-3.5-1.5"/><line x1="6" y1="10" x2="12" y2="10"/><line x1="6" y1="13" x2="12" y2="13"/></svg> Facturer</a>
        <button class="btn btn-ghost hidden" id="btnPortfolio" onclick="togglePortfolio()"></button>
      </div>

      <div class="interne-card ticked">
        <div class="row" style="gap:var(--sp-2); margin-bottom:var(--sp-2);">
          <span class="badge badge-purple">Interne</span>
          <span class="section-sub" style="margin-left:auto;">jamais visible client</span>
        </div>
        <div id="pricingNoteHost"></div>
        <div id="interneHost"></div>
      </div>

      <div class="commande-card ticked hidden" id="commandeCard">
        <div class="cc-head"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg> Suivi commande fournisseur <span id="ccRetard" class="badge badge-danger hidden" style="margin-left:auto;">Retard</span></div>
        <div class="cc-steps" id="ccSteps"></div>
        <div class="grid grid-2 mt-3">
          <div class="field"><label class="label">Date de commande</label><input class="input" type="date" id="ccDate" onchange="saveCommande()"></div>
          <div class="field"><label class="label">Délai estimé (semaines)</label><input class="input input-num" type="number" min="0" id="ccDelai" onchange="saveCommande()"></div>
        </div>
        <div class="cc-eta" id="ccEta"></div>
      </div>

      <div class="notes-card ticked">
        <div class="n-head"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg> Notes internes <span id="nCount" class="section-sub" style="margin-left:auto;"></span></div>
        <div class="n-body" id="nList"></div>
        <div class="n-foot">
          <textarea class="textarea" id="nText" style="min-height:52px;" placeholder="Note rapide pour Yannick / toi-même…"></textarea>
          <div class="send-row">
            <select class="select" id="nAuthor" aria-label="Auteur de la note"><option value="nicolas">Nicolas</option><option value="yannick">Yannick</option></select>
            <select class="select" id="nType" aria-label="Type de note" style="max-width:120px;"><option value="note">Note</option><option value="question">Question</option><option value="important">Important</option></select>
            <button class="btn btn-primary btn-sm" style="margin-left:auto;" onclick="sendNote()">Ajouter</button>
          </div>
        </div>
      </div>
    </aside>
  </main>

  <div class="container" id="loading">Chargement de la fiche…</div>

  <!-- ══════ LIGHTBOX ══════ -->
  <div class="lightbox" id="lightbox" role="dialog" aria-label="Photo agrandie">
    <div class="lb-count" id="lbCount"></div>
    <button class="lb-btn lb-close" onclick="lbClose()" aria-label="Fermer">✕</button>
    <button class="lb-btn lb-prev" onclick="lbNav(-1)" aria-label="Photo précédente">‹</button>
    <img id="lbImg" src="" alt="Photo du chantier">
    <button class="lb-btn lb-next" onclick="lbNav(1)" aria-label="Photo suivante">›</button>
    <div class="lb-cap" id="lbCap"></div>
  </div>

  <script src="../assets/js/ui.js"></script>
  <script src="../assets/js/nav.js"></script>
  <script src="../assets/js/calc.js"></script>
  <script src="../assets/js/api.js"></script>
  <script>
    const SS = window.SS;
    const { computeDevis, totalSurface } = window.SSCalc;
    const { mountThemeToggle } = window.SSTheme;
    const { fmtEur, fmtDate, el, setText, toast, qp, icon } = window.SSUI;
    mountThemeToggle(document.getElementById('themeToggle'));
    window.SSNav.mount(document.getElementById('quickNav'));

    const STATUSES = {
      brouillon: { label: 'Brouillon', color: 'var(--text-subtle)' },
      envoye_client: { label: 'Envoyé', color: 'var(--accent)' },
      relance_1: { label: 'Relance 1', color: 'var(--warn)' },
      relance_2: { label: 'Relance 2', color: 'var(--warn)' },
      signe: { label: 'Signé', color: 'var(--ok)' },
      termine: { label: 'Terminé', color: 'var(--accent-2)' },
      refuse: { label: 'Refusé', color: 'var(--danger)' },
      annule: { label: 'Annulé', color: 'var(--text-subtle)' },
    };
    const TYPE_LABEL = { screen: 'Screen', volet_roulant: 'Volet', tente_solaire: 'Tente solaire', tablier_volet: 'Tablier volet', pergola: 'Pergola', store_banne: 'Store banne' };
    const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

    let DEVIS = null, CALC = null, PHOTOS = [];

    function getCalc(d) {
      if (d.calculs && d.calculs.total_ttc != null && d.calculs.nicolas_net != null) return d.calculs;
      const p = d.pricing_v2 || {};
      return computeDevis({
        items: d.items || [],
        sellers: (p.material && p.material.sellers) || {},
        installation: Object.assign({}, (p.installation && p.installation.per_opening) || {}, {
          install_qty: p.installation && p.installation.install_qty,
          tech1_qty: p.installation && p.installation.tech1_qty,
          tech2_qty: p.installation && p.installation.tech2_qty,
          tools_qty: p.installation && p.installation.tools_qty,
        }),
        extras: p.extras || [], tva_pct: p.tva_pct, acompte_pct: p.acompte_pct, surplus_difficulte: p.surplus_difficulte,
      });
    }

    function contactItem(iconSvg, k, v, href) {
      if (!v) return '';
      const inner = `${iconSvg}<div><div class="ci-k">${k}</div><div class="ci-v">${esc(v)}</div></div>`;
      const primary = href ? `<a class="ci-primary" href="${href}">${inner}</a>` : `<div class="ci-primary">${inner}</div>`;
      const copyBtn = `<button class="ci-copy" onclick="ssCopy(${SSUI.jsAttr(v)}, ${SSUI.jsAttr(k)})" title="Copier ${esc(k).toLowerCase()}" aria-label="Copier ${esc(k).toLowerCase()}">${icon('copy', 13)}</button>`;
      return `<div class="contact-item">${primary}${copyBtn}</div>`;
    }
    function copyableSpan(label, value) {
      return `<span class="v v-copy" onclick="ssCopy(${SSUI.jsAttr(value)}, ${SSUI.jsAttr(label)})" title="Copier">${esc(value)}</span>`;
    }

    function render() {
      const d = DEVIS, c = CALC;
      const cl = d.client || {}, adr = cl.adresse || {};
      const st = STATUSES[d.statut] || STATUSES.brouillon;

      setText('devisIdBadge', '#' + d.id);
      el('statusBadge').style.setProperty('--st', st.color);
      el('statusBadge').innerHTML = `<span class="dot"></span>${st.label} ${icon('chevrondown', 10)}`;
      el('historyBtn').classList.toggle('hidden', !(d.statut_history || []).length);
      el('informatifBadge').classList.toggle('hidden', !d.informatif);
      el('btnEdit').href = 'simulateur.html?id=' + d.id;
      el('btnDoc').href = 'devis.html?id=' + d.id;
      el('btnPicking').href = 'picking.html?id=' + d.id;
      el('btnFacturer').href = 'factures.html?devis=' + d.id + '&type=acompte';
      const btnPf = el('btnPortfolio');
      btnPf.classList.toggle('hidden', d.statut !== 'termine');
      btnPf.classList.toggle('is-gold', !!d.portfolio);
      btnPf.innerHTML = d.portfolio
        ? `${icon('check', 15)} Dans le portfolio`
        : `${icon('star', 15)} Ajouter au portfolio`;

      // ── Client ──
      const initials = (((cl.prenom || '')[0] || '') + ((cl.nom || '')[0] || '')).toUpperCase() || '?';
      const adresseTxt = [((adr.rue || '') + ' ' + (adr.numero || '')).trim(), ((adr.code_postal || '') + ' ' + (adr.ville || '')).trim()].filter(Boolean).join(', ');
      const mapsUrl = adresseTxt ? 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(adresseTxt) : null;
      el('clientHost').innerHTML = `
        <div class="client-hero">
          <div class="avatar">${esc(initials)}</div>
          <div>
            <h2>${esc(cl.prenom)} ${esc(cl.nom) || '—'}</h2>
            <div class="sub">Devis créé le ${fmtDate(d.date_creation)} · modifié le ${fmtDate(d.date_modification)}</div>
          </div>
        </div>
        <div class="contact-grid">
          ${contactItem(icon('message', 18), 'Téléphone', cl.telephone, cl.telephone ? 'tel:' + String(cl.telephone).replace(/\s+/g, '') : null)}
          ${contactItem(icon('filetext', 18), 'Email', cl.email, cl.email ? 'mailto:' + cl.email : null)}
          ${contactItem(icon('grid', 18), 'Adresse', adresseTxt, mapsUrl)}
        </div>`;

      // ── Ouvertures ──
      PHOTOS = [];
      const items = d.items || [];
      const surf = totalSurface(items);
      setText('ouvCount', `${items.reduce((s, i) => s + (i.quantite || 1), 0)} ouverture(s) · ${surf.toFixed(2)} m²`);
      el('ouvHost').innerHTML = items.length ? items.map((it, i) => {
        const s = (it.largeur > 0 && it.hauteur > 0) ? ((it.largeur / 1000) * (it.hauteur / 1000)).toFixed(2) : null;
        const photos = (it.photos || []).map((p, pi) => {
          const idx = PHOTOS.length;
          PHOTOS.push({ src: p, cap: `Ouverture #${i + 1}${it.emplacement ? ' — ' + it.emplacement : ''} · photo ${pi + 1}` });
          return `<button class="ph" onclick="lbOpen(${idx})" aria-label="Agrandir la photo ${pi + 1} de l'ouverture ${i + 1}"><img src="${p}" alt=""></button>`;
        }).join('');
        return `
        <div class="ouv-card ticked">
          <div class="ouv-head">
            <span class="ouv-no">#${i + 1}</span>
            <span class="ouv-title">${esc(TYPE_LABEL[it.type] || it.type)}${it.modele ? ' — ' + esc(it.modele) : ''}${it.variante ? ' (' + esc(it.variante) + ')' : ''}</span>
            ${(it.moteur || it.moteur_ref) ? `<span class="badge badge-accent">${esc(it.moteur || it.moteur_ref)}</span>` : ''}
            <span class="ouv-price">${fmtEur((it.prix_catalogue_ht || 0) * (it.quantite || 1))}</span>
          </div>
          <div class="specs">
            <div class="spec"><div class="s-k">Largeur</div><div class="s-v">${it.largeur ? it.largeur + ' mm' : '—'}</div></div>
            <div class="spec"><div class="s-k">Hauteur</div><div class="s-v">${it.hauteur ? it.hauteur + ' mm' : '—'}</div></div>
            <div class="spec"><div class="s-k">Surface</div><div class="s-v">${s ? s + ' m²' : '—'}</div></div>
            <div class="spec"><div class="s-k">Quantité</div><div class="s-v">× ${it.quantite || 1}</div></div>
            <div class="spec"><div class="s-k">Prix unit. HTVA</div><div class="s-v">${fmtEur(it.prix_catalogue_ht || 0)}</div></div>
            ${it.emplacement ? `<div class="spec"><div class="s-k">Emplacement</div><div class="s-v">${esc(it.emplacement)}</div></div>` : ''}
            ${it.etage ? `<div class="spec"><div class="s-k">Étage</div><div class="s-v">${esc(it.etage)}</div></div>` : ''}
            ${it.couleur ? `<div class="spec"><div class="s-k">Couleur${it.couleur_lame ? ' caisson' : ''}</div><div class="s-v">${esc(it.couleur)}</div></div>` : ''}
            ${it.couleur_lame ? `<div class="spec"><div class="s-k">Couleur lame finale</div><div class="s-v">${esc(it.couleur_lame)}</div></div>` : ''}
            ${it.toile ? `<div class="spec"><div class="s-k">Toile</div><div class="s-v">${esc(it.toile)}</div></div>` : ''}
            ${it.collection ? `<div class="spec"><div class="s-k">Collection toile</div><div class="s-v">${esc(it.collection)}</div></div>` : ''}
            ${it.toile_num ? `<div class="spec"><div class="s-k">N° de toile</div><div class="s-v">${esc(it.toile_num)}</div></div>` : ''}
            ${it.toile_couleur ? `<div class="spec"><div class="s-k">Couleur toile</div><div class="s-v">${esc(it.toile_couleur)}</div></div>` : ''}
            ${it.combinaison ? `<div class="spec"><div class="s-k">Combinaison</div><div class="s-v">${esc(it.combinaison)}</div></div>` : ''}
            ${it.lateralite ? `<div class="spec"><div class="s-k">Latéralité</div><div class="s-v">${esc(it.lateralite)}</div></div>` : ''}
            ${(it.caisson_forme || it.caisson_mesure) ? `<div class="spec"><div class="s-k">Caisson</div><div class="s-v">${esc(it.caisson_forme || '')} ${esc(it.caisson_mesure || '')}</div></div>` : ''}
            ${it.colmatage ? `<div class="spec"><div class="s-k">Colmatage</div><div class="s-v">${esc(it.colmatage)}</div></div>` : ''}
            ${it.emetteur ? `<div class="spec"><div class="s-k">Émetteur</div><div class="s-v">Inclus</div></div>` : ''}
            ${it.panneau_solaire_separe ? `<div class="spec"><div class="s-k">Panneau solaire</div><div class="s-v">Fourni séparément</div></div>` : ''}
            ${it.allongement_caisson ? `<div class="spec"><div class="s-k">Allongement</div><div class="s-v">Caisson allongé</div></div>` : ''}
            ${it.projection ? `<div class="spec"><div class="s-k">Projection</div><div class="s-v">${it.projection} mm</div></div>` : ''}
            ${it.eclairage_led ? `<div class="spec"><div class="s-k">Éclairage LED</div><div class="s-v">${esc(it.eclairage_led)}</div></div>` : ''}
            ${it.couple ? `<div class="spec"><div class="s-k">Couplage</div><div class="s-v">Jusqu'à 12 m</div></div>` : ''}
            ${it.lambrequin_fixe ? `<div class="spec"><div class="s-k">Lambrequin</div><div class="s-v">Fixe</div></div>` : ''}
            ${it.lambrequin_vario ? `<div class="spec"><div class="s-k">Lambrequin</div><div class="s-v">Vario (moteur io)</div></div>` : ''}
            ${it.detecteur ? `<div class="spec"><div class="s-k">Détecteur</div><div class="s-v">Soleil/vent/pluie</div></div>` : ''}
            ${it.spots_storelight ? `<div class="spec"><div class="s-k">Spots</div><div class="s-v">LED Storelight</div></div>` : ''}
            ${it.chauffage_storelight ? `<div class="spec"><div class="s-k">Chauffage</div><div class="s-v">Storelight</div></div>` : ''}
            ${it.borstels ? `<div class="spec"><div class="s-k">Étanchéité</div><div class="s-v">Brosses</div></div>` : ''}
          </div>
          ${it.notes ? `<div class="ouv-notes">${esc(it.notes)}</div>` : ''}
          ${photos ? `<div class="photo-grid">${photos}</div>` : ''}
        </div>`;
      }).join('') : '<div class="text-muted">Aucune ouverture.</div>';

      // ── Montants ──
      setText('hTTC', fmtEur(c.total_ttc));
      const surplus = (d.pricing_v2 && d.pricing_v2.surplus_difficulte) || 0;
      el('hLines').innerHTML = `
        <div class="h-line"><span class="k">Catalogue HTVA</span>${copyableSpan('Catalogue HTVA', fmtEur(c.total_catalog_ht))}</div>
        <div class="h-line"><span class="k">Installation</span>${copyableSpan('Installation', fmtEur(c.total_installation_ht))}</div>
        <div class="h-line"><span class="k">Suppléments</span>${copyableSpan('Suppléments', fmtEur(c.total_extras_ht))}</div>
        ${surplus > 0 ? `<div class="h-line"><span class="k">Difficulté</span>${copyableSpan('Difficulté', fmtEur(surplus))}</div>` : ''}
        ${c.total_remises > 0 ? `<div class="h-line" style="color:var(--ok);"><span class="k">Réduction commerciale</span>${copyableSpan('Réduction commerciale', '− ' + fmtEur(c.total_remises))}</div>` : ''}
        <div class="h-line"><span class="k">Total HTVA</span>${copyableSpan('Total HTVA', fmtEur(c.total_ht))}</div>
        <div class="h-line"><span class="k">TVA ${c.tva_pct} %</span>${copyableSpan('TVA', fmtEur(c.total_tva))}</div>
        <div class="h-sep"></div>
        <div class="h-line"><span class="k">Acompte ${c.acompte_pct} %</span><span class="v v-copy" style="color:var(--accent-2);font-weight:700;" onclick="ssCopy(${SSUI.jsAttr(fmtEur(c.acompte_montant))}, ${SSUI.jsAttr('Acompte')})" title="Copier">${fmtEur(c.acompte_montant)}</span></div>`;

      // ── Note interne (saisie dans le simulateur, visible ici en lecture) ──
      const pricingNote = (d.pricing_v2 && d.pricing_v2.note || '').trim();
      el('pricingNoteHost').innerHTML = pricingNote
        ? `<div class="pricing-note">${icon('info', 15)}<div class="txt">${esc(pricingNote)}</div></div>`
        : '';

      // ── Interne ──
      el('interneHost').innerHTML = `
        <div class="h-line"><span class="k">Achat fournisseur estimé</span><span class="v">${fmtEur(c.supplier_estimate || 0)}</span></div>
        <div class="h-line"><span class="k">Marge matériel brute</span><span class="v">${fmtEur(c.total_material_gross || (c.total_catalog_ht || 0) * 0.23)}</span></div>
        <div class="h-line"><span class="k">Nicolas — brut / net</span><span class="v">${fmtEur(c.nicolas_gross || 0)} / <strong style="color:var(--accent-2)">${fmtEur(c.nicolas_net || 0)}</strong></span></div>
        <div class="h-line"><span class="k">Yannick — brut / net</span><span class="v">${fmtEur(c.yannick_gross || 0)} / <strong style="color:var(--accent-2)">${fmtEur(c.yannick_net || 0)}</strong></span></div>
        ${c.total_remises > 0 ? `
        <div class="subhead" style="margin:var(--sp-3) 0 var(--sp-2);border-top:1px dashed var(--border);padding-top:var(--sp-3);">Réductions accordées</div>
        ${c.remise_catalogue?.amount > 0 ? `<div class="h-line"><span class="k">Catalogue</span><span class="v" style="color:var(--ok);">− ${fmtEur(c.remise_catalogue.amount)}</span></div>` : ''}
        ${c.remise_installation?.amount > 0 ? `<div class="h-line"><span class="k">Installation</span><span class="v" style="color:var(--ok);">− ${fmtEur(c.remise_installation.amount)}</span></div>` : ''}
        ${c.remise_outillage?.amount > 0 ? `<div class="h-line"><span class="k">Outillage</span><span class="v" style="color:var(--ok);">− ${fmtEur(c.remise_outillage.amount)}</span></div>` : ''}` : ''}`;

      renderNotes();
      renderCommande();
    }

    // ── Suivi commande fournisseur (uniquement une fois le devis signé) ──
    const CC_STAGES = [
      { k: 'a_commander', l: 'À commander' },
      { k: 'commande', l: 'Commandé' },
      { k: 'fabrication', l: 'Fabrication' },
      { k: 'recu', l: 'Reçu' },
      { k: 'pose', l: 'Posé' },
    ];
    function renderCommande() {
      const card = el('commandeCard');
      const show = ['signe', 'termine'].includes(DEVIS.statut);
      card.classList.toggle('hidden', !show);
      if (!show) return;
      const cc = DEVIS.commande || {};
      const idx = Math.max(0, CC_STAGES.findIndex(s => s.k === (cc.statut || 'a_commander')));
      el('ccSteps').innerHTML = CC_STAGES.map((s, i) => `<div class="cc-step ${i < idx ? 'done' : ''} ${i === idx ? 'active' : ''}" onclick="setCommandeStage('${s.k}')">${s.l}</div>`).join('');
      el('ccDate').value = cc.date_commande || '';
      el('ccDelai').value = cc.delai_semaines ?? 8;
      let etaTxt = 'Renseigne la date de commande pour estimer la livraison.', retard = false;
      if (cc.date_commande) {
        const eta = new Date(cc.date_commande);
        eta.setDate(eta.getDate() + (cc.delai_semaines || 0) * 7);
        if (!isNaN(eta)) {
          etaTxt = 'Livraison estimée : ' + fmtDate(eta.toISOString());
          if (eta < new Date() && !['recu', 'pose'].includes(cc.statut)) retard = true;
        }
      }
      el('ccEta').textContent = etaTxt;
      el('ccRetard').classList.toggle('hidden', !retard);
    }
    async function persistCommande() {
      DEVIS.date_modification = new Date().toISOString();
      const res = await SS.saveDevis(DEVIS);
      toast(res.offline ? 'Enregistré hors-ligne' : 'Suivi mis à jour ✓', res.offline ? 'warn' : 'ok');
      renderCommande();
    }
    window.setCommandeStage = async (stage) => {
      DEVIS.commande = DEVIS.commande || {};
      DEVIS.commande.statut = stage;
      if (stage === 'commande' && !DEVIS.commande.date_commande) DEVIS.commande.date_commande = new Date().toISOString().slice(0, 10);
      await persistCommande();
    };
    window.saveCommande = async () => {
      DEVIS.commande = DEVIS.commande || {};
      DEVIS.commande.date_commande = el('ccDate').value;
      DEVIS.commande.delai_semaines = parseInt(el('ccDelai').value) || 0;
      await persistCommande();
    };

    // ── Notes internes ──
    function renderNotes() {
      const comments = (DEVIS.comments || []).slice().sort((a, b) => String(a.date).localeCompare(String(b.date)));
      setText('nCount', comments.length ? comments.length + ' note(s)' : '');
      el('nList').innerHTML = comments.length ? comments.map(c => {
        const a = (c.author || 'nicolas').toLowerCase();
        return `<div class="note-row ${c.type === 'important' ? 'is-important' : ''}">
          <div class="na ${a === 'yannick' ? 'yannick' : 'nicolas'}">${a === 'yannick' ? 'YA' : 'NI'}</div>
          <div style="min-width:0;flex:1;">
            <div class="nm">${a} · ${fmtDate(c.date)}${c.type !== 'note' ? ' · ' + c.type : ''}</div>
            <div class="nt">${esc(c.text)}</div>
          </div>
        </div>`;
      }).join('') : '<div class="text-muted" style="font-size:var(--fs-xs);">Aucune note. Écris la première ci-dessous.</div>';
      window.SSNav.getIdentity().then((identity) => {
        if (identity.key) { el('nAuthor').value = identity.key; return; }
        const lastAuthor = localStorage.getItem('ss_comment_author');
        if (lastAuthor) el('nAuthor').value = lastAuthor;
      });
    }
    // ── Menu de statut (même mécanique que dashboard.html) ──
    let stMenuEl = null;
    function ensureStatusMenu() {
      if (stMenuEl) return;
      stMenuEl = document.createElement('div');
      stMenuEl.className = 'status-menu';
      document.body.appendChild(stMenuEl);
      document.addEventListener('click', (e) => {
        if (stMenuEl.classList.contains('open') && !stMenuEl.contains(e.target) && !e.target.closest('#statusBadge')) stMenuEl.classList.remove('open');
      }, true);
      window.addEventListener('scroll', () => stMenuEl.classList.remove('open'), true);
      document.addEventListener('keydown', (e) => { if (e.key === 'Escape') stMenuEl.classList.remove('open'); });
    }
    window.toggleStatusMenu = (e) => {
      e.stopPropagation();
      ensureStatusMenu();
      stMenuEl.innerHTML = Object.entries(STATUSES).map(([k, v]) =>
        `<button onclick="pickStatus('${k}')"><span class="dot" style="background:${v.color}"></span>${v.label}</button>`).join('');
      const r = e.currentTarget.getBoundingClientRect();
      stMenuEl.style.left = Math.max(8, Math.min(r.left, window.innerWidth - 195)) + 'px';
      stMenuEl.style.top = Math.min(r.bottom + 6, window.innerHeight - 320) + 'px';
      stMenuEl.classList.add('open');
    };
    window.pickStatus = async (statut) => {
      if (stMenuEl) stMenuEl.classList.remove('open');
      if (DEVIS.statut === statut) return;
      const identity = await window.SSNav.getIdentity();
      const res = await SS.updateStatus(DEVIS.id, statut, identity.key);
      if (res.ok === false) { toast(res.error || 'Erreur', 'error'); return; }
      DEVIS = await SS.getDevis(DEVIS.id);
      CALC = getCalc(DEVIS);
      toast(res.offline ? 'Statut mis à jour (hors-ligne)' : 'Statut mis à jour ✓', res.offline ? 'warn' : 'ok');
      render();
    };

    // ── Historique des statuts (mini-timeline en popover) ──
    let histMenuEl = null;
    function ensureHistMenu() {
      if (histMenuEl) return;
      histMenuEl = document.createElement('div');
      histMenuEl.className = 'status-menu hist-menu';
      document.body.appendChild(histMenuEl);
      document.addEventListener('click', (e) => {
        if (histMenuEl.classList.contains('open') && !histMenuEl.contains(e.target) && !e.target.closest('#historyBtn')) histMenuEl.classList.remove('open');
      }, true);
      window.addEventListener('scroll', () => histMenuEl.classList.remove('open'), true);
      document.addEventListener('keydown', (e) => { if (e.key === 'Escape') histMenuEl.classList.remove('open'); });
    }
    window.toggleHistoryMenu = (e) => {
      e.stopPropagation();
      ensureHistMenu();
      const hist = (DEVIS.statut_history || []).slice().sort((a, b) => String(a.date).localeCompare(String(b.date)));
      histMenuEl.innerHTML = hist.length
        ? hist.map(h => {
            const s = STATUSES[h.statut] || STATUSES.brouillon;
            const who = h.by === 'nicolas' ? 'Nicolas' : h.by === 'yannick' ? 'Yannick' : null;
            return `<div class="hist-row"><span class="dot" style="background:${s.color}"></span><div><div class="hist-label">${s.label}</div><div class="hist-date">${fmtDate(h.date)}${who ? ' · ' + who : ''}</div></div></div>`;
          }).join('')
        : `<div class="hist-empty">Aucun historique avant ce changement.</div>`;
      const r = e.currentTarget.getBoundingClientRect();
      histMenuEl.style.left = Math.max(8, Math.min(r.left, window.innerWidth - 235)) + 'px';
      histMenuEl.style.top = Math.min(r.bottom + 6, window.innerHeight - 320) + 'px';
      histMenuEl.classList.add('open');
    };
    window.togglePortfolio = async () => {
      const willEnable = !DEVIS.portfolio;
      if (willEnable) {
        const photoCount = (DEVIS.items || []).reduce((s, it) => s + ((it.photos || []).length), 0);
        if (!photoCount && !confirm('Aucune photo sur ce devis — il apparaîtra sans image dans le portfolio. Continuer quand même ?')) return;
      }
      DEVIS.portfolio = willEnable;
      DEVIS.date_modification = new Date().toISOString();
      await SS.saveDevis(DEVIS);
      toast(willEnable ? 'Ajouté au portfolio ✓' : 'Retiré du portfolio', 'ok');
      render();
    };
    window.toggleInformatif = async () => {
      if (!confirm('Repasser ce devis en devis formel (signature + conditions de vente sur le PDF) ?')) return;
      DEVIS.informatif = false;
      DEVIS.date_modification = new Date().toISOString();
      await SS.saveDevis(DEVIS);
      toast('Devis repassé en formel ✓', 'ok');
      render();
    };
    window.sendNote = async () => {
      const text = el('nText').value.trim();
      if (!text) { toast('Écris d\'abord ta note.', 'warn'); return; }
      localStorage.setItem('ss_comment_author', el('nAuthor').value);
      const res = await SS.addComment(DEVIS.id, { author: el('nAuthor').value, text, type: el('nType').value });
      if (res.ok === false) { toast(res.error || 'Erreur', 'error'); return; }
      el('nText').value = '';
      DEVIS = await SS.getDevis(DEVIS.id);
      renderNotes();
      toast('Note ajoutée', 'ok');
    };

    // ── Lightbox ──
    let lbIdx = 0;
    window.lbOpen = (i) => { lbIdx = i; lbShow(); el('lightbox').classList.add('open'); document.body.style.overflow = 'hidden'; };
    window.lbClose = () => { el('lightbox').classList.remove('open'); document.body.style.overflow = ''; };
    window.lbNav = (dir) => { lbIdx = (lbIdx + dir + PHOTOS.length) % PHOTOS.length; lbShow(); };
    function lbShow() {
      const p = PHOTOS[lbIdx];
      el('lbImg').src = p.src;
      setText('lbCap', p.cap);
      setText('lbCount', (lbIdx + 1) + ' / ' + PHOTOS.length);
      const multi = PHOTOS.length > 1 ? '' : 'none';
      document.querySelector('.lb-prev').style.display = multi;
      document.querySelector('.lb-next').style.display = multi;
    }
    el('lightbox').addEventListener('click', (e) => { if (e.target === el('lightbox')) lbClose(); });
    document.addEventListener('keydown', (e) => {
      if (!el('lightbox').classList.contains('open')) return;
      if (e.key === 'Escape') lbClose();
      if (e.key === 'ArrowLeft') lbNav(-1);
      if (e.key === 'ArrowRight') lbNav(1);
    });

    // ── Chargement ──
    (async () => {
      const id = qp('id');
      if (!id) { el('loading').textContent = 'Aucun devis spécifié.'; return; }
      DEVIS = await SS.getDevis(id);
      if (!DEVIS) { el('loading').textContent = 'Devis introuvable (#' + id + ').'; return; }
      CALC = getCalc(DEVIS);
      el('loading').style.display = 'none';
      el('main').style.display = '';
      render();
    })();
  </script>
</body>
</html>
