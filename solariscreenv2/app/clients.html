          <div class="mini-kpis">
            <div class="mini-kpi ticked" style="--tick-color:var(--ok);"><div class="v v-copy" style="color:var(--ok)" onclick="ssCopy(${SSUI.jsAttr(fmtEur(c.bilan.signe))}, ${SSUI.jsAttr('Signé')})" title="Copier">${fmtEur(c.bilan.signe)}</div><div class="l">Signé${c.bilan.nbSignes ? ' · ' + c.bilan.nbSignes : ''}</div></div>
            <div class="mini-kpi ticked"><div class="v v-copy" onclick="ssCopy(${SSUI.jsAttr(fmtEur(c.bilan.encaisse))}, ${SSUI.jsAttr('Encaissé')})" title="Copier">${fmtEur(c.bilan.encaisse)}</div><div class="l">Encaissé</div></div>
            <div class="mini-kpi ticked" style="--tick-color:var(--warn);"><div class="v v-copy ${c.bilan.resteDu > 0.005 ? 'du' : ''}" onclick="ssCopy(${SSUI.jsAttr(fmtEur(c.bilan.resteDu))}, ${SSUI.jsAttr('Reste dû')})" title="Copier — notes de crédit déduites">${fmtEur(c.bilan.resteDu)}</div><div class="l">Reste dû</div></div>
            <div class="mini-kpi ticked" style="--tick-color:var(--accent-2);"><div class="v v-copy" style="color:var(--accent-2)" onclick="ssCopy(${SSUI.jsAttr(fmtEur(c.bilan.enCours))}, ${SSUI.jsAttr('En cours')})" title="Copier">${fmtEur(c.bilan.enCours)}</div><div class="l">Chez lui${c.bilan.nbEnCours ? ' · ' + c.bilan.nbEnCours : ''}</div></div>
          </div>

          <div class="subhead" style="border:none;margin-top:0;padding-top:0;">Coordonnées</div>
          <div class="grid grid-2">
            <div class="field"><label class="label" for="f_prenom">Prénom</label><input class="input" id="f_prenom" value="${esc(ct.prenom)}"></div>
            <div class="field"><label class="label" for="f_nom">Nom</label><input class="input" id="f_nom" value="${esc(ct.nom)}"></div>
            <div class="field"><label class="label" for="f_civilite">Civilité</label>
              <select class="select" id="f_civilite">
                ${['', 'Monsieur', 'Madame'].map(v => `<option value="${v}" ${(ct.civilite || guessCivilite(ct.prenom)) === v ? 'selected' : ''}>${v || 'Non précisé'}</option>`).join('')}
              </select>
              <div class="section-sub" style="margin-top:0.2rem;">${!ct.civilite && guessCivilite(ct.prenom) ? '💡 suggéré d\'après le prénom — à confirmer' : 'sert à la formule « Professionnel »'}</div>
            </div>
            <div class="field"><label class="label" for="f_ton">Formule (page client)</label>
              <select class="select" id="f_ton">
                <option value="amical" ${ct.ton === 'amical' ? 'selected' : ''}>Amical — « Bonjour Prénom »</option>
                <option value="pro" ${(ct.ton || 'pro') === 'pro' ? 'selected' : ''}>Professionnel — « Bonjour Monsieur/Madame Nom »</option>
              </select>
            </div>
            <div class="field"><label class="label" for="f_tel">Téléphone(s)</label><div class="input-copy-wrap"><input class="input" id="f_tel" placeholder="0475 12 34 56, 02 345 67 89" value="${esc(ct.telephone)}"><button type="button" class="ci-copy" onclick="ssCopy(document.getElementById('f_tel').value, 'Téléphone')" title="Copier" aria-label="Copier le téléphone">${icon('copy', 13)}</button></div></div>
            <div class="field"><label class="label" for="f_email">Email(s)</label><div class="input-copy-wrap"><input class="input" id="f_email" type="email" multiple placeholder="email@exemple.be, autre@exemple.be" value="${esc(ct.email)}"><button type="button" class="ci-copy" onclick="ssCopy(document.getElementById('f_email').value, 'Email')" title="Copier" aria-label="Copier l'email">${icon('copy', 13)}</button></div></div>
            <div class="field" style="grid-column:span 2;"><label class="label" for="f_rue">Rue & numéro</label><div class="input-copy-wrap"><input class="input" id="f_rue" value="${esc((adr.rue || '') + (adr.numero ? ' ' + adr.numero : ''))}"><button type="button" class="ci-copy" onclick="ssCopy(document.getElementById('f_rue').value, 'Adresse')" title="Copier" aria-label="Copier l'adresse">${icon('copy', 13)}</button></div></div>
            <div class="field"><label class="label" for="f_cp">Code postal</label><input class="input" id="f_cp" value="${esc(adr.code_postal)}"></div>
            <div class="field"><label class="label" for="f_ville">Ville</label><input class="input" id="f_ville" value="${esc(adr.ville)}"></div>
            <div class="field" style="grid-column:span 2;">
              <label class="label" for="f_tags">Tags (séparés par ,)</label>
              <input class="input" id="f_tags" value="${esc((ct.tags || []).join(', '))}">
              <div class="tag-presets">${TAG_PRESETS.map(t => `<button type="button" class="tag-chip ${(ct.tags || []).some(x => x.toLowerCase() === t.toLowerCase()) ? 'active' : ''}" onclick="toggleTagPreset(this,${SSUI.jsAttr(t)})">${esc(t)}</button>`).join('')}</div>
            </div>
            <div class="field"><label class="label" for="f_bien">Type de bien</label><input class="input" id="f_bien" value="${esc(ct.type_bien)}" placeholder="maison, appartement…"></div>
            <div class="field" style="grid-column:span 2;"><label class="label" for="f_notes">Notes internes</label><textarea class="textarea" id="f_notes" placeholder="Préférences, infos chantier, suivi…">${esc(ct.notes)}</textarea></div>
          </div>
          <div class="row mt-4" style="gap:var(--sp-2);">
            <button class="btn btn-primary btn-sm" onclick="saveFiche(${SSUI.jsAttr(key)})">${icon('save', 14)} Enregistrer la fiche</button>
            ${c.overlay ? `<button class="btn btn-danger btn-sm" onclick="deleteFiche(${SSUI.jsAttr(key)})">${icon('trash', 14)} Supprimer la fiche</button>` : ''}
          </div>

          <div class="subhead">Échanges e-mail (${(ct.mails || []).length})</div>
          <div id="mailHost"></div>
          <details class="ss-paste" id="mailPaste" style="margin-top:var(--sp-2);">
            ${/* ⚠️ LE MÊME FORMULAIRE SERT À ARCHIVER ET À CORRIGER, et ce n est pas de
                 l économie : un second formulaire aurait fini par diverger du premier — un champ
                 ajouté d un côté, pas de l autre — et c est la même saisie dans les deux cas.
                 Seuls le titre et le bouton changent, pilotés par `MAIL_EDITE`. */ ''}
            <summary style="cursor:pointer;font-family:var(--font-mono);font-size:var(--fs-2xs);text-transform:uppercase;letter-spacing:.06em;color:var(--accent);">
              <span id="mailFormTitre">${icon('plus', 12)} Archiver un échange</span>
            </summary>
            <div style="margin-top:var(--sp-3);">
              <p class="ss-paste-hint">Colle le mail tel quel, en-têtes compris. L'expéditeur, l'objet, la date
                et le sens de l'échange sont reconnus tout seuls — tu peux corriger avant d'archiver.</p>
              <textarea class="textarea" id="mailTexte" placeholder="De : jean.dupont@exemple.be&#10;Envoyé : mardi 29 juillet 2026 14:32&#10;Objet : Re: Devis screens&#10;&#10;Bonjour Nicolas, …"
                oninput="lireMail()"></textarea>
              <div class="ss-paste-lu" id="mailLu"></div>
              <div class="ss-paste-row">
                <select class="select" id="mailSens" style="flex:0 0 auto;">
                  <option value="recu">Reçu du client</option>
                  <option value="envoye">Envoyé au client</option>
                </select>
                <input class="input" id="mailObjet" placeholder="Objet" style="flex:1 1 160px;">
                <select class="select" id="mailDevis" style="flex:0 1 auto;" title="Rattacher cet échange à un devis précis (facultatif)">
                  <option value="">Sans devis précis</option>
                  ${c.devis.map(d => `<option value="${esc(d.id)}">devis #${esc(d.id)}</option>`).join('')}
                </select>
                <button class="btn btn-primary btn-sm" id="mailBtnOk" style="margin-left:auto;" onclick="validerMail(${SSUI.jsAttr(key)})">${icon('save', 14)} Archiver</button>
                <button class="btn btn-ghost btn-sm" id="mailBtnAnnuler" hidden onclick="annulerModifMail()">Annuler</button>
              </div>
              ${/* ⚠️ LA PIÈCE JOINTE N APPARAÎT QU EN CORRECTION, et c est structurel : la route
                   est CIBLÉE sur un mail, donc elle a besoin d un identifiant — qui n existe pas
                   tant que le mail n est pas archivé. Plutôt qu une file d attente en mémoire
                   comme pour les photos d un sujet (règle 25), on archive d abord, on joint
                   ensuite : un mail se colle en deux secondes, la pièce suit. */ ''}
              <div class="ss-paste-row" id="mailPjRow" hidden style="margin-top:var(--sp-2);">
                <label class="btn btn-ghost btn-sm" style="cursor:pointer;">
                  ${icon('upload', 14)} Joindre une image ou un PDF
                  <input type="file" accept="image/*,application/pdf" hidden
                         onchange="joindrePiece(${SSUI.jsAttr(key)}, this)">
                </label>
                <span class="ss-paste-hint" style="margin:0;">15 Mo maximum · image ou PDF uniquement.</span>
              </div>
            </div>
          </details>

          <div class="subhead">Historique des devis (${c.devis.length})</div>
          ${c.devis.length ? c.devis.map(d => {
            const act = d.n ? ACT.prochaineAction(d.n) : null;
            const ch = d.chantier;
            let chantierBadge = '';
            if (ch && ch.date_pose) {
              const days = Math.round((new Date(ch.date_pose) - new Date(SSUI.aujourdhui())) / 86400000);
              chantierBadge = days < 0 && d.statut !== 'termine'
                ? `<span title="Pose en retard">${icon('calendar', 11)} en retard</span>`
                : `<span title="Pose planifiée le ${fmtDate(ch.date_pose)}">${icon('calendar', 11)} ${fmtDate(ch.date_pose)}</span>`;
            }
            return `
            <div class="hist-row">
              <div>${badge(d.statut)}</div>
              <div>
                <span class="hid">#${d.id}</span><br><span class="text-muted" style="font-size:var(--fs-2xs)">${fmtDate(d.date)}</span>
                ${d.resume ? `<div class="hist-resume" title="${esc(d.resume)}">${esc(d.resume)}</div>` : ''}
                <div class="hist-meta">
                  ${d.vendeur ? `<span title="Devis établi par ${esc(d.vendeur)}">${icon('user', 11)} ${esc(d.vendeur)}</span>` : ''}
                  ${d.photos ? `<span>${icon('camera', 11)} ${d.photos}</span>` : ''}
                  ${d.comments ? `<span>${icon('message', 11)} ${d.comments}</span>` : ''}
                  ${chantierBadge}
                  ${act ? `<a class="hist-act" style="--ac:${act.color}" href="vue.html?id=${encodeURIComponent(d.id)}${act.hash || ''}" title="${esc(act.titre || act.txt)}">${esc(act.txt)}</a>` : ''}
                </div>
              </div>
              <div class="hm" onclick="ssCopy(${SSUI.jsAttr(fmtEur(d.ttc))}, ${SSUI.jsAttr('Montant TVAC')})" title="Copier le montant">${fmtEur(d.ttc)}</div>
              <div class="row" style="gap:0.3rem;">
                <button class="btn btn-ghost btn-sm" title="Fiche du devis" aria-label="Fiche du devis ${d.id}" onclick="location.href='vue.html?id=${d.id}'">${icon('window', 14)}</button>
                <button class="btn btn-ghost btn-sm" title="Document client / PDF" aria-label="Document client du devis ${d.id}" onclick="location.href='devis.html?id=${d.id}'">${icon('filetext', 14)}</button>
                <button class="btn btn-ghost btn-sm" title="Éditer le devis" aria-label="Éditer le devis ${d.id}" onclick="location.href='simulateur.html?id=${d.id}'">${icon('edit', 14)}</button>
              </div>
            </div>`;
          }).join('') : '<div class="text-muted">Aucun devis pour ce client.</div>'}

          <div class="subhead">Factures</div>
          <div id="histFactures">${renderHistFactures(c)}</div>

          <div class="subhead">Photos</div>
          <div class="hp-grid" id="histPhotos" aria-busy="true"><div class="skl" style="height:74px"></div><div class="skl" style="height:74px"></div><div class="skl" style="height:74px"></div></div>

          <div class="subhead">Notes internes des devis</div>
          <div id="histNotes" aria-busy="true"><div class="skl-row"><div class="skl" style="height:13px;width:38%"></div><div class="skl" style="height:36px"></div><div class="skl" style="height:36px;width:82%"></div></div></div>
        </div>`;
      // Saisie assistée code postal ↔ ville (à refaire à chaque rendu : les champs sont recréés).
      window.SSPostal && SSPostal.bindPair(el('f_cp'), el('f_ville'));
      /* ⚠️ La clé de la fiche OUVERTE, retenue hors du DOM : les routes des pièces jointes en
         ont besoin (elles sont ciblées sur un client ET un mail), et une correction en cours
         doit survivre au re-rendu de la fiche. Posée ICI parce que c est le seul endroit qui
         sache quelle fiche on regarde. */
      CLE_FICHE = key;
      MAIL_EDITE = null;        // on change de fiche : une correction en cours n a plus d objet
      renderMails(ct.mails || []);
      loadHistExtras(c);
    };

    // ══════════ ÉCHANGES E-MAIL ARCHIVÉS ══════════════════════════════════════════════════════
    // Les mails vivent sur la FICHE CLIENT (un seul endroit), et s'affichent aussi sur chacun de
    // ses devis : l'historique suit le client, pas le dossier.
    function renderMails(mails) {
      const host = el('mailHost');
      if (!host) return;
      host.innerHTML = window.SSUI.mailsHtml(mails, {
        clientKey: CLE_FICHE, onDelete: 'supprimerMail', onEdit: 'modifierMail',
        onDeletePiece: 'supprimerPiece', onOpenDevis: 'ouvrirDevis',
        empty: 'Aucun échange archivé. Colle ci-dessous le premier mail de ce client — Yannick le verra ici et sur ses devis.',
      });
    }
    /* ══════ CORRIGER UN ÉCHANGE, ET Y JOINDRE UNE PIÈCE ══════
       Demande de Nicolas, 10/10/2026 : « je sais pas modifier un échange ? ça serait
       intéressant. Et pouvoir ajouter une image ou un PDF. »
       ⚠️ `MAIL_EDITE` vit HORS du formulaire, et c est délibéré. Le mettre dans un attribut
       `data-` du DOM le ferait disparaître au premier re-rendu de la fiche — et on enverrait
       alors une CORRECTION comme un nouvel archivage, donc un doublon. Même famille que
       `EDITE_POUR` des Échanges (règle 15 bis). */
    let MAIL_EDITE = null;
    let CLE_FICHE = '';

    window.modifierMail = (id) => {
      const c = DIRECTORY.find(x => x.key === CLE_FICHE);
      const m = ((c && c.contact.mails) || []).find(x => String(x.id) === String(id));
      if (!m) { toast('\u00c9change introuvable \u2014 recharge la fiche.', 'warn'); return; }
      MAIL_EDITE = m.id;
      el('mailTexte').value = m.texte || '';
      el('mailObjet').value = m.objet || '';
      el('mailSens').value = m.sens === 'envoye' ? 'envoye' : 'recu';
      el('mailDevis').value = m.devis_id || '';
      /* ⚠️ On marque les champs comme TOUCHÉS : sans ça, `lireMail` les écraserait dès la
         première frappe avec ce que l analyse croit comprendre du texte — c est-à-dire avec
         exactement ce qu on est en train de corriger. */
      el('mailObjet').dataset.touche = '1';
      el('mailSens').dataset.touche = '1';
      el('mailLu').classList.remove('on');
      el('mailFormTitre').innerHTML = icon('edit', 12) + ' Corriger cet \u00e9change';
      el('mailBtnOk').innerHTML = icon('save', 14) + ' Enregistrer la correction';
      el('mailBtnAnnuler').hidden = false;
      el('mailPjRow').hidden = false;
      el('mailPaste').open = true;
      el('mailPaste').scrollIntoView({ block: 'center' });
    };

    window.annulerModifMail = () => {
      MAIL_EDITE = null;
      el('mailTexte').value = ''; el('mailObjet').value = ''; el('mailDevis').value = '';
      el('mailObjet').dataset.touche = ''; el('mailSens').dataset.touche = '';
      el('mailLu').classList.remove('on');
      el('mailFormTitre').innerHTML = icon('plus', 12) + ' Archiver un \u00e9change';
      el('mailBtnOk').innerHTML = icon('save', 14) + ' Archiver';
      el('mailBtnAnnuler').hidden = true;
      el('mailPjRow').hidden = true;
      el('mailPaste').open = false;
    };

    /** Un seul bouton pour les deux modes \u2014 c est `MAIL_EDITE` qui tranche. */
    window.validerMail = async (key) => {
      if (MAIL_EDITE) return enregistrerCorrectionMail(key);
      return archiverMail(key);
    };

    async function enregistrerCorrectionMail(key) {
      const texte = el('mailTexte').value.trim();
      if (!texte) { toast('Le message ne peut pas \u00eatre vide.', 'warn'); return; }
      const identite = await window.SSNav.getIdentity();
      const res = await SS.editClientMail(key, MAIL_EDITE, {
        texte, objet: el('mailObjet').value.trim(), sens: el('mailSens').value,
        devis_id: el('mailDevis').value, par: identite.key || 'nicolas',
      });
      if (res.ok === false) { toast(res.error || 'Correction NON enregistr\u00e9e.', 'error', 6000); return; }
      majMailLocal(key, res.mail);
      toast('\u00c9change corrig\u00e9 \u2713', 'ok');
      annulerModifMail();
    }

    /** Remplace le mail dans la copie locale, sans relire la fiche (\u00e9criture cibl\u00e9e c\u00f4t\u00e9 serveur). */
    function majMailLocal(key, mail) {
      const c = DIRECTORY.find(x => x.key === key);
      if (!c) { renderMails([mail]); return; }
      c.contact.mails = c.contact.mails || [];
      const i = c.contact.mails.findIndex(x => String(x.id) === String(mail.id));
      if (i >= 0) c.contact.mails[i] = mail; else c.contact.mails.push(mail);
      renderMails(c.contact.mails);
    }

    window.joindrePiece = async (key, input) => {
      const f = input.files && input.files[0];
      input.value = '';                       // sinon rechoisir le m\u00eame fichier ne d\u00e9clenche rien
      if (!f || !MAIL_EDITE) return;
      /* \u26a0\ufe0f On refuse AVANT d envoyer 15 Mo pour rien : le serveur le refuserait aussi, mais
         apr\u00e8s le t\u00e9l\u00e9versement complet \u2014 insupportable en 4G sur un chantier. */
      if (f.size > 15 * 1024 * 1024) { toast('Fichier trop lourd (15 Mo maximum).', 'warn', 6000); return; }
      toast('Envoi de ' + f.name + '\u2026', 'ok');
      const res = await SS.addClientMailPiece(key, MAIL_EDITE, f);
      if (res.ok === false) { toast(res.error || 'Pi\u00e8ce NON jointe.', 'error', 7000); return; }
      const c = DIRECTORY.find(x => x.key === key);
      const m = ((c && c.contact.mails) || []).find(x => String(x.id) === String(MAIL_EDITE));
      if (m) { m.pieces = res.pieces; majMailLocal(key, m); }
      toast('Pi\u00e8ce jointe \u2713', 'ok');
    };

    window.supprimerPiece = async (mid, pid) => {
      if (!confirm('Retirer cette pi\u00e8ce jointe ?')) return;
      const res = await SS.deleteClientMailPiece(CLE_FICHE, mid, pid);
      if (res.ok === false) { toast(res.error || 'Pi\u00e8ce NON supprim\u00e9e.', 'error', 6000); return; }
      const c = DIRECTORY.find(x => x.key === CLE_FICHE);
      const m = ((c && c.contact.mails) || []).find(x => String(x.id) === String(mid));
      if (m) { m.pieces = res.pieces; majMailLocal(CLE_FICHE, m); }
    };

    window.ouvrirDevis = (id) => { location.href = 'vue.html?id=' + encodeURIComponent(id); };
    /** Aperçu en direct de ce que l'outil a compris du collage — et pré-remplissage des champs. */
    window.lireMail = () => {
      const brut = el('mailTexte').value;
      const lu = window.SSUI.parseMail(brut);
      const zone = el('mailLu');
      if (!brut.trim()) { zone.classList.remove('on'); zone.innerHTML = ''; return; }
      zone.classList.add('on');
      zone.innerHTML = `${icon('check', 11)} lu : <b>${esc(lu.sens === 'envoye' ? 'envoyé au client' : 'reçu du client')}</b>`
        + (lu.de ? ` · de <b>${esc(lu.de)}</b>` : ' · expéditeur non reconnu')
        + (lu.date_mail ? ` · <b>${esc(lu.date_mail)}</b>` : '')
        + (lu.objet ? ` · objet <b>${esc(lu.objet)}</b>` : ' · sans objet détecté');
      // On ne remplit que ce que Nicolas n'a pas déjà corrigé à la main.
      const so = el('mailObjet'), ss = el('mailSens');
      if (!so.dataset.touche) so.value = lu.objet || '';
      if (!ss.dataset.touche) ss.value = lu.sens;
      so.oninput = () => { so.dataset.touche = '1'; };
      ss.onchange = () => { ss.dataset.touche = '1'; };
    };
    window.archiverMail = async (key) => {
      const brut = el('mailTexte').value.trim();
      if (!brut) { toast('Colle d\'abord le mail.', 'warn'); return; }
      const lu = window.SSUI.parseMail(brut);
      const identite = await window.SSNav.getIdentity();
      const res = await SS.addClientMail(key, {
        sens: el('mailSens').value, objet: el('mailObjet').value.trim() || lu.objet,
        de: lu.de, date_mail: lu.date_mail, texte: lu.texte,
        devis_id: el('mailDevis').value, par: identite.key || 'nicolas',
      });
      if (res.ok === false) { toast(res.error || 'Échange NON archivé — réessaie.', 'error', 6000); return; }
      // On reflète localement sans relire la fiche (écriture ciblée côté serveur, déjà faite).
      const c = DIRECTORY.find(x => x.key === key);
      if (c) { c.contact.mails = (c.contact.mails || []).concat([res.mail]); }
      el('mailTexte').value = ''; el('mailObjet').value = ''; el('mailObjet').dataset.touche = '';
      el('mailSens').dataset.touche = ''; el('mailDevis').value = '';
      el('mailLu').classList.remove('on');
      el('mailPaste').open = false;
      renderMails((c && c.contact.mails) || [res.mail]);
      const n = ((c && c.contact.mails) || []).length;
      const sh = [...document.querySelectorAll('.subhead')].find(s => /Échanges e-mail/.test(s.textContent));
      if (sh) sh.textContent = `Échanges e-mail (${n})`;
      SS.logActivity && SS.logActivity({ action: 'client.mail', entity_type: 'client', entity_id: key, label: `Échange e-mail archivé — ${c ? (c.contact.prenom + ' ' + c.contact.nom).trim() : key}` });
      toast(res.offline ? 'Échange archivé (hors-ligne)' : 'Échange archivé ✓', res.offline ? 'warn' : 'ok');
    };
    window.supprimerMail = async (id) => {
      if (!selectedKey) return;
      const c = DIRECTORY.find(x => x.key === selectedKey);
      const m = c && (c.contact.mails || []).find(x => String(x.id) === String(id));
      if (!confirm('Supprimer cet échange archivé ?' + (m ? '\n\n« ' + String(m.objet || m.texte).slice(0, 80) + ' »' : '') + '\n\nCette action est définitive.')) return;
      const res = await SS.deleteClientMail(selectedKey, id);
      if (res.ok === false) { toast(res.error || 'Échange NON supprimé — réessaie.', 'error', 6000); return; }
      if (c) c.contact.mails = (c.contact.mails || []).filter(x => String(x.id) !== String(id));
      renderMails((c && c.contact.mails) || []);
      const sh = [...document.querySelectorAll('.subhead')].find(s => /Échanges e-mail/.test(s.textContent));
      if (sh) sh.textContent = `Échanges e-mail (${((c && c.contact.mails) || []).length})`;
      toast('Échange supprimé', 'warn');
    };

    function renderHistFactures(c) {
      const ids = new Set(c.devis.map(d => d.id));
      const facs = FACTURES.filter(f => ids.has(f.devis_id)).sort((a, b) => (b.date || '').localeCompare(a.date || ''));
      if (!facs.length) return '<div class="text-muted">Aucune facture pour ce client.</div>';
      /* ⚠️ Statut et libellés : ceux de la page Facturation (SSUI.statutFacture). Cette copie
         locale ignorait les notes de crédit : l'avoir s'affichait « Soldée », la facture qu'il
         annule « Impayée » (25/10/2026). Le « reste » dit ce qui est encore DÛ. */
      return facs.map(f => {
        const du = window.SSUI.duFacture(f, FACTURES);
        return `<div class="hist-row">
          <div>${window.SSUI.badgeFacture(f, FACTURES)}</div>
          <div><span class="hid">${esc(window.SSUI.TYPE_FACTURE_LABEL[f.type] || 'Facture')} #${esc(f.id)}</span><br><span class="text-muted" style="font-size:var(--fs-2xs)">devis #${esc(f.devis_id)} · ${fmtDate(f.date)}${du > 0.005 ? ` · <span style="color:var(--warn)">reste ${fmtEur(du)}</span>` : ''}</span></div>
          <div class="hm">${fmtEur(f.total_ttc || 0)}</div>
          <div class="row" style="gap:0.3rem;"><button class="btn btn-ghost btn-sm" title="Voir la facture" onclick="location.href='facture.html?id=${encodeURIComponent(f.id)}'">${icon('filetext', 14)}</button></div>
        </div>`;
      }).join('');
    }

    // Photos + notes internes nécessitent le devis complet (pas dans le résumé de liste) —
    // chargées à la demande à l'ouverture d'une fiche client, mises en cache pour éviter
    // de re-télécharger si on revient sur le même client.
    async function loadHistExtras(c) {
      const fulls = await Promise.all(c.devis.map(async d => {
        if (FULL_CACHE.has(d.id)) return FULL_CACHE.get(d.id);
        const full = await SS.getDevis(d.id).catch(() => null);
        if (full) FULL_CACHE.set(d.id, full);
        return full;
      }));
      if (selectedKey !== c.key) return; // l'utilisateur a changé de client entre-temps
      const validFulls = fulls.filter(Boolean);

      const photos = [];
      validFulls.forEach(d => (d.items || []).forEach((it, i) => (it.photos || []).forEach(p => photos.push({ devisId: d.id, itemIndex: i, src: p }))));
      const phEl = el('histPhotos');
      if (phEl) phEl.innerHTML = photos.length
        ? photos.map(p => `<div class="hp-thumb" title="Ouvrir la fiche du devis #${p.devisId}" onclick="location.href='vue.html?id=${p.devisId}'"><img src="${p.src}" alt=""></div>`).join('')
        : '<div class="text-muted">Aucune photo.</div>';

      const notes = [];
      validFulls.forEach(d => (d.comments || []).forEach(n => notes.push({ devisId: d.id, ...n })));
      notes.sort((a, b) => (b.date || '').localeCompare(a.date || ''));
      const AUTHOR_LABEL = { nicolas: 'Nicolas', yannick: 'Yannick' };
      const notesEl = el('histNotes');
      // Même rendu partagé que la fiche devis / le tableau de bord / les RDV (SSUI.commentHtml),
      // avec le n° de devis rappelé au-dessus puisque le fil agrège PLUSIEURS devis du client.
      if (notesEl) notesEl.innerHTML = notes.length
        ? notes.slice().reverse().map(n =>
            `<div class="hn-group"><a class="hn-src" href="vue.html?id=${encodeURIComponent(n.devisId)}#notes" title="Ouvrir les notes de ce devis">devis #${esc(n.devisId)}</a>`
            + window.SSUI.commentHtml(n, {}) + '</div>').join('')
        : '<div class="ss-cmt-empty">Aucune note interne sur les devis de ce client.</div>';
    }

    window.toggleTagPreset = function (btn, tag) {
      const input = el('f_tags');
      const tags = input.value.split(',').map(t => t.trim()).filter(Boolean);
      const idx = tags.findIndex(t => t.toLowerCase() === tag.toLowerCase());
      if (idx >= 0) { tags.splice(idx, 1); btn.classList.remove('active'); }
      else { tags.push(tag); btn.classList.add('active'); }
      input.value = tags.join(', ');
    };

    window.saveFiche = async function (key) {
      const rue = el('f_rue').value.trim();
      const m = rue.match(/^(.*?)(\s+(\d+\w*))?$/);
      const client = {
        key,
        prenom: el('f_prenom').value.trim(), nom: el('f_nom').value.trim(),
        civilite: el('f_civilite').value, ton: el('f_ton').value,   // salutation de la page client
        telephone: el('f_tel').value.trim(), email: el('f_email').value.trim(),
        adresse: { rue: m ? m[1].trim() : rue, numero: m ? (m[3] || '') : '', code_postal: el('f_cp').value.trim(), ville: el('f_ville').value.trim() },
        type_bien: el('f_bien').value.trim(),
        tags: el('f_tags').value.split(',').map(t => t.trim()).filter(Boolean),
        notes: el('f_notes').value,
        date_modification: new Date().toISOString(),
      };
      const res = await SS.saveClient(client);
      if (res.ok === false) { toast(res.error || 'Fiche NON enregistrée — réessaie.', 'error', 6000); return; }
      // Propagation (choix Nicolas) : le devis stocke une COPIE du client → on répercute les coordonnées
      // corrigées sur ses devis existants pour que PDF, attestation TVA et suivi restent à jour.
      // (Match par nom/prénom ; renommer un client ne re-lie pas les anciens devis — limitation connue.)
      /* ⚠️ PROPAGATION CIBLÉE. L'ancienne version réécrivait TOUS les devis du client à chaque
         enregistrement — une étiquette ajoutée suffisait — en avançant leur date de modification :
         le tri « par date » du tableau de bord s'en trouvait faussé, et l'autre, s'il avait l'un de
         ces devis ouvert, recevait un faux « modifié par quelqu'un d'autre » (25/10/2026).
         Désormais : seuls les devis dont le téléphone, l'e-mail ou l'adresse DIFFÈRENT vraiment, et
         jamais par-dessus une modification faite entre-temps (détection de conflit). */
      let propagated = 0, conflits = 0;
      const memeContact = (a, b) => {
        const A = a || {}, B = b || {}, aa = A.adresse || {}, ba = B.adresse || {};
        const t = (x) => String(x || '').trim();
        return t(A.telephone) === t(B.telephone) && t(A.email) === t(B.email)
          && ['rue', 'numero', 'code_postal', 'ville'].every(k => t(aa[k]) === t(ba[k]));
      };
      try {
        const devisList = await SS.listDevis();
        const matches = (devisList || []).filter(d => { const c = d.client || {}; return keyOf(c.prenom, c.nom) === key; });
        for (const summary of matches) {
          const full = await SS.getDevis(summary.id);
          if (!full || !full.client) continue;
          const voulu = { telephone: client.telephone, email: client.email, adresse: Object.assign({}, full.client.adresse, client.adresse) };
          if (memeContact(full.client, voulu)) continue;   // rien ne change : on ne touche pas au devis
          const lu = full.date_modification;
          Object.assign(full.client, voulu);
          full.date_modification = new Date().toISOString();
          const r = await SS.saveDevis(full, { expectedDateModification: lu });
          if (r && r.conflict) conflits++;
          else if (r && r.ok !== false) propagated++;
        }
      } catch (e) { console.warn('[clients] propagation coordonnées → devis:', e); }
      toast(res.offline ? 'Fiche enregistrée (hors-ligne)' : ('Fiche enregistrée ✓' + (propagated ? ` — coordonnées reportées sur ${propagated} devis` : '')
        + (conflits ? ` — ${conflits} devis modifié(s) entre-temps : coordonnées NON reportées, à revoir sur le devis` : '')), (res.offline || conflits) ? 'warn' : 'ok', conflits ? 7000 : 3000);
      await load();
    };

    window.deleteFiche = async function (key) {
      if (!confirm('Supprimer la fiche client ? (les devis ne sont pas supprimés)')) return;
      const resDel = await SS.deleteClient(key);
      if (resDel.ok === false) { toast(resDel.error || 'Suppression refusée.', 'error', 6000); return; }
      toast('Fiche supprimée', 'warn');
      await load();
      fermerFiche();
    };

    window.newDevisFor = function (key) {
      const c = DIRECTORY.find(x => x.key === key);
      if (c) sessionStorage.setItem('ss_prefill_client', JSON.stringify(c.contact));
      location.href = 'simulateur.html';
    };

    /* D · NOUVEAU CLIENT. Deux fenêtres « prompt » (prénom, puis nom) : pas de téléphone, pas
       d'adresse, et aucune idée qu'un client proche existait déjà. Le formulaire prévient AVANT
       de créer un doublon — la clé « nom|prénom » ne pardonne ni une faute ni un accent. */
    const MC = ['mc_prenom', 'mc_nom', 'mc_tel', 'mc_email', 'mc_cp', 'mc_ville'];
    let mcPostalLie = false;
    function saisieClient() {
      const v = (id) => el(id).value.trim();
      return { prenom: v('mc_prenom'), nom: v('mc_nom'), telephone: v('mc_tel'), email: v('mc_email'), code_postal: v('mc_cp'), ville: v('mc_ville') };
    }
    function verifierDoublon() {
      const s = saisieClient(), zone = el('mcDoublon'), ok = el('mcOk');
      const key = keyOf(s.prenom, s.nom);
      const exact = (s.prenom || s.nom) ? DIRECTORY.find(c => c.key === key) : null;
      const proches = exact ? [] : DIRECTORY.map(c => ({ c, r: raisonDoublon(s, c.contact) })).filter(x => x.r).slice(0, 4);
      const lien = (c) => `<button type="button" data-ouvrir-modal="${esc(c.key)}">${esc(`${c.contact.prenom || ''} ${c.contact.nom || ''}`.trim())}</button>`;
      if (exact) {
        zone.innerHTML = `Une fiche existe déjà à ce nom : ${lien(exact)}. Elle sera ouverte au lieu d'en créer une seconde.`;
        ok.textContent = 'Ouvrir la fiche existante';
      } else if (proches.length) {
        zone.innerHTML = 'Ce client existe peut-être déjà : ' + proches.map(x => `${lien(x.c)} <span class="text-muted">(${esc(x.r)})</span>`).join(', ') + '.';
        ok.textContent = 'Créer quand même';
      } else {
        zone.innerHTML = ''; ok.textContent = 'Créer la fiche';
      }
      zone.hidden = !zone.innerHTML;
    }
    window.newClient = function () {
      MC.forEach(id => { el(id).value = ''; });
      verifierDoublon();
      if (!mcPostalLie && window.SSPostal) { SSPostal.bindPair(el('mc_cp'), el('mc_ville')); mcPostalLie = true; }
      el('modalClient').classList.add('open');
      setTimeout(() => el('mc_prenom').focus(), 30);
    };
    window.fermerNouveauClient = function () { el('modalClient').classList.remove('open'); };
    MC.forEach(id => el(id).addEventListener('input', verifierDoublon));
    el('mcDoublon').addEventListener('click', (e) => {
      const b = e.target.closest('[data-ouvrir-modal]');
      if (b) { fermerNouveauClient(); renderDetail(b.dataset.ouvrirModal); }
    });
    el('modalClient').addEventListener('click', (e) => { if (e.target === el('modalClient')) fermerNouveauClient(); });
    el('modalClient').addEventListener('keydown', (e) => {
      if (e.key === 'Escape') fermerNouveauClient();
      if (e.key === 'Enter' && e.target.tagName === 'INPUT') { e.preventDefault(); creerClient(); }
    });
    window.creerClient = async function () {
      const s = saisieClient();
      if (!s.prenom && !s.nom) { toast('Nom ou prénom requis', 'warn'); el('mc_prenom').focus(); return; }
      const key = keyOf(s.prenom, s.nom);
      // Ne JAMAIS écraser une fiche existante (même nom = même clé, ce qui effacerait ses notes/étiquettes) :
      // on l'ouvre à la place.
      const existing = DIRECTORY.some(c => c.key === key) || await SS.getClient(key);
      if (existing) { fermerNouveauClient(); toast('Une fiche existe déjà pour ce nom — ouverture de la fiche existante.', 'warn', 3500); await load(); renderDetail(key); return; }
      const maintenant = new Date().toISOString();
      const res = await SS.saveClient({ key, prenom: s.prenom, nom: s.nom, telephone: s.telephone, email: s.email,
        adresse: { rue: '', numero: '', code_postal: s.code_postal, ville: s.ville },
        tags: [], notes: '', date_creation: maintenant, date_modification: maintenant });
      if (res && res.ok === false) { toast(res.error || 'Fiche NON créée — réessaie.', 'error', 6000); return; }
      fermerNouveauClient();
      toast('Client créé ✓', 'ok');
      await load();
      renderDetail(key);
    };

    SS.isOnline(); // log état
    // `?key=nom|prenom` ouvre directement la fiche : c'est ce qui permet au raccourci « Fiche client »
    // du tableau de bord d'atterrir sur le bon client au lieu d'une liste où il faut le retrouver.
    load().then(() => {
      // Revenir d'un devis (« retour ») rouvre la fiche qu'on regardait sur téléphone.
      const etat = history.state && history.state.crmFiche;
      if (etat && MAITRE_DETAIL() && DIRECTORY.some(c => c.key === etat)) { ficheHistorique = true; renderDetail(etat, { sansHistorique: true }); return; }
      const k = window.SSUI.qp('key');
      if (!k || !DIRECTORY.some(c => c.key === k)) { if (!selectedKey) renderAccueil(); return; }
      // Arrivé d'ailleurs SUR cette fiche : « retour » ramène d'où l'on vient, pas à la liste.
      renderDetail(k, { sansHistorique: true });
      /* ⚠️ `?mail=<id>` ouvre DIRECTEMENT la correction de cet échange. C est ce qui fait que
         le bouton « Corriger » de la fiche devis mène quelque part d utile : sans ça, on
         atterrirait sur le CRM avec la consigne implicite de retrouver soi-même le bon mail
         dans la liste — et c est exactement le détour qu on ne fait pas.
         Même idée que l arrivée sur un sujet classé depuis le Ctrl+K (règle 23 bis). */
      const mid = window.SSUI.qp('mail');
      if (mid) setTimeout(() => window.modifierMail(mid), 60);
    });
  </script>
</body>
</html>
