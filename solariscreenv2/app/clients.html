<!DOCTYPE html>
<html lang="fr" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SolariScreen — Clients (CRM)</title>
  <link rel="icon" type="image/png" href="../assets/img/logo-solariscreen.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600;700&family=Orbitron:wght@600;800&display=swap" rel="stylesheet">
  <script src="../assets/js/theme.js"></script>
  <link rel="stylesheet" href="../assets/css/tokens.css">
  <link rel="stylesheet" href="../assets/css/theme-dark.css">
  <link rel="stylesheet" href="../assets/css/theme-light.css">
  <link rel="stylesheet" href="../assets/css/base.css">
  <style>
    .crm-layout { display: grid; grid-template-columns: 380px minmax(0, 1fr); gap: var(--sp-5); align-items: start; }
    @media (max-width: 920px) { .crm-layout { grid-template-columns: 1fr; } .crm-detail.empty-detail { display: none; } }

    .crm-list { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-md); overflow: visible; box-shadow: var(--shadow-sm); --tick-color: var(--accent); }
    .crm-list .lh { padding: var(--sp-3) var(--sp-4); border-bottom: 1px solid var(--border); display: flex; gap: var(--sp-2); align-items: center; }
    .crm-list .lh input { flex: 1; }
    .crm-items { max-height: 70vh; overflow-y: auto; }
    .crm-item { display: flex; gap: var(--sp-3); align-items: center; padding: var(--sp-3) var(--sp-4); border-bottom: 1px solid var(--border); cursor: pointer; transition: background var(--t-fast); }
    .crm-item:hover { background: var(--surface-2); }
    .crm-item.active { background: color-mix(in srgb, var(--accent) 14%, transparent); }
    .avatar { width: 40px; height: 40px; flex: none; border-radius: 50%; display: grid; place-items: center; font-weight: 700; font-size: var(--fs-sm); background: color-mix(in srgb, var(--accent) 18%, transparent); color: var(--accent); border: 1px solid color-mix(in srgb, var(--accent) 30%, transparent); }
    .crm-item .ci-main { min-width: 0; flex: 1; }
    .crm-item .ci-name { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .crm-item .ci-sub { font-size: var(--fs-2xs); color: var(--text-muted); font-family: var(--font-mono); }
    /* Client déduit de ses devis mais dont la fiche d'enrichissement n'existe pas encore. */
    .ci-todo { font-family: var(--font-mono); font-size: var(--fs-3xs); text-transform: uppercase; letter-spacing: .04em;
      color: var(--text-subtle); border: 1px dashed var(--border-strong); border-radius: var(--r-sm); padding: 1px 5px; vertical-align: 1px; }

    .crm-detail { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-md); box-shadow: var(--shadow-sm); min-height: 300px; --tick-color: var(--accent-2); }
    .detail-head { padding: var(--sp-5); border-bottom: 1px solid var(--border); display: flex; gap: var(--sp-3); align-items: center; flex-wrap: wrap; }
    .detail-head .avatar { width: 52px; height: 52px; font-size: var(--fs-md); }
    .detail-head h2 { font-family: var(--font-display); font-size: var(--fs-xl); display: inline-flex; align-items: center; gap: var(--sp-2); }
    .detail-head h2 .ci-copy { opacity: 0.5; }
    .detail-head h2:hover .ci-copy { opacity: 1; }
    .detail-head .actions { margin-left: auto; display: flex; gap: var(--sp-2); flex-wrap: wrap; }
    .detail-body { padding: var(--sp-5); }

    /* ── Copier-coller rapide sur les champs de contact ── */
    .input-copy-wrap { position: relative; }
    .input-copy-wrap input { padding-right: 2.1rem; }
    .ci-copy { flex: none; width: 26px; height: 26px; display: grid; place-items: center; border: none; border-radius: var(--r-sm); background: none; color: var(--text-subtle); cursor: pointer; transition: all var(--t-fast); }
    .ci-copy:hover { color: var(--accent-2); background: var(--surface-2); }
    .input-copy-wrap .ci-copy { position: absolute; right: 3px; top: 50%; transform: translateY(-50%); }
    .hist-row .hm { cursor: pointer; }
    .hist-row .hm:hover { color: var(--accent-2); }
    .mini-kpi .v.v-copy { cursor: pointer; }
    .mini-kpi .v.v-copy:hover { color: var(--accent-2); }

    .mini-kpis { display: grid; grid-template-columns: repeat(4, 1fr); gap: var(--sp-3); margin-bottom: var(--sp-5); }
    @media (max-width: 620px) { .mini-kpis { grid-template-columns: repeat(2, 1fr); } }
    .mini-kpi { text-align: center; border: 1px solid var(--border); border-radius: var(--r-sm); padding: var(--sp-3); background: var(--surface-2); --tick-color: var(--border-strong); }
    .mini-kpi .v { font-family: var(--font-mono); font-size: var(--fs-lg); font-weight: 700; }
    .mini-kpi .l { font-size: var(--fs-2xs); color: var(--text-subtle); text-transform: uppercase; letter-spacing: 0.05em; }

    .subhead { font-size: var(--fs-2xs); text-transform: uppercase; letter-spacing: 0.1em; color: var(--text-subtle); margin: var(--sp-5) 0 var(--sp-3); border-top: 1px solid var(--border); padding-top: var(--sp-4); }
    .hist-row { display: grid; grid-template-columns: auto 1fr auto auto; gap: var(--sp-3); align-items: center; padding: var(--sp-3); border: 1px solid var(--border); border-radius: var(--r-sm); margin-bottom: var(--sp-2); }
    .hist-row .hid { font-family: var(--font-mono); font-size: var(--fs-2xs); color: var(--text-subtle); }
    .hist-row .hm { font-family: var(--font-mono); text-align: right; color: var(--accent); }
    .empty-detail-msg { text-align: center; color: var(--text-muted); padding: var(--sp-7); }
    .empty-detail-msg svg { display: block; margin: 0 auto var(--sp-3); color: var(--text-subtle); }
    .hist-meta { display: flex; align-items: center; gap: 0.5rem; font-size: var(--fs-2xs); color: var(--text-subtle); margin-top: 0.15rem; }
    .hist-meta span { display: inline-flex; align-items: center; gap: 0.2rem; }
    .hp-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(72px, 1fr)); gap: 0.4rem; }
    .hp-thumb { width: 100%; aspect-ratio: 1; border-radius: var(--r-sm); overflow: hidden; border: 1px solid var(--border); cursor: pointer; background: var(--surface-2); }
    .hp-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .hn-row { border: 1px solid var(--border); border-radius: var(--r-sm); padding: var(--sp-2) var(--sp-3); margin-bottom: var(--sp-2); font-size: var(--fs-sm); background: var(--surface-2); }
    .hn-row .hn-head { display: flex; justify-content: space-between; font-family: var(--font-mono); font-size: var(--fs-2xs); color: var(--text-subtle); margin-bottom: 0.2rem; }
    .tag-presets { display: flex; flex-wrap: wrap; gap: 0.35rem; margin-top: 0.4rem; }
    .tag-chip { font-family: var(--font-mono); font-size: var(--fs-2xs); padding: 0.28rem 0.6rem; border-radius: var(--r-sm); border: 1px solid var(--border); background: var(--surface-2); color: var(--text-muted); cursor: pointer; transition: all var(--t-fast); }
    .tag-chip:hover { border-color: var(--accent); color: var(--text); }
    .tag-chip.active { border-color: var(--accent-2); background: color-mix(in srgb, var(--accent-2) 16%, transparent); color: var(--accent-2); }
  </style>
</head>
<body>
  <div class="fx-grid"></div>

  <header class="app-header">
    <div class="brand">
      <span class="brand-logo"><img src="../assets/img/logo-solariscreen.png" alt="" onerror="this.style.display='none'"></span>
      <div><h1><a href="dashboard.html">SOLARISCREEN</a></h1><div class="module">Clients · CRM</div></div>
    </div>
    <div class="header-actions">
      <a class="btn btn-ghost btn-sm" href="dashboard.html"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect width="7" height="9" x="3" y="3" rx="1"/><rect width="7" height="5" x="14" y="3" rx="1"/><rect width="7" height="9" x="14" y="12" rx="1"/><rect width="7" height="5" x="3" y="16" rx="1"/></svg> Dashboard</a>
      <span id="quickNav"></span>
      <span id="themeToggle"></span>
      <button class="btn btn-primary btn-sm" onclick="newClient()"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg> Nouveau client</button>
    </div>
  </header>

  <main class="container">
    <div class="kpis" id="kpis"></div>

    <div class="crm-layout">
      <!-- Liste -->
      <div class="crm-list ticked">
        <div class="lh">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="color:var(--text-subtle);flex-shrink:0;"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          <label for="search" class="sr-only">Rechercher un client</label>
          <input class="input" id="search" placeholder="Rechercher un client…" oninput="renderList()">
          <select class="select" id="sort" style="max-width:120px;" onchange="renderList()" aria-label="Trier les clients">
            <option value="recent">Récent</option>
            <option value="ca">CA ↓</option>
            <option value="nom">Nom</option>
          </select>
        </div>
        <div class="crm-items" id="list"></div>
      </div>

      <!-- Détail -->
      <div class="crm-detail ticked empty-detail" id="detail">
        <div class="empty-detail-msg"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>Sélectionne un client pour voir sa fiche et son historique.</div>
      </div>
    </div>
  </main>

  <script src="../assets/js/ui.js"></script>
  <script src="../assets/js/nav.js"></script>
  <script src="../assets/js/api.js"></script>
  <script src="../assets/js/postal-be.js"></script>
  <script>
    const SS = window.SS;
    const { mountThemeToggle } = window.SSTheme;
    const { fmtEur, fmtDate, el, toast, icon } = window.SSUI;
    window.SSNav.mount(document.getElementById('quickNav'));
    mountThemeToggle(document.getElementById('themeToggle'));

    const STATUSES = {
      brouillon: { label: 'Brouillon', cls: 'badge' }, envoye_client: { label: 'Envoyé', cls: 'badge-cyan' },
      relance_1: { label: 'Relance 1', cls: 'badge-warn' }, relance_2: { label: 'Relance 2', cls: 'badge-warn' },
      signe: { label: 'Signé', cls: 'badge-ok' }, termine: { label: 'Terminé', cls: 'badge-accent' },
      refuse: { label: 'Refusé', cls: 'badge-danger' }, annule: { label: 'Annulé', cls: 'badge' },
    };
    const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
    const keyOf = (prenom, nom) => (String(nom || '').trim() + '|' + String(prenom || '').trim()).toLowerCase().replace(/\s+/g, ' ');
    // Suggestion de civilité d'après le prénom — volontairement CONSERVATRICE : renvoie '' (Non
    // précisé) dès le moindre doute, pour ne jamais risquer de mégenrer un client sur un document
    // commercial. Ce n'est qu'une pré-sélection ; Nicolas confirme/corrige toujours dans le menu.
    const PRENOMS_F = new Set('marie sophie julie camille sarah emma laura pauline manon lea lena clara anne catherine isabelle nathalie sandrine celine aurelie stephanie virginie sabrina patricia christine sylvie martine nicole francoise monique veronique caroline delphine elodie melanie audrey charlotte ines lucie oceane jade louise alice eva nina rose margaux amelie justine fanny elise claire helene agnes brigitte laurence corinne valerie florence beatrice chantal jacqueline'.split(' '));
    const PRENOMS_M = new Set('jean pierre michel philippe alain patrick nicolas christophe david laurent stephane pascal frederic eric olivier thierry sebastien julien vincent francois daniel bernard claude marc antoine thomas maxime alexandre guillaume romain kevin anthony jerome gilles bruno didier yannick benoit fabrice cedric jonathan quentin hugo lucas louis arthur paul gabriel raphael nathan theo mathis enzo clement baptiste damien florian mickael jordan gerard andre rene georges robert jacques henri christian serge guy'.split(' '));
    const normPrenom = (p) => String(p || '').trim().toLowerCase().split(/[\s-]/)[0].normalize('NFD').replace(/[̀-ͯ]/g, '');
    function guessCivilite(prenom) {
      const p = normPrenom(prenom);
      if (PRENOMS_F.has(p)) return 'Madame';
      if (PRENOMS_M.has(p)) return 'Monsieur';
      return '';
    }
    const TAG_PRESETS = ['Chaud', 'À relancer', 'Gros chantier', 'Client pro', 'Rénovation TVA 6%', "Difficile d'accès"];
    const initials = (p, n) => ((p || '')[0] || '') + ((n || '')[0] || '') || '?';

    let DIRECTORY = [];   // [{key, prenom, nom, contact, devis:[], stats, overlay}]
    let selectedKey = null;
    let FACTURES = [];
    const FULL_CACHE = new Map(); // devisId -> devis complet (chargé à la demande pour photos/notes)
    const paidSum = f => (f.paiements || []).reduce((s, p) => s + (Number(p.montant) || 0), 0);

    function badge(st) { const s = STATUSES[st] || STATUSES.brouillon; return `<span class="badge ${s.cls}">${s.label}</span>`; }

    async function load() {
      const rawDevis = await SS.listDevis();
      const overlays = await SS.listClients();
      FACTURES = await SS.listFactures();
      const map = new Map();

      (rawDevis || []).forEach(d => {
        const prenom = d.client_prenom || (d.client && d.client.prenom) || '';
        const nom = d.client_nom || (d.client && d.client.nom) || '';
        if (!prenom && !nom) return;
        const key = keyOf(prenom, nom);
        if (!map.has(key)) map.set(key, { key, prenom, nom, devis: [], overlay: null });
        const entry = map.get(key);
        entry.devis.push({
          id: d.id, statut: d.statut || 'brouillon',
          ttc: d.total_ttc || (d.calculs && d.calculs.total_ttc) || 0,
          date: d.date_modification || d.date_creation || '',
          contact: d.client || null,
          photos: d.photos_count || 0, comments: d.comments_count || 0,
          chantier: d.chantier || null,
        });
      });

      // fusion des fiches overlay (contact enrichi, notes, et clients sans devis)
      (overlays || []).forEach(o => {
        if (!map.has(o.key)) map.set(o.key, { key: o.key, prenom: o.prenom, nom: o.nom, devis: [], overlay: o });
        else map.get(o.key).overlay = o;
      });

      DIRECTORY = [...map.values()].map(e => {
        e.devis.sort((a, b) => (b.date || '').localeCompare(a.date || ''));
        const latest = e.devis[0];
        const o = e.overlay || {};
        // Agrège les coordonnées sur TOUS les devis (du plus récent au plus ancien,
        // première valeur non vide retenue par champ), puis l'overlay est prioritaire.
        const agg = {};
        e.devis.forEach(dv => {
          const cc = dv.contact || {};
          if (cc.telephone && !agg.telephone) agg.telephone = cc.telephone;
          if (cc.email && !agg.email) agg.email = cc.email;
          if (cc.adresse && !agg.adresse && (cc.adresse.rue || cc.adresse.ville || cc.adresse.code_postal)) agg.adresse = cc.adresse;
          if (cc.type_bien && !agg.type_bien) agg.type_bien = cc.type_bien;
        });
        e.contact = {
          prenom: o.prenom || e.prenom, nom: o.nom || e.nom,
          telephone: o.telephone || agg.telephone || '',
          email: o.email || agg.email || '',
          adresse: o.adresse || agg.adresse || {},
          type_bien: o.type_bien || agg.type_bien || '',
          notes: o.notes || '', tags: o.tags || [],
        };
        const signes = e.devis.filter(x => ['signe', 'termine'].includes(x.statut));
        e.stats = {
          count: e.devis.length,
          ca: e.devis.reduce((s, x) => s + x.ttc, 0),
          caSigne: signes.reduce((s, x) => s + x.ttc, 0),
          signes: signes.length,
          last: latest ? latest.date : (o.date_modification || ''),
        };
        return e;
      });

      // Recherche pré-remplie (ex. depuis la recherche globale Ctrl+K : clients.html?q=Nom).
      const qParam = new URLSearchParams(location.search).get('q');
      if (qParam && el('search')) el('search').value = qParam;
      renderKPIs(); renderList();
      if (selectedKey) renderDetail(selectedKey);
    }

    function renderKPIs() {
      const totalClients = DIRECTORY.length;
      const actifs = DIRECTORY.filter(c => c.stats.signes > 0).length;
      const ca = DIRECTORY.reduce((s, c) => s + c.stats.caSigne, 0);
      const top = DIRECTORY.slice().sort((a, b) => b.stats.caSigne - a.stats.caSigne)[0];
      el('kpis').innerHTML = `
        <div class="kpi accent"><div class="kpi-label">Clients</div><div class="kpi-value">${totalClients}</div></div>
        <div class="kpi"><div class="kpi-label">Clients actifs</div><div class="kpi-value">${actifs}</div></div>
        <div class="kpi gold"><div class="kpi-label">CA signé</div><div class="kpi-value">${fmtEur(ca)}</div></div>
        <div class="kpi"><div class="kpi-label">Top client</div><div class="kpi-value" style="font-size:var(--fs-md)">${top && top.stats.caSigne > 0 ? esc(top.contact.prenom + ' ' + top.contact.nom) : '—'}</div></div>`;
      if (window.SSUI.animateKpis) window.SSUI.animateKpis(el('kpis'));   // odometre partage (coup de frais)
    }

    function renderList() {
      const q = el('search').value.trim().toLowerCase();
      const sort = el('sort').value;
      let rows = DIRECTORY.slice();
      if (q) rows = rows.filter(c => (`${c.contact.prenom} ${c.contact.nom} ${c.contact.email} ${c.contact.telephone}`).toLowerCase().includes(q));
      rows.sort((a, b) => {
        if (sort === 'ca') return b.stats.ca - a.stats.ca;
        if (sort === 'nom') return (a.contact.nom || '').localeCompare(b.contact.nom || '');
        return (b.stats.last || '').localeCompare(a.stats.last || '');
      });
      el('list').innerHTML = rows.length ? rows.map(c => `
        <div class="crm-item ${c.key === selectedKey ? 'active' : ''}" onclick="renderDetail(${SSUI.jsAttr(c.key)})">
          <div class="avatar">${esc(initials(c.contact.prenom, c.contact.nom)).toUpperCase()}</div>
          <div class="ci-main">
            <div class="ci-name">${esc(c.contact.prenom)} ${esc(c.contact.nom)}${!c.overlay ? ` <span class="ci-todo" title="Client déduit de ses devis : sa fiche (civilité, formule de salutation, étiquettes, notes) n'est pas encore complétée">à compléter</span>` : ''}</div>
            <div class="ci-sub">${c.stats.count} devis · ${fmtEur(c.stats.ca)}</div>
          </div>
          ${c.devis[0] ? badge(c.devis[0].statut) : ''}
        </div>`).join('') : '<div class="empty-detail-msg">Aucun client.</div>';
    }

    window.renderDetail = function (key) {
      selectedKey = key;
      const c = DIRECTORY.find(x => x.key === key);
      renderList();
      const det = el('detail');
      det.classList.remove('empty-detail');
      if (!c) { det.innerHTML = '<div class="empty-detail-msg">Client introuvable.</div>'; return; }
      const ct = c.contact, adr = ct.adresse || {};
      det.innerHTML = `
        <div class="detail-head">
          <div class="avatar">${esc(initials(ct.prenom, ct.nom)).toUpperCase()}</div>
          <div>
            <h2>${esc(ct.prenom)} ${esc(ct.nom)}<button class="ci-copy" onclick="ssCopy(${SSUI.jsAttr(((ct.prenom || '') + ' ' + (ct.nom || '')).trim())}, ${SSUI.jsAttr('Nom')})" title="Copier le nom" aria-label="Copier le nom">${icon('copy', 13)}</button></h2>
            <div class="text-muted" style="font-size:var(--fs-2xs)">${c.stats.count} devis · dernier ${fmtDate(c.stats.last)}</div>
            ${(ct.tags || []).length ? `<div class="row wrap" style="gap:0.3rem;margin-top:0.4rem;">${ct.tags.map(t => `<span class="badge badge-purple">${esc(t)}</span>`).join('')}</div>` : ''}
          </div>
          <div class="actions">
            <button class="btn btn-primary btn-sm" onclick="newDevisFor(${SSUI.jsAttr(key)})">${icon('plus', 14)} Nouveau devis</button>
          </div>
        </div>
        <div class="detail-body">
          <div class="mini-kpis">
            <div class="mini-kpi ticked"><div class="v">${c.stats.count}</div><div class="l">Devis</div></div>
            <div class="mini-kpi ticked"><div class="v">${c.stats.signes}</div><div class="l">Signés</div></div>
            <div class="mini-kpi ticked" style="--tick-color:var(--accent-2);"><div class="v v-copy" style="color:var(--accent-2)" onclick="ssCopy(${SSUI.jsAttr(fmtEur(c.stats.ca))}, ${SSUI.jsAttr('CA total')})" title="Copier">${fmtEur(c.stats.ca)}</div><div class="l">CA total</div></div>
            <div class="mini-kpi ticked" style="--tick-color:var(--ok);"><div class="v v-copy" style="color:var(--ok)" onclick="ssCopy(${SSUI.jsAttr(fmtEur(c.stats.caSigne))}, ${SSUI.jsAttr('CA signé')})" title="Copier">${fmtEur(c.stats.caSigne)}</div><div class="l">CA signé</div></div>
          </div>

          <div class="subhead" style="border:none;margin-top:0;padding-top:0;">Coordonnées</div>
          <div class="grid grid-2">
            <div class="field"><label class="label" for="f_prenom">Prénom</label><input class="input" id="f_prenom" value="${esc(ct.prenom)}"></div>
            <div class="field"><label class="label" for="f_nom">Nom</label><input class="input" id="f_nom" value="${esc(ct.nom)}"></div>
            <div class="field"><label class="label" for="f_civilite">Civilité</label>
              <select class="select" id="f_civilite">
                ${['', 'Monsieur', 'Madame'].map(v => `<option value="${v}" ${(ct.civilite || guessCivilite(ct.prenom)) === v ? 'selected' : ''}>${v || 'Non précisé'}</option>`).join('')}
              </select>
              <div class="section-sub" style="margin-top:0.2rem;">${!ct.civilite && guessCivilite(ct.prenom) ? '💡 suggéré d\'après le prénom — à confirmer' : 'sert à la formule « Professionnel »'}</div>
            </div>
            <div class="field"><label class="label" for="f_ton">Formule (page client)</label>
              <select class="select" id="f_ton">
                <option value="amical" ${(ct.ton || 'amical') === 'amical' ? 'selected' : ''}>Amical — « Bonjour Prénom »</option>
                <option value="pro" ${ct.ton === 'pro' ? 'selected' : ''}>Professionnel — « Bonjour Monsieur/Madame Nom »</option>
              </select>
            </div>
            <div class="field"><label class="label" for="f_tel">Téléphone(s)</label><div class="input-copy-wrap"><input class="input" id="f_tel" placeholder="0475 12 34 56, 02 345 67 89" value="${esc(ct.telephone)}"><button type="button" class="ci-copy" onclick="ssCopy(document.getElementById('f_tel').value, 'Téléphone')" title="Copier" aria-label="Copier le téléphone">${icon('copy', 13)}</button></div></div>
            <div class="field"><label class="label" for="f_email">Email(s)</label><div class="input-copy-wrap"><input class="input" id="f_email" type="email" multiple placeholder="email@exemple.be, autre@exemple.be" value="${esc(ct.email)}"><button type="button" class="ci-copy" onclick="ssCopy(document.getElementById('f_email').value, 'Email')" title="Copier" aria-label="Copier l'email">${icon('copy', 13)}</button></div></div>
            <div class="field" style="grid-column:span 2;"><label class="label" for="f_rue">Rue & numéro</label><div class="input-copy-wrap"><input class="input" id="f_rue" value="${esc((adr.rue || '') + (adr.numero ? ' ' + adr.numero : ''))}"><button type="button" class="ci-copy" onclick="ssCopy(document.getElementById('f_rue').value, 'Adresse')" title="Copier" aria-label="Copier l'adresse">${icon('copy', 13)}</button></div></div>
            <div class="field"><label class="label" for="f_cp">Code postal</label><input class="input" id="f_cp" value="${esc(adr.code_postal)}"></div>
            <div class="field"><label class="label" for="f_ville">Ville</label><input class="input" id="f_ville" value="${esc(adr.ville)}"></div>
            <div class="field" style="grid-column:span 2;">
              <label class="label" for="f_tags">Tags (séparés par ,)</label>
              <input class="input" id="f_tags" value="${esc((ct.tags || []).join(', '))}">
              <div class="tag-presets">${TAG_PRESETS.map(t => `<button type="button" class="tag-chip ${(ct.tags || []).some(x => x.toLowerCase() === t.toLowerCase()) ? 'active' : ''}" onclick="toggleTagPreset(this,${SSUI.jsAttr(t)})">${esc(t)}</button>`).join('')}</div>
            </div>
            <div class="field"><label class="label" for="f_bien">Type de bien</label><input class="input" id="f_bien" value="${esc(ct.type_bien)}" placeholder="maison, appartement…"></div>
            <div class="field" style="grid-column:span 2;"><label class="label" for="f_notes">Notes internes</label><textarea class="textarea" id="f_notes" placeholder="Préférences, infos chantier, suivi…">${esc(ct.notes)}</textarea></div>
          </div>
          <div class="row mt-4" style="gap:var(--sp-2);">
            <button class="btn btn-primary btn-sm" onclick="saveFiche(${SSUI.jsAttr(key)})">${icon('save', 14)} Enregistrer la fiche</button>
            ${c.overlay ? `<button class="btn btn-danger btn-sm" onclick="deleteFiche(${SSUI.jsAttr(key)})">${icon('trash', 14)} Supprimer la fiche</button>` : ''}
          </div>

          <div class="subhead">Historique des devis (${c.devis.length})</div>
          ${c.devis.length ? c.devis.map(d => {
            const ch = d.chantier;
            let chantierBadge = '';
            if (ch && ch.date_pose) {
              const days = Math.round((new Date(ch.date_pose) - new Date(new Date().toISOString().slice(0, 10))) / 86400000);
              chantierBadge = days < 0 && d.statut !== 'termine'
                ? `<span title="Pose en retard">${icon('calendar', 11)} en retard</span>`
                : `<span title="Pose planifiée le ${fmtDate(ch.date_pose)}">${icon('calendar', 11)} ${fmtDate(ch.date_pose)}</span>`;
            }
            return `
            <div class="hist-row">
              <div>${badge(d.statut)}</div>
              <div>
                <span class="hid">#${d.id}</span><br><span class="text-muted" style="font-size:var(--fs-2xs)">${fmtDate(d.date)}</span>
                <div class="hist-meta">
                  ${d.photos ? `<span>${icon('camera', 11)} ${d.photos}</span>` : ''}
                  ${d.comments ? `<span>${icon('message', 11)} ${d.comments}</span>` : ''}
                  ${chantierBadge}
                </div>
              </div>
              <div class="hm" onclick="ssCopy(${SSUI.jsAttr(fmtEur(d.ttc))}, ${SSUI.jsAttr('Montant TVAC')})" title="Copier le montant">${fmtEur(d.ttc)}</div>
              <div class="row" style="gap:0.3rem;">
                <button class="btn btn-ghost btn-sm" title="Fiche du devis" aria-label="Fiche du devis ${d.id}" onclick="location.href='vue.html?id=${d.id}'">${icon('window', 14)}</button>
                <button class="btn btn-ghost btn-sm" title="Document client / PDF" aria-label="Document client du devis ${d.id}" onclick="location.href='devis.html?id=${d.id}'">${icon('filetext', 14)}</button>
                <button class="btn btn-ghost btn-sm" title="Éditer le devis" aria-label="Éditer le devis ${d.id}" onclick="location.href='simulateur.html?id=${d.id}'">${icon('edit', 14)}</button>
              </div>
            </div>`;
          }).join('') : '<div class="text-muted">Aucun devis pour ce client.</div>'}

          <div class="subhead">Factures</div>
          <div id="histFactures">${renderHistFactures(c)}</div>

          <div class="subhead">Photos</div>
          <div class="hp-grid" id="histPhotos" aria-busy="true"><div class="skl" style="height:74px"></div><div class="skl" style="height:74px"></div><div class="skl" style="height:74px"></div></div>

          <div class="subhead">Notes internes des devis</div>
          <div id="histNotes" aria-busy="true"><div class="skl-row"><div class="skl" style="height:13px;width:38%"></div><div class="skl" style="height:36px"></div><div class="skl" style="height:36px;width:82%"></div></div></div>
        </div>`;
      // Saisie assistée code postal ↔ ville (à refaire à chaque rendu : les champs sont recréés).
      window.SSPostal && SSPostal.bindPair(el('f_cp'), el('f_ville'));
      loadHistExtras(c);
    };

    function renderHistFactures(c) {
      const ids = new Set(c.devis.map(d => d.id));
      const facs = FACTURES.filter(f => ids.has(f.devis_id)).sort((a, b) => (b.date || '').localeCompare(a.date || ''));
      if (!facs.length) return '<div class="text-muted">Aucune facture pour ce client.</div>';
      const TYPE_LABEL_FAC = { acompte: 'Acompte', solde: 'Solde', totale: 'Totale' };
      return facs.map(f => {
        const paid = paidSum(f), due = f.total_ttc || 0;
        const statusBadge = paid >= due - 0.005 ? '<span class="badge badge-ok">Soldée</span>'
          : paid > 0 ? '<span class="badge badge-warn">Partiel</span>' : '<span class="badge">Impayée</span>';
        return `<div class="hist-row">
          <div>${statusBadge}</div>
          <div><span class="hid">${esc(TYPE_LABEL_FAC[f.type] || 'Facture')} #${esc(f.id)}</span><br><span class="text-muted" style="font-size:var(--fs-2xs)">devis #${esc(f.devis_id)} · ${fmtDate(f.date)}</span></div>
          <div class="hm">${fmtEur(due)}</div>
          <div class="row" style="gap:0.3rem;"><button class="btn btn-ghost btn-sm" title="Voir la facture" onclick="location.href='facture.html?id=${encodeURIComponent(f.id)}'">${icon('filetext', 14)}</button></div>
        </div>`;
      }).join('');
    }

    // Photos + notes internes nécessitent le devis complet (pas dans le résumé de liste) —
    // chargées à la demande à l'ouverture d'une fiche client, mises en cache pour éviter
    // de re-télécharger si on revient sur le même client.
    async function loadHistExtras(c) {
      const fulls = await Promise.all(c.devis.map(async d => {
        if (FULL_CACHE.has(d.id)) return FULL_CACHE.get(d.id);
        const full = await SS.getDevis(d.id).catch(() => null);
        if (full) FULL_CACHE.set(d.id, full);
        return full;
      }));
      if (selectedKey !== c.key) return; // l'utilisateur a changé de client entre-temps
      const validFulls = fulls.filter(Boolean);

      const photos = [];
      validFulls.forEach(d => (d.items || []).forEach((it, i) => (it.photos || []).forEach(p => photos.push({ devisId: d.id, itemIndex: i, src: p }))));
      const phEl = el('histPhotos');
      if (phEl) phEl.innerHTML = photos.length
        ? photos.map(p => `<div class="hp-thumb" title="Ouvrir la fiche du devis #${p.devisId}" onclick="location.href='vue.html?id=${p.devisId}'"><img src="${p.src}" alt=""></div>`).join('')
        : '<div class="text-muted">Aucune photo.</div>';

      const notes = [];
      validFulls.forEach(d => (d.comments || []).forEach(n => notes.push({ devisId: d.id, ...n })));
      notes.sort((a, b) => (b.date || '').localeCompare(a.date || ''));
      const AUTHOR_LABEL = { nicolas: 'Nicolas', yannick: 'Yannick' };
      const notesEl = el('histNotes');
      if (notesEl) notesEl.innerHTML = notes.length
        ? notes.map(n => `<div class="hn-row"><div class="hn-head"><span>${esc(AUTHOR_LABEL[n.author] || n.author || '—')} · devis #${esc(n.devisId)}</span><span>${fmtDate(n.date)}</span></div>${esc(n.text || '')}</div>`).join('')
        : '<div class="text-muted">Aucune note.</div>';
    }

    window.toggleTagPreset = function (btn, tag) {
      const input = el('f_tags');
      const tags = input.value.split(',').map(t => t.trim()).filter(Boolean);
      const idx = tags.findIndex(t => t.toLowerCase() === tag.toLowerCase());
      if (idx >= 0) { tags.splice(idx, 1); btn.classList.remove('active'); }
      else { tags.push(tag); btn.classList.add('active'); }
      input.value = tags.join(', ');
    };

    window.saveFiche = async function (key) {
      const rue = el('f_rue').value.trim();
      const m = rue.match(/^(.*?)(\s+(\d+\w*))?$/);
      const client = {
        key,
        prenom: el('f_prenom').value.trim(), nom: el('f_nom').value.trim(),
        civilite: el('f_civilite').value, ton: el('f_ton').value,   // salutation de la page client
        telephone: el('f_tel').value.trim(), email: el('f_email').value.trim(),
        adresse: { rue: m ? m[1].trim() : rue, numero: m ? (m[3] || '') : '', code_postal: el('f_cp').value.trim(), ville: el('f_ville').value.trim() },
        type_bien: el('f_bien').value.trim(),
        tags: el('f_tags').value.split(',').map(t => t.trim()).filter(Boolean),
        notes: el('f_notes').value,
        date_modification: new Date().toISOString(),
      };
      const res = await SS.saveClient(client);
      if (res.ok === false) { toast(res.error || 'Fiche NON enregistrée — réessaie.', 'error', 6000); return; }
      // Propagation (choix Nicolas) : le devis stocke une COPIE du client → on répercute les coordonnées
      // corrigées sur ses devis existants pour que PDF, attestation TVA et suivi restent à jour.
      // (Match par nom/prénom ; renommer un client ne re-lie pas les anciens devis — limitation connue.)
      let propagated = 0;
      try {
        const devisList = await SS.listDevis();
        const matches = (devisList || []).filter(d => { const c = d.client || {}; return keyOf(c.prenom, c.nom) === key; });
        for (const summary of matches) {
          const full = await SS.getDevis(summary.id);
          if (!full || !full.client) continue;
          full.client.telephone = client.telephone;
          full.client.email = client.email;
          full.client.adresse = Object.assign({}, full.client.adresse, client.adresse);
          full.date_modification = new Date().toISOString();
          await SS.saveDevis(full);
          propagated++;
        }
      } catch (e) { console.warn('[clients] propagation coordonnées → devis:', e); }
      toast(res.offline ? 'Fiche enregistrée (hors-ligne)' : ('Fiche enregistrée ✓' + (propagated ? ` — coordonnées propagées sur ${propagated} devis` : '')), res.offline ? 'warn' : 'ok', 3000);
      await load();
      renderDetail(key);
    };

    window.deleteFiche = async function (key) {
      if (!confirm('Supprimer la fiche client ? (les devis ne sont pas supprimés)')) return;
      const resDel = await SS.deleteClient(key);
      if (resDel.ok === false) { toast(resDel.error || 'Suppression refusée.', 'error', 6000); return; }
      selectedKey = null;
      toast('Fiche supprimée', 'warn');
      el('detail').classList.add('empty-detail');
      el('detail').innerHTML = `<div class="empty-detail-msg">${icon('users', 28)}Sélectionne un client.</div>`;
      await load();
    };

    window.newDevisFor = function (key) {
      const c = DIRECTORY.find(x => x.key === key);
      if (c) sessionStorage.setItem('ss_prefill_client', JSON.stringify(c.contact));
      location.href = 'simulateur.html';
    };

    window.newClient = async function () {
      const prenom = prompt('Prénom du client ?'); if (prenom === null) return;
      const nom = prompt('Nom du client ?'); if (nom === null) return;
      if (!prenom.trim() && !nom.trim()) { toast('Nom ou prénom requis', 'warn'); return; }
      const key = keyOf(prenom, nom);
      // Ne JAMAIS écraser une fiche existante (même nom = même clé, ce qui effacerait ses notes/étiquettes) :
      // on l'ouvre à la place.
      const existing = await SS.getClient(key);
      if (existing) { toast('Une fiche existe déjà pour ce nom — ouverture de la fiche existante.', 'warn', 3500); await load(); renderDetail(key); return; }
      await SS.saveClient({ key, prenom: prenom.trim(), nom: nom.trim(), tags: [], notes: '', date_creation: new Date().toISOString(), date_modification: new Date().toISOString() });
      toast('Client créé ✓', 'ok');
      await load();
      renderDetail(key);
    };

    SS.isOnline(); // log état
    load();
  </script>
</body>
</html>
