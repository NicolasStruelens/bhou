<!DOCTYPE html>
<html lang="fr" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>SolariScreen — Clients (CRM)</title>
  <!-- ── Installation sur l'écran d'accueil (Android + iPhone) — aucun service worker ── -->
  <link rel="manifest" href="../manifest.webmanifest">
  <meta name="theme-color" content="#0b1224" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#f4f6fb" media="(prefers-color-scheme: light)">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="SolariScreen">
  <link rel="apple-touch-icon" href="../assets/img/apple-touch-icon.png">
  <link rel="icon" type="image/svg+xml" href="../assets/img/logo-solariscreen.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600;700&family=Orbitron:wght@600;800&display=swap" rel="stylesheet">
  <script src="../assets/js/theme.js"></script>
  <link rel="stylesheet" href="../assets/css/tokens.css">
  <link rel="stylesheet" href="../assets/css/theme-dark.css">
  <link rel="stylesheet" href="../assets/css/theme-light.css">
  <link rel="stylesheet" href="../assets/css/theme-cyberpunk.css">
  <link rel="stylesheet" href="../assets/css/theme-zen.css">
  <link rel="stylesheet" href="../assets/css/theme-ardoise.css">
  <link rel="stylesheet" href="../assets/css/base.css">
  <style>
    .crm-layout { display: grid; grid-template-columns: 380px minmax(0, 1fr); gap: var(--sp-5); align-items: start; }
    /* ⚠️ `minmax(0, 1fr)` et surtout PAS `1fr` : la largeur minimale d'une colonne de grille vaut
       « auto », donc elle se laisse étirer par son contenu. Sur un téléphone (412 px), la barre de
       recherche + le tri poussaient la colonne à 476 px et toute la page débordait. */
    @media (max-width: 920px) { .crm-layout { grid-template-columns: minmax(0, 1fr); } .crm-detail.empty-detail { display: none; } }
    /* ── TÉLÉPHONE : liste OU fiche, jamais les deux ────────────────────────────────────────
       La liste plafonne à 70 vh ; en une colonne, la fiche du client tombait donc ~290 px SOUS
       le bas de l'écran (mesuré à 375 × 812 avec 20 clients : fiche à 1102 px). On tapait un
       client et il ne se passait visiblement rien — c'est ce qui rendait la modification
       impossible depuis un téléphone. On bascule donc en maître/détail : la fiche remplace la
       liste, et un bouton ramène en arrière. Au-dessus de 920 px, les deux colonnes cohabitent
       comme avant — rien ne change au bureau. */
    /* ⚠️ La règle de base est écrite AVANT la media query, jamais après : une déclaration en fin
       de feuille repasse devant une media query écrite plus haut (piège déjà payé sur ce projet).
       C'est une variable qui porte l'état, pas une réécriture de `display`. */
    .crm-retour { display: none; align-items: center; gap: 0.4rem; margin-bottom: var(--sp-3); }
    /* Au bureau, la fiche ouverte REMPLAÇAIT « À ranger » sans chemin du retour : il fallait recharger la page
       (demande de Nicolas, 30/10/2026). Le bouton vit en tête de la fiche, là où l'œil cherche un retour ; sur
       téléphone c'est « ← Tous les clients », au-dessus de la carte, qui fait ce travail — une seule porte. */
    .crm-accueil-bar { padding: var(--sp-3) var(--sp-5) 0; }
    .crm-accueil-bar + .detail-head { padding-top: var(--sp-3); }
    @media (max-width: 920px) {
      .crm-accueil-bar { display: none; }
      .crm-accueil-bar + .detail-head { padding-top: var(--sp-5); }
      body.crm-fiche-ouverte .crm-list { display: none; }
      /* Les indicateurs du haut résument TOUS les clients : quand on en modifie un, ils poussent
         sa fiche 440 px plus bas sans rien apprendre. */
      body.crm-fiche-ouverte .kpis { display: none; }
      body.crm-fiche-ouverte .crm-retour { display: inline-flex; }
      /* La liste n'a plus de voisine : elle peut prendre toute la hauteur utile. */
      .crm-items { max-height: none; }
    }

    .crm-list { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-md); overflow: visible; box-shadow: var(--shadow-sm); --tick-color: var(--accent); }
    /* wrap : sur écran étroit, le tri passe sous la recherche au lieu de forcer la largeur. */
    .crm-list .lh { padding: var(--sp-3) var(--sp-4); border-bottom: 1px solid var(--border); display: flex; gap: var(--sp-2); align-items: center; flex-wrap: wrap; }
    .crm-list .lh input { flex: 1 1 150px; min-width: 0; }
    .crm-list .lh .select { flex: 0 1 auto; min-width: 0; }
    .crm-items { max-height: 70vh; overflow-y: auto; }
    .crm-item { display: flex; gap: var(--sp-3); align-items: center; padding: var(--sp-3) var(--sp-4); border-bottom: 1px solid var(--border); cursor: pointer; transition: background var(--t-fast); }
    .crm-item:hover { background: var(--surface-2); }
    .crm-item.active { background: color-mix(in srgb, var(--accent) 14%, transparent); }
    .avatar { width: 40px; height: 40px; flex: none; border-radius: 50%; display: grid; place-items: center; font-weight: 700; font-size: var(--fs-sm); background: color-mix(in srgb, var(--accent) 18%, transparent); color: var(--accent); border: 1px solid color-mix(in srgb, var(--accent) 30%, transparent); }
    .crm-item .ci-main { min-width: 0; flex: 1; }
    /* La pastille « à compléter » vit SOUS le statut, pas à côté du nom : dans la ligne du nom,
       l'un des deux était toujours coupé (« Quentin Détrem… À COMPLÉT… », 25/10/2026). */
    .crm-item .ci-name { display: flex; align-items: center; gap: 0.4rem; min-width: 0; font-weight: 600; }
    .crm-item .ci-nom { min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .crm-item .ci-name .ci-todo { flex: none; }
    .crm-item .ci-sub { display: flex; align-items: center; gap: 0.35rem; min-width: 0; font-size: var(--fs-2xs); color: var(--text-muted); margin-top: 0.1rem; }
    .crm-item .ci-ville { flex: none; max-width: 45%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--text-subtle); }
    .crm-item .ci-ville::after { content: '·'; margin-left: 0.35rem; }
    /* L'action du client : la même phrase et la même couleur que sur le tableau de bord. */
    .ci-act { min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--text); }
    .ci-act::before { content: ''; display: inline-block; width: 7px; height: 7px; border-radius: 50%; margin-right: 0.35rem;
      background: var(--ac, var(--border-strong)); vertical-align: 0.5px; }
    .ci-act.rien { color: var(--text-subtle); }
    .ci-droite { flex: none; display: flex; flex-direction: column; align-items: flex-end; gap: 0.25rem; }
    .ci-du { font-family: var(--font-mono); font-size: var(--fs-2xs); color: var(--warn); white-space: nowrap; }
    .crm-item:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
    /* Client déduit de ses devis mais dont la fiche d'enrichissement n'existe pas encore. */
    .ci-todo { font-family: var(--font-mono); font-size: var(--fs-3xs); text-transform: uppercase; letter-spacing: .04em;
      color: var(--text-subtle); border: 1px dashed var(--border-strong); border-radius: var(--r-sm); padding: 1px 5px; vertical-align: 1px; }

    .crm-detail { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-md); box-shadow: var(--shadow-sm); min-height: 300px; --tick-color: var(--accent-2); }
    .detail-head { padding: var(--sp-5); border-bottom: 1px solid var(--border); display: flex; gap: var(--sp-3); align-items: center; flex-wrap: wrap; }
    .detail-head .avatar { width: 52px; height: 52px; font-size: var(--fs-md); }
    .detail-head h2 { font-family: var(--font-display); font-size: var(--fs-xl); display: inline-flex; align-items: center; gap: var(--sp-2); }
    .detail-head h2 .ci-copy { opacity: 0.5; }
    .detail-head h2:hover .ci-copy { opacity: 1; }
    .detail-head .actions { margin-left: auto; display: flex; gap: var(--sp-2); flex-wrap: wrap; }
    .detail-body { padding: var(--sp-5); }

    /* ── Copier-coller rapide sur les champs de contact ── */
    .input-copy-wrap { position: relative; }
    .input-copy-wrap input { padding-right: 2.1rem; }
    .ci-copy { flex: none; width: 26px; height: 26px; display: grid; place-items: center; border: none; border-radius: var(--r-sm); background: none; color: var(--text-subtle); cursor: pointer; transition: all var(--t-fast); }
    .ci-copy:hover { color: var(--accent-2); background: var(--surface-2); }
    .input-copy-wrap .ci-copy { position: absolute; right: 3px; top: 50%; transform: translateY(-50%); }
    .hist-row .hm { cursor: pointer; }
    .hist-row .hm:hover { color: var(--accent-2); }
    .mini-kpi .v.v-copy { cursor: pointer; }
    .mini-kpi .v.v-copy:hover { color: var(--accent-2); }

    .mini-kpis { display: grid; grid-template-columns: repeat(4, 1fr); gap: var(--sp-3); margin-bottom: var(--sp-5); }
    @media (max-width: 620px) { .mini-kpis { grid-template-columns: repeat(2, 1fr); } }
    .mini-kpi { text-align: center; border: 1px solid var(--border); border-radius: var(--r-sm); padding: var(--sp-3); background: var(--surface-2); --tick-color: var(--border-strong); }
    .mini-kpi .v { font-family: var(--font-mono); font-size: var(--fs-lg); font-weight: 700; }
    .mini-kpi .l { font-size: var(--fs-2xs); color: var(--text-subtle); text-transform: uppercase; letter-spacing: 0.05em; }

    .subhead { font-size: var(--fs-2xs); text-transform: uppercase; letter-spacing: 0.1em; color: var(--text-subtle); margin: var(--sp-5) 0 var(--sp-3); border-top: 1px solid var(--border); padding-top: var(--sp-4); }
    .hist-row { display: grid; grid-template-columns: auto 1fr auto auto; gap: var(--sp-3); align-items: center; padding: var(--sp-3); border: 1px solid var(--border); border-radius: var(--r-sm); margin-bottom: var(--sp-2); }
    .hist-row .hid { font-family: var(--font-mono); font-size: var(--fs-2xs); color: var(--text-subtle); }
    .hist-row .hm { font-family: var(--font-mono); text-align: right; color: var(--accent); }
    /* Sur téléphone, les 4 colonnes (statut · infos · montant · 3 boutons) ne tiennent pas :
       montant et boutons passent sur une 2e ligne au lieu de sortir de l'écran. Visible depuis
       que le raccourci « Fiche client » du tableau de bord ouvre directement une fiche. */
    @media (max-width: 620px) {
      .hist-row { grid-template-columns: auto minmax(0, 1fr); row-gap: var(--sp-2); }
      .hist-row .hm { grid-column: 1 / -1; text-align: left; }
      .hist-row > .row { grid-column: 1 / -1; flex-wrap: wrap; }
      .detail-head .actions { width: 100%; margin-left: 0; }
      /* « Enregistrer la fiche » + « Supprimer la fiche » côte à côte dépassent de 18 px : ils
         passent l'un sous l'autre plutôt que de sortir de l'écran. */
      .detail-body > .row { flex-wrap: wrap; }
    }
    .empty-detail-msg { text-align: center; color: var(--text-muted); padding: var(--sp-7); }
    .empty-detail-msg svg { display: block; margin: 0 auto var(--sp-3); color: var(--text-subtle); }
    .hist-resume { font-size: var(--fs-2xs); color: var(--text-muted); margin-top: 0.15rem;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .hist-meta { display: flex; align-items: center; gap: 0.5rem; font-size: var(--fs-2xs); color: var(--text-subtle); margin-top: 0.15rem; flex-wrap: wrap; }
    .hist-meta span { display: inline-flex; align-items: center; gap: 0.2rem; }
    .hp-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(72px, 100%), 1fr)); gap: 0.4rem; }
    .hp-thumb { width: 100%; aspect-ratio: 1; border-radius: var(--r-sm); overflow: hidden; border: 1px solid var(--border); cursor: pointer; background: var(--surface-2); }
    .hp-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .hn-row { border: 1px solid var(--border); border-radius: var(--r-sm); padding: var(--sp-2) var(--sp-3); margin-bottom: var(--sp-2); font-size: var(--fs-sm); background: var(--surface-2); }
    .hn-row .hn-head { display: flex; justify-content: space-between; font-family: var(--font-mono); font-size: var(--fs-2xs); color: var(--text-subtle); margin-bottom: 0.2rem; }
    /* Le fil du client agrège les notes de TOUS ses devis : chaque note rappelle sa source, cliquable. */
    .hn-group { border: 1px solid var(--border); border-radius: var(--r-sm); padding: 0.2rem var(--sp-3) 0.35rem; margin-bottom: var(--sp-2); background: var(--surface-2); }
    .hn-src { display: inline-block; font-family: var(--font-mono); font-size: var(--fs-3xs); text-transform: uppercase; letter-spacing: .05em;
      color: var(--text-subtle); text-decoration: none; padding-top: 0.35rem; }
    .hn-src:hover { color: var(--accent); text-decoration: underline; }
    .tag-presets { display: flex; flex-wrap: wrap; gap: 0.35rem; margin-top: 0.4rem; }
    .tag-chip { font-family: var(--font-mono); font-size: var(--fs-2xs); padding: 0.28rem 0.6rem; border-radius: var(--r-sm); border: 1px solid var(--border); background: var(--surface-2); color: var(--text-muted); cursor: pointer; transition: all var(--t-fast); }
    .tag-chip:hover { border-color: var(--accent); color: var(--text); }
    .tag-chip.active { border-color: var(--accent-2); background: color-mix(in srgb, var(--accent-2) 16%, transparent); color: var(--accent-2); }

    /* ── La prochaine action : sous la fiche et sur chaque devis de l'historique ── */
    .fiche-action { display: inline-flex; align-items: center; gap: 0.4rem; margin-top: 0.45rem; font-size: var(--fs-xs);
      padding: 0.2rem 0.55rem; border-radius: var(--r-sm); border: 1px solid color-mix(in srgb, var(--ac, var(--border-strong)) 55%, transparent);
      background: color-mix(in srgb, var(--ac, var(--border-strong)) 10%, transparent); color: var(--text); text-decoration: none; }
    .fiche-action:hover { border-color: var(--ac, var(--accent)); text-decoration: none; }
    .fiche-action::before { content: ''; width: 7px; height: 7px; border-radius: 50%; background: var(--ac, var(--border-strong)); }
    .hist-act { color: var(--text-muted); text-decoration: none; }
    .hist-act::before { content: ''; display: inline-block; width: 6px; height: 6px; border-radius: 50%; margin-right: 0.25rem; background: var(--ac, var(--border-strong)); }
    a.hist-act:hover { color: var(--text); text-decoration: underline; }
    .mini-kpi .v.du { color: var(--warn); }

    /* ── « À ranger » : le panneau de droite quand aucun client n'est ouvert (bureau) ── */
    .ar { padding: var(--sp-5); display: flex; flex-direction: column; gap: var(--sp-4); }
    .ar-tete { display: flex; align-items: baseline; gap: var(--sp-3); flex-wrap: wrap; }
    .ar-tete b { font-family: var(--font-display); font-size: var(--fs-lg); }
    .ar-tete span { font-size: var(--fs-xs); color: var(--text-subtle); }
    .ar-bloc h4 { font-family: var(--font-mono); font-size: var(--fs-2xs); text-transform: uppercase; letter-spacing: .08em;
      color: var(--text-subtle); margin: 0 0 var(--sp-2); font-weight: 600; }
    .ar-bloc p { font-size: var(--fs-2xs); color: var(--text-subtle); margin: 0 0 var(--sp-2); }
    .ar-ligne { display: flex; align-items: center; gap: var(--sp-2); flex-wrap: wrap; padding: var(--sp-2) var(--sp-3);
      border: 1px solid var(--border); border-radius: var(--r-sm); margin-bottom: var(--sp-2); background: var(--surface-2); font-size: var(--fs-sm); }
    .ar-ligne button { font: inherit; font-weight: 600; color: var(--text); background: none; border: 0; padding: 0; cursor: pointer;
      text-decoration: underline; text-decoration-color: var(--border-strong); text-underline-offset: 3px; }
    .ar-ligne button:hover { color: var(--accent); }
    .ar-ligne button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    .ar-ligne .ar-why { font-size: var(--fs-2xs); color: var(--text-subtle); margin-left: auto; }
    .ar-plus { font-size: var(--fs-2xs); color: var(--text-subtle); }
    .ar-vide { text-align: center; color: var(--text-muted); padding: var(--sp-6) var(--sp-4); }

    /* ── Nouveau client : un formulaire, plus deux fenêtres « prompt » ── */
    .modal-bg { position: fixed; inset: 0; background: rgba(0,0,0,0.55); z-index: var(--z-overlay, 1000); display: none; align-items: center; justify-content: center; padding: var(--sp-4); }
    .modal-bg.open { display: flex; }
    .modal { background: var(--surface); border: 1px solid var(--border-strong); border-radius: var(--r-md); box-shadow: var(--shadow); width: 520px; max-width: 100%; max-height: 90vh; overflow: auto; }
    .modal h3 { font-family: var(--font-display); font-size: var(--fs-md); padding: var(--sp-4) var(--sp-5); border-bottom: 1px solid var(--border); color: var(--accent); }
    .modal .mbody { padding: var(--sp-5); }
    .modal .mfoot { padding: var(--sp-4) var(--sp-5); border-top: 1px solid var(--border); display: flex; justify-content: flex-end; gap: var(--sp-2); flex-wrap: wrap; }
    .mc-doublon { margin-top: var(--sp-4); padding: var(--sp-3); border-radius: var(--r-sm); font-size: var(--fs-sm);
      border: 1px solid color-mix(in srgb, var(--warn) 50%, transparent); background: color-mix(in srgb, var(--warn) 8%, transparent); }
    .mc-doublon button { font: inherit; font-weight: 600; color: var(--accent); background: none; border: 0; padding: 0; cursor: pointer; text-decoration: underline; }
    @media (max-width: 620px) {
      .modal .grid-2 { grid-template-columns: minmax(0, 1fr); }
      /* Les quatre chiffres EN DEUX RANGÉES COMPACTES : empilés, ils prenaient la moitié de
         l'écran et la liste des clients commençait presque en bas (25/10/2026). */
      .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--sp-2); margin-bottom: var(--sp-3); }
      .kpis .kpi { padding: var(--sp-2) var(--sp-3); }
    }
  </style>
</head>
<body>
  <div class="fx-grid"></div>

  <header class="app-header">
    <div class="brand">
      <span class="brand-logo"><img src="../assets/img/logo-solariscreen.svg" alt="" onerror="this.style.display='none'"></span>
      <div><h1><a href="dashboard.html">SOLARISCREEN</a></h1><div class="module">Clients · CRM</div></div>
    </div>
    <div class="header-actions">
      <a class="btn btn-ghost btn-sm" href="dashboard.html"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect width="7" height="9" x="3" y="3" rx="1"/><rect width="7" height="5" x="14" y="3" rx="1"/><rect width="7" height="9" x="14" y="12" rx="1"/><rect width="7" height="5" x="3" y="16" rx="1"/></svg> Dashboard</a>
      <span id="quickNav"></span>
      <span id="themeToggle"></span>
      <button class="btn btn-primary btn-sm" onclick="newClient()"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg> Nouveau client</button>
    </div>
  </header>

  <main class="container">
    <div class="kpis" id="kpis"></div>

    <div class="crm-layout">
      <!-- Liste -->
      <div class="crm-list ticked">
        <div class="lh">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="color:var(--text-subtle);flex-shrink:0;"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          <label for="search" class="sr-only">Rechercher un client</label>
          <input class="input" id="search" placeholder="Nom, ville, n° de devis…" oninput="renderList()">
          <select class="select" id="sort" style="max-width:120px;" onchange="renderList()" aria-label="Trier les clients">
            <option value="recent">Récent</option>
            <option value="ca">Signé ↓</option>
            <option value="nom">Nom</option>
          </select>
        </div>
        <div class="crm-items" id="list"></div>
      </div>

      <!-- Détail -->
      <button class="btn btn-ghost btn-sm crm-retour" id="crmRetour" onclick="retourAccueil()">← Tous les clients</button>
      <div class="crm-detail ticked empty-detail" id="detail">
        <div class="empty-detail-msg"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>Sélectionne un client pour voir sa fiche et son historique.</div>
      </div>
    </div>
  </main>

  <div class="modal-bg" id="modalClient" role="dialog" aria-modal="true" aria-labelledby="mcTitre">
    <div class="modal">
      <h3 id="mcTitre">Nouveau client</h3>
      <div class="mbody">
        <div class="grid grid-2">
          <div class="field"><label class="label" for="mc_prenom">Prénom</label><input class="input" id="mc_prenom" autocomplete="off"></div>
          <div class="field"><label class="label" for="mc_nom">Nom (ou société)</label><input class="input" id="mc_nom" autocomplete="off"></div>
          <div class="field"><label class="label" for="mc_tel">Téléphone</label><input class="input" id="mc_tel" inputmode="tel" autocomplete="off" placeholder="0475 12 34 56"></div>
          <div class="field"><label class="label" for="mc_email">E-mail</label><input class="input" id="mc_email" type="email" autocomplete="off" placeholder="client@exemple.be"></div>
          <div class="field"><label class="label" for="mc_cp">Code postal</label><input class="input" id="mc_cp" inputmode="numeric" autocomplete="off"></div>
          <div class="field"><label class="label" for="mc_ville">Ville</label><input class="input" id="mc_ville" autocomplete="off"></div>
        </div>
        <div class="mc-doublon" id="mcDoublon" hidden></div>
      </div>
      <div class="mfoot">
        <button class="btn btn-ghost btn-sm" type="button" onclick="fermerNouveauClient()">Annuler</button>
        <button class="btn btn-primary btn-sm" type="button" id="mcOk" onclick="creerClient()">Créer la fiche</button>
      </div>
    </div>
  </div>

  <script src="../assets/js/ui.js"></script>
  <script src="../assets/js/nav.js"></script>
  <script src="../assets/js/fetes.js"></script>
  <script src="../assets/js/api.js"></script>
  <script src="../assets/js/config.js"></script>
  <script src="../assets/js/actions.js"></script>
  <script src="../assets/js/postal-be.js"></script>
  <script>
    const SS = window.SS;
    const { mountThemeToggle } = window.SSTheme;
    const SELLER_LABELS = window.SSUI.SELLER_LABELS;   // source unique : assets/js/ui.js
    const { fmtEur, fmtDate, el, toast, icon } = window.SSUI;
    window.SSNav.mount(document.getElementById('quickNav'));
    mountThemeToggle(document.getElementById('themeToggle'));

    // Les LIBELLÉS viennent de ui.js (source unique, règle 10) ; seule la propriété de style
    // reste propre à cette page. Ce vocabulaire vivait en CINQ copies — c'est exactement
    // ainsi que TYPE_LABEL avait fini en treize exemplaires divergents.
    const LIB_STATUT = window.SSUI.STATUT_DEVIS_LABEL;
    const STATUSES = {
      brouillon: { label: LIB_STATUT.brouillon, cls: 'badge' }, envoye_client: { label: LIB_STATUT.envoye_client, cls: 'badge-cyan' },
      relance_1: { label: LIB_STATUT.relance_1, cls: 'badge-warn' }, relance_2: { label: LIB_STATUT.relance_2, cls: 'badge-relance2' },
      signe: { label: LIB_STATUT.signe, cls: 'badge-ok' }, termine: { label: LIB_STATUT.termine, cls: 'badge-accent' },
      refuse: { label: LIB_STATUT.refuse, cls: 'badge-danger' }, annule: { label: LIB_STATUT.annule, cls: 'badge badge-eteint' },
    };
    const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
    const keyOf = (prenom, nom) => (String(nom || '').trim() + '|' + String(prenom || '').trim()).toLowerCase().replace(/\s+/g, ' ');
    // Suggestion de civilité d'après le prénom — volontairement CONSERVATRICE : renvoie '' (Non
    // précisé) dès le moindre doute, pour ne jamais risquer de mégenrer un client sur un document
    // commercial. Ce n'est qu'une pré-sélection ; Nicolas confirme/corrige toujours dans le menu.
    const PRENOMS_F = new Set('marie sophie julie camille sarah emma laura pauline manon lea lena clara anne catherine isabelle nathalie sandrine celine aurelie stephanie virginie sabrina patricia christine sylvie martine nicole francoise monique veronique caroline delphine elodie melanie audrey charlotte ines lucie oceane jade louise alice eva nina rose margaux amelie justine fanny elise claire helene agnes brigitte laurence corinne valerie florence beatrice chantal jacqueline'.split(' '));
    const PRENOMS_M = new Set('jean pierre michel philippe alain patrick nicolas christophe david laurent stephane pascal frederic eric olivier thierry sebastien julien vincent francois daniel bernard claude marc antoine thomas maxime alexandre guillaume romain kevin anthony jerome gilles bruno didier yannick benoit fabrice cedric jonathan quentin hugo lucas louis arthur paul gabriel raphael nathan theo mathis enzo clement baptiste damien florian mickael jordan gerard andre rene georges robert jacques henri christian serge guy'.split(' '));
    const normPrenom = (p) => String(p || '').trim().toLowerCase().split(/[\s-]/)[0].normalize('NFD').replace(/[̀-ͯ]/g, '');
    function guessCivilite(prenom) {
      const p = normPrenom(prenom);
      if (PRENOMS_F.has(p)) return 'Madame';
      if (PRENOMS_M.has(p)) return 'Monsieur';
      return '';
    }
    /* ⚠️ PAS d'« À relancer » ni de « Chaud » : l'ERP les CALCULE (relance due, client très intéressé)
       et les dit sur la liste et la fiche. Posée à la main, une étiquette reste quand ce n'est plus
       vrai — un client relancé hier restait « À relancer ». Les étiquettes déjà posées ne sont pas
       effacées : elles s'affichent toujours, seuls les raccourcis disparaissent (25/10/2026). */
    const TAG_PRESETS = ['Gros chantier', 'Client pro', 'Rénovation TVA 6%', "Difficile d'accès"];
    const initials = (p, n) => ((p || '')[0] || '') + ((n || '')[0] || '') || '?';

    let DIRECTORY = [];   // [{key, prenom, nom, contact, devis:[], stats, overlay}]
    let selectedKey = null;
    let FACTURES = [];
    const FULL_CACHE = new Map(); // devisId -> devis complet (chargé à la demande pour photos/notes)
    /* ⚠️ L'ARGENT ET L'ACTION D'UN CLIENT VIENNENT D'assets/js/actions.js (bilanDevis, chiffres,
       prochaineAction) — les mêmes définitions que le tableau de bord. La page avait SES calculs :
       son « CA signé » comptait les devis archivés, son « CA » les devis refusés (25/10/2026). */
    let DEVIS_N = [];
    const ACT = window.SSActions.creer({ factures: () => FACTURES, devis: () => DEVIS_N });

    // Recherche SANS accents (« detrempe » trouve « Détrempé »), mot par mot.
    const sansAccent = (t) => String(t || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().trim();
    const chiffresSeuls = (t) => String(t || '').replace(/\D/g, '');

    /* ── DOUBLONS PROBABLES ──
       La clé d'un client est « nom|prénom » : une faute de frappe, un accent ou un prénom et un
       nom inversés suffisent à créer deux clients pour une seule personne (« Depptre Quentin » et
       « Détrempé Quentin » dans la vraie liste). L'ERP ne fusionne RIEN tout seul : il signale. */
    // La règle vit dans ui.js depuis le 27/10/2026 : les demandes de RDV signalent les mêmes doublons
    // (règle 54), et deux copies d'une règle finissent par ne plus dire la même chose (règle 10).
    const raisonDoublon = window.SSUI.raisonDoublon;
    function doublonsProbables() {
      const out = [];
      for (let i = 0; i < DIRECTORY.length; i++) for (let j = i + 1; j < DIRECTORY.length; j++) {
        const r = raisonDoublon(DIRECTORY[i].contact, DIRECTORY[j].contact);
        if (r) out.push({ a: DIRECTORY[i], b: DIRECTORY[j], raison: r });
      }
      return out;
    }

    function badge(st) { const s = STATUSES[st] || STATUSES.brouillon; return `<span class="badge ${s.cls}">${s.label}</span>`; }

    async function load() {
      const rawDevis = await SS.listDevis();
      const overlays = await SS.listClients();
      FACTURES = await SS.listFactures();
      const map = new Map();
      DEVIS_N = (rawDevis || []).map(window.SSUI.normDevis);
      const NORM = new Map(DEVIS_N.map(n => [n.id, n]));

      (rawDevis || []).forEach(d => {
        const prenom = d.client_prenom || (d.client && d.client.prenom) || '';
        const nom = d.client_nom || (d.client && d.client.nom) || '';
        if (!prenom && !nom) return;
        const key = keyOf(prenom, nom);
        if (!map.has(key)) map.set(key, { key, prenom, nom, devis: [], overlay: null });
        const entry = map.get(key);
        entry.devis.push({
          id: d.id, statut: d.statut || 'brouillon',
          ttc: d.total_ttc || (d.calculs && d.calculs.total_ttc) || 0,
          date: d.date_modification || d.date_creation || '',
          contact: d.client || null,
          photos: d.photos_count || 0, comments: d.comments_count || 0,
          chantier: d.chantier || null,
          // De quoi parle ce devis, et qui l'a fait. Sans ça, l'historique d'un client alignait
          // trois lignes « #numéro · date · montant » impossibles à distinguer sans les ouvrir.
          resume: (window.SSUI.resumeDevis && window.SSUI.resumeDevis(d)) || '',
          vendeur: SELLER_LABELS[d.seller_principal] || '',
          n: NORM.get(d.id),   // la ligne normalisée : c'est elle que lisent l'action et le bilan
        });
      });

      // fusion des fiches overlay (contact enrichi, notes, et clients sans devis)
      (overlays || []).forEach(o => {
        if (!map.has(o.key)) map.set(o.key, { key: o.key, prenom: o.prenom, nom: o.nom, devis: [], overlay: o });
        else map.get(o.key).overlay = o;
      });

      DIRECTORY = [...map.values()].map(e => {
        e.devis.sort((a, b) => (b.date || '').localeCompare(a.date || ''));
        const latest = e.devis[0];
        const o = e.overlay || {};
        // Agrège les coordonnées sur TOUS les devis (du plus récent au plus ancien,
        // première valeur non vide retenue par champ), puis l'overlay est prioritaire.
        const agg = {};
        e.devis.forEach(dv => {
          const cc = dv.contact || {};
          if (cc.telephone && !agg.telephone) agg.telephone = cc.telephone;
          if (cc.email && !agg.email) agg.email = cc.email;
          if (cc.adresse && !agg.adresse && (cc.adresse.rue || cc.adresse.ville || cc.adresse.code_postal)) agg.adresse = cc.adresse;
          if (cc.type_bien && !agg.type_bien) agg.type_bien = cc.type_bien;
        });
        // ⚠️ On repart de la fiche ENTIÈRE (`...o`) au lieu d'énumérer les champs un par un.
        // L'ancienne version reconstruisait une liste fermée (prénom, nom, tél, email, adresse,
        // type de bien, notes, tags) : tout champ absent de cette liste était SILENCIEUSEMENT
        // perdu à l'affichage. C'est ce qui donnait l'impression que la CIVILITÉ et la FORMULE
        // ne s'enregistraient pas — elles partaient bien en base, mais ne revenaient jamais à
        // l'écran. Les échanges e-mail auraient subi le même sort. Avec l'étalement, tout champ
        // ajouté plus tard à la fiche survit automatiquement.
        const adresseFiche = o.adresse && (o.adresse.rue || o.adresse.ville || o.adresse.code_postal) ? o.adresse : null;
        e.contact = Object.assign({}, o, {
          prenom: o.prenom || e.prenom, nom: o.nom || e.nom,
          telephone: o.telephone || agg.telephone || '',
          email: o.email || agg.email || '',
          // Une adresse de fiche VIDE ne doit pas masquer celle relevée sur les devis.
          adresse: adresseFiche || agg.adresse || {},
          type_bien: o.type_bien || agg.type_bien || '',
          notes: o.notes || '', tags: o.tags || [],
        });
        e.bilan = ACT.bilanDevis(e.devis.map(x => x.n).filter(Boolean));
        e.stats = {
          count: e.devis.length,
          caSigne: e.bilan.signe,
          signes: e.bilan.nbSignes,
          last: latest ? latest.date : (o.date_modification || ''),
        };
        const adr = e.contact.adresse || {};
        e.recherche = sansAccent([e.contact.prenom, e.contact.nom, e.contact.email, e.contact.telephone, chiffresSeuls(e.contact.telephone),
          adr.rue, adr.code_postal, adr.ville, e.contact.type_bien, (e.contact.tags || []).join(' '), e.devis.map(x => x.id).join(' ')].filter(Boolean).join(' '));
        return e;
      });

      // Recherche pré-remplie (ex. depuis la recherche globale Ctrl+K : clients.html?q=Nom).
      const qParam = new URLSearchParams(location.search).get('q');
      if (qParam && el('search')) el('search').value = qParam;
      renderKPIs(); renderList();
      if (selectedKey) renderDetail(selectedKey, { sansHistorique: true });
    }

    function renderKPIs() {
      const totalClients = DIRECTORY.length;
      const actifs = DIRECTORY.filter(c => c.stats.signes > 0).length;
      // Le même total que « Signé depuis toujours » du tableau de bord (archivés exclus).
      const ca = ACT.chiffres().caSigne;
      const top = DIRECTORY.slice().sort((a, b) => b.stats.caSigne - a.stats.caSigne)[0];
      el('kpis').innerHTML = `
        <div class="kpi accent"><div class="kpi-label">Clients</div><div class="kpi-value">${totalClients}</div></div>
        <div class="kpi" title="Clients qui ont au moins un devis signé ou terminé"><div class="kpi-label">Ont signé</div><div class="kpi-value">${actifs}</div></div>
        <div class="kpi gold"><div class="kpi-label">CA signé</div><div class="kpi-value">${fmtEur(ca)}</div></div>
        <div class="kpi"><div class="kpi-label">Top client</div><div class="kpi-value" style="font-size:var(--fs-md)">${top && top.stats.caSigne > 0 ? esc(top.contact.prenom + ' ' + top.contact.nom) : '—'}</div></div>`;
      if (window.SSUI.animateKpis) window.SSUI.animateKpis(el('kpis'));   // odometre partage (coup de frais)
    }

    function renderList() {
      const mots = sansAccent(el('search').value).split(/\s+/).filter(Boolean);
      const sort = el('sort').value;
      let rows = DIRECTORY.slice();
      // Chaque mot doit se trouver quelque part : nom, ville, code postal, téléphone, e-mail,
      // étiquette ou numéro de devis.
      if (mots.length) rows = rows.filter(c => mots.every(m => c.recherche.indexOf(m) >= 0));
      rows.sort((a, b) => {
        if (sort === 'ca') return b.stats.caSigne - a.stats.caSigne;
        if (sort === 'nom') return (a.contact.nom || '').localeCompare(b.contact.nom || '');
        return (b.stats.last || '').localeCompare(a.stats.last || '');
      });
      /* A · CHAQUE LIGNE DIT QUOI FAIRE. « 1 devis · 0,00 € » ne disait rien (et comptait les
         devis refusés). La ligne dit maintenant : où (la ville), quoi faire (la prochaine action du
         client, même phrase et même couleur que sur le tableau de bord) et ce qu'il doit encore
         (notes de crédit déduites). */
      el('list').innerHTML = rows.length ? rows.map(c => {
        const b = c.bilan, a = b.action;
        const ville = (c.contact.adresse && c.contact.adresse.ville) || '';
        const quoi = !c.devis.length ? 'Aucun devis' : (a ? a.txt : 'Rien à faire');
        const nom = `${c.contact.prenom || ''} ${c.contact.nom || ''}`.trim() || 'Sans nom';
        return `
        <div class="crm-item ${c.key === selectedKey ? 'active' : ''}" role="button" tabindex="0" data-key="${esc(c.key)}" aria-label="${esc(nom + ' — ' + quoi)}">
          <div class="avatar">${esc(initials(c.contact.prenom, c.contact.nom)).toUpperCase()}</div>
          <div class="ci-main">
            <div class="ci-name"><span class="ci-nom">${esc(nom)}</span></div>
            <div class="ci-sub">${ville ? `<span class="ci-ville">${esc(ville)}</span>` : ''}<span class="ci-act ${a ? '' : 'rien'}" style="${a ? '--ac:' + a.color : ''}" title="${esc(a ? (a.titre || a.txt) : quoi)}">${esc(quoi)}</span></div>
          </div>
          <div class="ci-droite">${c.devis[0] ? badge(c.devis[0].statut) : ''}${!c.overlay ? `<span class="ci-todo" title="Client déduit de ses devis : sa fiche (civilité, formule de salutation, étiquettes, notes) n'est pas encore complétée">à compléter</span>` : ''}${b.resteDu > 0.005 ? `<span class="ci-du" title="Reste à encaisser sur ses factures, notes de crédit déduites">doit ${fmtEur(b.resteDu)}</span>` : ''}</div>
        </div>`;
      }).join('') : '<div class="empty-detail-msg">Aucun client.</div>';
    }
    // Clic ET clavier (Entrée, Espace) : une ligne était un simple bloc cliquable, inatteignable au clavier.
    el('list').addEventListener('click', (e) => { const it = e.target.closest('.crm-item'); if (it && quitterFicheOk()) renderDetail(it.dataset.key); });
    el('list').addEventListener('keydown', (e) => {
      if (e.key !== 'Enter' && e.key !== ' ') return;
      const it = e.target.closest('.crm-item');
      if (it) { e.preventDefault(); if (quitterFicheOk()) renderDetail(it.dataset.key); }
    });

    /* ── C · « À RANGER » ── Le grand panneau de droite restait vide tant qu'aucun client n'était
       ouvert. Il montre ce qui mérite un coup de balai : rien ne s'y modifie, un clic ouvre la fiche. */
    function htmlARanger() {
      const MAX = 8;
      const doublons = doublonsProbables();
      const vivant = (c) => c.devis.some(d => !(d.n && d.n.archive) && !['refuse', 'annule'].includes(d.statut));
      const sansContact = DIRECTORY.filter(c => vivant(c) && !String(c.contact.telephone || '').trim() && !String(c.contact.email || '').trim());
      const sansDevis = DIRECTORY.filter(c => c.overlay && !c.devis.length);
      const lien = (c) => `<button type="button" data-ouvrir="${esc(c.key)}">${esc(`${c.contact.prenom || ''} ${c.contact.nom || ''}`.trim() || 'Sans nom')}</button>`;
      const bloc = (titre, aide, lignes) => !lignes.length ? '' : `<div class="ar-bloc"><h4>${titre} · ${lignes.length}</h4><p>${aide}</p>`
        + lignes.slice(0, MAX).join('') + (lignes.length > MAX ? `<div class="ar-plus">+ ${lignes.length - MAX} autre(s)</div>` : '') + '</div>';
      const html = bloc('Doublons probables', 'Deux fiches pour une même personne ? Ouvre-les pour comparer ; rien n\u2019est fusionné tout seul.',
          doublons.map(d => `<div class="ar-ligne">${lien(d.a)} <span aria-hidden="true">↔</span> ${lien(d.b)}<span class="ar-why">${esc(d.raison)}</span></div>`))
        + bloc('Sans téléphone ni e-mail', 'Un client avec un devis en cours qu\u2019on ne saurait pas joindre.',
          sansContact.map(c => `<div class="ar-ligne">${lien(c)}<span class="ar-why">${c.devis.length} devis</span></div>`))
        + bloc('Fiches sans aucun devis', 'Un prospect, un essai ou un doublon ?',
          sansDevis.map(c => `<div class="ar-ligne">${lien(c)}<span class="ar-why">fiche seule</span></div>`));
      return `<div class="ar"><div class="ar-tete"><b>À ranger</b><span>Sélectionne un client à gauche pour voir sa fiche.</span></div>`
        + (html || `<div class="ar-vide">${icon('check', 18)} Rien à ranger : pas de doublon probable, tout le monde est joignable.</div>`) + '</div>';
    }
    function renderAccueil() {
      const d = el('detail');
      d.classList.add('empty-detail');
      d.innerHTML = htmlARanger();
    }
    el('detail').addEventListener('click', (e) => { const b = e.target.closest('[data-ouvrir]'); if (b) renderDetail(b.dataset.ouvrir); });

    /* ── TÉLÉPHONE : « RETOUR » REVIENT À LA LISTE ──
       La fiche y remplace la liste. Le geste « retour » quittait la PAGE (même piège que
       l'assistant, 25/10/2026) : ouvrir une fiche ajoute désormais une étape d'historique, que
       « retour » et « ← Tous les clients » retirent. Revenir d'un devis rouvre la fiche qu'on
       regardait. Au bureau, les deux colonnes cohabitent : on ne touche pas à l'historique. */
    const MAITRE_DETAIL = () => window.matchMedia('(max-width: 920px)').matches;
    let ficheHistorique = false;
    window.addEventListener('popstate', () => {
      if (!ficheHistorique) return;
      ficheHistorique = false;
      fermerFiche({ historique: true });
    });

    /* ── UNE SAISIE ENTAMÉE NE SE PERD PAS SANS UN MOT ── La fiche s'enregistre par son bouton : la quitter
       (un autre client dans la liste, « ← Tous les clients », « ← Accueil des clients ») jetait les
       coordonnées tapées et le mail collé, sans rien dire. On compare chaque champ à la valeur qu'il avait à
       l'ouverture (`defaultValue`, l'attribut du gabarit) : rien n'est retenu à part, donc rien à tenir à jour.
       ⚠️ Un menu sans option marquée affiche la PREMIÈRE : c'est elle, sa valeur d'ouverture. Et le mail en
       correction se compare au mail enregistré — le formulaire est rempli par le script, pas par la saisie. */
    function champChange(x) {
      if (x.type === 'checkbox' || x.type === 'radio') return x.checked !== x.defaultChecked;
      if (x.tagName === 'SELECT') { const d = [...x.options].findIndex((o) => o.defaultSelected); return x.selectedIndex !== (d < 0 ? 0 : d); }
      return x.value !== x.defaultValue;
    }
    function ficheModifiee() {
      const det = el('detail');
      if (!selectedKey || det.classList.contains('empty-detail')) return false;
      if ([...det.querySelectorAll('[id^="f_"]')].some(champChange)) return true;
      const texte = el('mailTexte'), objet = el('mailObjet');
      if (!texte) return false;
      if (MAIL_EDITE) {
        const c = DIRECTORY.find((x) => x.key === CLE_FICHE);
        const m = ((c && c.contact.mails) || []).find((x) => String(x.id) === String(MAIL_EDITE)) || {};
        return texte.value !== (m.texte || '') || (objet && objet.value !== (m.objet || ''));
      }
      return texte.value.trim() !== '';
    }
    function quitterFicheOk() {
      return !ficheModifiee() || confirm('Quitter cette fiche sans enregistrer ce que tu as modifié ?');
    }
    /** « ← Tous les clients » (téléphone) et « ← Accueil des clients » (bureau) : la page telle qu'à
     *  l'arrivée. Au bureau, l'adresse perd aussi `?key=` / `?q=` / `?mail=` (sinon un rechargement
     *  rouvrirait la fiche ou remettrait la recherche) et la recherche se vide : c'est l'ACCUEIL. Sur
     *  téléphone la recherche reste : on revient choisir un autre résultat de la même recherche. */
    window.retourAccueil = function () {
      if (!quitterFicheOk()) return;
      if (!MAITRE_DETAIL()) {
        try {
          const u = new URL(location.href);
          ['key', 'q', 'mail'].forEach((k) => u.searchParams.delete(k));
          if (u.href !== location.href) history.replaceState(history.state, '', u.pathname + u.search + u.hash);
        } catch (e) {}
        const rech = el('search');
        if (rech && rech.value) rech.value = '';
        const liste = el('list');
        if (liste) liste.scrollTop = 0;
      }
      fermerFiche();
    };
    /** Ferme la fiche : la liste sur téléphone, « À ranger » au bureau. Sans garde — c'est le geste
     *  « retour » du téléphone (l'étape d'historique est déjà partie) ; les boutons passent par
     *  `retourAccueil`, qui demande avant de jeter une saisie. */
    window.fermerFiche = function (o) {
      if (!(o && o.historique) && ficheHistorique) { ficheHistorique = false; try { history.back(); } catch (e) {} }

          <div>
            <h2>${esc(ct.prenom)} ${esc(ct.nom)}<button class="ci-copy" onclick="ssCopy(${SSUI.jsAttr(((ct.prenom || '') + ' ' + (ct.nom || '')).trim())}, ${SSUI.jsAttr('Nom')})" title="Copier le nom" aria-label="Copier le nom">${icon('copy', 13)}</button></h2>
            <div class="text-muted" style="font-size:var(--fs-2xs)">${c.stats.count} devis · dernier ${fmtDate(c.stats.last)}</div>
            ${c.bilan.action ? `<a class="fiche-action" style="--ac:${c.bilan.action.color}" href="vue.html?id=${encodeURIComponent(c.bilan.action.devis_id)}${c.bilan.action.hash || ''}" title="${esc(c.bilan.action.titre || c.bilan.action.txt)} — devis #${esc(c.bilan.action.devis_id)}">${esc(c.bilan.action.txt)}</a>` : ''}
            ${(ct.tags || []).length ? `<div class="row wrap" style="gap:0.3rem;margin-top:0.4rem;">${ct.tags.map(t => `<span class="badge badge-purple">${esc(t)}</span>`).join('')}</div>` : ''}

            <button class="btn btn-primary btn-sm" onclick="newDevisFor(${SSUI.jsAttr(key)})">${icon('plus', 14)} Nouveau devis</button>

        <div class="detail-body">
          ${/* B · L'ARGENT DU CLIENT, avec les définitions du cockpit (bilanDevis) : ce qu'il a signé,
