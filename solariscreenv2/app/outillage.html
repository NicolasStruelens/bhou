<!DOCTYPE html>
<html lang="fr" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SolariScreen — Outillage & références</title>
  <link rel="icon" type="image/png" href="../assets/img/logo-solariscreen.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600;700&family=Orbitron:wght@600;800&display=swap" rel="stylesheet">
  <script src="../assets/js/theme.js"></script>
  <link rel="stylesheet" href="../assets/css/tokens.css">
  <link rel="stylesheet" href="../assets/css/theme-dark.css">
  <link rel="stylesheet" href="../assets/css/theme-light.css">
  <link rel="stylesheet" href="../assets/css/base.css">
  <style>
    .toolbar { display: flex; gap: var(--sp-3); align-items: center; flex-wrap: wrap; margin-bottom: var(--sp-4); }
    .toolbar .search { flex: 1; min-width: 220px; position: relative; }
    .toolbar .search input { padding-left: 2.2rem; }
    .toolbar .search > svg { position: absolute; left: 0.7rem; top: 50%; transform: translateY(-50%); width: 14px; height: 14px; color: var(--text-subtle); pointer-events: none; }
    .filters { display: flex; gap: 0.35rem; flex-wrap: wrap; margin-bottom: var(--sp-4); }
    .chip:hover { border-color: var(--accent-2); color: var(--accent-2); }
    .chip.active { background: var(--accent-2); color: var(--bg); border-color: var(--accent-2); }

    /* ── Grille de références ── */
    .ot-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: var(--sp-4); }
    .ot-card { border: 1px solid var(--border); border-radius: var(--r-md); overflow: hidden; background: var(--surface-2); display: flex; flex-direction: column; transition: all var(--t-fast); --tick-color: var(--accent-2); }
    .ot-card:hover { border-color: color-mix(in srgb, var(--accent-2) 55%, var(--border)); box-shadow: var(--glow-soft); }
    /* Vignette photo (ou pictogramme si aucune photo) */
    .ot-photo { position: relative; aspect-ratio: 4 / 3; background: var(--surface); display: grid; place-items: center; overflow: hidden; border-bottom: 1px solid var(--border); }
    .ot-photo img { width: 100%; height: 100%; object-fit: cover; cursor: zoom-in; }
    .ot-photo .ph { color: var(--text-subtle); opacity: 0.5; }
    .ot-photo .count { position: absolute; right: 6px; bottom: 6px; background: color-mix(in srgb, var(--bg) 78%, transparent); border: 1px solid var(--border); border-radius: var(--r-sm); font-family: var(--font-mono); font-size: var(--fs-3xs); padding: 1px 6px; color: var(--text-muted); backdrop-filter: blur(3px); }
    .ot-body { padding: var(--sp-3) var(--sp-3) var(--sp-3); display: flex; flex-direction: column; gap: var(--sp-2); flex: 1; }
    .ot-nom { font-weight: 700; font-size: var(--fs-md); line-height: 1.25; }
    .ot-ref { display: flex; align-items: center; gap: 0.4rem; flex-wrap: wrap; }
    .ot-ref code { font-family: var(--font-mono); font-size: var(--fs-xs); background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-sm); padding: 2px 7px; color: var(--accent-2-ink); word-break: break-all; }
    .ot-ref .lab { font-family: var(--font-mono); font-size: var(--fs-3xs); text-transform: uppercase; letter-spacing: 0.06em; color: var(--text-subtle); }
    .ot-copy { background: transparent; border: 1px solid var(--border); border-radius: var(--r-sm); color: var(--text-muted); padding: 2px 5px; display: inline-flex; cursor: pointer; }
    .ot-copy:hover { border-color: var(--accent-2); color: var(--accent-2-ink); }
    .ot-line { font-size: var(--fs-sm); color: var(--text-muted); display: flex; align-items: center; gap: 0.4rem; }
    .ot-line svg { flex: none; color: var(--text-subtle); }
    .ot-notes { font-size: var(--fs-sm); color: var(--text-muted); background: var(--surface); border: 1px dashed var(--border); border-radius: var(--r-sm); padding: var(--sp-2) var(--sp-3); line-height: 1.45; white-space: pre-wrap; }
    .ot-price { font-family: var(--font-mono); font-weight: 700; color: var(--accent-2-ink); }
    .ot-actions { margin-top: auto; display: flex; gap: 0.4rem; align-items: center; padding-top: var(--sp-2); border-top: 1px solid var(--border); }
    .ot-actions .grow { flex: 1; }
    .icon-btn2 { background: transparent; border: 1px solid var(--border); border-radius: var(--r-sm); color: var(--text-muted); padding: 0.4rem 0.5rem; display: inline-flex; cursor: pointer; }
    .icon-btn2:hover { border-color: var(--accent-2); color: var(--accent-2-ink); }
    .icon-btn2.danger:hover { border-color: var(--danger); color: var(--danger); }

    /* ── Modale d'ajout / édition ── */
    .ot-overlay { position: fixed; inset: 0; background: color-mix(in srgb, var(--bg) 72%, transparent); backdrop-filter: blur(4px); z-index: 60; display: none; align-items: flex-start; justify-content: center; padding: var(--sp-5) var(--sp-3); overflow-y: auto; }
    .ot-overlay.open { display: flex; }
    .ot-dialog { width: 100%; max-width: 560px; background: var(--surface); border: 1px solid var(--border-strong); border-radius: var(--r-lg); box-shadow: var(--shadow-lg, var(--shadow)); }
    .ot-dialog-head { display: flex; align-items: center; justify-content: space-between; padding: var(--sp-4) var(--sp-4) var(--sp-3); border-bottom: 1px solid var(--border); }
    .ot-dialog-head h2 { font-family: var(--font-display); font-size: var(--fs-lg); }
    .ot-dialog-body { padding: var(--sp-4); display: flex; flex-direction: column; gap: var(--sp-3); }
    .ot-field label { display: block; font-family: var(--font-mono); font-size: var(--fs-2xs); text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-subtle); margin-bottom: 0.3rem; }
    .ot-row2 { display: grid; grid-template-columns: 1fr 1fr; gap: var(--sp-3); }
    .ot-thumbs { display: flex; flex-wrap: wrap; gap: 0.5rem; }
    .ot-thumb { position: relative; width: 68px; height: 68px; border-radius: var(--r-sm); overflow: hidden; border: 1px solid var(--border); }
    .ot-thumb img { width: 100%; height: 100%; object-fit: cover; }
    .ot-thumb button { position: absolute; top: 2px; right: 2px; width: 18px; height: 18px; border-radius: 50%; border: none; background: color-mix(in srgb, var(--bg) 70%, transparent); color: var(--danger); cursor: pointer; display: grid; place-items: center; font-size: 12px; line-height: 1; }
    .ot-photo-add { width: 68px; height: 68px; border: 1px dashed var(--border-strong); border-radius: var(--r-sm); display: grid; place-items: center; color: var(--text-subtle); cursor: pointer; background: var(--surface-2); }
    .ot-photo-add:hover { border-color: var(--accent-2); color: var(--accent-2-ink); }
    .ot-dialog-foot { display: flex; justify-content: space-between; gap: var(--sp-2); padding: var(--sp-3) var(--sp-4) var(--sp-4); border-top: 1px solid var(--border); }

    /* ── Lightbox photo ── */
    .lb { position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 80; display: none; align-items: center; justify-content: center; }
    .lb.open { display: flex; }
    .lb img { max-width: 92vw; max-height: 86vh; border-radius: var(--r-md); }
    .lb .lb-close { position: absolute; top: 16px; right: 20px; background: none; border: none; color: #fff; font-size: 28px; cursor: pointer; }
    .lb .lb-nav { position: absolute; top: 50%; transform: translateY(-50%); background: rgba(255,255,255,0.1); border: none; color: #fff; font-size: 34px; width: 52px; height: 52px; border-radius: 50%; cursor: pointer; }
    .lb .lb-prev { left: 16px; } .lb .lb-next { right: 16px; }

    @media (max-width: 560px) {
      .ot-grid { grid-template-columns: 1fr 1fr; gap: var(--sp-3); }
      .ot-notes { display: none; }               /* on garde les cartes compactes sur petit écran */
      .ot-row2 { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="fx-grid"></div>

  <header class="app-header">
    <div class="brand">
      <span class="brand-logo"><img src="../assets/img/logo-solariscreen.png" alt="" onerror="this.style.display='none'"></span>
      <div>
        <h1><a href="dashboard.html">SOLARISCREEN</a></h1>
        <div class="module">Outillage &amp; références</div>
      </div>
    </div>
    <div class="header-actions">
      <span id="quickNav"></span>
      <span id="themeToggle"></span>
      <a class="btn btn-ghost btn-sm" href="dashboard.html"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg> Dashboard</a>
    </div>
  </header>

  <main class="container">
    <div class="kpis" id="kpis"></div>

    <div class="toolbar">
      <div class="search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <label for="search" class="sr-only">Rechercher une référence</label>
        <input class="input" id="search" placeholder="Rechercher : nom, référence, fournisseur…" oninput="render()">
      </div>
      <button class="btn btn-primary btn-sm" onclick="openForm()"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg> Ajouter une référence</button>
    </div>
    <div class="filters" id="catFilters"></div>

    <section class="section">
      <div class="section-head">
        <span class="section-title">Mes références</span>
        <span class="section-code">SS // OUTILLAGE</span>
        <span class="section-sub" id="resultCount">—</span>
      </div>
      <div class="section-body">
        <div class="ot-grid" id="grid"></div>
      </div>
    </section>
  </main>

  <!-- ══════ MODALE AJOUT / ÉDITION ══════ -->
  <div class="ot-overlay" id="overlay" role="dialog" aria-modal="true" aria-labelledby="dialogTitle">
    <div class="ot-dialog">
      <div class="ot-dialog-head">
        <h2 id="dialogTitle">Nouvelle référence</h2>
        <button class="icon-btn2" onclick="closeForm()" aria-label="Fermer">✕</button>
      </div>
      <div class="ot-dialog-body">
        <div class="ot-field">
          <label for="fNom">Nom / désignation *</label>
          <input class="input" id="fNom" placeholder="Ex : Vis inox tête fraisée 4×40">
        </div>
        <div class="ot-row2">
          <div class="ot-field">
            <label for="fCat">Catégorie</label>
            <select class="select" id="fCat"></select>
          </div>
          <div class="ot-field">
            <label for="fRef">Référence</label>
            <input class="input" id="fRef" placeholder="Ex : 0179 4 40">
          </div>
        </div>
        <div class="ot-row2">
          <div class="ot-field">
            <label for="fFour">Fournisseur / plateforme</label>
            <input class="input" id="fFour" list="fourList" placeholder="Ex : Würth, ManoMano…">
            <datalist id="fourList"></datalist>
          </div>
          <div class="ot-field">
            <label for="fPrix">Prix indicatif (€)</label>
            <input class="input" id="fPrix" inputmode="decimal" placeholder="Ex : 12,90">
          </div>
        </div>
        <div class="ot-field">
          <label for="fUrl">Lien d'achat (page produit)</label>
          <input class="input" id="fUrl" type="url" inputmode="url" placeholder="https://…">
        </div>
        <div class="ot-field">
          <label for="fNotes">Notes (usage, dimensions, quantité par boîte…)</label>
          <textarea class="input" id="fNotes" rows="2" placeholder="Ex : pour fixation caisson sur béton — boîte de 200"></textarea>
        </div>
        <div class="ot-field">
          <label>Photos</label>
          <div class="ot-thumbs" id="fThumbs"></div>
          <input type="file" id="fPhoto" accept="image/*" multiple style="display:none" onchange="onPhotos(event)">
        </div>
      </div>
      <div class="ot-dialog-foot">
        <button class="btn btn-danger btn-sm" id="fDelete" onclick="deleteFromForm()" style="display:none">Supprimer</button>
        <div style="flex:1"></div>
        <button class="btn btn-ghost btn-sm" onclick="closeForm()">Annuler</button>
        <button class="btn btn-primary btn-sm" id="fSave" onclick="saveForm()">Enregistrer</button>
      </div>
    </div>
  </div>

  <!-- ══════ LIGHTBOX ══════ -->
  <div class="lb" id="lb" role="dialog" aria-label="Photo agrandie">
    <button class="lb-close" onclick="lbClose()" aria-label="Fermer">✕</button>
    <button class="lb-nav lb-prev" onclick="lbNav(-1)" aria-label="Précédente">‹</button>
    <img id="lbImg" src="" alt="Photo de la référence">
    <button class="lb-nav lb-next" onclick="lbNav(1)" aria-label="Suivante">›</button>
  </div>

  <script src="../assets/js/ui.js"></script>
  <script src="../assets/js/nav.js"></script>
  <script src="../assets/js/api.js"></script>
  <script>
    const SS = window.SS;
    const { mountThemeToggle } = window.SSTheme;
    const { fmtDate, el, setText, icon, toast, compressImage } = window.SSUI;
    mountThemeToggle(document.getElementById('themeToggle'));
    window.SSNav.mount(document.getElementById('quickNav'));

    const CATS = ['Visserie & boulonnerie', 'Chevilles & fixations', 'Perçage & découpe', 'Électroportatif', 'Mesure & traçage', 'Consommables', 'Quincaillerie', 'Sécurité / EPI', 'Autre'];
    const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
    const escAttr = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    // N'ouvrir que des liens http(s) — jamais un javascript:/data: saisi par erreur (défense en profondeur).
    const safeUrl = u => { const s = String(u || '').trim(); return /^https?:\/\//i.test(s) ? s : ''; };
    const fmtPrix = p => { const n = parseFloat(String(p).replace(',', '.')); return isNaN(n) ? '' : n.toLocaleString('fr-BE', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + ' €'; };

    let ITEMS = [];
    let activeCat = 'all';
    let editing = null;      // objet en cours d'édition, ou null (création)
    let formPhotos = [];     // photos (dataURL) de l'item en cours d'édition

    async function load() {
      ITEMS = (await SS.listOutillage()) || [];
      // Peuple la liste des catégories + le datalist fournisseurs pour l'autocomplétion
      const fourSet = [...new Set(ITEMS.map(o => (o.fournisseur || '').trim()).filter(Boolean))].sort();
      el('fourList').innerHTML = fourSet.map(f => `<option value="${escAttr(f)}">`).join('');
      el('fCat').innerHTML = CATS.map(c => `<option value="${escAttr(c)}">${esc(c)}</option>`).join('');
      renderKpis();
      renderFilters();
      render();
    }

    function renderKpis() {
      const cats = new Set(ITEMS.map(o => o.categorie).filter(Boolean));
      const withLink = ITEMS.filter(o => safeUrl(o.url)).length;
      el('kpis').innerHTML = `
        <div class="kpi gold"><div class="kpi-label">Références</div><div class="kpi-value">${ITEMS.length}</div></div>
        <div class="kpi accent"><div class="kpi-label">Catégories</div><div class="kpi-value">${cats.size}</div></div>
        <div class="kpi"><div class="kpi-label">Avec lien d'achat</div><div class="kpi-value">${withLink}</div></div>`;
    }

    function renderFilters() {
      const counts = {};
      ITEMS.forEach(o => { const c = o.categorie || 'Autre'; counts[c] = (counts[c] || 0) + 1; });
      const cats = CATS.filter(c => counts[c]);
      let html = `<button class="chip ${activeCat === 'all' ? 'active' : ''}" onclick="setCat('all')">Toutes · ${ITEMS.length}</button>`;
      html += cats.map(c => `<button class="chip ${activeCat === c ? 'active' : ''}" onclick="setCat('${escAttr(c)}')">${esc(c)} · ${counts[c]}</button>`).join('');
      el('catFilters').innerHTML = html;
    }
    window.setCat = (c) => { activeCat = c; renderFilters(); render(); };

    function filtered() {
      const q = (el('search').value || '').trim().toLowerCase();
      return ITEMS.filter(o => {
        if (activeCat !== 'all' && (o.categorie || 'Autre') !== activeCat) return false;
        if (!q) return true;
        return [o.nom, o.reference, o.fournisseur, o.categorie, o.notes].filter(Boolean).join(' ').toLowerCase().includes(q);
      });
    }

    function render() {
      const rows = filtered();
      setText('resultCount', rows.length + (rows.length > 1 ? ' références' : ' référence'));
      if (!ITEMS.length) {
        el('grid').innerHTML = `<div class="empty" style="grid-column:1/-1;">${icon('hammer', 34)}
          <div>Aucune référence pour l'instant.</div>
          <div class="hint">Ajoute tes vis, chevilles, forets… avec une photo, la référence exacte et le lien pour commander en 1 clic.</div>
          <button class="btn btn-primary" onclick="openForm()">${icon('plus', 14)} Ajouter ma première référence</button></div>`;
        return;
      }
      if (!rows.length) { el('grid').innerHTML = `<div class="empty" style="grid-column:1/-1;">${icon('search', 30)}<div>Aucune référence ne correspond.</div></div>`; return; }
      el('grid').innerHTML = rows.map(cardHtml).join('');
    }

    function cardHtml(o) {
      const photos = Array.isArray(o.photos) ? o.photos : [];
      const url = safeUrl(o.url);
      const prix = fmtPrix(o.prix);
      const photoBlock = photos.length
        ? `<img src="${escAttr(photos[0])}" alt="${escAttr(o.nom)}" onclick="lbOpen('${escAttr(o.id)}',0)">${photos.length > 1 ? `<span class="count">${photos.length} photos</span>` : ''}`
        : `<span class="ph">${icon('hammer', 40)}</span>`;
      const refBlock = o.reference
        ? `<div class="ot-ref"><span class="lab">Réf</span><code>${esc(o.reference)}</code>
            <button class="ot-copy" title="Copier la référence" onclick="ssCopy('${escAttr(o.reference)}','Référence')">${icon('save', 12)}</button></div>`
        : '';
      const fourBlock = o.fournisseur ? `<div class="ot-line">${icon('grid', 13)}<span>${esc(o.fournisseur)}</span>${prix ? ` · <span class="ot-price">${prix}</span>` : ''}</div>`
        : (prix ? `<div class="ot-line"><span class="ot-price">${prix}</span></div>` : '');
      const notes = o.notes ? `<div class="ot-notes">${esc(o.notes)}</div>` : '';
      const orderBtn = url
        ? `<a class="btn btn-primary btn-sm grow" href="${escAttr(url)}" target="_blank" rel="noopener">${icon('coin', 13)} Commander</a>`
        : `<span class="grow" style="font-size:var(--fs-2xs);color:var(--text-subtle);">Pas de lien d'achat</span>`;
      return `<div class="ot-card">
        <div class="ot-photo">${photoBlock}</div>
        <div class="ot-body">
          ${o.categorie ? `<span class="badge badge-cyan" style="align-self:flex-start;">${esc(o.categorie)}</span>` : ''}
          <div class="ot-nom">${esc(o.nom || 'Sans nom')}</div>
          ${refBlock}
          ${fourBlock}
          ${notes}
          <div class="ot-actions">
            ${orderBtn}
            <button class="icon-btn2" title="Modifier" onclick="openForm('${escAttr(o.id)}')" aria-label="Modifier">${icon('sliders', 14)}</button>
            <button class="icon-btn2 danger" title="Supprimer" onclick="removeItem('${escAttr(o.id)}')" aria-label="Supprimer">${icon('x', 14)}</button>
          </div>
        </div>
      </div>`;
    }

    // ── Formulaire ──
    window.openForm = (id) => {
      editing = id ? ITEMS.find(o => o.id === id) : null;
      formPhotos = editing && Array.isArray(editing.photos) ? editing.photos.slice() : [];
      setText('dialogTitle', editing ? 'Modifier la référence' : 'Nouvelle référence');
      el('fNom').value = editing ? (editing.nom || '') : '';
      el('fCat').value = editing ? (editing.categorie || CATS[0]) : CATS[0];
      el('fRef').value = editing ? (editing.reference || '') : '';
      el('fFour').value = editing ? (editing.fournisseur || '') : '';
      el('fPrix').value = editing ? (editing.prix != null ? String(editing.prix) : '') : '';
      el('fUrl').value = editing ? (editing.url || '') : '';
      el('fNotes').value = editing ? (editing.notes || '') : '';
      el('fDelete').style.display = editing ? '' : 'none';
      renderThumbs();
      el('overlay').classList.add('open');
      setTimeout(() => el('fNom').focus(), 60);
    };
    window.closeForm = () => { el('overlay').classList.remove('open'); editing = null; formPhotos = []; };
    el('overlay').addEventListener('click', (e) => { if (e.target === el('overlay')) closeForm(); });
    document.addEventListener('keydown', (e) => { if (e.key === 'Escape') { if (el('lb').classList.contains('open')) lbClose(); else if (el('overlay').classList.contains('open')) closeForm(); } });

    function renderThumbs() {
      el('fThumbs').innerHTML = formPhotos.map((p, i) =>
        `<div class="ot-thumb"><img src="${escAttr(p)}" alt=""><button type="button" onclick="removePhoto(${i})" aria-label="Retirer la photo">✕</button></div>`
      ).join('') + `<div class="ot-photo-add" onclick="document.getElementById('fPhoto').click()" title="Ajouter une photo">${icon('camera', 20)}</div>`;
    }
    window.removePhoto = (i) => { formPhotos.splice(i, 1); renderThumbs(); };
    window.onPhotos = async (e) => {
      const files = [...(e.target.files || [])];
      e.target.value = '';
      for (const f of files) {
        try { formPhotos.push(await compressImage(f, 1000, 0.7)); }
        catch (err) { toast('Photo illisible ignorée', 'warn'); }
      }
      renderThumbs();
    };

    window.saveForm = async () => {
      const nom = el('fNom').value.trim();
      if (!nom) { toast('Donne au moins un nom à la référence.', 'warn'); el('fNom').focus(); return; }
      const now = new Date().toISOString();
      const prixRaw = el('fPrix').value.trim().replace(',', '.');
      const prix = prixRaw === '' ? null : (isNaN(parseFloat(prixRaw)) ? null : parseFloat(prixRaw));
      const obj = Object.assign({}, editing || {}, {
        id: (editing && editing.id) || ('OUT-' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6)),
        nom: nom,
        categorie: el('fCat').value,
        reference: el('fRef').value.trim(),
        fournisseur: el('fFour').value.trim(),
        url: el('fUrl').value.trim(),
        prix: prix,
        notes: el('fNotes').value.trim(),
        photos: formPhotos.slice(),
        date_creation: (editing && editing.date_creation) || now,
        date_modification: now,
      });
      const btn = el('fSave'); btn.disabled = true;
      const res = await SS.saveOutillage(obj);
      btn.disabled = false;
      if (res.ok === false) { toast(res.error || 'Enregistrement impossible', 'error', 7000); return; }
      // Reflète immédiatement dans la liste locale (sans re-fetch : évite de perdre la modif si le
      // GET renvoyait une version pas encore propagée).
      const i = ITEMS.findIndex(o => o.id === obj.id);
      if (i !== -1) ITEMS[i] = obj; else ITEMS.unshift(obj);
      SS.logActivity({ action: 'outillage.save', entity_type: 'outillage', entity_id: obj.id, label: `Référence outillage « ${obj.nom} »` });
      toast(res.offline ? 'Enregistré (hors-ligne)' : 'Référence enregistrée ✓', res.offline ? 'warn' : 'ok');
      closeForm();
      renderKpis(); renderFilters(); render();
    };

    window.deleteFromForm = () => { if (editing) { const id = editing.id; closeForm(); removeItem(id); } };
    window.removeItem = async (id) => {
      const o = ITEMS.find(x => x.id === id);
      if (!o) return;
      if (!confirm(`Supprimer la référence « ${o.nom || 'sans nom'} » ?`)) return;
      const res = await SS.deleteOutillage(id);
      if (res.ok === false) { toast(res.error || 'Suppression impossible', 'error'); return; }
      ITEMS = ITEMS.filter(x => x.id !== id);
      toast(res.offline ? 'Supprimé (hors-ligne)' : 'Référence supprimée', 'ok');
      renderKpis(); renderFilters(); render();
    };

    // ── Lightbox ──
    let lbPhotos = [], lbIdx = 0;
    window.lbOpen = (id, i) => {
      const o = ITEMS.find(x => x.id === id); if (!o) return;
      lbPhotos = Array.isArray(o.photos) ? o.photos : []; lbIdx = i || 0;
      if (!lbPhotos.length) return;
      el('lbImg').src = lbPhotos[lbIdx];
      el('lb').classList.add('open');
    };
    window.lbClose = () => el('lb').classList.remove('open');
    window.lbNav = (d) => { if (!lbPhotos.length) return; lbIdx = (lbIdx + d + lbPhotos.length) % lbPhotos.length; el('lbImg').src = lbPhotos[lbIdx]; };
    el('lb').addEventListener('click', (e) => { if (e.target === el('lb')) lbClose(); });

    load();
  </script>
</body>
</html>
