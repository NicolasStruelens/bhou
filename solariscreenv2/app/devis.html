<!DOCTYPE html>
<html lang="fr" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SolariScreen — Devis</title>
  <link rel="icon" type="image/png" href="../assets/img/logo-solariscreen.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600;700&family=Orbitron:wght@600;800&display=swap" rel="stylesheet">
  <script src="../assets/js/theme.js"></script>
  <link rel="stylesheet" href="../assets/css/tokens.css">
  <link rel="stylesheet" href="../assets/css/theme-dark.css">
  <link rel="stylesheet" href="../assets/css/theme-light.css">
  <link rel="stylesheet" href="../assets/css/base.css">
  <link rel="stylesheet" href="../assets/css/document.css">
  <style>
    .sign-wrap { width: 210mm; max-width: 100%; margin: 0 auto var(--sp-5); }
    #sigCanvas { width: 100%; max-width: 500px; height: 160px; display: block; background: #fff; border: 1px solid var(--border-strong); border-radius: var(--r-sm); touch-action: none; cursor: crosshair; }
    .sig-accept { display: flex; gap: 0.6rem; align-items: flex-start; font-size: var(--fs-sm); color: var(--text-muted); }
    .sig-accept input { margin-top: 0.25rem; flex: none; width: 18px; height: 18px; }
    @media print { .sign-wrap { display: none !important; } }
  </style>
</head>
<body>
  <div class="fx-grid"></div>

  <!-- Barre d'outils (jamais imprimée) -->
  <div class="toolbar">
    <a class="btn btn-ghost btn-sm" href="dashboard.html"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg> Dashboard</a>
    <a class="btn btn-ghost btn-sm" id="editLink" href="#"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17 3a2.828 2.828 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5L17 3z"/></svg> Modifier</a>
    <a class="btn btn-ghost btn-sm" href="factures.html"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg> Facturer</a>
    <div class="spacer"></div>
    <label class="check"><input type="checkbox" id="togglePhotos" onchange="renderPhotos()"> Inclure les photos</label>
    <span id="quickNav"></span>
    <span id="themeToggle"></span>
    <button class="btn btn-primary btn-sm" onclick="printDoc()"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="6 9 6 2 18 2 18 9"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></svg> Imprimer / PDF</button>
  </div>

  <div class="paper-wrap"><div class="paper" id="paper">Chargement…</div></div>

  <div class="sign-wrap">
    <section class="section ticked" id="signBlock">
      <div class="section-head"><span class="section-title">Signature client</span></div>
      <div class="section-body">
        <p class="text-muted" style="font-size:var(--fs-xs);margin-bottom:var(--sp-3);">À faire signer par le client en votre présence (tablette, ordinateur ou Mode Terrain). Le tracé et l'horodatage sont enregistrés avec le devis.</p>
        <canvas id="sigCanvas" width="500" height="160"></canvas>
        <button class="btn btn-ghost btn-sm mt-2" onclick="clearSignature()">Effacer</button>
        <label class="sig-accept mt-4">
          <input type="checkbox" id="sigAccept" onchange="updateConfirmState()">
          <span>Je soussigné(e) <strong id="sigClientName">—</strong> certifie avoir pris connaissance du devis ci-dessus et de ses Conditions Générales de Vente (voir annexe), et donne mon accord — mention « Lu et approuvé ».</span>
        </label>
        <button class="btn btn-primary mt-4" id="btnConfirmSig" onclick="confirmSignature()" disabled>Confirmer la signature</button>
      </div>
    </section>
    <section class="section ticked hidden" id="signedBlock" style="--tick-color:var(--ok);">
      <div class="section-head"><span class="section-title" style="color:var(--ok);">✓ Devis signé</span></div>
      <div class="section-body">
        <p class="text-muted">Signé le <strong id="signedDate" class="text-mono"></strong>.</p>
        <img id="signedImg" alt="Signature du client" style="max-width:280px;max-height:90px;border:1px solid var(--border);border-radius:var(--r-sm);background:#fff;margin-top:var(--sp-2);">
      </div>
    </section>
  </div>

  <div class="annex" id="annex"></div>

  <script src="../assets/js/company.js"></script>
  <script src="../assets/js/ui.js"></script>
  <script src="../assets/js/nav.js"></script>
  <script src="../assets/js/calc.js"></script>
  <script src="../assets/js/api.js"></script>
  <script>
    const SS = window.SS;
    const { mountThemeToggle } = window.SSTheme;
    const { computeDevis } = window.SSCalc;
    const { fmtEur, fmtDate, el, setText, toast, qp, generateDevisId } = window.SSUI;
    mountThemeToggle(document.getElementById('themeToggle'));
    window.SSNav.mount(document.getElementById('quickNav'));

    const COMPANY = window.SS_COMPANY; // coordonnées dans assets/js/company.js
    const VALIDITE_JOURS = 30;

    const TYPE_LABEL = { screen: 'Screen', volet_roulant: 'Volet', tente_solaire: 'Tente solaire', tablier_volet: 'Tablier volet', pergola: 'Pergola', store_banne: 'Store banne' };
    let DEVIS = null, CALC = null;

    function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }

    function addDays(iso, n) {
      const d = iso ? new Date(iso) : new Date();
      if (isNaN(d)) return '';
      d.setDate(d.getDate() + n);
      return d.toISOString().slice(0, 10);
    }

    function getCalc(d) {
      if (d.calculs && d.calculs.total_ttc != null) return d.calculs;
      // Recalcul de secours depuis pricing_v2
      const p = d.pricing_v2 || {};
      return computeDevis({
        items: d.items || [],
        sellers: (p.material && p.material.sellers) || {},
        installation: Object.assign({}, (p.installation && p.installation.per_opening) || {}, {
          install_qty: p.installation && p.installation.install_qty,
          tech1_qty: p.installation && p.installation.tech1_qty,
          tech2_qty: p.installation && p.installation.tech2_qty,
          tools_qty: p.installation && p.installation.tools_qty,
        }),
        extras: p.extras || [],
        tva_pct: p.tva_pct, acompte_pct: p.acompte_pct, surplus_difficulte: p.surplus_difficulte,
      });
    }

    function renderPaper() {
      const d = DEVIS, c = CALC;
      const cl = d.client || {};
      const adr = cl.adresse || {};
      const adresseComplete = [((adr.rue || '') + ' ' + (adr.numero || '')).trim(), ((adr.code_postal || '') + ' ' + (adr.ville || '')).trim()].filter(Boolean).join(', ');
      const draft = !['signe', 'termine', 'envoye_client'].includes(d.statut);

      // Lignes fournitures
      let rows = '';
      (d.items || []).forEach((it, i) => {
        const dims = (it.largeur && it.hauteur) ? `${it.largeur} × ${it.hauteur} mm${it.projection ? ' · proj. ' + it.projection + ' mm' : ''}` : '—';
        const pu = it.prix_catalogue_ht || 0;
        const qty = it.quantite || 1;
        // Coloris : caisson / coulisses / lame finale peuvent différer (Screen) — on détaille
        // seulement quand une couleur diffère du caisson, sinon on garde une seule couleur.
        const coloris = (() => {
          const cais = it.couleur || '';
          const coul = it.couleur_coulisses && it.couleur_coulisses !== cais ? it.couleur_coulisses : '';
          const lame = it.couleur_lame && it.couleur_lame !== cais ? it.couleur_lame : '';
          if (!cais && !coul && !lame) return '';
          if (!coul && !lame) return cais;
          // Préfixe "caisson" seulement si la couleur caisson est renseignée (évite "caisson —, …").
          const parts = [];
          if (cais) parts.push('caisson ' + cais);
          if (coul) parts.push('coulisses ' + coul);
          if (lame) parts.push('lame ' + lame);
          return parts.join(', ');
        })();
        const meta = [it.variante, (it.combinaison && it.combinaison !== 'Simple') ? it.combinaison : '', it.manoeuvre, it.moteur || it.moteur_ref, coloris, it.toile || it.collection, it.emplacement, it.etage].filter(Boolean).join(' · ');
        rows += `<tr>
          <td class="num">${i + 1}</td>
          <td class="desc"><strong>${esc(TYPE_LABEL[it.type] || it.type)}${it.modele ? ' — ' + esc(it.modele) : ''}</strong>${meta ? '<small>' + esc(meta) + '</small>' : ''}</td>
          <td>${dims}</td>
          <td class="num">${qty}</td>
          <td class="num">${fmtEur(pu)}</td>
          <td class="num">${fmtEur(pu * qty)}</td>
        </tr>`;
      });
      const remiseCat = c.remise_catalogue || {};
      if (remiseCat.amount > 0) {
        rows += `<tr class="remise-row"><td class="num">—</td><td class="desc"><strong>Remise commerciale</strong></td><td>—</td><td>—</td><td>—</td><td class="num">− ${fmtEur(remiseCat.amount)}</td></tr>`;
      }

      // Prestations / options
      let presta = '';
      if (c.install_total_brut > 0) {
        presta += `<tr><td class="num">—</td><td class="desc"><strong>Installation et pose</strong><small>Main-d'œuvre et mise en service</small></td><td>—</td><td class="num">1</td><td class="num">${fmtEur(c.install_total_brut)}</td><td class="num">${fmtEur(c.install_total_brut)}</td></tr>`;
      }
      const remiseInst = c.remise_installation || {}, remiseOutil = c.remise_outillage || {};
      const remiseInstallTotal = (remiseInst.amount || 0) + (remiseOutil.amount || 0);
      if (remiseInstallTotal > 0) {
        presta += `<tr class="remise-row"><td class="num">—</td><td class="desc"><strong>Remise commerciale</strong></td><td>—</td><td>—</td><td>—</td><td class="num">− ${fmtEur(remiseInstallTotal)}</td></tr>`;
      }
      (c.extra_lines || []).forEach((e) => {
        presta += `<tr><td class="num">—</td><td class="desc"><strong>${esc(e.label)}</strong></td><td>—</td><td class="num">${e.qty}</td><td class="num">${fmtEur(e.unit_price_ht)}</td><td class="num">${fmtEur(e.total_ht)}</td></tr>`;
      });
      const surplus = (d.pricing_v2 && d.pricing_v2.surplus_difficulte) || 0;
      if (surplus > 0) {
        presta += `<tr><td class="num">—</td><td class="desc"><strong>Supplément accès difficile</strong></td><td>—</td><td class="num">1</td><td class="num">${fmtEur(surplus)}</td><td class="num">${fmtEur(surplus)}</td></tr>`;
      }

      const solde = c.total_ttc - c.acompte_montant;
      const info = !!d.informatif;

      el('paper').innerHTML = `
        ${info ? '<div class="watermark informatif">INFORMATIF</div>' : (draft ? '<div class="watermark draft">BROUILLON</div>' : '')}
        <div class="doc-head">
          <div class="brand-block">
            <div class="logo"><img src="../assets/img/logo-solariscreen.png" alt="SolariScreen"></div>
            <div>
              <div class="co-name"><span class="b">SOLARI</span><span class="g">SCREEN</span></div>
              <div class="co-tag">${esc(COMPANY.tagline)}</div>
            </div>
          </div>
          <div class="doc-meta">
            <div class="doc-title">${info ? 'DEVIS INFORMATIF' : 'DEVIS'}</div>
            <div class="doc-num">N° ${esc(d.id)}</div>
            <div class="doc-dates">
              Date : ${fmtDate(d.date_creation)}<br>
              ${info ? 'Estimation à titre indicatif' : 'Valable jusqu\'au ' + fmtDate(addDays(d.date_creation, VALIDITE_JOURS))}
            </div>
          </div>
        </div>
        ${info ? '<div class="pay-note" style="border-color:color-mix(in srgb, var(--accent-2) 45%, transparent);background:color-mix(in srgb, var(--accent-2) 10%, transparent);"><strong>Estimation non contractuelle</strong> — établie à partir de mesures approximatives, sans engagement. Un devis formel sera établi après prise de mesures précises sur place.</div>' : ''}

        <div class="parties">
          <div class="party">
            <h4>Émetteur</h4>
            <div class="pname">${esc(COMPANY.name)}</div>
            <div class="pline">
              ${COMPANY.legal ? esc(COMPANY.legal) + '<br>' : ''}
              ${esc(COMPANY.address)}<br>
              TVA : ${esc(COMPANY.tva)}<br>
              ${esc(COMPANY.email)}${COMPANY.email2 ? ' · ' + esc(COMPANY.email2) : ''}${COMPANY.phone ? '<br>' + esc(COMPANY.phone) : ''}
            </div>
          </div>
          <div class="party">
            <h4>Client</h4>
            <div class="pname">${esc(cl.prenom)} ${esc(cl.nom) || '—'}</div>
            <div class="pline">
              ${(adr.rue || adr.numero) ? esc(adr.rue) + ' ' + esc(adr.numero) + '<br>' : ''}
              ${(adr.code_postal || adr.ville) ? esc(adr.code_postal) + ' ' + esc(adr.ville) + '<br>' : ''}
              ${cl.telephone ? esc(cl.telephone) + '<br>' : ''}${cl.email ? esc(cl.email) : ''}
            </div>
          </div>
        </div>

        <table class="doc-table">
          <thead><tr>
            <th class="num">#</th><th>Désignation</th><th>Dimensions</th>
            <th class="num">Qté</th><th class="num">P.U. HTVA</th><th class="num">Total HTVA</th>
          </tr></thead>
          <tbody>
            ${rows ? '<tr class="cat-row"><td colspan="6">Fournitures</td></tr>' + rows : ''}
            ${presta ? '<tr class="cat-row"><td colspan="6">Prestations & options</td></tr>' + presta : ''}
          </tbody>
        </table>

        <div class="totals"><div class="box">
          <div class="t-row"><span>Total HTVA</span><span class="v">${fmtEur(c.total_ht)}</span></div>
          <div class="t-row t-sub"><span>TVA ${c.tva_pct} %</span><span class="v">${fmtEur(c.total_tva)}</span></div>
          <div class="t-ttc"><span class="k">Total TVAC</span><span class="v">${fmtEur(c.total_ttc)}</span></div>
        </div></div>

        ${info ? '' : `
        <div class="pay-note">
          Acompte de <strong>${c.acompte_pct} %</strong> à la commande : <strong>${fmtEur(c.acompte_montant)}</strong> —
          solde de <strong>${fmtEur(solde)}</strong> à la livraison / pose.
          <br><span style="font-size:var(--fs-2xs);color:var(--text-muted);">Versement sur le compte ${esc(COMPANY.iban)} — communication : devis n° ${esc(d.id)}.</span>
        </div>

        <div class="doc-ref">Devis valable ${VALIDITE_JOURS} jours · soumis à nos Conditions Générales de Vente (voir annexe)${c.tva_pct === 6 ? ' · Attestation TVA 6 % en annexe' : ''}</div>`}

        <div class="partners">
          <span class="lbl">Partenaires</span>
          <span class="partner-chip"><img src="../assets/img/logo-harol.png" alt="Harol"></span>
          <span class="partner-chip"><img src="../assets/img/logo-somfy.png" alt="Somfy"></span>
        </div>

        ${info ? '' : `
        <div class="signatures">
          <div class="sig-box">
            <h4>Bon pour accord — le client</h4>
            ${d.signature && d.signature.image
              ? `<img src="${d.signature.image}" alt="Signature du client" style="max-width:100%;max-height:65px;margin-top:0.3rem;"><div class="hint">Signé le ${fmtDate(d.signature.date)} — « Lu et approuvé »</div>`
              : `<div class="hint">Date et signature précédées de la mention « Lu et approuvé »</div>`}
          </div>
          <div class="sig-box"><h4>${esc(COMPANY.name)}</h4><div class="hint">Pour acceptation</div></div>
        </div>`}

        <div class="doc-foot">${esc(COMPANY.name)} · ${esc(COMPANY.web)} · TVA ${esc(COMPANY.tva)} · IBAN ${esc(COMPANY.iban)}</div>
      `;
    }

    // ── Annexe : Conditions Générales de Vente (statique, toujours jointe) ──
    function cgvPaper() {
      return `<div class="paper">
        <div class="doc-head"><div class="co-name"><span class="b">Conditions</span> <span class="g">générales de vente</span></div><div class="doc-meta"><div class="doc-num">Devis N° ${esc(DEVIS.id)}</div></div></div>
        <div class="cgv-body">
          <h5>1. Objet &amp; commande</h5>
          Les présentes conditions régissent la vente, la livraison et l'installation des produits proposés par ${esc(COMPANY.name)}. Toute commande implique l'adhésion pleine et entière du client. Le devis est valable ${VALIDITE_JOURS} jours et doit être confirmé par écrit (devis signé ou bon de commande). ${esc(COMPANY.name)} se réserve le droit de refuser ou d'adapter l'installation si des raisons techniques ou de sécurité l'exigent.
          <h5>2. Prix &amp; paiement</h5>
          Prix en euros, TVA comprise. Sauf mention contraire sur le devis, un acompte est dû à la commande pour valider le projet et lancer la fabrication ; le solde est payable le jour de l'installation, immédiatement après la fin des travaux, par virement instantané ou paiement par carte. Tout retard de paiement entraîne de plein droit et sans mise en demeure préalable des intérêts de retard au taux légal majoré de 10 %, ainsi qu'une indemnité forfaitaire de 15 % du montant dû (minimum 150 €).
          <h5>3. Livraison &amp; installation</h5>
          Les délais sont donnés à titre indicatif et ne peuvent donner droit à des dommages-intérêts, sauf faute lourde de ${esc(COMPANY.name)}. Le client doit assurer l'accessibilité du lieu d'installation. Les installations sont réalisées selon les règles de l'art ; pour les tentes solaires, ${esc(COMPANY.name)} décide seul de la faisabilité et celles-ci ne doivent jamais rester ouvertes en cas de vent.
          <h5>4. Garantie</h5>
          Produits Harol : 5 ans · Moteurs RTS &amp; IO : 5 ans · Moteurs solaires et batteries Somfy : 7 ans · Autres moteurs solaires et batteries : 5 ans. La garantie ne couvre pas une mauvaise utilisation, l'absence d'entretien, ni les dommages causés par un tiers ou une catastrophe naturelle.
          <h5>5. Responsabilité &amp; réclamations</h5>
          ${esc(COMPANY.name)} ne peut être tenu responsable des dommages indirects, ni d'une installation électrique défectueuse du client. Toute réclamation doit être faite par écrit dans les 7 jours suivant la livraison ou l'installation.
          <h5>6. Annulation — commandes sur mesure</h5>
          Nos produits étant fabriqués sur mesure, toute annulation après confirmation de commande donne lieu à une indemnité forfaitaire : 10 % du montant TTC en cas d'annulation avant la commande des marchandises auprès du fournisseur, ou 100 % du prix TTC des marchandises sur mesure déjà commandées (hors installation et prestations non réalisées). Les acomptes versés restent acquis à ${esc(COMPANY.name)} à titre de minimum forfaitaire.
          <h5>7. Litiges</h5>
          Les présentes conditions sont soumises au droit belge. Tout litige relève des tribunaux de ${esc(COMPANY.court)}.
        </div>
        <div class="signatures" style="margin-top:var(--sp-4);">
          <div class="sig-box"><h4>Le client</h4><div class="hint">Mention « Lu et approuvé », date et signature</div></div>
          <div class="sig-box"><h4>${esc(COMPANY.name)}</h4><div class="hint">Pour acceptation</div></div>
        </div>
      </div>`;
    }

    // ── Annexe : Attestation TVA 6 % (uniquement si le devis est à 6 %) ──
    function tvaPaper() {
      if (CALC.tva_pct !== 6) return '';
      const cl = DEVIS.client || {};
      const adr = cl.adresse || {};
      const adresseComplete = [((adr.rue || '') + ' ' + (adr.numero || '')).trim(), ((adr.code_postal || '') + ' ' + (adr.ville || '')).trim()].filter(Boolean).join(', ');
      return `<div class="paper">
        <div class="doc-head"><div class="co-name"><span class="b">Attestation</span> <span class="g">TVA 6 %</span></div><div class="doc-meta"><div class="doc-num">Devis N° ${esc(DEVIS.id)}</div></div></div>
        <div class="cgv-body" style="font-size:var(--fs-sm);color:var(--text);margin-top:var(--sp-6);">
          Je soussigné(e) <strong>${esc(cl.prenom)} ${esc(cl.nom)}</strong>, propriétaire ou locataire du bâtiment situé
          ${adresseComplete ? '<strong>' + esc(adresseComplete) + '</strong>' : '……………………………………………'},
          déclare que ce bâtiment est principalement affecté à l'habitation privée et qu'il a été achevé depuis plus de 10 ans.
          <br><br>
          Je confirme que les travaux commandés concernent la rénovation, transformation, amélioration, réparation ou entretien de ce bâtiment et peuvent donc bénéficier du taux réduit de TVA à 6 % conformément à la législation belge en vigueur.
        </div>
        <div class="signatures" style="margin-top:var(--sp-7);">
          <div class="sig-box"><h4>Date</h4><div class="hint">……… / ……… / ……………</div></div>
          <div class="sig-box"><h4>Signature du client</h4><div class="hint">Précédée de la mention « Lu et approuvé »</div></div>
        </div>
      </div>`;
    }

    window.renderPhotos = function () {
      const on = el('togglePhotos').checked;
      const annex = el('annex');
      if (!DEVIS) { annex.innerHTML = ''; return; }

      let photosPaper = '';
      if (on) {
        const items = DEVIS.items || [];
        let cells = '';
        items.forEach((it, i) => {
          (it.photos || []).forEach((p, pi) => {
            cells += `<div class="photo-item"><img src="${p}" alt=""><div class="cap">Ouverture #${i + 1}${it.emplacement ? ' — ' + esc(it.emplacement) : ''} · photo ${pi + 1}</div></div>`;
          });
        });
        photosPaper = cells
          ? `<div class="paper"><div class="doc-head" style="border-color:var(--accent-2);"><div class="co-name"><span class="b">Annexe</span> <span class="g">photos</span></div><div class="doc-meta"><div class="doc-num">Devis N° ${esc(DEVIS.id)}</div></div></div><div class="photo-grid" style="margin-top:var(--sp-5);">${cells}</div></div>`
          : '<div class="paper" style="text-align:center;color:var(--text-muted);">Aucune photo sur ce devis.</div>';
      }

      // Devis informatif : ni CGV ni attestation TVA, ce n'est pas un engagement contractuel
      annex.innerHTML = DEVIS.informatif ? photosPaper : (cgvPaper() + tvaPaper() + photosPaper);
    };

    // ── Signature client (capture sur place — tablette/ordinateur en présence du client) ──
    let sigCtx = null, sigDrawing = false, sigHasInk = false, sigLast = null;
    function initSignatureCanvas() {
      const canvas = el('sigCanvas'); if (!canvas) return;
      const ratio = window.devicePixelRatio || 1;
      const rect = canvas.getBoundingClientRect();
      canvas.width = rect.width * ratio; canvas.height = rect.height * ratio;
      sigCtx = canvas.getContext('2d');
      sigCtx.scale(ratio, ratio);
      sigCtx.lineWidth = 2.2; sigCtx.lineCap = 'round'; sigCtx.strokeStyle = '#1a2238';
      sigHasInk = false;
      const pos = (e) => { const r = canvas.getBoundingClientRect(); const p = e.touches ? e.touches[0] : e; return { x: p.clientX - r.left, y: p.clientY - r.top }; };
      const start = (e) => { sigDrawing = true; sigLast = pos(e); e.preventDefault(); };
      const move = (e) => {
        if (!sigDrawing) return;
        const p = pos(e);
        sigCtx.beginPath(); sigCtx.moveTo(sigLast.x, sigLast.y); sigCtx.lineTo(p.x, p.y); sigCtx.stroke();
        sigLast = p; sigHasInk = true; updateConfirmState();
        e.preventDefault();
      };
      const end = () => { sigDrawing = false; };
      canvas.addEventListener('mousedown', start); canvas.addEventListener('mousemove', move); window.addEventListener('mouseup', end);
      canvas.addEventListener('touchstart', start, { passive: false }); canvas.addEventListener('touchmove', move, { passive: false }); canvas.addEventListener('touchend', end);
    }
    window.updateConfirmState = function () {
      const accept = el('sigAccept'), btn = el('btnConfirmSig');
      if (!accept || !btn) return;
      btn.disabled = !(accept.checked && sigHasInk);
    };
    window.clearSignature = function () {
      const canvas = el('sigCanvas'); if (!canvas || !sigCtx) return;
      sigCtx.clearRect(0, 0, canvas.width, canvas.height);
      sigHasInk = false; updateConfirmState();
    };
    window.confirmSignature = async function () {
      const canvas = el('sigCanvas'); if (!canvas || !sigHasInk) return;
      // Anti-erreur : on ne signe pas un devis vide (aucune ouverture ou total à 0 €).
      const ttc = (DEVIS.calculs && DEVIS.calculs.total_ttc) || 0;
      if (!(DEVIS.items && DEVIS.items.length) || ttc <= 0) { toast('Impossible de signer un devis vide (aucune ouverture ou total à 0 €).', 'warn', 4000); return; }
      const now = new Date().toISOString();
      // Instantané AVANT mutation : si l'enregistrement échoue (session Access expirée…), on remet
      // la fiche dans son état d'origine — un devis affiché « signé » mais jamais enregistré est
      // le pire des scénarios (le client est reparti en croyant avoir signé).
      const snapshot = {
        signature: DEVIS.signature, statut: DEVIS.statut, raison_refus: DEVIS.raison_refus,
        client_declined: DEVIS.client_declined, informatif: DEVIS.informatif,
        client_accepted: DEVIS.client_accepted, statut_history: DEVIS.statut_history,
        date_modification: DEVIS.date_modification,
      };
      DEVIS.signature = { accepted_terms: true, image: canvas.toDataURL('image/png'), date: now };
      DEVIS.statut = 'signe';
      // Un devis signé est contractuel : on efface un refus précédent + le flag « informatif », on marque
      // l'acceptation et on trace la transition dans l'historique (sinon la signature n'y apparaît pas).
      DEVIS.raison_refus = ''; DEVIS.client_declined = false; DEVIS.informatif = false; DEVIS.client_accepted = true;
      DEVIS.statut_history = (DEVIS.statut_history || []).concat([{ statut: 'signe', date: now, by: null }]);
      DEVIS.date_modification = now;
      const res = await SS.saveDevis(DEVIS);
      if (res.ok === false) {
        Object.assign(DEVIS, snapshot);   // rien n'a été enregistré : on annule la mutation locale
        toast(res.error || 'Signature NON enregistrée — réessaie avant que le client ne parte.', 'error', 8000);
        return;
      }
      toast(res.offline ? 'Signature enregistrée hors-ligne.' : 'Devis signé ✓', res.offline ? 'warn' : 'ok');
      if (window.ssConfetti) window.ssConfetti();
      renderPaper();
      renderSignatureUI();
    };
    function renderSignatureUI() {
      const signBlock = el('signBlock'), signedBlock = el('signedBlock');
      if (!signBlock || !signedBlock) return;
      if (DEVIS.informatif) { signBlock.classList.add('hidden'); signedBlock.classList.add('hidden'); return; }
      if (DEVIS.signature && DEVIS.signature.image) {
        signBlock.classList.add('hidden');
        signedBlock.classList.remove('hidden');
        const d = new Date(DEVIS.signature.date);
        setText('signedDate', fmtDate(DEVIS.signature.date) + (isNaN(d) ? '' : ' à ' + d.toLocaleTimeString('fr-BE', { hour: '2-digit', minute: '2-digit' })));
        el('signedImg').src = DEVIS.signature.image;
      } else {
        signBlock.classList.remove('hidden');
        signedBlock.classList.add('hidden');
        const cl = DEVIS.client || {};
        setText('sigClientName', `${cl.prenom || ''} ${cl.nom || ''}`.trim() || '—');
        initSignatureCanvas();
      }
    }

    // ── Nom de fichier suggéré pour l'export PDF ──
    // Chrome/Edge proposent le <title> de la page comme nom de fichier dans "Enregistrer au format PDF".
    const PRODUIT_LABEL = { screen: 'Screen(s)', volet_roulant: 'Volet(s)', tente_solaire: 'Tente solaire', tablier_volet: 'Tablier(s) de volet' };
    function updateDocTitle(d) {
      const cl = d.client || {};
      const types = [...new Set((d.items || []).map(it => it.type))].map(t => PRODUIT_LABEL[t] || t);
      const parts = ['SolariScreen', types.join(' + ') || 'Devis', [cl.prenom, cl.nom].filter(Boolean).join(' ') || 'Client', d.id];
      document.title = parts.filter(Boolean).join(' - ');
    }

    // Attend que la police web (Inter, Google Fonts) soit vraiment chargée avant d'imprimer —
    // sinon window.print() peut capturer une mise en page calculée avec la police de repli du
    // système (métriques différentes, souvent plus large/haute), ce qui a déjà fait déborder
    // un devis pourtant calé pile sur 1 page en environnement de test avec la police déjà en cache.
    window.printDoc = async function () {
      try { await document.fonts.ready; } catch (e) {}
      window.print();
    };

    // ── Chargement ──
    (async () => {
      const id = qp('id');
      if (!id) { el('paper').innerHTML = '<p style="color:var(--text-muted);">Aucun devis spécifié.</p>'; return; }
      DEVIS = await SS.getDevis(id);
      if (!DEVIS) { el('paper').innerHTML = '<p style="color:var(--danger);">Devis introuvable (#' + esc(id) + ').</p>'; return; }
      el('editLink').href = 'simulateur.html?id=' + id;
      CALC = getCalc(DEVIS);
      updateDocTitle(DEVIS);
      renderPaper();
      renderPhotos(); // affiche aussi les annexes CGV / attestation TVA dès le chargement
      renderSignatureUI();
    })();
  </script>
</body>
</html>
