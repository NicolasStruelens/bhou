<!DOCTYPE html>
<html lang="fr" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>SolariScreen — Portfolio de réalisations</title>
  <!-- ── Installation sur l'écran d'accueil (Android + iPhone) — aucun service worker ── -->
  <link rel="manifest" href="../manifest.webmanifest">
  <meta name="theme-color" content="#0b1224" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#f4f6fb" media="(prefers-color-scheme: light)">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="SolariScreen">
  <link rel="apple-touch-icon" href="../assets/img/apple-touch-icon.png">
  <link rel="icon" type="image/png" href="../assets/img/logo-solariscreen.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600;700&family=Orbitron:wght@600;800&display=swap" rel="stylesheet">
  <script src="../assets/js/theme.js"></script>
  <link rel="stylesheet" href="../assets/css/tokens.css">
  <link rel="stylesheet" href="../assets/css/theme-dark.css">
  <link rel="stylesheet" href="../assets/css/theme-light.css">
  <link rel="stylesheet" href="../assets/css/base.css">
  <style>
    .print-header { display: none; }
    /* ══════════════════════════════════════════════════════════════════════════════════════
       EXPORT PDF — document d'impression DÉDIÉ (#printDoc), construit à la volée.
       Historique : l'export imprimait directement la page vivante de l'app, en neutralisant le
       thème sombre / les overlays / la grille à coups de !important. Approche fragile — le PDF
       est ressorti vide deux fois (une couleur de texte héritée du thème, un conteneur masqué,
       et tout devient invisible sur fond blanc). Ici on n'imprime QUE #printDoc : aucune variable
       de thème, aucune couleur héritée, couleurs écrites en dur. Ça ne peut plus être cassé par
       une évolution du CSS de l'application.
       ═════════════════════════════════════════════════════════════════════════════════════ */
    #printDoc { display: none; }
    @media print {
      @page { size: A4 portrait; margin: 12mm; }
      html, body { background: #fff !important; }
      body > *:not(#printDoc) { display: none !important; }
      #printDoc { display: block !important; color: #111; font-family: Arial, Helvetica, sans-serif; }
      #printDoc .pd-head { text-align: center; margin-bottom: 10mm; }
      #printDoc .pd-logo { font-size: 20pt; font-weight: 800; letter-spacing: 0.03em; }
      #printDoc .pd-sub { font-size: 9pt; color: #555; margin-top: 2mm; }
      #printDoc .pd-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6mm; }
      #printDoc .pd-item { break-inside: avoid; page-break-inside: avoid; border: 1px solid #ccc; }
      #printDoc .pd-item img { display: block; width: 100%; height: auto; }
      #printDoc .pd-cap { padding: 2mm 2.5mm; font-size: 8.5pt; line-height: 1.35; color: #111; }
      #printDoc .pd-cap .s { color: #555; }
      #printDoc .pd-empty { font-size: 11pt; color: #111; text-align: center; padding: 20mm 0; }
    }
    .toolbar { display: flex; gap: var(--sp-3); align-items: center; flex-wrap: wrap; margin-bottom: var(--sp-4); }
    .toolbar .search { flex: 1; min-width: 220px; position: relative; }
    .toolbar .search input { padding-left: 2.2rem; }
    .toolbar .search svg { position: absolute; left: 0.7rem; top: 50%; transform: translateY(-50%); width: 14px; height: 14px; color: var(--text-subtle); pointer-events: none; }
    .filters { display: flex; gap: 0.35rem; flex-wrap: wrap; margin-bottom: var(--sp-4); }
    .chip:hover { border-color: var(--accent-2); color: var(--accent-2); }
    .chip.active { background: var(--accent-2); color: var(--bg); border-color: var(--accent-2); }


    /* ── Grille de réalisations ── */
    .pf-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(220px, 100%), 1fr)); gap: var(--sp-4); }
    .pf-card { cursor: pointer; border: 1px solid var(--border); border-radius: var(--r-md); overflow: hidden; background: var(--surface-2); transition: all var(--t-fast); position: relative; --tick-color: var(--accent-2); }
    .pf-card:hover { border-color: var(--accent-2); box-shadow: var(--glow-soft); transform: translateY(-2px); }
    .pf-cover { aspect-ratio: 4 / 3; overflow: hidden; background: var(--surface-3, var(--surface)); }
    .pf-cover img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform var(--t-base); }
    .pf-card:hover .pf-cover img { transform: scale(1.06); }
    .pf-count { position: absolute; top: 8px; right: 8px; background: rgba(4,8,20,0.65); color: #fff; font-family: var(--font-mono); font-size: var(--fs-2xs); padding: 0.2rem 0.5rem; border-radius: var(--r-pill); display: flex; align-items: center; gap: 0.3rem; }
    .pf-meta { padding: var(--sp-3); }
    .pf-type { font-weight: 700; font-size: var(--fs-sm); color: var(--text); }
    .pf-sub { font-family: var(--font-mono); font-size: var(--fs-2xs); color: var(--text-subtle); margin-top: 0.25rem; text-transform: uppercase; letter-spacing: 0.03em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    /* ── Lightbox (identique à la fiche devis) ── */
  </style>
</head>
<body>
  <div class="fx-grid"></div>

  <header class="app-header">
    <div class="brand">
      <span class="brand-logo"><img src="../assets/img/logo-solariscreen.png" alt="" onerror="this.style.display='none'"></span>
      <div>
        <h1><a href="dashboard.html">SOLARISCREEN</a></h1>
        <div class="module">Portfolio de réalisations</div>
      </div>
    </div>
    <div class="header-actions">
      <span id="quickNav"></span>
      <span id="themeToggle"></span>
      <a class="btn btn-ghost btn-sm" href="dashboard.html"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg> Dashboard</a>
    </div>
  </header>

  <main class="container">
    <div class="kpis" id="kpis"></div>

    <div class="toolbar">
      <div class="search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <label for="search" class="sr-only">Rechercher dans le portfolio</label>
        <input class="input" id="search" placeholder="Rechercher une ville, un modèle, une couleur, un client…" oninput="render()">
      </div>
      <select class="select" id="sort" style="max-width:200px;" onchange="render()" aria-label="Trier les réalisations">
        <option value="recent">Tri : récents d'abord</option>
        <option value="ville">Tri : ville A→Z</option>
      </select>
      <button class="btn btn-ghost btn-sm" onclick="printDoc()" title="Exporte les réalisations actuellement affichées ci-dessous — utilise la recherche et les filtres pour choisir lesquelles"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="6 9 6 2 18 2 18 9"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></svg> Exporter en PDF</button>
    </div>
    <div class="filters" id="typeFilters"></div>
    <div class="no-print" style="font-size:var(--fs-2xs);color:var(--text-subtle);margin:0 0 var(--sp-4);">L'export PDF imprime exactement les réalisations affichées ci-dessous : filtre/recherche d'abord, exporte ensuite.</div>

    <div class="print-header">
      <div class="print-logo"><span class="blue">SOLARI</span><span class="gold">SCREEN</span></div>
      <div class="print-sub">Portfolio de réalisations — imprimé le <span id="printDate"></span></div>
      <div class="print-sub" id="printScope"></div>
    </div>

    <section class="section">
      <div class="section-head">
        <span class="section-title">Réalisations</span>
        <span class="section-code">SS // PORTFOLIO</span>
        <span class="section-sub" id="resultCount">—</span>
      </div>
      <div class="section-body">
        <div id="grid"></div>
      </div>
    </section>
  </main>

  <!-- Document d'impression dédié (rempli par printDoc()). DOIT rester un enfant DIRECT de <body> :
       la règle d'impression `body > *:not(#printDoc)` s'appuie dessus pour masquer tout le reste. -->
  <div id="printDoc" aria-hidden="true"></div>

  <!-- ══════ LIGHTBOX ══════ -->
  <div class="lightbox" id="lightbox" role="dialog" aria-label="Photo agrandie">
    <div class="lb-count" id="lbCount"></div>
    <button class="lb-btn lb-close" onclick="lbClose()" aria-label="Fermer">✕</button>
    <button class="lb-btn lb-prev" onclick="lbNav(-1)" aria-label="Photo précédente">‹</button>
    <img id="lbImg" src="" alt="Photo de la réalisation">
    <div class="lb-cap" id="lbCap"></div>
    <button class="lb-btn lb-next" onclick="lbNav(1)" aria-label="Photo suivante">›</button>
  </div>

  <script src="../assets/js/ui.js"></script>
  <script src="../assets/js/nav.js"></script>
  <script src="../assets/js/api.js"></script>
  <script>
    const SS = window.SS;
    const { mountThemeToggle } = window.SSTheme;
    const { fmtDate, el, setText, normDevis, icon, toast } = window.SSUI;
    mountThemeToggle(document.getElementById('themeToggle'));
    window.SSNav.mount(document.getElementById('quickNav'));
    setText('printDate', fmtDate(new Date().toISOString()));
    // Attend que la police web (Inter) soit chargée avant d'imprimer, sinon la mise en page
    // peut être calculée avec la police de repli du système (métriques différentes → débordement).
    // ── Export PDF : on CONSTRUIT un document d'impression autonome (#printDoc) ────────────
    // On n'imprime plus la page vivante (thème sombre, overlays, grille responsive) : on génère
    // un balisage simple, en couleurs écrites en dur, que le CSS de l'app ne peut pas casser.
    function buildPrintDoc() {
      const host = el('printDoc');
      const scope = (el('printScope') || {}).textContent || '';
      // Max 3 photos par réalisation : au-delà le PDF devient illisible et interminable.
      const MAX_PH = 3;
      const blocks = VISIBLE.map(e => {
        const title = `${TYPE_LABEL[e.type] || e.type}${e.modele ? ' — ' + e.modele : ''}`;
        const sub = [e.couleur, e.ville].filter(Boolean).join(' · ');
        const shown = (e.photos || []).slice(0, MAX_PH);
        return shown.map((src, i) => `
          <div class="pd-item">
            <img src="${esc(src)}" alt="">
            <div class="pd-cap"><strong>${esc(title)}</strong>${sub ? `<br><span class="s">${esc(sub)}</span>` : ''}${shown.length > 1 ? `<br><span class="s">photo ${i + 1}/${shown.length}</span>` : ''}</div>
          </div>`).join('');
      }).join('');
      host.innerHTML = `
        <div class="pd-head">
          <div class="pd-logo"><span style="color:#2e3b8f">SOLARI</span><span style="color:#b8860b">SCREEN</span></div>
          <div class="pd-sub">Portfolio de réalisations — imprimé le ${new Date().toLocaleDateString('fr-BE')}</div>
          ${scope ? `<div class="pd-sub">${esc(scope)}</div>` : ''}
        </div>
        ${blocks ? `<div class="pd-grid">${blocks}</div>`
                 : `<div class="pd-empty">Aucune réalisation à imprimer.<br>Ajoute des chantiers au portfolio depuis la fiche d'un devis, ou élargis ta recherche.</div>`}`;
      return VISIBLE.length;
    }
    // Attend que les images du document d'impression soient réellement décodées : sans ça,
    // Chrome/Edge peut lancer l'impression avant et sortir des cadres vides.
    function waitImages(root) {
      const imgs = [...root.querySelectorAll('img')];
      return Promise.all(imgs.map(img => (img.complete && img.naturalWidth)
        ? Promise.resolve()
        : new Promise(res => { img.onload = res; img.onerror = res; setTimeout(res, 4000); })));
    }
    window.printDoc = async function () {
      const n = buildPrintDoc();
      if (!n) toast('Aucune réalisation affichée — le PDF sera vide.', 'warn', 5000);
      try { await document.fonts.ready; } catch (e) {}
      await waitImages(el('printDoc'));
      window.print();
    };

    const TYPE_LABEL = { screen: 'Screen', volet_roulant: 'Volet', tente_solaire: 'Tente solaire', tablier_volet: 'Tablier volet', pergola: 'Pergola', store_banne: 'Store banne', chantier: 'Chantier / pose' };
    const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

    let ENTRIES = [], VISIBLE = [], activeType = 'tous';
    let lbPhotos = [], lbIdx = 0;

    async function loadEntries() {
      const raw = await SS.listDevis();
      // Vitrine curée manuellement : le seul critère est le flag `portfolio` (posé depuis la fiche),
      // + pas archivé. Plus de restriction au statut « Terminé » : on peut montrer les ouvertures
      // déjà posées d'un chantier encore en cours (seules celles avec photos apparaissent).
      const eligible = (raw || []).map(normDevis).filter(d => d.portfolio && !d.archive);
      const fulls = await Promise.all(eligible.map(d => SS.getDevis(d.id)));
      const entries = [];
      fulls.filter(Boolean).forEach(d => {
        const cl = d.client || {}, adr = cl.adresse || {};
        (d.items || []).forEach((it, i) => {
          const photos = it.photos || [];
          if (!photos.length) return;
          entries.push({
            devisId: d.id, itemIndex: i,
            type: it.type, modele: it.modele, variante: it.variante,
            couleur: it.couleur || it.couleur_lame || '', toile: it.toile || it.toile_couleur || '',
            ville: adr.ville || '', client: [cl.prenom, cl.nom].filter(Boolean).join(' '),
            date: d.date_modification || d.date_creation || '',
            photos,
          });
        });
        // Photos du JOURNAL DE CHANTIER : uniquement les phases « vitrine » (chantier en cours ou
        // terminé) — on exclut volontairement « avant », « problème » et « réserve » (défauts /
        // avant-travaux, jamais du beau à montrer). Regroupées en une seule carte « Chantier / pose ».
        const journal = (d.chantier_photos || [])
          .filter(e => ['apres', 'pendant'].includes(e.phase) && e.url)
          .sort((a, b) => String((a.date || '') + (a.date_creation || '')).localeCompare(String((b.date || '') + (b.date_creation || ''))));
        if (journal.length) {
          entries.push({
            devisId: d.id, itemIndex: -1,
            type: 'chantier', modele: '', variante: '',
            couleur: '', toile: '',
            ville: adr.ville || '', client: [cl.prenom, cl.nom].filter(Boolean).join(' '),
            date: d.date_modification || d.date_creation || '',
            photos: journal.map(e => e.url),
          });
        }
      });
      return entries;
    }

    function kpis() {
      const nbPhotos = ENTRIES.reduce((s, e) => s + e.photos.length, 0);
      const villes = new Set(ENTRIES.map(e => e.ville).filter(Boolean));
      el('kpis').innerHTML = `
        <div class="kpi ticked gold"><div class="kpi-label">Réalisations</div><div class="kpi-value">${ENTRIES.length}</div><div class="kpi-sub">réalisations photographiées</div></div>
        <div class="kpi ticked accent"><div class="kpi-label">Photos</div><div class="kpi-value">${nbPhotos}</div><div class="kpi-sub">dans le portfolio</div></div>
        <div class="kpi ticked"><div class="kpi-label">Villes</div><div class="kpi-value">${villes.size}</div><div class="kpi-sub">chantiers différents</div></div>`;
      if (window.SSUI.animateKpis) window.SSUI.animateKpis(el('kpis'));   // odometre partage (coup de frais)
    }

    function typeFilters() {
      const present = Array.from(new Set(ENTRIES.map(e => e.type)));
      const chips = [['tous', 'Tous']].concat(present.map(t => [t, TYPE_LABEL[t] || t]));
      el('typeFilters').innerHTML = chips.map(([k, label]) =>
        `<button class="chip ${activeType === k ? 'active' : ''}" onclick="setTypeFilter('${k}')">${esc(label)}</button>`
      ).join('');
    }
    window.setTypeFilter = (k) => { activeType = k; render(); };

    function render() {
      const q = (el('search').value || '').trim().toLowerCase();
      const sort = el('sort').value;
      VISIBLE = ENTRIES.filter(e => {
        if (activeType !== 'tous' && e.type !== activeType) return false;
        if (!q) return true;
        const hay = [TYPE_LABEL[e.type], e.modele, e.variante, e.couleur, e.toile, e.ville, e.client].join(' ').toLowerCase();
        return hay.includes(q);
      });
      VISIBLE.sort((a, b) => sort === 'ville' ? (a.ville || '').localeCompare(b.ville || '') : String(b.date).localeCompare(String(a.date)));

      setText('resultCount', VISIBLE.length + ' résultat(s)');
      typeFilters();

      // Le PDF exporté doit dire lui-même ce qu'il contient : si un filtre/recherche est actif,
      // ce n'est pas tout le portfolio qui sort de l'imprimante, seulement ce sous-ensemble.
      const scopeParts = [];
      if (activeType !== 'tous') scopeParts.push(TYPE_LABEL[activeType] || activeType);
      if (q) scopeParts.push(`recherche « ${q} »`);
      setText('printScope', scopeParts.length ? `Filtré : ${scopeParts.join(' · ')} — ${VISIBLE.length} réalisation(s)` : `Portfolio complet — ${VISIBLE.length} réalisation(s)`);

      if (!VISIBLE.length) {
        el('grid').innerHTML = `<div class="empty"><div class="big">${icon('image', 40)}</div>
          ${ENTRIES.length ? 'Aucune réalisation ne correspond à ta recherche.' : `Aucune réalisation dans le portfolio pour l'instant.<br>Sur la fiche d'un devis <strong>signé ou posé</strong> qui a des photos d'ouvertures, clique « <strong>Ajouter au portfolio</strong> » (colonne d'actions, à droite).`}</div>`;
        return;
      }
      el('grid').innerHTML = `<div class="pf-grid">${VISIBLE.map((e, i) => `
        <div class="pf-card ticked" onclick="openEntry(${i})">
          <div class="pf-cover"><img src="${e.photos[0]}" alt=""></div>
          ${e.photos.length > 1 ? `<span class="pf-count">${icon('image', 11)} ${e.photos.length}</span>` : ''}
          <div class="pf-meta">
            <div class="pf-type">${esc(TYPE_LABEL[e.type] || e.type)}${e.modele ? ' — ' + esc(e.modele) : ''}</div>
            <div class="pf-sub">${esc([e.couleur, e.ville].filter(Boolean).join(' · ') || '—')}</div>
          </div>
        </div>`).join('')}</div>`;
    }

    // ── Lightbox : parcourt toutes les photos de l'entrée cliquée ──
    window.openEntry = (i) => {
      const e = VISIBLE[i];
      lbPhotos = e.photos.map((src, pi) => ({
        src,
        cap: `${TYPE_LABEL[e.type] || e.type}${e.modele ? ' — ' + e.modele : ''} · photo ${pi + 1}/${e.photos.length}`,
        devisId: e.devisId,
      }));
      lbIdx = 0;
      lbShow();
      el('lightbox').classList.add('open');
      document.body.style.overflow = 'hidden';
    };
    window.lbClose = () => { el('lightbox').classList.remove('open'); document.body.style.overflow = ''; };
    window.lbNav = (dir) => { lbIdx = (lbIdx + dir + lbPhotos.length) % lbPhotos.length; lbShow(); };
    function lbShow() {
      const p = lbPhotos[lbIdx];
      el('lbImg').src = p.src;
      el('lbCap').innerHTML = `${esc(p.cap)} <a class="lb-link" href="vue.html?id=${p.devisId}">Voir la fiche →</a>`;
      setText('lbCount', (lbIdx + 1) + ' / ' + lbPhotos.length);
      const multi = lbPhotos.length > 1 ? '' : 'none';
      document.querySelector('.lb-prev').style.display = multi;
      document.querySelector('.lb-next').style.display = multi;
    }
    el('lightbox').addEventListener('click', (e) => { if (e.target === el('lightbox')) lbClose(); });
    document.addEventListener('keydown', (e) => {
      if (!el('lightbox').classList.contains('open')) return;
      if (e.key === 'Escape') lbClose();
      if (e.key === 'ArrowLeft') lbNav(-1);
      if (e.key === 'ArrowRight') lbNav(1);
    });

    (async () => {
      ENTRIES = await loadEntries();
      kpis();
      render();
    })();
  </script>
</body>
</html>
