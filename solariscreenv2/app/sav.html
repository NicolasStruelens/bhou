<!DOCTYPE html>
<html lang="fr" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>SolariScreen — SAV</title>
  <!-- ── Installation sur l'écran d'accueil (Android + iPhone) — aucun service worker ── -->
  <link rel="manifest" href="../manifest.webmanifest">
  <meta name="theme-color" content="#0b1224" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#f4f6fb" media="(prefers-color-scheme: light)">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="SolariScreen">
  <link rel="apple-touch-icon" href="../assets/img/apple-touch-icon.png">
  <link rel="icon" type="image/svg+xml" href="../assets/img/logo-solariscreen.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600;700&family=Orbitron:wght@600;800&display=swap" rel="stylesheet">
  <script src="../assets/js/theme.js"></script>
  <link rel="stylesheet" href="../assets/css/tokens.css">
  <link rel="stylesheet" href="../assets/css/theme-dark.css">
  <link rel="stylesheet" href="../assets/css/theme-light.css">
  <link rel="stylesheet" href="../assets/css/base.css">
  <style>
    .sav-section-title { display: flex; align-items: center; gap: var(--sp-2); font-family: var(--font-mono); font-size: var(--fs-2xs); text-transform: uppercase; letter-spacing: 0.08em; color: var(--text-subtle); margin: var(--sp-6) 0 var(--sp-3); }
    .sav-section-title:first-child { margin-top: 0; }
    .sav-section-title .n { color: var(--text-muted); }
    .sav-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(300px, 100%), 1fr)); gap: var(--sp-3); }
    .sav-card { border: 1px solid var(--border); border-radius: var(--r-md); background: var(--surface); padding: var(--sp-4); --tick-color: var(--danger); }
    .sav-card.is-resolu { --tick-color: var(--ok); opacity: 0.7; }
    .sav-head { display: flex; justify-content: space-between; align-items: flex-start; gap: var(--sp-2); }
    .sav-client { font-weight: 700; }
    .sav-devis { font-family: var(--font-mono); font-size: var(--fs-2xs); color: var(--text-subtle); margin-top: 0.2rem; }
    /* Garantie : la premiere chose qu'on regarde, donc la plus visible. */
    .sav-garantie { display: inline-flex; align-items: center; gap: 0.35rem; margin: var(--sp-2) 0;
      font-family: var(--font-mono); font-size: var(--fs-3xs); text-transform: uppercase; letter-spacing: 0.05em;
      padding: 0.15rem 0.5rem; border-radius: var(--r-sm); }
    .sav-garantie.sous { color: var(--ok); border: 1px solid color-mix(in srgb, var(--ok) 45%, transparent); }
    .sav-garantie.hors { color: var(--warn); border: 1px solid color-mix(in srgb, var(--warn) 45%, transparent); }
    .sav-garantie.inconnue { color: var(--text-subtle); border: 1px dashed var(--border-strong); }
    /* Ce qui a ete repare : c'est ce qu'on vient relire le jour ou le defaut revient. */
    .sav-resolution { display: flex; gap: var(--sp-2); align-items: flex-start; margin-top: var(--sp-3);
      padding: var(--sp-3); border-radius: var(--r-sm); font-size: var(--fs-sm); color: var(--text);
      border: 1px solid color-mix(in srgb, var(--ok) 40%, transparent);
      background: color-mix(in srgb, var(--ok) 8%, transparent); }
    .sav-resolution svg { color: var(--ok); flex: none; margin-top: 2px; }
    .sav-cause { font-size: var(--fs-xs); color: var(--text-muted); margin-top: 0.2rem; }
    .sav-sign { font-family: var(--font-mono); font-size: var(--fs-3xs); color: var(--text-subtle); margin-top: 0.2rem; }
    .sav-notes { margin-top: var(--sp-3); border-top: 1px solid var(--border); padding-top: var(--sp-2); }
    .sav-note { display: flex; gap: var(--sp-2); align-items: baseline; font-size: var(--fs-sm); margin-bottom: 0.3rem; flex-wrap: wrap; }
    .sav-note .sn-qui { font-family: var(--font-mono); font-size: var(--fs-3xs); color: var(--accent); flex: 0 0 auto; }
    .sav-note .sn-txt { flex: 1 1 10ch; min-width: 10ch; color: var(--text-muted); }
    .sav-note .sn-qd { font-family: var(--font-mono); font-size: var(--fs-3xs); color: var(--text-subtle); flex: 0 0 auto; }
    .sav-photos { display: flex; flex-wrap: wrap; gap: var(--sp-4); margin-top: var(--sp-3); }
    .sav-photos .sp-lbl { font-family: var(--font-mono); font-size: var(--fs-3xs); text-transform: uppercase;
      letter-spacing: 0.06em; color: var(--text-subtle); margin-bottom: 0.25rem; }
    .sav-photos .sp-lbl.apres { color: var(--ok); }
    .sav-photos .sp-row { display: flex; gap: var(--sp-2); flex-wrap: wrap; }
    .sav-photos img { width: 62px; height: 62px; object-fit: cover; border-radius: var(--r-sm); border: 1px solid var(--border); display: block; }
    .sav-ajout-photo { display: flex; align-items: center; gap: var(--sp-2); margin-top: var(--sp-2); flex-wrap: wrap; }
    .sav-ajout-photo .sp-attente { font-family: var(--font-mono); font-size: var(--fs-3xs); color: var(--text-subtle); }
    .sav-actions { display: flex; flex-wrap: wrap; gap: var(--sp-2); margin-top: var(--sp-3); }
    .sav-box { display: none; margin-top: var(--sp-3); }
    .sav-box.on { display: block; }
    .sav-box-fin { display: flex; justify-content: flex-end; gap: var(--sp-2); margin-top: var(--sp-2); }
    .sav-desc { font-size: var(--fs-sm); color: var(--text-muted); margin-top: var(--sp-2); }
    .sav-date { font-family: var(--font-mono); font-size: var(--fs-2xs); color: var(--text-subtle); margin-top: var(--sp-2); }

    /* Sélecteur de devis pour créer un ticket (même gabarit de modale que le dashboard) */
    .modal-bg { position: fixed; inset: 0; background: rgba(0,0,0,0.55); z-index: 1000; display: none; align-items: center; justify-content: center; padding: var(--sp-4); }
    .modal-bg.open { display: flex; }
    .modal { background: var(--surface); border: 1px solid var(--border-strong); border-radius: var(--r-md); box-shadow: var(--shadow); width: 560px; max-width: 100%; max-height: 88vh; display: flex; flex-direction: column; --tick-color: var(--accent-2); }
    .modal .mhead { font-family: var(--font-display); font-size: var(--fs-md); padding: var(--sp-4) var(--sp-5); border-bottom: 1px solid var(--border); color: var(--accent); display: flex; align-items: center; gap: var(--sp-2); }
    .modal .mbody { padding: var(--sp-4) var(--sp-5); overflow-y: auto; flex: 1; min-height: 120px; }
    .pick-item { display: flex; align-items: center; gap: var(--sp-3); width: 100%; text-align: left; background: var(--surface-2); border: 1px solid var(--border); border-radius: var(--r-sm); padding: var(--sp-3); margin-bottom: var(--sp-2); cursor: pointer; color: inherit; font: inherit; }
    .pick-item:hover { border-color: var(--accent); }
    .pick-item .pi-main { flex: 1; min-width: 0; }
    .pick-item .pi-name { font-weight: 700; }
    .pick-item .pi-sub { font-family: var(--font-mono); font-size: var(--fs-2xs); color: var(--text-subtle); margin-top: 0.15rem; }
  </style>
</head>
<body>
  <div class="fx-grid"></div>

  <header class="app-header">
    <div class="brand">
      <span class="brand-logo"><img src="../assets/img/logo-solariscreen.svg" alt="" onerror="this.style.display='none'"></span>
      <div>
        <h1><a href="dashboard.html">SOLARISCREEN</a></h1>
        <div class="module">SAV</div>
      </div>
    </div>
    <div class="header-actions">
      <button class="btn btn-primary btn-sm" onclick="openPicker()"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg> Nouveau ticket SAV</button>
      <span id="quickNav"></span>
      <span id="themeToggle"></span>
      <a class="btn btn-ghost btn-sm" href="dashboard.html"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg> Dashboard</a>
    </div>
  </header>

  <main class="container">
    <div class="kpis" id="kpis"></div>
    <div id="host"><div aria-busy="true"><div class="skl" style="height:96px;margin-bottom:var(--sp-3)"></div><div class="skl" style="height:96px;margin-bottom:var(--sp-3)"></div><div class="skl" style="height:96px"></div></div></div>
  </main>

  <!-- Sélecteur de chantier : un ticket SAV est toujours rattaché à un devis posé -->
  <div class="modal-bg" id="modalPick">
    <div class="modal ticked">
      <div class="mhead">
        <span id="pickTitle">Sur quel chantier ?</span>
        <button class="btn btn-ghost btn-sm" style="margin-left:auto;" onclick="closePicker()">✕</button>
      </div>
      <div class="mbody">
        <input class="input" id="pickSearch" placeholder="Rechercher un client, une ville, un n° de devis…" oninput="renderPicker()" style="margin-bottom:var(--sp-3);">
        <div id="pickList"></div>
      </div>
    </div>
  </div>

  <script src="../assets/js/ui.js"></script>
  <script src="../assets/js/nav.js"></script>
  <script src="../assets/js/api.js"></script>
  <script src="../assets/js/config.js"></script>
  <script>
    const SS = window.SS;
    const { mountThemeToggle } = window.SSTheme;
    const { fmtDate, el, icon, normDevis, toast } = window.SSUI;
    mountThemeToggle(document.getElementById('themeToggle'));
    window.SSNav.mount(document.getElementById('quickNav'));

    const SAV_TYPE_LABEL = window.SSUI.SAV_TYPE_LABEL;   // source unique : assets/js/ui.js
    const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
    let ELIGIBLES = [];   // chantiers sur lesquels un ticket SAV a du sens (pose faite)
    let TICKETS = [];     // tickets a plat, avec leur devis (pour la garantie et l'attribution)
    let IDENTITE = { key: '' };
    let REGLAGES = null;
    let NOTE_OUVERTE = '';   // ticket dont la zone de note est depliee
    let RESOUT = '';         // ticket qu'on est en train de cloturer
    const SELLER_LABELS = window.SSUI.SELLER_LABELS;   // source unique : assets/js/ui.js
    const autre = (k) => (k === 'nicolas' ? 'yannick' : 'nicolas');
    const nomDe = (k) => SELLER_LABELS[k] || k || '—';

    async function load() {
      const raw = await SS.listDevis();
      const tous = (raw || []).map(normDevis);
      const summary = tous.filter(d => (d.sav_tickets || []).length);
      // Un SAV concerne un chantier POSÉ (jalon partagé isPoseDone : PV de réception signé ou
      // étape fournisseur « Posé »), ou déjà marqué terminé. Les archivés sont exclus.
      ELIGIBLES = tous
        .filter(window.SSUI.savPossible)
        .sort((a, b) => String(b.date_modification).localeCompare(String(a.date_modification)));
      const all = [];
      // On garde le DEVIS entier avec le ticket : la garantie se deduit de la date de pose, et
      // c'est la premiere question devant un SAV -- facturable ou pas.
      summary.forEach(d => (d.sav_tickets || []).forEach(t => all.push({
        ...t, devisId: d.id, client: `${d.prenom} ${d.nom}`.trim(), devis: d,
      })));
      TICKETS = all;
      try { IDENTITE = await window.SSNav.getIdentity(); } catch (e) { IDENTITE = { key: '' }; }
      try { REGLAGES = await window.SSConf.charger(); } catch (e) { REGLAGES = null; }
      render(all);
    }

    // ── Agir SANS quitter la liste ───────────────────────────────────────────────────────────
    // Avant, chaque geste imposait d'ouvrir la fiche du devis puis de retrouver la carte SAV.
    // Ce saut d'ecran casse l'elan : on remet a plus tard, et le client attend.
    function ticketDe(devisId, ticketId) {
      return TICKETS.filter(t => String(t.devisId) === String(devisId) && String(t.id) === String(ticketId))[0] || null;
    }
    /** Renvoie le ticket ENTIER au serveur : il le reconstruit champ par champ, omettre une cle
     *  l'effacerait (le responsable avait deja disparu comme ca a chaque changement de statut). */
    async function majTicket(devisId, ticketId, patch) {
      const t = ticketDe(devisId, ticketId);
      if (!t) { toast('Ticket introuvable — recharge la page.', 'error'); return false; }
      const envoi = Object.assign({}, t, patch);
      delete envoi.devis; delete envoi.devisId; delete envoi.client;
      const res = await SS.saveSavTicket(devisId, envoi);
      if (res.ok === false) { toast(res.error || 'Non enregistré — réessaie.', 'error', 6000); return false; }
      return true;
    }
    window.attribuer = async (devisId, ticketId, qui) => {
      if (await majTicket(devisId, ticketId, { pour: qui })) {
        toast(qui === IDENTITE.key ? 'C’est pour toi' : 'Confié à ' + nomDe(qui), 'ok');
        load();
      }
    };
    window.changerStatut = async (devisId, ticketId, statut) => {
      if (await majTicket(devisId, ticketId, { statut: statut })) {
        toast(statut === 'resolu' ? 'Ticket réparé' : 'Ticket rouvert', 'ok');
        load();
      }
    };
    window.ouvrirNote = (ticketId) => { NOTE_OUVERTE = NOTE_OUVERTE === ticketId ? '' : ticketId; RESOUT = ''; render(TICKETS); const t = el('nt-' + ticketId); if (t) t.focus(); };
    window.ouvrirResolution = (ticketId) => { RESOUT = RESOUT === ticketId ? '' : ticketId; NOTE_OUVERTE = ''; render(TICKETS); const t = el('rs-' + ticketId); if (t) t.focus(); };
    window.envoyerNote = async (devisId, ticketId) => {
      const champ = el('nt-' + ticketId);
      const texte = (champ && champ.value.trim()) || '';
      if (!texte) { toast('La note est vide.', 'warn'); return; }
      const res = await SS.addSavNote(devisId, ticketId, texte);
      if (res.ok === false) { toast(res.error || 'Note non enregistrée.', 'error', 6000); return; }
      NOTE_OUVERTE = '';
      toast('Note ajoutée', 'ok');
      load();
    };
    /** Clore un ticket EXIGE d'ecrire ce qui a ete repare : sans ca, le meme defaut revient six
     *  mois plus tard et personne ne sait ce qui avait ete fait. Meme regle que les decisions. */
    /** Photo APRES : meme chemin que partout (compression + depot R2), puis ecriture du ticket.
     *  On enregistre tout de suite plutot qu'a la cloture : si la page est fermee entre-temps, la
     *  photo prise sur le chantier ne doit pas etre perdue. */
    window.ajouterPhotoApres = async (devisId, ticketId, input) => {
      const fichiers = [...(input.files || [])];
      input.value = '';
      if (!fichiers.length) return;
      const etat = el('pa-' + ticketId);
      if (etat) etat.textContent = 'Envoi…';
      const t = ticketDe(devisId, ticketId);
      if (!t) { toast('Ticket introuvable — recharge la page.', 'error'); return; }
      const urls = [];
      for (const f of fichiers) {
        try { urls.push(await window.SSUI.compressAndUploadPhoto(f, devisId)); }
        catch (e) { toast('Photo non envoyée : ' + e.message, 'error', 6000); }
      }
      if (!urls.length) { if (etat) etat.textContent = ''; return; }
      if (await majTicket(devisId, ticketId, { photos_apres: (t.photos_apres || []).concat(urls) })) {
        toast(urls.length + ' photo(s) ajoutée(s)', 'ok');
        RESOUT = ticketId;   // on garde la zone de clôture ouverte, on était en train de clore
        load();
      }
    };

    window.cloturer = async (devisId, ticketId) => {
      const champ = el('rs-' + ticketId);
      const texte = (champ && champ.value.trim()) || '';
      if (!texte) { toast('Écris ce qui a été réparé — c’est ce qu’on relira la prochaine fois.', 'warn', 6000); if (champ) champ.focus(); return; }
      const cause = (el('cs-' + ticketId) || {}).value || '';
      if (await majTicket(devisId, ticketId, { statut: 'resolu', resolution: texte, cause: cause.trim() })) {
        RESOUT = '';
        toast('Ticket réparé', 'ok');
        load();
      }
    };

    // ── Création d'un ticket : on choisit d'abord le chantier, puis on ouvre sa fiche au bon endroit ──
    window.openPicker = () => { el('pickSearch').value = ''; renderPicker(); el('modalPick').classList.add('open'); el('pickSearch').focus(); };
    window.closePicker = () => el('modalPick').classList.remove('open');
    window.renderPicker = () => {
      const q = el('pickSearch').value.trim().toLowerCase();
      const list = q
        ? ELIGIBLES.filter(d => `${d.prenom} ${d.nom} ${d.id} ${d.ville}`.toLowerCase().includes(q))
        : ELIGIBLES;
      el('pickList').innerHTML = list.length
        ? list.slice(0, 50).map(d => `
            <button class="pick-item" onclick="goCreate('${encodeURIComponent(d.id)}')">
              <div class="pi-main">
                <div class="pi-name">${esc(`${d.prenom} ${d.nom}`.trim() || '—')}</div>
                <div class="pi-sub">#${esc(d.id)}${d.ville ? ' · ' + esc(d.ville) : ''}${(d.sav_tickets || []).length ? ' · ' + d.sav_tickets.length + ' ticket(s)' : ''}</div>
              </div>
              ${icon('window', 16)}
            </button>`).join('')
        : `<div class="empty">Aucun chantier posé ne correspond.<div class="hint">Un ticket SAV se crée sur un chantier dont la pose est faite (PV de réception signé ou étape « Posé »).</div></div>`;
    };
    // `#sav` : la fiche devis déplie la carte SAV et y amène directement (voir vue.html).
    window.goCreate = (encId) => { location.href = `vue.html?id=${encId}#sav`; };

    function ticketCard(t) {
      const badgeCls = t.statut === 'resolu' ? 'badge-ok' : (t.statut === 'en_cours' ? 'badge-warn' : 'badge-danger');
      const statutLabel = t.statut === 'resolu' ? 'Résolu' : (t.statut === 'en_cours' ? 'En cours' : 'Ouvert');
      const id = window.SSUI.jsAttr(t.id);
      const dev = window.SSUI.jsAttr(t.devisId);
      // LA question devant un ticket : facturable ou pas. Elle se repondait de tete, dossier par
      // dossier ; elle se deduit de la date de pose et de la duree de garantie des reglages.
      const g = window.SSUI.garantieDe(t.devis, REGLAGES);
      const clsG = !g.connue ? 'inconnue' : (g.sous_garantie ? 'sous' : 'hors');
      const resolu = t.statut === 'resolu';
      const notes = t.notes || [];
      return `
        <div class="sav-card ticked ${resolu ? 'is-resolu' : ''}">
          <div class="sav-head">
            <div>
              <div class="sav-client">${esc(t.client) || '—'}</div>
              <div class="sav-devis">Devis #${esc(t.devisId)} · ${esc(SAV_TYPE_LABEL[t.probleme] || t.probleme)}</div>
            </div>
            <span class="badge ${badgeCls}">${statutLabel}</span>
          </div>
          <div class="sav-garantie ${clsG}">${icon(g.sous_garantie ? 'check' : 'warning', 11)} ${esc(g.texte)}</div>
          <div class="sav-desc">${esc(t.description)}</div>
          <div class="sav-date">Ouvert le ${fmtDate(t.date_creation)}${t.date_resolution ? ' · Résolu le ' + fmtDate(t.date_resolution) : ''}</div>
          <div class="sav-date">${resolu ? '' :
            (t.pour
              ? icon('user', 11) + ' ' + esc(nomDe(t.pour))
              : '<span style="color:var(--danger)">' + icon('warning', 11) + ' Personne ne s’en occupe</span>')
            + (t.echeance ? ' · pour le ' + esc(fmtDate(t.echeance)) : '')}</div>
          ${(t.photos || []).length || (t.photos_apres || []).length ? `<div class="sav-photos">
            ${(t.photos || []).length ? `<div class="sp-col"><div class="sp-lbl">Avant</div><div class="sp-row">${t.photos.map(u => `<a href="${esc(u)}" target="_blank" rel="noopener"><img src="${esc(u)}" alt="Constat"></a>`).join('')}</div></div>` : ''}
            ${(t.photos_apres || []).length ? `<div class="sp-col"><div class="sp-lbl apres">Après</div><div class="sp-row">${t.photos_apres.map(u => `<a href="${esc(u)}" target="_blank" rel="noopener"><img src="${esc(u)}" alt="Réparation"></a>`).join('')}</div></div>` : ''}
          </div>` : ''}
          ${t.resolution ? `<div class="sav-resolution">${icon('check', 12)}
            <div><b>Réparé :</b> ${esc(t.resolution)}
            ${t.cause ? `<div class="sav-cause">Cause : ${esc(t.cause)}</div>` : ''}
            <div class="sav-sign">${esc(nomDe(t.resolu_par))}${t.date_resolution ? ' · ' + fmtDate(t.date_resolution) : ''}</div></div></div>` : ''}
          ${notes.length ? `<div class="sav-notes">${notes.map(n => `
            <div class="sav-note"><span class="sn-qui">${esc(nomDe(n.auteur))}</span>
            <span class="sn-txt">${esc(n.texte)}</span>
            <span class="sn-qd">${esc(window.SSUI.relTime(n.date))}</span></div>`).join('')}</div>` : ''}
          <div class="sav-actions">
            ${resolu
              ? `<button class="btn btn-ghost btn-sm" onclick="changerStatut(${dev}, ${id}, 'en_cours')">${icon('reply', 13)} Rouvrir</button>`
              : (t.pour
                  ? `<button class="btn btn-ghost btn-sm" onclick="attribuer(${dev}, ${id}, '${esc(autre(t.pour))}')">Passer à ${esc(nomDe(autre(t.pour)))}</button>`
                  : `<button class="btn btn-primary btn-sm" onclick="attribuer(${dev}, ${id}, '${esc(IDENTITE.key || 'nicolas')}')">Je prends</button>
                     <button class="btn btn-ghost btn-sm" onclick="attribuer(${dev}, ${id}, '${esc(autre(IDENTITE.key || 'nicolas'))}')">Pour ${esc(nomDe(autre(IDENTITE.key || 'nicolas')))}</button>`)
                + `<button class="btn btn-ghost btn-sm" onclick="ouvrirNote(${id})">${icon('message', 13)} Note</button>
                   <button class="btn btn-ghost btn-sm" onclick="ouvrirResolution(${id})">${icon('check', 13)} Réparé</button>`}
            <a class="btn btn-ghost btn-sm" href="vue.html?id=${encodeURIComponent(t.devisId)}#sav">${icon('window', 14)} La fiche</a>
            <a class="btn btn-ghost btn-sm" href="${window.SSUI.lienSujet({ client: t.client, devis_id: t.devisId, kind: 'question' })}" title="Poser une question à l'autre sur ce SAV">${icon('message', 14)} Demander</a>
          </div>
          <div class="sav-box ${NOTE_OUVERTE === t.id ? 'on' : ''}">
            <textarea class="textarea" id="nt-${esc(t.id)}" style="min-height:52px" placeholder="Appelé le client, pièce commandée…"></textarea>
            <div class="sav-box-fin"><button class="btn btn-primary btn-sm" onclick="envoyerNote(${dev}, ${id})">Ajouter</button></div>
          </div>
          <div class="sav-box ${RESOUT === t.id ? 'on' : ''}">
            <textarea class="textarea" id="rs-${esc(t.id)}" style="min-height:52px" placeholder="Ce qui a été réparé (obligatoire)…"></textarea>
            <input class="input" id="cs-${esc(t.id)}" style="margin-top:var(--sp-2)" placeholder="La cause, si elle est connue (facultatif)">
            <div class="sav-ajout-photo">
              <label class="btn btn-ghost btn-sm">${icon('camera', 13)} Photo après
                <input type="file" accept="image/*" multiple style="display:none" onchange="ajouterPhotoApres(${dev}, ${id}, this)">
              </label>
              <span class="sp-attente" id="pa-${esc(t.id)}">${(t.photos_apres || []).length ? (t.photos_apres.length + ' photo(s) enregistrée(s)') : ''}</span>
            </div>
            <div class="sav-box-fin">
              <button class="btn btn-ghost btn-sm" onclick="ouvrirResolution(${id})">Annuler</button>
              <button class="btn btn-primary btn-sm" onclick="cloturer(${dev}, ${id})">Marquer réparé</button>
            </div>
          </div>
        </div>`;
    }

    function render(all) {
      const ouverts = all.filter(t => t.statut === 'ouvert').sort((a, b) => String(b.date_creation).localeCompare(String(a.date_creation)));
      const enCours = all.filter(t => t.statut === 'en_cours').sort((a, b) => String(b.date_creation).localeCompare(String(a.date_creation)));
      const resolus = all.filter(t => t.statut === 'resolu').sort((a, b) => String(b.date_resolution || b.date_creation).localeCompare(String(a.date_resolution || a.date_creation)));

      el('kpis').innerHTML = `
        <div class="kpi ticked danger"><div class="kpi-label">Ouverts</div><div class="kpi-value">${ouverts.length}</div><div class="kpi-sub">à traiter</div></div>
        <div class="kpi ticked"><div class="kpi-label">En cours</div><div class="kpi-value">${enCours.length}</div><div class="kpi-sub">en traitement</div></div>
        <div class="kpi ticked ok"><div class="kpi-label">Résolus</div><div class="kpi-value">${resolus.length}</div><div class="kpi-sub">total historique</div></div>`;
      if (window.SSUI.animateKpis) window.SSUI.animateKpis(el('kpis'));   // odometre partage (coup de frais)

      if (!all.length) {
        // Un écran vide sans point d'entrée se lit comme « fonctionnalité absente » : on explique
        // et on propose l'action directement ici.
        el('host').innerHTML = `<div class="empty">${icon('check', 40)}
          <div>Aucun ticket SAV pour l'instant.</div>
          <div class="hint">Un ticket se crée sur un chantier posé — clique ci-dessous pour choisir le chantier concerné.</div>
          <button class="btn btn-primary mt-4" onclick="openPicker()">+ Nouveau ticket SAV</button>
        </div>`;
        return;
      }
      const section = (title, list) => list.length ? `
        <div class="sav-section-title">${title} <span class="n">(${list.length})</span></div>
        <div class="sav-grid">${list.map(ticketCard).join('')}</div>` : '';
      el('host').innerHTML = section('Ouverts', ouverts) + section('En cours', enCours) + section('Résolus', resolus);
    }

    el('modalPick').addEventListener('click', (e) => { if (e.target === el('modalPick')) closePicker(); });
    document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closePicker(); });

    load();
  </script>
</body>
</html>
