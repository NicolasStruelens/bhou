<!DOCTYPE html>
<html lang="fr" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>SolariScreen — SAV</title>
  <!-- ── Installation sur l'écran d'accueil (Android + iPhone) — aucun service worker ── -->
  <link rel="manifest" href="../manifest.webmanifest">
  <meta name="theme-color" content="#0b1224" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#f4f6fb" media="(prefers-color-scheme: light)">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="SolariScreen">
  <link rel="apple-touch-icon" href="../assets/img/apple-touch-icon.png">
  <link rel="icon" type="image/png" href="../assets/img/logo-solariscreen.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600;700&family=Orbitron:wght@600;800&display=swap" rel="stylesheet">
  <script src="../assets/js/theme.js"></script>
  <link rel="stylesheet" href="../assets/css/tokens.css">
  <link rel="stylesheet" href="../assets/css/theme-dark.css">
  <link rel="stylesheet" href="../assets/css/theme-light.css">
  <link rel="stylesheet" href="../assets/css/base.css">
  <style>
    .sav-section-title { display: flex; align-items: center; gap: var(--sp-2); font-family: var(--font-mono); font-size: var(--fs-2xs); text-transform: uppercase; letter-spacing: 0.08em; color: var(--text-subtle); margin: var(--sp-6) 0 var(--sp-3); }
    .sav-section-title:first-child { margin-top: 0; }
    .sav-section-title .n { color: var(--text-muted); }
    .sav-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(300px, 100%), 1fr)); gap: var(--sp-3); }
    .sav-card { border: 1px solid var(--border); border-radius: var(--r-md); background: var(--surface); padding: var(--sp-4); --tick-color: var(--danger); }
    .sav-card.is-resolu { --tick-color: var(--ok); opacity: 0.7; }
    .sav-head { display: flex; justify-content: space-between; align-items: flex-start; gap: var(--sp-2); }
    .sav-client { font-weight: 700; }
    .sav-devis { font-family: var(--font-mono); font-size: var(--fs-2xs); color: var(--text-subtle); margin-top: 0.2rem; }
    .sav-desc { font-size: var(--fs-sm); color: var(--text-muted); margin-top: var(--sp-2); }
    .sav-date { font-family: var(--font-mono); font-size: var(--fs-2xs); color: var(--text-subtle); margin-top: var(--sp-2); }

    /* Sélecteur de devis pour créer un ticket (même gabarit de modale que le dashboard) */
    .modal-bg { position: fixed; inset: 0; background: rgba(0,0,0,0.55); z-index: 1000; display: none; align-items: center; justify-content: center; padding: var(--sp-4); }
    .modal-bg.open { display: flex; }
    .modal { background: var(--surface); border: 1px solid var(--border-strong); border-radius: var(--r-md); box-shadow: var(--shadow); width: 560px; max-width: 100%; max-height: 88vh; display: flex; flex-direction: column; --tick-color: var(--accent-2); }
    .modal .mhead { font-family: var(--font-display); font-size: var(--fs-md); padding: var(--sp-4) var(--sp-5); border-bottom: 1px solid var(--border); color: var(--accent); display: flex; align-items: center; gap: var(--sp-2); }
    .modal .mbody { padding: var(--sp-4) var(--sp-5); overflow-y: auto; flex: 1; min-height: 120px; }
    .pick-item { display: flex; align-items: center; gap: var(--sp-3); width: 100%; text-align: left; background: var(--surface-2); border: 1px solid var(--border); border-radius: var(--r-sm); padding: var(--sp-3); margin-bottom: var(--sp-2); cursor: pointer; color: inherit; font: inherit; }
    .pick-item:hover { border-color: var(--accent); }
    .pick-item .pi-main { flex: 1; min-width: 0; }
    .pick-item .pi-name { font-weight: 700; }
    .pick-item .pi-sub { font-family: var(--font-mono); font-size: var(--fs-2xs); color: var(--text-subtle); margin-top: 0.15rem; }
  </style>
</head>
<body>
  <div class="fx-grid"></div>

  <header class="app-header">
    <div class="brand">
      <span class="brand-logo"><img src="../assets/img/logo-solariscreen.png" alt="" onerror="this.style.display='none'"></span>
      <div>
        <h1><a href="dashboard.html">SOLARISCREEN</a></h1>
        <div class="module">SAV</div>
      </div>
    </div>
    <div class="header-actions">
      <button class="btn btn-primary btn-sm" onclick="openPicker()"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg> Nouveau ticket SAV</button>
      <span id="quickNav"></span>
      <span id="themeToggle"></span>
      <a class="btn btn-ghost btn-sm" href="dashboard.html"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg> Dashboard</a>
    </div>
  </header>

  <main class="container">
    <div class="kpis" id="kpis"></div>
    <div id="host"><div aria-busy="true"><div class="skl" style="height:96px;margin-bottom:var(--sp-3)"></div><div class="skl" style="height:96px;margin-bottom:var(--sp-3)"></div><div class="skl" style="height:96px"></div></div></div>
  </main>

  <!-- Sélecteur de chantier : un ticket SAV est toujours rattaché à un devis posé -->
  <div class="modal-bg" id="modalPick">
    <div class="modal ticked">
      <div class="mhead">
        <span id="pickTitle">Sur quel chantier ?</span>
        <button class="btn btn-ghost btn-sm" style="margin-left:auto;" onclick="closePicker()">✕</button>
      </div>
      <div class="mbody">
        <input class="input" id="pickSearch" placeholder="Rechercher un client, une ville, un n° de devis…" oninput="renderPicker()" style="margin-bottom:var(--sp-3);">
        <div id="pickList"></div>
      </div>
    </div>
  </div>

  <script src="../assets/js/ui.js"></script>
  <script src="../assets/js/nav.js"></script>
  <script src="../assets/js/api.js"></script>
  <script>
    const SS = window.SS;
    const { mountThemeToggle } = window.SSTheme;
    const { fmtDate, el, icon, normDevis } = window.SSUI;
    mountThemeToggle(document.getElementById('themeToggle'));
    window.SSNav.mount(document.getElementById('quickNav'));

    const SAV_TYPE_LABEL = { moteur: 'Moteur', toile: 'Toile', reglage: 'Réglage', garantie: 'Garantie', autre: 'Autre' };
    const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
    let ELIGIBLES = [];   // chantiers sur lesquels un ticket SAV a du sens (pose faite)

    async function load() {
      const raw = await SS.listDevis();
      const tous = (raw || []).map(normDevis);
      const summary = tous.filter(d => (d.sav_tickets || []).length);
      // Un SAV concerne un chantier POSÉ (jalon partagé isPoseDone : PV de réception signé ou
      // étape fournisseur « Posé »), ou déjà marqué terminé. Les archivés sont exclus.
      ELIGIBLES = tous
        .filter(d => !d.archive && (window.SSUI.isPoseDone(d) || d.statut === 'termine'))
        .sort((a, b) => String(b.date_modification).localeCompare(String(a.date_modification)));
      const all = [];
      summary.forEach(d => (d.sav_tickets || []).forEach(t => all.push({ ...t, devisId: d.id, client: `${d.prenom} ${d.nom}`.trim() })));
      render(all);
    }

    // ── Création d'un ticket : on choisit d'abord le chantier, puis on ouvre sa fiche au bon endroit ──
    window.openPicker = () => { el('pickSearch').value = ''; renderPicker(); el('modalPick').classList.add('open'); el('pickSearch').focus(); };
    window.closePicker = () => el('modalPick').classList.remove('open');
    window.renderPicker = () => {
      const q = el('pickSearch').value.trim().toLowerCase();
      const list = q
        ? ELIGIBLES.filter(d => `${d.prenom} ${d.nom} ${d.id} ${d.ville}`.toLowerCase().includes(q))
        : ELIGIBLES;
      el('pickList').innerHTML = list.length
        ? list.slice(0, 50).map(d => `
            <button class="pick-item" onclick="goCreate('${encodeURIComponent(d.id)}')">
              <div class="pi-main">
                <div class="pi-name">${esc(`${d.prenom} ${d.nom}`.trim() || '—')}</div>
                <div class="pi-sub">#${esc(d.id)}${d.ville ? ' · ' + esc(d.ville) : ''}${(d.sav_tickets || []).length ? ' · ' + d.sav_tickets.length + ' ticket(s)' : ''}</div>
              </div>
              ${icon('window', 16)}
            </button>`).join('')
        : `<div class="empty">Aucun chantier posé ne correspond.<div class="hint">Un ticket SAV se crée sur un chantier dont la pose est faite (PV de réception signé ou étape « Posé »).</div></div>`;
    };
    // `#sav` : la fiche devis déplie la carte SAV et y amène directement (voir vue.html).
    window.goCreate = (encId) => { location.href = `vue.html?id=${encId}#sav`; };

    function ticketCard(t) {
      const badgeCls = t.statut === 'resolu' ? 'badge-ok' : (t.statut === 'en_cours' ? 'badge-warn' : 'badge-danger');
      const statutLabel = t.statut === 'resolu' ? 'Résolu' : (t.statut === 'en_cours' ? 'En cours' : 'Ouvert');
      return `
        <div class="sav-card ticked ${t.statut === 'resolu' ? 'is-resolu' : ''}">
          <div class="sav-head">
            <div>
              <div class="sav-client">${esc(t.client) || '—'}</div>
              <div class="sav-devis">Devis #${esc(t.devisId)} · ${esc(SAV_TYPE_LABEL[t.probleme] || t.probleme)}</div>
            </div>
            <span class="badge ${badgeCls}">${statutLabel}</span>
          </div>
          <div class="sav-desc">${esc(t.description)}</div>
          <div class="sav-date">Ouvert le ${fmtDate(t.date_creation)}${t.date_resolution ? ' · Résolu le ' + fmtDate(t.date_resolution) : ''}</div>
          <div class="row mt-3"><a class="btn btn-ghost btn-sm" href="vue.html?id=${encodeURIComponent(t.devisId)}">${icon('window', 14)} Voir la fiche</a></div>
        </div>`;
    }

    function render(all) {
      const ouverts = all.filter(t => t.statut === 'ouvert').sort((a, b) => String(b.date_creation).localeCompare(String(a.date_creation)));
      const enCours = all.filter(t => t.statut === 'en_cours').sort((a, b) => String(b.date_creation).localeCompare(String(a.date_creation)));
      const resolus = all.filter(t => t.statut === 'resolu').sort((a, b) => String(b.date_resolution || b.date_creation).localeCompare(String(a.date_resolution || a.date_creation)));

      el('kpis').innerHTML = `
        <div class="kpi ticked danger"><div class="kpi-label">Ouverts</div><div class="kpi-value">${ouverts.length}</div><div class="kpi-sub">à traiter</div></div>
        <div class="kpi ticked"><div class="kpi-label">En cours</div><div class="kpi-value">${enCours.length}</div><div class="kpi-sub">en traitement</div></div>
        <div class="kpi ticked ok"><div class="kpi-label">Résolus</div><div class="kpi-value">${resolus.length}</div><div class="kpi-sub">total historique</div></div>`;
      if (window.SSUI.animateKpis) window.SSUI.animateKpis(el('kpis'));   // odometre partage (coup de frais)

      if (!all.length) {
        // Un écran vide sans point d'entrée se lit comme « fonctionnalité absente » : on explique
        // et on propose l'action directement ici.
        el('host').innerHTML = `<div class="empty">${icon('check', 40)}
          <div>Aucun ticket SAV pour l'instant.</div>
          <div class="hint">Un ticket se crée sur un chantier posé — clique ci-dessous pour choisir le chantier concerné.</div>
          <button class="btn btn-primary mt-4" onclick="openPicker()">+ Nouveau ticket SAV</button>
        </div>`;
        return;
      }
      const section = (title, list) => list.length ? `
        <div class="sav-section-title">${title} <span class="n">(${list.length})</span></div>
        <div class="sav-grid">${list.map(ticketCard).join('')}</div>` : '';
      el('host').innerHTML = section('Ouverts', ouverts) + section('En cours', enCours) + section('Résolus', resolus);
    }

    el('modalPick').addEventListener('click', (e) => { if (e.target === el('modalPick')) closePicker(); });
    document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closePicker(); });

    load();
  </script>
</body>
</html>
