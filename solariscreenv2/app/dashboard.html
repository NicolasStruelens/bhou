<!DOCTYPE html>
<html lang="fr" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>SolariScreen — Tableau de bord</title>
  <!-- ── Installation sur l'écran d'accueil (Android + iPhone) — aucun service worker ── -->
  <link rel="manifest" href="../manifest.webmanifest">
  <meta name="theme-color" content="#0b1224" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#f4f6fb" media="(prefers-color-scheme: light)">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="SolariScreen">
  <link rel="apple-touch-icon" href="../assets/img/apple-touch-icon.png">
  <link rel="icon" type="image/png" href="../assets/img/logo-solariscreen.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600;700&family=Orbitron:wght@600;800&display=swap" rel="stylesheet">
  <script src="../assets/js/theme.js"></script>
  <link rel="stylesheet" href="../assets/css/tokens.css">
  <link rel="stylesheet" href="../assets/css/theme-dark.css">
  <link rel="stylesheet" href="../assets/css/theme-light.css">
  <link rel="stylesheet" href="../assets/css/base.css">
  <style>
    .toolbar { display: flex; gap: var(--sp-3); align-items: center; flex-wrap: wrap; margin-bottom: var(--sp-4); }
    .toolbar .search { flex: 1; min-width: 220px; position: relative; }
    .toolbar .search input { padding-left: 2.2rem; }
    .toolbar .search svg { position: absolute; left: 0.7rem; top: 50%; transform: translateY(-50%); width: 14px; height: 14px; color: var(--text-subtle); pointer-events: none; }
    #advToggle.active { border-color: var(--accent-2); color: var(--accent-2); }
    #advCount { font-family: var(--font-mono); font-size: var(--fs-2xs); margin-left: 0.3rem; opacity: 0.75; }
    .adv-panel { display: flex; gap: var(--sp-3); align-items: end; flex-wrap: wrap; padding: var(--sp-3); margin-bottom: var(--sp-4); border: 1px solid var(--border); border-radius: var(--r-sm); background: var(--surface-2); }
    .adv-panel.hidden { display: none; }
    .adv-panel .field { margin: 0; min-width: 130px; }
    .filters { display: flex; gap: 0.35rem; flex-wrap: wrap; }

    /* ══════════ TÉLÉPHONE : barre d'outils et filtres ══════════════════════════════════════
       La barre d'outils occupait 173 px sur 4 rangées (recherche, tri, Export, Import,
       Activité, Filtres avancés) et les deux rangées de filtres 126 px de plus : le premier
       devis n'apparaissait qu'à 964 px, soit plus d'un écran de défilement AVANT de voir
       quoi que ce soit d'utile. Ici : recherche seule sur sa ligne, puis tri + boutons en
       icônes sur une seule ligne, et les filtres deviennent des rubans qui défilent
       horizontalement (aucun filtre perdu, mais une seule rangée de haut). */
    @media (max-width: 560px) {
      .toolbar { gap: var(--sp-2); margin-bottom: var(--sp-3); }
      .toolbar .search { flex: 1 1 100%; min-width: 0; }
      .toolbar .select { flex: 1; min-width: 0; }
      /* Comme dans le bandeau : le libellé disparaît, l'icône reste, l'infobulle explique.
         Carrés de 44 px avec une icône de 20 px, sinon `@media (pointer: coarse)` étire les
         boutons à 44 px de haut autour d'une icône de 14 px — l'effet « case vide ». */
      .toolbar .btn { font-size: 0; gap: 0; padding: 0; width: 44px; min-width: 44px; height: 44px; min-height: 44px; justify-content: center; flex: none; }
      .toolbar .btn > svg { width: 20px; height: 20px; }
      .toolbar #advCount { display: none; }
      /* Sauvegarde et restauration d'un fichier JSON : ça se fait au bureau, jamais au doigt
         sur un chantier. Les deux boutons disparaissent du téléphone (rien n'est retiré du
         code : ils réapparaissent tels quels dès qu'on repasse sur un grand écran). */
      #btnExport, #btnImport { display: none; }
      .filters { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; -webkit-overflow-scrolling: touch; padding-bottom: 2px; }
      .filters::-webkit-scrollbar { display: none; }
      .filters .chip { flex: none; }
      .kpi-bar { margin-bottom: 6px; }
      /* Trois rangées de pastilles (vue · vendeur · produit) occupaient 100 px avant même le
         premier devis. Seule la rangée des VUES reste visible — c'est celle qu'on touche
         tous les jours. Vendeur et produit se déplient avec « Filtres avancés » (classe
         posée par toggleAdvFilters), et un filtre actif reste de toute façon annoncé et
         annulable dans la barre « filtres actifs » juste en dessous. */
      #sellerFilters, #typeFilters { display: none; }
      body.adv-open #sellerFilters, body.adv-open #typeFilters { display: flex; }
    }
    .chip-archive { margin-left: var(--sp-3); border-color: var(--accent-2); color: var(--accent-2-ink); background: color-mix(in srgb, var(--accent-2) 14%, transparent); font-weight: 700; }
    .chip-archive:hover { border-color: var(--accent-2); color: var(--accent-2-ink); box-shadow: var(--glow-soft); }
    /* Actif : encre sombre garantie sur le fond or plein (le texte quasi-blanc était illisible). */
    .chip-archive.active { background: var(--accent-2); color: #1a1200; border-color: var(--accent-2); }

    /* Accès Mode Terrain mis en avant (couleur signature or) — usage tactile fréquent depuis le téléphone */

    /* ── Pastilles de statut colorées (menu custom) ── */
    table.data tbody tr { cursor: pointer; }
    /* Le montant est l'info la plus décisive de la ligne : plus gros que le reste, or lisible. */
    .price { font-family: var(--font-mono); font-weight: 700; font-size: var(--fs-md); color: var(--accent-2-ink); letter-spacing: 0.01em; }
    /* --row-line = hauteur de référence de la 1ère ligne d'une rangée du tableau. La
       pastille de statut fait cette hauteur naturellement (padding+bordure) ; .name-row
       (colonne Client) reçoit le même min-height pour que son centre vertical tombe
       exactement au même endroit, même quand ses badges internes ont une hauteur variable
       (rien, un badge texte, ou une simple icône) — sans ça, le point de centrage de
       .name-row change selon le contenu et se décale de la pastille de quelques px. */
    :root { --row-line: 1.64rem; }
    .status-pill {
      display: inline-flex; align-items: center; gap: 0.45rem; min-height: var(--row-line); box-sizing: border-box;
      font-family: var(--font-mono); font-size: var(--fs-2xs); font-weight: 600;
      letter-spacing: 0.03em; text-transform: uppercase;
      padding: 0.32rem 0.6rem; border-radius: var(--r-sm); cursor: pointer; transition: all var(--t-fast);
      border: 1px solid color-mix(in srgb, var(--st, var(--border-strong)) 45%, transparent);
      color: var(--st, var(--text-muted));
      background: color-mix(in srgb, var(--st, var(--border-strong)) 10%, transparent);
      white-space: nowrap;
    }
    .status-pill .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--st, var(--text-muted)); box-shadow: 0 0 6px color-mix(in srgb, var(--st, transparent) 60%, transparent); }
    .status-pill svg { opacity: 0.55; }
    .status-pill:hover { box-shadow: var(--glow-soft); }

    /* ── Vue "Aujourd'hui" : briefing discret, uniquement s'il y a quelque chose à signaler ── */
    .today-brief {
      display: flex; align-items: center; gap: var(--sp-3); flex-wrap: wrap;
      padding: var(--sp-3) var(--sp-4); margin-bottom: var(--sp-4);
      background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-md);
      --tick-color: var(--accent-2);
    }
    .today-brief.hidden { display: none; }
    .tb-label { font-family: var(--font-mono); font-size: var(--fs-2xs); text-transform: uppercase; letter-spacing: 0.06em; color: var(--accent-2); display: flex; align-items: center; gap: 0.4rem; flex: none; }
    .tb-chip {
      display: inline-flex; align-items: center; gap: 0.4rem; font-family: var(--font-mono); font-size: var(--fs-2xs); font-weight: 600;
      padding: 0.3rem 0.65rem; border-radius: var(--r-sm); cursor: pointer; transition: all var(--t-fast);
      border: 1px solid color-mix(in srgb, var(--tbc, var(--text-subtle)) 45%, transparent);
      color: var(--tbc, var(--text-muted)); background: color-mix(in srgb, var(--tbc, var(--text-subtle)) 10%, transparent);
    }
    .tb-chip:hover { box-shadow: var(--glow-soft); }
    /* Téléphone : les priorités du jour restent TOUTES visibles (jamais de défilement caché
       ici, c'est la consigne de la journée), mais serrées — une consigne par rangée pleine
       largeur, et le titre « Aujourd'hui » sur sa propre ligne au-dessus.
       Pourquoi pleine largeur et non deux par rangée : à leur largeur naturelle, deux
       consignes tiendraient à 1 px près (158 + 171 pour 334 de disponible) — un « 3 »
       au lieu d'un « 1 » suffirait à faire sauter la mise en page d'une rangée à l'autre.
       Une consigne par rangée donne toujours le même écran, quels que soient les chiffres,
       et une cible tactile pleine largeur. */
    @media (max-width: 560px) {
      .today-brief { gap: 6px; padding: var(--sp-2) var(--sp-3); margin-bottom: var(--sp-3); }
      .tb-label { flex-basis: 100%; }
      .tb-chip { flex: 1 1 auto; justify-content: flex-start; }
    }

    td .actions { display: flex; gap: 0.3rem; justify-content: flex-end; }
    .icon-btn { width: 30px; height: 30px; display: grid; place-items: center; border: 1px solid var(--border); border-radius: var(--r-sm); background: var(--surface-2); color: var(--text-muted); cursor: pointer; font-size: 0.85rem; transition: all var(--t-fast); }
    .icon-btn:hover { border-color: var(--accent); color: var(--accent); }
    .icon-btn.danger:hover { border-color: var(--danger); color: var(--danger); }


    /* Pensée de la session — remplace la date au centre du header.
       flex:1 = occupe l'espace restant entre le brand et les actions et centre son
       contenu DANS cet espace (un centrage absolu se faisait chevaucher par les actions).
       Présentation : phrase encadrée de guillemets dorés à halo néon (cohérent avec le
       thème), révélée mot à mot (léger flou → net, en cascade). La taille s'auto-ajuste
       en JS pour qu'aucune phrase, même longue, ne soit jamais coupée. */
    .header-mood { flex: 1; min-width: 0; overflow: hidden; display: flex; align-items: center; justify-content: center; }
    .mantra {
      display: inline-flex; align-items: baseline; gap: 0.5rem; max-width: 100%;
      background: none; border: none; padding: 0.1rem 0.35rem; margin: 0; cursor: pointer;
      color: var(--text-muted); border-radius: var(--r-sm); transition: color var(--t-fast);
    }
    .mantra:hover { color: var(--text); }
    .mantra:hover .mq { opacity: 1; }
    .mantra:focus-visible { outline: 1px solid var(--accent); outline-offset: 3px; }
    .mantra .mq {
      font-family: var(--font-display); font-weight: 700; font-size: 1.05em; line-height: 1;
      color: var(--accent-2); opacity: 0.72; flex: none;
      text-shadow: 0 0 10px color-mix(in srgb, var(--accent-2) 45%, transparent);
      transition: opacity var(--t-fast);
    }
    .mantra-text { font-size: var(--fs-sm); letter-spacing: 0.004em; line-height: 1.25; white-space: nowrap; }
    .mantra .mw { display: inline-block; white-space: pre; }
    /* Révélation mot à mot rejouée à chaque nouvelle pensée (délai réglé inline par mot). */
    @keyframes mantraWordIn {
      from { opacity: 0; filter: blur(5px); transform: translateY(0.35em); }
      to   { opacity: 1; filter: blur(0);   transform: none; }
    }
    .mantra.reveal .mw { opacity: 0; animation: mantraWordIn 0.5s cubic-bezier(0.2, 0.6, 0.3, 1) forwards; }
    @media (prefers-reduced-motion: reduce) {
      .mantra.reveal .mw { animation: none; opacity: 1; filter: none; transform: none; }
    }
    @media (max-width: 900px) { .header-mood { display: none; } }

    /* Chip météo à la position actuelle (géolocalisation) — dans la barre d'actions. */
    .wx-chip {
      display: inline-flex; align-items: center; gap: 0.35rem; white-space: nowrap;
      font-family: var(--font-mono); font-size: var(--fs-2xs); color: var(--text-muted);
      border: 1px solid var(--border); border-radius: var(--r-sm); padding: 0.22rem 0.5rem;
    }
    .wx-chip svg { color: var(--accent-2); }
    .wx-chip .wx-city { color: var(--text-subtle); }
    @media (max-width: 1120px) { .wx-chip .wx-city { display: none; } }
    @media (max-width: 760px) { .wx-chip { display: none; } }

    /* Toutes les cellules centrées verticalement : les colonnes à 1 ligne (date, montant…)
       s'alignent proprement sur le milieu des colonnes à 2 lignes (client, statut) → rangée calme. */
    #tableHost table.data td { vertical-align: middle; }
    #tableHost table.data td, #tableHost table.data th { padding-top: 0.7rem; padding-bottom: 0.7rem; }
    /* Cellule CLIENT : 2 lignes claires — (1) nom + petits indicateurs collés à sa suite ;
       (2) #id + type(s) produit. Groupés à GAUCHE (plus de "space-between" qui laissait la
       pastille de probabilité flotter, orpheline, tout à droite de la cellule). */
    .client-cell { display: flex; flex-direction: column; gap: 5px; max-width: 280px; }
    .name-row { display: flex; align-items: center; gap: 0.4rem; width: 100%; min-height: var(--row-line); box-sizing: border-box; }
    .client-cell .name { font-weight: 600; color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; flex: 0 1 auto; }
    .name-badges { display: flex; align-items: center; gap: 0.3rem; flex: none; }
    .id-row { display: flex; align-items: center; gap: 0.4rem; flex-wrap: wrap; row-gap: 4px; }
    /* « Prochaine action » : la consigne du dossier, en dessous de la référence. Discrète mais
       colorée par l'urgence (--nac fourni par prochaineAction), lisible en un balayage vertical. */
    .next-act { display: inline-flex; align-items: center; gap: 0.25rem; margin-top: 3px;
      font-size: var(--fs-3xs); font-family: var(--font-mono); letter-spacing: 0.02em;
      color: var(--nac, var(--text-subtle)); }
    .next-act svg { flex: none; opacity: 0.85; }
    .client-cell .id { font-family: var(--font-mono); font-size: var(--fs-2xs); color: var(--text-subtle); flex: none; }
    /* Badges "type de produit" (Screen / Volet / Tente solaire / Tablier volet) : style neutre
       façon annotation technique (comme .badge de base), volontairement SANS les couleurs
       accent/accent-2 déjà prises par Informatif/Portfolio/Statut — sinon la couleur perdrait
       son sens de code (statut) et deviendrait juste décorative. */
    .type-badges { display: flex; flex-wrap: wrap; gap: 0.25rem; }
    .type-badges .badge { padding: 0.12rem 0.4rem; font-size: 0.62rem; }
    .count-pill { font-size: var(--fs-xs); color: var(--text-muted); font-family: var(--font-mono); }
    /* Médias : caméra + commentaires toujours visibles (grisés à 0, colorés sinon), un peu plus
       grands, façon petits jetons cliquables ; survol = aperçu flottant (photos/notes). */
    .media-icons { display: flex; align-items: center; gap: 8px; }
    .mi-slot { display: inline-flex; align-items: center; gap: 4px; padding: 3px 7px; border-radius: var(--r-sm); border: 1px solid transparent; color: var(--text-subtle); opacity: 0.4; font-size: var(--fs-xs); transition: opacity var(--t-fast), border-color var(--t-fast), background var(--t-fast); }
    .mi-slot.active { opacity: 1; color: var(--text); }
    .mi-slot[data-preview] { cursor: help; border-color: var(--border); }
    .mi-slot[data-preview]:hover { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 8%, transparent); }
    .note-flag { display: inline-flex; align-items: center; color: var(--accent-2); margin-left: 2px; }

    /* ══════════ KPI — bandeau COMPACT (gagne de la hauteur : la liste des devis remonte) ════════
       5 tuiles serrées séparées par des filets fins (au lieu de 5 grosses cartes de ~166 px).
       Mêmes chiffres, mêmes visuels (anneau + barres), ~2× moins haut. */
    #kpis { display: block; }
    .kpi-strip { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 1px;
      background: var(--border); border: 1px solid var(--border); border-radius: var(--r-md); overflow: hidden; }
    .kt { background: var(--surface); padding: 11px 15px; display: flex; flex-direction: column; gap: 3px; min-width: 0; }
    .kt-l { font-family: var(--font-mono); font-size: var(--fs-2xs); text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-subtle); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .kt-v { font-family: var(--font-mono); font-size: clamp(0.95rem, 1.9vw, 1.4rem); font-weight: 700; color: var(--text); line-height: 1.15; white-space: nowrap; }
    .kt-s { font-size: var(--fs-2xs); color: var(--text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .kt.gold .kt-v { color: var(--accent-2-ink); } .kt.accent .kt-v { color: var(--accent); } .kt.warn .kt-v { color: var(--warn); } .kt.ok .kt-v { color: var(--ok); }
    .kt-vr { display: flex; align-items: center; gap: 9px; min-width: 0; }
    .kt-ring { flex: none; }
    .kt-ring .rbg { stroke: color-mix(in srgb, var(--text-subtle) 28%, transparent); }
    .kt-ring .rfg { stroke: var(--accent-2); }
    .kt-ring .rtxt { fill: var(--accent-2-ink); font-family: var(--font-mono); font-size: 10px; font-weight: 700; }
    @media (prefers-reduced-motion: no-preference) { .kt-ring .rfg { animation: kpiRing .9s cubic-bezier(.2,.8,.2,1) both; } }
    @keyframes kpiRing { from { stroke-dashoffset: 97.4; } }
    .kt-bars { display: flex; flex-direction: column; gap: 5px; margin-top: 3px; }
    .ktb { display: grid; grid-template-columns: 13px 1fr auto; align-items: center; gap: 7px; }
    .ktb > span:first-child { font-family: var(--font-mono); font-size: var(--fs-2xs); color: var(--text-muted); }
    .ktb-t { height: 7px; border-radius: 4px; background: color-mix(in srgb, var(--text-subtle) 20%, transparent); overflow: hidden; }
    .ktb-t i { display: block; height: 100%; border-radius: 4px; }
    @media (prefers-reduced-motion: no-preference) { .ktb-t i { animation: kbFill .9s cubic-bezier(.2,.8,.2,1) both; } }
    @keyframes kbFill { from { width: 0; } }
    .ktb b { font-family: var(--font-mono); font-size: var(--fs-2xs); font-weight: 700; color: var(--text); white-space: nowrap; }
    @media (max-width: 900px) { .kpi-strip { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
    @media (max-width: 560px) { .kpi-strip { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
    /* Tuile KPI cliquable → filtre la liste (#7) */
    .kt[data-filter] { cursor: pointer; transition: background var(--t-fast); }
    .kt[data-filter]:hover { background: var(--surface-2); }
    .kt[data-filter]::after { content: ''; position: absolute; }
    .kt { position: relative; }
    .kt[data-filter].on { box-shadow: inset 0 -2px 0 0 var(--accent); }
    /* Barre d'outils du bandeau : repli (#11) + densité (#22) */
    .kpi-bar { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
    .kpi-bar .sp { flex: 1; }
    .mini-btn { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--border); background: transparent;
      color: var(--text-muted); font-family: var(--font-mono); font-size: var(--fs-2xs); padding: 4px 9px; border-radius: var(--r-sm); cursor: pointer; }
    .mini-btn:hover { border-color: var(--accent); color: var(--accent); }
    .mini-btn.on { border-color: var(--accent); color: var(--accent); background: color-mix(in srgb, var(--accent) 10%, transparent); }
    /* Chips de filtres actifs (#16) */
    .active-filters { display: flex; align-items: center; gap: 7px; flex-wrap: wrap; margin: 0 0 var(--sp-3); }
    .af-chip { display: inline-flex; align-items: center; gap: 6px; font-family: var(--font-mono); font-size: var(--fs-2xs);
      border: 1px solid var(--accent-border, color-mix(in srgb, var(--accent) 45%, transparent)); color: var(--accent);
      background: color-mix(in srgb, var(--accent) 9%, transparent); border-radius: var(--r-sm); padding: 3px 8px; }
    .af-chip button { border: 0; background: transparent; color: inherit; cursor: pointer; font-size: 13px; line-height: 1; padding: 0; }
    .af-clear { font-family: var(--font-mono); font-size: var(--fs-2xs); color: var(--text-subtle); background: transparent; border: 0; cursor: pointer; text-decoration: underline; }
    /* Rangement des dossiers perdus — proposé seulement dans la vue Refusé/Annulé. */
    .af-archive { display: inline-flex; align-items: center; gap: 5px; font-family: var(--font-mono); font-size: var(--fs-2xs);
      padding: 3px 9px; border-radius: var(--r-sm); border: 1px solid color-mix(in srgb, var(--accent-2) 45%, transparent);
      background: transparent; color: var(--accent-2-ink, var(--accent-2)); cursor: pointer; }
    .af-archive:hover { background: color-mix(in srgb, var(--accent-2) 14%, transparent); }
    /* La vue par défaut se distingue des filtres de statut : c'est le poste de travail, pas un tri. */
    .chip-actifs.active { background: var(--accent); border-color: var(--accent); color: #fff; }
    .af-total { font-family: var(--font-mono); font-size: var(--fs-2xs); color: var(--text-muted); margin-left: auto; }
    /* Densité compacte (#22) */
    .mix-list.dense { gap: 6px; }
    .mix-list.dense .mrow { padding: 7px 14px 7px 18px; gap: 12px; }
    .mix-list.dense .m-jp { width: 22px; height: 22px; }
    .mix-list.dense .m-sub { margin-top: 3px; }
    .mix-list.dense .m-gline { margin-top: 5px; }
    /* Signal cliquable = action directe (#25) */
    .m-sig.act { cursor: pointer; }
    .m-sig.act:hover { filter: brightness(1.12); box-shadow: 0 0 0 2px color-mix(in srgb, var(--sc) 25%, transparent); }

    /* ══════════ LIGNES « MIX » (refonte 2026-07-24) ══════════════════════════════════════════
       Chaque devis = une carte fine. Filet de couleur à gauche (urgence), UN signal fort à droite,
       micro-jalons + jauge d'engagement dans le sous-titre, actions au survol. Thème-aware. */
    .mix-list { display: flex; flex-direction: column; gap: 10px; padding: 4px 0 6px; }
    .mrow { position: relative; overflow: hidden; background: var(--surface-2); border: 1px solid var(--border);
      border-radius: var(--r-md); padding: 12px 16px 12px 18px; display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, auto) auto; gap: 15px; align-items: center;
      cursor: pointer; transition: transform var(--t-fast), border-color var(--t-fast), box-shadow var(--t-fast); }
    /* Le rail coloré remplace l'ancienne pastille d'initiales : il dit la même chose (le dossier) en
       portant en plus le statut, et rend ~53 px de large à chaque ligne pour du contenu utile. */
    .mrow::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; background: var(--rail, var(--border-strong)); }
    .mrow:hover { transform: translateY(-1px); border-color: var(--border-strong); box-shadow: var(--shadow); }
    .mrow.is-hot { border-color: color-mix(in srgb, var(--accent-2) 45%, var(--border)); }
    @keyframes mHot { 0%,100% { box-shadow: 0 0 18px -4px color-mix(in srgb, var(--accent-2) 42%, transparent); } 50% { box-shadow: 0 0 0 0 transparent; } }
    @media (prefers-reduced-motion: no-preference) { .mrow.is-hot { animation: mHot 3s ease-in-out infinite 1s; } }
    .m-main { min-width: 0; }
    /* ── Raccourcis de ligne ── Les gestes les plus fréquents (appeler, écrire, y aller, ouvrir le
       document, la fiche client, la facture) atteignables SANS ouvrir le devis. Toujours visibles
       mais en retrait : ils ne doivent pas concurrencer le nom et le montant. */
    .m-jump { display: inline-flex; align-items: center; gap: 2px; margin-left: auto; flex: none; }
    .m-jp { width: 26px; height: 26px; display: grid; place-items: center; border: 1px solid transparent; border-radius: var(--r-sm);
      background: transparent; color: var(--text-subtle); cursor: pointer; opacity: .62;
      transition: opacity var(--t-fast), color var(--t-fast), border-color var(--t-fast), background var(--t-fast); }
    .mrow:hover .m-jp { opacity: 1; }
    .m-jp:hover { color: var(--accent-2-ink, var(--accent-2)); border-color: color-mix(in srgb, var(--accent-2) 45%, transparent);
      background: color-mix(in srgb, var(--accent-2) 12%, transparent); opacity: 1; }
    .m-jp:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; opacity: 1; }
    .m-jp svg { display: block; }
    @media (max-width: 700px) { .m-jump { margin-left: 0; } }
    .m-nm { display: flex; align-items: center; gap: 8px; min-width: 0; }
    .m-name { font-weight: 600; font-size: var(--fs-md); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .m-nb { display: inline-flex; align-items: center; gap: 6px; flex: none; }
    .m-sub { display: flex; align-items: center; gap: 10px; margin-top: 6px; flex-wrap: wrap; }
    .m-sub .id { font-family: var(--font-mono); font-size: var(--fs-2xs); color: var(--text-subtle); }
    .m-date { font-family: var(--font-mono); font-size: var(--fs-2xs); color: var(--text-subtle); }
    .m-dots { display: inline-flex; align-items: center; gap: 4px; }
    .m-dots i { width: 6px; height: 6px; border-radius: 50%; background: var(--border-strong); }
    .m-dots i.d { background: var(--accent-2); }
    .m-dots i.n { width: 7px; height: 7px; background: var(--surface); border: 1.5px solid var(--accent); box-shadow: 0 0 0 2px color-mix(in srgb, var(--accent) 22%, transparent); }
    .m-gline { display: flex; align-items: center; gap: 9px; margin-top: 8px; }
    .m-gbar { height: 5px; flex: 1; max-width: 200px; border-radius: 4px; background: color-mix(in srgb, var(--text-subtle) 20%, transparent); overflow: hidden; position: relative; }
    .m-gbar i { display: block; height: 100%; border-radius: 4px; }
    .m-gbar u { position: absolute; top: 0; left: 0; height: 100%; width: 34%; background: linear-gradient(90deg, transparent, color-mix(in srgb, #fff 45%, transparent), transparent); }
    @media (prefers-reduced-motion: no-preference) { .m-gbar u { animation: mSheen 2.9s ease-in-out infinite 1.1s; } .m-gbar i { animation: mFill 1.1s cubic-bezier(.2,.8,.2,1) both; } }
    @keyframes mSheen { from { transform: translateX(-120%); } to { transform: translateX(330%); } }
    @keyframes mFill { from { width: 0; } }
    .m-gl { font-family: var(--font-mono); font-size: var(--fs-2xs); color: var(--text-subtle); white-space: nowrap; display: inline-flex; align-items: center; gap: 5px; }
    .m-signal { justify-self: end; }
    .m-sig { display: inline-flex; align-items: center; gap: 7px; font-family: var(--font-mono); font-size: var(--fs-2xs); font-weight: 700;
      padding: 5px 11px; border-radius: var(--r-sm); white-space: nowrap; max-width: 340px; overflow: hidden; text-overflow: ellipsis;
      border: 1px solid color-mix(in srgb, var(--sc) 45%, transparent); color: var(--sc); background: color-mix(in srgb, var(--sc) 11%, transparent); }
    .m-sig.muted { color: var(--text-muted); border-color: var(--border-strong); background: transparent; }
    @media (prefers-reduced-motion: no-preference) { .m-sig.hot { animation: mHotChip 2.6s ease-in-out infinite; } }
    @keyframes mHotChip { 0%,100% { box-shadow: 0 0 14px -3px color-mix(in srgb, var(--accent-2) 55%, transparent); } 50% { box-shadow: 0 0 0 0 transparent; } }
    .m-right { min-width: 116px; display: flex; flex-direction: column; align-items: flex-end; gap: 5px; }
    .m-right-top { display: flex; align-items: center; gap: 9px; }
    .m-right .price { font-family: var(--font-mono); font-weight: 700; font-size: var(--fs-md); color: var(--text); white-space: nowrap; }
    /* Bouton ⋯ (ouvre le menu d'actions) — discret au repos, se réveille au survol de la ligne.
       Plus de barre flottante qui recouvrait le prix : un seul point d'entrée, un menu propre à libellés. */
    .m-more { width: 30px; height: 30px; border-radius: 8px; border: 1px solid transparent; background: transparent; color: var(--text-subtle);
      cursor: pointer; display: grid; place-items: center; flex: none; transition: border-color var(--t-fast), color var(--t-fast), background var(--t-fast); }
    .mrow:hover .m-more { border-color: var(--border); color: var(--text-muted); }
    .m-more:hover { border-color: var(--accent); color: var(--accent); background: color-mix(in srgb, var(--accent) 9%, transparent); }
    /* Menu d'actions flottant (mêmes codes visuels que le menu de statut) */
    .actions-menu { position: fixed; z-index: 1300; min-width: 210px; background: var(--surface); border: 1px solid var(--border-strong);
      border-radius: var(--r-md); box-shadow: var(--shadow); padding: 5px; display: none; flex-direction: column; }
    .actions-menu.open { display: flex; }
    .actions-menu button { display: flex; align-items: center; gap: 11px; width: 100%; text-align: left; padding: 8px 11px; border: 0;
      background: transparent; color: var(--text); font-size: var(--fs-sm); border-radius: var(--r-sm); cursor: pointer; }
    .actions-menu button:hover { background: var(--surface-2); }
    .actions-menu button svg { width: 16px; height: 16px; color: var(--text-subtle); flex: none; }
    .actions-menu button.danger { color: var(--danger); } .actions-menu button.danger svg { color: var(--danger); }
    .actions-menu .am-sep { height: 1px; background: var(--border); margin: 4px 3px; }
    @media (max-width: 860px) {
      .mrow { grid-template-columns: minmax(0, 1fr) auto; }
      .m-signal { grid-column: 1 / -1; justify-self: start; margin-top: 6px; }
    }
    /* ── TÉLÉPHONE ── Une ligne faisait 257 px : trois dossiers par écran, et le montant
       atterrissait tout en bas, loin du nom. On repasse en deux colonnes (identité à gauche,
       montant à droite, sur la MÊME ligne que le nom), le signal et les raccourcis prenant
       toute la largeur en dessous. Le n° de devis disparaît (illisible et inutile au doigt),
       les raccourcis passent sur leur propre ligne avec des cibles tactiles plus grandes. */
    @media (max-width: 560px) {
      .mrow { grid-template-columns: minmax(0, 1fr) auto; align-items: start; gap: 7px 10px; padding: 10px 12px 10px 16px; }
      /* `display: contents` dissout .m-main : le nom, la sous-ligne et la jauge deviennent des
         cases de la grille de la ligne. Sans ça la sous-ligne restait enfermée dans une colonne
         de 190 px (le montant occupant l'autre) et se cassait en trois rangées. .m-main n'a ni
         fond ni bordure ni marge — la dissoudre ne fait donc rien perdre visuellement. */
      .m-main { display: contents; }
      .m-nm { grid-column: 1; }
      /* Le montant partage la première ligne avec le nom : on lui donne un plafond de largeur
         pour qu'un badge « Retard paiement » ne vienne pas rogner le nom du client. */
      .m-right { grid-column: 2; grid-row: 1; align-items: flex-end; margin-top: 0; max-width: 42%; }
      .m-pay { text-align: right; }
      .m-sub, .m-gline, .m-signal { grid-column: 1 / -1; }
      .m-signal { justify-self: start; margin-top: 0; }
      /* Le NOM du client d'abord : les pastilles de type (Screen, Volet…) le réduisaient à
         66 px — « Doris Zurstrassen » devenait illisible — et s'empilaient sur trois rangées.
         Elles disparaissent au téléphone (le type reste filtrable et visible sur la fiche),
         mais l'avertissement « N à compléter » RESTE : lui bloque la commande chez Harol. */
      .type-badges { flex-wrap: nowrap; min-width: 0; flex: none; }
      .type-badges .badge:not(.badge-warn) { display: none; }
      .type-badges .badge-warn { white-space: nowrap; }
      .type-badges .bm-txt { display: none; }   /* « ⚠ 3 » suffit ; l'infobulle dit le reste */
      .m-name { flex: 1 1 auto; min-width: 0; }
      .m-sub { gap: 8px; margin-top: 0; }
      .m-sub .id { display: none; }                                  /* n° de devis : illisible et inutile au doigt */
      .media-icons .mi-slot:not(.active):not(.cmt-slot) { display: none; }  /* « 0 photo » = du bruit */
      .m-jump { flex-basis: 100%; margin-top: 2px; }
      .m-jp { width: 32px; height: 32px; opacity: 1; }               /* cible tactile agrandie (pas de survol au doigt) */
    }

    /* Aperçu flottant au survol des médias (miniatures photos / fil de notes) — chargé à la demande. */
    .media-preview {
      position: fixed; z-index: 1200; max-width: 340px; min-width: 210px;
      background: var(--surface); border: 1px solid var(--border-strong); border-radius: var(--r-md);
      box-shadow: var(--shadow); padding: var(--sp-3); display: none; pointer-events: none;
    }
    /* Les photos étaient en 3 colonnes de 62 px : on ne distinguait rien. Deux colonnes
       nettement plus grandes, et surtout la LÉGENDE (pièce, étage, dimensions) sous chaque
       cliché — c'est elle qui rend l'aperçu utile sans ouvrir le devis. */
    /* Largeur EXPLICITE : la bulle est en position fixed sans largeur, donc elle se réduit au
       contenu — et des images en width:100% ne réclament rien. Sans ça, augmenter max-width
       ne changeait rien à la taille réelle des photos. */
    .media-preview.wide { width: 440px; max-width: min(440px, calc(100vw - 16px)); }
    .media-preview.open { display: block; animation: mpIn 0.12s ease-out; }
    @keyframes mpIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
    .mp-title { font-family: var(--font-mono); font-size: var(--fs-2xs); color: var(--text-subtle); text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: var(--sp-2); display: flex; align-items: center; gap: 0.35rem; }
    .mp-title svg { color: var(--accent-2); }
    .mp-photos { display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px; }
    .mp-shot { border: 1px solid var(--border); border-radius: var(--r-sm); overflow: hidden; background: var(--surface-2); }
    .mp-shot img { width: 100%; height: 132px; object-fit: cover; display: block; }
    .mp-cap { padding: 4px 6px 5px; border-top: 1px solid var(--border); }
    .mp-cap .l1 { font-size: var(--fs-2xs); font-weight: 600; color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .mp-cap .l2 { font-family: var(--font-mono); font-size: var(--fs-3xs); color: var(--text-subtle); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .mp-more { display: flex; align-items: center; justify-content: center; height: 132px; border-radius: var(--r-sm); border: 1px dashed var(--border-strong); color: var(--text-muted); font-family: var(--font-mono); font-size: var(--fs-xs); }
    .mp-comment { display: flex; gap: 0.5rem; padding: 0.4rem 0; border-top: 1px solid var(--border); }
    .mp-comment:first-child { border-top: none; padding-top: 0; }
    .mp-ava { width: 22px; height: 22px; border-radius: 50%; flex: none; display: flex; align-items: center; justify-content: center; font-family: var(--font-mono); font-size: 0.58rem; font-weight: 700; }
    .mp-ava.nicolas { background: color-mix(in srgb, var(--accent) 18%, transparent); color: var(--accent); border: 1px solid color-mix(in srgb, var(--accent) 35%, transparent); }
    .mp-ava.yannick { background: color-mix(in srgb, var(--accent-2) 18%, transparent); color: var(--accent-2); border: 1px solid color-mix(in srgb, var(--accent-2) 40%, transparent); }
    .mp-ava.client { background: color-mix(in srgb, var(--accent-3) 18%, transparent); color: var(--accent-3); border: 1px solid color-mix(in srgb, var(--accent-3) 40%, transparent); }
    .mp-c-body { min-width: 0; }
    .mp-c-meta { font-family: var(--font-mono); font-size: 0.58rem; color: var(--text-subtle); margin-bottom: 1px; }
    .mp-c-text { font-size: var(--fs-xs); color: var(--text); line-height: 1.35; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
    .mp-empty { font-size: var(--fs-xs); color: var(--text-muted); }
    .tag-dot { display: inline-flex; align-items: center; color: var(--text-subtle); }
    .proba-dot { width: 10px; height: 10px; border-radius: 50%; border: 1px solid color-mix(in srgb, var(--pc, var(--border-strong)) 70%, transparent); background: var(--pc, var(--border-strong)); cursor: pointer; padding: 0; flex: none; }
    .proba-dot:hover { box-shadow: 0 0 0 3px color-mix(in srgb, var(--pc, var(--border-strong)) 25%, transparent); }

    /* ── Modale commentaires internes ── */
    .modal-bg { position: fixed; inset: 0; background: rgba(0,0,0,0.55); z-index: 1000; display: none; align-items: center; justify-content: center; padding: var(--sp-4); }
    .modal-bg.open { display: flex; }
    /* ── Journal d'activité / Quoi de neuf ── */
    .act-news-banner { padding: var(--sp-3) var(--sp-4); background: color-mix(in srgb, var(--accent-2) 10%, transparent); border-bottom: 1px solid var(--border); font-size: var(--fs-sm); }
    .act-daysep { font-family: var(--font-mono); font-size: 0.6rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--text-subtle); padding: var(--sp-3) var(--sp-3) 0.3rem; }
    .act-row { display: flex; gap: var(--sp-3); padding: var(--sp-3); border-bottom: 1px solid var(--border); transition: background var(--t-fast); animation: actIn 0.34s cubic-bezier(0.2,0.6,0.3,1) both; }
    .act-row:last-child { border-bottom: none; }
    /* Barre de filtres du journal (par personne / par nature) + décompte honnête. */
    .act-filtres { position: sticky; top: 0; z-index: 2; background: var(--surface);
      padding: var(--sp-3) var(--sp-3) var(--sp-2); border-bottom: 1px solid var(--border);
      display: flex; flex-direction: column; gap: 0.35rem; }
    .act-filtres .filters { gap: 0.3rem; flex-wrap: wrap; }
    .act-filtres .chip { font-size: var(--fs-2xs); padding: 0.22rem 0.55rem; }
    .act-compte { font-family: var(--font-mono); font-size: var(--fs-3xs); color: var(--text-subtle); }
    .act-quoi { font-family: var(--font-mono); font-size: var(--fs-3xs); color: var(--text-subtle);
      opacity: 0.75; margin-left: 0.4rem; }
    .act-row[onclick] { cursor: pointer; }
    .act-row[onclick]:hover { background: color-mix(in srgb, var(--accent) 7%, transparent); }
    .act-ava { width: 30px; height: 30px; border-radius: 50%; flex: none; display: grid; place-items: center; font-family: var(--font-mono); font-size: 0.6rem; font-weight: 700; }
    .act-ava.nicolas { background: color-mix(in srgb, var(--accent) 18%, transparent); color: var(--accent); border: 1px solid color-mix(in srgb, var(--accent) 35%, transparent); }
    .act-ava.yannick { background: color-mix(in srgb, var(--accent-2) 18%, transparent); color: var(--accent-2); border: 1px solid color-mix(in srgb, var(--accent-2) 40%, transparent); }
    .act-ava.none { background: var(--bg); color: var(--text-subtle); border: 1px solid var(--border-strong); }
    .act-main { min-width: 0; flex: 1; }
    .act-label { font-size: var(--fs-sm); line-height: 1.35; }
    .act-meta { font-family: var(--font-mono); font-size: 0.6rem; color: var(--text-subtle); margin-top: 2px; text-transform: uppercase; letter-spacing: 0.05em; }
    @keyframes actIn { from { opacity: 0; transform: translateY(9px); } to { opacity: 1; transform: none; } }
    @media (prefers-reduced-motion: reduce) { .act-row { animation: none; } }
    .modal { background: var(--surface); border: 1px solid var(--border-strong); border-radius: var(--r-md); box-shadow: var(--shadow); width: 560px; max-width: 100%; max-height: 88vh; display: flex; flex-direction: column; --tick-color: var(--accent-2); }
    .modal .mhead { font-family: var(--font-display); font-size: var(--fs-md); padding: var(--sp-4) var(--sp-5); border-bottom: 1px solid var(--border); color: var(--accent); display: flex; align-items: center; gap: var(--sp-2); }
    .modal .mhead .mid { font-family: var(--font-mono); font-size: var(--fs-2xs); color: var(--text-subtle); margin-left: auto; }
    .modal .mbody { padding: var(--sp-4) var(--sp-5); overflow-y: auto; flex: 1; min-height: 120px; }
    /* Fil de notes vide : la zone disparaît complètement au lieu de laisser 120 px de vide sous
       le titre. La fenêtre se réduit alors au titre + au champ de saisie. */
    .modal .mbody:empty { display: none; }

    /* ── Bandeau « devis alourdis par leurs photos » ── */
    .allegement { display: flex; align-items: center; gap: var(--sp-3); margin-bottom: var(--sp-4);
      padding: var(--sp-3) var(--sp-4); border: 1px solid color-mix(in srgb, var(--warn) 45%, transparent);
      border-left-width: 3px; border-radius: var(--r-md);
      background: color-mix(in srgb, var(--warn) 9%, transparent); }
    .allegement > svg { flex: none; color: var(--warn); }
    .allegement .al-txt { flex: 1; min-width: 0; font-size: var(--fs-sm); line-height: 1.45; }
    .allegement .al-txt span { display: block; font-size: var(--fs-2xs); color: var(--text-muted); }
    .allegement .btn { flex: none; border-color: var(--warn); color: var(--warn); }
    @media (max-width: 560px) { .allegement { flex-wrap: wrap; } .allegement .btn { width: 100%; } }
    .modal .mfoot { padding: var(--sp-4) var(--sp-5); border-top: 1px solid var(--border); }

    /* Le fil de notes utilise le rendu PARTAGÉ .ss-cmt (assets/css/base.css) — plus de style local. */
    .empty-comments { text-align: center; color: var(--text-muted); padding: var(--sp-5); font-size: var(--fs-sm); }

    .comment-form { display: grid; grid-template-columns: 1fr 1fr; gap: var(--sp-2); }
    .comment-form textarea { grid-column: 1 / -1; min-height: 64px; }
    .comment-form .send-row { grid-column: 1 / -1; display: flex; justify-content: flex-end; gap: var(--sp-2); }
  </style>
</head>
<body>
  <div class="fx-grid"></div>

  <header class="app-header">
    <div class="brand">
      <span class="brand-logo"><img src="../assets/img/logo-solariscreen.png" alt="" onerror="this.style.display='none'"></span>
      <div>
        <h1><a href="dashboard.html">SOLARISCREEN</a></h1>
        <div class="module">Tableau de bord</div>
      </div>
    </div>
    <div class="header-mood">
      <button class="mantra" id="mantra" type="button" onclick="newMantra()" title="Pensée du jour — clique pour en tirer une autre" aria-label="Pensée du jour, cliquer pour en changer">
        <span class="mq" aria-hidden="true">«</span>
        <span class="mantra-text" id="mantraText"></span>
        <span class="mq" aria-hidden="true">»</span>
      </button>
    </div>
    <div class="header-actions">
      <span class="wx-chip hidden" id="wxChip" title="Météo à votre position"></span>
      <span class="badge" id="apiBadge" title="État de la connexion">…</span>
      <a class="btn btn-sm btn-terrain" href="terrain.html" title="Mode Terrain (iPhone)"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="7" y="2" width="10" height="20" rx="2"/><line x1="11" y1="18" x2="13" y2="18"/></svg> Terrain</a>
      <span id="quickNav"></span>
      <span id="themeToggle"></span>
      <a class="btn btn-primary btn-sm" href="simulateur.html" title="Créer un nouveau devis"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg> Nouveau devis</a>
    </div>
  </header>

  <main class="container">
    <!-- Vue Aujourd'hui : uniquement si quelque chose mérite l'attention -->
    <div class="today-brief ticked hidden" id="todayBrief"></div>
    <div class="allegement hidden" id="allegement"></div>

  <script src="../assets/js/ui.js"></script>
  <!-- Catalogue produits : sert ici à savoir quels champs manquent encore sur un devis
       (SSProducts.CHAMPS_REQUIS) pour l'afficher sur la ligne. -->
  <script src="../assets/js/products.js"></script>

  <script src="../assets/js/nav.js"></script>
  <script src="../assets/js/api.js"></script>

  <script>
    const SS = window.SS;
    const { mountThemeToggle } = window.SSTheme;
    const { fmtEur, fmtDate, el, setText, toast, normDevis, icon, daysInCurrentStatus, clientKeyOf } = window.SSUI;

    mountThemeToggle(document.getElementById('themeToggle'));
    window.SSNav.mount(document.getElementById('quickNav'));

    // ── Pensée de la session au centre du header ──
    // Une seule pensée par session (stable → elle s'imprègne), clic = en tirer une autre.
    // Révélation mot à mot + auto-ajustement de la taille pour ne jamais couper une phrase.
    function buildMantraWords(text) {
      const t = el('mantraText');
      t.textContent = '';
      const words = String(text).split(' ');
      words.forEach((w, i) => {
        const span = document.createElement('span');
        span.className = 'mw';
        span.textContent = (i ? ' ' : '') + w;   // espace insécable au rendu (white-space:pre)
        span.style.animationDelay = (i * 45) + 'ms';
        t.appendChild(span);
      });
    }
    function fitMantra() {
      const mood = document.querySelector('.header-mood');
      const box = el('mantra'), t = el('mantraText');
      if (!mood || mood.clientWidth < 40) return;   // masqué (mobile) → rien à ajuster
      let size = 0.9;                                // rem (≈ fs-sm)
      t.style.fontSize = size + 'rem';
      const avail = mood.clientWidth - 6;
      let guard = 0;
      while (box.scrollWidth > avail && size > 0.62 && guard < 24) {
        size -= 0.03; t.style.fontSize = size + 'rem'; guard++;
      }
    }
    function showMantra(text) {
      const box = el('mantra');
      box.classList.remove('reveal');
      buildMantraWords(text);
      fitMantra();
      void box.offsetWidth;              // reflow : rejoue la révélation
      box.classList.add('reveal');
    }
    window.newMantra = () => showMantra(window.SSMantras.fresh());
    // Pensée du jour et météo : décoratives, donc désactivables (Paramètres → Affichage).
    // On lit le cache local, disponible immédiatement : pas d'apparition-disparition au chargement.
    const AFFICHAGE = (window.SSConf && window.SSConf.get().affichage) || { mantra: true, meteo: true };
    if (AFFICHAGE.mantra) showMantra(window.SSMantras.forSession());
    else { const m = document.querySelector('.header-mood'); if (m) m.style.display = 'none'; }
    window.addEventListener('resize', fitMantra);
    try { document.fonts.ready.then(fitMantra); } catch (e) {}

    // ── Météo actuelle à la position de l'utilisateur (chip dans la barre d'actions) ──
    // Géolocalisation navigateur (demande une autorisation une seule fois) → Open-Meteo
    // + géocodage inverse pour le nom de la ville. Silencieux si refusé/indisponible.
    (function initCurrentWeather() {
      if (!AFFICHAGE.meteo) return;   // masquée : on ne demande pas la position pour rien
      if (!navigator.geolocation) return;
      navigator.geolocation.getCurrentPosition(async (pos) => {
        const { latitude, longitude } = pos.coords;
        const [w, city] = await Promise.all([
          window.SSUI.fetchCurrentWeatherByCoords(latitude, longitude),
          window.SSUI.reverseGeocodeCity(latitude, longitude),
        ]);
        if (!w) return;
        const chip = el('wxChip');
        chip.innerHTML = `${icon(window.SSUI.weatherIconName(w.code), 14)} ${Math.round(w.temp)}°${city ? ` <span class="wx-city">${esc(city)}</span>` : ''}`;
        chip.title = `${w.label}${city ? ' à ' + city : ''} · météo actuelle à votre position`;
        chip.classList.remove('hidden');
      }, () => {}, { timeout: 8000, maximumAge: 900000 });
    })();

    const STATUSES = {
      brouillon:     { label: 'Brouillon',  color: 'var(--text-subtle)' },
      envoye_client: { label: 'Envoyé',     color: 'var(--accent)' },
      relance_1:     { label: 'Relance 1',  color: 'var(--warn)' },
      relance_2:     { label: 'Relance 2',  color: 'var(--warn)' },
      signe:         { label: 'Signé',      color: 'var(--ok)' },
      termine:       { label: 'Terminé',    color: 'var(--accent-2)' },
      refuse:        { label: 'Refusé',     color: 'var(--danger)' },
      annule:        { label: 'Annulé',     color: 'var(--text-subtle)' },
    };

    const TYPE_LABEL = { screen: 'Screen', volet_roulant: 'Volet', tente_solaire: 'Tente solaire', tablier_volet: 'Tablier volet' };
    const WAITING_STATUSES = ['envoye_client', 'relance_1', 'relance_2'];
    const PRE_SIGNATURE_STATUSES = ['brouillon', 'envoye_client', 'relance_1', 'relance_2'];
    const PROBABILITE = {
      froid: { label: 'Froid', color: 'var(--text-subtle)' },
      tiede: { label: 'Tiède', color: 'var(--accent)' },
      chaud: { label: 'Chaud', color: 'var(--warn)' },
      presque: { label: 'Presque signé', color: 'var(--accent-2)' },
    };

    let DEVIS = [], FACTURES = [], CLIENT_TAGS = new Map(), RDV_LIST = [];
    // ── Vue par défaut : les dossiers VIVANTS ────────────────────────────────────────────────
    // Constat sur les données réelles : 7 des 16 lignes de la vue « Tous » étaient des dossiers
    // refusés, donc morts. Le tableau de bord sert à voir ce sur quoi il faut agir : il s'ouvre
    // désormais sur « Actifs » (tout sauf refusé/annulé). « Tous » existe toujours et reste
    // honnête — il montre bien TOUT. Le dernier choix de Nicolas est mémorisé.
    const DEFAULT_VIEW = 'actifs';
    const DEAD_STATUSES = ['refuse', 'annule'];
    /* ── « Actifs » = il reste quelque chose à faire ────────────────────────────────────────────
       Le filtre excluait seulement les refusés/annulés : les chantiers terminés ET encaissés
       restaient dans la liste du quotidien alors qu'il n'y a plus rien à en faire, et ils
       repoussaient vers le bas les dossiers qui, eux, demandent une action.
       Un dossier terminé mais NON soldé RESTE actif : il reste de l'argent à encaisser, et c'est
       précisément ce qu'on ne doit jamais perdre de vue. En l'absence de montant connu (ttc = 0),
       on considère le dossier comme non soldé — on préfère l'afficher à tort que le cacher à tort. */
    function totalEncaisse(d) {
      return FACTURES.filter(f => f.devis_id === d.id).reduce((s, f) => s + paidSum(f), 0);
    }
    function estSolde(d) {
      const ttc = Number(d.ttc) || 0;
      return ttc > 0 && totalEncaisse(d) >= ttc - 0.005;
    }
    function estClos(d) { return d.statut === 'termine' && estSolde(d); }
    function estActif(d) { return !DEAD_STATUSES.includes(d.statut) && !estClos(d); }
    let activeFilter = (function () {
      try { return localStorage.getItem('ss_dash_view') || DEFAULT_VIEW; } catch (e) { return DEFAULT_VIEW; }
    })();
    let activeSeller = 'tous';
    let activeType = 'tous';   // filtre par type de produit (#14)

    // ── Préférences d'affichage (mémorisées) : bandeau KPI replié (#11), densité des lignes (#22) ──
    // Sur téléphone, le bandeau de chiffres fait 262 px : il repoussait la liste des devis
    // hors de l'écran d'accueil. Il est donc REPLIÉ PAR DÉFAUT là — mais uniquement tant que
    // rien n'a été choisi : dès que le bouton est utilisé, le choix explicite l'emporte
    // partout et pour toujours (même clé, comme au bureau).
    const PETIT_ECRAN = () => window.matchMedia('(max-width: 640px)').matches;
    const PREF = {
      get kpis() {
        try {
          const v = localStorage.getItem('ss_dash_kpis');
          if (v === null) return !PETIT_ECRAN();
          return v !== '0';
        } catch (e) { return true; }
      },
      set kpis(v) { try { localStorage.setItem('ss_dash_kpis', v ? '1' : '0'); } catch (e) {} },
      get dense() { try { return localStorage.getItem('ss_dash_dense') === '1'; } catch (e) { return false; } },
      set dense(v) { try { localStorage.setItem('ss_dash_dense', v ? '1' : '0'); } catch (e) {} },
    };
    function applyKpiPref() {
      const on = PREF.kpis;
      el('kpis').classList.toggle('hidden', !on);
      const b = el('kpiToggle');
      if (b) { b.textContent = on ? '—' : '+'; b.title = on ? 'Masquer les chiffres' : 'Afficher les chiffres'; b.classList.toggle('on', !on); }
    }
    function applyDensePref() {
      const on = PREF.dense;
      const list = document.querySelector('.mix-list');
      if (list) list.classList.toggle('dense', on);
      const b = el('denseToggle');
      if (b) { b.textContent = on ? 'Confort' : 'Compact'; b.classList.toggle('on', on); }
    }
    window.toggleKpis = () => { PREF.kpis = !PREF.kpis; applyKpiPref(); };
    window.toggleDense = () => { PREF.dense = !PREF.dense; applyDensePref(); };

    // ── Paiement (acompte/solde) — lu depuis les factures liées au devis ──
    const paidSum = f => (f.paiements || []).reduce((s, p) => s + (Number(p.montant) || 0), 0);
    function isPaymentOverdue(d) {
      const facs = FACTURES.filter(f => f.devis_id === d.id);
      if (!facs.length) return false;
      const today = new Date().toISOString().slice(0, 10);
      return facs.some(f => paidSum(f) < (Number(f.total_ttc) || 0) - 0.005 && f.echeance && f.echeance < today);
    }
    // Devis signé (chantier pas encore posé) dont l'acompte n'a pas été intégralement reçu.
    function isAcompteUnpaid(d) {
      if (d.statut !== 'signe') return false;
      const facs = FACTURES.filter(f => f.devis_id === d.id);
      // L'acompte a pu être encaissé sur N'IMPORTE quelle facture (acompte dédiée, solde, totale, ou
      // via l'ancien ERP — ex. Ecole Du Bonheur : 9 539,05 € payés sur une facture « Solde »). On
      // crédite donc TOUJOURS le total réellement encaissé sur le devis, comparé au montant attendu.
      const totalPaid = facs.reduce((s, f) => s + paidSum(f), 0);
      const acompteFacs = facs.filter(f => f.type === 'acompte');
      const due = acompteFacs.length
        ? acompteFacs.reduce((s, f) => s + (Number(f.total_ttc) || 0), 0)                 // montant de la/les facture(s) d'acompte
        : (d.ttc || 0) * ((d.acompte_pct != null) ? d.acompte_pct : 30) / 100;             // sinon, % attendu du TTC
      return due > 0 && totalPaid < due - 0.005;
    }
    // Devis signé avec une pose planifiée dans les 7 prochains jours (bientôt sur le terrain).
    function isChantierAPreparer(d) {
      if (d.statut !== 'signe' || window.SSUI.isPoseDone(d) || !d.chantier || !d.chantier.date_pose) return false;
      const days = Math.round((new Date(d.chantier.date_pose) - new Date(new Date().toISOString().slice(0, 10))) / 86400000);
      return days >= 0 && days <= 7;
    }
    // Chantier POSÉ mais pas entièrement payé → le solde reste à encaisser (rappel visible même « terminé »,
    // sinon l'argent dû devient invisible une fois le devis marqué terminé).
    function isSoldeUnpaid(d) {
      if (!window.SSUI.isPoseDone(d)) return false;
      const ttc = Number(d.ttc) || 0;
      if (ttc <= 0) return false;
      const totalPaid = FACTURES.filter(f => f.devis_id === d.id).reduce((s, f) => s + paidSum(f), 0);
      return totalPaid < ttc - 0.005;
    }
    // Nombre de jours depuis le tout premier envoi au client (pas juste le statut courant —
    // une relance ne remet pas le compteur de validité CGV à zéro). CGV : devis valide 30 jours.
    function daysSinceSent(d) {
      const hist = d.statut_history || [];
      const first = hist.find(h => WAITING_STATUSES.includes(h.statut));
      const anchor = first ? first.date : (WAITING_STATUSES.includes(d.statut) ? d.date_creation : null);
      if (!anchor) return null;
      return Math.floor((Date.now() - new Date(anchor).getTime()) / 86400000);
    }
    function isDevisExpire(d) {
      // Un devis déjà ACCEPTÉ par le client (via le lien de suivi) n'est ni « expiré » ni « à relancer ».
      if (!WAITING_STATUSES.includes(d.statut) || d.client_accepted) return false;
      const days = daysSinceSent(d);
      return days !== null && days >= 30;
    }
    // ── « Prochaine action » : l'ERP dit quoi faire, dossier par dossier ────────────────────
    // Toute la logique métier existe déjà sous forme de prédicats (relance due, acompte impayé,
    // pose à planifier…) mais restait éparpillée dans les pastilles globales du briefing. Ici on
    // la condense en UNE phrase par ligne — l'ordre des tests EST l'ordre de priorité.
    // Renvoie null quand il n'y a rien à faire (dossier clos, payé, refusé…).
    function prochaineAction(d) {
      if (d.archive || ['refuse', 'annule'].includes(d.statut)) return null;
      if (d.statut === 'brouillon') return { txt: 'À finaliser et envoyer', color: 'var(--text-subtle)' };
      if (d.client_accepted && WAITING_STATUSES.includes(d.statut)) return { txt: 'Accepté par le client — à faire signer', color: 'var(--ok)' };
      if (WAITING_STATUSES.includes(d.statut) && relanceDue(d)) {
        const faites = relancesFaites(d);
        // Un client qui a rouvert son devis plusieurs fois est chaud → on le signale et on passe en or.
        const hot = d.review_views >= SEUIL_CHAUD();
        return { txt: `Relance ${faites + 1} à envoyer${hot ? ` · client très intéressé (${d.review_views} vues)` : ''}`, color: hot ? 'var(--accent-2)' : 'var(--warn)' };
      }
      if (isDevisExpire(d)) return { txt: 'Devis expiré (30 j) — à relancer ou classer', color: 'var(--danger)' };
      if (isAcompteUnpaid(d)) return { txt: 'Acompte à encaisser', color: 'var(--warn)' };
      if (d.statut === 'signe' && !window.SSUI.isPoseDone(d) && !(d.chantier && d.chantier.date_pose)) {
        return { txt: 'Pose à planifier', color: 'var(--accent-2)' };
      }
      if (isChantierAPreparer(d)) return { txt: 'Chantier à préparer', color: 'var(--accent-2)' };
      if (isSoldeUnpaid(d)) return { txt: 'Solde à encaisser', color: 'var(--warn)' };
      if (WAITING_STATUSES.includes(d.statut)) return { txt: 'En attente de réponse client', color: 'var(--text-subtle)' };
      return null;
    }
    // Seuil « client chaud » : nombre de consultations de l'espace client à partir duquel on
    // considère le dossier comme brûlant. Réglable (Paramètres → Utilisation) car il dépend du
    // volume d'affaires — 5 vues n'ont pas le même sens sur 3 devis que sur 300.
    const SEUIL_CHAUD = () => {
      const c = window.SSConf && window.SSConf.get();
      const v = c && c.usage && Number(c.usage.seuil_lead_chaud);
      return (isFinite(v) && v > 0) ? v : 5;
    };

    function paymentInfo(d) {
      const facs = FACTURES.filter(f => f.devis_id === d.id);
      if (!facs.length) return '';
      const totalFact = facs.reduce((s, f) => s + (Number(f.total_ttc) || 0), 0);
      const totalPaid = facs.reduce((s, f) => s + paidSum(f), 0);
      if (totalPaid > 0 && totalPaid >= d.ttc - 0.005) return `<span class="badge badge-ok" title="Encaissé : ${fmtEur(totalPaid)}">${icon('coin', 10)} Soldé</span>`;
      if (isPaymentOverdue(d)) return `<span class="badge badge-danger" title="Facturé ${fmtEur(totalFact)}, payé ${fmtEur(totalPaid)}">${icon('warning', 10)} Retard paiement</span>`;
      if (totalPaid > 0) return `<span class="badge badge-warn" title="Payé ${fmtEur(totalPaid)} sur ${fmtEur(totalFact)} facturé">${icon('coin', 10)} Acompte payé</span>`;
      return `<span class="badge" title="Facturé ${fmtEur(totalFact)}, en attente de paiement">${icon('coin', 10)} À encaisser</span>`;
    }

    // Lien espace client créé mais JAMAIS ouvert par le client (#26) : soit il ne l'a pas reçu,
    // soit il n'a pas cliqué → à vérifier, c'est du CA qui dort.
    function isLinkNeverOpened(d) {
      return WAITING_STATUSES.includes(d.statut) && !d.archive && !d.client_accepted
        && !!d.has_review_link && !d.review_views;
    }

    // ══════════ Fragments des lignes MIX ══════════════════════════════════════════════════════
    function isPaidFull(d) {
      const facs = FACTURES.filter(f => f.devis_id === d.id);
      if (!facs.length) return false;
      const paid = facs.reduce((s, f) => s + paidSum(f), 0);
      return paid > 0 && paid >= d.ttc - 0.005;
    }
    // Filet de couleur à gauche = couleur de l'action la plus urgente (sinon couleur du statut).
    function railColor(d) {
      if (d.client_question_open) return 'var(--warn)';
      const a = prochaineAction(d);
      return a ? a.color : ((STATUSES[d.statut] || {}).color || 'var(--border-strong)');
    }
    function signalIcon(color) {
      if (color.includes('--ok')) return icon('check', 12);
      if (color.includes('--danger')) return icon('warning', 12);
      if (color.includes('--accent-2')) return icon('sparkle', 12);
      if (color.includes('--warn')) return icon('clock', 12);
      return icon('chevronright', 12);
    }
    // Date affichée sur la ligne : jamais une valeur illisible. `fmtDate` renvoie l'entrée BRUTE
    // quand elle n'est pas parsable (ex. « zz ») — ici on préfère un tiret discret.
    function safeDate(iso) {
      if (!iso) return '—';
      return isNaN(new Date(iso).getTime()) ? '—' : fmtDate(iso);
    }
    // Temps relatif court (#20) : « il y a 2 h », « il y a 3 j » — plus parlant qu'une date brute.
    function relTime(iso) {
      if (!iso) return '';
      const t = new Date(iso).getTime();
      if (isNaN(t)) return '';
      const min = Math.round((Date.now() - t) / 60000);
      if (min < 1) return "à l'instant";
      if (min < 60) return `il y a ${min} min`;
      const h = Math.round(min / 60);
      if (h < 24) return `il y a ${h} h`;
      const j = Math.round(h / 24);
      if (j < 31) return `il y a ${j} j`;
      const mo = Math.round(j / 30);
      return mo < 12 ? `il y a ${mo} mois` : `il y a ${Math.round(mo / 12)} an(s)`;
    }
    // LE signal unique de la ligne. Priorité : question client > prochaine action > statut brut.
    // Quand l'action est directement exécutable (relance, question), le chip devient CLIQUABLE (#25)
    // et emmène au bon endroit de la fiche — plus besoin d'ouvrir puis de chercher la bonne carte.
    function signalChip(d) {
      if (d.client_question_open)
        return `<span class="m-sig act" style="--sc:var(--warn)" onclick="event.stopPropagation();location.href='vue.html?id=${d.id}#question'" title="Répondre à la question du client">${icon('message', 12)} Question client — à répondre</span>`;
      const a = prochaineAction(d);
      const hot = WAITING_STATUSES.includes(d.statut) && !d.client_accepted && d.review_views >= SEUIL_CHAUD();
      if (!a) {
        const s = STATUSES[d.statut] || {};
        const extra = d.statut === 'refuse' && d.raison_refus ? ' · ' + esc(d.raison_refus) : '';
        return `<span class="m-sig muted" title="${esc((s.label || '') + (d.raison_refus ? ' — ' + d.raison_refus : ''))}">${esc(s.label || '')}${extra}</span>`;
      }
      const isRelance = /Relance/i.test(a.txt);
      return `<span class="m-sig ${hot ? 'hot' : ''}${isRelance ? ' act' : ''}" style="--sc:${a.color}"${isRelance ? ` onclick="event.stopPropagation();location.href='vue.html?id=${d.id}#relance'"` : ''} title="${esc(a.txt)}${isRelance ? ' — clic : préparer le message' : ''}">${signalIcon(a.color)} ${esc(a.txt)}</span>`;
    }
    // Micro-parcours : Créé · Envoyé · Signé · Posé · Payé. Masqué pour brouillon/refusé/annulé.
    function milestoneDots(d) {
      if (['brouillon', 'refuse', 'annule'].includes(d.statut)) return '';
      const signed = ['signe', 'termine'].includes(d.statut);
      const posed = window.SSUI.isPoseDone(d) || d.statut === 'termine';
      const done = [true, true, signed, posed, isPaidFull(d)];
      const now = done.indexOf(false);
      const labels = ['Créé', 'Envoyé', 'Signé', 'Posé', 'Payé'];
      return `<span class="m-dots" title="Parcours : ${labels.join(' · ')}">` +
        done.map((dn, i) => `<i class="${dn ? 'd' : (i === now ? 'n' : '')}"></i>`).join('') + '</span>';
    }
    // Jauge d'engagement — affichée seulement quand le devis attend une réponse du client.
    function engagementLine(d) {
      if (!WAITING_STATUSES.includes(d.statut) || d.client_accepted) return '';
      if (d.review_views > 0) {
        const pct = Math.min(100, Math.round(20 + d.review_views * 3.3));
        const hot = d.review_views >= SEUIL_CHAUD();
        const grad = hot ? 'linear-gradient(90deg, var(--warn), var(--accent-2))' : 'linear-gradient(90deg, color-mix(in srgb, var(--accent) 55%, transparent), var(--accent))';
        return `<div class="m-gline"><span class="m-gbar"><i style="width:${pct}%;background:${grad}"></i>${hot ? '<u></u>' : ''}</span>` +
          `<span class="m-gl"${hot ? ' style="color:var(--accent-2-ink)"' : ''}>${icon('window', 11)} ${d.review_views} vue${d.review_views > 1 ? 's' : ''}${hot ? ' · chaud' : ''}</span></div>`;
      }
      if (d.has_review_link)
        return `<div class="m-gline"><span class="m-gl">${icon('lock', 11)} Lien jamais ouvert par le client</span></div>`;
      return '';
    }

    // ── Archivage (masquer proprement les devis refusés, réversible) ──
    window.archiveDevis = async (id, val) => {
      const full = await SS.getDevis(id);
      if (!full) { toast('Devis introuvable', 'error'); return; }
      full.archive = val;
      full.date_modification = new Date().toISOString();
      const resAr = await SS.saveDevis(full);
      if (resAr.ok === false) { toast(resAr.error || 'Archivage NON enregistré — réessaie.', 'error', 6000); return; }
      const d = DEVIS.find(x => x.id === id); if (d) d.archive = val;
      toast(val ? 'Devis archivé' : 'Devis désarchivé', 'ok');
      render();
    };

    function renderFilters() {
      const visible = DEVIS.filter(d => !d.archive);
      const counts = { tous: visible.length, actifs: visible.filter(estActif).length };
      visible.forEach(d => { counts[d.statut] = (counts[d.statut] || 0) + 1; });
      const archivedCount = DEVIS.filter(d => d.archive).length;
      // Compter les MORTS explicitement : « tous − actifs » englobait aussi les dossiers clos
      // (terminés et soldés) et l'infobulle annonçait 4 refusés là où il n'y en avait qu'un.
      const morts = visible.filter(d => DEAD_STATUSES.includes(d.statut)).length;
      const chips = [['actifs', 'Actifs'], ['tous', 'Tous']].concat(Object.entries(STATUSES).map(([k, v]) => [k, v.label]));
      el('filters').innerHTML = chips
        .filter(([k]) => k === 'tous' || k === 'actifs' || counts[k])
        .map(([k, label]) => {
          const clos = visible.filter(estClos).length;
          const masques = [morts ? `${morts} refusé${morts > 1 ? 's' : ''}/annulé${morts > 1 ? 's' : ''}` : '',
                           clos ? `${clos} terminé${clos > 1 ? 's' : ''} et soldé${clos > 1 ? 's' : ''}` : '']
                          .filter(Boolean).join(' · ');
          const t = k === 'actifs'
            ? `Ce sur quoi il reste à agir : brouillons, envoyés, signés, et les chantiers terminés dont le solde n'est pas encaissé${masques ? ` — masqués : ${masques}` : ''}`
            : (k === 'tous' ? 'Tout, y compris les refusés, annulés et soldés' : '');
          return `<button class="chip ${k === 'actifs' ? 'chip-actifs' : ''} ${activeFilter === k ? 'active' : ''}" title="${esc(t)}" onclick="setFilter('${k}')">${label} <span style="opacity:.6">${counts[k] || 0}</span></button>`;
        })
        .join('')
        + (archivedCount ? `<button class="chip chip-archive ${activeFilter === 'archives' ? 'active' : ''}" onclick="setFilter('archives')">Archivés <span style="opacity:.6">${archivedCount}</span></button>` : '');
    }
    // La vue choisie est mémorisée : le tableau de bord se rouvre là où Nicolas l'a laissé.
    window.setFilter = (k) => {
      activeFilter = k;
      try { localStorage.setItem('ss_dash_view', k); } catch (e) {}
      render();
    };
    /**
     * Rangement en un geste : archive d'un coup tous les devis refusés/annulés affichés.
     * Proposé UNIQUEMENT dans les vues « Refusé »/« Annulé » — c'est là que le rangement a du sens,
     * et jamais sur un dossier encore vivant. Les devis restent consultables via « Archivés ».
     */
    window.archiverLesRefuses = async () => {
      const cibles = DEVIS.filter(d => !d.archive && DEAD_STATUSES.includes(d.statut)
        && (activeFilter === 'tous' || activeFilter === 'actifs' || d.statut === activeFilter));
      if (!cibles.length) { toast('Rien à archiver.', 'warn'); return; }
      if (!confirm(`Archiver ${cibles.length} devis refusé${cibles.length > 1 ? 's' : ''} / annulé${cibles.length > 1 ? 's' : ''} ?\n\nIls quittent le tableau de bord mais restent consultables dans « Archivés », et comptent toujours dans les statistiques. Réversible.`)) return;
      let ok = 0, ko = 0;
      for (const d of cibles) {
        try {
          const full = await SS.getDevis(d.id);
          if (!full) { ko++; continue; }
          full.archive = true;
          full.date_modification = new Date().toISOString();
          const res = await SS.saveDevis(full);
          if (res.ok === false) { ko++; continue; }
          d.archive = true; ok++;
        } catch (e) { ko++; }
      }
      toast(ko ? `${ok} devis archivé(s), ${ko} en échec — réessaie.` : `${ok} devis archivé${ok > 1 ? 's' : ''} ✓`, ko ? 'warn' : 'ok');
      // La vue qu'on vient de vider n'a plus de raison d'être affichée : on revient au poste de travail.
      if (!DEVIS.some(d => !d.archive && d.statut === activeFilter)) setFilter(DEFAULT_VIEW);
      else render();
    };

    const SELLER_LABELS = { nicolas: 'Nicolas', yannick: 'Yannick', autre: 'Autre' };
    // Libellés lisibles des vues filtrées (chips de filtres actifs, #16)
    const FILTER_LABELS = {
      actifs: 'Dossiers actifs', tous: 'Tous, refusés compris',
      archives: 'Archivés', accepte_client: 'Accepté par le client', question_client: 'Question client',
      a_relancer: 'À relancer', en_retard: 'Paiement en retard', acompte_attente: 'Acompte non payé',
      solde_attente: 'Solde à encaisser', a_preparer: 'Chantier à préparer', expire: 'Devis expiré',
      lien_jamais_ouvert: 'Lien jamais ouvert', kpi_signes: 'Signés & terminés', kpi_en_jeu: 'En attente client',
      brouillon: 'Brouillon', envoye_client: 'Envoyé', signe: 'Signé', termine: 'Terminé', refuse: 'Refusé', annule: 'Annulé',
    };
    function renderSellerFilters() {
      const visible = DEVIS.filter(d => !d.archive);
      const counts = {};
      visible.forEach(d => { const s = d.seller_principal || 'nicolas'; counts[s] = (counts[s] || 0) + 1; });
      const keys = Object.keys(counts).sort((a, b) => (a === 'nicolas' ? -1 : b === 'nicolas' ? 1 : a.localeCompare(b)));
      if (keys.length < 2) { el('sellerFilters').innerHTML = ''; return; }
      el('sellerFilters').innerHTML = `<button class="chip ${activeSeller === 'tous' ? 'active' : ''}" onclick="setSellerFilter('tous')">Tous vendeurs</button>`
        + keys.map(k => `<button class="chip ${activeSeller === k ? 'active' : ''}" onclick="setSellerFilter('${k}')">${SELLER_LABELS[k] || k} <span style="opacity:.6">${counts[k]}</span></button>`).join('');
    }
    window.setSellerFilter = (k) => { activeSeller = k; render(); };

    // ── Filtre par type de produit (#14) : chips déduits des types réellement présents ──────────
    function renderTypeFilters() {
      const visible = DEVIS.filter(d => !d.archive);
      const counts = {};
      visible.forEach(d => (d.item_types || []).forEach(t => { if (t) counts[t] = (counts[t] || 0) + 1; }));
      const keys = Object.keys(counts).sort((a, b) => counts[b] - counts[a]);
      if (keys.length < 2) { el('typeFilters').innerHTML = ''; return; }
      el('typeFilters').innerHTML = `<button class="chip ${activeType === 'tous' ? 'active' : ''}" onclick="setTypeFilter('tous')">Tous produits</button>`
        + keys.map(k => `<button class="chip ${activeType === k ? 'active' : ''}" onclick="setTypeFilter('${k}')">${esc(TYPE_LABEL[k] || k)} <span style="opacity:.6">${counts[k]}</span></button>`).join('');
    }
    window.setTypeFilter = (k) => { activeType = k; render(); };

    // ── Chips des filtres actifs (#16) : ce qui est appliqué, retirable en un clic, + total € ────
    function renderActiveFilters(rows) {
      const host = el('activeFilters');
      if (!host) return;
      const chips = [];
      const q = el('search').value.trim();
      if (q) chips.push({ label: 'Recherche : « ' + q + ' »', clear: "el('search').value='';render()" });
      // Pas de chip « Vue : … » sur la vue par défaut : ce n'est pas un filtre qu'on a appliqué.
      if (activeFilter !== DEFAULT_VIEW) chips.push({ label: 'Vue : ' + (FILTER_LABELS[activeFilter] || activeFilter), clear: `setFilter('${DEFAULT_VIEW}')` });
      if (activeSeller !== 'tous') chips.push({ label: 'Vendeur : ' + (SELLER_LABELS[activeSeller] || activeSeller), clear: "setSellerFilter('tous')" });
      if (activeType !== 'tous') chips.push({ label: 'Produit : ' + (TYPE_LABEL[activeType] || activeType), clear: "setTypeFilter('tous')" });
      const advN = Number((el('advCount').textContent || '').replace(/\D/g, '')) || 0;
      if (advN) chips.push({ label: advN + ' filtre(s) avancé(s)', clear: 'resetAdvFilters()' });
      const total = rows.reduce((s, d) => s + (d.ttc || 0), 0);
      if (!chips.length) { host.classList.add('hidden'); host.innerHTML = ''; return; }
      host.classList.remove('hidden');
      // Dans la vue des refusés/annulés : rangement en un clic (c'est le seul endroit où il a du sens).
      const aRanger = DEAD_STATUSES.includes(activeFilter)
        ? DEVIS.filter(d => !d.archive && d.statut === activeFilter).length : 0;
      host.innerHTML = chips.map(c => `<span class="af-chip">${esc(c.label)}<button onclick="${c.clear}" title="Retirer ce filtre" aria-label="Retirer ce filtre">✕</button></span>`).join('')
        + `<button class="af-clear" onclick="clearAllFilters()">tout effacer</button>`
        + (aRanger ? `<button class="af-archive" onclick="archiverLesRefuses()" title="Les sortir du tableau de bord — ils restent consultables dans « Archivés » et comptent toujours dans les statistiques">${icon('download', 12)} Archiver ces ${aRanger}</button>` : '')
        + `<span class="af-total">${rows.length} devis · ${fmtEur(total)}</span>`;
    }
    window.clearAllFilters = () => {
      el('search').value = ''; setFilter(DEFAULT_VIEW); activeSeller = 'tous'; activeType = 'tous';
      resetAdvFilters();   // resetAdvFilters() appelle déjà render()
    };

    // ── Cadence de relance (même règle que la fiche devis, vue.html) ────────────────────────
    // Devis informatif : J+5 / J+12 / J+21 · devis après visite : J+4 / J+9 / J+21.
    // Référence = date d'envoi saisie > 1er passage à « envoyé » > date de création (jamais
    // date_modification : elle bougerait à chaque édition et fausserait la cadence).
    // ⚠️ NE PAS RÉIMPLÉMENTER ICI. La cadence vivait en double (ici + vue.html) : tant que les
    // deux copies restaient identiques tout allait bien, mais elles sont déployées dans des
    // fichiers SÉPARÉS. Une mise en ligne partielle suffisait à ce que la fiche affiche « R1 ✓ »
    // pendant que cette page réclamait encore « Relance 1 à envoyer ». Source unique : ui.js.
    // Replis présents UNIQUEMENT pour survivre à un ui.js pas encore mis en ligne (ce dépôt se
    // déploie fichier par fichier) : sans eux, toute la liste plantait. L'alerte ci-dessous
    // nomme le vrai problème au lieu de laisser un écran cassé sans explication.
    const relancesFaites = (d) => (window.SSUI && window.SSUI.relancesFaites)
      ? window.SSUI.relancesFaites(d)
      : Math.max((d.relances || []).reduce((m, r) => Math.max(m, r.n || 0), 0), ({ relance_1: 1, relance_2: 2 })[d.statut] || 0);
    const relanceDue = (d) => {
      if (window.SSUI && window.SSUI.relanceDue) return window.SSUI.relanceDue(d);
      const plan = (d.informatif ? [5, 12, 21] : [4, 9, 21]);
      const faites = relancesFaites(d);
      if (faites >= plan.length) return false;
      const h = (d.statut_history || []).filter(x => x.statut === 'envoye_client').map(x => x.date).sort();
      const envoi = String(d.date_envoi || h[0] || d.date_creation || '').slice(0, 10);
      if (!envoi) return false;
      return Math.round((new Date(new Date().toISOString().slice(0, 10) + 'T00:00:00Z') - new Date(envoi + 'T00:00:00Z')) / 86400000) >= plan[faites];
    };
    if (!window.SSUI || typeof window.SSUI.relanceEtat !== 'function') {
      setTimeout(() => toast("assets/js/ui.js n'est pas à jour en ligne — redéploie-le, sinon le suivi des relances restera faux ici.", 'error', 20000), 900);
      console.error('[SolariScreen] ui.js obsolète : SSUI.relanceEtat absent.');
    }
    function renderTodayBrief() {
      const visible = DEVIS.filter(d => !d.archive);
      const toRelance = visible.filter(d => WAITING_STATUSES.includes(d.statut) && !d.client_accepted && relanceDue(d));
      const enRetard = visible.filter(isPaymentOverdue);
      const acompteAttente = visible.filter(isAcompteUnpaid);
      const soldeAttente = visible.filter(isSoldeUnpaid);
      const aPreparer = visible.filter(isChantierAPreparer);
      const expires = visible.filter(isDevisExpire);
      // Devis acceptés en ligne par le client mais pas encore signés : l'action la plus rentable
      // de la journée. Le prédicat sur WAITING_STATUSES fait que le chip disparaît tout seul une
      // fois le devis passé en « signé » — pas de compteur qui s'accumule.
      const acceptes = visible.filter(d => d.client_accepted && WAITING_STATUSES.includes(d.statut));
      // Question posée par le client (via l'espace client) et pas encore répondue → à traiter vite.
      const questionsClient = visible.filter(d => d.client_question_open);
      const box = el('todayBrief');
      const chips = [];
      // ── Demandes de RDV (contacts entrants) ──────────────────────────────────────────────
      // Elles ne filtrent PAS le tableau des devis (elles n'y sont pas) : ces pastilles renvoient
      // vers le module concerné, d'où un `href` au lieu d'un `filter`. Placées en tête : un contact
      // entrant que personne n'a pris est l'action la plus urgente de la journée.
      const todayIso = new Date().toISOString().slice(0, 10);
      const rdvActifs = (RDV_LIST || []).filter(r => !['annule', 'converti'].includes(r.statut));
      const nonPris = rdvActifs.filter(r => !r.assigned_to);
      const visitesJour = rdvActifs.filter(r => r.statut === 'rdv_fixe' && String(r.date_rdv || '').slice(0, 10) === todayIso);
      if (nonPris.length) chips.push({ label: `${nonPris.length} demande${nonPris.length > 1 ? 's' : ''} sans personne en charge`, color: 'var(--danger)', href: 'rdv.html', ic: 'warning' });
      if (visitesJour.length) chips.push({ label: `${visitesJour.length} visite${visitesJour.length > 1 ? 's' : ''} client aujourd'hui`, color: 'var(--accent)', href: 'agenda.html', ic: 'calendar' });
      if (questionsClient.length) chips.push({ label: `${questionsClient.length} question${questionsClient.length > 1 ? 's' : ''} client — à répondre`, color: 'var(--warn)', filter: 'question_client', ic: 'message' });
      if (acceptes.length) chips.push({ label: `${acceptes.length} devis accepté${acceptes.length > 1 ? 's' : ''} par le client — à faire signer`, color: 'var(--ok)', filter: 'accepte_client', ic: 'check' });
      if (toRelance.length) chips.push({ label: `${toRelance.length} devis à relancer`, color: 'var(--warn)', filter: 'a_relancer', ic: 'clock' });
