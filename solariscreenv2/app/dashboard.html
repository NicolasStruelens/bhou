<!DOCTYPE html>
<html lang="fr" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SolariScreen — Tableau de bord</title>
  <link rel="icon" type="image/png" href="../assets/img/logo-solariscreen.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600;700&family=Orbitron:wght@600;800&display=swap" rel="stylesheet">
  <script src="../assets/js/theme.js"></script>
  <link rel="stylesheet" href="../assets/css/tokens.css">
  <link rel="stylesheet" href="../assets/css/theme-dark.css">
  <link rel="stylesheet" href="../assets/css/theme-light.css">
  <link rel="stylesheet" href="../assets/css/base.css">
  <style>
    .toolbar { display: flex; gap: var(--sp-3); align-items: center; flex-wrap: wrap; margin-bottom: var(--sp-4); }
    .toolbar .search { flex: 1; min-width: 220px; position: relative; }
    .toolbar .search input { padding-left: 2.2rem; }
    .toolbar .search svg { position: absolute; left: 0.7rem; top: 50%; transform: translateY(-50%); width: 14px; height: 14px; color: var(--text-subtle); pointer-events: none; }
    #advToggle.active { border-color: var(--accent-2); color: var(--accent-2); }
    #advCount { font-family: var(--font-mono); font-size: var(--fs-2xs); margin-left: 0.3rem; opacity: 0.75; }
    .adv-panel { display: flex; gap: var(--sp-3); align-items: end; flex-wrap: wrap; padding: var(--sp-3); margin-bottom: var(--sp-4); border: 1px solid var(--border); border-radius: var(--r-sm); background: var(--surface-2); }
    .adv-panel.hidden { display: none; }
    .adv-panel .field { margin: 0; min-width: 130px; }
    .filters { display: flex; gap: 0.35rem; flex-wrap: wrap; }
    .chip { font-family: var(--font-mono); font-size: var(--fs-2xs); font-weight: 600; padding: 0.4rem 0.7rem; border-radius: var(--r-sm); border: 1px solid var(--border); background: var(--surface-2); color: var(--text-muted); cursor: pointer; transition: all var(--t-fast); white-space: nowrap; }
    .chip:hover { border-color: var(--accent); color: var(--accent); }
    .chip.active { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
    .chip-archive { margin-left: var(--sp-3); border-color: var(--accent-2); color: var(--accent-2); background: color-mix(in srgb, var(--accent-2) 14%, transparent); font-weight: 700; }
    .chip-archive:hover { border-color: var(--accent-2); color: var(--accent-2); box-shadow: var(--glow-soft); }
    .chip-archive.active { background: var(--accent-2); color: var(--bg); border-color: var(--accent-2); }

    /* Accès Mode Terrain mis en avant (couleur signature or) — usage tactile fréquent depuis le téléphone */
    .btn-terrain { border-color: var(--accent-2); color: var(--accent-2); background: color-mix(in srgb, var(--accent-2) 10%, transparent); font-weight: 700; }
    .btn-terrain:hover { background: color-mix(in srgb, var(--accent-2) 18%, transparent); box-shadow: var(--glow-soft); color: var(--accent-2); }
    @media (max-width: 640px) { .btn-terrain { padding: 0.55rem 0.9rem; font-size: var(--fs-sm); } }

    /* ── Pastilles de statut colorées (menu custom) ── */
    table.data tbody tr { cursor: pointer; }
    .price { font-family: var(--font-mono); font-weight: 700; font-size: var(--fs-sm); color: var(--accent-2); letter-spacing: 0.01em; }
    /* --row-line = hauteur de référence de la 1ère ligne d'une rangée du tableau. La
       pastille de statut fait cette hauteur naturellement (padding+bordure) ; .name-row
       (colonne Client) reçoit le même min-height pour que son centre vertical tombe
       exactement au même endroit, même quand ses badges internes ont une hauteur variable
       (rien, un badge texte, ou une simple icône) — sans ça, le point de centrage de
       .name-row change selon le contenu et se décale de la pastille de quelques px. */
    :root { --row-line: 1.64rem; }
    .status-pill {
      display: inline-flex; align-items: center; gap: 0.45rem; min-height: var(--row-line); box-sizing: border-box;
      font-family: var(--font-mono); font-size: var(--fs-2xs); font-weight: 600;
      letter-spacing: 0.03em; text-transform: uppercase;
      padding: 0.32rem 0.6rem; border-radius: var(--r-sm); cursor: pointer; transition: all var(--t-fast);
      border: 1px solid color-mix(in srgb, var(--st, var(--border-strong)) 45%, transparent);
      color: var(--st, var(--text-muted));
      background: color-mix(in srgb, var(--st, var(--border-strong)) 10%, transparent);
      white-space: nowrap;
    }
    .status-pill .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--st, var(--text-muted)); box-shadow: 0 0 6px color-mix(in srgb, var(--st, transparent) 60%, transparent); }
    .status-pill svg { opacity: 0.55; }
    .status-pill:hover { box-shadow: var(--glow-soft); }
    .status-menu {
      position: fixed; z-index: 5000; display: none; min-width: 175px; padding: 4px;
      background: var(--surface); border: 1px solid var(--border-strong); border-radius: var(--r-md); box-shadow: var(--shadow);
    }
    .status-menu.open { display: block; }
    .status-menu button {
      display: flex; align-items: center; gap: 0.55rem; width: 100%; text-align: left;
      background: none; border: none; border-radius: var(--r-sm); padding: 0.45rem 0.6rem;
      font-family: var(--font-mono); font-size: var(--fs-2xs); font-weight: 600; text-transform: uppercase; letter-spacing: 0.03em;
      color: var(--text-muted); cursor: pointer;
    }
    .status-menu button:hover { background: var(--surface-2); color: var(--text); }
    .status-menu .dot { width: 7px; height: 7px; border-radius: 50%; flex: none; }

    /* ── Vue "Aujourd'hui" : briefing discret, uniquement s'il y a quelque chose à signaler ── */
    .today-brief {
      display: flex; align-items: center; gap: var(--sp-3); flex-wrap: wrap;
      padding: var(--sp-3) var(--sp-4); margin-bottom: var(--sp-4);
      background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-md);
      --tick-color: var(--accent-2);
    }
    .today-brief.hidden { display: none; }
    .tb-label { font-family: var(--font-mono); font-size: var(--fs-2xs); text-transform: uppercase; letter-spacing: 0.06em; color: var(--accent-2); display: flex; align-items: center; gap: 0.4rem; flex: none; }
    .tb-chip {
      display: inline-flex; align-items: center; gap: 0.4rem; font-family: var(--font-mono); font-size: var(--fs-2xs); font-weight: 600;
      padding: 0.3rem 0.65rem; border-radius: var(--r-sm); cursor: pointer; transition: all var(--t-fast);
      border: 1px solid color-mix(in srgb, var(--tbc, var(--text-subtle)) 45%, transparent);
      color: var(--tbc, var(--text-muted)); background: color-mix(in srgb, var(--tbc, var(--text-subtle)) 10%, transparent);
    }
    .tb-chip:hover { box-shadow: var(--glow-soft); }

    td .actions { display: flex; gap: 0.3rem; justify-content: flex-end; }
    .icon-btn { width: 30px; height: 30px; display: grid; place-items: center; border: 1px solid var(--border); border-radius: var(--r-sm); background: var(--surface-2); color: var(--text-muted); cursor: pointer; font-size: 0.85rem; transition: all var(--t-fast); }
    .icon-btn:hover { border-color: var(--accent); color: var(--accent); }
    .icon-btn.danger:hover { border-color: var(--danger); color: var(--danger); }

    .empty { text-align: center; padding: var(--sp-7) var(--sp-5); color: var(--text-muted); }
    .empty .big { display: flex; justify-content: center; margin-bottom: var(--sp-3); color: var(--text-subtle); }

    /* Pensée de la session — remplace la date au centre du header.
       flex:1 = occupe l'espace restant entre le brand et les actions et centre son
       contenu DANS cet espace (un centrage absolu se faisait chevaucher par les actions).
       Présentation : phrase encadrée de guillemets dorés à halo néon (cohérent avec le
       thème), révélée mot à mot (léger flou → net, en cascade). La taille s'auto-ajuste
       en JS pour qu'aucune phrase, même longue, ne soit jamais coupée. */
    .header-mood { flex: 1; min-width: 0; overflow: hidden; display: flex; align-items: center; justify-content: center; }
    .mantra {
      display: inline-flex; align-items: baseline; gap: 0.5rem; max-width: 100%;
      background: none; border: none; padding: 0.1rem 0.35rem; margin: 0; cursor: pointer;
      color: var(--text-muted); border-radius: var(--r-sm); transition: color var(--t-fast);
    }
    .mantra:hover { color: var(--text); }
    .mantra:hover .mq { opacity: 1; }
    .mantra:focus-visible { outline: 1px solid var(--accent); outline-offset: 3px; }
    .mantra .mq {
      font-family: var(--font-display); font-weight: 700; font-size: 1.05em; line-height: 1;
      color: var(--accent-2); opacity: 0.72; flex: none;
      text-shadow: 0 0 10px color-mix(in srgb, var(--accent-2) 45%, transparent);
      transition: opacity var(--t-fast);
    }
    .mantra-text { font-size: var(--fs-sm); letter-spacing: 0.004em; line-height: 1.25; white-space: nowrap; }
    .mantra .mw { display: inline-block; white-space: pre; }
    /* Révélation mot à mot rejouée à chaque nouvelle pensée (délai réglé inline par mot). */
    @keyframes mantraWordIn {
      from { opacity: 0; filter: blur(5px); transform: translateY(0.35em); }
      to   { opacity: 1; filter: blur(0);   transform: none; }
    }
    .mantra.reveal .mw { opacity: 0; animation: mantraWordIn 0.5s cubic-bezier(0.2, 0.6, 0.3, 1) forwards; }
    @media (prefers-reduced-motion: reduce) {
      .mantra.reveal .mw { animation: none; opacity: 1; filter: none; transform: none; }
    }
    @media (max-width: 900px) { .header-mood { display: none; } }

    /* Chip météo à la position actuelle (géolocalisation) — dans la barre d'actions. */
    .wx-chip {
      display: inline-flex; align-items: center; gap: 0.35rem; white-space: nowrap;
      font-family: var(--font-mono); font-size: var(--fs-2xs); color: var(--text-muted);
      border: 1px solid var(--border); border-radius: var(--r-sm); padding: 0.22rem 0.5rem;
    }
    .wx-chip svg { color: var(--accent-2); }
    .wx-chip .wx-city { color: var(--text-subtle); }
    @media (max-width: 1120px) { .wx-chip .wx-city { display: none; } }
    @media (max-width: 760px) { .wx-chip { display: none; } }

    /* Client : nom tronqué à largeur fixe + badges toujours calés sur le même bord droit
       (la colonne entière a la même largeur pour toutes les lignes, donc "justify-content:
       space-between" aligne les badges au millimètre, peu importe la longueur du nom). */
    /* La cellule Client fait 2 lignes (nom+badges, puis ID) alors que les autres colonnes
       n'en font qu'une : avec le vertical-align "middle" par défaut d'un <td>, la 1ère ligne
       du Client (donc les badges) et la pastille de Statut ne tombent pas à la même hauteur.
       Fixé en alignant toutes les cellules du tableau sur le haut. */
    #tableHost table.data td { vertical-align: top; }
    /* Cellule CLIENT : 2 lignes claires — (1) nom + petits indicateurs ; (2) #id + type(s) produit. */
    .client-cell { display: flex; flex-direction: column; gap: 5px; max-width: 270px; }
    .name-row { display: flex; align-items: center; justify-content: space-between; gap: 0.5rem; width: 100%; min-height: var(--row-line); box-sizing: border-box; }
    .client-cell .name { font-weight: 600; color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; flex: 1 1 auto; }
    .name-badges { display: flex; align-items: center; gap: 0.3rem; flex: none; }
    .id-row { display: flex; align-items: center; gap: 0.4rem; flex-wrap: wrap; row-gap: 4px; }
    .client-cell .id { font-family: var(--font-mono); font-size: var(--fs-2xs); color: var(--text-subtle); flex: none; }
    /* Badges "type de produit" (Screen / Volet / Tente solaire / Tablier volet) : style neutre
       façon annotation technique (comme .badge de base), volontairement SANS les couleurs
       accent/accent-2 déjà prises par Informatif/Portfolio/Statut — sinon la couleur perdrait
       son sens de code (statut) et deviendrait juste décorative. */
    .type-badges { display: flex; flex-wrap: wrap; gap: 0.25rem; }
    .type-badges .badge { padding: 0.12rem 0.4rem; font-size: 0.62rem; }
    /* Cellule STATUT : pastille sur la 1re ligne, badges secondaires (attente/expiré + informatif)
       regroupés en dessous — demandé par Nicolas pour dégager la ligne du nom. */
    .status-cell { display: flex; flex-direction: column; gap: 5px; align-items: flex-start; }
    .status-badges { display: flex; flex-wrap: wrap; gap: 4px; }
    .count-pill { font-size: var(--fs-xs); color: var(--text-muted); font-family: var(--font-mono); }
    /* Médias : caméra + commentaires toujours visibles (grisés à 0, colorés sinon), un peu plus
       grands, façon petits jetons cliquables ; survol = aperçu flottant (photos/notes). */
    .media-icons { display: flex; align-items: center; gap: 8px; }
    .mi-slot { display: inline-flex; align-items: center; gap: 4px; padding: 3px 7px; border-radius: var(--r-sm); border: 1px solid transparent; color: var(--text-subtle); opacity: 0.4; font-size: var(--fs-xs); transition: opacity var(--t-fast), border-color var(--t-fast), background var(--t-fast); }
    .mi-slot.active { opacity: 1; color: var(--text); }
    .mi-slot[data-preview] { cursor: help; border-color: var(--border); }
    .mi-slot[data-preview]:hover { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 8%, transparent); }
    .note-flag { display: inline-flex; align-items: center; color: var(--accent-2); margin-left: 2px; }
    /* Aperçu flottant au survol des médias (miniatures photos / fil de notes) — chargé à la demande. */
    .media-preview {
      position: fixed; z-index: 1200; max-width: 340px; min-width: 210px;
      background: var(--surface); border: 1px solid var(--border-strong); border-radius: var(--r-md);
      box-shadow: var(--shadow); padding: var(--sp-3); display: none; pointer-events: none;
    }
    .media-preview.open { display: block; animation: mpIn 0.12s ease-out; }
    @keyframes mpIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
    .mp-title { font-family: var(--font-mono); font-size: var(--fs-2xs); color: var(--text-subtle); text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: var(--sp-2); display: flex; align-items: center; gap: 0.35rem; }
    .mp-title svg { color: var(--accent-2); }
    .mp-photos { display: grid; grid-template-columns: repeat(3, 1fr); gap: 5px; }
    .mp-photos img { width: 100%; height: 62px; object-fit: cover; border-radius: var(--r-sm); border: 1px solid var(--border); display: block; }
    .mp-more { display: flex; align-items: center; justify-content: center; height: 62px; border-radius: var(--r-sm); border: 1px dashed var(--border-strong); color: var(--text-muted); font-family: var(--font-mono); font-size: var(--fs-xs); }
    .mp-comment { display: flex; gap: 0.5rem; padding: 0.4rem 0; border-top: 1px solid var(--border); }
    .mp-comment:first-child { border-top: none; padding-top: 0; }
    .mp-ava { width: 22px; height: 22px; border-radius: 50%; flex: none; display: flex; align-items: center; justify-content: center; font-family: var(--font-mono); font-size: 0.58rem; font-weight: 700; }
    .mp-ava.nicolas { background: color-mix(in srgb, var(--accent) 18%, transparent); color: var(--accent); border: 1px solid color-mix(in srgb, var(--accent) 35%, transparent); }
    .mp-ava.yannick { background: color-mix(in srgb, var(--accent-2) 18%, transparent); color: var(--accent-2); border: 1px solid color-mix(in srgb, var(--accent-2) 40%, transparent); }
    .mp-ava.client { background: color-mix(in srgb, var(--accent-3) 18%, transparent); color: var(--accent-3); border: 1px solid color-mix(in srgb, var(--accent-3) 40%, transparent); }
    .mp-c-body { min-width: 0; }
    .mp-c-meta { font-family: var(--font-mono); font-size: 0.58rem; color: var(--text-subtle); margin-bottom: 1px; }
    .mp-c-text { font-size: var(--fs-xs); color: var(--text); line-height: 1.35; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
    .mp-empty { font-size: var(--fs-xs); color: var(--text-muted); }
    .tag-dot { display: inline-flex; align-items: center; color: var(--text-subtle); }
    .proba-dot { width: 10px; height: 10px; border-radius: 50%; border: 1px solid color-mix(in srgb, var(--pc, var(--border-strong)) 70%, transparent); background: var(--pc, var(--border-strong)); cursor: pointer; padding: 0; flex: none; }
    .proba-dot:hover { box-shadow: 0 0 0 3px color-mix(in srgb, var(--pc, var(--border-strong)) 25%, transparent); }

    /* ── Modale commentaires internes ── */
    .modal-bg { position: fixed; inset: 0; background: rgba(0,0,0,0.55); z-index: 1000; display: none; align-items: center; justify-content: center; padding: var(--sp-4); }
    .modal-bg.open { display: flex; }
    .modal { background: var(--surface); border: 1px solid var(--border-strong); border-radius: var(--r-md); box-shadow: var(--shadow); width: 560px; max-width: 100%; max-height: 88vh; display: flex; flex-direction: column; --tick-color: var(--accent-2); }
    .modal .mhead { font-family: var(--font-display); font-size: var(--fs-md); padding: var(--sp-4) var(--sp-5); border-bottom: 1px solid var(--border); color: var(--accent); display: flex; align-items: center; gap: var(--sp-2); }
    .modal .mhead .mid { font-family: var(--font-mono); font-size: var(--fs-2xs); color: var(--text-subtle); margin-left: auto; }
    .modal .mbody { padding: var(--sp-4) var(--sp-5); overflow-y: auto; flex: 1; min-height: 120px; }
    .modal .mfoot { padding: var(--sp-4) var(--sp-5); border-top: 1px solid var(--border); }

    .comment { display: flex; gap: var(--sp-3); padding: var(--sp-3) 0; border-bottom: 1px dashed var(--border); }
    .comment:last-child { border-bottom: none; }
    .comment .c-avatar { width: 32px; height: 32px; flex: none; border-radius: var(--r-round); display: grid; place-items: center; font-weight: 700; font-size: var(--fs-2xs); }
    .comment .c-avatar.nicolas { background: color-mix(in srgb, var(--accent) 18%, transparent); color: var(--accent); border: 1px solid color-mix(in srgb, var(--accent) 35%, transparent); }
    .comment .c-avatar.yannick { background: color-mix(in srgb, var(--accent-2) 18%, transparent); color: var(--accent-2); border: 1px solid color-mix(in srgb, var(--accent-2) 40%, transparent); }
    .comment .c-avatar.client { background: color-mix(in srgb, var(--warn) 18%, transparent); color: var(--warn); border: 1px solid color-mix(in srgb, var(--warn) 40%, transparent); }
    .comment .c-main { flex: 1; min-width: 0; }
    .comment .c-meta { display: flex; align-items: center; gap: var(--sp-2); flex-wrap: wrap; }
    .comment .c-author { font-weight: 700; font-size: var(--fs-xs); text-transform: capitalize; }
    .comment .c-date { font-family: var(--font-mono); font-size: var(--fs-2xs); color: var(--text-subtle); }
    .comment .c-text { font-size: var(--fs-sm); color: var(--text); margin-top: 0.25rem; white-space: pre-wrap; word-break: break-word; }
    .comment.is-important { border-left: 2px solid var(--warn); padding-left: var(--sp-3); }
    .comment .c-del { margin-left: auto; background: none; border: none; color: var(--text-subtle); cursor: pointer; padding: 2px; }
    .comment .c-del:hover { color: var(--danger); }
    .empty-comments { text-align: center; color: var(--text-muted); padding: var(--sp-5); font-size: var(--fs-sm); }

    .comment-form { display: grid; grid-template-columns: 1fr 1fr; gap: var(--sp-2); }
    .comment-form textarea { grid-column: 1 / -1; min-height: 64px; }
    .comment-form .send-row { grid-column: 1 / -1; display: flex; justify-content: flex-end; gap: var(--sp-2); }
  </style>
</head>
<body>
  <div class="fx-grid"></div>

  <header class="app-header">
    <div class="brand">
      <span class="brand-logo"><img src="../assets/img/logo-solariscreen.png" alt="" onerror="this.style.display='none'"></span>
      <div>
        <h1><a href="dashboard.html">SOLARISCREEN</a></h1>
        <div class="module">Tableau de bord</div>
      </div>
    </div>
    <div class="header-mood">
      <button class="mantra" id="mantra" type="button" onclick="newMantra()" title="Pensée du jour — clique pour en tirer une autre" aria-label="Pensée du jour, cliquer pour en changer">
        <span class="mq" aria-hidden="true">«</span>
        <span class="mantra-text" id="mantraText"></span>
        <span class="mq" aria-hidden="true">»</span>
      </button>
    </div>
    <div class="header-actions">
      <span class="wx-chip hidden" id="wxChip" title="Météo à votre position"></span>
      <span class="badge" id="apiBadge" title="État de la connexion">…</span>
      <a class="btn btn-sm btn-terrain" href="terrain.html" title="Mode Terrain (iPhone)"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="7" y="2" width="10" height="20" rx="2"/><line x1="11" y1="18" x2="13" y2="18"/></svg> Terrain</a>
      <span id="quickNav"></span>
      <span id="themeToggle"></span>
      <a class="btn btn-primary btn-sm" href="simulateur.html"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg> Nouveau devis</a>
    </div>
  </header>

  <main class="container">
    <!-- Vue Aujourd'hui : uniquement si quelque chose mérite l'attention -->
    <div class="today-brief ticked hidden" id="todayBrief"></div>

    <!-- KPIs -->
    <div class="kpis" id="kpis"></div>

    <!-- Toolbar -->
    <div class="toolbar">
      <div class="search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <label for="search" class="sr-only">Rechercher un devis</label>
        <input class="input" id="search" placeholder="Rechercher un client, une ville, un tél., un email, un n° de devis…" oninput="render()">
      </div>
      <select class="select" id="sort" style="max-width:200px;" onchange="render()" aria-label="Trier les devis">
        <option value="modif">Tri : récents d'abord</option>
        <option value="montant">Tri : montant ↓</option>
        <option value="nom">Tri : nom A→Z</option>
      </select>
      <button class="btn btn-ghost btn-sm" onclick="exportJSON()" title="Sauvegarde"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg> Export</button>
      <button class="btn btn-ghost btn-sm" onclick="document.getElementById('importFile').click()" title="Restaurer"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg> Import</button>
      <input type="file" id="importFile" accept="application/json" hidden onchange="importJSON(this)">
      <button class="btn btn-ghost btn-sm" id="advToggle" onclick="toggleAdvFilters()"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="4" y1="21" x2="4" y2="14"/><line x1="4" y1="10" x2="4" y2="3"/><line x1="12" y1="21" x2="12" y2="12"/><line x1="12" y1="8" x2="12" y2="3"/><line x1="20" y1="21" x2="20" y2="16"/><line x1="20" y1="12" x2="20" y2="3"/><line x1="1" y1="14" x2="7" y2="14"/><line x1="9" y1="8" x2="15" y2="8"/><line x1="17" y1="16" x2="23" y2="16"/></svg> Filtres avancés<span id="advCount"></span></button>
    </div>
    <div class="filters" id="filters"></div>
    <div class="filters" id="sellerFilters" style="margin-top:0.35rem;"></div>

    <div class="adv-panel hidden" id="advPanel">
      <div class="field"><label class="label" for="advMontantMin">Montant min (€)</label><input class="input input-num" type="number" min="0" id="advMontantMin" oninput="render()"></div>
      <div class="field"><label class="label" for="advMontantMax">Montant max (€)</label><input class="input input-num" type="number" min="0" id="advMontantMax" oninput="render()"></div>
      <div class="field"><label class="label" for="advDateFrom">Créé depuis le</label><input class="input" type="date" id="advDateFrom" onchange="render()"></div>
      <div class="field"><label class="label" for="advDateTo">Créé jusqu'au</label><input class="input" type="date" id="advDateTo" onchange="render()"></div>
      <div class="field"><label class="label" for="advChantier">Chantier</label>
        <select class="select" id="advChantier" onchange="render()">
          <option value="tous">Tous</option>
          <option value="planifie">Pose planifiée</option>
          <option value="non_planifie">Signé, pose non planifiée</option>
        </select>
      </div>
      <button class="btn btn-ghost btn-sm" onclick="resetAdvFilters()" style="align-self:end;">Réinitialiser</button>
    </div>

    <!-- Table -->
    <section class="section" style="margin-top: var(--sp-4);">
      <div class="section-head">
        <span class="section-title">Devis</span>
        <span class="section-code">SS // DASH</span>
        <span class="section-sub" id="resultCount">—</span>
      </div>
      <div id="tableHost"></div>
    </section>
  </main>

  <!-- Modale commentaires internes -->
  <div class="modal-bg" id="modalComments">
    <div class="modal ticked">
      <div class="mhead">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
        Notes internes
        <span class="mid" id="cmDevisId">—</span>
        <button class="btn btn-ghost btn-sm" onclick="closeComments()" aria-label="Fermer" style="margin-left:var(--sp-2);">✕</button>
      </div>
      <div class="mbody" id="cmList"><div class="empty-comments">Chargement…</div></div>
      <div class="mfoot">
        <div class="comment-form">
          <div class="field">
            <label class="label" for="cmAuthor">Auteur</label>
            <select class="select" id="cmAuthor">
              <option value="nicolas">Nicolas</option>
              <option value="yannick">Yannick</option>
            </select>
          </div>
          <div class="field">
            <label class="label" for="cmType">Type</label>
            <select class="select" id="cmType">
              <option value="note">Note</option>
              <option value="question">Question</option>
              <option value="important">Important</option>
            </select>
          </div>
          <textarea class="textarea" id="cmText" placeholder="Info chantier, question pour l'autre, rappel…"></textarea>
          <div class="send-row">
            <button class="btn btn-primary btn-sm" onclick="sendComment()">
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
              Ajouter la note
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="../assets/js/ui.js"></script>
  <script src="../assets/js/mantras.js"></script>
  <script src="../assets/js/nav.js"></script>
  <script src="../assets/js/api.js"></script>
  <script>
    const SS = window.SS;
    const { mountThemeToggle } = window.SSTheme;
    const { fmtEur, fmtDate, el, setText, toast, normDevis, icon, daysInCurrentStatus, clientKeyOf } = window.SSUI;

    mountThemeToggle(document.getElementById('themeToggle'));
    window.SSNav.mount(document.getElementById('quickNav'));

    // ── Pensée de la session au centre du header ──
    // Une seule pensée par session (stable → elle s'imprègne), clic = en tirer une autre.
    // Révélation mot à mot + auto-ajustement de la taille pour ne jamais couper une phrase.
    function buildMantraWords(text) {
      const t = el('mantraText');
      t.textContent = '';
      const words = String(text).split(' ');
      words.forEach((w, i) => {
        const span = document.createElement('span');
        span.className = 'mw';
        span.textContent = (i ? ' ' : '') + w;   // espace insécable au rendu (white-space:pre)
        span.style.animationDelay = (i * 45) + 'ms';
        t.appendChild(span);
      });
    }
    function fitMantra() {
      const mood = document.querySelector('.header-mood');
      const box = el('mantra'), t = el('mantraText');
      if (!mood || mood.clientWidth < 40) return;   // masqué (mobile) → rien à ajuster
      let size = 0.9;                                // rem (≈ fs-sm)
      t.style.fontSize = size + 'rem';
      const avail = mood.clientWidth - 6;
      let guard = 0;
      while (box.scrollWidth > avail && size > 0.62 && guard < 24) {
        size -= 0.03; t.style.fontSize = size + 'rem'; guard++;
      }
    }
    function showMantra(text) {
      const box = el('mantra');
      box.classList.remove('reveal');
      buildMantraWords(text);
      fitMantra();
      void box.offsetWidth;              // reflow : rejoue la révélation
      box.classList.add('reveal');
    }
    window.newMantra = () => showMantra(window.SSMantras.fresh());
    showMantra(window.SSMantras.forSession());
    window.addEventListener('resize', fitMantra);
    try { document.fonts.ready.then(fitMantra); } catch (e) {}

    // ── Météo actuelle à la position de l'utilisateur (chip dans la barre d'actions) ──
    // Géolocalisation navigateur (demande une autorisation une seule fois) → Open-Meteo
    // + géocodage inverse pour le nom de la ville. Silencieux si refusé/indisponible.
    (function initCurrentWeather() {
      if (!navigator.geolocation) return;
      navigator.geolocation.getCurrentPosition(async (pos) => {
        const { latitude, longitude } = pos.coords;
        const [w, city] = await Promise.all([
          window.SSUI.fetchCurrentWeatherByCoords(latitude, longitude),
          window.SSUI.reverseGeocodeCity(latitude, longitude),
        ]);
        if (!w) return;
        const chip = el('wxChip');
        chip.innerHTML = `${icon(window.SSUI.weatherIconName(w.code), 14)} ${Math.round(w.temp)}°${city ? ` <span class="wx-city">${esc(city)}</span>` : ''}`;
        chip.title = `${w.label}${city ? ' à ' + city : ''} · météo actuelle à votre position`;
        chip.classList.remove('hidden');
      }, () => {}, { timeout: 8000, maximumAge: 900000 });
    })();

    const STATUSES = {
      brouillon:     { label: 'Brouillon',  color: 'var(--text-subtle)' },
      envoye_client: { label: 'Envoyé',     color: 'var(--accent)' },
      relance_1:     { label: 'Relance 1',  color: 'var(--warn)' },
      relance_2:     { label: 'Relance 2',  color: 'var(--warn)' },
      signe:         { label: 'Signé',      color: 'var(--ok)' },
      termine:       { label: 'Terminé',    color: 'var(--accent-2)' },
      refuse:        { label: 'Refusé',     color: 'var(--danger)' },
      annule:        { label: 'Annulé',     color: 'var(--text-subtle)' },
    };

    const TYPE_LABEL = { screen: 'Screen', volet_roulant: 'Volet', tente_solaire: 'Tente solaire', tablier_volet: 'Tablier volet' };
    const WAITING_STATUSES = ['envoye_client', 'relance_1', 'relance_2'];
    const PRE_SIGNATURE_STATUSES = ['brouillon', 'envoye_client', 'relance_1', 'relance_2'];
    const PROBABILITE = {
      froid: { label: 'Froid', color: 'var(--text-subtle)' },
      tiede: { label: 'Tiède', color: 'var(--accent)' },
      chaud: { label: 'Chaud', color: 'var(--warn)' },
      presque: { label: 'Presque signé', color: 'var(--accent-2)' },
    };

    let DEVIS = [], FACTURES = [], CLIENT_TAGS = new Map();
    let activeFilter = 'tous';
    let activeSeller = 'tous';

    // ── Paiement (acompte/solde) — lu depuis les factures liées au devis ──
    const paidSum = f => (f.paiements || []).reduce((s, p) => s + (Number(p.montant) || 0), 0);
    function isPaymentOverdue(d) {
      const facs = FACTURES.filter(f => f.devis_id === d.id);
      if (!facs.length) return false;
      const today = new Date().toISOString().slice(0, 10);
      return facs.some(f => paidSum(f) < (f.total_ttc || 0) - 0.005 && f.echeance && f.echeance < today);
    }
    // Devis signé (chantier pas encore posé) dont l'acompte n'a pas été intégralement reçu.
    function isAcompteUnpaid(d) {
      if (d.statut !== 'signe') return false;
      const facs = FACTURES.filter(f => f.devis_id === d.id && f.type === 'acompte');
      if (!facs.length) return true;
      const due = facs.reduce((s, f) => s + (f.total_ttc || 0), 0);
      const paid = facs.reduce((s, f) => s + paidSum(f), 0);
      return paid < due - 0.005;
    }
    // Devis signé avec une pose planifiée dans les 7 prochains jours (bientôt sur le terrain).
    function isChantierAPreparer(d) {
      if (d.statut !== 'signe' || !d.chantier || !d.chantier.date_pose) return false;
      const days = Math.round((new Date(d.chantier.date_pose) - new Date(new Date().toISOString().slice(0, 10))) / 86400000);
      return days >= 0 && days <= 7;
    }
    // Nombre de jours depuis le tout premier envoi au client (pas juste le statut courant —
    // une relance ne remet pas le compteur de validité CGV à zéro). CGV : devis valide 30 jours.
    function daysSinceSent(d) {
      const hist = d.statut_history || [];
      const first = hist.find(h => WAITING_STATUSES.includes(h.statut));
      const anchor = first ? first.date : (WAITING_STATUSES.includes(d.statut) ? d.date_creation : null);
      if (!anchor) return null;
      return Math.floor((Date.now() - new Date(anchor).getTime()) / 86400000);
    }
    function isDevisExpire(d) {
      if (!WAITING_STATUSES.includes(d.statut)) return false;
      const days = daysSinceSent(d);
      return days !== null && days >= 30;
    }
    function paymentInfo(d) {
      const facs = FACTURES.filter(f => f.devis_id === d.id);
      if (!facs.length) return '';
      const totalFact = facs.reduce((s, f) => s + (f.total_ttc || 0), 0);
      const totalPaid = facs.reduce((s, f) => s + paidSum(f), 0);
      if (totalPaid > 0 && totalPaid >= d.ttc - 0.005) return `<span class="badge badge-ok" title="Encaissé : ${fmtEur(totalPaid)}">${icon('coin', 10)} Soldé</span>`;
      if (isPaymentOverdue(d)) return `<span class="badge badge-danger" title="Facturé ${fmtEur(totalFact)}, payé ${fmtEur(totalPaid)}">${icon('warning', 10)} Retard paiement</span>`;
      if (totalPaid > 0) return `<span class="badge badge-warn" title="Payé ${fmtEur(totalPaid)} sur ${fmtEur(totalFact)} facturé">${icon('coin', 10)} Acompte payé</span>`;
      return `<span class="badge" title="Facturé ${fmtEur(totalFact)}, en attente de paiement">${icon('coin', 10)} À encaisser</span>`;
    }

    // ── Archivage (masquer proprement les devis refusés, réversible) ──
    window.archiveDevis = async (id, val) => {
      const full = await SS.getDevis(id);
      if (!full) { toast('Devis introuvable', 'error'); return; }
      full.archive = val;
      full.date_modification = new Date().toISOString();
      await SS.saveDevis(full);
      const d = DEVIS.find(x => x.id === id); if (d) d.archive = val;
      toast(val ? 'Devis archivé' : 'Devis désarchivé', 'ok');
      render();
    };

    function renderFilters() {
      const visible = DEVIS.filter(d => !d.archive);
      const counts = { tous: visible.length };
      visible.forEach(d => { counts[d.statut] = (counts[d.statut] || 0) + 1; });
      const archivedCount = DEVIS.filter(d => d.archive).length;
      const chips = [['tous', 'Tous']].concat(Object.entries(STATUSES).map(([k, v]) => [k, v.label]));
      el('filters').innerHTML = chips
        .filter(([k]) => k === 'tous' || counts[k])
        .map(([k, label]) => `<button class="chip ${activeFilter === k ? 'active' : ''}" onclick="setFilter('${k}')">${label} <span style="opacity:.6">${counts[k] || 0}</span></button>`)
        .join('')
        + (archivedCount ? `<button class="chip chip-archive ${activeFilter === 'archives' ? 'active' : ''}" onclick="setFilter('archives')">Archivés <span style="opacity:.6">${archivedCount}</span></button>` : '');
    }
    window.setFilter = (k) => { activeFilter = k; render(); };

    const SELLER_LABELS = { nicolas: 'Nicolas', yannick: 'Yannick', autre: 'Autre' };
    function renderSellerFilters() {
      const visible = DEVIS.filter(d => !d.archive);
      const counts = {};
      visible.forEach(d => { const s = d.seller_principal || 'nicolas'; counts[s] = (counts[s] || 0) + 1; });
      const keys = Object.keys(counts).sort((a, b) => (a === 'nicolas' ? -1 : b === 'nicolas' ? 1 : a.localeCompare(b)));
      if (keys.length < 2) { el('sellerFilters').innerHTML = ''; return; }
      el('sellerFilters').innerHTML = `<button class="chip ${activeSeller === 'tous' ? 'active' : ''}" onclick="setSellerFilter('tous')">Tous vendeurs</button>`
        + keys.map(k => `<button class="chip ${activeSeller === k ? 'active' : ''}" onclick="setSellerFilter('${k}')">${SELLER_LABELS[k] || k} <span style="opacity:.6">${counts[k]}</span></button>`).join('');
    }
    window.setSellerFilter = (k) => { activeSeller = k; render(); };

    function renderTodayBrief() {
      const visible = DEVIS.filter(d => !d.archive);
      const toRelance = visible.filter(d => WAITING_STATUSES.includes(d.statut) && daysInCurrentStatus(d) >= 7);
      const enRetard = visible.filter(isPaymentOverdue);
      const acompteAttente = visible.filter(isAcompteUnpaid);
      const aPreparer = visible.filter(isChantierAPreparer);
      const expires = visible.filter(isDevisExpire);
      const box = el('todayBrief');
      const chips = [];
      if (toRelance.length) chips.push({ label: `${toRelance.length} devis à relancer`, color: 'var(--warn)', filter: 'a_relancer', ic: 'clock' });
      if (enRetard.length) chips.push({ label: `${enRetard.length} paiement${enRetard.length > 1 ? 's' : ''} en retard`, color: 'var(--danger)', filter: 'en_retard', ic: 'warning' });
      if (acompteAttente.length) chips.push({ label: `${acompteAttente.length} acompte${acompteAttente.length > 1 ? 's' : ''} non payé${acompteAttente.length > 1 ? 's' : ''}`, color: 'var(--warn)', filter: 'acompte_attente', ic: 'coin' });
      if (aPreparer.length) chips.push({ label: `${aPreparer.length} chantier${aPreparer.length > 1 ? 's' : ''} à préparer`, color: 'var(--accent-2)', filter: 'a_preparer', ic: 'calendar' });
      if (expires.length) chips.push({ label: `${expires.length} devis expiré${expires.length > 1 ? 's' : ''}`, color: 'var(--danger)', filter: 'expire', ic: 'warning' });
      if (!chips.length) { box.classList.add('hidden'); return; }
      box.classList.remove('hidden');
      box.innerHTML = `
        <span class="tb-label">${icon('sliders', 13)} Aujourd'hui</span>
        ${chips.map(c => `<button class="tb-chip" style="--tbc:${c.color}" onclick="setFilter('${c.filter}')">${icon(c.ic, 12)} ${c.label}</button>`).join('')}
      `;
    }

    // ── Filtres avancés (montant, date de création, chantier planifié) ──
    window.toggleAdvFilters = () => {
      el('advPanel').classList.toggle('hidden');
      el('advToggle').classList.toggle('active', !el('advPanel').classList.contains('hidden'));
    };
    window.resetAdvFilters = () => {
      el('advMontantMin').value = ''; el('advMontantMax').value = '';
      el('advDateFrom').value = ''; el('advDateTo').value = '';
      el('advChantier').value = 'tous';
      render();
    };
    function applyAdvFilters(rows) {
      const min = parseFloat(el('advMontantMin').value);
      const max = parseFloat(el('advMontantMax').value);
      const from = el('advDateFrom').value;
      const to = el('advDateTo').value;
      const chantier = el('advChantier').value;
      let n = 0;
      if (!isNaN(min)) { rows = rows.filter(d => d.ttc >= min); n++; }
      if (!isNaN(max)) { rows = rows.filter(d => d.ttc <= max); n++; }
      if (from) { rows = rows.filter(d => (d.date_creation || '').slice(0, 10) >= from); n++; }
      if (to) { rows = rows.filter(d => (d.date_creation || '').slice(0, 10) <= to); n++; }
      if (chantier === 'planifie') { rows = rows.filter(d => d.chantier && d.chantier.date_pose); n++; }
      else if (chantier === 'non_planifie') { rows = rows.filter(d => ['signe', 'termine'].includes(d.statut) && !(d.chantier && d.chantier.date_pose)); n++; }
      el('advCount').textContent = n ? `(${n})` : '';
      return rows;
    }

    function renderKPIs() {
      const total = DEVIS.length;
      const signes = DEVIS.filter(d => ['signe', 'termine'].includes(d.statut));
      const envoyes = DEVIS.filter(d => ['envoye_client', 'relance_1', 'relance_2'].includes(d.statut));
      const caSigne = signes.reduce((s, d) => s + d.ttc, 0);
      // CA réellement encaissé = somme des paiements reçus sur toutes les factures (pas le total théorique des devis)
      const caEncaisse = FACTURES.reduce((s, f) => s + paidSum(f), 0);
      const totalFacture = FACTURES.reduce((s, f) => s + (f.total_ttc || 0), 0);
      // Bénéfices cumulés par vendeur, sur les devis réellement signés/terminés
      const nicolasNet = signes.reduce((s, d) => s + (d.nicolas_net || 0), 0);
      const yannickNet = signes.reduce((s, d) => s + (d.yannick_net || 0), 0);
      el('kpis').innerHTML = `
        <div class="kpi accent"><div class="kpi-label">Devis</div><div class="kpi-value">${total}</div><div class="kpi-sub">${envoyes.length} en attente client</div></div>
        <div class="kpi gold"><div class="kpi-label">Encaissé</div><div class="kpi-value">${fmtEur(caEncaisse)}</div><div class="kpi-sub">déjà payé par les clients${totalFacture ? ' · ' + fmtEur(totalFacture) + ' facturé' : ''}</div></div>
        <div class="kpi ok"><div class="kpi-label">Signés / terminés</div><div class="kpi-value">${signes.length}</div><div class="kpi-sub">${fmtEur(caSigne)} signés</div></div>
        <div class="kpi accent"><div class="kpi-label">Bénéfice Nicolas</div><div class="kpi-value">${fmtEur(nicolasNet)}</div><div class="kpi-sub">devis signés/terminés</div></div>
        <div class="kpi gold"><div class="kpi-label">Bénéfice Yannick</div><div class="kpi-value">${fmtEur(yannickNet)}</div><div class="kpi-sub">devis signés/terminés</div></div>`;
    }

    function render() {
      renderTodayBrief();
      renderKPIs();
      renderFilters();
      renderSellerFilters();
      const q = el('search').value.trim().toLowerCase();
      const sort = el('sort').value;
      let rows = activeFilter === 'archives' ? DEVIS.filter(d => d.archive) : DEVIS.filter(d => !d.archive);
      if (activeFilter === 'a_relancer') rows = rows.filter(d => WAITING_STATUSES.includes(d.statut) && daysInCurrentStatus(d) >= 7);
      else if (activeFilter === 'en_retard') rows = rows.filter(isPaymentOverdue);
      else if (activeFilter === 'acompte_attente') rows = rows.filter(isAcompteUnpaid);
      else if (activeFilter === 'a_preparer') rows = rows.filter(isChantierAPreparer);
      else if (activeFilter === 'expire') rows = rows.filter(isDevisExpire);
      else if (activeFilter !== 'tous' && activeFilter !== 'archives') rows = rows.filter(d => d.statut === activeFilter);
      if (activeSeller !== 'tous') rows = rows.filter(d => (d.seller_principal || 'nicolas') === activeSeller);
      if (q) rows = rows.filter(d => (`${d.prenom} ${d.nom} ${d.id} ${d.ville} ${d.telephone} ${d.email}`).toLowerCase().includes(q));
      rows = applyAdvFilters(rows);
      rows.sort((a, b) => {
        if (sort === 'montant') return b.ttc - a.ttc;
        if (sort === 'nom') return (a.nom || '').localeCompare(b.nom || '');
        return (b.date_modification || '').localeCompare(a.date_modification || '');
      });

      setText('resultCount', `${rows.length} devis`);

      if (rows.length === 0) {
        const msg = activeFilter === 'archives' ? 'Aucun devis archivé.' : (DEVIS.length === 0 ? "Aucun devis pour l'instant.<br>Clique sur <strong>+ Nouveau devis</strong> pour commencer." : "Aucun devis ne correspond à ta recherche.");
        el('tableHost').innerHTML = `<div class="empty"><div class="big">${icon('window', 40)}</div>${msg}</div>`;
        return;
      }

      const pill = (d) => {
        const s = STATUSES[d.statut] || STATUSES.brouillon;
        const title = d.statut === 'refuse' && d.raison_refus ? ` title="Raison : ${esc(d.raison_refus)}"` : '';
        return `<button class="status-pill" style="--st:${s.color}"${title} onclick="openStatusMenu(event,'${d.id}')" aria-label="Changer le statut du devis ${d.id}"><span class="dot"></span>${s.label} ${icon('chevrondown', 10)}</button>`;
      };
      const nameTitle = (d) => {
        const full = ((d.prenom || '') + ' ' + (d.nom || '')).trim();
        const tags = CLIENT_TAGS.get(clientKeyOf(d.prenom, d.nom)) || [];
        return tags.length ? `${full} — Étiquettes : ${tags.join(', ')}` : full;
      };
      const typeBadges = (d) => {
        const types = d.item_types || [];
        if (!types.length) return '';
        return `<div class="type-badges">${types.map(t => `<span class="badge">${esc(TYPE_LABEL[t] || t)}</span>`).join('')}</div>`;
      };
      // Badge secondaire de statut (attente/expiré) — renvoie juste le <span>, regroupé sous la pastille.
      const waitingBadge = (d) => {
        if (!WAITING_STATUSES.includes(d.statut)) return '';
        if (isDevisExpire(d)) {
          const sentDays = daysSinceSent(d);
          return `<span class="badge badge-danger" title="Devis envoyé depuis ${sentDays} jours — validité CGV de 30 jours dépassée">${icon('warning', 10)} Expiré</span>`;
        }
        const days = daysInCurrentStatus(d);
        if (days < 3) return '';
        const cls = days >= 14 ? 'badge-danger' : days >= 7 ? 'badge-warn' : '';
        return `<span class="badge ${cls}" title="En attente de réponse depuis ${days} jour(s)">${icon('clock', 10)} ${days} j</span>`;
      };
      const statusCell = (d) => {
        const infoB = d.informatif ? `<span class="badge badge-cyan" title="Estimation non contractuelle">Informatif</span>` : '';
        const waitB = waitingBadge(d);
        const secondary = (waitB || infoB) ? `<div class="status-badges">${waitB}${infoB}</div>` : '';
        return `<div class="status-cell">${pill(d)}${secondary}</div>`;
      };
      el('tableHost').innerHTML = `
        <div class="table-wrap" style="border:none;border-radius:0;">
          <table class="data">
            <thead><tr>
              <th>Client</th><th>Statut</th><th>Modifié</th>
              <th class="num">Montant TVAC</th><th>Paiement</th><th>Médias</th><th style="text-align:right;">Actions</th>
            </tr></thead>
            <tbody>
              ${rows.map(d => `
                <tr data-id="${d.id}" title="Ouvrir la fiche du devis">
                  <td><div class="client-cell">
                    <div class="name-row">
                      <span class="name" title="${esc(nameTitle(d))}">${esc(d.prenom)} ${esc(d.nom) || '—'}</span>
                      <div class="name-badges">
                        ${PRE_SIGNATURE_STATUSES.includes(d.statut) ? `<button class="proba-dot" style="--pc:${(PROBABILITE[d.probabilite] || {}).color || 'var(--border-strong)'}" onclick="event.stopPropagation();toggleProbaMenu(event,'${d.id}')" title="${d.probabilite ? 'Probabilité : ' + PROBABILITE[d.probabilite].label : 'Définir une probabilité de signature'}"></button>` : ''}
                        ${CLIENT_TAGS.has(clientKeyOf(d.prenom, d.nom)) ? `<span class="tag-dot" title="${esc('Étiquettes : ' + CLIENT_TAGS.get(clientKeyOf(d.prenom, d.nom)).join(', '))}">${icon('tag', 11)}</span>` : ''}
                        ${d.portfolio ? `<span class="badge badge-gold" title="Dans le portfolio de réalisations">${icon('star', 10)}</span>` : ''}
                      </div>
                    </div>
                    <div class="id-row">
                      <span class="id">#${d.id}</span>
                      ${typeBadges(d)}
                    </div>
                  </div></td>
                  <td>${statusCell(d)}</td>
                  <td class="text-muted">${fmtDate(d.date_modification)}</td>
                  <td class="num"><span class="price">${fmtEur(d.ttc)}</span></td>
                  <td>${paymentInfo(d)}</td>
                  <td class="count-pill">
                    <div class="media-icons">
                      <span class="mi-slot ${d.photos ? 'active' : ''}" ${d.photos ? `data-preview="photos" data-id="${d.id}"` : ''} title="${d.photos ? d.photos + ' photo(s) — survoler pour un aperçu' : 'Aucune photo'}">${icon('camera', 15)}${d.photos || 0}</span>
                      <span class="mi-slot ${d.comments ? 'active' : ''}" ${d.comments ? `data-preview="comments" data-id="${d.id}"` : ''} title="${d.comments ? d.comments + ' note(s) interne(s) — survoler pour un aperçu' : 'Aucune note'}">${icon('message', 15)}${d.comments || 0}</span>
                      ${d.note ? `<span class="note-flag" title="${esc(d.note)}">${icon('info', 14)}</span>` : ''}
                    </div>
                  </td>
                  <td><div class="actions">
                    <button class="icon-btn" title="Notes internes" aria-label="Notes internes du devis ${d.id}" onclick="openComments('${d.id}')" style="${d.comments ? 'color:var(--accent-2);border-color:color-mix(in srgb, var(--accent-2) 45%, transparent);' : ''}">${icon('message', 15)}</button>
                    <button class="icon-btn" title="Éditer" aria-label="Éditer le devis ${d.id}" onclick="location.href='simulateur.html?id=${d.id}'">${icon('edit', 15)}</button>
                    <button class="icon-btn" title="Dupliquer" aria-label="Dupliquer le devis ${d.id}" onclick="duplicate('${d.id}')">${icon('copy', 15)}</button>
                    <button class="icon-btn" title="Devis / PDF" aria-label="Voir le devis ${d.id} en PDF" onclick="location.href='devis.html?id=${d.id}'">${icon('filetext', 15)}</button>
                    ${['signe', 'termine'].includes(d.statut) ? `<button class="icon-btn" title="Liste de pose" aria-label="Liste de pose du devis ${d.id}" onclick="location.href='picking.html?id=${d.id}'">${icon('list', 15)}</button>` : ''}
                    ${d.statut === 'refuse' && !d.archive ? `<button class="icon-btn" title="Archiver" aria-label="Archiver le devis ${d.id}" onclick="archiveDevis('${d.id}', true)">${icon('download', 15)}</button>` : ''}
                    ${d.archive ? `<button class="icon-btn" title="Désarchiver" aria-label="Désarchiver le devis ${d.id}" onclick="archiveDevis('${d.id}', false)">${icon('upload', 15)}</button>` : ''}
                    <button class="icon-btn danger" title="Supprimer" aria-label="Supprimer le devis ${d.id}" onclick="del('${d.id}')">${icon('trash', 15)}</button>
                  </div></td>
                </tr>`).join('')}
            </tbody>
          </table>
        </div>`;
    }

    function esc(s) { return String(s || '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }

    // ── Aperçu flottant au survol des médias (miniatures photos / fil de notes) ──
    // Chargé à la demande (SS.getDevis, mis en cache) : la liste n'embarque que les compteurs,
    // pas les photos/textes, pour rester légère. Écouteurs délégués sur #tableHost (persistants
    // même après réécriture du tableau à chaque render).
    (function () {
      const host = el('tableHost');
      if (!host) return;
      let previewEl = null, hoverTimer = null, currentSlot = null;
      const cache = {};
      function ensureEl() {
        if (previewEl) return;
        previewEl = document.createElement('div');
        previewEl.className = 'media-preview';
        document.body.appendChild(previewEl);
      }
      function hide() { if (previewEl) previewEl.classList.remove('open'); }
      function position(slot) {
        const p = previewEl, r = slot.getBoundingClientRect();
        const pw = p.offsetWidth, ph = p.offsetHeight;
        let left = r.left + r.width / 2 - pw / 2;
        left = Math.max(8, Math.min(left, window.innerWidth - pw - 8));
        let top = r.bottom + 8;
        if (top + ph > window.innerHeight - 8) top = r.top - ph - 8;   // pas de place dessous → au-dessus
        p.style.left = left + 'px';
        p.style.top = Math.max(8, top) + 'px';
      }
      function renderPhotos(devis) {
        const photos = [];
        (devis.items || []).forEach(it => (it.photos || []).forEach(src => { if (src) photos.push(src); }));
        if (!photos.length) return '<div class="mp-empty">Aucune photo à afficher.</div>';
        const shown = photos.slice(0, 6), extra = photos.length - shown.length;
        return `<div class="mp-title">${icon('camera', 12)} ${photos.length} photo(s)</div>
          <div class="mp-photos">${shown.map(s => `<img src="${s}" alt="" loading="lazy">`).join('')}${extra > 0 ? `<div class="mp-more">+${extra}</div>` : ''}</div>`;
      }
      function renderNotes(devis) {
        const comments = (devis.comments || []).slice().sort((a, b) => String(b.date).localeCompare(String(a.date))).slice(0, 4);
        if (!comments.length) return '<div class="mp-empty">Aucune note interne.</div>';
        return `<div class="mp-title">${icon('message', 12)} Notes internes</div>` + comments.map(c => {
          const author = (c.author || 'nicolas').toLowerCase();
          const cls = author === 'client' ? 'client' : (author === 'yannick' ? 'yannick' : 'nicolas');
          const av = author === 'client' ? 'CL' : (author === 'yannick' ? 'YA' : 'NI');
          const who = author === 'client' ? 'Client' : author.charAt(0).toUpperCase() + author.slice(1);
          return `<div class="mp-comment"><div class="mp-ava ${cls}">${av}</div><div class="mp-c-body"><div class="mp-c-meta">${who} · ${fmtDate(c.date)}</div><div class="mp-c-text">${esc(c.text || '')}</div></div></div>`;
        }).join('');
      }
      async function show(slot) {
        const id = slot.getAttribute('data-id'), kind = slot.getAttribute('data-preview');
        if (!id || !kind) return;
        ensureEl();
        previewEl.classList.add('open');
        previewEl.innerHTML = '<div class="mp-empty">Chargement…</div>';
        position(slot);
        let devis = cache[id];
        if (!devis) { try { devis = await SS.getDevis(id); cache[id] = devis; } catch (e) { devis = null; } }
        if (currentSlot !== slot) return;   // le survol a changé de cible entre-temps
        previewEl.innerHTML = devis ? (kind === 'photos' ? renderPhotos(devis) : renderNotes(devis)) : '<div class="mp-empty">Aperçu indisponible.</div>';
        position(slot);
      }
      host.addEventListener('mouseover', (e) => {
        const slot = e.target.closest('.mi-slot[data-preview]');
        if (!slot || slot === currentSlot) return;
        currentSlot = slot;
        clearTimeout(hoverTimer);
        hoverTimer = setTimeout(() => show(slot), 180);
      });
      host.addEventListener('mouseout', (e) => {
        const slot = e.target.closest('.mi-slot[data-preview]');
        if (!slot) return;
        if (e.relatedTarget && slot.contains(e.relatedTarget)) return;   // déplacement interne au slot
        currentSlot = null;
        clearTimeout(hoverTimer);
        hide();
      });
      window.addEventListener('scroll', hide, true);
    })();

    // ── Actions ──
    window.changeStatus = async (id, statut) => {
      const identity = await window.SSNav.getIdentity();
      await SS.updateStatus(id, statut, identity.key);
      const d = DEVIS.find(x => x.id === id);
      if (d) { d.statut = statut; d.statut_history = (d.statut_history || []).concat([{ statut, date: new Date().toISOString(), by: identity.key || null }]); }
      toast('Statut mis à jour', 'ok');
      render();
    };

    // ── Menu de statut (pastilles colorées) ──
    let stMenuEl = null, stTarget = null;
    function ensureStatusMenu() {
      if (stMenuEl) return;
      stMenuEl = document.createElement('div');
      stMenuEl.className = 'status-menu';
      document.body.appendChild(stMenuEl);
      document.addEventListener('click', (e) => {
        if (stMenuEl.classList.contains('open') && !stMenuEl.contains(e.target) && !e.target.closest('.status-pill')) stMenuEl.classList.remove('open');
      }, true);
      window.addEventListener('scroll', () => stMenuEl.classList.remove('open'), true);
      document.addEventListener('keydown', (e) => { if (e.key === 'Escape') stMenuEl.classList.remove('open'); });
    }
    window.openStatusMenu = (e, id) => {
      e.stopPropagation();
      ensureStatusMenu();
      stTarget = id;
      stMenuEl.innerHTML = Object.entries(STATUSES).map(([k, v]) =>
        `<button onclick="pickStatus('${k}')"><span class="dot" style="background:${v.color}"></span>${v.label}</button>`).join('');
      const r = e.currentTarget.getBoundingClientRect();
      stMenuEl.style.left = Math.max(8, Math.min(r.left, window.innerWidth - 195)) + 'px';
      stMenuEl.style.top = Math.min(r.bottom + 6, window.innerHeight - 320) + 'px';
      stMenuEl.classList.add('open');
    };
    const RAISON_REFUS = ['Prix', 'Délai', 'Concurrent', 'Projet reporté', 'Pas de réponse', 'Autre'];
    window.pickStatus = async (st) => {
      if (st === 'refuse') {
        // Demande la raison du refus dans le même menu flottant, avant d'appliquer le changement.
        stMenuEl.innerHTML = RAISON_REFUS.map(r => `<button onclick="pickRaisonRefus('${r}')">${r}</button>`).join('')
          + `<button onclick="pickRaisonRefus('')" style="color:var(--text-subtle);">Passer</button>`;
        return;
      }
      stMenuEl.classList.remove('open');
      if (stTarget) await changeStatus(stTarget, st);
    };
    window.pickRaisonRefus = async (raison) => {
      stMenuEl.classList.remove('open');
      const id = stTarget;
      if (!id) return;
      await changeStatus(id, 'refuse');
      // Toujours (r)écrire raison_refus, même vide — sinon un refus sans raison (« Passer »)
      // garde silencieusement la raison d'un refus précédent sur ce même devis.
      const full = await SS.getDevis(id);
      if (full) {
        full.raison_refus = raison;
        full.date_modification = new Date().toISOString();
        await SS.saveDevis(full);
      }
      const d = DEVIS.find(x => x.id === id);
      if (d) d.raison_refus = raison;
      render();
    };

    // ── Score de probabilité (petit point coloré, popover identique au menu de statut) ──
    let probaMenuEl = null, probaTarget = null;
    window.toggleProbaMenu = (e, id) => {
      e.stopPropagation();
      if (!probaMenuEl) {
        probaMenuEl = document.createElement('div');
        probaMenuEl.className = 'status-menu';
        document.body.appendChild(probaMenuEl);
        document.addEventListener('click', (ev) => {
          if (probaMenuEl.classList.contains('open') && !probaMenuEl.contains(ev.target) && !ev.target.closest('.proba-dot')) probaMenuEl.classList.remove('open');
        }, true);
        window.addEventListener('scroll', () => probaMenuEl.classList.remove('open'), true);
      }
      probaTarget = id;
      probaMenuEl.innerHTML = Object.entries(PROBABILITE).map(([k, v]) =>
        `<button onclick="pickProba('${k}')"><span class="dot" style="background:${v.color}"></span>${v.label}</button>`).join('');
      const r = e.currentTarget.getBoundingClientRect();
      probaMenuEl.style.left = Math.max(8, Math.min(r.left, window.innerWidth - 195)) + 'px';
      probaMenuEl.style.top = Math.min(r.bottom + 6, window.innerHeight - 320) + 'px';
      probaMenuEl.classList.add('open');
    };
    window.pickProba = async (val) => {
      probaMenuEl.classList.remove('open');
      const id = probaTarget;
      if (!id) return;
      const full = await SS.getDevis(id);
      if (full) { full.probabilite = val; full.date_modification = new Date().toISOString(); await SS.saveDevis(full); }
      const d = DEVIS.find(x => x.id === id);
      if (d) d.probabilite = val;
      render();
    };

    // ── Clic sur une ligne → fiche de visualisation du devis ──
    el('tableHost').addEventListener('click', (e) => {
      const tr = e.target.closest('tr[data-id]');
      if (!tr) return;
      if (e.target.closest('button, select, a, input')) return; // ne pas voler les clics des contrôles
      location.href = 'vue.html?id=' + tr.dataset.id;
    });
    window.del = async (id) => {
      if (!confirm('Supprimer définitivement ce devis ?')) return;
      await SS.deleteDevis(id);
      DEVIS = DEVIS.filter(d => d.id !== id);
      toast('Devis supprimé', 'warn');
      render();
    };
    window.duplicate = async (id) => {
      const full = await SS.getDevis(id);
      if (!full) { toast('Devis introuvable', 'error'); return; }
      const copy = JSON.parse(JSON.stringify(full));
      copy.id = window.SSUI.generateDevisId();
      copy.statut = 'brouillon';
      copy.date_creation = new Date().toISOString().slice(0, 10);
      copy.date_modification = new Date().toISOString();
      if (copy.client) copy.client.nom = (copy.client.nom || '') + ' (copie)';
      await SS.saveDevis(copy);
      toast('Devis dupliqué', 'ok');
      location.href = 'simulateur.html?id=' + copy.id;
    };

    // ── Commentaires internes (fil Nicolas / Yannick) ──
    const CTYPE = {
      note:      { label: 'Note',      cls: 'badge' },
      question:  { label: 'Question',  cls: 'badge-cyan' },
      important: { label: 'Important', cls: 'badge-warn' },
    };
    let cmDevisId = null;

    window.openComments = async (id) => {
      cmDevisId = id;
      setText('cmDevisId', '#' + id);
      el('cmList').innerHTML = '<div class="empty-comments">Chargement…</div>';
      el('modalComments').classList.add('open');
      // priorité à l'identité Cloudflare Access détectée ; sinon dernier auteur mémorisé
      window.SSNav.getIdentity().then((identity) => {
        if (identity.key) { el('cmAuthor').value = identity.key; return; }
        const lastAuthor = localStorage.getItem('ss_comment_author');
        if (lastAuthor) el('cmAuthor').value = lastAuthor;
      });
      await renderComments();
      el('cmText').focus();
    };
    window.closeComments = () => { el('modalComments').classList.remove('open'); cmDevisId = null; };

    async function renderComments() {
      const devis = await SS.getDevis(cmDevisId);
      const comments = (devis && devis.comments) || [];
      if (!comments.length) {
        el('cmList').innerHTML = '<div class="empty-comments">Aucune note pour ce devis.<br>Écris la première ci-dessous — Yannick la verra ici aussi.</div>';
        return;
      }
      el('cmList').innerHTML = comments
        .slice().sort((a, b) => String(a.date).localeCompare(String(b.date)))
        .map(c => {
          const t = CTYPE[c.type] || CTYPE.note;
          const author = (c.author || 'nicolas').toLowerCase();
          const avatarCls = author === 'client' ? 'client' : (author === 'yannick' ? 'yannick' : 'nicolas');
          const avatarTxt = author === 'client' ? 'CL' : (author === 'yannick' ? 'YA' : 'NI');
          return `<div class="comment ${c.type === 'important' ? 'is-important' : ''}">
            <div class="c-avatar ${avatarCls}">${avatarTxt}</div>
            <div class="c-main">
              <div class="c-meta">
                <span class="c-author">${author === 'client' ? 'Client (via espace client)' : author}</span>
                <span class="badge ${t.cls}">${t.label}</span>
                <span class="c-date">${fmtDate(c.date)}</span>
                <button class="c-del" title="Supprimer cette note" aria-label="Supprimer cette note" onclick="removeComment('${c.id}')">${icon('trash', 13)}</button>
              </div>
              <div class="c-text">${esc(c.text)}</div>
            </div>
          </div>`;
        }).join('');
      el('cmList').scrollTop = el('cmList').scrollHeight;
    }

    window.sendComment = async () => {
      const text = el('cmText').value.trim();
      if (!text) { toast('Écris d\'abord ta note.', 'warn'); return; }
      const author = el('cmAuthor').value;
      localStorage.setItem('ss_comment_author', author);
      const res = await SS.addComment(cmDevisId, { author, text, type: el('cmType').value });
      if (res.ok === false) { toast(res.error || 'Erreur', 'error'); return; }
      el('cmText').value = '';
      toast(res.offline ? 'Note enregistrée (hors-ligne)' : 'Note ajoutée', res.offline ? 'warn' : 'ok');
      const d = DEVIS.find(x => x.id === cmDevisId); if (d) d.comments = (d.comments || 0) + 1;
      closeComments(); // la fenêtre se ferme dès l'envoi
      render();
    };

    window.removeComment = async (commentId) => {
      if (!confirm('Supprimer cette note ?')) return;
      await SS.deleteComment(cmDevisId, commentId);
      await renderComments();
      const d = DEVIS.find(x => x.id === cmDevisId); if (d && d.comments > 0) d.comments--;
      render();
    };

    // fermer la modale au clic sur le fond
    el('modalComments').addEventListener('click', (e) => { if (e.target === el('modalComments')) closeComments(); });

    // ── Gadgets : export / import JSON ──
    window.exportJSON = async () => {
      const all = await Promise.all(DEVIS.map(d => SS.getDevis(d.id)));
      const blob = new Blob([JSON.stringify({ export_date: new Date().toISOString(), version: '3.0', total_devis: all.length, data: all.filter(Boolean) }, null, 2)], { type: 'application/json' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'solariscreen_export_' + new Date().toISOString().slice(0, 10) + '.json';
      a.click();
      toast('Export téléchargé', 'ok');
    };
    window.importJSON = (input) => {
      const file = input.files[0]; if (!file) return;
      const reader = new FileReader();
      reader.onload = async (e) => {
        try {
          const json = JSON.parse(e.target.result);
          const list = Array.isArray(json) ? json : (json.data || []);
          let n = 0;
          for (const d of list) { if (d && d.id) { await SS.saveDevis(d); n++; } }
          toast(`${n} devis importé(s)`, 'ok');
          await load();
        } catch (err) { toast('Fichier JSON invalide', 'error'); }
      };
      reader.readAsText(file);
      input.value = '';
    };

    // ── Chargement ──
    async function load() {
      const [raw, facs, clients] = await Promise.all([SS.listDevis(), SS.listFactures(), SS.listClients()]);
      DEVIS = (raw || []).map(normDevis);
      FACTURES = facs || [];
      CLIENT_TAGS = new Map((clients || []).filter(c => (c.tags || []).length).map(c => [c.key, c.tags]));
      render();
    }
    SS.isOnline().then(on => {
      const b = el('apiBadge');
      b.textContent = on ? '● En ligne' : '● Hors-ligne';
      b.className = 'badge ' + (on ? 'badge-ok' : 'badge-warn');
    });
    load();
  </script>
</body>
</html>
