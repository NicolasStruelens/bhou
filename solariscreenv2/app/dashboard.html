<!DOCTYPE html>
<html lang="fr" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SolariScreen — Tableau de bord</title>
  <link rel="icon" type="image/png" href="../assets/img/logo-solariscreen.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600;700&family=Orbitron:wght@600;800&display=swap" rel="stylesheet">
  <script src="../assets/js/theme.js"></script>
  <link rel="stylesheet" href="../assets/css/tokens.css">
  <link rel="stylesheet" href="../assets/css/theme-dark.css">
  <link rel="stylesheet" href="../assets/css/theme-light.css">
  <link rel="stylesheet" href="../assets/css/base.css">
  <style>
    .toolbar { display: flex; gap: var(--sp-3); align-items: center; flex-wrap: wrap; margin-bottom: var(--sp-4); }
    .toolbar .search { flex: 1; min-width: 220px; position: relative; }
    .toolbar .search input { padding-left: 2.2rem; }
    .toolbar .search svg { position: absolute; left: 0.7rem; top: 50%; transform: translateY(-50%); width: 14px; height: 14px; color: var(--text-subtle); pointer-events: none; }
    .filters { display: flex; gap: 0.35rem; flex-wrap: wrap; }
    .chip { font-family: var(--font-mono); font-size: var(--fs-2xs); font-weight: 600; padding: 0.4rem 0.7rem; border-radius: var(--r-sm); border: 1px solid var(--border); background: var(--surface-2); color: var(--text-muted); cursor: pointer; transition: all var(--t-fast); white-space: nowrap; }
    .chip:hover { border-color: var(--accent); color: var(--accent); }
    .chip.active { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
    .chip-archive { margin-left: var(--sp-3); border-color: var(--accent-2); color: var(--accent-2); background: color-mix(in srgb, var(--accent-2) 14%, transparent); font-weight: 700; }
    .chip-archive:hover { border-color: var(--accent-2); color: var(--accent-2); box-shadow: var(--glow-soft); }
    .chip-archive.active { background: var(--accent-2); color: var(--bg); border-color: var(--accent-2); }

    /* Accès Mode Terrain mis en avant (couleur signature or) — usage tactile fréquent depuis le téléphone */
    .btn-terrain { border-color: var(--accent-2); color: var(--accent-2); background: color-mix(in srgb, var(--accent-2) 10%, transparent); font-weight: 700; }
    .btn-terrain:hover { background: color-mix(in srgb, var(--accent-2) 18%, transparent); box-shadow: var(--glow-soft); color: var(--accent-2); }
    @media (max-width: 640px) { .btn-terrain { padding: 0.55rem 0.9rem; font-size: var(--fs-sm); } }

    /* ── Pastilles de statut colorées (menu custom) ── */
    table.data tbody tr { cursor: pointer; }
    .price { font-family: var(--font-mono); font-weight: 700; font-size: var(--fs-sm); color: var(--accent-2); letter-spacing: 0.01em; }
    .row-pay { display: inline-flex; align-items: center; gap: var(--sp-2); white-space: nowrap; }
    .status-pill {
      display: inline-flex; align-items: center; gap: 0.45rem;
      font-family: var(--font-mono); font-size: var(--fs-2xs); font-weight: 600;
      letter-spacing: 0.03em; text-transform: uppercase;
      padding: 0.32rem 0.6rem; border-radius: var(--r-sm); cursor: pointer; transition: all var(--t-fast);
      border: 1px solid color-mix(in srgb, var(--st, var(--border-strong)) 45%, transparent);
      color: var(--st, var(--text-muted));
      background: color-mix(in srgb, var(--st, var(--border-strong)) 10%, transparent);
      white-space: nowrap;
    }
    .status-pill .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--st, var(--text-muted)); box-shadow: 0 0 6px color-mix(in srgb, var(--st, transparent) 60%, transparent); }
    .status-pill svg { opacity: 0.55; }
    .status-pill:hover { box-shadow: var(--glow-soft); }
    .status-menu {
      position: fixed; z-index: 5000; display: none; min-width: 175px; padding: 4px;
      background: var(--surface); border: 1px solid var(--border-strong); border-radius: var(--r-md); box-shadow: var(--shadow);
    }
    .status-menu.open { display: block; }
    .status-menu button {
      display: flex; align-items: center; gap: 0.55rem; width: 100%; text-align: left;
      background: none; border: none; border-radius: var(--r-sm); padding: 0.45rem 0.6rem;
      font-family: var(--font-mono); font-size: var(--fs-2xs); font-weight: 600; text-transform: uppercase; letter-spacing: 0.03em;
      color: var(--text-muted); cursor: pointer;
    }
    .status-menu button:hover { background: var(--surface-2); color: var(--text); }
    .status-menu .dot { width: 7px; height: 7px; border-radius: 50%; flex: none; }

    td .actions { display: flex; gap: 0.3rem; justify-content: flex-end; }
    .icon-btn { width: 30px; height: 30px; display: grid; place-items: center; border: 1px solid var(--border); border-radius: var(--r-sm); background: var(--surface-2); color: var(--text-muted); cursor: pointer; font-size: 0.85rem; transition: all var(--t-fast); }
    .icon-btn:hover { border-color: var(--accent); color: var(--accent); }
    .icon-btn.danger:hover { border-color: var(--danger); color: var(--danger); }

    .empty { text-align: center; padding: var(--sp-7) var(--sp-5); color: var(--text-muted); }
    .empty .big { display: flex; justify-content: center; margin-bottom: var(--sp-3); color: var(--text-subtle); }

    .header-date {
      /* flex:1 = occupe l'espace restant entre le brand et les actions et centre son
         contenu DANS cet espace (un centrage absolu sur toute la largeur du header se
         faisait chevaucher par le groupe d'actions dès qu'il devenait plus large). */
      flex: 1; min-width: 0; overflow: hidden;
      display: flex; align-items: center; justify-content: center; gap: 0.45rem;
      font-family: var(--font-mono); font-size: var(--fs-2xs); color: var(--text-subtle);
      text-transform: uppercase; letter-spacing: 0.09em; white-space: nowrap; pointer-events: none;
    }
    .header-date svg { color: var(--accent-2); opacity: 0.85; }
    @media (max-width: 900px) { .header-date { display: none; } }

    .client-cell { display: flex; flex-direction: column; }
    .client-cell .name { font-weight: 600; color: var(--text); }
    .client-cell .id { font-family: var(--font-mono); font-size: var(--fs-2xs); color: var(--text-subtle); }
    .count-pill { font-size: var(--fs-2xs); color: var(--text-muted); font-family: var(--font-mono); }

    /* ── Modale commentaires internes ── */
    .modal-bg { position: fixed; inset: 0; background: rgba(0,0,0,0.55); z-index: 1000; display: none; align-items: center; justify-content: center; padding: var(--sp-4); }
    .modal-bg.open { display: flex; }
    .modal { background: var(--surface); border: 1px solid var(--border-strong); border-radius: var(--r-md); box-shadow: var(--shadow); width: 560px; max-width: 100%; max-height: 88vh; display: flex; flex-direction: column; --tick-color: var(--accent-2); }
    .modal .mhead { font-family: var(--font-display); font-size: var(--fs-md); padding: var(--sp-4) var(--sp-5); border-bottom: 1px solid var(--border); color: var(--accent); display: flex; align-items: center; gap: var(--sp-2); }
    .modal .mhead .mid { font-family: var(--font-mono); font-size: var(--fs-2xs); color: var(--text-subtle); margin-left: auto; }
    .modal .mbody { padding: var(--sp-4) var(--sp-5); overflow-y: auto; flex: 1; min-height: 120px; }
    .modal .mfoot { padding: var(--sp-4) var(--sp-5); border-top: 1px solid var(--border); }

    .comment { display: flex; gap: var(--sp-3); padding: var(--sp-3) 0; border-bottom: 1px dashed var(--border); }
    .comment:last-child { border-bottom: none; }
    .comment .c-avatar { width: 32px; height: 32px; flex: none; border-radius: var(--r-round); display: grid; place-items: center; font-weight: 700; font-size: var(--fs-2xs); }
    .comment .c-avatar.nicolas { background: color-mix(in srgb, var(--accent) 18%, transparent); color: var(--accent); border: 1px solid color-mix(in srgb, var(--accent) 35%, transparent); }
    .comment .c-avatar.yannick { background: color-mix(in srgb, var(--accent-2) 18%, transparent); color: var(--accent-2); border: 1px solid color-mix(in srgb, var(--accent-2) 40%, transparent); }
    .comment .c-main { flex: 1; min-width: 0; }
    .comment .c-meta { display: flex; align-items: center; gap: var(--sp-2); flex-wrap: wrap; }
    .comment .c-author { font-weight: 700; font-size: var(--fs-xs); text-transform: capitalize; }
    .comment .c-date { font-family: var(--font-mono); font-size: var(--fs-2xs); color: var(--text-subtle); }
    .comment .c-text { font-size: var(--fs-sm); color: var(--text); margin-top: 0.25rem; white-space: pre-wrap; word-break: break-word; }
    .comment.is-important { border-left: 2px solid var(--warn); padding-left: var(--sp-3); }
    .comment .c-del { margin-left: auto; background: none; border: none; color: var(--text-subtle); cursor: pointer; padding: 2px; }
    .comment .c-del:hover { color: var(--danger); }
    .empty-comments { text-align: center; color: var(--text-muted); padding: var(--sp-5); font-size: var(--fs-sm); }

    .comment-form { display: grid; grid-template-columns: 1fr 1fr; gap: var(--sp-2); }
    .comment-form textarea { grid-column: 1 / -1; min-height: 64px; }
    .comment-form .send-row { grid-column: 1 / -1; display: flex; justify-content: flex-end; gap: var(--sp-2); }
  </style>
</head>
<body>
  <div class="fx-grid"></div>

  <header class="app-header">
    <div class="brand">
      <span class="brand-logo"><img src="../assets/img/logo-solariscreen.png" alt="" onerror="this.style.display='none'"></span>
      <div>
        <h1><a href="dashboard.html">SOLARISCREEN</a></h1>
        <div class="module">Tableau de bord</div>
      </div>
    </div>
    <div class="header-date" id="headerDate">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
      <span id="headerDateText">—</span>
    </div>
    <div class="header-actions">
      <span class="badge" id="apiBadge" title="État de la connexion">…</span>
      <a class="btn btn-ghost btn-sm" href="clients.html"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg> Clients</a>
      <a class="btn btn-ghost btn-sm" href="factures.html"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg> Factures</a>
      <a class="btn btn-ghost btn-sm" href="portfolio.html"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg> Portfolio</a>
      <a class="btn btn-ghost btn-sm" href="stats.html"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="4" y1="21" x2="4" y2="14"/><line x1="4" y1="10" x2="4" y2="3"/><line x1="12" y1="21" x2="12" y2="12"/><line x1="12" y1="8" x2="12" y2="3"/><line x1="20" y1="21" x2="20" y2="16"/><line x1="20" y1="12" x2="20" y2="3"/><line x1="1" y1="14" x2="7" y2="14"/><line x1="9" y1="8" x2="15" y2="8"/><line x1="17" y1="16" x2="23" y2="16"/></svg> Stats</a>
      <a class="btn btn-sm btn-terrain" href="terrain.html" title="Mode Terrain (iPhone)"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="7" y="2" width="10" height="20" rx="2"/><line x1="11" y1="18" x2="13" y2="18"/></svg> Terrain</a>
      <span id="quickNav"></span>
      <span id="themeToggle"></span>
      <a class="btn btn-primary btn-sm" href="simulateur.html"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg> Nouveau devis</a>
    </div>
  </header>

  <main class="container">
    <!-- KPIs -->
    <div class="kpis" id="kpis"></div>

    <!-- Toolbar -->
    <div class="toolbar">
      <div class="search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <label for="search" class="sr-only">Rechercher un devis</label>
        <input class="input" id="search" placeholder="Rechercher un client, un n° de devis…" oninput="render()">
      </div>
      <select class="select" id="sort" style="max-width:200px;" onchange="render()" aria-label="Trier les devis">
        <option value="modif">Tri : récents d'abord</option>
        <option value="montant">Tri : montant ↓</option>
        <option value="nom">Tri : nom A→Z</option>
      </select>
      <button class="btn btn-ghost btn-sm" onclick="exportJSON()" title="Sauvegarde"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg> Export</button>
      <button class="btn btn-ghost btn-sm" onclick="document.getElementById('importFile').click()" title="Restaurer"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg> Import</button>
      <input type="file" id="importFile" accept="application/json" hidden onchange="importJSON(this)">
    </div>
    <div class="filters" id="filters"></div>

    <!-- Table -->
    <section class="section" style="margin-top: var(--sp-4);">
      <div class="section-head">
        <span class="section-title">Devis</span>
        <span class="section-code">SS // DASH</span>
        <span class="section-sub" id="resultCount">—</span>
      </div>
      <div id="tableHost"></div>
    </section>
  </main>

  <!-- Modale commentaires internes -->
  <div class="modal-bg" id="modalComments">
    <div class="modal ticked">
      <div class="mhead">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
        Notes internes
        <span class="mid" id="cmDevisId">—</span>
        <button class="btn btn-ghost btn-sm" onclick="closeComments()" aria-label="Fermer" style="margin-left:var(--sp-2);">✕</button>
      </div>
      <div class="mbody" id="cmList"><div class="empty-comments">Chargement…</div></div>
      <div class="mfoot">
        <div class="comment-form">
          <div class="field">
            <label class="label" for="cmAuthor">Auteur</label>
            <select class="select" id="cmAuthor">
              <option value="nicolas">Nicolas</option>
              <option value="yannick">Yannick</option>
            </select>
          </div>
          <div class="field">
            <label class="label" for="cmType">Type</label>
            <select class="select" id="cmType">
              <option value="note">Note</option>
              <option value="question">Question</option>
              <option value="important">Important</option>
            </select>
          </div>
          <textarea class="textarea" id="cmText" placeholder="Info chantier, question pour l'autre, rappel…"></textarea>
          <div class="send-row">
            <button class="btn btn-primary btn-sm" onclick="sendComment()">
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
              Ajouter la note
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="../assets/js/ui.js"></script>
  <script src="../assets/js/nav.js"></script>
  <script src="../assets/js/api.js"></script>
  <script>
    const SS = window.SS;
    const { mountThemeToggle } = window.SSTheme;
    const { fmtEur, fmtDate, el, setText, toast, normDevis, icon } = window.SSUI;

    mountThemeToggle(document.getElementById('themeToggle'));
    window.SSNav.mount(document.getElementById('quickNav'));

    // Date du jour, au centre du header
    setText('headerDateText', new Date().toLocaleDateString('fr-BE', { weekday: 'long', day: '2-digit', month: 'long', year: 'numeric' }));

    const STATUSES = {
      brouillon:     { label: 'Brouillon',  color: 'var(--text-subtle)' },
      envoye_client: { label: 'Envoyé',     color: 'var(--accent)' },
      relance_1:     { label: 'Relance 1',  color: 'var(--warn)' },
      relance_2:     { label: 'Relance 2',  color: 'var(--warn)' },
      signe:         { label: 'Signé',      color: 'var(--ok)' },
      termine:       { label: 'Terminé',    color: 'var(--accent-2)' },
      refuse:        { label: 'Refusé',     color: 'var(--danger)' },
      annule:        { label: 'Annulé',     color: 'var(--text-subtle)' },
    };

    let DEVIS = [], FACTURES = [];
    let activeFilter = 'tous';

    // ── Paiement (acompte/solde) — lu depuis les factures liées au devis ──
    const paidSum = f => (f.paiements || []).reduce((s, p) => s + (Number(p.montant) || 0), 0);
    function paymentInfo(d) {
      const facs = FACTURES.filter(f => f.devis_id === d.id);
      if (!facs.length) return '';
      const totalFact = facs.reduce((s, f) => s + (f.total_ttc || 0), 0);
      const totalPaid = facs.reduce((s, f) => s + paidSum(f), 0);
      const today = new Date().toISOString().slice(0, 10);
      const overdue = facs.some(f => paidSum(f) < (f.total_ttc || 0) - 0.005 && f.echeance && f.echeance < today);
      if (totalPaid > 0 && totalPaid >= d.ttc - 0.005) return `<span class="badge badge-ok" title="Encaissé : ${fmtEur(totalPaid)}">${icon('coin', 10)} Soldé</span>`;
      if (overdue) return `<span class="badge badge-danger" title="Facturé ${fmtEur(totalFact)}, payé ${fmtEur(totalPaid)}">${icon('warning', 10)} Retard paiement</span>`;
      if (totalPaid > 0) return `<span class="badge badge-warn" title="Payé ${fmtEur(totalPaid)} sur ${fmtEur(totalFact)} facturé">${icon('coin', 10)} Acompte payé</span>`;
      return `<span class="badge" title="Facturé ${fmtEur(totalFact)}, en attente de paiement">${icon('coin', 10)} À encaisser</span>`;
    }

    // ── Archivage (masquer proprement les devis refusés, réversible) ──
    window.archiveDevis = async (id, val) => {
      const full = await SS.getDevis(id);
      if (!full) { toast('Devis introuvable', 'error'); return; }
      full.archive = val;
      full.date_modification = new Date().toISOString();
      await SS.saveDevis(full);
      const d = DEVIS.find(x => x.id === id); if (d) d.archive = val;
      toast(val ? 'Devis archivé' : 'Devis désarchivé', 'ok');
      render();
    };

    function renderFilters() {
      const visible = DEVIS.filter(d => !d.archive);
      const counts = { tous: visible.length };
      visible.forEach(d => { counts[d.statut] = (counts[d.statut] || 0) + 1; });
      const archivedCount = DEVIS.filter(d => d.archive).length;
      const chips = [['tous', 'Tous']].concat(Object.entries(STATUSES).map(([k, v]) => [k, v.label]));
      el('filters').innerHTML = chips
        .filter(([k]) => k === 'tous' || counts[k])
        .map(([k, label]) => `<button class="chip ${activeFilter === k ? 'active' : ''}" onclick="setFilter('${k}')">${label} <span style="opacity:.6">${counts[k] || 0}</span></button>`)
        .join('')
        + (archivedCount ? `<button class="chip chip-archive ${activeFilter === 'archives' ? 'active' : ''}" onclick="setFilter('archives')">Archivés <span style="opacity:.6">${archivedCount}</span></button>` : '');
    }
    window.setFilter = (k) => { activeFilter = k; render(); };

    function renderKPIs() {
      const total = DEVIS.length;
      const signes = DEVIS.filter(d => ['signe', 'termine'].includes(d.statut));
      const envoyes = DEVIS.filter(d => ['envoye_client', 'relance_1', 'relance_2'].includes(d.statut));
      const caSigne = signes.reduce((s, d) => s + d.ttc, 0);
      // CA réellement encaissé = somme des paiements reçus sur toutes les factures (pas le total théorique des devis)
      const caEncaisse = FACTURES.reduce((s, f) => s + paidSum(f), 0);
      const totalFacture = FACTURES.reduce((s, f) => s + (f.total_ttc || 0), 0);
      // Bénéfices cumulés par vendeur, sur les devis réellement signés/terminés
      const nicolasNet = signes.reduce((s, d) => s + (d.nicolas_net || 0), 0);
      const yannickNet = signes.reduce((s, d) => s + (d.yannick_net || 0), 0);
      el('kpis').innerHTML = `
        <div class="kpi accent"><div class="kpi-label">Devis</div><div class="kpi-value">${total}</div><div class="kpi-sub">${envoyes.length} en attente client</div></div>
        <div class="kpi gold"><div class="kpi-label">Encaissé</div><div class="kpi-value">${fmtEur(caEncaisse)}</div><div class="kpi-sub">déjà payé par les clients${totalFacture ? ' · ' + fmtEur(totalFacture) + ' facturé' : ''}</div></div>
        <div class="kpi ok"><div class="kpi-label">Signés / terminés</div><div class="kpi-value">${signes.length}</div><div class="kpi-sub">${fmtEur(caSigne)} signés</div></div>
        <div class="kpi accent"><div class="kpi-label">Bénéfice Nicolas</div><div class="kpi-value">${fmtEur(nicolasNet)}</div><div class="kpi-sub">devis signés/terminés</div></div>
        <div class="kpi gold"><div class="kpi-label">Bénéfice Yannick</div><div class="kpi-value">${fmtEur(yannickNet)}</div><div class="kpi-sub">devis signés/terminés</div></div>`;
    }

    function render() {
      renderKPIs();
      renderFilters();
      const q = el('search').value.trim().toLowerCase();
      const sort = el('sort').value;
      let rows = activeFilter === 'archives' ? DEVIS.filter(d => d.archive) : DEVIS.filter(d => !d.archive);
      if (activeFilter !== 'tous' && activeFilter !== 'archives') rows = rows.filter(d => d.statut === activeFilter);
      if (q) rows = rows.filter(d => (`${d.prenom} ${d.nom} ${d.id}`).toLowerCase().includes(q));
      rows.sort((a, b) => {
        if (sort === 'montant') return b.ttc - a.ttc;
        if (sort === 'nom') return (a.nom || '').localeCompare(b.nom || '');
        return (b.date_modification || '').localeCompare(a.date_modification || '');
      });

      setText('resultCount', `${rows.length} devis`);

      if (rows.length === 0) {
        const msg = activeFilter === 'archives' ? 'Aucun devis archivé.' : (DEVIS.length === 0 ? "Aucun devis pour l'instant.<br>Clique sur <strong>+ Nouveau devis</strong> pour commencer." : "Aucun devis ne correspond à ta recherche.");
        el('tableHost').innerHTML = `<div class="empty"><div class="big">${icon('window', 40)}</div>${msg}</div>`;
        return;
      }

      const pill = (d) => {
        const s = STATUSES[d.statut] || STATUSES.brouillon;
        return `<button class="status-pill" style="--st:${s.color}" onclick="openStatusMenu(event,'${d.id}')" aria-label="Changer le statut du devis ${d.id}"><span class="dot"></span>${s.label} ${icon('chevrondown', 10)}</button>`;
      };
      el('tableHost').innerHTML = `
        <div class="table-wrap" style="border:none;border-radius:0;">
          <table class="data">
            <thead><tr>
              <th>Client</th><th>Statut</th><th>Modifié</th>
              <th class="num">Montant TVAC</th><th>Médias</th><th style="text-align:right;">Actions</th>
            </tr></thead>
            <tbody>
              ${rows.map(d => `
                <tr data-id="${d.id}" title="Ouvrir la fiche du devis">
                  <td><div class="client-cell"><span class="name">${esc(d.prenom)} ${esc(d.nom) || '—'}${d.informatif ? ' <span class=\"badge badge-cyan\" title=\"Estimation non contractuelle\">Informatif</span>' : ''}${d.portfolio ? ` <span class="badge badge-gold" title="Dans le portfolio de réalisations">${icon('star', 10)}</span>` : ''}</span><span class="id">#${d.id}</span></div></td>
                  <td>${pill(d)}</td>
                  <td class="text-muted">${fmtDate(d.date_modification)}</td>
                  <td class="num"><span class="row-pay"><span class="price">${fmtEur(d.ttc)}</span>${paymentInfo(d)}</span></td>
                  <td class="count-pill">
                    ${d.photos ? `<span class="row" style="display:inline-flex;gap:3px;">${icon('camera', 12)}${d.photos}</span>` : ''}
                    ${d.comments ? `<span class="row" style="display:inline-flex;gap:3px;margin-left:6px;">${icon('message', 12)}${d.comments}</span>` : ''}
                  </td>
                  <td><div class="actions">
                    <button class="icon-btn" title="Notes internes" aria-label="Notes internes du devis ${d.id}" onclick="openComments('${d.id}')" style="${d.comments ? 'color:var(--accent-2);border-color:color-mix(in srgb, var(--accent-2) 45%, transparent);' : ''}">${icon('message', 15)}</button>
                    <button class="icon-btn" title="Éditer" aria-label="Éditer le devis ${d.id}" onclick="location.href='simulateur.html?id=${d.id}'">${icon('edit', 15)}</button>
                    <button class="icon-btn" title="Dupliquer" aria-label="Dupliquer le devis ${d.id}" onclick="duplicate('${d.id}')">${icon('copy', 15)}</button>
                    <button class="icon-btn" title="Devis / PDF" aria-label="Voir le devis ${d.id} en PDF" onclick="location.href='devis.html?id=${d.id}'">${icon('filetext', 15)}</button>
                    ${['signe', 'termine'].includes(d.statut) ? `<button class="icon-btn" title="Liste de pose" aria-label="Liste de pose du devis ${d.id}" onclick="location.href='picking.html?id=${d.id}'">${icon('list', 15)}</button>` : ''}
                    ${d.statut === 'refuse' && !d.archive ? `<button class="icon-btn" title="Archiver" aria-label="Archiver le devis ${d.id}" onclick="archiveDevis('${d.id}', true)">${icon('download', 15)}</button>` : ''}
                    ${d.archive ? `<button class="icon-btn" title="Désarchiver" aria-label="Désarchiver le devis ${d.id}" onclick="archiveDevis('${d.id}', false)">${icon('upload', 15)}</button>` : ''}
                    <button class="icon-btn danger" title="Supprimer" aria-label="Supprimer le devis ${d.id}" onclick="del('${d.id}')">${icon('trash', 15)}</button>
                  </div></td>
                </tr>`).join('')}
            </tbody>
          </table>
        </div>`;
    }

    function esc(s) { return String(s || '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }

    // ── Actions ──
    window.changeStatus = async (id, statut) => {
      await SS.updateStatus(id, statut);
      const d = DEVIS.find(x => x.id === id); if (d) d.statut = statut;
      toast('Statut mis à jour', 'ok');
      render();
    };

    // ── Menu de statut (pastilles colorées) ──
    let stMenuEl = null, stTarget = null;
    function ensureStatusMenu() {
      if (stMenuEl) return;
      stMenuEl = document.createElement('div');
      stMenuEl.className = 'status-menu';
      document.body.appendChild(stMenuEl);
      document.addEventListener('click', (e) => {
        if (stMenuEl.classList.contains('open') && !stMenuEl.contains(e.target) && !e.target.closest('.status-pill')) stMenuEl.classList.remove('open');
      }, true);
      window.addEventListener('scroll', () => stMenuEl.classList.remove('open'), true);
      document.addEventListener('keydown', (e) => { if (e.key === 'Escape') stMenuEl.classList.remove('open'); });
    }
    window.openStatusMenu = (e, id) => {
      e.stopPropagation();
      ensureStatusMenu();
      stTarget = id;
      stMenuEl.innerHTML = Object.entries(STATUSES).map(([k, v]) =>
        `<button onclick="pickStatus('${k}')"><span class="dot" style="background:${v.color}"></span>${v.label}</button>`).join('');
      const r = e.currentTarget.getBoundingClientRect();
      stMenuEl.style.left = Math.max(8, Math.min(r.left, window.innerWidth - 195)) + 'px';
      stMenuEl.style.top = Math.min(r.bottom + 6, window.innerHeight - 320) + 'px';
      stMenuEl.classList.add('open');
    };
    window.pickStatus = async (st) => {
      stMenuEl.classList.remove('open');
      if (stTarget) await changeStatus(stTarget, st);
    };

    // ── Clic sur une ligne → fiche de visualisation du devis ──
    el('tableHost').addEventListener('click', (e) => {
      const tr = e.target.closest('tr[data-id]');
      if (!tr) return;
      if (e.target.closest('button, select, a, input')) return; // ne pas voler les clics des contrôles
      location.href = 'vue.html?id=' + tr.dataset.id;
    });
    window.del = async (id) => {
      if (!confirm('Supprimer définitivement ce devis ?')) return;
      await SS.deleteDevis(id);
      DEVIS = DEVIS.filter(d => d.id !== id);
      toast('Devis supprimé', 'warn');
      render();
    };
    window.duplicate = async (id) => {
      const full = await SS.getDevis(id);
      if (!full) { toast('Devis introuvable', 'error'); return; }
      const copy = JSON.parse(JSON.stringify(full));
      copy.id = window.SSUI.generateDevisId();
      copy.statut = 'brouillon';
      copy.date_creation = new Date().toISOString().slice(0, 10);
      copy.date_modification = new Date().toISOString();
      if (copy.client) copy.client.nom = (copy.client.nom || '') + ' (copie)';
      await SS.saveDevis(copy);
      toast('Devis dupliqué', 'ok');
      location.href = 'simulateur.html?id=' + copy.id;
    };

    // ── Commentaires internes (fil Nicolas / Yannick) ──
    const CTYPE = {
      note:      { label: 'Note',      cls: 'badge' },
      question:  { label: 'Question',  cls: 'badge-cyan' },
      important: { label: 'Important', cls: 'badge-warn' },
    };
    let cmDevisId = null;

    window.openComments = async (id) => {
      cmDevisId = id;
      setText('cmDevisId', '#' + id);
      el('cmList').innerHTML = '<div class="empty-comments">Chargement…</div>';
      el('modalComments').classList.add('open');
      // mémorise le dernier auteur choisi (pratique : chacun garde son identité)
      const lastAuthor = localStorage.getItem('ss_comment_author');
      if (lastAuthor) el('cmAuthor').value = lastAuthor;
      await renderComments();
      el('cmText').focus();
    };
    window.closeComments = () => { el('modalComments').classList.remove('open'); cmDevisId = null; };

    async function renderComments() {
      const devis = await SS.getDevis(cmDevisId);
      const comments = (devis && devis.comments) || [];
      if (!comments.length) {
        el('cmList').innerHTML = '<div class="empty-comments">Aucune note pour ce devis.<br>Écris la première ci-dessous — Yannick la verra ici aussi.</div>';
        return;
      }
      el('cmList').innerHTML = comments
        .slice().sort((a, b) => String(a.date).localeCompare(String(b.date)))
        .map(c => {
          const t = CTYPE[c.type] || CTYPE.note;
          const author = (c.author || 'nicolas').toLowerCase();
          return `<div class="comment ${c.type === 'important' ? 'is-important' : ''}">
            <div class="c-avatar ${author === 'yannick' ? 'yannick' : 'nicolas'}">${author === 'yannick' ? 'YA' : 'NI'}</div>
            <div class="c-main">
              <div class="c-meta">
                <span class="c-author">${author}</span>
                <span class="badge ${t.cls}">${t.label}</span>
                <span class="c-date">${fmtDate(c.date)}</span>
                <button class="c-del" title="Supprimer cette note" aria-label="Supprimer cette note" onclick="removeComment('${c.id}')">${icon('trash', 13)}</button>
              </div>
              <div class="c-text">${esc(c.text)}</div>
            </div>
          </div>`;
        }).join('');
      el('cmList').scrollTop = el('cmList').scrollHeight;
    }

    window.sendComment = async () => {
      const text = el('cmText').value.trim();
      if (!text) { toast('Écris d\'abord ta note.', 'warn'); return; }
      const author = el('cmAuthor').value;
      localStorage.setItem('ss_comment_author', author);
      const res = await SS.addComment(cmDevisId, { author, text, type: el('cmType').value });
      if (res.ok === false) { toast(res.error || 'Erreur', 'error'); return; }
      el('cmText').value = '';
      toast(res.offline ? 'Note enregistrée (hors-ligne)' : 'Note ajoutée', res.offline ? 'warn' : 'ok');
      const d = DEVIS.find(x => x.id === cmDevisId); if (d) d.comments = (d.comments || 0) + 1;
      closeComments(); // la fenêtre se ferme dès l'envoi
      render();
    };

    window.removeComment = async (commentId) => {
      if (!confirm('Supprimer cette note ?')) return;
      await SS.deleteComment(cmDevisId, commentId);
      await renderComments();
      const d = DEVIS.find(x => x.id === cmDevisId); if (d && d.comments > 0) d.comments--;
      render();
    };

    // fermer la modale au clic sur le fond
    el('modalComments').addEventListener('click', (e) => { if (e.target === el('modalComments')) closeComments(); });

    // ── Gadgets : export / import JSON ──
    window.exportJSON = async () => {
      const all = await Promise.all(DEVIS.map(d => SS.getDevis(d.id)));
      const blob = new Blob([JSON.stringify({ export_date: new Date().toISOString(), version: '3.0', total_devis: all.length, data: all.filter(Boolean) }, null, 2)], { type: 'application/json' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'solariscreen_export_' + new Date().toISOString().slice(0, 10) + '.json';
      a.click();
      toast('Export téléchargé', 'ok');
    };
    window.importJSON = (input) => {
      const file = input.files[0]; if (!file) return;
      const reader = new FileReader();
      reader.onload = async (e) => {
        try {
          const json = JSON.parse(e.target.result);
          const list = Array.isArray(json) ? json : (json.data || []);
          let n = 0;
          for (const d of list) { if (d && d.id) { await SS.saveDevis(d); n++; } }
          toast(`${n} devis importé(s)`, 'ok');
          await load();
        } catch (err) { toast('Fichier JSON invalide', 'error'); }
      };
      reader.readAsText(file);
      input.value = '';
    };

    // ── Chargement ──
    async function load() {
      const [raw, facs] = await Promise.all([SS.listDevis(), SS.listFactures()]);
      DEVIS = (raw || []).map(normDevis);
      FACTURES = facs || [];
      render();
    }
    SS.isOnline().then(on => {
      const b = el('apiBadge');
      b.textContent = on ? '● En ligne' : '● Hors-ligne';
      b.className = 'badge ' + (on ? 'badge-ok' : 'badge-warn');
    });
    load();
  </script>
</body>
</html>
