      if (enRetard.length) chips.push({ label: `${enRetard.length} paiement${enRetard.length > 1 ? 's' : ''} en retard`, color: 'var(--danger)', filter: 'en_retard', ic: 'warning' });
      if (acompteAttente.length) chips.push({ label: `${acompteAttente.length} acompte${acompteAttente.length > 1 ? 's' : ''} non payé${acompteAttente.length > 1 ? 's' : ''}`, color: 'var(--warn)', filter: 'acompte_attente', ic: 'coin' });
      if (soldeAttente.length) chips.push({ label: `${soldeAttente.length} solde${soldeAttente.length > 1 ? 's' : ''} à encaisser`, color: 'var(--accent-2)', filter: 'solde_attente', ic: 'coin' });
      if (aPreparer.length) chips.push({ label: `${aPreparer.length} chantier${aPreparer.length > 1 ? 's' : ''} à préparer`, color: 'var(--accent-2)', filter: 'a_preparer', ic: 'calendar' });
      if (expires.length) chips.push({ label: `${expires.length} devis expiré${expires.length > 1 ? 's' : ''}`, color: 'var(--danger)', filter: 'expire', ic: 'warning' });
      // Lien envoyé mais jamais ouvert (#26) : on ne le signale qu'après 3 jours (avant, c'est normal).
      const jamaisOuvert = visible.filter(d => isLinkNeverOpened(d) && daysInCurrentStatus(d) >= 3);
      if (jamaisOuvert.length) chips.push({ label: `${jamaisOuvert.length} lien${jamaisOuvert.length > 1 ? 's' : ''} jamais ouvert${jamaisOuvert.length > 1 ? 's' : ''} — le client l'a-t-il reçu ?`, color: 'var(--text-subtle)', filter: 'lien_jamais_ouvert', ic: 'lock' });
      if (!chips.length) { box.classList.add('hidden'); return; }
      box.classList.remove('hidden');
      box.innerHTML = `
        <span class="tb-label">${icon('sliders', 13)} Aujourd'hui</span>
        ${chips.map(c => `<button class="tb-chip" style="--tbc:${c.color}" onclick="${c.href ? `location.href='${c.href}'` : `setFilter('${c.filter}')`}">${icon(c.ic, 12)} ${c.label}</button>`).join('')}
      `;
    }

    // ── Filtres avancés (montant, date de création, chantier planifié) ──
    window.toggleAdvFilters = () => {
      el('advPanel').classList.toggle('hidden');
      const ouvert = !el('advPanel').classList.contains('hidden');
      el('advToggle').classList.toggle('active', ouvert);
      // Sur téléphone, les rangées vendeur/produit sont repliées avec ce panneau (voir la
      // media query 560 px) : le même geste ouvre tous les filtres secondaires.
      document.body.classList.toggle('adv-open', ouvert);
    };
    window.resetAdvFilters = () => {
      el('advMontantMin').value = ''; el('advMontantMax').value = '';
      el('advDateFrom').value = ''; el('advDateTo').value = '';
      el('advChantier').value = 'tous';
      render();
    };
    function applyAdvFilters(rows) {
      const min = parseFloat(el('advMontantMin').value);
      const max = parseFloat(el('advMontantMax').value);
      const from = el('advDateFrom').value;
      const to = el('advDateTo').value;
      const chantier = el('advChantier').value;
      let n = 0;
      if (!isNaN(min)) { rows = rows.filter(d => d.ttc >= min); n++; }
      if (!isNaN(max)) { rows = rows.filter(d => d.ttc <= max); n++; }
      if (from) { rows = rows.filter(d => (d.date_creation || '').slice(0, 10) >= from); n++; }
      if (to) { rows = rows.filter(d => (d.date_creation || '').slice(0, 10) <= to); n++; }
      if (chantier === 'planifie') { rows = rows.filter(d => d.chantier && d.chantier.date_pose); n++; }
      else if (chantier === 'non_planifie') { rows = rows.filter(d => ['signe', 'termine'].includes(d.statut) && !(d.chantier && d.chantier.date_pose)); n++; }
      el('advCount').textContent = n ? `(${n})` : '';
      return rows;
    }

    function renderKPIs() {
      // Les KPIs de devis EXCLUENT les archivés (comme la page Stats) → un seul et même CA affiché partout.
      const active = DEVIS.filter(d => !d.archive);
      const total = active.length;
      const signes = active.filter(d => ['signe', 'termine'].includes(d.statut));
      const envoyes = active.filter(d => ['envoye_client', 'relance_1', 'relance_2'].includes(d.statut));
      const caSigne = signes.reduce((s, d) => s + d.ttc, 0);
      // CA réellement encaissé = somme des paiements reçus sur toutes les factures (pas le total théorique des devis)
      const caEncaisse = FACTURES.reduce((s, f) => s + paidSum(f), 0);
      const totalFacture = FACTURES.reduce((s, f) => s + (Number(f.total_ttc) || 0), 0);
      // Bénéfices cumulés par vendeur, sur les devis réellement signés/terminés
      const nicolasNet = signes.reduce((s, d) => s + (d.nicolas_net || 0), 0);
      const yannickNet = signes.reduce((s, d) => s + (d.yannick_net || 0), 0);
      // Sparkline « encaissé sur 6 mois » sous le KPI or : la tendance en un regard.
      // Série depuis les paiements réels des factures — '' si tout est à zéro (pas de fausse courbe).
      const sparkEncaisse = (() => {
        if (!window.SSUI.sparkline) return '';
        const keys = [];
        const d0 = new Date();
        for (let i = 5; i >= 0; i--) { const d = new Date(d0.getFullYear(), d0.getMonth() - i, 1); keys.push(d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0')); }
        const by = {}; keys.forEach(k => by[k] = 0);
        FACTURES.forEach(f => (f.paiements || []).forEach(p => { const k = String(p.date || '').slice(0, 7); if (by[k] != null) by[k] += Number(p.montant) || 0; }));
        return window.SSUI.sparkline(keys.map(k => by[k]));
      })();
      // Les valeurs sont posées à 0 puis animées en « odomètre » (voir SSUI.countUp) : le relevé
      // se stabilise sous les yeux au lieu d'apparaître d'un bloc. data-v porte la valeur réelle.
      // Chiffres métier ajoutés : CA en jeu (pipeline des devis en attente), reste à encaisser,
      // % encaissé/facturé (anneau), répartition des bénéfices (barres).
      const caEnJeu = envoyes.reduce((s, d) => s + d.ttc, 0);
      // ⚠️ Le reste dû se calcule FACTURE PAR FACTURE (chaque reste plancheté à 0), jamais en
      // « total facturé − total encaissé » : un trop-perçu sur une facture viendrait effacer la
      // dette d'une autre et sous-évaluerait le montant réellement à récupérer (bug déjà corrigé
      // dans factures.html — les deux pages doivent afficher le MÊME chiffre).
      const resteEncaisser = FACTURES.reduce((s, f) => s + Math.max(0, (Number(f.total_ttc) || 0) - paidSum(f)), 0);
      const encPct = totalFacture > 0 ? Math.min(100, Math.round(caEncaisse / totalFacture * 100)) : 0;
      const beneTotal = nicolasNet + yannickNet;
      const beneMax = Math.max(nicolasNet, yannickNet, 1);
      const ringOffset = (97.4 * (1 - encPct / 100)).toFixed(1);
      el('kpis').innerHTML = `<div class="kpi-strip">
        <div class="kt gold ${activeFilter === 'kpi_signes' ? 'on' : ''}" data-filter="kpi_signes" onclick="setFilter('kpi_signes')" title="Voir ces ${signes.length} devis signés et terminés">
          <div class="kt-l">CA signé &amp; terminé</div><div class="kt-v" data-v="${caSigne}" data-fmt="eur">—</div><div class="kt-s">${signes.length} devis · bénéf. ${fmtEur(beneTotal)}</div></div>
        <div class="kt accent ${activeFilter === 'kpi_en_jeu' ? 'on' : ''}" data-filter="kpi_en_jeu" onclick="setFilter('kpi_en_jeu')" title="Voir ces ${envoyes.length} devis en attente de réponse">
          <div class="kt-l">CA en jeu</div><div class="kt-v" data-v="${caEnJeu}" data-fmt="eur">—</div><div class="kt-s">${envoyes.length} devis en attente</div></div>
        <div class="kt gold"><div class="kt-l">Encaissé</div>
          <div class="kt-vr"><svg class="kt-ring" width="34" height="34" viewBox="0 0 36 36" aria-hidden="true"><circle class="rbg" cx="18" cy="18" r="15.5" fill="none" stroke-width="3.4"/><circle class="rfg" cx="18" cy="18" r="15.5" fill="none" stroke-width="3.4" stroke-linecap="round" stroke-dasharray="97.4" stroke-dashoffset="${ringOffset}" transform="rotate(-90 18 18)"/><text class="rtxt" x="18" y="18" text-anchor="middle" dominant-baseline="central">${encPct}%</text></svg><div class="kt-v" data-v="${caEncaisse}" data-fmt="eur">—</div></div>
          <div class="kt-s">sur ${fmtEur(totalFacture)} facturé</div></div>
        <div class="kt ${resteEncaisser > 0.005 ? 'warn' : 'ok'} ${activeFilter === 'solde_attente' ? 'on' : ''}" data-filter="solde_attente" onclick="setFilter('solde_attente')" title="Voir les soldes à encaisser">
          <div class="kt-l">Reste à encaisser</div><div class="kt-v" data-v="${resteEncaisser}" data-fmt="eur">—</div><div class="kt-s">${resteEncaisser > 0.005 ? 'sur factures non soldées' : (totalFacture > 0 ? 'tout encaissé ✓' : 'aucune facture')}</div></div>
        <div class="kt"><div class="kt-l">Bénéfices vendeurs</div>
          <div class="kt-bars">
            <div class="ktb"><span>N</span><span class="ktb-t"><i style="width:${Math.round(nicolasNet / beneMax * 100)}%;background:var(--accent)"></i></span><b>${fmtEur(nicolasNet)}</b></div>
            <div class="ktb"><span>Y</span><span class="ktb-t"><i style="width:${Math.round(yannickNet / beneMax * 100)}%;background:var(--accent-2)"></i></span><b>${fmtEur(yannickNet)}</b></div>
          </div></div>
      </div>`;
      // Défensif : si countUp est indisponible (ui.js périmé en cache ou non chargé), on pose la
      // valeur finale au lieu de laisser une exception interrompre TOUT le rendu du tableau de bord.
      const anim = window.SSUI && window.SSUI.countUp;
      el('kpis').querySelectorAll('[data-v]').forEach(n => {
        const eur = n.getAttribute('data-fmt') === 'eur';
        const val = Number(n.getAttribute('data-v')) || 0;
        const fmt = v => eur ? fmtEur(v) : String(Math.round(v));
        if (anim) anim(n, val, { format: fmt }); else n.textContent = fmt(val);
      });
    }

    function render() {
      renderTodayBrief();
      renderKPIs();
      renderFilters();
      renderSellerFilters();
      renderTypeFilters();
      const q = el('search').value.trim().toLowerCase();
      const sort = el('sort').value;
      let rows = activeFilter === 'archives' ? DEVIS.filter(d => d.archive) : DEVIS.filter(d => !d.archive);
      // Vue par défaut : on écarte les dossiers tranchés perdus (ils polluaient la liste de travail).
      if (activeFilter === 'actifs') rows = rows.filter(estActif);
      if (activeFilter === 'accepte_client') rows = rows.filter(d => d.client_accepted && WAITING_STATUSES.includes(d.statut));
      else if (activeFilter === 'question_client') rows = rows.filter(d => d.client_question_open);
      else if (activeFilter === 'a_relancer') rows = rows.filter(d => WAITING_STATUSES.includes(d.statut) && !d.client_accepted && daysInCurrentStatus(d) >= 7);
      else if (activeFilter === 'en_retard') rows = rows.filter(isPaymentOverdue);
      else if (activeFilter === 'acompte_attente') rows = rows.filter(isAcompteUnpaid);
      else if (activeFilter === 'solde_attente') rows = rows.filter(isSoldeUnpaid);
      else if (activeFilter === 'a_preparer') rows = rows.filter(isChantierAPreparer);
      else if (activeFilter === 'expire') rows = rows.filter(isDevisExpire);
      else if (activeFilter === 'lien_jamais_ouvert') rows = rows.filter(isLinkNeverOpened);
      // Vues des tuiles KPI : elles doivent montrer EXACTEMENT la population comptée par la tuile
      // (sinon la tuile dit « 4 devis » et le clic n'en affiche qu'un — incohérence).
      else if (activeFilter === 'kpi_signes') rows = rows.filter(d => ['signe', 'termine'].includes(d.statut));
      else if (activeFilter === 'kpi_en_jeu') rows = rows.filter(d => WAITING_STATUSES.includes(d.statut) && d.statut !== 'brouillon');
      else if (!['tous', 'actifs', 'archives'].includes(activeFilter)) rows = rows.filter(d => d.statut === activeFilter);
      if (activeSeller !== 'tous') rows = rows.filter(d => (d.seller_principal || 'nicolas') === activeSeller);
      if (activeType !== 'tous') rows = rows.filter(d => (d.item_types || []).includes(activeType));
      // Recherche élargie (#12) : + note interne et types de produit, en plus des coordonnées.
      if (q) rows = rows.filter(d => (`${d.prenom} ${d.nom} ${d.id} ${d.ville} ${d.telephone} ${d.email} ${d.note || ''} ${(d.item_types || []).map(t => TYPE_LABEL[t] || t).join(' ')}`).toLowerCase().includes(q));
      rows = applyAdvFilters(rows);
      rows.sort((a, b) => {
        // Filtre « à relancer » : on remonte les devis les plus CONSULTÉS en ligne (l'engagement
        // prédit la signature — un client qui rouvre son devis 24× est chaud). Puis le tri normal.
        if (activeFilter === 'a_relancer') {
          const dv = (b.review_views || 0) - (a.review_views || 0);
          if (dv) return dv;
        }
        if (sort === 'montant') return b.ttc - a.ttc;
        if (sort === 'nom') return (a.nom || '').localeCompare(b.nom || '');
        return (b.date_modification || '').localeCompare(a.date_modification || '');
      });

      setText('resultCount', `${rows.length} devis`);
      renderActiveFilters(rows);

      if (rows.length === 0) {
        const msg = activeFilter === 'archives' ? 'Aucun devis archivé.' : (DEVIS.length === 0 ? "Aucun devis pour l'instant.<br>Clique sur <strong>+ Nouveau devis</strong> pour commencer." : "Aucun devis ne correspond à ta recherche.");
        el('tableHost').innerHTML = `<div class="empty"><div class="big">${icon('window', 40)}</div>${msg}</div>`;
        return;
      }

      const pill = (d) => {
        const s = STATUSES[d.statut] || STATUSES.brouillon;
        const title = d.statut === 'refuse' && d.raison_refus ? ` title="Raison : ${esc(d.raison_refus)}"` : '';
        return `<button class="status-pill" style="--st:${s.color}"${title} onclick="openStatusMenu(event,'${d.id}')" aria-label="Changer le statut du devis ${d.id}"><span class="dot"></span>${s.label} ${icon('chevrondown', 10)}</button>`;
      };
      const nameTitle = (d) => {
        const full = ((d.prenom || '') + ' ' + (d.nom || '')).trim();
        const tags = CLIENT_TAGS.get(clientKeyOf(d.prenom, d.nom)) || [];
        return tags.length ? `${full} — Étiquettes : ${tags.join(', ')}` : full;
      };
      const typeBadges = (d) => {
        const types = d.item_types || [];
        // Informations produit manquantes (toile, RAL, moteur, caisson…) : sans elles la
        // commande Harol est bloquée, et l'oubli ne se voyait qu'au moment de commander.
        // Rien sur un devis refusé ou annulé : on ne le commandera jamais.
        const manque = (DEAD_STATUSES.includes(d.statut) || !SSUI.badgeManquants) ? '' : SSUI.badgeManquants(d);
        if (!types.length && !manque) return '';
        return `<div class="type-badges">${types.map(t => `<span class="badge">${esc(TYPE_LABEL[t] || t)}</span>`).join('')}${manque}</div>`;
      };
      if (window.__mediaPreviewReset) window.__mediaPreviewReset();   // ferme un aperçu ouvert avant de réécrire le tableau
      el('tableHost').innerHTML = `<div class="mix-list">${rows.map(d => {
        const hot = WAITING_STATUSES.includes(d.statut) && !d.client_accepted && d.review_views >= SEUIL_CHAUD();
        const pay = paymentInfo(d);
        return `
        <div class="mrow ${hot ? 'is-hot' : ''}" data-id="${d.id}" style="--rail:${railColor(d)}" title="Ouvrir la fiche du devis">
          <div class="m-main">
            <div class="m-nm">
              <span class="m-name" title="${esc(nameTitle(d))}">${esc(d.prenom)} ${esc(d.nom) || '—'}</span>
              ${typeBadges(d)}
              <span class="m-nb">
                ${PRE_SIGNATURE_STATUSES.includes(d.statut) ? `<button class="proba-dot" style="--pc:${(PROBABILITE[d.probabilite] || {}).color || 'var(--border-strong)'}" onclick="event.stopPropagation();toggleProbaMenu(event,'${d.id}')" title="${PROBABILITE[d.probabilite] ? 'Probabilité : ' + PROBABILITE[d.probabilite].label : 'Définir une probabilité de signature'}"></button>` : ''}
                ${CLIENT_TAGS.has(clientKeyOf(d.prenom, d.nom)) ? `<span class="tag-dot" title="${esc('Étiquettes : ' + CLIENT_TAGS.get(clientKeyOf(d.prenom, d.nom)).join(', '))}">${icon('tag', 11)}</span>` : ''}
                ${d.portfolio ? `<span class="badge badge-gold" title="Dans le portfolio de réalisations">${icon('star', 10)}</span>` : ''}
              </span>
            </div>
            <div class="m-sub">
              ${pill(d)}
              <span class="id">#${d.id}</span>
              ${milestoneDots(d)}
              <div class="media-icons">
                ${/* Survol = aperçu · clic = on ATTERRIT sur la section concernée de la fiche (l'aperçu
                      montrait les photos sans permettre d'y aller : il fallait ouvrir puis chercher). */ ''}
                <span class="mi-slot ${d.photos ? 'active' : ''}" ${d.photos ? `data-preview="photos" data-id="${d.id}" onclick="event.stopPropagation();location.href='vue.html?id=${d.id}#photos'"` : ''} title="${d.photos ? d.photos + ' photo(s) — survoler pour un aperçu, cliquer pour ouvrir les ouvertures' : 'Aucune photo'}">${icon('camera', 14)}${d.photos || 0}</span>
                ${d.chantier_photos_count ? `<span class="mi-slot active" data-preview="chantier" data-id="${d.id}" onclick="event.stopPropagation();location.href='vue.html?id=${d.id}#journal'" title="${d.chantier_photos_count} photo(s) de chantier — survoler pour un aperçu, cliquer pour ouvrir le journal">${icon('image', 14)}${d.chantier_photos_count}</span>` : ''}
                ${/* Les notes s'ouvrent SUR PLACE : quitter le tableau de bord pour écrire deux lignes,
                      puis revenir et retrouver sa position dans la liste, coûtait plus cher que la note
                      elle-même. Le compteur reste cliquable même à zéro — c'est souvent là qu'on veut
                      justement en écrire une. */ ''}
                <span class="mi-slot cmt-slot ${d.comments ? 'active' : ''}" data-id="${d.id}" ${d.comments ? `data-preview="comments"` : ''} onclick="event.stopPropagation();openComments('${d.id}')" title="${d.comments ? d.comments + ' note(s) interne(s) — survoler pour un aperçu, cliquer pour écrire ou corriger' : 'Aucune note — cliquer pour en écrire une'}">${icon('message', 14)}${d.comments || 0}</span>
                ${d.note ? `<span class="note-flag" title="${esc(d.note)}">${icon('info', 14)}</span>` : ''}
              </div>
              <span class="m-date" title="Dernière modification : ${esc(safeDate(d.date_modification))}">${esc(relTime(d.date_modification) || safeDate(d.date_modification))}</span>
              ${jumpBar(d)}
            </div>
            ${engagementLine(d)}
          </div>
          <div class="m-signal">${signalChip(d)}</div>
          <div class="m-right">
            <div class="m-right-top">
              <button class="m-more" onclick="event.stopPropagation();openActionsMenu(event,'${d.id}')" title="Actions" aria-label="Actions du devis ${d.id}"><svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="5" cy="12" r="1.7"/><circle cx="12" cy="12" r="1.7"/><circle cx="19" cy="12" r="1.7"/></svg></button>
              <span class="price">${fmtEur(d.ttc)}</span>
            </div>
            ${pay ? `<div class="m-pay">${pay}</div>` : ''}
          </div>
        </div>`;
      }).join('')}</div>`;
      applyDensePref();   // la liste vient d'être réécrite → réapplique la densité choisie (#22)
      applyKpiPref();     // ...et l'état replié/déplié du bandeau (#11)
    }

    function esc(s) { return String(s || '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }

    /**
     * Raccourcis de ligne — ce que Nicolas fait le plus souvent, sans ouvrir le devis.
     * CONTEXTUELS : un bouton n'apparaît que s'il mène quelque part de réel (pas de téléphone →
     * pas d'icône téléphone). Mieux vaut 4 raccourcis qui marchent que 9 dont la moitié sonne dans le vide.
     * Les destinations « profondes » (#photos, #notes, #paiements, #lien) atterrissent sur la bonne
     * carte de la fiche, dépliée et surlignée une seconde — voir les ancres dans vue.html.
     */
    function jumpBar(d) {
      const b = [];
      const jp = (ic, titre, act) => `<button type="button" class="m-jp" title="${esc(titre)}" aria-label="${esc(titre)}"
        onclick="event.stopPropagation();${act}">${icon(ic, 13)}</button>`;
      const tel = String(d.telephone || '').split(',')[0].trim();
      const mail = String(d.email || '').split(',')[0].trim();
      const a = d.adresse || {};
      const adr = [((a.rue || '') + ' ' + (a.numero || '')).trim(), ((a.code_postal || '') + ' ' + (a.ville || d.ville || '')).trim()]
        .filter(Boolean).join(', ');
      if (tel) b.push(jp('phone', 'Appeler ' + tel, `location.href='tel:${esc(tel.replace(/[^\d+]/g, ''))}'`));
      if (mail) b.push(jp('mail', 'Écrire à ' + mail, `location.href='mailto:${esc(mail)}'`));
      if (adr) b.push(jp('route', 'Itinéraire — ' + adr, `window.open('https://www.google.com/maps/dir/?api=1&destination=' + encodeURIComponent(${SSUI.jsAttr(adr)}), '_blank', 'noopener')`));
      b.push(jp('filetext', 'Document devis (PDF client)', `location.href='devis.html?id=${d.id}'`));
      const ck = clientKeyOf(d.prenom, d.nom);
      if (ck) b.push(jp('users', 'Fiche client — historique complet, notes, autres devis', `location.href='clients.html?key=${encodeURIComponent(ck)}'`));
      // Espace client : on ouvre la carte du lien dans la fiche (le jeton n'est pas dans la liste).
      if (d.has_review_link) b.push(jp('link', `Espace client — ${d.review_views || 0} vue(s)`, `location.href='vue.html?id=${d.id}#lien'`));
      const fs = (typeof FACTURES !== 'undefined' ? FACTURES : []).filter(f => f.devis_id === d.id);
      if (fs.length) {
        const last = fs.slice().sort((x, y) => String(y.date || '').localeCompare(String(x.date || '')))[0];
        b.push(jp('coin', `Facture ${last.id}${fs.length > 1 ? ' (+' + (fs.length - 1) + ')' : ''}`, `location.href='facture.html?id=${encodeURIComponent(last.id)}'`));
      }
      if (d.chantier && d.chantier.date_pose) b.push(jp('calendar', 'Pose le ' + safeDate(d.chantier.date_pose) + ' — voir l’agenda', `location.href='agenda.html'`));
      if ((d.sav_tickets || []).length) b.push(jp('hammer', (d.sav_tickets || []).length + ' ticket(s) SAV', `location.href='vue.html?id=${d.id}#sav'`));
      return `<div class="m-jump">${b.join('')}</div>`;
    }

    // ── Aperçu flottant au survol des médias (miniatures photos / fil de notes) ──
    // Chargé à la demande (SS.getDevis, mis en cache) : la liste n'embarque que les compteurs,
    // pas les photos/textes, pour rester légère. Écouteurs délégués sur #tableHost (persistants
    // même après réécriture du tableau à chaque render).
    (function () {
      const host = el('tableHost');
      if (!host) return;
      let previewEl = null, hoverTimer = null, currentSlot = null;
      const cache = {};
      function ensureEl() {
        if (previewEl) return;
        previewEl = document.createElement('div');
        previewEl.className = 'media-preview';
        document.body.appendChild(previewEl);
      }
      function hide() { if (previewEl) previewEl.classList.remove('open'); }
      function position(slot) {
        const p = previewEl, r = slot.getBoundingClientRect();
        const pw = p.offsetWidth, ph = p.offsetHeight;
        let left = r.left + r.width / 2 - pw / 2;
        left = Math.max(8, Math.min(left, window.innerWidth - pw - 8));
        let top = r.bottom + 8;
        if (top + ph > window.innerHeight - 8) top = r.top - ph - 8;   // pas de place dessous → au-dessus
        p.style.left = left + 'px';
        p.style.top = Math.max(8, top) + 'px';
      }
      // Une photo seule ne dit pas de QUELLE ouverture il s'agit. On garde donc le lien
      // photo → ouverture pour légender chaque cliché (pièce, étage, produit, dimensions) :
      // c'est ce qui permet de juger un dossier sans ouvrir le devis.
      function vignette(src, l1, l2) {
        return `<figure class="mp-shot"><img src="${esc(src)}" alt="" loading="lazy">
          <figcaption class="mp-cap"><div class="l1">${esc(l1 || '—')}</div>${l2 ? `<div class="l2">${esc(l2)}</div>` : ''}</figcaption></figure>`;
      }
      function renderPhotos(devis) {
        const photos = [];
        (devis.items || []).forEach((it, i) => {
          const d2 = window.SSUI.isTenteSolaire(it) ? it.projection : it.hauteur;
          const lieu = [it.emplacement, it.etage].filter(Boolean).join(' · ') || `Ouverture ${i + 1}`;
          const tech = [TYPE_LABEL[it.type] || it.type, (it.largeur && d2) ? `${it.largeur} × ${d2} mm` : ''].filter(Boolean).join(' · ');
          (it.photos || []).forEach(src => { if (src) photos.push({ src, lieu, tech }); });
        });
        if (!photos.length) return '<div class="mp-empty">Aucune photo à afficher.</div>';
        const shown = photos.slice(0, 4), extra = photos.length - shown.length;
        return `<div class="mp-title">${icon('camera', 12)} ${photos.length} photo(s)</div>
          <div class="mp-photos">${shown.map(p => vignette(p.src, p.lieu, p.tech)).join('')}${extra > 0 ? `<div class="mp-more">+${extra}</div>` : ''}</div>`;
      }
      function renderChantierPhotos(devis) {
        const PHASE_L = { avant: 'Avant', pendant: 'En cours', apres: 'Terminé', probleme: 'Problème', reserve: 'Réserve', autre: 'Autre' };
        const entries = (devis.chantier_photos || []).slice().sort((a, b) => String((b.date || '') + (b.date_creation || '')).localeCompare(String((a.date || '') + (a.date_creation || ''))));
        if (!entries.length) return '<div class="mp-empty">Aucune photo de chantier.</div>';
        const shown = entries.slice(0, 4), extra = entries.length - shown.length;
        return `<div class="mp-title">${icon('image', 12)} ${entries.length} photo(s) de chantier</div>
          <div class="mp-photos">${shown.map(e => vignette(e.url, PHASE_L[e.phase] || 'Chantier', [e.note, e.date ? fmtDate(e.date) : ''].filter(Boolean).join(' · '))).join('')}${extra > 0 ? `<div class="mp-more">+${extra}</div>` : ''}</div>`;
      }
      function renderNotes(devis) {
        const tous = devis.comments || [];
        // Les 4 DERNIÈRES notes, mais restituées dans l'ordre de lecture (ancienne → récente) :
        // un aperçu à l'envers se relit mal, on ne comprend pas qui répond à qui.
        const recentes = tous.slice().sort((a, b) => String(b.date).localeCompare(String(a.date))).slice(0, 4);
        if (!recentes.length) return '<div class="mp-empty">Aucune note interne.</div>';
        const reste = tous.length - recentes.length;
        // Même rendu partagé que la fiche et la fenêtre de notes — sans bouton de suppression :
        // on ne supprime pas dans une bulle qui disparaît dès que la souris bouge.
        return `<div class="mp-title">${icon('message', 12)} ${tous.length} note${tous.length > 1 ? 's' : ''} interne${tous.length > 1 ? 's' : ''}</div>`
          + window.SSUI.commentsHtml(recentes, {})
          + (reste > 0 ? `<div class="mp-empty" style="padding-top:6px;">+ ${reste} note${reste > 1 ? 's' : ''} plus ancienne${reste > 1 ? 's' : ''} — clique pour tout voir</div>` : '');
      }
      async function show(slot) {
        const id = slot.getAttribute('data-id'), kind = slot.getAttribute('data-preview');
        if (!id || !kind || !document.contains(slot)) return;
        ensureEl();
        previewEl.classList.add('open');
        previewEl.innerHTML = '<div style="padding:6px"><div class="skl" style="height:64px;width:224px"></div></div>';
        position(slot);
        // Cache court (10 s) : évite de recharger le devis à chaque survol, mais se rafraîchit
        // rapidement après un ajout/suppression de note ou un changement de statut.
        const c = cache[id];
        let devis = (c && Date.now() - c.t < 10000) ? c.d : null;
        if (!devis) { try { devis = await SS.getDevis(id); cache[id] = { d: devis, t: Date.now() }; } catch (e) { devis = null; } }
        if (currentSlot !== slot || !document.contains(slot)) return;   // survol changé ou ligne re-rendue
        const preview = kind === 'photos' ? renderPhotos(devis) : (kind === 'chantier' ? renderChantierPhotos(devis) : renderNotes(devis));
        // Les aperçus PHOTO ont besoin de largeur (2 colonnes + légendes) ; le fil de notes non.
        previewEl.classList.toggle('wide', kind === 'photos' || kind === 'chantier');
        previewEl.innerHTML = devis ? preview : '<div class="mp-empty">Aperçu indisponible.</div>';
        position(slot);
      }
      // Réinitialisation exposée : appelée au début de render() pour fermer proprement l'aperçu
      // si le tableau est réécrit alors qu'une carte était survolée (le slot devient détaché).
      window.__mediaPreviewReset = () => { currentSlot = null; clearTimeout(hoverTimer); hide(); };
      host.addEventListener('mouseover', (e) => {
        const slot = e.target.closest('.mi-slot[data-preview]');
        if (!slot || slot === currentSlot) return;
        currentSlot = slot;
        clearTimeout(hoverTimer);
        hoverTimer = setTimeout(() => show(slot), 180);
      });
      host.addEventListener('mouseout', (e) => {
        const slot = e.target.closest('.mi-slot[data-preview]');
        if (!slot) return;
        if (e.relatedTarget && slot.contains(e.relatedTarget)) return;   // déplacement interne au slot
        currentSlot = null;
        clearTimeout(hoverTimer);
        hide();
      });
      window.addEventListener('scroll', hide, true);
    })();

    // ── Actions ──
    window.changeStatus = async (id, statut) => {
      const identity = await window.SSNav.getIdentity();
      const prev = (DEVIS.find(x => x.id === id) || {}).statut;
      const resSt = await SS.updateStatus(id, statut, identity.key);
      // Sans ce garde, une session Access expirée affichait « Devis signé 🎉 » + confettis alors que
      // rien n'avait été enregistré : au rechargement, le devis était toujours « Envoyé ».
      if (resSt && resSt.ok === false) { toast(resSt.error || 'Statut NON enregistré — réessaie.', 'error', 6000); return; }
      const d = DEVIS.find(x => x.id === id);
      if (d) { d.statut = statut; d.statut_history = (d.statut_history || []).concat([{ statut, date: new Date().toISOString(), by: identity.key || null }]); }
      toast(statut === 'signe' && prev !== 'signe' ? 'Devis signé 🎉' : 'Statut mis à jour', 'ok');
      if (statut === 'signe' && prev !== 'signe' && window.ssConfetti) window.ssConfetti();
      const cli = d ? ((d.prenom || '') + ' ' + (d.nom || '')).trim() : '';
      SS.logActivity({ action: 'devis.statut', entity_type: 'devis', entity_id: id, label: `Devis #${id}${cli ? ' (' + cli + ')' : ''} → ${(STATUSES[statut] || {}).label || statut}` });
      render();
    };

    // ── Menu de statut (pastilles colorées) ──
    let stMenuEl = null, stTarget = null;
    function ensureStatusMenu() {
      if (stMenuEl) return;
      stMenuEl = document.createElement('div');
      stMenuEl.className = 'status-menu';
      document.body.appendChild(stMenuEl);
      document.addEventListener('click', (e) => {
        if (stMenuEl.classList.contains('open') && !stMenuEl.contains(e.target) && !e.target.closest('.status-pill')) stMenuEl.classList.remove('open');
      }, true);
      window.addEventListener('scroll', () => stMenuEl.classList.remove('open'), true);
      document.addEventListener('keydown', (e) => { if (e.key === 'Escape') stMenuEl.classList.remove('open'); });
    }
    window.openStatusMenu = (e, id) => {
      e.stopPropagation();
      ensureStatusMenu();
      stTarget = id;
      stMenuEl.innerHTML = Object.entries(STATUSES).map(([k, v]) =>
        `<button onclick="pickStatus('${k}')"><span class="dot" style="background:${v.color}"></span>${v.label}</button>`).join('');
      const r = e.currentTarget.getBoundingClientRect();
      stMenuEl.style.left = Math.max(8, Math.min(r.left, window.innerWidth - 195)) + 'px';
      stMenuEl.style.top = Math.min(r.bottom + 6, window.innerHeight - 320) + 'px';
      stMenuEl.classList.add('open');
    };

    // ── Menu d'actions par devis (bouton ⋯) — remplace la barre d'icônes flottante ────────────
    let amEl = null;
    function ensureActionsMenu() {
      if (amEl) return;
      amEl = document.createElement('div');
      amEl.className = 'actions-menu';
      document.body.appendChild(amEl);
      document.addEventListener('click', (e) => {
        if (amEl.classList.contains('open') && !amEl.contains(e.target) && !e.target.closest('.m-more')) amEl.classList.remove('open');
      }, true);
      window.addEventListener('scroll', () => amEl.classList.remove('open'), true);
      document.addEventListener('keydown', (e) => { if (e.key === 'Escape') amEl.classList.remove('open'); });
    }
    window.closeActionsMenu = () => { if (amEl) amEl.classList.remove('open'); };
    window.openActionsMenu = (e, id) => {
      e.stopPropagation();
      ensureActionsMenu();
      const d = DEVIS.find(x => x.id === id) || {};
      const it = (ic, label, act, danger) => `<button class="${danger ? 'danger' : ''}" onclick="closeActionsMenu();${act}">${icon(ic, 16)} ${label}</button>`;
      let html = it('message', 'Notes internes', `openComments('${id}')`)
        + it('edit', 'Éditer le devis', `location.href='simulateur.html?id=${id}'`)
        + it('copy', 'Dupliquer', `duplicate('${id}')`)
        + it('filetext', 'Devis / PDF', `location.href='devis.html?id=${id}'`);
      if (['signe', 'termine'].includes(d.statut)) html += it('list', 'Liste de pose', `location.href='picking.html?id=${id}'`);
      if (d.statut === 'refuse' && !d.archive) html += it('download', 'Archiver', `archiveDevis('${id}', true)`);
      if (d.archive) html += it('upload', 'Désarchiver', `archiveDevis('${id}', false)`);
      html += '<div class="am-sep"></div>' + it('trash', 'Supprimer', `del('${id}')`, true);
      amEl.innerHTML = html;
      amEl.classList.add('open');   // ouvrir d'abord pour connaître les dimensions
      const r = e.currentTarget.getBoundingClientRect();
      const mw = amEl.offsetWidth, mh = amEl.offsetHeight;
      let left = Math.max(8, Math.min(r.right - mw, window.innerWidth - mw - 8));   // bord droit du menu aligné sur le bouton
      let top = (r.bottom + 6 + mh > window.innerHeight - 8) ? Math.max(8, r.top - mh - 6) : r.bottom + 6;   // bascule au-dessus si pas de place
      amEl.style.left = left + 'px';
      amEl.style.top = top + 'px';
    };
    const RAISON_REFUS = ['Prix', 'Délai', 'Concurrent', 'Projet reporté', 'Pas de réponse', 'Autre'];
    window.pickStatus = async (st) => {
      if (st === 'refuse') {
        // Demande la raison du refus dans le même menu flottant, avant d'appliquer le changement.
        stMenuEl.innerHTML = RAISON_REFUS.map(r => `<button onclick="pickRaisonRefus('${r}')">${r}</button>`).join('')
          + `<button onclick="pickRaisonRefus('')" style="color:var(--text-subtle);">Passer</button>`;
        return;
      }
      stMenuEl.classList.remove('open');
      if (stTarget) await changeStatus(stTarget, st);
    };
    window.pickRaisonRefus = async (raison) => {
      if (stMenuEl) stMenuEl.classList.remove('open');
      const id = stTarget;
      if (!id) return;
      // UNE seule lecture, UN seul enregistrement contenant statut + historique + raison.
      // L'enchaînement précédent (changeStatus → relecture immédiate → 2e enregistrement) pouvait
      // relire une version pas encore propagée et la réécrire par-dessus : le refus disparaissait
      // alors que la raison restait. Même correction que celle déjà appliquée dans vue.html.
      const identity = await window.SSNav.getIdentity();
      const full = await SS.getDevis(id);
      if (!full) { toast('Devis introuvable', 'error'); return; }
      const now = new Date().toISOString();
      full.statut = 'refuse';
      full.statut_history = (full.statut_history || []).concat([{ statut: 'refuse', date: now, by: identity.key || null }]);
      // Toujours (r)écrire raison_refus, même vide — sinon un refus sans raison (« Passer »)
      // garde silencieusement la raison d'un refus précédent sur ce même devis.
      full.raison_refus = raison;
      full.date_modification = now;
      const res = await SS.saveDevis(full);
      if (res.ok === false) { toast(res.error || 'Refus NON enregistré — réessaie.', 'error', 6000); return; }
      const d = DEVIS.find(x => x.id === id);
      if (d) { d.statut = 'refuse'; d.raison_refus = raison; d.statut_history = full.statut_history; }
      toast('Devis refusé', 'ok');
      SS.logActivity({ action: 'devis.statut', entity_type: 'devis', entity_id: id, label: `Devis #${id} → Refusé${raison ? ' (' + raison + ')' : ''}` });
      render();
    };

    // ── Score de probabilité (petit point coloré, popover identique au menu de statut) ──
    let probaMenuEl = null, probaTarget = null;
    window.toggleProbaMenu = (e, id) => {
      e.stopPropagation();
      if (!probaMenuEl) {
        probaMenuEl = document.createElement('div');
        probaMenuEl.className = 'status-menu';
        document.body.appendChild(probaMenuEl);
        document.addEventListener('click', (ev) => {
          if (probaMenuEl.classList.contains('open') && !probaMenuEl.contains(ev.target) && !ev.target.closest('.proba-dot')) probaMenuEl.classList.remove('open');
        }, true);
        window.addEventListener('scroll', () => probaMenuEl.classList.remove('open'), true);
      }
      probaTarget = id;
      probaMenuEl.innerHTML = Object.entries(PROBABILITE).map(([k, v]) =>
        `<button onclick="pickProba('${k}')"><span class="dot" style="background:${v.color}"></span>${v.label}</button>`).join('');
      const r = e.currentTarget.getBoundingClientRect();
      probaMenuEl.style.left = Math.max(8, Math.min(r.left, window.innerWidth - 195)) + 'px';
      probaMenuEl.style.top = Math.min(r.bottom + 6, window.innerHeight - 320) + 'px';
      probaMenuEl.classList.add('open');
    };
    window.pickProba = async (val) => {
      probaMenuEl.classList.remove('open');
      const id = probaTarget;
      if (!id) return;
      const full = await SS.getDevis(id);
      if (!full) { toast('Devis introuvable', 'error'); return; }
      full.probabilite = val;
      full.date_modification = new Date().toISOString();
      const resPb = await SS.saveDevis(full);
      if (resPb.ok === false) { toast(resPb.error || 'Probabilité NON enregistrée — réessaie.', 'error', 6000); return; }
      const d = DEVIS.find(x => x.id === id);
      if (d) d.probabilite = val;
      render();
    };

    // ── Clic sur une ligne → fiche de visualisation du devis ──
    el('tableHost').addEventListener('click', (e) => {
      const row = e.target.closest('.mrow[data-id]');
      if (!row) return;
      if (e.target.closest('button, select, a, input, .status-pill, .proba-dot')) return; // ne pas voler les clics des contrôles
      location.href = 'vue.html?id=' + row.dataset.id;
    });
    window.del = async (id) => {
      if (!confirm('Supprimer définitivement ce devis ?')) return;
      const d = DEVIS.find(x => x.id === id);
      const cli = d ? ((d.prenom || '') + ' ' + (d.nom || '')).trim() : '';
      const res = await SS.deleteDevis(id);
      if (res && res.ok === false) { toast(res.error || 'Suppression impossible', 'error', 6000); return; }   // ex. factures liées
      DEVIS = DEVIS.filter(x => x.id !== id);
      toast(res && res.offline ? 'Devis supprimé (hors-ligne)' : 'Devis supprimé', 'warn');
      SS.logActivity({ action: 'devis.delete', entity_type: 'devis', entity_id: id, label: `Devis #${id}${cli ? ' (' + cli + ')' : ''} supprimé` });
      render();
    };
    window.duplicate = async (id) => {
      const full = await SS.getDevis(id);
      if (!full) { toast('Devis introuvable', 'error'); return; }
      const copy = JSON.parse(JSON.stringify(full));
      copy.id = window.SSUI.generateDevisId();
      copy.statut = 'brouillon';
      copy.date_creation = new Date().toISOString().slice(0, 10);
      copy.date_modification = new Date().toISOString();
      if (copy.client) copy.client.nom = (copy.client.nom || '') + ' (copie)';
      const resDup = await SS.saveDevis(copy);
      // Sans ce garde, on redirigeait vers un devis qui n'existe que dans le cache du navigateur.
      if (resDup.ok === false) { toast(resDup.error || 'Duplication NON enregistrée — réessaie.', 'error', 6000); return; }
      toast('Devis dupliqué', 'ok');
      location.href = 'simulateur.html?id=' + copy.id;
    };

    // ── Commentaires internes (fil Nicolas / Yannick) ──
    // Les libellés de type sont désormais portés par le rendu partagé (SSUI.commentHtml).
    let cmDevisId = null;

    window.openComments = async (id) => {
      cmDevisId = id;
      setText('cmDevisId', '#' + id);
      el('cmList').innerHTML = '<div class="skl-row"><div class="skl" style="height:13px;width:38%"></div><div class="skl" style="height:36px"></div><div class="skl" style="height:36px;width:82%"></div></div>';
      el('modalComments').classList.add('open');
      window.SSNav.getIdentity().then((identity) => {
        const hote = el('cmAuthorLabel');
        if (!hote) return;
        hote.innerHTML = identity.key
          ? icon('user', 12) + ' ' + esc(identity.name || identity.key)
          : icon('user', 12) + ' non identifié';
        hote.classList.toggle('inconnu', !identity.key);
      });
      await renderComments();
      el('cmText').focus();
    };
    window.closeComments = () => {
      fermerEdition();                       // une correction laissée ouverte ne doit pas « rester » au prochain devis
      el('modalComments').classList.remove('open');
      cmDevisId = null; cmNotes = [];
    };

    let cmNotes = [];   // le fil tel qu'il vient du serveur — sert à retrouver le texte d'origine

    async function renderComments() {
      const devis = await SS.getDevis(cmDevisId);
      cmNotes = (devis && devis.comments) || [];
      if (!cmNotes.length) {
        // Fil vide : on n'écrit RIEN. Le champ de saisie juste en dessous porte déjà son propre
        // texte d'invite — une phrase d'explication en plus faisait « tutoriel », pas outil.
        el('cmList').innerHTML = '';
        return;
      }
      // Rendu partagé (SSUI.commentHtml) — strictement la même présentation que la fiche devis,
      // le CRM et les demandes de RDV. Plus de balisage propre à cette fenêtre à maintenir.
      el('cmList').innerHTML = window.SSUI.commentsHtml(cmNotes, { onDelete: 'removeComment', onEdit: 'editComment', onReplyNote: 'replyToComment' });
      el('cmList').scrollTop = el('cmList').scrollHeight;
      renderCmReply();
    }

    // ── Répondre à une note depuis la fenêtre du tableau de bord ────────────────────────────────
    // Même mécanique que la fiche devis : on retient l'identifiant visé, on l'affiche en bandeau,
    // et le prochain envoi cite ce message. Le bandeau est le garde-fou : on ne peut pas répondre
    // au mauvais message sans le voir.
    let cmReplyTo = null;
    window.replyToComment = (id) => {
      if (!cmNotes.some(c => String(c.id) === String(id))) { toast('Message introuvable.', 'warn'); return; }
      cmReplyTo = String(id);
      renderCmReply();
      const f = el('cmText'); if (f) f.focus();
    };
    window.cancelCmReply = () => { cmReplyTo = null; renderCmReply(); };
    function renderCmReply() {
      const host = el('cmReplyBanner');
      if (!host) return;
      const src = cmReplyTo ? cmNotes.find(c => String(c.id) === String(cmReplyTo)) : null;
      if (!src) { host.classList.add('hidden'); host.innerHTML = ''; cmReplyTo = null; return; }
      const a = window.SSUI.commentAuthor(src.author);
      host.classList.remove('hidden');
      host.innerHTML = `${icon('reply', 12)} <span>Réponse à <b>${esc(a.label)}</b> — ${esc(String(src.text || '').replace(/\s+/g, ' ').slice(0, 60))}${String(src.text || '').length > 60 ? '…' : ''}</span>`
        + `<button type="button" onclick="cancelCmReply()" title="Ne plus répondre à ce message" aria-label="Annuler la réponse">${icon('x', 12)}</button>`;
    }

    /** Recale le compteur de la ligne du dashboard sur le nombre renvoyé par le serveur. */
    function majCompteurNotes(res, parDefaut) {
      const d = DEVIS.find(x => x.id === cmDevisId);
      if (!d) return;
      d.comments = (res && typeof res.comments_count === 'number') ? res.comments_count : parDefaut(d.comments || 0);
      render();
    }

    window.sendComment = async () => {
      const text = el('cmText').value.trim();
      if (!text) { toast('Écris d\'abord ta note.', 'warn'); return; }
      // Auteur déduit de la session par le serveur — inutile (et sans effet) de l'envoyer.
      const res = await SS.addComment(cmDevisId, { text, type: el('cmType').value, reply_to: cmReplyTo || undefined });
      if (res.ok === false) { toast(res.error || 'Erreur', 'error'); return; }
      el('cmText').value = '';
      cmReplyTo = null;
      toast(res.offline ? 'Note enregistrée (hors-ligne)' : 'Note ajoutée', res.offline ? 'warn' : 'ok');
      const d = DEVIS.find(x => x.id === cmDevisId);
      const cli = d ? ((d.prenom || '') + ' ' + (d.nom || '')).trim() : '';
      SS.logActivity({ action: 'note.add', entity_type: 'devis', entity_id: cmDevisId, label: `Note ajoutée sur le devis #${cmDevisId}${cli ? ' (' + cli + ')' : ''}` });
      // La fenêtre RESTE ouverte : elle se fermait à l'envoi, ce qui obligeait à la rouvrir pour
      // écrire la note suivante ou relire ce qu'on venait d'ajouter. Le fil se recharge, le champ
      // se vide et reprend le curseur — on enchaîne.
      await renderComments();
      majCompteurNotes(res, n => n + 1);
      el('cmText').focus();
    };

    window.removeComment = async (commentId) => {
      if (!confirm('Supprimer cette note ?')) return;
      const resRm = await SS.deleteComment(cmDevisId, commentId);
      if (resRm.ok === false) { toast(resRm.error || 'Note NON supprimée — réessaie.', 'error', 6000); return; }
      await renderComments();
      majCompteurNotes(resRm, n => Math.max(0, n - 1));
    };

    /* ── Correction d'une note, SUR PLACE ──────────────────────────────────────────────────────
       La note se transforme en son propre champ, à sa place dans le fil : ni fenêtre par-dessus,
       ni saut ailleurs. Le texte d'origine reste affiché jusqu'à ce que le serveur confirme —
       en cas de refus (session expirée, note du client), rien n'a bougé.                        */
    const TYPES_NOTE = [['note', 'Note'], ['question', 'Question'], ['important', 'Important']];

    window.editComment = (commentId) => {
      fermerEdition();   // une seule correction à la fois : deux champs ouverts = deux vérités
      const bloc = el('cmList').querySelector('[data-cmt-id="' + String(commentId).replace(/"/g, '\\"') + '"]');
      const note = cmNotes.find(c => String(c.id) === String(commentId));
      if (!bloc || !note) return;
      const zone = bloc.querySelector('.ss-cmt-text');
      if (!zone) return;

      const boite = document.createElement('div');
      boite.className = 'ss-cmt-edit';
      const champ = document.createElement('textarea');
      champ.className = 'textarea';
      champ.value = note.text || '';         // .value, jamais du HTML interpolé
      champ.setAttribute('aria-label', 'Texte de la note');
      const rang = document.createElement('div');
      rang.className = 'ss-cmt-edit-row';
      const typ = document.createElement('select');
      typ.className = 'select';
      typ.setAttribute('aria-label', 'Type de note');
      TYPES_NOTE.forEach(([v, l]) => { const o = document.createElement('option'); o.value = v; o.textContent = l; typ.appendChild(o); });
      typ.value = String(note.type || 'note').toLowerCase();
      const aide = document.createElement('span');
      aide.className = 'ss-cmt-edit-hint';
      aide.textContent = 'Ctrl + Entrée pour enregistrer · Échap pour annuler';
      const actions = document.createElement('span');
      actions.className = 'ss-cmt-edit-actions';
      const bAnn = document.createElement('button');
      bAnn.type = 'button'; bAnn.className = 'btn btn-ghost btn-sm'; bAnn.textContent = 'Annuler';
      const bOk = document.createElement('button');
      bOk.type = 'button'; bOk.className = 'btn btn-primary btn-sm'; bOk.textContent = 'Enregistrer';

      bAnn.onclick = () => fermerEdition();
      bOk.onclick = () => enregistrerEdition(commentId, champ, typ, bOk);
      champ.onkeydown = (e) => {
        if (e.key === 'Escape') { e.stopPropagation(); fermerEdition(); }
        if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); enregistrerEdition(commentId, champ, typ, bOk); }
      };

      actions.append(bAnn, bOk);
      rang.append(typ, aide, actions);
      boite.append(champ, rang);
      zone.after(boite);
      zone.style.display = 'none';
      bloc.classList.add('en-edition');
      champ.focus();
      champ.setSelectionRange(champ.value.length, champ.value.length);
    };

    function fermerEdition() {
      const ouvert = el('cmList').querySelector('.ss-cmt.en-edition');
      if (!ouvert) return false;
      const boite = ouvert.querySelector('.ss-cmt-edit');
      if (boite) boite.remove();
      const zone = ouvert.querySelector('.ss-cmt-text');
      if (zone) zone.style.display = '';
      ouvert.classList.remove('en-edition');
      return true;
    }

    async function enregistrerEdition(commentId, champ, typ, bouton) {
      const texte = champ.value.trim();
      if (!texte) { toast('Une note vide se supprime, elle ne s\'enregistre pas.', 'warn'); champ.focus(); return; }
      const note = cmNotes.find(c => String(c.id) === String(commentId));
      if (note && texte === (note.text || '') && typ.value === String(note.type || 'note').toLowerCase()) {
        fermerEdition(); return;   // rien n'a changé : pas d'écriture inutile
      }
      bouton.disabled = true; bouton.textContent = 'Enregistrement…';
      const res = await SS.updateComment(cmDevisId, commentId, { text: texte, type: typ.value });
      bouton.disabled = false; bouton.textContent = 'Enregistrer';
      if (!res || res.ok === false) { toast((res && res.error) || 'Note NON modifiée — réessaie.', 'error', 6000); return; }
      fermerEdition();
      await renderComments();
      toast('Note modifiée', 'ok');
      const d = DEVIS.find(x => x.id === cmDevisId);
      const cli = d ? ((d.prenom || '') + ' ' + (d.nom || '')).trim() : '';
      SS.logActivity({ action: 'note.edit', entity_type: 'devis', entity_id: cmDevisId, label: `Note corrigée sur le devis #${cmDevisId}${cli ? ' (' + cli + ')' : ''}` });
    }

    // Ctrl/⌘ + Entrée depuis le champ de saisie = ajouter la note sans lâcher le clavier.
    el('cmText').addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); sendComment(); }
    });
    // Échap ferme d'abord la correction en cours, la fenêtre seulement ensuite.
    document.addEventListener('keydown', (e) => {
      if (e.key !== 'Escape' || !el('modalComments').classList.contains('open')) return;
      if (!fermerEdition()) closeComments();
    });
    // fermer la modale au clic sur le fond
    el('modalComments').addEventListener('click', (e) => { if (e.target === el('modalComments')) closeComments(); });

    // ── Gadgets : export / import JSON ──
    // Sauvegarde COMPLÈTE : devis (fiches entières) + clients + factures + demandes de RDV,
    // dans un seul fichier JSON daté (ceinture + bretelles, en plus de l'historique D1 30 j).
    window.exportJSON = async () => {
      toast('Préparation de la sauvegarde…', 'ok', 1200);
      const [devisFull, clients, factures, rdv] = await Promise.all([
        Promise.all(DEVIS.map(d => SS.getDevis(d.id))).then(a => a.filter(Boolean)),
        SS.listClients().catch(() => []),
        SS.listFactures().catch(() => []),
        (SS.listRdv ? SS.listRdv().catch(() => []) : Promise.resolve([])),
      ]);
      const backup = {
        export_date: new Date().toISOString(), version: '3.0',
        counts: { devis: devisFull.length, clients: (clients || []).length, factures: (factures || []).length, rdv: (rdv || []).length },
        data: devisFull,          // rétro-compatible avec l'import existant (liste de devis)
        clients: clients || [], factures: factures || [], rdv: rdv || [],
      };
      // Filet de sécurité : si un devis n'a pu être récupéré (ni API ni cache), on prévient plutôt
      // que de livrer une sauvegarde « complète » silencieusement amputée.
      const missing = DEVIS.length - devisFull.length;
      if (missing > 0) {
        if (!confirm(`⚠ ${missing} devis sur ${DEVIS.length} n'ont pas pu être récupérés entièrement (réseau ?). Télécharger quand même la sauvegarde partielle ?`)) {
          toast('Sauvegarde annulée', 'warn', 2500); return;
        }
      }
      const blob = new Blob([JSON.stringify(backup, null, 2)], { type: 'application/json' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'solariscreen_sauvegarde_' + new Date().toISOString().slice(0, 10) + '.json';
      a.click();
      setTimeout(() => URL.revokeObjectURL(a.href), 4000);
      toast(`Sauvegarde téléchargée (${backup.counts.devis} devis, ${backup.counts.clients} clients, ${backup.counts.factures} factures, ${backup.counts.rdv} RDV)` + (missing > 0 ? ` — ⚠ ${missing} devis incomplets` : ''), 'ok', 3000);
    };
    window.importJSON = (input) => {
      const file = input.files[0]; if (!file) return;
      const reader = new FileReader();
      reader.onload = async (e) => {
        try {
          const json = JSON.parse(e.target.result);
          const list = Array.isArray(json) ? json : (json.data || []);
          // On compte les VRAIS succès : annoncer « 42 devis importés » alors que les 42 écritures
          // ont été refusées (session expirée) donnerait l'illusion d'une restauration réussie.
          let n = 0, echecs = 0;
          for (const d of list) {
            if (!d || !d.id) continue;
            const r = await SS.saveDevis(d);
            if (r.ok === false) echecs++; else n++;
          }
          if (echecs) toast(`${n} devis importé(s) — ⚠ ${echecs} ÉCHEC(S), rien n'a été enregistré pour ceux-là.`, 'error', 9000);
          else toast(`${n} devis importé(s)`, 'ok');
          await load();
        } catch (err) { toast('Fichier JSON invalide', 'error'); }
      };
      reader.readAsText(file);
      input.value = '';
    };

    // ── Journal d'activité / « Quoi de neuf » ──
    function actRelTime(iso) {
      const t = Date.now() - new Date(iso).getTime(), m = Math.floor(t / 60000);
      if (m < 1) return "à l'instant"; if (m < 60) return 'il y a ' + m + ' min';
      const h = Math.floor(m / 60); if (h < 24) return 'il y a ' + h + ' h';
      const dd = Math.floor(h / 24); if (dd === 1) return 'hier'; if (dd < 7) return 'il y a ' + dd + ' j';
      return fmtDate(iso);
    }
    function actDayLabel(iso) {
      const d = new Date(iso), today = new Date(), y = new Date(); y.setDate(y.getDate() - 1);
      const same = (a, b) => a.toDateString() === b.toDateString();
      if (same(d, today)) return "Aujourd'hui"; if (same(d, y)) return 'Hier';
      return d.toLocaleDateString('fr-BE', { weekday: 'long', day: '2-digit', month: 'long' });
    }
    function actNavFor(a) {
      if (a.entity_type === 'devis' && a.entity_id && a.action !== 'devis.delete') return 'vue.html?id=' + encodeURIComponent(a.entity_id);
      if (a.entity_type === 'rdv' && a.entity_id) return 'rdv.html?open=' + encodeURIComponent(a.entity_id);
      return null;
    }
    /*
     * Bruit déjà enregistré en base : Cloudflare injecte son beacon d'analytics sur chaque
     * page, une protection anti-pistage le bloque, et le journal s'est rempli d'une alerte
     * par chargement de page. La cause est corrigée (nav.js ne remonte plus que NOS
     * fichiers), mais les entrées passées restent en base — on les masque à l'affichage
     * plutôt que de supprimer des lignes du journal. Liste explicite : on ne masque QUE des
     * scripts tiers connus, jamais une erreur qui pourrait être réelle.
     */
    const SCRIPTS_TIERS = ['beacon.min.js', 'gtag', 'analytics.js', 'googletagmanager'];
    function sansBruit(list) {
      return (list || []).filter(a => {
        if (a.action !== 'error.js') return true;
        const l = String(a.label || '');
        if (l.indexOf('Ressource non chargée') < 0) return true;
        return !SCRIPTS_TIERS.some(s => l.indexOf(s) >= 0);
      });
    }
    /* ── Filtres du journal ────────────────────────────────────────────────────────────────────
       « J'ai pas assez de détail, les anciens disparaissent » : rien n'était perdu — la base garde
       tout — mais l'affichage était un mur de lignes sans tri. On filtre par personne et par
       nature, et le décompte annonce combien de lignes sont montrées sur combien. */
    let ACT_LISTE = [], actQui = 'tous', actQuoi = 'tous';
    const ACT_FAMILLES = {
      devis: ['devis.create', 'devis.modif', 'devis.statut', 'devis.delete', 'devis.relance', 'devis.pose', 'devis.reception', 'devis.accept_cancel'],
      notes: ['note.add', 'note.edit', 'rdv.comment'],
      argent: ['facture.avoir', 'facture.paiement.retire'],
      clients: ['client.create', 'client.mail', 'rdv.create', 'rdv.cancel', 'rdv.visite'],
    };
    function actFiltree() {
      return ACT_LISTE.filter(a => {
        if (actQui !== 'tous' && String(a.actor || '').toLowerCase() !== actQui) return false;
        if (actQuoi !== 'tous' && (ACT_FAMILLES[actQuoi] || []).indexOf(a.action) === -1) return false;
        return true;
      });
    }
    window.setActQui = (v) => { actQui = v; renderActivity(ACT_LISTE, 'all'); };
    window.setActQuoi = (v) => { actQuoi = v; renderActivity(ACT_LISTE, 'all'); };
    function actBarreFiltres(total, montres) {
      const chip = (courant, val, lib, fn) =>
        `<button class="chip ${courant === val ? 'active' : ''}" onclick="${fn}('${val}')">${lib}</button>`;
      return `<div class="act-filtres">
        <div class="filters">${chip(actQui, 'tous', 'Tout le monde', 'setActQui')}${chip(actQui, 'nicolas', 'Nicolas', 'setActQui')}${chip(actQui, 'yannick', 'Yannick', 'setActQui')}</div>
        <div class="filters">${chip(actQuoi, 'tous', 'Tout', 'setActQuoi')}${chip(actQuoi, 'devis', 'Devis', 'setActQuoi')}${chip(actQuoi, 'notes', 'Notes', 'setActQuoi')}${chip(actQuoi, 'argent', 'Argent', 'setActQuoi')}${chip(actQuoi, 'clients', 'Clients & RDV', 'setActQuoi')}</div>
        <div class="act-compte">${montres} ligne${montres > 1 ? 's' : ''} affichée${montres > 1 ? 's' : ''} sur ${total}</div>
      </div>`;
    }

    function renderActivity(liste, mode) {
      if (mode !== 'news') ACT_LISTE = sansBruit(liste) || [];
      const tous = mode === 'news' ? (sansBruit(liste) || []) : ACT_LISTE;
      const list = mode === 'news' ? tous : actFiltree();
      const entete = mode === 'news' ? '' : actBarreFiltres(tous.length, list.length);
      if (!list || !list.length) {
        el('actBody').innerHTML = entete + '<div class="empty-comments">' + (mode === 'news' ? 'Rien de neuf — tu es à jour ! ✨' : 'Aucune ligne pour ce filtre.') + '</div>';
        return;
      }
      return renderActivityLignes(list, mode, entete);
    }
    function renderActivityLignes(list, mode, entete) {
      let html = entete || '', lastDay = '';
      list.forEach((a, i) => {
        const day = actDayLabel(a.ts);
        if (day !== lastDay) { html += '<div class="act-daysep">' + esc(day) + '</div>'; lastDay = day; }
        const who = (a.actor || '').toLowerCase();
        const cls = who === 'yannick' ? 'yannick' : (who === 'nicolas' ? 'nicolas' : 'none');
        const ava = who === 'yannick' ? 'YA' : (who === 'nicolas' ? 'NI' : '?');
        const whoName = who ? who.charAt(0).toUpperCase() + who.slice(1) : 'Système';
        const nav = actNavFor(a);
        // L'heure exacte au survol : « il y a 3 j » suffit pour lire, pas pour retrouver un fait
        // précis quand on cherche qui a modifié quoi et quand.
        html += `<div class="act-row" style="animation-delay:${Math.min(i, 12) * 35}ms"${nav ? ` onclick="location.href='${nav}'"` : ''}>
          <span class="act-ava ${cls}">${ava}</span>
          <div class="act-main"><div class="act-label">${esc(a.label || a.action)}</div>
            <div class="act-meta"><strong>${esc(whoName)}</strong> · <time title="${esc(window.SSUI.fmtDateTime(a.ts))}">${esc(actRelTime(a.ts))}</time>
              <span class="act-quoi">${esc(a.action || '')}</span></div></div>
        </div>`;
      });
      el('actBody').innerHTML = html;
    }
    window.openActivity = async (mode, preloaded) => {
      el('actTitle').textContent = mode === 'news' ? 'Quoi de neuf depuis ta dernière visite' : "Journal d'activité";
      el('actFoot').innerHTML = '';
      el('actBody').innerHTML = '<div class="skl-row"><div class="skl" style="height:13px;width:38%"></div><div class="skl" style="height:36px"></div><div class="skl" style="height:36px;width:82%"></div></div>';
      el('modalActivity').classList.add('open');
      const list = preloaded || await SS.listActivity(mode === 'news' ? localStorage.getItem('ss_activity_seen') : null);
      renderActivity(list, mode);
      if (mode === 'news') el('actFoot').innerHTML = '<button class="btn btn-ghost btn-sm" onclick="openActivity(\'all\')">Voir tout le journal</button>';
    };
    window.closeActivity = () => el('modalActivity').classList.remove('open');
    el('modalActivity').addEventListener('click', (e) => { if (e.target === el('modalActivity')) closeActivity(); });
    document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && el('modalActivity').classList.contains('open')) closeActivity(); });
    // Auto : à la connexion, montre ce qui a changé DEPUIS la dernière visite (actions des autres).
    async function checkWhatsNew() {
      const lastSeen = localStorage.getItem('ss_activity_seen');
      const nowIso = new Date().toISOString();
      if (!lastSeen) { localStorage.setItem('ss_activity_seen', nowIso); return; }  // 1re visite : baseline, pas d'historique
      const news = await SS.listActivity(lastSeen);
      if (news == null) return;   // échec réseau/API : on NE déplace PAS le marqueur → on réessaiera au prochain chargement
      localStorage.setItem('ss_activity_seen', nowIso);   // fetch réussi (même vide) → on avance le marqueur
      let identity = { key: '' };
      try { identity = await window.SSNav.getIdentity(); } catch (e) {}
      // sansBruit AVANT le test : sinon « Quoi de neuf » s'ouvrait tout seul à chaque
      // connexion pour n'annoncer qu'un script tiers bloqué par le navigateur.
      const relevant = sansBruit(news).filter(a => !identity.key || a.actor !== identity.key);
      if (relevant.length) openActivity('news', relevant);
    }

    // ── Chargement ──
    // Relit les données du serveur et redessine. Volontairement SANS « Quoi de neuf » : cette
    // fonction est aussi appelée à chaque retour sur la page, et une fenêtre qui surgit sur un
    // simple retour d'onglet serait insupportable.
    async function rafraichir() {
      const [raw, facs, clients, rdvs] = await Promise.all([
        SS.listDevis(), SS.listFactures(), SS.listClients(),
        (SS.listRdv ? SS.listRdv().catch(() => []) : Promise.resolve([])),
      ]);
      DEVIS = (raw || []).map(normDevis);
      RDV_LIST = rdvs || [];
      FACTURES = facs || [];
      CLIENT_TAGS = new Map((clients || []).filter(c => (c.tags || []).length).map(c => [c.key, c.tags]));
      render();
      renderAllegement();
    }

    /* ── DEVIS ALOURDIS PAR LEURS PHOTOS ────────────────────────────────────────────────────────
       Les photos partent normalement vers le stockage R2 et seule leur adresse est gardée dans le
       devis. Quand l'envoi échoue (hors-ligne, session expirée), l'image reste EN CLAIR dans le
       devis : c'est un repli volontaire — mieux vaut un devis lourd qu'une photo perdue — mais il
       faut le rattraper, sinon le devis grossit jusqu'à ne plus pouvoir être enregistré du tout.
       Le poids vient de la liste (LENGTH(data) côté serveur) : aucun devis n'est téléchargé pour
       établir ce constat, seulement ceux qu'on allège réellement. */
    const SEUIL_LOURD = 300 * 1024;   // un devis sain pèse quelques Ko ; 300 Ko = photos en clair
    /* Devis dont le poids est IRRÉDUCTIBLE (signature manuscrite du client, gardée volontairement
       dans le devis) : après un allègement qui n'a rien trouvé à déporter, on cesse de les
       signaler — un bandeau qui réclame une action impossible finit par être ignoré, et masque
       les vrais cas. On mémorise le poids constaté : s'il augmente, le dossier ressort. */
    function irreductibles() {
      try { return JSON.parse(localStorage.getItem('ss_allegement_irreductibles') || '{}'); }
      catch (e) { return {}; }
    }
    function devisLourds() {
      const vus = irreductibles();
      return DEVIS.filter(d => d.poids > SEUIL_LOURD && !(vus[d.id] && d.poids <= vus[d.id] + 1024));
    }
    function renderAllegement() {
      const host = el('allegement');
      if (!host) return;
      const lourds = devisLourds();
      if (!lourds.length) { host.classList.add('hidden'); host.innerHTML = ''; return; }
      const total = lourds.reduce((s, d) => s + d.poids, 0);
      host.classList.remove('hidden');
      host.innerHTML = `${icon('image', 16)}
        <div class="al-txt"><strong>${lourds.length} devis alourdi${lourds.length > 1 ? 's' : ''} par ses photos</strong>
          <span>${fmtPoids(total)} stockés dans les devis au lieu du stockage photo. Les alléger les rend plus rapides et évite les échecs d'enregistrement.</span></div>
        <button class="btn btn-sm" id="btnAlleger" onclick="allegerDevis()">Alléger</button>`;
    }
    const fmtPoids = (o) => o >= 1048576 ? (o / 1048576).toFixed(1).replace('.', ',') + ' Mo' : Math.round(o / 1024) + ' Ko';
    window.allegerDevis = async () => {
      const lourds = devisLourds();
      if (!lourds.length) return;
      const btn = el('btnAlleger');
      if (btn) { btn.disabled = true; btn.textContent = 'Allègement…'; }
      let ok = 0, echecs = 0, gagnes = 0;
      const reste = { ouvertures: 0, chantier: 0, sav: 0, signatures: 0 };
      const figes = irreductibles();
      for (let i = 0; i < lourds.length; i++) {
        if (btn) btn.textContent = `Allègement… ${i + 1}/${lourds.length}`;
        try {
          const d = await SS.getDevis(lourds[i].id);
          if (!d) { echecs++; continue; }
          const r = await window.SSUI.deporterPhotos(d);
          Object.keys(reste).forEach(k => { reste[k] += (r.restant && r.restant[k]) || 0; });
          if (!r.deportees) {
            if (r.echecs) { echecs++; }
            else { figes[lourds[i].id] = lourds[i].poids; }   // rien de déportable : on n'y revient plus
            continue;
          }
          d.date_modification = new Date().toISOString();
          const res = await SS.saveDevis(d);
          // Si l'enregistrement échoue, les photos sont DÉJÀ dans R2 mais le devis pointe encore
          // sur ses images en clair : rien n'est perdu, la prochaine tentative les renverra.
          if (res.ok === false) { echecs++; continue; }
          ok++; gagnes += r.octets;
        } catch (e) { echecs++; }
      }
      // ⚠️ Ne JAMAIS afficher « 0 devis allégé ✓ » : un succès coché sur un bandeau qui reste
      // affiché ne veut rien dire. Quand il n'y a rien à déporter, on dit OÙ pèse le dossier.
      if (!ok && !echecs) {
        const sig = reste.signatures;
        toast(sig
          ? `Rien à déporter : le poids vient des signatures manuscrites (${fmtPoids(sig)}), gardées volontairement dans le devis — elles s’affichent sur l’espace client, qui n’a pas accès au stockage photo.`
          : 'Rien à déporter : le poids ne vient pas des photos.', 'warn', 10000);
      } else {
        toast(echecs
          ? `${ok} devis allégé(s), ${fmtPoids(gagnes)} récupérés · ${echecs} en échec (réessaie plus tard)`
          : `${ok} devis allégé(s) — ${fmtPoids(gagnes)} récupérés ✓`, echecs ? 'warn' : 'ok', 7000);
      }
      console.info('[SS] poids inline restant', reste);
      try { localStorage.setItem('ss_allegement_irreductibles', JSON.stringify(figes)); } catch (e) {}
      SS.logActivity && SS.logActivity({ action: 'maintenance.photos', entity_type: 'system', entity_id: 'photos',
        label: `Allègement : ${ok} devis, ${fmtPoids(gagnes)} déportés vers le stockage photo${echecs ? ' · ' + echecs + ' échec(s)' : ''}` });
      await rafraichir();
    };
    // Une photo qui n'a pas pu être déportée : le bandeau doit apparaître sans attendre un F5.
    window.addEventListener('ss-photo-repli', () => { setTimeout(rafraichir, 1500); });
    async function load() {
      await rafraichir();
      checkWhatsNew();   // fire-and-forget : ouvre « Quoi de neuf » s'il y a du nouveau
    }
    SS.isOnline().then(on => {
      const b = el('apiBadge');
      b.textContent = on ? '● En ligne' : '● Hors-ligne';
      b.className = 'badge ' + (on ? 'badge-ok' : 'badge-warn');
    });
    load();

    /* ── RETOUR SUR LE TABLEAU DE BORD : il faut RELIRE le serveur ──────────────────────────────
       Le navigateur restaure une page revue par le bouton « Précédent » depuis sa mémoire, SANS
       réexécuter le moindre script (bfcache). Le tableau de bord réaffichait donc l'état qu'il
       avait au moment où on l'avait quitté.
       C'est ce qui donnait l'impression tenace que les relances « ne marchaient pas » : la fiche
       enregistrait bien (« Relance 1 enregistrée ✓ », jalon R1 ✓, cadence recalculée), on revenait
       en arrière, et la liste réclamait encore « Relance 1 à envoyer » — avec une date de
       modification vieille de plusieurs jours, preuve qu'aucune relecture n'avait eu lieu.
       On recharge donc les données à chaque retour sur la page. `persisted` vaut true uniquement
       pour une restauration depuis la mémoire : un chargement normal a déjà appelé load() juste
       au-dessus, on ne le fait pas deux fois. */
    window.addEventListener('pageshow', (e) => { if (e.persisted) rafraichir(); });
    // Même raison au retour d'onglet : Yannick enregistre de son côté pendant que la page dort ici.
    // On s'abstient si une fenêtre est ouverte (notes, filtres…) pour ne pas redessiner sous ses pieds.
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible' && !document.querySelector('.modal-bg.open')) rafraichir();
    });
  </script>
</body>
</html>
