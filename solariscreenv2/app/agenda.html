<!DOCTYPE html>
<html lang="fr" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>SolariScreen — Agenda poses &amp; visites</title>
  <!-- ── Installation sur l'écran d'accueil (Android + iPhone) — aucun service worker ── -->
  <link rel="manifest" href="../manifest.webmanifest">
  <meta name="theme-color" content="#0b1224" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#f4f6fb" media="(prefers-color-scheme: light)">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="SolariScreen">
  <link rel="apple-touch-icon" href="../assets/img/apple-touch-icon.png">
  <link rel="icon" type="image/png" href="../assets/img/logo-solariscreen.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600;700&family=Orbitron:wght@600;800&display=swap" rel="stylesheet">
  <script src="../assets/js/theme.js"></script>
  <link rel="stylesheet" href="../assets/css/tokens.css">
  <link rel="stylesheet" href="../assets/css/theme-dark.css">
  <link rel="stylesheet" href="../assets/css/theme-light.css">
  <link rel="stylesheet" href="../assets/css/base.css">
  <style>
    .ag-section-title { display: flex; align-items: center; gap: var(--sp-2); font-family: var(--font-mono); font-size: var(--fs-2xs); text-transform: uppercase; letter-spacing: 0.08em; color: var(--text-subtle); margin: var(--sp-6) 0 var(--sp-3); }
    .ag-section-title:first-child { margin-top: 0; }
    .ag-section-title .n { color: var(--text-muted); }
    .ag-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(300px, 100%), 1fr)); gap: var(--sp-3); }
    .ag-card { border: 1px solid var(--border); border-radius: var(--r-md); background: var(--surface); padding: var(--sp-4); --tick-color: var(--accent); }
    .ag-card.is-retard { --tick-color: var(--danger); }
    .ag-card.is-today { --tick-color: var(--accent-2); }
    .ag-head { display: flex; justify-content: space-between; align-items: flex-start; gap: var(--sp-2); }
    .ag-client { font-weight: 700; }
    .ag-addr { font-family: var(--font-mono); font-size: var(--fs-2xs); color: var(--text-subtle); margin-top: 0.2rem; }
    .ag-addr a { color: var(--accent-2); }
    .ag-items { font-size: var(--fs-xs); color: var(--text-muted); margin-top: var(--sp-2); }
    .ag-weather { font-size: var(--fs-2xs); color: var(--text-subtle); font-family: var(--font-mono); margin-top: 0.2rem; min-height: 1em; }
    .ag-fields { display: grid; grid-template-columns: 1fr 1fr; gap: var(--sp-2); margin-top: var(--sp-3); }
    .ag-fields .field { margin: 0; }
    .ag-actions { display: flex; gap: var(--sp-2); margin-top: var(--sp-3); }
  </style>
</head>
<body>
  <div class="fx-grid"></div>

  <header class="app-header">
    <div class="brand">
      <span class="brand-logo"><img src="../assets/img/logo-solariscreen.png" alt="" onerror="this.style.display='none'"></span>
      <div>
        <h1><a href="dashboard.html">SOLARISCREEN</a></h1>
        <div class="module">Agenda — poses &amp; visites</div>
      </div>
    </div>
    <div class="header-actions">
      <span id="quickNav"></span>
      <span id="themeToggle"></span>
      <a class="btn btn-ghost btn-sm" href="dashboard.html"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg> Dashboard</a>
    </div>
  </header>

  <main class="container">
    <div class="kpis" id="kpis"></div>
    <div id="host"><div class="ag-grid" aria-busy="true"><div class="skl" style="height:172px"></div><div class="skl" style="height:172px"></div><div class="skl" style="height:172px"></div></div></div>
  </main>

  <script src="../assets/js/ui.js"></script>
  <script src="../assets/js/nav.js"></script>
  <script src="../assets/js/api.js"></script>
  <script>
    const SS = window.SS;
    const { mountThemeToggle } = window.SSTheme;
    const { fmtDate, el, icon, toast, fetchWeather } = window.SSUI;
    mountThemeToggle(document.getElementById('themeToggle'));
    window.SSNav.mount(document.getElementById('quickNav'));

    const TYPE_LABEL = { screen: 'Screen', volet_roulant: 'Volet', tente_solaire: 'Tente solaire', tablier_volet: 'Tablier volet', pergola: 'Pergola', store_banne: 'Store banne' };
    const EQUIPE_LABEL = { nicolas: 'Nicolas', yannick: 'Yannick', nicolas_yannick: 'Nicolas + Yannick', sous_traitant: 'Sous-traitant' };
    const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
    const today = () => new Date().toISOString().slice(0, 10);

    let FULL = new Map(); // id -> devis complet
    let VISITES = [];     // demandes de RDV avec une visite client FERME (statut « RDV fixé »)

    function itemsSummary(items) {
      const counts = {};
      (items || []).forEach(it => { counts[it.type] = (counts[it.type] || 0) + (it.quantite || 1); });
      return Object.entries(counts).map(([t, n]) => `${n} ${TYPE_LABEL[t] || t}${n > 1 ? 's' : ''}`).join(', ') || 'Aucune ouverture';
    }

    async function load() {
      const raw = await SS.listDevis();
      // Chantiers à poser = signés/terminés NON archivés. La visibilité réelle (posé ou non) est
      // décidée dans render() via isPoseDone — un devis « terminé » mais pose non faite reste visible.
      const eligible = (raw || []).filter(d => ['signe', 'termine'].includes(d.statut) && !d.archive);
      const fulls = await Promise.all(eligible.map(d => SS.getDevis(d.id)));
      FULL = new Map();
      fulls.filter(Boolean).forEach(d => FULL.set(d.id, d));
      // Visites clients (module RDV) : une visite fixée est un rendez-vous au même titre qu'une pose.
      // Sans ça, on fixait une visite qui n'apparaissait dans AUCUN agenda. On ne garde que les
      // visites encore à faire (« RDV fixé ») — une fois visité/converti, ça sort de l'agenda.
      const rdvs = (SS.listRdv ? await SS.listRdv().catch(() => []) : []) || [];
      VISITES = rdvs.filter(r => r.statut === 'rdv_fixe' && r.date_rdv);
      render();
    }

    function agCard(d) {
      const ch = d.chantier || {};
      const cl = d.client || {}, adr = cl.adresse || {};
      const adresseTxt = [((adr.rue || '') + ' ' + (adr.numero || '')).trim(), ((adr.code_postal || '') + ' ' + (adr.ville || '')).trim()].filter(Boolean).join(', ');
      const mapsUrl = adresseTxt ? 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(adresseTxt) : null;
      let cls = '', badge = '';
      // Ces cartes ne sont affichées que si la pose N'EST PAS faite. Un devis « Terminé » qui apparaît
      // ici est donc incohérent (marqué terminé sans pose enregistrée) → on l'alerte au lieu de le cacher.
      if (d.statut === 'termine') { cls = 'is-retard'; badge = `<span class="badge badge-warn" title="Marqué « Terminé » mais la pose n'est pas enregistrée (commande ≠ Posé, aucun PV de réception). Clique « Marquer posé » ou repasse-le en Signé.">⚠ Terminé sans pose</span>`; }
      else if (!ch.date_pose) { badge = `<span class="badge">À planifier</span>`; }
      else {
        const days = Math.round((new Date(ch.date_pose) - new Date(today())) / 86400000);
        if (days < 0) { cls = 'is-retard'; badge = `<span class="badge badge-danger">En retard (${-days}j)</span>`; }
        else if (days === 0) { cls = 'is-today'; badge = `<span class="badge badge-cyan">Aujourd'hui</span>`; }
        else { badge = `<span class="badge badge-warn">Dans ${days}j</span>`; }
      }
      return `
        <div class="ag-card ticked ${cls}">
          <div class="ag-head">
            <div>
              <div class="ag-client">${esc(cl.prenom)} ${esc(cl.nom) || '—'}</div>
              <div class="ag-addr">${adresseTxt ? (mapsUrl ? `<a href="${mapsUrl}" target="_blank" rel="noopener">${esc(adresseTxt)}</a>` : esc(adresseTxt)) : 'Adresse non renseignée'}</div>
            </div>
            ${badge}
          </div>
          <div class="ag-items">${esc(itemsSummary(d.items))}</div>
          <div class="ag-weather" id="weather-${d.id}"></div>
          <div class="ag-fields">
            <div class="field"><label class="label">Date de pose</label><input class="input" type="date" value="${esc(ch.date_pose || '')}" onchange="setChantierField('${d.id}','date_pose',this.value)"></div>
            <div class="field"><label class="label">Durée (h)</label><input class="input input-num" type="number" min="0" step="0.5" value="${ch.duree_h ?? ''}" onchange="setChantierField('${d.id}','duree_h',parseFloat(this.value)||0)"></div>
            <div class="field" style="grid-column:span 2;"><label class="label">Équipe</label>
              <select class="select" onchange="setChantierField('${d.id}','equipe',this.value)">
                ${Object.entries(EQUIPE_LABEL).map(([k, l]) => `<option value="${k}" ${((ch.equipe || 'nicolas') === k) ? 'selected' : ''}>${l}</option>`).join('')}
              </select>
            </div>
          </div>
          <div class="ag-actions">
            <button class="btn btn-ghost btn-sm" onclick="location.href='vue.html?id=${d.id}'">${icon('window', 14)} Voir la fiche</button>
            <button class="btn btn-primary btn-sm" onclick="markDone('${d.id}')">${icon('check', 14)} Marquer posé</button>
          </div>
        </div>`;
    }

    // Carte « visite client » (issue du module RDV) — volontairement plus légère qu'une carte de pose :
    // rien n'est éditable ici, on renvoie vers la fiche de la demande où tout est déjà géré.
    function visitCard(r) {
      const c = r.client || {}, adr = c.adresse || {};
      const adresseTxt = [((adr.rue || '') + ' ' + (adr.numero || '')).trim(), ((adr.code_postal || '') + ' ' + (adr.ville || '')).trim()].filter(Boolean).join(', ');
      const mapsUrl = adresseTxt ? 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(adresseTxt) : null;
      const day = (r.date_rdv || '').slice(0, 10), heure = (r.date_rdv || '').slice(11, 16);
      const days = Math.round((new Date(day) - new Date(today())) / 86400000);
      let cls = '', badge = '';
      if (days < 0) { cls = 'is-retard'; badge = `<span class="badge badge-danger">Passée (${-days}j)</span>`; }
      else if (days === 0) { cls = 'is-today'; badge = `<span class="badge badge-cyan">Aujourd'hui${heure ? ' · ' + heure : ''}</span>`; }
      else { badge = `<span class="badge badge-warn">Dans ${days}j</span>`; }
      const qui = r.assigned_to ? (EQUIPE_LABEL[r.assigned_to] || r.assigned_to) : '⚠ non attribuée';
      return `
        <div class="ag-card ticked ${cls}" style="--tick-color:var(--accent);">
          <div class="ag-head">
            <div>
              <div class="ag-client">${esc(c.prenom)} ${esc(c.nom) || '—'}</div>
              <div class="ag-addr">${adresseTxt ? (mapsUrl ? `<a href="${mapsUrl}" target="_blank" rel="noopener">${esc(adresseTxt)}</a>` : esc(adresseTxt)) : 'Adresse non renseignée'}</div>
            </div>
            ${badge}
          </div>
          <div class="ag-items">Visite client${heure ? ' à ' + esc(heure) : ''} · ${esc(qui)}${r.projet ? ' — ' + esc(String(r.projet).slice(0, 90)) : ''}</div>
          <div class="ag-actions">
            <button class="btn btn-ghost btn-sm" onclick="location.href='rdv.html?open=${encodeURIComponent(r.id)}'">${icon('calendar', 14)} Ouvrir la demande</button>
          </div>
        </div>`;
    }

    window.setChantierField = async (id, field, value) => {
      const d = FULL.get(id);
      if (!d) return;
      d.chantier = d.chantier || {};
      d.chantier[field] = value;
      d.date_modification = new Date().toISOString();
      const res = await SS.saveDevis(d);
      if (res.ok === false) { toast(res.error || 'Non enregistré — réessaie.', 'error', 6000); render(); return; }
      toast(res.offline ? 'Enregistré hors-ligne' : 'Planification mise à jour ✓', res.offline ? 'warn' : 'ok');
      render();
    };
    window.markDone = async (id) => {
      const d = FULL.get(id);
      if (!d) return;
      const t = today();
      const ch = d.chantier = d.chantier || {};
      // La pose ne peut pas être "faite" dans le futur : si la date prévue est future (ou absente),
      // on confirme et on la cale à aujourd'hui (garantie, portfolio… démarrent d'une date réelle).
      if (ch.date_pose && ch.date_pose > t) {
        if (!confirm(`La pose est prévue le ${fmtDate(ch.date_pose)} (dans le futur). Confirmer qu'elle est POSÉE aujourd'hui ?`)) return;
      }
      if (!ch.date_pose || ch.date_pose > t) ch.date_pose = t;
      d.commande = d.commande || {};
      d.commande.statut = 'pose';                     // jalon "pose faite" partagé (isPoseDone)
      d.statut = 'termine';                            // "Pose terminée" (≠ soldé : le solde reste à encaisser)
      const identity = await window.SSNav.getIdentity();
      d.statut_history = (d.statut_history || []).concat([{ statut: 'termine', date: new Date().toISOString(), by: identity.key }]);
      d.date_modification = new Date().toISOString();
      const res = await SS.saveDevis(d);
      if (res.ok === false) { toast(res.error || 'Pose NON enregistrée — réessaie.', 'error', 6000); render(); return; }
      if (SS.logActivity) SS.logActivity({ action: 'devis.pose', entity_type: 'devis', entity_id: id, label: `Chantier posé — devis #${id}` });
      toast(res.offline ? 'Pose enregistrée (hors-ligne)' : 'Chantier posé ✓ — pense à facturer et encaisser le solde.', res.offline ? 'warn' : 'ok', 3500);
      render();
    };

    function kpis(groups) {
      // Lundi de la semaine en cours. getDay() renvoie 0 pour dimanche — cas particulier
      // nécessaire, sinon la formule générale calcule "demain" au lieu du lundi précédent.
      const startWeek = new Date();
      const dow = startWeek.getDay();
      startWeek.setDate(startWeek.getDate() + (dow === 0 ? -6 : 1 - dow));
      const endWeek = new Date(startWeek); endWeek.setDate(endWeek.getDate() + 6);
      // Comparaison en chaînes ISO "YYYY-MM-DD" (lexicographique = chronologique) → aucun décalage
      // de fuseau horaire (l'ancienne comparaison mélangeait minuit-UTC et l'heure locale du soir).
      const wStart = startWeek.toISOString().slice(0, 10), wEnd = endWeek.toISOString().slice(0, 10);
      const cetteSemaine = [...FULL.values()].filter(d => d.chantier && d.chantier.date_pose && !window.SSUI.isPoseDone(d) &&
        d.chantier.date_pose >= wStart && d.chantier.date_pose <= wEnd).length;
      // Visites clients de la semaine (module RDV) — même fenêtre lundi→dimanche que les poses.
      const visSemaine = (groups.visites || []).filter(r => {
        const d = String(r.date_rdv || '').slice(0, 10);
        return d >= wStart && d <= wEnd;
      }).length;
      el('kpis').innerHTML = `
        <div class="kpi ticked accent"><div class="kpi-label">Cette semaine</div><div class="kpi-value">${cetteSemaine}</div><div class="kpi-sub">pose(s) planifiée(s)</div></div>
        <div class="kpi ticked gold"><div class="kpi-label">Visites clients</div><div class="kpi-value">${visSemaine}</div><div class="kpi-sub">cette semaine</div></div>
        <div class="kpi ticked"><div class="kpi-label">À planifier</div><div class="kpi-value">${groups.aPlanifier.length}</div><div class="kpi-sub">chantiers signés sans date</div></div>
        <div class="kpi ticked danger"><div class="kpi-label">En retard</div><div class="kpi-value">${groups.retard.length}</div><div class="kpi-sub">date de pose dépassée</div></div>`;
      if (window.SSUI.animateKpis) window.SSUI.animateKpis(el('kpis'));   // odometre partage (coup de frais)
    }

    function render() {
      const all = [...FULL.values()];
      const retard = [], aujourdhui = [], aVenir = [], aPlanifier = [];
      all.forEach(d => {
        if (window.SSUI.isPoseDone(d)) return;   // pose réellement faite (PV signé ou commande = Posé) → sort de l'agenda
        const ch = d.chantier || {};
        if (!ch.date_pose) { aPlanifier.push(d); return; }
        const days = Math.round((new Date(ch.date_pose) - new Date(today())) / 86400000);
        if (days < 0) retard.push(d); else if (days === 0) aujourdhui.push(d); else aVenir.push(d);
      });
      const byDate = (a, b) => (a.chantier.date_pose || '').localeCompare(b.chantier.date_pose || '');
      retard.sort(byDate); aujourdhui.sort(byDate); aVenir.sort(byDate);

      // Visites clients, de la plus proche à la plus lointaine (les visites passées non traitées
      // remontent donc en tête — c'est exactement ce qu'on veut voir en premier).
      const visites = VISITES.slice().sort((a, b) => String(a.date_rdv).localeCompare(String(b.date_rdv)));
      kpis({ aPlanifier, retard, visites });

      if (!all.length && !visites.length) {
        el('host').innerHTML = `<div class="empty"><div class="big">${icon('calendar', 40)}</div>Aucun chantier signé ni visite planifiée.<br>L'agenda se remplit dès qu'un devis passe au statut Signé, ou dès qu'une visite client est fixée.<br><a class="btn btn-ghost btn-sm" href="rdv.html">${icon('calendar', 13)} Fixer un rendez-vous</a></div>`;
        return;
      }

      const section = (title, n, list) => list.length ? `
        <div class="ag-section-title">${title} <span class="n">(${n})</span></div>
        <div class="ag-grid">${list.map(agCard).join('')}</div>` : '';
      const sectionVisites = (title, list) => list.length ? `
        <div class="ag-section-title">${title} <span class="n">(${list.length})</span></div>
        <div class="ag-grid">${list.map(visitCard).join('')}</div>` : '';

      el('host').innerHTML =
        sectionVisites('Visites clients à faire', visites) +
        section('⚠ En retard', retard.length, retard) +
        section("Aujourd'hui", aujourdhui.length, aujourdhui) +
        section('À venir', aVenir.length, aVenir) +
        section('À planifier', aPlanifier.length, aPlanifier) ||
        `<div class="empty">${icon('check', 40)}<div>Tous les chantiers signés sont planifiés et à jour.</div></div>`;

      loadWeatherFor([...retard, ...aujourdhui, ...aVenir]);
    }

    // Météo prévue (Open-Meteo, 16 jours max) — chargée en tâche de fond, silencieuse si indisponible.
    function loadWeatherFor(list) {
      list.forEach(async (d) => {
        const adr = (d.client && d.client.adresse) || {};
        const w = await fetchWeather(adr.ville || '', d.chantier.date_pose, adr.code_postal);
        const box = el('weather-' + d.id);
        if (w && box) box.textContent = `Météo prévue : ${w.label}, ${Math.round(w.tmin)}°/${Math.round(w.tmax)}°`;
      });
    }

    load();
  </script>
</body>
</html>
