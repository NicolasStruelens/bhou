<!DOCTYPE html>
<html lang="fr" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>SolariScreen — Facturation</title>
  <!-- ── Installation sur l'écran d'accueil (Android + iPhone) — aucun service worker ── -->
  <link rel="manifest" href="../manifest.webmanifest">
  <meta name="theme-color" content="#0b1224" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#f4f6fb" media="(prefers-color-scheme: light)">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="SolariScreen">
  <link rel="apple-touch-icon" href="../assets/img/apple-touch-icon.png">
  <link rel="icon" type="image/png" href="../assets/img/logo-solariscreen.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600;700&family=Orbitron:wght@600;800&display=swap" rel="stylesheet">
  <script src="../assets/js/theme.js"></script>
  <link rel="stylesheet" href="../assets/css/tokens.css">
  <link rel="stylesheet" href="../assets/css/theme-dark.css">
  <link rel="stylesheet" href="../assets/css/theme-light.css">
  <link rel="stylesheet" href="../assets/css/base.css">
  <style>
    .toolbar2 { display: flex; gap: var(--sp-3); align-items: center; flex-wrap: wrap; margin-bottom: var(--sp-4); }
    .toolbar2 .search { flex: 1; min-width: 200px; position: relative; }
    .toolbar2 .search input { padding-left: 2.2rem; }
    .toolbar2 .search svg { position: absolute; left: 0.7rem; top: 50%; transform: translateY(-50%); width: 14px; height: 14px; color: var(--text-subtle); pointer-events: none; }
    td .actions { display: flex; gap: 0.3rem; justify-content: flex-end; }
    .icon-btn { width: 30px; height: 30px; display: grid; place-items: center; border: 1px solid var(--border); border-radius: var(--r-sm); background: var(--surface-2); color: var(--text-muted); cursor: pointer; }
    .icon-btn:hover { border-color: var(--accent); color: var(--accent); } .icon-btn.danger:hover { border-color: var(--danger); color: var(--danger); }

    .modal-bg { position: fixed; inset: 0; background: rgba(0,0,0,0.55); z-index: 1000; display: none; align-items: center; justify-content: center; padding: var(--sp-4); }
    .modal-bg.open { display: flex; }
    .modal { background: var(--surface); border: 1px solid var(--border-strong); border-radius: var(--r-md); box-shadow: var(--shadow); width: 480px; max-width: 100%; max-height: 90vh; overflow: auto; }
    .modal h3 { font-family: var(--font-display); font-size: var(--fs-md); padding: var(--sp-4) var(--sp-5); border-bottom: 1px solid var(--border); color: var(--accent); }
    .modal .mbody { padding: var(--sp-5); }
    .modal .mfoot { padding: var(--sp-4) var(--sp-5); border-top: 1px solid var(--border); display: flex; justify-content: flex-end; gap: var(--sp-2); }

    /* ── Facture partielle : une ligne par ouverture, avec le nombre réellement posé ── */
    .poses-help { font-size: var(--fs-2xs); color: var(--text-subtle); line-height: 1.5; margin-bottom: var(--sp-2); }
    .pose-row { display: flex; align-items: center; gap: var(--sp-3); padding: 0.4rem 0;
      border-bottom: 1px dashed var(--border); }
    .pose-row:last-child { border-bottom: none; }
    .pose-nom { flex: 1; min-width: 0; font-size: var(--fs-sm); overflow: hidden; text-overflow: ellipsis; }
    .pose-lieu { display: block; font-size: var(--fs-2xs); color: var(--text-subtle); }
    .pose-qty { flex: none; display: flex; align-items: center; gap: 0.35rem; }
    .pose-qty .input { width: 72px; text-align: center; }
    .pose-tot { font-family: var(--font-mono); font-size: var(--fs-2xs); color: var(--text-subtle); }

    /* ── Encaissements déjà saisis, chacun retirable ── */
    .pay-hist-t { font-family: var(--font-mono); font-size: var(--fs-3xs); text-transform: uppercase;
      letter-spacing: 0.08em; color: var(--text-subtle); margin-bottom: 0.3rem; }
    .pay-hist { display: flex; align-items: center; gap: var(--sp-3); padding: 0.35rem 0;
      border-bottom: 1px dashed var(--border); font-size: var(--fs-xs); }
    .pay-hist:last-child { border-bottom: none; margin-bottom: var(--sp-4); }
    .pay-hist .ph-d { font-family: var(--font-mono); color: var(--text-muted); flex: none; }
    .pay-hist .ph-m { font-family: var(--font-mono); font-weight: 700; color: var(--ok); flex: none; }
    .pay-hist .ph-y { flex: 1; min-width: 0; color: var(--text-subtle); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .pay-hist .ph-x { flex: none; background: none; border: none; color: var(--text-subtle); cursor: pointer; display: inline-flex; padding: 3px; border-radius: var(--r-sm); }
    .pay-hist .ph-x:hover { color: var(--danger); background: color-mix(in srgb, var(--danger) 12%, transparent); }
  </style>
</head>
<body>
  <div class="fx-grid"></div>

  <header class="app-header">
    <div class="brand">
      <span class="brand-logo"><img src="../assets/img/logo-solariscreen.png" alt="" onerror="this.style.display='none'"></span>
      <div><h1><a href="dashboard.html">SOLARISCREEN</a></h1><div class="module">Facturation</div></div>
    </div>
    <div class="header-actions">
      <a class="btn btn-ghost btn-sm" href="dashboard.html"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect width="7" height="9" x="3" y="3" rx="1"/><rect width="7" height="5" x="14" y="3" rx="1"/><rect width="7" height="9" x="14" y="12" rx="1"/><rect width="7" height="5" x="3" y="16" rx="1"/></svg> Dashboard</a>
      <span id="quickNav"></span>
      <span id="themeToggle"></span>
      <button class="btn btn-primary btn-sm" onclick="openNew()"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg> Nouvelle facture</button>
    </div>
  </header>

  <main class="container">
    <div class="kpis" id="kpis"></div>
    <div class="toolbar2">
      <div class="search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <label for="search" class="sr-only">Rechercher une facture</label>
        <input class="input" id="search" placeholder="Rechercher (n°, client)…" oninput="render()">
      </div>
      <select class="select" id="filter" style="max-width:200px;" onchange="render()" aria-label="Filtrer les factures">
        <option value="tous">Toutes</option>
        <option value="impayee">À payer</option>
        <option value="partielle">Partielles</option>
        <option value="payee">Payées</option>
        <option value="retard">En retard</option>
      </select>
    </div>
    <section class="section">
      <div class="section-head"><span class="section-title">Factures</span><span class="section-code">SS // FACT</span><span class="section-sub" id="count">—</span></div>
      <div id="tableHost"></div>
    </section>
  </main>

  <!-- Modal nouvelle facture -->
  <div class="modal-bg" id="modalNew">
    <div class="modal">
      <h3>Nouvelle facture</h3>
      <div class="mbody">
        <div class="field"><label class="label" for="mDevis">Devis source</label><select class="select" id="mDevis" onchange="onDevisPick()"></select></div>
        <div class="field mt-4"><label class="label" for="mType">Type de facture</label>
          <select class="select" id="mType" onchange="onTypePick()">
            <option value="acompte">Facture d'acompte</option>
            <option value="partielle">Facture partielle — ce qui est posé</option>
            <option value="solde">Facture de solde</option>
            <option value="totale">Facture totale</option>
          </select>
        </div>
        <div class="field mt-4" id="mPctField"><label class="label" for="mPct">Pourcentage d'acompte</label><div class="input-unit"><input class="input input-num" id="mPct" type="number" min="1" max="100" value="30"><span class="unit">%</span></div></div>
        <div class="field mt-4 hidden" id="mPosesField">
          <label class="label">Ouvertures réellement posées</label>
          <div class="poses-help">Laisse le compte complet pour ce qui est terminé, réduis-le pour ce qui reste à poser. Le montant se recalcule tout seul.</div>
          <div id="mPoses"></div>
        </div>
        <div class="field mt-4"><label class="label" for="mEcheance">Échéance (jours)</label><input class="input input-num" id="mEcheance" type="number" min="0" value="15"></div>
        <div class="mt-4" id="mPreview" style="font-size:var(--fs-sm);color:var(--text-muted);"></div>
      </div>
      <div class="mfoot">
        <button class="btn btn-ghost btn-sm" onclick="closeModal('modalNew')">Annuler</button>
        <button class="btn btn-primary btn-sm" onclick="createFacture()">Générer</button>
      </div>
    </div>
  </div>

  <!-- Modal note de crédit -->
  <div class="modal-bg" id="modalAvoir">
    <div class="modal">
      <h3>Établir une note de crédit</h3>
      <div class="mbody">
        <div id="avInfo" style="font-size:var(--fs-sm);color:var(--text-muted);margin-bottom:var(--sp-4);"></div>
        <div class="field"><label class="label" for="avMontant">Montant à annuler (TVAC)</label>
          <div class="input-unit"><input class="input input-num" id="avMontant" type="number" step="0.01" oninput="updateAvoirPreview()"><span class="unit">€</span></div>
        </div>
        <div class="field mt-4"><label class="label" for="avMotif">Motif (apparaît sur le document)</label>
          <input class="input" id="avMotif" placeholder="Ex. : 5 ouvertures non posées, reportées">
        </div>
        <div class="mt-4" id="avPreview" style="font-size:var(--fs-sm);color:var(--text-muted);"></div>
      </div>
      <div class="mfoot">
        <button class="btn btn-ghost btn-sm" onclick="closeModal('modalAvoir')">Annuler</button>
        <button class="btn btn-primary btn-sm" onclick="createAvoir()">Établir la note de crédit</button>
      </div>
    </div>
  </div>

  <!-- Modal paiement -->
  <div class="modal-bg" id="modalPay">
    <div class="modal">
      <h3>Enregistrer un paiement</h3>
      <div class="mbody">
        <div id="payInfo" style="font-size:var(--fs-sm);color:var(--text-muted);margin-bottom:var(--sp-4);"></div>
        <div id="payList"></div>
        <div class="grid grid-2">
          <div class="field"><label class="label" for="payMontant">Montant</label><div class="input-unit"><input class="input input-num" id="payMontant" type="number" step="0.01"><span class="unit">€</span></div></div>
          <div class="field"><label class="label" for="payDate">Date</label><input class="input" id="payDate" type="date"></div>
          <div class="field col-full"><label class="label" for="payMoyen">Moyen</label>
            <select class="select" id="payMoyen"><option>Virement</option><option>Bancontact</option><option>Espèces</option><option>Autre</option></select>
          </div>
        </div>
      </div>
      <div class="mfoot">
        <button class="btn btn-ghost btn-sm" onclick="closeModal('modalPay')">Annuler</button>
        <button class="btn btn-primary btn-sm" onclick="savePayment()">Enregistrer</button>
      </div>
    </div>
  </div>

  <script src="../assets/js/ui.js"></script>
  <script src="../assets/js/nav.js"></script>
  <script src="../assets/js/api.js"></script>
  <script src="../assets/js/config.js"></script>
  <script>
    const SS = window.SS;
    const { mountThemeToggle } = window.SSTheme;
    const { fmtEur, fmtDate, el, toast, normDevis, icon, qp } = window.SSUI;
    mountThemeToggle(document.getElementById('themeToggle'));
    window.SSNav.mount(document.getElementById('quickNav'));

    const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
    const today = () => new Date().toISOString().slice(0, 10);
    const addDays = (n) => { const d = new Date(); d.setDate(d.getDate() + n); return d.toISOString().slice(0, 10); };

    let FACTURES = [], DEVIS = [], payTarget = null;

    const paidSum = f => (f.paiements || []).reduce((s, p) => s + (Number(p.montant) || 0), 0);
    // Une NOTE DE CRÉDIT n'est ni payée ni impayée : elle annule, elle ne s'encaisse pas. Sans ce
    // cas à part, son total NÉGATIF passait le test « payé ≥ total » et elle s'affichait « Payée ».
    const estAvoir = f => f && f.type === 'avoir';
    // Reste dû et annulation : définitions PARTAGÉES (assets/js/ui.js), les mêmes qu'aux
    // statistiques — sinon les deux écrans annonceraient deux créances différentes.
    const duDe = f => window.SSUI.duFacture(f, FACTURES);
    const estAnnulee = f => window.SSUI.factureAnnulee(f, FACTURES);
    function statutOf(f) {
      if (estAvoir(f)) return 'avoir';
      if (estAnnulee(f)) return 'annulee';
      const p = paidSum(f);
      if (p >= (f.total_ttc || 0) - 0.005) return 'payee';
      if (p > 0) return 'partielle';
      return 'impayee';
    }
    const isOverdue = f => ['avoir', 'annulee', 'payee'].indexOf(statutOf(f)) === -1 && f.echeance && f.echeance < today();
    function badgeFor(f) {
      const st = statutOf(f);
      if (st === 'avoir') return '<span class="badge badge-purple">Note de crédit</span>';
      if (st === 'annulee') return '<span class="badge" style="opacity:.75;">Annulée</span>';
      if (st === 'payee') return '<span class="badge badge-ok">Payée</span>';
      if (st === 'partielle') return '<span class="badge badge-warn">Partielle</span>';
      return isOverdue(f) ? '<span class="badge badge-danger">En retard</span>' : '<span class="badge badge-cyan">À payer</span>';
    }
    const TYPE_LABEL_FAC = { acompte: 'Acompte', solde: 'Solde', totale: 'Totale', partielle: 'Partielle', avoir: 'Note de crédit' };

    async function load() {
      FACTURES = (await SS.listFactures()) || [];
      DEVIS = ((await SS.listDevis()) || []).map(normDevis);
      renderKPIs(); render();
    }

    function renderKPIs() {
      const totalTTC = FACTURES.reduce((s, f) => s + (f.total_ttc || 0), 0);
      const encaisse = FACTURES.reduce((s, f) => s + paidSum(f), 0);
      // Reste dû = somme des restes POSITIFS, facture par facture. Un trop-perçu sur une facture
      // (client qui règle tout d'un coup sur la facture d'acompte) ne doit PAS venir effacer la
      // dette d'une autre facture : la simple soustraction totalTTC − encaissé sous-évaluait la
      // créance réelle (constaté sur les données réelles : 12 784 € affichés au lieu de 22 258 €).
      // Une facture éteinte par une note de crédit ne se réclame plus : `duFacture` en tient
      // compte. Sans ça, un montant annulé restait affiché comme créance (constaté en test :
      // 17 440,07 € encore réclamés sur une facture pourtant annulée).
      const reste = FACTURES.reduce((s, f) => s + duDe(f), 0);
      const retard = FACTURES.filter(isOverdue);
      const resteRetard = retard.reduce((s, f) => s + duDe(f), 0);
      el('kpis').innerHTML = `
        <div class="kpi gold"><div class="kpi-label">Total facturé</div><div class="kpi-value">${fmtEur(totalTTC)}</div></div>
        <div class="kpi ok"><div class="kpi-label">Encaissé</div><div class="kpi-value">${fmtEur(encaisse)}</div></div>
        <div class="kpi"><div class="kpi-label">Restant dû</div><div class="kpi-value">${fmtEur(reste)}</div></div>
        <div class="kpi danger"><div class="kpi-label">En retard (${retard.length})</div><div class="kpi-value">${fmtEur(resteRetard)}</div></div>`;
      if (window.SSUI.animateKpis) window.SSUI.animateKpis(el('kpis'));   // odometre partage (coup de frais)
    }

    function render() {
      const q = el('search').value.trim().toLowerCase();
      const filter = el('filter').value;
      let rows = FACTURES.slice().sort((a, b) => (b.date || '').localeCompare(a.date || ''));
      if (filter === 'retard') rows = rows.filter(isOverdue);
      else if (filter !== 'tous') rows = rows.filter(f => statutOf(f) === filter);
      if (q) rows = rows.filter(f => (`${f.id} ${f.client && f.client.prenom} ${f.client && f.client.nom}`).toLowerCase().includes(q));
      el('count').textContent = `${rows.length} facture(s)`;

      if (!rows.length) {
        el('tableHost').innerHTML = `<div class="empty">${icon('filetext', 34)}${FACTURES.length ? 'Aucune facture ne correspond.' : `Aucune facture pour l'instant.<br><button class="btn btn-ghost btn-sm" onclick="openNew()">${icon('plus', 13)} Créer une facture</button>`}</div>`;
        return;
      }

      el('tableHost').innerHTML = `
        <div class="table-wrap" style="border:none;border-radius:0;">
          <table class="data">
            <thead><tr><th>N°</th><th>Client</th><th>Type</th><th>Date</th><th>Échéance</th><th class="num">Montant</th><th class="num">Payé</th><th>Statut</th><th style="text-align:right;">Actions</th></tr></thead>
            <tbody>${rows.map(f => `
              <tr>
                <td class="text-mono">${esc(f.id)}</td>
                <td>${esc((f.client && f.client.prenom) || '')} ${esc((f.client && f.client.nom) || '')}</td>
                <td class="text-muted" style="font-size:var(--fs-2xs)">${esc(TYPE_LABEL_FAC[f.type] || f.type)}${f.avoir_de ? ' <span class="text-mono" style="opacity:.7">de ' + esc(f.avoir_de) + '</span>' : ''}</td>
                <td class="text-muted">${fmtDate(f.date)}</td>
                <td class="${isOverdue(f) ? 'text-mono' : 'text-muted'}" ${isOverdue(f) ? 'style="color:var(--danger)"' : ''}>${fmtDate(f.echeance)}</td>
                <td class="num text-accent">${fmtEur(f.total_ttc)}</td>
                <td class="num text-muted">${fmtEur(paidSum(f))}</td>
                <td>${badgeFor(f)}</td>
                <td><div class="actions">
                  ${isOverdue(f) ? `<button class="icon-btn" title="Relancer le client par email (texte prêt)" aria-label="Relancer la facture ${f.id}" onclick="relancerFacture('${encodeURIComponent(f.id)}')" style="color:var(--warn);border-color:color-mix(in srgb,var(--warn) 45%,transparent);">${icon('clock', 15)}</button>` : ''}
                  <button class="icon-btn" title="Voir / PDF" aria-label="Voir la facture ${f.id} en PDF" onclick="location.href='facture.html?id=${encodeURIComponent(f.id)}'">${icon('filetext', 15)}</button>
                  ${estAvoir(f) ? '' : `<button class="icon-btn" title="Paiement" aria-label="Enregistrer un paiement pour ${f.id}" onclick="openPay('${encodeURIComponent(f.id)}')">${icon('coin', 15)}</button>`}
                  ${estAvoir(f) || avoirExistantPour(f.id) ? '' : `<button class="icon-btn" title="Établir une note de crédit (annule tout ou partie de cette facture)" aria-label="Note de crédit pour ${f.id}" onclick="openAvoir('${encodeURIComponent(f.id)}')" style="color:var(--accent-3);border-color:color-mix(in srgb,var(--accent-3) 45%,transparent);">${icon('arrowleft', 15)}</button>`}
                  <button class="icon-btn danger" title="Supprimer" aria-label="Supprimer la facture ${f.id}" onclick="delFacture('${encodeURIComponent(f.id)}')">${icon('trash', 15)}</button>
                </div></td>
              </tr>`).join('')}</tbody>
          </table>
        </div>`;
    }

    // ── Modal commun ──
    window.closeModal = id => el(id).classList.remove('open');

    // ── Nouvelle facture ──
    window.openNew = (preselectId, preselectType) => {
      // On ne facture qu'un devis SIGNÉ ou TERMINÉ (jamais un brouillon, un refusé ou un annulé).
      const billable = DEVIS.filter(d => ['signe', 'termine'].includes(d.statut));
      if (!billable.length) { toast('Aucun devis signé ou terminé à facturer.', 'warn'); return; }
      const opts = billable.map(d => `<option value="${esc(d.id)}">#${esc(d.id)} — ${esc(d.prenom)} ${esc(d.nom)} (${fmtEur(d.ttc)})</option>`).join('');
      el('mDevis').innerHTML = opts;
      // Échéance et acompte : valeurs par défaut réglables (Paramètres). Le % d'acompte est
      // ensuite écrasé par celui du devis choisi (onDevisPick) — c'est lui qui fait foi.
      const CONF_F = (window.SSConf && window.SSConf.get()) || null;
      el('mEcheance').value = CONF_F ? CONF_F.usage.echeance_facture : 15;
      el('mPct').value = CONF_F ? CONF_F.prix.acompte_pct : 30;
      el('mType').value = 'acompte';
      if (preselectId && DEVIS.some(d => d.id === preselectId)) el('mDevis').value = preselectId;
      if (preselectType) el('mType').value = preselectType;
      onTypePick(); onDevisPick();
      el('modalNew').classList.add('open');
    };
    window.onTypePick = () => {
      const t = el('mType').value;
      el('mPctField').style.display = t === 'acompte' ? 'block' : 'none';
      el('mPosesField').classList.toggle('hidden', t !== 'partielle');
      onDevisPick();
    };
    // Une ligne par ouverture du devis, avec le nombre posé (pré-rempli au total : le cas normal
    // reste « tout est posé »). L'utilisateur ne diminue que ce qui manque.
    async function renderPoses(devis) {
      const host = el('mPoses');
      const items = (devis && devis.items) || [];
      if (!items.length) { host.innerHTML = '<div class="poses-help">Ce devis n’a aucune ouverture détaillée.</div>'; return; }
      host.innerHTML = items.map((it, i) => {
        const q = Number(it.quantite) || 1;
        const nom = (TYPE_ITEM[it.type] || it.type || 'Ouverture') + (it.modele ? ' — ' + it.modele : '');
        const lieu = [it.emplacement, it.etage].filter(Boolean).join(' · ');
        return `<div class="pose-row">
          <div class="pose-nom">${esc(nom)}${lieu ? `<span class="pose-lieu">${esc(lieu)}</span>` : ''}</div>
          <div class="pose-qty">
            <input class="input input-num" type="number" min="0" max="${q}" step="1" value="${q}"
                   id="pose_${i}" aria-label="Nombre posé pour ${esc(nom)}" oninput="updatePreview()">
            <span class="pose-tot">/ ${q}</span>
          </div>
        </div>`;
      }).join('');
    }
    const TYPE_ITEM = { screen: 'Screen', volet_roulant: 'Volet', tente_solaire: 'Tente solaire', tablier_volet: 'Tablier volet', pergola: 'Pergola', store_banne: 'Store banne' };
    // Relit les compteurs saisis. Renvoie null hors mode partiel (computeAmounts facture alors tout).
    function posesSaisies(devis) {
      if (el('mType').value !== 'partielle') return null;
      return ((devis && devis.items) || []).map((it, i) => {
        const champ = el('pose_' + i);
        return champ ? Number(champ.value) : (Number(it.quantite) || 1);
      });
    }
    // Pré-remplit le % d'acompte avec la valeur réelle déjà validée sur le devis
    // (au lieu du 30% par défaut du formulaire) — évite un montant de facture qui ne
    // correspond pas à celui affiché sur le devis du client.
    window.onDevisPick = async () => {
      const id = el('mDevis').value;
      const type = el('mType').value;
      if (id && (type === 'acompte' || type === 'partielle')) {
        const d = await SS.getDevis(id);
        if (d && type === 'acompte') {
          const p = d.pricing_v2 || {}, c = d.calculs || {};
          el('mPct').value = p.acompte_pct != null ? p.acompte_pct : (c.acompte_pct != null ? c.acompte_pct : 30);
        }
        if (d && type === 'partielle') await renderPoses(d);
      }
      updatePreview();
    };

    // Une note de crédit porte un total NÉGATIF : elle vient donc naturellement en déduction du
    // « déjà facturé », ce qui rouvre le devis à la facturation. C'est exactement son rôle.
    const dejaFacture = (devisId) => FACTURES.filter(f => f.devis_id === devisId)
      .reduce((s, f) => s + (Number(f.total_ttc) || 0), 0);
    const avoirExistantPour = (facId) => FACTURES.some(f => f.type === 'avoir' && f.avoir_de === facId);

    // Part du devis réellement posée, exprimée en fraction de sa VALEUR (et non en nombre
    // d'ouvertures) : sur un chantier où toutes les ouvertures n'ont pas le même prix, compter
    // « 28 sur 33 » facturerait de travers. Avec des ouvertures identiques — le cas de l'école —
    // les deux reviennent au même : 28/33 exactement.
    function partPosee(devis, poses) {
      const items = (devis && devis.items) || [];
      let total = 0, retenu = 0;
      items.forEach((it, i) => {
        const q = Number(it.quantite) || 1, pu = Number(it.prix_catalogue_ht) || 0;
        const n = Math.max(0, Math.min(q, poses && poses[i] != null ? Number(poses[i]) : q));
        total += q * pu; retenu += n * pu;
      });
      // Devis sans prix unitaire renseigné : on retombe sur le simple comptage d'ouvertures,
      // sinon la fraction vaudrait 0/0 et la facture serait nulle sans explication.
      if (total <= 0) {
        let qTot = 0, qRet = 0;
        items.forEach((it, i) => {
          const q = Number(it.quantite) || 1;
          qTot += q; qRet += Math.max(0, Math.min(q, poses && poses[i] != null ? Number(poses[i]) : q));
        });
        return qTot > 0 ? qRet / qTot : 1;
      }
      return retenu / total;
    }

    async function computeAmounts(devisId, type, pct, poses) {
      const d = await SS.getDevis(devisId);
      const c = (d && d.calculs) || {};
      const ttc = c.total_ttc || 0, ht = c.total_ht || 0, tva = c.total_tva || 0, tvaPct = c.tva_pct || 6;
      // Déjà facturé pour ce devis (toutes factures) → on ne dépasse JAMAIS le total du devis.
      const already = dejaFacture(devisId);
      const remaining = Math.max(0, ttc - already);
      let factor = 1;
      if (type === 'acompte') {
        const wanted = ttc * ((Number(pct) || 0) / 100);
        factor = ttc > 0 ? Math.min(wanted, remaining) / ttc : 0;   // acompte plafonné au restant
      } else if (type === 'solde') {
        factor = ttc > 0 ? remaining / ttc : 0;                     // solde = tout le restant
      } else if (type === 'partielle') {
        // On facture la part POSÉE, moins ce qui a déjà été facturé (l'acompte, typiquement).
        // Exemple école : 28 des 33 screens posés → 84,85 % de 31 796,82 = 26 979,12 €, moins
        // l'acompte de 9 539,05 € déjà facturé = 17 440,07 € à réclamer aujourd'hui. Le solde des
        // 5 restants (4 817,70 €) se facturera à la fin — les trois montants se recomposent
        // exactement, aucun euro ne se perd en route.
        const cible = ttc * partPosee(d, poses);
        factor = ttc > 0 ? Math.max(0, Math.min(cible - already, remaining)) / ttc : 0;
      } else { // totale : facture unique à 100 %, uniquement si RIEN n'a encore été facturé
        factor = already > 0.005 ? 0 : 1;
      }
      return { devis: d, total_ht: ht * factor, total_tva: tva * factor, total_ttc: ttc * factor,
               tva_pct: tvaPct, factor, already, ttc, part: type === 'partielle' ? partPosee(d, poses) : 1 };
    }

    async function updatePreview() {
      const id = el('mDevis').value, type = el('mType').value, pct = el('mPct').value;
      if (!id) return;
      const d = type === 'partielle' ? await SS.getDevis(id) : null;
      const a = await computeAmounts(id, type, pct, posesSaisies(d));
      let detail = `Montant de la facture : <strong style="color:var(--accent-2)">${fmtEur(a.total_ttc)}</strong> TVAC (HT ${fmtEur(a.total_ht)} + TVA ${fmtEur(a.total_tva)})`;
      if (type === 'partielle') {
        // On montre le raisonnement complet : sans lui, un montant qui n'est ni la part posée ni
        // le total ressemble à une erreur. Avec, il se vérifie de tête.
        const posee = a.ttc * a.part, reste = Math.max(0, a.ttc - posee);
        detail += `<div class="mt-2" style="font-size:var(--fs-2xs);line-height:1.6;">`
          + `Part posée : <strong>${(a.part * 100).toFixed(2).replace('.', ',')} %</strong> du devis = ${fmtEur(posee)}<br>`
          + `− déjà facturé : ${fmtEur(a.already)}<br>`
          + `Restera à facturer après celle-ci : <strong>${fmtEur(reste)}</strong> (les ouvertures pas encore posées)`
          + `</div>`;
      }
      el('mPreview').innerHTML = detail;
    }

    function nextNumber(kind) {
      const year = new Date().getFullYear();
      // Série SÉPARÉE pour les notes de crédit (NC2026-001…). Mélanger les deux dans une même
      // numérotation rend la lecture des livres comptables pénible, et un « trou » dans la série
      // des factures est un signal d'alerte pour un contrôleur — alors qu'ici il serait normal.
      const prefix = (kind === 'avoir' ? 'NC' : 'F') + year + '-';
      // Numéro suivant = (plus grand numéro existant) + 1. JAMAIS basé sur le NOMBRE de factures :
      // sinon supprimer une facture ferait régresser le compteur et RÉÉCRIRAIT une facture existante.
      let maxN = 0;
      FACTURES.forEach(f => {
        const id = String(f.id || '');
        if (id.indexOf(prefix) === 0) { const n = parseInt(id.slice(prefix.length), 10); if (n > maxN) maxN = n; }
      });
      return prefix + String(maxN + 1).padStart(3, '0');
    }

    function buildLines(devis, type, amounts, pct) {
      if (type === 'totale') {
        const lines = (devis.items || []).map(it => ({
          // volet_roulant manquait dans cette table : une facture de volets imprimait « volet_roulant ».
          desc: ({ screen: 'Screen', volet_roulant: 'Volet', tente_solaire: 'Tente solaire', tablier_volet: 'Tablier volet', pergola: 'Pergola', store_banne: 'Store banne' }[it.type] || it.type) + (it.modele ? ' — ' + it.modele : ''),
          sub: [it.moteur, it.emplacement].filter(Boolean).join(' · '),
          dims: window.SSUI.dimsOf(it) || '—',
          qty: it.quantite || 1, pu: it.prix_catalogue_ht || 0, total: (it.prix_catalogue_ht || 0) * (it.quantite || 1),
        }));
        const c = devis.calculs || {};
        // Même structure que le devis (app/devis.html) pour que facture et devis correspondent
        // ligne à ligne : fournitures BRUTES + ligne de remise, installation BRUTE + ligne de remise.
        // Sans ces lignes de remise, la facture affichait des lignes qui ne totalisaient pas le
        // montant réellement dû (écart = remise catalogue + remise outillage).
        const rc = (c.remise_catalogue && c.remise_catalogue.amount) || 0;
        if (rc > 0) lines.push({ desc: 'Remise commerciale', qty: 1, pu: -rc, total: -rc });
        if (c.install_total_brut > 0) lines.push({ desc: 'Installation et pose', qty: 1, pu: c.install_total_brut, total: c.install_total_brut });
        // La remise installation ET la remise outillage réduisent toutes deux le forfait de pose.
        const ri = ((c.remise_installation && c.remise_installation.amount) || 0) + ((c.remise_outillage && c.remise_outillage.amount) || 0);
        if (ri > 0) lines.push({ desc: 'Remise commerciale', qty: 1, pu: -ri, total: -ri });
        (c.extra_lines || []).forEach(e => lines.push({ desc: e.label, qty: e.qty, pu: e.unit_price_ht, total: e.total_ht }));
        const surplus = devis.pricing_v2 && devis.pricing_v2.surplus_difficulte;
        if (surplus > 0) lines.push({ desc: 'Supplément accès difficile', qty: 1, pu: surplus, total: surplus });
        return lines;
      }
      if (type === 'partielle') {
        // La ligne DIT ce qui est facturé : « 28 ouvertures posées sur 33 ». Une facture partielle
        // muette sur son périmètre serait incompréhensible pour le client comme pour le comptable.
        const items = devis.items || [];
        const poses = amounts.poses || [];
        let nPose = 0, nTot = 0;
        items.forEach((it, i) => {
          const q = Number(it.quantite) || 1;
          nTot += q;
          nPose += (poses[i] != null ? Math.max(0, Math.min(q, Number(poses[i]))) : q);
        });
        const sub = `Ouvertures posées à ce jour — le solde sera facturé après la pose des ${Math.max(0, nTot - nPose)} restantes`;
        return [{ desc: `Travaux exécutés sur devis N° ${devis.id} — ${nPose} ouverture${nPose > 1 ? 's' : ''} posée${nPose > 1 ? 's' : ''} sur ${nTot}`,
                  sub: nTot > nPose ? sub : '', qty: 1, pu: amounts.total_ht, total: amounts.total_ht }];
      }
      const label = type === 'acompte' ? `Acompte de ${pct} % sur devis N° ${devis.id}` : `Solde sur devis N° ${devis.id}`;
      return [{ desc: label, qty: 1, pu: amounts.total_ht, total: amounts.total_ht }];
    }

    window.createFacture = async () => {
      const id = el('mDevis').value, type = el('mType').value, pct = Number(el('mPct').value) || 30;
      // Rafraîchit la liste avant de numéroter (évite une collision de numéro si Yannick a créé une
      // facture entre-temps) et pour recalculer le « déjà facturé » à jour.
      FACTURES = (await SS.listFactures()) || FACTURES;
      const dSel = type === 'partielle' ? await SS.getDevis(id) : null;
      const poses = posesSaisies(dSel);
      const a = await computeAmounts(id, type, pct, poses);
      a.poses = poses;
      if (!a.devis) { toast('Devis introuvable', 'error'); return; }
      if (!['signe', 'termine'].includes(a.devis.statut)) { toast('On ne facture qu\'un devis signé ou terminé (statut actuel : ' + (a.devis.statut || '?') + ').', 'warn', 4000); return; }
      if (type === 'totale' && a.already > 0.005) { toast('Des factures existent déjà pour ce devis — utilise « Solde » pour le restant.', 'warn', 4000); return; }
      if (a.total_ttc <= 0) { toast('Montant nul (devis déjà entièrement facturé ?)', 'warn'); return; }
      const num = nextNumber();
      const facture = {
        id: num, type, devis_id: id,
        date: today(), echeance: addDays(Number(el('mEcheance').value) || 15),
        client: a.devis.client || {},
        lines: buildLines(a.devis, type, a, pct),
        total_ht: Math.round(a.total_ht * 100) / 100, total_tva: Math.round(a.total_tva * 100) / 100,
        total_ttc: Math.round(a.total_ttc * 100) / 100, tva_pct: a.tva_pct, devis_ttc: a.devis.calculs && a.devis.calculs.total_ttc,
        paiements: [], date_creation: new Date().toISOString(),
      };
      const resFac = await SS.saveFacture(facture);
      // ⚠️ Comptabilité : si la facture n'a pas atteint le serveur, il ne FAUT PAS continuer —
      // son numéro (nextNumber = max+1) serait réattribué à la facture suivante, créant deux
      // pièces au même numéro, ce qui n'est pas rattrapable.
      if (resFac.ok === false) { toast(resFac.error || 'Facture NON créée — réessaie.', 'error', 7000); return; }
      closeModal('modalNew');
      toast(resFac.offline ? 'Facture ' + num + ' créée (hors-ligne)' : 'Facture ' + num + ' créée ✓', resFac.offline ? 'warn' : 'ok');
      await load();
      location.href = 'facture.html?id=' + encodeURIComponent(num);
    };

    // ── Paiement ──
    // ── NOTE DE CRÉDIT ─────────────────────────────────────────────────────────────────────────
    // Une facture partie chez le client ne se modifie pas et ne se supprime pas : on l'annule par
    // une pièce en sens inverse, qui reste elle aussi dans les livres. C'est la règle comptable,
    // et c'est aussi ce qui permet de refacturer le devis proprement ensuite : le total négatif
    // vient en déduction du « déjà facturé » et rouvre le montant disponible.
    let avoirTarget = null;
    window.openAvoir = (encId) => {
      const id = decodeURIComponent(encId);
      avoirTarget = FACTURES.find(f => f.id === id);
      if (!avoirTarget) return;
      const paye = paidSum(avoirTarget);
      el('avInfo').innerHTML = `Annulation de la facture <strong>${esc(id)}</strong> de ${fmtEur(avoirTarget.total_ttc)} TVAC.`
        + (paye > 0 ? `<br><span style="color:var(--warn)">Attention : ${fmtEur(paye)} ont déjà été encaissés sur cette facture — prévois le remboursement ou l'imputation sur la prochaine.</span>` : '');
      el('avMontant').value = Math.round((avoirTarget.total_ttc || 0) * 100) / 100;
      el('avMotif').value = '';
      updateAvoirPreview();
      el('modalAvoir').classList.add('open');
    };
    window.updateAvoirPreview = () => {
      if (!avoirTarget) return;
      const m = Number(el('avMontant').value) || 0;
      const total = avoirTarget.total_ttc || 0;
      const restant = Math.round((total - m) * 100) / 100;
      el('avPreview').innerHTML = m >= total - 0.005
        ? 'La facture sera <strong>entièrement annulée</strong>. Le devis redeviendra facturable en totalité.'
        : `Annulation partielle : il restera <strong>${fmtEur(restant)}</strong> dû sur cette facture.`;
    };
    window.createAvoir = async () => {
      if (!avoirTarget) return;
      const montant = Number(el('avMontant').value) || 0;
      const total = avoirTarget.total_ttc || 0;
      if (montant <= 0) { toast('Montant invalide', 'warn'); return; }
      if (montant > total + 0.005) { toast('Une note de crédit ne peut pas dépasser le montant de la facture.', 'warn', 5000); return; }
      // Relit la liste avant de numéroter : Yannick a pu créer une pièce entre-temps.
      FACTURES = (await SS.listFactures()) || FACTURES;
      const tvaPct = avoirTarget.tva_pct || 6;
      const ht = Math.round((montant / (1 + tvaPct / 100)) * 100) / 100;
      const num = nextNumber('avoir');
      const motif = (el('avMotif').value || '').trim();
      const avoir = {
        id: num, type: 'avoir', avoir_de: avoirTarget.id, devis_id: avoirTarget.devis_id,
        date: today(), echeance: today(),        // une note de crédit n'a pas d'échéance à courir
        client: avoirTarget.client || {},
        lines: [{ desc: `Annulation de la facture N° ${avoirTarget.id}`, sub: motif, qty: 1, pu: -ht, total: -ht }],
        total_ht: -ht, total_tva: -(Math.round((montant - ht) * 100) / 100), total_ttc: -Math.round(montant * 100) / 100,
        tva_pct: tvaPct, motif: motif, paiements: [], date_creation: new Date().toISOString(),
      };
      const res = await SS.saveFacture(avoir);
      if (res.ok === false) { toast(res.error || 'Note de crédit NON créée — réessaie.', 'error', 7000); return; }
      closeModal('modalAvoir');
      toast(res.offline ? 'Note de crédit ' + num + ' créée (hors-ligne)' : 'Note de crédit ' + num + ' créée ✓', res.offline ? 'warn' : 'ok');
      SS.logActivity && SS.logActivity({ action: 'facture.avoir', entity_type: 'facture', entity_id: num,
        label: `Note de crédit ${num} de ${fmtEur(montant)} sur la facture ${avoirTarget.id}` });
      await load();
    };

    window.openPay = async (encId) => {
      const id = decodeURIComponent(encId);
      payTarget = FACTURES.find(f => f.id === id);
      if (!payTarget) return;
      const reste = (payTarget.total_ttc || 0) - paidSum(payTarget);
      el('payInfo').innerHTML = `Facture <strong>${esc(id)}</strong> — total ${fmtEur(payTarget.total_ttc)}, déjà payé ${fmtEur(paidSum(payTarget))}.<br>Reste dû : <strong style="color:var(--accent-2)">${fmtEur(reste)}</strong>`;
      renderPaiements();
      el('payMontant').value = (Math.round(reste * 100) / 100) || '';
      el('payDate').value = today();
      el('modalPay').classList.add('open');
    };
    // Liste des encaissements déjà saisis, chacun retirable. Il n'existait AUCUN moyen de corriger
    // une saisie : un montant tapé sur la mauvaise facture — le cas des règlements pointés sur la
    // facture d'acompte — restait à vie et faussait le « reste à encaisser ».
    function renderPaiements() {
      const host = el('payList');
      const arr = (payTarget && payTarget.paiements) || [];
      if (!arr.length) { host.innerHTML = ''; return; }
      host.innerHTML = `<div class="pay-hist-t">Encaissements déjà enregistrés</div>`
        + arr.map((p, i) => `<div class="pay-hist">
             <span class="ph-d">${fmtDate(p.date)}</span>
             <span class="ph-m">${fmtEur(p.montant)}</span>
             <span class="ph-y">${esc(p.moyen || '')}</span>
             <button type="button" class="ph-x" title="Retirer cet encaissement" aria-label="Retirer l'encaissement du ${fmtDate(p.date)}" onclick="removePaiement(${i})">${icon('trash', 13)}</button>
           </div>`).join('');
    }
    window.removePaiement = async (i) => {
      if (!payTarget) return;
      const p = (payTarget.paiements || [])[i];
      if (!p) return;
      if (!confirm(`Retirer l'encaissement de ${fmtEur(p.montant)} du ${fmtDate(p.date)} ?\n\nLa facture ${payTarget.id} redeviendra due de ce montant.`)) return;
      const sauvegarde = payTarget.paiements.slice();
      payTarget.paiements.splice(i, 1);
      payTarget.date_modification = new Date().toISOString();
      const res = await SS.saveFacture(payTarget);
      if (res.ok === false) {
        payTarget.paiements = sauvegarde;   // rien n'a atteint le serveur : on remet en état
        toast(res.error || 'Encaissement NON retiré — réessaie.', 'error', 7000);
        return;
      }
      SS.logActivity && SS.logActivity({ action: 'facture.paiement.retire', entity_type: 'facture', entity_id: payTarget.id,
        label: `Encaissement de ${fmtEur(p.montant)} retiré de la facture ${payTarget.id}` });
      toast('Encaissement retiré', 'ok');
      const reste = (payTarget.total_ttc || 0) - paidSum(payTarget);
      el('payInfo').innerHTML = `Facture <strong>${esc(payTarget.id)}</strong> — total ${fmtEur(payTarget.total_ttc)}, déjà payé ${fmtEur(paidSum(payTarget))}.<br>Reste dû : <strong style="color:var(--accent-2)">${fmtEur(reste)}</strong>`;
      renderPaiements();
      el('payMontant').value = (Math.round(reste * 100) / 100) || '';
      await load();
    };
    window.savePayment = async () => {
      if (!payTarget) return;
      const montant = Number(el('payMontant').value) || 0;
      if (montant <= 0) { toast('Montant invalide', 'warn'); return; }
      // Garde-fou comptable : encaisser PLUS que le montant facturé rend le « reste dû » négatif et
      // gonfle le CA encaissé. Cas réel rencontré : le client règle tout d'un coup et la somme est
      // saisie sur la facture d'acompte. On ne bloque pas (ça arrive), on demande confirmation et on
      // rappelle la bonne pratique : créer la facture de solde pour le complément.
      const resteDu = Math.round(((payTarget.total_ttc || 0) - paidSum(payTarget)) * 100) / 100;
      if (montant > resteDu + 0.01) {
        const ok = confirm(
          `Ce paiement (${fmtEur(montant)}) dépasse le reste dû de cette facture (${fmtEur(resteDu)}).\n\n` +
          `Le trop-perçu apparaîtra comme un solde négatif et faussera le CA encaissé.\n\n` +
          `OK = enregistrer quand même · Annuler = corriger (et facturer le solde à part)`
        );
        if (!ok) return;
      }
      payTarget.paiements = payTarget.paiements || [];
      payTarget.paiements.push({ date: el('payDate').value || today(), montant, moyen: el('payMoyen').value });
      payTarget.date_modification = new Date().toISOString();
      const resPay = await SS.saveFacture(payTarget);
      if (resPay.ok === false) {
        payTarget.paiements.pop();   // l'encaissement n'a pas été enregistré : on annule en local
        toast(resPay.error || 'Paiement NON enregistré — réessaie.', 'error', 7000);
        return;
      }
      closeModal('modalPay');
      toast(resPay.offline ? 'Paiement enregistré (hors-ligne)' : 'Paiement enregistré ✓', resPay.offline ? 'warn' : 'ok');
      await load();
    };

    // ── Relance d'une facture en retard : email prêt à envoyer ──────────────────────────────
    // Pendant financier des relances de devis : texte poli généré depuis la facture (montant,
    // échéance, reste dû, IBAN, communication), copié dans le presse-papier ET ouvert dans le
    // client mail. Sans email sur la fiche, le texte copié se colle dans un SMS/WhatsApp.
    window.relancerFacture = (encId) => {
      const f = FACTURES.find(x => x.id === decodeURIComponent(encId));
      if (!f) return;
      const cl = f.client || {};
      const paye = paidSum(f);
      const reste = Math.max(0, (f.total_ttc || 0) - paye);
      const co = window.SS_COMPANY || {};
      const body = `Bonjour ${[cl.prenom, cl.nom].filter(Boolean).join(' ')},\n\n`
        + `Sauf erreur de notre part, la facture n°${f.id} d'un montant de ${fmtEur(f.total_ttc || 0)} (échéance le ${fmtDate(f.echeance)}) reste en attente de paiement`
        + (paye > 0 ? ` — il reste ${fmtEur(reste)} à percevoir` : '') + `.\n\n`
        + `Le règlement peut être effectué sur le compte ${co.iban || 'BE82 7320 7855 2368'} avec la communication « ${f.id} ».\n\n`
        + `Si le paiement a été effectué ces derniers jours, merci de ne pas tenir compte de ce message.\n\nBien à vous,\n${co.name || 'SolariScreen'}`;
      try { navigator.clipboard.writeText(body); } catch (e) {}
      const email = String(cl.email || '').split(',')[0].trim();
      if (email) {
        location.href = 'mailto:' + encodeURIComponent(email) + '?subject=' + encodeURIComponent('Rappel de paiement — facture ' + f.id + ' (SolariScreen)') + '&body=' + encodeURIComponent(body);
        toast('Email de rappel préparé — le texte est aussi copié ✓', 'ok', 3500);
      } else {
        toast('Pas d\'email sur cette facture — texte de rappel copié : colle-le dans un SMS ou WhatsApp.', 'warn', 6000);
      }
    };

    window.delFacture = async (encId) => {
      if (!confirm('Supprimer cette facture ?')) return;
      const resDel = await SS.deleteFacture(decodeURIComponent(encId));
      if (resDel.ok === false) { toast(resDel.error || 'Suppression refusée.', 'error', 6000); return; }
      toast('Facture supprimée', 'warn');
      await load();
    };

    (async () => {
      await load();
      const devisId = qp('devis');
      if (devisId) openNew(devisId, qp('type'));
    })();
  </script>
</body>
</html>
