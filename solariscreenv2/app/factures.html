<!DOCTYPE html>
<html lang="fr" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>SolariScreen — Facturation</title>
  <!-- ── Installation sur l'écran d'accueil (Android + iPhone) — aucun service worker ── -->
  <link rel="manifest" href="../manifest.webmanifest">
  <meta name="theme-color" content="#0b1224" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#f4f6fb" media="(prefers-color-scheme: light)">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="SolariScreen">
  <link rel="apple-touch-icon" href="../assets/img/apple-touch-icon.png">
  <link rel="icon" type="image/svg+xml" href="../assets/img/logo-solariscreen.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600;700&family=Orbitron:wght@600;800&display=swap" rel="stylesheet">
  <script src="../assets/js/theme.js"></script>
  <link rel="stylesheet" href="../assets/css/tokens.css">
  <link rel="stylesheet" href="../assets/css/theme-dark.css">
  <link rel="stylesheet" href="../assets/css/theme-light.css">
  <link rel="stylesheet" href="../assets/css/theme-cyberpunk.css">
  <link rel="stylesheet" href="../assets/css/theme-zen.css">
  <link rel="stylesheet" href="../assets/css/theme-ardoise.css">
  <link rel="stylesheet" href="../assets/css/base.css">
  <style>
    /* A — UNE ligne de résumé (les quatre tuiles prenaient 342 px sur téléphone). Chaque chiffre
       est un bouton : il MÈNE à ce qu'il compte (règle 15 quater). */
    .fa-resume { display: flex; flex-wrap: wrap; align-items: baseline; gap: 0.3rem 0.9rem; margin-bottom: var(--sp-3); font-size: var(--fs-sm); color: var(--text-muted); }
    .fa-resume b { color: var(--text); font-size: var(--fs-md); }
    .fa-resume button { background: none; border: 0; padding: 0; font: inherit; color: inherit; cursor: pointer; text-decoration: underline; text-decoration-style: dotted; text-underline-offset: 3px; }
    .fa-resume .danger { color: var(--danger); font-weight: 600; }
    .fa-resume .warn { color: var(--warn); font-weight: 600; }
    .fa-afact { border: 1px solid color-mix(in srgb, var(--warn) 45%, var(--border)); border-radius: var(--r-md); background: var(--surface); padding: var(--sp-3) var(--sp-4); margin-bottom: var(--sp-4); }
    .fa-afact h2 { font-size: var(--fs-md); margin: 0 0 var(--sp-1); }
    .fa-afact .aide { font-size: var(--fs-2xs); color: var(--text-subtle); margin-bottom: var(--sp-2); }
    .fa-al { display: flex; flex-wrap: wrap; align-items: center; gap: 0.3rem var(--sp-3); padding: 0.45rem 0; border-top: 1px solid var(--border); }
    .fa-al .txt { flex: 1 1 14rem; min-width: 0; overflow-wrap: anywhere; }
    .fa-al .txt small { display: block; color: var(--text-subtle); font-size: var(--fs-2xs); }
    .fa-al .mt { font-family: var(--font-mono); font-weight: 700; white-space: nowrap; }
    .fa-barre { display: flex; gap: var(--sp-2) var(--sp-3); align-items: center; flex-wrap: wrap; margin-bottom: var(--sp-4); }
    .fa-barre .search { flex: 1 1 16rem; min-width: 0; position: relative; }
    .fa-barre .search input { padding-left: 2.2rem; }
    .fa-barre .search svg { position: absolute; left: 0.7rem; top: 50%; transform: translateY(-50%); width: 14px; height: 14px; color: var(--text-subtle); pointer-events: none; }
    .fa-barre .select { flex: 0 1 13rem; min-width: 0; }
    .fa-vue { display: inline-flex; border: 1px solid var(--border-strong); border-radius: var(--r-sm); overflow: hidden; flex: 0 0 auto; }
    .fa-vue button { background: none; border: 0; padding: 0.35rem 0.7rem; font: inherit; font-size: var(--fs-xs); color: var(--text-muted); cursor: pointer; }
    .fa-vue button.on { background: var(--accent); color: var(--bg); }

    /* ── Une facture : un tableau au bureau, une CARTE sous 1 100 px — la feuille de style seule
       décide (règle 24). Sur téléphone, le tableau faisait 993 px dans un écran de 331 :
       « Encaisser » était à trois écrans de défilement vers la droite. ── */
    .fa-tete, .fa-ligne { display: grid; grid-template-columns: 8.5rem minmax(9rem, 1.5fr) 7.5rem 7.5rem 7.5rem minmax(7.5rem, 1fr) auto;
      gap: var(--sp-3); align-items: center; padding: 0.55rem var(--sp-4); }
    .fa-tete { font-family: var(--font-mono); font-size: var(--fs-3xs); text-transform: uppercase; letter-spacing: 0.06em; color: var(--text-subtle); border-bottom: 1px solid var(--border); }
    .fa-tete .num, .fa-ligne .fl-mt, .fa-ligne .fl-du { text-align: right; }
    .fa-ligne { border-bottom: 1px solid var(--border); min-width: 0; }
    .fa-ligne > * { min-width: 0; }
    .fa-ligne.retard { box-shadow: inset 3px 0 0 var(--danger); }
    .fl-num .id { font-family: var(--font-mono); font-size: var(--fs-sm); }
    .fl-client a { font-weight: 600; color: inherit; overflow-wrap: anywhere; }
    .fl-client small, .fl-dates small, .fl-st small { display: block; font-size: var(--fs-2xs); color: var(--text-subtle); overflow-wrap: anywhere; }
    .fl-dates { font-size: var(--fs-xs); color: var(--text-muted); }
    .fl-dates .retard { color: var(--danger); font-weight: 600; }
    .fl-mt, .fl-du { font-family: var(--font-mono); font-size: var(--fs-sm); white-space: nowrap; }
    .fl-du.du { color: var(--accent-2-ink); font-weight: 700; }
    .fl-st .arel { color: var(--warn); font-weight: 600; }
    .fl-act { display: flex; flex-wrap: wrap; gap: 0.35rem; justify-content: flex-end; }
    .fl-plus { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: var(--sp-2); align-items: center; padding-top: var(--sp-2); border-top: 1px dashed var(--border); }
    .fl-plus .note { font-size: var(--fs-2xs); color: var(--text-subtle); }
    .lab { display: none; font-family: var(--font-mono); font-size: var(--fs-3xs); text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-subtle); }
    /* F — La référence Falco, saisie DANS la ligne (plus de boîte de dialogue) */
    .falco { display: block; margin-top: 0.15rem; background: none; border: none; padding: 0; font-family: var(--font-mono); font-size: var(--fs-3xs); color: var(--accent-2); cursor: pointer; text-align: left; }
    .falco.vide { color: var(--warn); }
    .falco-edit { display: flex; gap: 0.25rem; margin-top: 0.2rem; }
    .falco-edit .input { padding: 0.2rem 0.4rem; min-width: 0; width: 100%; }
    /* C — Par chantier */
    .fa-chantiers { display: grid; gap: var(--sp-3); }
    .fa-chantier { border: 1px solid var(--border); border-radius: var(--r-md); background: var(--surface); min-width: 0; }
    .fa-chantier.retard { border-color: color-mix(in srgb, var(--danger) 50%, var(--border)); }
    .fc-tete { display: flex; flex-wrap: wrap; justify-content: space-between; gap: var(--sp-1) var(--sp-3); padding: var(--sp-3) var(--sp-4) var(--sp-2); }
    .fc-tete .nom { font-weight: 700; overflow-wrap: anywhere; min-width: 0; }
    .fc-tete .nom small { display: block; font-weight: 400; font-size: var(--fs-2xs); color: var(--text-subtle); }
    .fc-chiffres { display: flex; flex-wrap: wrap; gap: 0.2rem var(--sp-3); font-size: var(--fs-xs); color: var(--text-muted); padding: 0 var(--sp-4) var(--sp-2); }
    .fc-chiffres b { font-family: var(--font-mono); color: var(--text); }
    .fc-chiffres .du b { color: var(--accent-2-ink); }
    .fc-chiffres .retard b { color: var(--danger); }
    .fc-suite { display: flex; flex-wrap: wrap; align-items: center; gap: var(--sp-2); padding: var(--sp-2) var(--sp-4) var(--sp-3); font-size: var(--fs-xs); color: var(--text-muted); }
    /* En mono comme les autres montants : en Inter, l'espace des milliers (U+202F) fait 1,5 px et « 3 667,60 » se lisait « 3667,60 ». */
    .fc-suite b { font-family: var(--font-mono); color: var(--text); }
    .fa-chantier .fa-ligne { grid-template-columns: 8.5rem 7.5rem 7.5rem 7.5rem minmax(7.5rem, 1fr) auto; }
    .fa-chantier .fl-client { display: none; }

    @media (max-width: 1100px) {
      .fa-tete { display: none; }
      .fa-liste { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(320px, 100%), 1fr)); gap: var(--sp-3); }
      .fa-ligne, .fa-chantier .fa-ligne { grid-template-columns: minmax(0, 1fr) auto; grid-template-areas: "num st" "client client" "dates dates" "mt du" "act act" "plus plus";
        gap: 0.35rem var(--sp-3); border: 1px solid var(--border); border-radius: var(--r-md); background: var(--surface); padding: var(--sp-3); }
      .fa-chantier .fa-ligne { grid-template-areas: "num st" "dates dates" "mt du" "act act" "plus plus"; border-width: 1px 0 0; border-radius: 0; background: none; }
      .fl-num { grid-area: num; } .fl-st { grid-area: st; text-align: right; } .fl-client { grid-area: client; } .fl-dates { grid-area: dates; }
      .fl-mt { grid-area: mt; text-align: left !important; } .fl-du { grid-area: du; text-align: right; } .fl-act { grid-area: act; justify-content: stretch; } .fl-plus { grid-area: plus; }
      .fl-act .btn { flex: 1 1 auto; justify-content: center; }
      .fl-act .btn.plus { flex: 0 0 auto; }
      .lab { display: block; }
      .fa-ligne.retard { box-shadow: none; border-color: color-mix(in srgb, var(--danger) 55%, var(--border)); }
    }
    @media (max-width: 560px) {
      .fa-barre .select { flex: 1 1 10rem; }
    }

    /* ── Les fenêtres : même gabarit et mêmes règles que le reste de l'ERP (règle 13 bis) ── */
    .fa-overlay { position: fixed; inset: 0; background: color-mix(in srgb, var(--bg) 72%, transparent); z-index: var(--z-overlay, 1000); display: none; align-items: flex-start; justify-content: center; padding: var(--sp-5) var(--sp-3); overflow-y: auto; }
    .fa-overlay.open { display: flex; }
    .fa-dialog { width: 100%; max-width: 560px; background: var(--surface); border: 1px solid var(--border-strong); border-radius: var(--r-lg); box-shadow: var(--shadow-lg, var(--shadow)); }
    .fa-dhead { display: flex; align-items: center; justify-content: space-between; gap: var(--sp-2); padding: var(--sp-4) var(--sp-4) var(--sp-3); border-bottom: 1px solid var(--border); }
    .fa-dhead h2 { font-family: var(--font-display); font-size: var(--fs-lg); min-width: 0; overflow-wrap: anywhere; }
    .fa-dbody { padding: var(--sp-4); display: flex; flex-direction: column; gap: var(--sp-3); }
    .fa-dfoot { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: var(--sp-2); padding: var(--sp-3) var(--sp-4) var(--sp-4); border-top: 1px solid var(--border); }
    .fa-info { font-size: var(--fs-sm); color: var(--text-muted); line-height: 1.6; }
    .fa-info.warn { color: var(--warn); }
    .fa-row2 { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: var(--sp-3); }
    .poses-help { font-size: var(--fs-2xs); color: var(--text-subtle); line-height: 1.5; margin-bottom: var(--sp-2); }
    .pose-row { display: flex; align-items: center; gap: var(--sp-3); padding: 0.4rem 0; border-bottom: 1px dashed var(--border); }
    .pose-row:last-child { border-bottom: none; }
    .pose-nom { flex: 1; min-width: 0; font-size: var(--fs-sm); overflow-wrap: anywhere; }
    .pose-lieu { display: block; font-size: var(--fs-2xs); color: var(--text-subtle); }
    .pose-qty { flex: none; display: flex; align-items: center; gap: 0.35rem; }
    .pose-qty .input { width: 72px; text-align: center; }
    .pose-tot { font-family: var(--font-mono); font-size: var(--fs-2xs); color: var(--text-subtle); }
    .pay-hist-t { font-family: var(--font-mono); font-size: var(--fs-3xs); text-transform: uppercase; letter-spacing: 0.08em; color: var(--text-subtle); margin-bottom: 0.3rem; }
    .pay-hist { display: flex; align-items: center; gap: var(--sp-3); padding: 0.35rem 0; border-bottom: 1px dashed var(--border); font-size: var(--fs-xs); flex-wrap: wrap; }
    .pay-hist .ph-d { font-family: var(--font-mono); color: var(--text-muted); flex: none; }
    .pay-hist .ph-m { font-family: var(--font-mono); font-weight: 700; color: var(--ok); flex: none; }
    .pay-hist .ph-y { flex: 1 1 6rem; min-width: 0; color: var(--text-subtle); overflow-wrap: anywhere; }
    .fa-repart { border: 1px dashed var(--border-strong); border-radius: var(--r-sm); padding: var(--sp-2) var(--sp-3); font-size: var(--fs-sm); }
    .fa-repart .l { display: flex; justify-content: space-between; gap: var(--sp-2); padding: 0.15rem 0; font-family: var(--font-mono); font-size: var(--fs-xs); }
    .fa-texte { font-family: var(--font-body, inherit); min-height: 220px; }
    .fa-seg { display: inline-flex; border: 1px solid var(--border-strong); border-radius: var(--r-sm); overflow: hidden; margin-bottom: 0.4rem; }
    .fa-seg button { background: none; border: 0; padding: 0.3rem 0.7rem; font: inherit; font-size: var(--fs-xs); color: var(--text-muted); cursor: pointer; }
    .fa-seg button.on { background: var(--accent); color: var(--bg); }
    @media (max-width: 560px) { .fa-row2 { grid-template-columns: minmax(0, 1fr); } }
    /* Sur écran tactile, ces boutons maison n'ont pas la taille que base.css donne aux .btn (piège
       « pointer: coarse ») : mesuré sur l'aperçu, « + pièce Falco » faisait 13 px de haut, les chiffres
       du résumé 21. 36 px se touchent sans viser, sans faire descendre la page d'un écran. */
    @media (pointer: coarse) {
      .falco { min-height: 36px; }   /* reste un bloc : en ligne, il se collait au numéro (« F2026-006+ pièce Falco ») */
      .fa-resume button, .fa-vue button, .fa-seg button { min-height: 36px; }
    }
  </style>
</head>
<body>
  <div class="fx-grid"></div>

  <header class="app-header">
    <div class="brand">
      <span class="brand-logo"><img src="../assets/img/logo-solariscreen.svg" alt="" onerror="this.style.display='none'"></span>
      <div><h1><a href="dashboard.html">SOLARISCREEN</a></h1><div class="module">Facturation</div></div>
    </div>
    <div class="header-actions">
      <button class="btn btn-primary btn-sm" onclick="ouvrirNouvelle()" title="Nouvelle facture"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg> Nouvelle facture</button>
      <span id="quickNav"></span>
      <span id="themeToggle"></span>
      <a class="btn btn-ghost btn-sm" href="dashboard.html" title="Tableau de bord"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg> Dashboard</a>
    </div>
  </header>

  <main class="container">
    <div class="fa-resume" id="resume"></div>
    <div id="aFacturer"></div>
    <div class="fa-barre">
      <div class="search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <label for="search" class="sr-only">Rechercher une facture</label>
        <input class="input" id="search" placeholder="N°, réf. Falco, client, n° de devis…" oninput="render()" autocomplete="off">
      </div>
      <label for="filtre" class="sr-only">Filtrer les factures</label>
      <select class="select" id="filtre" onchange="render()">
        <option value="tous">Toutes</option>
        <option value="du">À encaisser</option>
        <option value="retard">En retard</option>
        <option value="arelancer">À relancer</option>
        <option value="payee">Payées</option>
        <option value="sansfalco">Sans pièce Falco</option>
        <option value="avoir">Notes de crédit</option>
      </select>
      <div class="fa-vue" role="group" aria-label="Vue">
        <button type="button" data-vue="chantier" onclick="setVue('chantier')">Par chantier</button>
        <button type="button" data-vue="facture" onclick="setVue('facture')">Par facture</button>
      </div>
      <button class="btn btn-ghost btn-sm" onclick="ouvrirExport()">Export comptable</button>
    </div>
    <div id="liste"><div aria-busy="true"><div class="skl" style="height:90px;margin-bottom:var(--sp-3)"></div><div class="skl" style="height:90px"></div></div></div>
  </main>

  <!-- ══════ NOUVELLE FACTURE ══════ -->
  <div class="fa-overlay" id="fenNouv">
    <div class="fa-dialog ticked" role="dialog" aria-modal="true" aria-labelledby="nvTitre">
      <div class="fa-dhead"><h2 id="nvTitre">Nouvelle facture</h2><button class="btn btn-ghost btn-sm" onclick="fermerFenetre()">Fermer</button></div>
      <div class="fa-dbody">
        <div class="field"><label class="label" for="mDevis">Devis à facturer</label><select class="select" id="mDevis" onchange="choixDevis()"></select></div>
        <div class="field"><label class="label" for="mType">Type de facture</label>
          <select class="select" id="mType" onchange="choixType()">
            <option value="acompte">Facture d'acompte</option>
            <option value="partielle">Facture partielle — ce qui est posé</option>
            <option value="solde">Facture de solde</option>
            <option value="totale">Facture totale</option>
          </select></div>
        <!-- Deux unités, UN seul champ : deux champs qui définissent la même chose, on ne sait plus lequel fait foi. -->
        <div class="field" id="mPctField">
          <label class="label" for="mPct">Acompte</label>
          <div class="fa-seg" id="mUnite"><button type="button" data-unite="pct" class="on" onclick="setUnite('pct')">En %</button><button type="button" data-unite="eur" onclick="setUnite('eur')">En €</button></div>
          <div class="input-unit"><input class="input input-num" id="mPct" type="number" min="0" max="100" value="30" oninput="apercu()"><span class="unit" id="mPctUnite">%</span></div>
        </div>
        <div class="field hidden" id="mPosesField">
          <span class="label">Ouvertures réellement posées</span>
          <div class="poses-help">Laisse le compte complet pour ce qui est terminé, réduis-le pour ce qui reste à poser. Le montant se recalcule tout seul.</div>
          <div id="mPoses"></div>
        </div>
        <div class="fa-row2">
          <div class="field"><label class="label" for="mRefExterne">Référence SysCore / Falco <span class="text-muted" style="font-weight:400">(facultatif)</span></label><input class="input" id="mRefExterne" placeholder="Ex : 2600001" autocomplete="off"></div>
          <div class="field"><label class="label" for="mEcheance">Échéance (jours)</label><input class="input input-num" id="mEcheance" type="number" min="0" value="15"></div>
        </div>
        <div id="mApercu" class="fa-info"></div>
      </div>
      <div class="fa-dfoot"><button class="btn btn-ghost btn-sm" onclick="fermerFenetre()">Annuler</button><button class="btn btn-primary btn-sm" id="mCreer" onclick="creerFacture()">Générer</button></div>
    </div>
  </div>

  <!-- ══════ ENCAISSER (E — répartir un virement) ══════ -->
  <div class="fa-overlay" id="fenPay">
    <div class="fa-dialog ticked" role="dialog" aria-modal="true" aria-labelledby="payTitre">
      <div class="fa-dhead"><h2 id="payTitre">Encaisser</h2><button class="btn btn-ghost btn-sm" onclick="fermerFenetre()">Fermer</button></div>
      <div class="fa-dbody">
        <div id="payInfo" class="fa-info"></div>
        <div id="payList"></div>
        <div class="fa-row2">
          <div class="field"><label class="label" for="payMontant">Montant reçu</label><div class="input-unit"><input class="input input-num" id="payMontant" type="number" step="0.01" inputmode="decimal" oninput="apercuPay()"><span class="unit">€</span></div></div>
          <div class="field"><label class="label" for="payDate">Date</label><input class="input" id="payDate" type="date"></div>
        </div>
        <div class="field"><label class="label" for="payMoyen">Moyen</label>
          <select class="select" id="payMoyen"><option>Virement</option><option>Bancontact</option><option>Espèces</option><option>Autre</option></select></div>
        <div id="payRepart"></div>
      </div>
      <div class="fa-dfoot"><button class="btn btn-ghost btn-sm" onclick="fermerFenetre()">Annuler</button><button class="btn btn-primary btn-sm" id="paySave" onclick="enregistrerPaiement()">Enregistrer</button></div>
    </div>
  </div>

  <!-- ══════ NOTE DE CRÉDIT ══════ -->
  <div class="fa-overlay" id="fenAvoir">
    <div class="fa-dialog ticked" role="dialog" aria-modal="true" aria-labelledby="avTitre">
      <div class="fa-dhead"><h2 id="avTitre">Établir une note de crédit</h2><button class="btn btn-ghost btn-sm" onclick="fermerFenetre()">Fermer</button></div>
      <div class="fa-dbody">
        <div id="avInfo" class="fa-info"></div>
        <div class="field"><label class="label" for="avMontant">Montant à annuler (TVAC)</label>
          <div class="input-unit"><input class="input input-num" id="avMontant" type="number" step="0.01" inputmode="decimal" oninput="apercuAvoir()"><span class="unit">€</span></div></div>
        <div class="field"><label class="label" for="avMotif">Motif (apparaît sur le document)</label><input class="input" id="avMotif" placeholder="Ex : 5 ouvertures non posées, reportées"></div>
        <div id="avApercu" class="fa-info"></div>
      </div>
      <div class="fa-dfoot"><button class="btn btn-ghost btn-sm" onclick="fermerFenetre()">Annuler</button><button class="btn btn-primary btn-sm" onclick="creerAvoir()">Établir la note de crédit</button></div>
    </div>
  </div>

  <!-- ══════ D — RELANCER ══════ -->
  <div class="fa-overlay" id="fenRelance">
    <div class="fa-dialog ticked" role="dialog" aria-modal="true" aria-labelledby="relTitre">
      <div class="fa-dhead"><h2 id="relTitre">Rappel de paiement</h2><button class="btn btn-ghost btn-sm" onclick="fermerFenetre()">Fermer</button></div>
      <div class="fa-dbody">
        <div id="relInfo" class="fa-info"></div>
        <div class="field"><label class="label" for="relSujet">Objet</label><input class="input" id="relSujet"></div>
        <div class="field"><label class="label" for="relCorps">Message</label><textarea class="textarea fa-texte" id="relCorps"></textarea></div>
      </div>
      <div class="fa-dfoot">
        <button class="btn btn-ghost btn-sm" onclick="relanceNotee('autre')">Relancé autrement — noter</button>
        <button class="btn btn-ghost btn-sm" onclick="relanceNotee('copie')">Copier le texte</button>
        <button class="btn btn-primary btn-sm" id="relMail" onclick="relanceNotee('email')">Ouvrir dans le mail</button>
      </div>
    </div>
  </div>

  <!-- ══════ G — EXPORT COMPTABLE ══════ -->
  <div class="fa-overlay" id="fenExport">
    <div class="fa-dialog ticked" role="dialog" aria-modal="true" aria-labelledby="exTitre">
      <div class="fa-dhead"><h2 id="exTitre">Export pour le comptable</h2><button class="btn btn-ghost btn-sm" onclick="fermerFenetre()">Fermer</button></div>
      <div class="fa-dbody">
        <div class="field"><label class="label" for="exPeriode">Période</label>
          <select class="select" id="exPeriode" onchange="periodeExport()">
            <option value="mois">Ce mois-ci</option><option value="moisprec">Le mois dernier</option><option value="trimestre">Ce trimestre</option>
            <option value="annee">Cette année</option><option value="tout">Tout</option><option value="perso">Autre période…</option>
          </select></div>
        <div class="fa-row2">
          <div class="field"><label class="label" for="exDu">Du</label><input class="input" id="exDu" type="date" onchange="apercuExport()"></div>
          <div class="field"><label class="label" for="exAu">Au</label><input class="input" id="exAu" type="date" onchange="apercuExport()"></div>
        </div>
        <div id="exApercu" class="fa-info"></div>
      </div>
      <div class="fa-dfoot"><button class="btn btn-ghost btn-sm" onclick="fermerFenetre()">Annuler</button><button class="btn btn-primary btn-sm" onclick="telechargerExport()">Télécharger le CSV</button></div>
    </div>
  </div>

  <script src="../assets/js/company.js"></script>
  <script src="../assets/js/ui.js"></script>
  <script src="../assets/js/nav.js"></script>
  <script src="../assets/js/fetes.js"></script>
  <script src="../assets/js/api.js"></script>
  <script src="../assets/js/config.js"></script>
  <script src="../assets/js/remuneration.js"></script>
  <script src="../assets/js/facturation.js"></script>
  <script>
    const SS = window.SS, U = window.SSUI, F = window.SSFact;
    const { mountThemeToggle } = window.SSTheme;
    const { fmtEur, fmtDate, el, toast, normDevis, icon, qp, jsAttr } = window.SSUI;
    mountThemeToggle(document.getElementById('themeToggle'));
    window.SSNav.mount(document.getElementById('quickNav'));

    const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
    const r2 = (x) => Math.round((Number(x) || 0) * 100) / 100;
    const paye = (f) => ((f && f.paiements) || []).reduce((s, p) => s + (Number(p.montant) || 0), 0);
    const jourCourt = (iso) => { const d = String(iso || '').slice(0, 10); return d ? d.slice(8, 10) + '/' + d.slice(5, 7) : ''; };
    const plusJours = (n) => { const d = new Date(); d.setDate(d.getDate() + n); return U.isoDate(d); };
    const TYPE_FAC = U.TYPE_FACTURE_LABEL;

    let FACTURES = [], DEVIS = [];
    let VUE = 'chantier';
    try { VUE = localStorage.getItem('ss_fact_vue') === 'facture' ? 'facture' : 'chantier'; } catch (e) {}
    let PLUS = '';        // la facture dont la rangée « ⋯ » est ouverte
    let FALCO = '';       // la facture dont la référence Falco est en cours de saisie
    const devisDe = (id) => DEVIS.filter(d => d.id === id)[0] || null;
    const factureDe = (id) => FACTURES.filter(f => f.id === id)[0] || null;

    async function load() {
      const r = await Promise.all([SS.listFactures(), SS.listDevis()]);
      FACTURES = r[0] || [];
      DEVIS = (r[1] || []).map(normDevis);
      renderTout();
    }
    function renderTout() { renderResume(); renderAFacturer(); render(); }

    // ── A — Le résumé et « À facturer maintenant » ─────────────────────────────────────────────
    function renderResume() {
      const du = r2(FACTURES.reduce((s, f) => s + U.duFacture(f, FACTURES), 0));
      const retard = FACTURES.filter(f => U.factureEnRetard(f, FACTURES));
      const af = F.aFacturer(DEVIS, FACTURES);
      const sf = F.sansFalco(FACTURES).length;
      el('resume').innerHTML = `<span><b>${fmtEur(du)}</b> à encaisser</span>`
        + (retard.length ? ` <button class="danger" onclick="filtrer('retard')">${retard.length} en retard (${fmtEur(r2(retard.reduce((s, f) => s + U.duFacture(f, FACTURES), 0)))})</button>` : '')
        + (af.length ? ` <button class="warn" onclick="document.getElementById('aFacturer').scrollIntoView({ behavior: 'smooth', block: 'start' })">${af.length} à facturer</button>` : '')
        + (sf ? ` <button onclick="filtrer('sansfalco')">${sf} sans pièce Falco</button>` : '');
    }
    window.filtrer = (v) => { el('filtre').value = v; render(); el('liste').scrollIntoView({ behavior: 'smooth', block: 'start' }); };
    function renderAFacturer() {
      const af = F.aFacturer(DEVIS, FACTURES);
      el('aFacturer').innerHTML = af.length ? `<section class="fa-afact" aria-label="À facturer maintenant"><h2>À facturer maintenant</h2>
        <div class="aide">Ce que le tableau de bord réclame, et qui n'est pas encore facturé.</div>
        ${af.map(x => { const d = x.devis; const res = U.resumeDevis(d);
          return `<div class="fa-al"><span class="txt"><a href="vue.html?id=${encodeURIComponent(d.id)}">${esc(`${d.prenom} ${d.nom}`.trim() || '—')}</a>
            <small>${res ? esc(res) + ' · ' : ''}#${esc(d.id)}${d.ville ? ' · ' + esc(d.ville) : ''}</small></span>
            ${x.montant != null ? `<span class="mt">${fmtEur(x.montant)}</span>` : ''}
            <button class="btn btn-primary btn-sm" onclick="ouvrirNouvelle(${jsAttr(d.id)}, ${jsAttr(x.type)}, ${x.pct != null ? x.pct : 'null'})">${esc(x.libelle)}</button></div>`; }).join('')}
      </section>` : '';
    }

    // ── Les listes ─────────────────────────────────────────────────────────────────────────────
    window.setVue = (v) => { VUE = v === 'facture' ? 'facture' : 'chantier'; try { localStorage.setItem('ss_fact_vue', VUE); } catch (e) {} render(); };
    function filtre(f) {
      const v = el('filtre').value;
      if (v === 'du') return U.duFacture(f, FACTURES) > 0.005;
      if (v === 'retard') return U.factureEnRetard(f, FACTURES);
      if (v === 'arelancer') return F.aRelancer(f, FACTURES);
      if (v === 'payee') return U.statutFacture(f, FACTURES) === 'payee';
      if (v === 'sansfalco') return !String(f.ref_externe || '').trim();
      if (v === 'avoir') return f.type === 'avoir';
      return true;
    }
    function render() {
      [...document.querySelectorAll('.fa-vue button')].forEach(b => b.classList.toggle('on', b.dataset.vue === VUE));
      const q = el('search').value || '';
      const rows = FACTURES.filter(f => filtre(f) && F.correspond(f, q)).sort((a, b) => String(b.date || '').localeCompare(String(a.date || '')) || String(b.id).localeCompare(String(a.id)));
      if (!FACTURES.length) {
        el('liste').innerHTML = `<div class="empty">${icon('filetext', 34)}<div>Aucune facture pour l'instant.</div><button class="btn btn-ghost btn-sm mt-4" onclick="ouvrirNouvelle()">${icon('plus', 13)} Créer une facture</button></div>`;
        return;
      }
      if (!rows.length) { el('liste').innerHTML = `<div class="empty">${icon('search', 30)}<div>Aucune facture ne correspond.</div></div>`; return; }
      if (VUE === 'facture') {
        el('liste').innerHTML = `<section class="section"><div class="fa-tete" aria-hidden="true"><span>N°</span><span>Client</span><span>Dates</span><span class="num">Montant</span><span class="num">Reste dû</span><span>Statut</span><span></span></div>
          <div class="fa-liste">${rows.map(f => ligne(f)).join('')}</div></section>`;
        return;
      }
      // C — Par chantier : les dossiers qui ont au moins une facture retenue par le filtre et la recherche.
      const ids = {}; rows.forEach(f => { ids[f.devis_id || ('sans-devis:' + f.id)] = true; });
      const groupes = F.parChantier(FACTURES, DEVIS).filter(g => ids[g.devisId] || ids['sans-devis:' + g.factures[0].id]);
      el('liste').innerHTML = `<div class="fa-chantiers">${groupes.map(chantier).join('')}</div>`;
    }
    function chantier(g) {
      const d = g.devis, cl = g.client || {};
      const nom = `${(d && d.prenom) || cl.prenom || ''} ${(d && d.nom) || cl.nom || ''}`.trim() || '—';
      const res = d ? U.resumeDevis(d) : '';
      const suite = d && g.resteAFacturer > 0.005 ? F.aFacturer([d], FACTURES)[0] : null;
      return `<article class="fa-chantier ${g.enRetard ? 'retard' : ''}" data-devis="${esc(g.devisId)}">
        <div class="fc-tete"><div class="nom">${d ? `<a href="vue.html?id=${encodeURIComponent(d.id)}">${esc(nom)}</a>` : esc(nom)}
          <small>${res ? esc(res) + ' · ' : ''}${g.devisId ? '#' + esc(g.devisId) : 'sans devis'}${d && d.ville ? ' · ' + esc(d.ville) : ''}</small></div></div>
        <div class="fc-chiffres">${g.devisTtc != null ? `<span>Devis <b>${fmtEur(g.devisTtc)}</b></span>` : ''}<span>Facturé <b>${fmtEur(g.facture)}</b></span>
          <span>Encaissé <b>${fmtEur(g.encaisse)}</b></span><span class="${g.enRetard ? 'retard' : (g.du > 0.005 ? 'du' : '')}">Dû <b>${fmtEur(g.du)}</b></span></div>
        ${g.factures.map(f => ligne(f)).join('')}
        ${g.resteAFacturer > 0.005 ? `<div class="fc-suite">Reste à facturer : <b>${fmtEur(g.resteAFacturer)}</b>${
          suite ? ` <button class="btn btn-ghost btn-sm" onclick="ouvrirNouvelle(${jsAttr(d.id)}, ${jsAttr(suite.type)}, ${suite.pct != null ? suite.pct : 'null'})">${esc(suite.libelle)}</button>`
                : (d ? ` <button class="btn btn-ghost btn-sm" onclick="ouvrirNouvelle(${jsAttr(d.id)})">Facturer…</button>` : '')}</div>` : ''}
      </article>`;
    }
    /** Une facture peut-elle être SUPPRIMÉE ? Même règle que le serveur (qui la tient de toute façon) :
     *  ni encaissement, ni pièce Falco, ni note de crédit qui l'annule. */
    const supprimable = (f) => !(f.paiements || []).length && !String(f.ref_externe || '').trim() && !FACTURES.some(x => x.type === 'avoir' && x.avoir_de === f.id);
    function falco(f) {
      const id = jsAttr(f.id);
      /* ✕ : un clavier de téléphone n'a pas d'Échap, et ✓ veut dire « enregistrer » — sans lui, une saisie
         commencée ne s'abandonnait qu'en l'effaçant à la main. */
      if (FALCO === f.id) return `<span class="falco-edit"><input class="input" id="falco-${esc(f.id)}" value="${esc(f.ref_externe || '')}" placeholder="N° Falco" aria-label="Référence SysCore / Falco de ${esc(f.id)}"
          onkeydown="if (event.key === 'Enter') { event.preventDefault(); falcoOk(${id}); } else if (event.key === 'Escape') { event.preventDefault(); event.stopPropagation(); falcoEdit(''); }">
        <button class="btn btn-primary btn-sm" onclick="falcoOk(${id})" aria-label="Enregistrer la référence">${icon('check', 12)}</button>
        <button class="btn btn-ghost btn-sm falco-annuler" onclick="falcoEdit('')" aria-label="Annuler" title="Annuler">${icon('x', 12)}</button></span>`;
      return `<button class="falco ${f.ref_externe ? '' : 'vide'}" onclick="falcoEdit(${id})" title="Référence de la pièce officielle (SysCore / Falco)">${f.ref_externe ? 'Falco ' + esc(f.ref_externe) : '+ pièce Falco'}</button>`;
    }
    function ligne(f) {
      const id = jsAttr(f.id), cl = f.client || {}, d = devisDe(f.devis_id);
      const st = U.statutFacture(f, FACTURES), du = U.duFacture(f, FACTURES), retard = U.factureEnRetard(f, FACTURES);
      const rel = F.relancesDe(f), arel = F.aRelancer(f, FACTURES);
      const nom = `${cl.prenom || ''} ${cl.nom || ''}`.trim() || '—';
      const avoir = f.type === 'avoir';
      const nc = U.avoirsSur(FACTURES, f.id);
      const plus = PLUS === f.id;
      return `<div class="fa-ligne ${retard ? 'retard' : ''}" data-id="${esc(f.id)}">
        <div class="fl-num"><span class="id">${esc(f.id)}</span>${falco(f)}</div>
        <div class="fl-client">${d ? `<a href="vue.html?id=${encodeURIComponent(f.devis_id)}">${esc(nom)}</a>` : `<span style="font-weight:600">${esc(nom)}</span>`}
          <small>${esc(TYPE_FAC[f.type] || f.type)}${f.avoir_de ? ' de ' + esc(f.avoir_de) : ''}${f.devis_id ? ' · #' + esc(f.devis_id) : ''}</small></div>
        <div class="fl-dates">Émise le ${fmtDate(f.date)}${avoir ? '' : `<small class="${retard ? 'retard' : ''}">Échéance ${fmtDate(f.echeance)}</small>`}</div>
        <div class="fl-mt"><span class="lab">Montant</span>${fmtEur(f.total_ttc)}${nc > 0.005 ? `<small style="display:block;font-size:var(--fs-3xs);color:var(--text-subtle)">− NC ${fmtEur(nc)}</small>` : ''}</div>
        <div class="fl-du ${du > 0.005 ? 'du' : ''}"><span class="lab">Reste dû</span>${avoir ? '—' : fmtEur(du)}</div>
        <div class="fl-st">${U.badgeFacture(f, FACTURES)}${rel.n ? `<small>relancée ${rel.n}× · ${jourCourt(rel.derniere)}</small>` : ''}${arel ? '<small class="arel">à relancer</small>' : ''}</div>
        <div class="fl-act">
          ${avoir ? '' : (du > 0.005 ? `<button class="btn btn-primary btn-sm" onclick="ouvrirPaiement(${id})">${icon('coin', 13)} Encaisser</button>`
            : ((f.paiements || []).length ? `<button class="btn btn-ghost btn-sm" onclick="ouvrirPaiement(${id})">${icon('coin', 13)} Encaissements</button>` : ''))}
          <a class="btn btn-ghost btn-sm" href="facture.html?id=${encodeURIComponent(f.id)}" title="Le document, pour l'imprimer ou l'envoyer">${icon('filetext', 13)} PDF</a>
          <button class="btn btn-ghost btn-sm plus" onclick="basculerPlus(${id})" aria-expanded="${plus}" aria-label="Plus d’actions sur ${esc(f.id)}" title="Plus d’actions">⋯</button>
        </div>
        ${plus ? `<div class="fl-plus">
          ${!avoir && du > 0.005 ? `<button class="btn btn-ghost btn-sm" onclick="ouvrirRelance(${id})">${icon('clock', 13)} Relancer</button>` : ''}
          ${!avoir && !FACTURES.some(x => x.type === 'avoir' && x.avoir_de === f.id) ? `<button class="btn btn-ghost btn-sm" onclick="ouvrirAvoir(${id})">${icon('arrowleft', 13)} Note de crédit</button>` : ''}
          ${f.devis_id && d ? `<a class="btn btn-ghost btn-sm" href="vue.html?id=${encodeURIComponent(f.devis_id)}">${icon('window', 13)} Le dossier</a>` : ''}
          ${supprimable(f) ? `<button class="btn btn-ghost btn-sm" onclick="supprimer(${id})">${icon('trash', 13)} Supprimer</button>`
                           : `<span class="note">${avoir ? 'Une note de crédit émise reste dans les livres.' : 'Émise et suivie : elle s’annule par une note de crédit, elle ne se supprime pas.'}</span>`}
        </div>` : ''}
      </div>`;
    }
    window.basculerPlus = (id) => { PLUS = PLUS === id ? '' : id; render(); };

    // ── F — La référence Falco, dans la ligne ──────────────────────────────────────────────────
    window.falcoEdit = (id) => { FALCO = id; render(); if (id) { const c = el('falco-' + id); if (c) { c.focus(); c.select(); } } };
    window.falcoOk = async (id) => {
      const f = factureDe(id); const c = el('falco-' + id);
      if (!f || !c) return;
      const ref = c.value.trim();
      if (ref === (f.ref_externe || '')) { FALCO = ''; render(); return; }
      const res = await SS.setRefFacture(id, ref);
      if (!res || res.ok === false) { toast((res && res.error) || 'Référence non enregistrée.', 'error', 6000); return; }
      f.ref_externe = ref; FALCO = '';
      toast(ref ? 'Pièce Falco notée' : 'Référence retirée', 'ok');
      renderResume(); render();
    };

    window.supprimer = async (id) => {
      if (!confirm('Supprimer la facture ' + id + ' ? Elle n’a ni encaissement, ni pièce Falco, ni note de crédit — mais son numéro ne sera pas réutilisé.')) return;
      const res = await SS.deleteFacture(id);
      if (!res || res.ok === false) { toast((res && res.error) || 'Suppression refusée.', 'error', 8000); return; }
      PLUS = '';
      toast('Facture supprimée', 'ok');
      await load();
    };

    /* ── Les fenêtres (règle 13 bis) : le fond ne ferme que si le geste y a COMMENCÉ ; Échap dans un
       menu ou un champ date ne ferme rien ; une saisie entamée demande « Fermer sans enregistrer ? » ;
       sur téléphone, « retour » ferme la fenêtre (une étape d'historique). ── */
    const ETAPE = { faFenetre: true };
    let FEN = null;
    const telephone = () => { try { return matchMedia('(max-width: 900px)').matches; } catch (e) { return false; } };
    function ouvrirFenetre(id, estSale) {
      const relais = !!FEN;
      if (FEN) el(FEN.id).classList.remove('open');
      FEN = { id: id, estSale: estSale || null };
      el(id).classList.add('open');
      if (!relais && telephone()) { try { history.pushState(ETAPE, ''); } catch (e) {} }
    }
    function fermerSansHistorique(force) {
      if (!FEN) return true;
      if (!force && FEN.estSale && FEN.estSale() && !confirm('Fermer sans enregistrer ?')) return false;
      el(FEN.id).classList.remove('open');
      FEN = null;
      return true;
    }
    window.fermerFenetre = (force) => {
      if (!fermerSansHistorique(force)) return false;
      try { if (history.state && history.state.faFenetre) history.back(); } catch (e) {}
      return true;
    };
    /** Quitter la page depuis une fenêtre : l'étape d'historique est REMPLACÉE par la destination,
     *  sinon « retour » ramènerait sur une étape vide de cette page. */
    function partirVers(url) {
      fermerSansHistorique(true);
      try { if (history.state && history.state.faFenetre) { location.replace(url); return; } } catch (e) {}
      location.href = url;
    }
    window.addEventListener('popstate', () => { if (FEN && !fermerSansHistorique(false)) { try { history.pushState(ETAPE, ''); } catch (e) {} } });
    let downSurFond = null;
    document.querySelectorAll('.fa-overlay').forEach((fond) => {
      fond.addEventListener('mousedown', (e) => { downSurFond = e.target === fond ? fond : null; });
      fond.addEventListener('click', (e) => { if (e.target === fond && downSurFond === fond) window.fermerFenetre(); downSurFond = null; });
    });
    document.addEventListener('keydown', (e) => {
      if (e.key !== 'Escape' || !FEN) return;
      const t = e.target;
      if (t && (t.tagName === 'SELECT' || (t.tagName === 'INPUT' && /^(date|time|datetime-local)$/.test(t.type)))) return;
      window.fermerFenetre();
    });

    // ── Nouvelle facture ───────────────────────────────────────────────────────────────────────
    let UNITE = 'pct', NV_AVANT = '';
    const instantaneNv = () => JSON.stringify(['mDevis', 'mType', 'mPct', 'mRefExterne', 'mEcheance'].map(k => el(k).value).concat([UNITE, [...document.querySelectorAll('#mPoses input')].map(i => i.value)]));
    window.ouvrirNouvelle = (devisId, type, pct) => {
      // Les devis signés ou terminés qui ont ENCORE quelque chose à facturer — un devis déjà
      // entièrement facturé finissait sur « Montant nul ». Le reste à facturer s'affiche.
      const liste = DEVIS.filter(d => ['signe', 'termine'].includes(d.statut) && (Number(d.ttc) || 0) - F.dejaFacture(d.id, FACTURES) > 0.005);
      if (!liste.length) { toast('Aucun devis signé avec un montant restant à facturer.', 'warn'); return; }
      el('mDevis').innerHTML = liste.map(d => {
        const res = U.resumeDevis(d), reste = r2((Number(d.ttc) || 0) - F.dejaFacture(d.id, FACTURES));
        return `<option value="${esc(d.id)}">${esc(`${d.prenom} ${d.nom}`.trim())}${res ? ' · ' + esc(res) : ''} — reste ${fmtEur(reste)} sur ${fmtEur(d.ttc)}${d.type_document === 'depannage' ? ' · dépannage' : ''} (#${esc(d.id)})</option>`;
      }).join('');
      const conf = (window.SSConf && window.SSConf.get()) || null;
      el('mEcheance').value = conf ? conf.usage.echeance_facture : 15;
      el('mRefExterne').value = '';
      // ⚠️ Un devis DEMANDÉ (lien « Facturer » d'une fiche) qui n'a plus rien à facturer — pas signé, ou déjà
      // entièrement facturé — ne se remplace PAS par le premier de la liste : on présélectionnait en silence
      // le devis d'un autre client (audit du 28/10/2026). On le dit, et on n'ouvre rien.
      if (devisId && !liste.some(d => d.id === devisId)) {
        const dd = devisDe(devisId);
        toast(dd && !['signe', 'termine'].includes(dd.statut) ? 'Ce devis n’est pas signé : rien à facturer.' : 'Ce devis est déjà entièrement facturé.', 'warn', 6000);
        return;
      }
      if (devisId) el('mDevis').value = devisId;
      const d = devisDe(el('mDevis').value) || {};
      el('mType').value = type || (d.type_document === 'depannage' ? 'totale' : 'acompte');
      setUnite('pct', true);
      el('mPct').value = pct != null ? pct : (d.acompte_pct != null ? d.acompte_pct : (conf ? conf.prix.acompte_pct : 30));
      choixType(true).then(() => { NV_AVANT = instantaneNv(); });
      ouvrirFenetre('fenNouv', () => NV_AVANT && instantaneNv() !== NV_AVANT);
    };
    window.setUnite = (u, sansApercu) => {
      UNITE = u === 'eur' ? 'eur' : 'pct';
      [...document.querySelectorAll('#mUnite button')].forEach(b => b.classList.toggle('on', b.dataset.unite === UNITE));
      const c = el('mPct');
      el('mPctUnite').textContent = UNITE === 'eur' ? '€' : '%';
      if (UNITE === 'eur') { c.removeAttribute('max'); c.step = '0.01'; c.value = ''; c.placeholder = 'Ex : 2000'; }
      else { c.max = '100'; c.step = '1'; c.removeAttribute('placeholder'); const d = devisDe(el('mDevis').value) || {}; if (!sansApercu) c.value = d.acompte_pct != null ? d.acompte_pct : 30; }
      if (!sansApercu) apercu();
    };
    let DEV_COMPLET = null;   // le devis choisi, chargé en entier (ses ouvertures, ses calculs)
    window.choixDevis = async () => {
      const d = devisDe(el('mDevis').value) || {};
      // Un dépannage se règle en une fois : ni acompte, ni facture partielle (règle 7).
      if (d.type_document === 'depannage' && ['acompte', 'partielle'].includes(el('mType').value)) el('mType').value = 'totale';
      if (UNITE === 'pct') el('mPct').value = d.acompte_pct != null ? d.acompte_pct : 30;
      await choixType();
    };
    window.choixType = async (silencieux) => {
      const id = el('mDevis').value, type = el('mType').value;
      const d = devisDe(id) || {};
      const dep = d.type_document === 'depannage';
      [...el('mType').options].forEach(o => { if (['acompte', 'partielle'].includes(o.value)) { o.disabled = dep; o.hidden = dep; } });
      el('mPctField').style.display = type === 'acompte' ? '' : 'none';
      el('mPosesField').classList.toggle('hidden', type !== 'partielle');
      DEV_COMPLET = id ? await SS.getDevis(id) : null;
      if (type === 'partielle') renderPoses(DEV_COMPLET);
      await apercu();
    };
    function renderPoses(devis) {
      const items = (devis && devis.items) || [];
      if (!items.length) { el('mPoses').innerHTML = '<div class="poses-help">Ce devis n’a aucune ouverture détaillée.</div>'; return; }
      el('mPoses').innerHTML = items.map((it, i) => {
        const q = window.SSRemu.quantiteDe(it);
        const nom = (U.TYPE_LABEL[it.type] || it.type || 'Ouverture') + (it.modele ? ' — ' + it.modele : '');
        const lieu = [it.emplacement, it.etage].filter(Boolean).join(' · ');
        return `<div class="pose-row"><div class="pose-nom">${esc(nom)}${lieu ? `<span class="pose-lieu">${esc(lieu)}</span>` : ''}</div>
          <div class="pose-qty"><input class="input input-num" type="number" min="0" max="${q}" step="1" value="${q}" id="pose_${i}" aria-label="Nombre posé pour ${esc(nom)}" oninput="apercu()">
          <span class="pose-tot">/ ${q}</span></div></div>`;
      }).join('');
    }
    const saisie = () => ({ unite: UNITE, valeur: el('mPct').value, poses: [...document.querySelectorAll('#mPoses input')].map(i => Number(i.value)) });
    window.apercu = async () => {
      const type = el('mType').value;
      if (!DEV_COMPLET) { el('mApercu').innerHTML = ''; return; }
      const a = F.montants(DEV_COMPLET, FACTURES, type, saisie());
      let h = `Montant de la facture : <strong style="color:var(--accent-2-ink)">${fmtEur(r2(a.total_ttc))}</strong> TVAC (HT ${fmtEur(r2(a.total_ht))} + TVA ${fmtEur(r2(a.total_tva))})`;
      if (type === 'acompte') h += `<br>Sur la facture : « ${esc(F.libelleAcompte(DEV_COMPLET, a, saisie()))} »`;
      if (a.plafonne) h += `<div class="fa-info warn">Ramené de ${fmtEur(r2(a.voulu))} à ${fmtEur(r2(a.total_ttc))} : c'est tout ce qui reste à facturer sur ce devis${a.already > 0.005 ? ` (déjà facturé : ${fmtEur(a.already)})` : ''}.</div>`;
      if (type === 'partielle') {
        const posee = a.ttc * a.part;
        h += `<div style="font-size:var(--fs-2xs)">Part posée : <strong>${(a.part * 100).toFixed(2).replace('.', ',')} %</strong> du devis = ${fmtEur(r2(posee))}<br>− déjà facturé : ${fmtEur(a.already)}<br>Restera à facturer après celle-ci : <strong>${fmtEur(r2(Math.max(0, a.ttc - Math.max(posee, a.already))))}</strong></div>`;
      }
      el('mApercu').innerHTML = h;
    };
    window.creerFacture = async () => {
      const id = el('mDevis').value, type = el('mType').value;
      FACTURES = (await SS.listFactures()) || FACTURES;   // ce que l'autre a facturé entre-temps compte
      const d = await SS.getDevis(id);
      if (!d) { toast('Devis introuvable', 'error'); return; }
      if (!['signe', 'termine'].includes(d.statut)) { toast('On ne facture qu’un devis signé ou terminé (statut : ' + (d.statut || '?') + ').', 'warn', 5000); return; }
      const s = saisie();
      const a = F.montants(d, FACTURES, type, s);
      if (type === 'totale' && a.already > 0.005) { toast('Des factures existent déjà pour ce devis — utilise « Solde » pour le restant.', 'warn', 5000); return; }
      if (a.total_ttc <= 0.005) { toast('Montant nul : rien à facturer avec ces valeurs.', 'warn'); return; }
      const facture = {
        type: type, devis_id: id, source_type: d.type_document || 'devis',
        date: U.aujourdhui(), echeance: plusJours(Number(el('mEcheance').value) || 15),
        ref_externe: el('mRefExterne').value.trim(), client: d.client || {},
        lines: F.lignes(d, type, a, s),
        total_ht: r2(a.total_ht), total_tva: r2(a.total_tva), total_ttc: r2(a.total_ttc), tva_pct: a.tva_pct,
        devis_ttc: d.calculs && d.calculs.total_ttc, paiements: [], date_creation: new Date().toISOString(),
      };
      el('mCreer').disabled = true;
      const res = await SS.saveFacture(facture, 'F');
      el('mCreer').disabled = false;
      if (!res || res.ok === false || !res.id) { toast((res && res.error) || 'Facture NON créée — réessaie.', 'error', 7000); return; }
      toast('Facture ' + res.id + ' créée ✓', 'ok');
      partirVers('facture.html?id=' + encodeURIComponent(res.id));
    };

    // ── Encaisser — E : répartir un virement sur le dossier ────────────────────────────────────
    let PAY = null, PAY_PROPOSE = '';
    window.ouvrirPaiement = (id) => {
      PAY = factureDe(id); if (!PAY) return;
      const du = U.duFacture(PAY, FACTURES), nc = U.avoirsSur(FACTURES, PAY.id);
      el('payTitre').textContent = 'Encaisser ' + PAY.id;
      el('payInfo').innerHTML = `${esc(TYPE_FAC[PAY.type] || PAY.type)} de ${fmtEur(PAY.total_ttc)}${nc > 0.005 ? `, note de crédit de ${fmtEur(nc)} déduite` : ''}${paye(PAY) > 0.005 ? `, ${fmtEur(r2(paye(PAY)))} déjà reçus` : ''}.
        <br>Reste dû : <strong style="color:var(--accent-2-ink)">${fmtEur(du)}</strong>`;
      renderEncaissements();
      PAY_PROPOSE = du > 0.005 ? String(du) : '';
      el('payMontant').value = PAY_PROPOSE;
      el('payDate').value = U.aujourdhui();
      el('payMoyen').value = 'Virement';
      apercuPay();
      ouvrirFenetre('fenPay', () => PAY && el('payMontant').value !== PAY_PROPOSE);
    };
    function renderEncaissements() {
      const arr = (PAY && PAY.paiements) || [];
      el('payList').innerHTML = arr.length ? `<div class="pay-hist-t">Encaissements déjà enregistrés</div>` + arr.map((p, i) => `<div class="pay-hist">
          <span class="ph-d">${fmtDate(p.date)}</span><span class="ph-m">${fmtEur(p.montant)}</span><span class="ph-y">${esc(p.moyen || '')}${p.lot ? ' · ' + esc(p.lot) : ''}</span>
          <button type="button" class="btn btn-ghost btn-sm" onclick="retirerEncaissement(${i})" aria-label="Retirer l'encaissement du ${fmtDate(p.date)}">${icon('trash', 12)} Retirer</button></div>`).join('') : '';
    }
    function repartition() {
      const m = r2(Number(el('payMontant').value) || 0);
      return F.repartir(m, PAY, FACTURES);
    }
    window.apercuPay = () => {
      const m = r2(Number(el('payMontant').value) || 0);
      const du = U.duFacture(PAY, FACTURES);
      el('paySave').textContent = 'Enregistrer';
      if (m <= du + 0.01) { el('payRepart').innerHTML = ''; return; }
      const rp = repartition();
      const autres = rp.lignes.filter(l => l.id !== PAY.id);
      el('paySave').textContent = autres.length ? 'Répartir et enregistrer' : 'Enregistrer';
      el('payRepart').innerHTML = `<div class="fa-repart">${autres.length ? `<div style="margin-bottom:0.3rem">Ce montant dépasse ce que doit ${esc(PAY.id)} : il couvre aussi ${autres.length > 1 ? 'les autres factures' : 'l’autre facture'} du dossier.</div>`
        + rp.lignes.map(l => `<div class="l"><span>${esc(l.id)} · ${esc(TYPE_FAC[l.type] || l.type)}</span> <span>${fmtEur(l.montant)}</span></div>`).join('') : ''}
        ${rp.excedent > 0.01 ? `<div class="fa-info warn">${fmtEur(rp.excedent)} de plus que tout ce que le dossier doit : ce serait un trop-perçu${
          autres.length ? '' : ' sur ' + esc(PAY.id)}. Si le client a réglé le solde d'avance, crée d'abord la facture de solde.</div>` : ''}</div>`;
    };
    window.enregistrerPaiement = async () => {
      if (!PAY) return;
      const m = r2(Number(el('payMontant').value) || 0);
      if (m <= 0) { toast('Montant invalide', 'warn'); return; }
      const date = el('payDate').value || U.aujourdhui(), moyen = el('payMoyen').value;
      const rp = m > U.duFacture(PAY, FACTURES) + 0.01 ? repartition() : { lignes: [{ id: PAY.id, montant: m }], excedent: 0 };
      if (rp.excedent > 0.01 && !confirm(`${fmtEur(rp.excedent)} dépassent tout ce que le dossier doit.\n\nIls seront notés sur ${PAY.id} comme trop-perçu (son « reste dû » deviendra négatif).\n\nOK = enregistrer quand même · Annuler = corriger`)) return;
      // L'excédent accepté reste sur la facture choisie : on ne l'invente pas ailleurs.
      const parts = rp.lignes.map(l => ({ id: l.id, montant: l.id === PAY.id ? r2(l.montant + rp.excedent) : l.montant }));
      if (!parts.some(p => p.id === PAY.id) && rp.excedent > 0.01) parts.unshift({ id: PAY.id, montant: rp.excedent });
      const lot = parts.length > 1 ? `${moyen} de ${fmtEur(m)} réparti (${parts.map(p => p.id).join(', ')})` : '';
      el('paySave').disabled = true;
      const faits = [];
      for (const p of parts) {
        const res = await SS.addPaiement(p.id, { date: date, montant: p.montant, moyen: moyen, lot: lot || undefined });
        if (!res || res.ok === false) {
          el('paySave').disabled = false;
          toast((res && res.error) || 'Encaissement NON enregistré sur ' + p.id, 'error', 8000);
          if (faits.length) toast('Déjà enregistré : ' + faits.join(', ') + ' — corrige depuis ces factures.', 'warn', 9000);
          await load();
          return;
        }
        faits.push(p.id + ' ' + fmtEur(p.montant));
      }
      el('paySave').disabled = false;
      SS.logActivity && SS.logActivity({ action: 'facture.paiement', entity_type: 'facture', entity_id: PAY.id, label: `Encaissement de ${fmtEur(m)}${parts.length > 1 ? ' réparti sur ' + parts.length + ' factures' : ' sur ' + PAY.id}` });
      toast(parts.length > 1 ? 'Réparti : ' + faits.join(' · ') + ' ✓' : 'Paiement enregistré ✓', 'ok', 6000);
      window.fermerFenetre(true);
      await load();
    };
    window.retirerEncaissement = async (i) => {
      const p = PAY && (PAY.paiements || [])[i];
      if (!p) return;
      if (!confirm(`Retirer l'encaissement de ${fmtEur(p.montant)} du ${fmtDate(p.date)} ?\n\nLa facture ${PAY.id} redeviendra due de ce montant.`)) return;
      // Par son IDENTIFIANT, pas sa position : un autre encaissement a pu décaler la liste.
      const res = await SS.deletePaiement(PAY.id, p.id != null ? p.id : String(i));
      if (!res || res.ok === false) { toast((res && res.error) || 'Encaissement NON retiré — réessaie.', 'error', 7000); return; }
      PAY.paiements = res.paiements || [];
      toast('Encaissement retiré', 'ok');
      await load();
      PAY = factureDe(PAY.id);
      window.fermerFenetre(true);
      if (PAY) window.ouvrirPaiement(PAY.id);
    };

    // ── Note de crédit ─────────────────────────────────────────────────────────────────────────
    let AV = null, AV_AVANT = '';
    window.ouvrirAvoir = (id) => {
      AV = factureDe(id); if (!AV) return;
      const p = paye(AV);
      el('avInfo').innerHTML = `Annulation de la facture <strong>${esc(AV.id)}</strong> de ${fmtEur(AV.total_ttc)} TVAC.`
        + (p > 0 ? `<br><span style="color:var(--warn)">${fmtEur(r2(p))} ont déjà été encaissés sur cette facture — prévois le remboursement ou l'imputation sur la prochaine.</span>` : '');
      el('avMontant').value = r2(AV.total_ttc);
      el('avMotif').value = '';
      AV_AVANT = el('avMontant').value + '|';
      apercuAvoir();
      ouvrirFenetre('fenAvoir', () => AV && (el('avMontant').value + '|' + el('avMotif').value) !== AV_AVANT);
    };
    window.apercuAvoir = () => {
      if (!AV) return;
      const m = Number(el('avMontant').value) || 0, t = Number(AV.total_ttc) || 0;
      el('avApercu').innerHTML = m >= t - 0.005 ? 'La facture sera <strong>entièrement annulée</strong>. Le devis redeviendra facturable en totalité.'
        : `Annulation partielle : il restera <strong>${fmtEur(r2(t - m))}</strong> sur cette facture (moins ce qui est déjà payé).`;
    };
    window.creerAvoir = async () => {
      if (!AV) return;
      const montant = r2(Number(el('avMontant').value) || 0), total = Number(AV.total_ttc) || 0;
      if (montant <= 0) { toast('Montant invalide', 'warn'); return; }
      if (montant > total + 0.005) { toast('Une note de crédit ne peut pas dépasser le montant de la facture.', 'warn', 5000); return; }
      const tvaPct = AV.tva_pct || 6, ht = r2(montant / (1 + tvaPct / 100)), motif = el('avMotif').value.trim();
      const avoir = {
        type: 'avoir', avoir_de: AV.id, devis_id: AV.devis_id, source_type: AV.source_type || 'devis',
        date: U.aujourdhui(), echeance: U.aujourdhui(), client: AV.client || {},
        lines: [{ desc: `Annulation de la facture N° ${AV.id}`, sub: motif, qty: 1, pu: -ht, total: -ht }],
        total_ht: -ht, total_tva: -r2(montant - ht), total_ttc: -montant, tva_pct: tvaPct, motif: motif, paiements: [], date_creation: new Date().toISOString(),
      };
      const res = await SS.saveFacture(avoir, 'NC');
      if (!res || res.ok === false) { toast((res && res.error) || 'Note de crédit NON créée — réessaie.', 'error', 7000); return; }
      SS.logActivity && SS.logActivity({ action: 'facture.avoir', entity_type: 'facture', entity_id: res.id, label: `Note de crédit ${res.id} de ${fmtEur(montant)} sur la facture ${AV.id}` });
      toast('Note de crédit ' + res.id + ' créée ✓', 'ok');
      window.fermerFenetre(true);
      PLUS = '';
      await load();
    };

    // ── D — Relancer, et le noter ──────────────────────────────────────────────────────────────
    let REL = null;
    window.ouvrirRelance = (id) => {
      REL = factureDe(id); if (!REL) return;
      const t = F.texteRelance(REL, FACTURES, window.SS_COMPANY || {});
      const r = F.relancesDe(REL);
      const email = String((REL.client && REL.client.email) || '').split(',')[0].trim();
      el('relTitre').textContent = 'Rappel de paiement — ' + REL.id;
      el('relInfo').innerHTML = (r.n ? `Déjà relancée ${r.n}× : ${(REL.relances || []).map(x => fmtDate(x.le) + (x.par ? ' (' + esc(U.SELLER_LABELS[x.par] || x.par) + ')' : '')).join(', ')}.` : 'Première relance de cette facture.')
        + `<br>Reste dû : <strong>${fmtEur(t.du)}</strong>${email ? ' · ' + esc(email) : ' · <span style="color:var(--warn)">pas d’e-mail : copie le texte dans un SMS ou WhatsApp</span>'}`;
      el('relSujet').value = t.sujet; el('relCorps').value = t.corps;
      el('relMail').style.display = email ? '' : 'none';
      ouvrirFenetre('fenRelance', null);
    };
    /** Les trois gestes NOTENT la relance (même règle que les relances de devis) : le mail, la copie
     *  (SMS, WhatsApp) ou « autrement » (téléphone, de vive voix). */
    window.relanceNotee = async (canal) => {
      if (!REL) return;
      const corps = el('relCorps').value, sujet = el('relSujet').value;
      if (canal === 'copie') U.copyText(corps, 'Texte du rappel');
      const res = await SS.relancerFacture(REL.id, canal);
      if (!res || res.ok === false) { toast((res && res.error) || 'Relance non notée.', 'error', 6000); return; }
      REL.relances = res.relances || [];
      const email = String((REL.client && REL.client.email) || '').split(',')[0].trim();
      window.fermerFenetre(true);
      toast('Relance notée ✓', 'ok');
      PLUS = '';
      renderTout();
      if (canal === 'email' && email) location.href = 'mailto:' + encodeURIComponent(email) + '?subject=' + encodeURIComponent(sujet) + '&body=' + encodeURIComponent(corps);
    };

    // ── G — Export comptable ───────────────────────────────────────────────────────────────────
    window.ouvrirExport = () => { el('exPeriode').value = 'moisprec'; periodeExport(); ouvrirFenetre('fenExport', null); };
    window.periodeExport = () => {
      const v = el('exPeriode').value, auj = U.aujourdhui(), a = Number(auj.slice(0, 4)), m = Number(auj.slice(5, 7));
      const deb = (y, mo) => y + '-' + String(mo).padStart(2, '0') + '-01';
      const fin = (y, mo) => U.isoDate(new Date(y, mo, 0));
      let du = '', au = '';
      if (v === 'mois') { du = deb(a, m); au = fin(a, m); }
      else if (v === 'moisprec') { const y = m === 1 ? a - 1 : a, mo = m === 1 ? 12 : m - 1; du = deb(y, mo); au = fin(y, mo); }
      else if (v === 'trimestre') { const t0 = Math.floor((m - 1) / 3) * 3 + 1; du = deb(a, t0); au = fin(a, t0 + 2); }
      else if (v === 'annee') { du = a + '-01-01'; au = a + '-12-31'; }
      if (v !== 'perso') { el('exDu').value = du; el('exAu').value = au; }
      apercuExport();
    };
    const pieces = () => { const du = el('exDu').value, au = el('exAu').value; return FACTURES.filter(f => { const d = String(f.date || ''); return (!du || d >= du) && (!au || d <= au); }); };
    window.apercuExport = () => {
      const l = pieces();
      el('exApercu').innerHTML = `${l.length} pièce${l.length > 1 ? 's' : ''} : ${fmtEur(r2(l.reduce((s, f) => s + (Number(f.total_ttc) || 0), 0)))} TVAC, `
        + `${F.sansFalco(l).length} sans pièce Falco. Un fichier qu'Excel ouvre tel quel (« ; », virgule décimale).`;
    };
    window.telechargerExport = () => {
      const du = el('exDu').value, au = el('exAu').value;
      const blob = new Blob([F.csv(FACTURES, du, au)], { type: 'text/csv;charset=utf-8' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'factures' + (du ? '-' + du : '') + (au ? '_' + au : '') + '.csv';
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(a.href), 4000);
      toast('Export téléchargé', 'ok');
      window.fermerFenetre(true);
    };

    // Arrivée depuis la fiche devis (?devis=…&type=…) : la fenêtre s'ouvre, puis les paramètres
    // quittent l'adresse — sinon un rechargement en rouvrirait une.
    load().then(() => {
      const devisId = qp('devis');
      if (devisId) {
        window.ouvrirNouvelle(devisId, qp('type'));
        try { history.replaceState(history.state, '', location.pathname); } catch (e) {}
      }
    });
  </script>
</body>
</html>
