<!DOCTYPE html>
<html lang="fr" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>SolariScreen — Échanges</title>
  <link rel="manifest" href="../manifest.webmanifest">
  <meta name="theme-color" content="#0b1224" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#f4f6fb" media="(prefers-color-scheme: light)">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="SolariScreen">
  <link rel="apple-touch-icon" href="../assets/img/apple-touch-icon.png">
  <link rel="icon" type="image/png" href="../assets/img/logo-solariscreen.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600;700&family=Orbitron:wght@600;800&display=swap" rel="stylesheet">
  <script src="../assets/js/theme.js"></script>
  <link rel="stylesheet" href="../assets/css/tokens.css">
  <link rel="stylesheet" href="../assets/css/theme-dark.css">
  <link rel="stylesheet" href="../assets/css/theme-light.css">
  <link rel="stylesheet" href="../assets/css/base.css">
  <style>
    /* ── Zone de saisie : toujours en haut, toujours prête ─────────────────────────────────── */
    .ec-poster { border: 1px solid var(--border); border-radius: var(--r-md); background: var(--surface); padding: var(--sp-4); margin-bottom: var(--sp-5); }
    .ec-poster .textarea { min-height: 62px; }
    .ec-contexte { margin-top: var(--sp-2); font-family: var(--font-mono); font-size: var(--fs-2xs); color: var(--accent-2); }
    .ec-contexte:empty { display: none; }
    .ec-opts { display: flex; flex-wrap: wrap; gap: var(--sp-2); align-items: center; margin-top: var(--sp-3); }
    .ec-opts .sep { width: 1px; height: 22px; background: var(--border); flex: none; }
    .ec-poster .ec-fin { display: flex; flex-wrap: wrap; gap: var(--sp-2); align-items: center; margin-top: var(--sp-3); }
    .ec-poster .ec-fin .input, .ec-poster .ec-fin .select { height: auto; padding: 0.4rem 0.6rem; font-size: var(--fs-sm); line-height: 1.25; }
    .ec-lie { flex: 1 1 220px; min-width: 160px; }
    .ec-envoi { margin-left: auto; }

    /* Une puce = une nature ou un destinataire. Hauteur explicite : `pointer: coarse` de base.css
       ne couvre pas les composants maison, ils resteraient à 21 px sur un vrai téléphone. */
    .ec-chip { display: inline-flex; align-items: center; gap: 0.35rem; min-height: 34px; padding: 0.3rem 0.65rem;
      border: 1px solid var(--border-strong); border-radius: var(--r-pill); background: none; color: var(--text-muted);
      font-size: var(--fs-xs); cursor: pointer; white-space: nowrap; }
    .ec-chip.on { border-color: var(--kc, var(--accent)); color: var(--kc, var(--accent)); background: color-mix(in srgb, var(--kc, var(--accent)) 12%, transparent); }

    /* ── Ce qui attend (les quatre modules réunis) ─────────────────────────────────────────── */
    .at-bloc { margin-bottom: var(--sp-5); }
    .at-titre { display: flex; align-items: center; gap: var(--sp-2); font-family: var(--font-mono); font-size: var(--fs-2xs);
      text-transform: uppercase; letter-spacing: 0.08em; color: var(--text-subtle); margin-bottom: var(--sp-3); }
    .at-titre .n { color: var(--text-muted); }
    .at-titre.alerte { color: var(--danger); }
    .at-liste { display: flex; flex-direction: column; gap: var(--sp-2); }
    .at-item { display: flex; align-items: flex-start; gap: var(--sp-3); flex-wrap: wrap;
      border: 1px solid var(--border); border-left: 3px solid var(--uc, var(--border-strong)); border-radius: var(--r-md);
      background: var(--surface); padding: var(--sp-3) var(--sp-4); }
    .at-item.orphelin { border-left-color: var(--danger); background: color-mix(in srgb, var(--danger) 5%, var(--surface)); }
    .at-corps { flex: 1 1 14ch; min-width: 14ch; }
    .at-l1 { display: flex; align-items: baseline; gap: var(--sp-2); flex-wrap: wrap; }
    .at-quoi { font-weight: 600; color: var(--text); }
    .at-nom { font-family: var(--font-mono); font-size: var(--fs-2xs); color: var(--text-muted); }
    .at-src { flex: 0 0 auto; font-family: var(--font-mono); font-size: var(--fs-3xs); text-transform: uppercase;
      letter-spacing: 0.06em; padding: 0.1rem 0.45rem; border-radius: var(--r-sm); color: var(--sc, var(--accent));
      border: 1px solid color-mix(in srgb, var(--sc, var(--accent)) 40%, transparent); }
    .at-detail { font-size: var(--fs-xs); color: var(--text-subtle); margin-top: 0.2rem;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .at-age { font-family: var(--font-mono); font-size: var(--fs-3xs); color: var(--text-subtle); }
    .at-age.vieux { color: var(--warn); }
    .at-age.tresvieux { color: var(--danger); font-weight: 700; }
    .at-actions { display: flex; gap: var(--sp-2); flex-wrap: wrap; flex: 0 0 auto; }
    .at-plie { background: none; border: none; color: var(--text-subtle); font-family: var(--font-mono);
      font-size: var(--fs-2xs); cursor: pointer; text-decoration: underline; padding: 0; }
    .at-vide { border: 1px dashed var(--border-strong); border-radius: var(--r-md); padding: var(--sp-5);
      text-align: center; color: var(--text-subtle); font-size: var(--fs-sm); }

    /* ── Liste ─────────────────────────────────────────────────────────────────────────────── */
    .ec-bar { display: flex; flex-wrap: wrap; gap: var(--sp-2); align-items: center; margin-bottom: var(--sp-4); }
    .ec-bar .rech { flex: 1 1 200px; min-width: 160px; }
    .ec-liste { display: flex; flex-direction: column; gap: var(--sp-3); }
    .ec-suj { border: 1px solid var(--border); border-left: 3px solid var(--kc, var(--accent)); border-radius: var(--r-md);
      background: var(--surface); padding: var(--sp-4); }
    .ec-suj.pour-moi { box-shadow: 0 0 0 1px color-mix(in srgb, var(--accent) 35%, transparent); }
    .ec-suj.est-fait { opacity: 0.6; }
    .ec-tete { display: flex; align-items: flex-start; gap: var(--sp-2); flex-wrap: wrap; }
    /* Le titre porte le sens : on lui donne un plancher et on refuse aux badges de grandir,
       sinon c'est lui qui cède et on lit une lettre et demie. */
    .ec-titre { font-weight: 700; color: var(--text); flex: 1 1 12ch; min-width: 12ch; }
    .ec-suj.est-fait .ec-titre { text-decoration: line-through; }
    .ec-nat { flex: 0 0 auto; font-family: var(--font-mono); font-size: var(--fs-3xs); text-transform: uppercase;
      letter-spacing: 0.06em; padding: 0.15rem 0.5rem; border-radius: var(--r-sm); color: var(--kc, var(--accent));
      border: 1px solid color-mix(in srgb, var(--kc, var(--accent)) 45%, transparent); }
    .ec-meta { font-family: var(--font-mono); font-size: var(--fs-3xs); color: var(--text-subtle); margin-top: 0.3rem; }
    .ec-meta .ec-lien { color: var(--accent-2); }
    .ec-corps { font-size: var(--fs-sm); color: var(--text-muted); margin-top: var(--sp-2); white-space: pre-wrap; line-height: 1.55; }
    .ec-balle { display: inline-flex; align-items: center; gap: 0.3rem; flex: 0 0 auto; font-family: var(--font-mono);
      font-size: var(--fs-3xs); text-transform: uppercase; letter-spacing: 0.06em; padding: 0.15rem 0.5rem;
      border-radius: var(--r-pill); color: var(--warn); border: 1px solid color-mix(in srgb, var(--warn) 45%, transparent); }
    .ec-balle.moi { color: var(--accent); border-color: color-mix(in srgb, var(--accent) 55%, transparent);
      background: color-mix(in srgb, var(--accent) 12%, transparent); }

    .ec-fil { margin-top: var(--sp-3); border-top: 1px solid var(--border); padding-top: var(--sp-3); display: flex; flex-direction: column; gap: var(--sp-2); }
    .ec-rep { display: flex; gap: var(--sp-2); }
    .ec-ava { width: 26px; height: 26px; flex: none; border-radius: 50%; display: grid; place-items: center;
      font-family: var(--font-mono); font-size: var(--fs-3xs); font-weight: 700; color: var(--on-accent); background: var(--ac, var(--accent)); }
    .ec-rep .txt { font-size: var(--fs-sm); color: var(--text); white-space: pre-wrap; line-height: 1.5; }
    .ec-rep .qd { font-family: var(--font-mono); font-size: var(--fs-3xs); color: var(--text-subtle); margin-top: 0.15rem; }
    /* La décision : mise en avant, c'est ce qu'on vient relire des semaines plus tard. */
    .ec-decision { display: flex; gap: var(--sp-2); align-items: flex-start; margin-top: var(--sp-3);
      padding: var(--sp-3); border-radius: var(--r-sm); font-size: var(--fs-sm); color: var(--text);
      border: 1px solid color-mix(in srgb, var(--ok) 40%, transparent);
      background: color-mix(in srgb, var(--ok) 8%, transparent); }
    .ec-decision svg { color: var(--ok); flex: none; margin-top: 2px; }
    .ec-decision .qd { font-family: var(--font-mono); font-size: var(--fs-3xs); color: var(--text-subtle); margin-top: 0.2rem; }
    .ec-actions { display: flex; flex-wrap: wrap; gap: var(--sp-2); margin-top: var(--sp-3); }
    .ec-repbox { margin-top: var(--sp-3); display: none; }
    .ec-repbox.on { display: block; }
    .ec-repbox .ec-fin { display: flex; flex-wrap: wrap; gap: var(--sp-2); align-items: center; margin-top: var(--sp-2); }

    @media (max-width: 560px) {
      .ec-envoi { margin-left: 0; width: 100%; justify-content: center; }
      .ec-lie { flex: 1 1 100%; }
      .ec-opts .sep { display: none; }
    }
    @media (pointer: coarse) {
      .ec-chip { min-height: 38px; }
    }
  </style>
</head>
<body>
  <div class="fx-grid"></div>

  <header class="app-header">
    <div class="brand">
      <span class="brand-logo"><img src="../assets/img/logo-solariscreen.png" alt="" onerror="this.style.display='none'"></span>
      <div>
        <h1><a href="dashboard.html">SOLARISCREEN</a></h1>
        <div class="module">Échanges</div>
      </div>
    </div>
    <div class="header-actions">
      <span id="quickNav"></span>
      <span id="themeToggle"></span>
      <a class="btn btn-ghost btn-sm" href="dashboard.html"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg> Dashboard</a>
    </div>
  </header>

  <main class="container">
    <div class="kpis" id="kpis"></div>

    <!-- CE QUI ATTEND — les quatre modules réunis (demandes de RDV, planning, SAV, échanges).
         Chacun savait déjà dire « ça attend quelqu'un », mais chacun dans son coin : il fallait
         ouvrir quatre écrans pour le savoir, donc on ne le faisait pas. Ici, tout est au même
         endroit ET chaque ligne porte son action : attribuer sans changer de page. -->
    <div id="attenteHost"></div>

    <!-- Écrire doit être la chose la plus facile de la page : la zone est en haut, ouverte,
         sans bouton « nouveau sujet » à trouver d'abord. -->
    <div class="ec-poster">
      <textarea class="textarea" id="pTitre" placeholder="Une chose à faire, une question, une idée… (Ctrl+Entrée pour envoyer)"></textarea>
      <div class="ec-opts" id="pNatures"></div>
      <div class="ec-fin">
        <span class="ec-opts" id="pPour" style="margin-top:0"></span>
        <span class="sep"></span>
        <input class="input ec-lie" id="pClient" list="dlClients" placeholder="Lié à un client (facultatif)" autocomplete="off">
        <input class="input" id="pEcheance" type="date" title="Pour quand (facultatif)" style="max-width:160px">
        <button class="btn btn-primary btn-sm ec-envoi" id="btnPublier" onclick="publier()">Publier</button>
      </div>
      <div class="ec-contexte" id="pContexte"></div>
      <datalist id="dlClients"></datalist>
    </div>

    <div class="ec-bar">
      <div class="ec-opts" id="fNatures" style="margin-top:0"></div>
      <input class="input rech" id="rech" type="search" placeholder="Rechercher…" oninput="rendre()">
      <label class="chip" style="cursor:pointer;"><input type="checkbox" id="voirFaits" onchange="rendre()" style="vertical-align:-1px"> Voir ce qui est fait</label>
    </div>

    <div id="host"><div class="ec-liste" aria-busy="true"><div class="skl" style="height:110px"></div><div class="skl" style="height:110px"></div></div></div>
  </main>

  <script src="../assets/js/ui.js"></script>
  <script src="../assets/js/nav.js"></script>
  <script src="../assets/js/api.js"></script>
  <!-- `attente.js` agrège les quatre sources (demandes, planning, SAV, échanges) et a besoin du
       moteur du temps pour les conflits et les rendez-vous orphelins ; `config.js` lui donne la
       trame, sans laquelle personne n'est jamais disponible. -->
  <script src="../assets/js/config.js"></script>
  <script src="../assets/js/planning.js"></script>
  <script src="../assets/js/attente.js"></script>
  <script>
    const SS = window.SS;
    const { el, icon, toast, escHtml, fmtDate, relTime, qp } = window.SSUI;
    const SELLER_LABELS = window.SSUI.SELLER_LABELS;   // source unique du vocabulaire : ui.js
    window.SSTheme.mountThemeToggle(document.getElementById('themeToggle'));
    window.SSNav.mount(document.getElementById('quickNav'));

    // Vocabulaire des natures. Quatre, pas davantage : au-delà on hésite au moment d'écrire,
    // et un outil où l'on hésite à écrire ne sert plus à rien.
    const NATURES = {
      afaire:   { label: 'À faire',    icone: 'check',   couleur: 'var(--accent)' },
      question: { label: 'Question',   icone: 'help',    couleur: 'var(--warn)' },
      idee:     { label: 'Idée',       icone: 'sparkle', couleur: 'var(--accent-2)' },
      attente:  { label: 'En attente', icone: 'clock',   couleur: 'var(--text-subtle)' },
    };
    const PERSONNES = ['nicolas', 'yannick'];

    const A = window.SSAttente;
    let SUJETS = [];
    let ATTENTES = [];        // les quatre sources réunies (voir assets/js/attente.js)
    let PLIE_AUTRE = true;    // ce qui est chez l'autre : replié par défaut, ce n'est pas mon travail
    let MOI = { key: '', name: '' };
    let CLIENTS = [];
    let P_KIND = 'afaire';
    let P_POUR = '';
    let F_KIND = '';                 // filtre de nature, vide = toutes
    let REPOND = '';                 // sujet dont la zone de réponse est ouverte
    let DECIDE = '';                 // sujet dont la zone « ce qui a été décidé » est ouverte

    function autre(k) { return k === 'nicolas' ? 'yannick' : 'nicolas'; }
    function nomDe(k) { return SELLER_LABELS[k] || k || '—'; }

    async function charger() {
      try { MOI = await window.SSNav.getIdentity(); } catch (e) { MOI = { key: '' }; }
      // Les quatre sources en une fois. `charger()` de SSAttente rapatrie déjà les sujets : on
      // réutilise ce qu'il a lu plutôt que de redemander la même liste au serveur.
      let paquet = null;
      try { paquet = await A.charger(); } catch (e) { console.warn('[Échanges] attentes indisponibles:', e.message); }
      ATTENTES = (paquet && paquet.items) || [];
      SUJETS = (paquet && paquet.sources && paquet.sources.sujets) || (await SS.listSujets()) || [];
      // Destinataire par défaut : l'AUTRE. Un sujet qu'on s'adresse à soi-même n'attend personne,
      // et c'est presque toujours à l'autre qu'on écrit.
      if (!P_POUR) P_POUR = MOI.key ? autre(MOI.key) : '';
      rendre();
      chargerClients();
      prefixerDepuisUrl();
    }

    // Arriver ici depuis un dossier, une demande ou un ticket : le contexte est deja pose et le
    // curseur est dans le champ. Sans ca il fallait revenir aux Echanges et RETAPER le nom du
    // client -- trois gestes pour une question de dix secondes, donc on ne la posait pas.
    let DEVIS_LIE = '';
    function prefixerDepuisUrl() {
      const c = qp('client');
      if (c) el('pClient').value = c;
      DEVIS_LIE = qp('devis') || '';
      const pour = qp('pour');
      if (pour === 'nicolas' || pour === 'yannick') P_POUR = pour;
      const kind = qp('kind');
      if (NATURES[kind]) P_KIND = kind;
      const titre = qp('titre');
      if (titre) el('pTitre').value = titre;
      if (!DEVIS_LIE && !c && !titre) return;
      rendrePuces();
      el('pTitre').focus();
      if (DEVIS_LIE) {
        el('pContexte').innerHTML = icon('window', 12) + ' Rattaché au dossier #' + escHtml(DEVIS_LIE) +
          ' <button type="button" class="at-plie" onclick="detacherDossier()">détacher</button>';
      }
    }
    window.detacherDossier = function () { DEVIS_LIE = ''; el('pContexte').innerHTML = ''; };

    /** Annuaire pour le champ « lié à un client » — les clients des devis suffisent. */
    async function chargerClients() {
      const devis = (await SS.listDevis().catch(function () { return []; })) || [];
      const vus = new Set();
      devis.forEach(function (d) {
        const c = d.client || {};
        const nom = ((c.prenom || '') + ' ' + (c.nom || '')).trim();
        // clientKeyOf prend (prenom, nom) — pas l'objet client : lui passer la fiche entière
        // produisait la clé « |[object object] », qui ne rapproche évidemment aucune fiche CRM.
        if (nom && !vus.has(nom)) { vus.add(nom); CLIENTS.push({ nom: nom, key: window.SSUI.clientKeyOf(c.prenom, c.nom) }); }
      });
      el('dlClients').innerHTML = CLIENTS.map(function (c) { return '<option value="' + escHtml(c.nom) + '"></option>'; }).join('');
    }

    // ── Rendu ────────────────────────────────────────────────────────────────────────────────
    function rendre() {
      rendrePuces();
      rendreKpis();
      rendreAttentes();
      const q = (el('rech').value || '').trim().toLowerCase();
      const voirFaits = el('voirFaits').checked;
      let liste = SUJETS.filter(function (s) {
        if (!voirFaits && s.statut === 'fait') return false;
        if (F_KIND && s.kind !== F_KIND) return false;
        if (!q) return true;
        const foin = [s.titre, s.corps, s.client_nom, s.decision, nomDe(s.auteur),
          (s.reponses || []).map(function (r) { return r.texte; }).join(' ')].join(' ').toLowerCase();
        return foin.indexOf(q) >= 0;
      });
      // Ce qui m'attend passe devant : c'est la seule question qu'on se pose en ouvrant la page.
      liste.sort(function (a, b) {
        const am = (a.awaiting === MOI.key && a.statut !== 'fait') ? 0 : 1;
        const bm = (b.awaiting === MOI.key && b.statut !== 'fait') ? 0 : 1;
        if (am !== bm) return am - bm;
        return String(b.date_modification || '').localeCompare(String(a.date_modification || ''));
      });
      if (!liste.length) {
        el('host').innerHTML = '<div class="empty"><div class="big">' + icon('message', 40) + '</div>' +
          (SUJETS.length ? 'Rien ne correspond à ce filtre.' :
            'Rien pour l’instant.<br>Écris ce que tu as en tête là-haut : une chose à faire, une question pour ' +
            escHtml(nomDe(autre(MOI.key))) + ', ou une idée à garder.') + '</div>';
        return;
      }
      el('host').innerHTML = '<div class="ec-liste">' + liste.map(carte).join('') + '</div>';
    }

    function rendrePuces() {
      el('pNatures').innerHTML = Object.keys(NATURES).map(function (k) {
        const n = NATURES[k];
        return '<button type="button" class="ec-chip ' + (P_KIND === k ? 'on' : '') + '" style="--kc:' + n.couleur + '" onclick="setKind(\'' + k + '\')">' +
          icon(n.icone, 13) + escHtml(n.label) + '</button>';
      }).join('');
      el('pPour').innerHTML = PERSONNES.map(function (p) {
        return '<button type="button" class="ec-chip ' + (P_POUR === p ? 'on' : '') + '" onclick="setPour(\'' + p + '\')">' +
          escHtml('Pour ' + nomDe(p)) + '</button>';
      }).join('') +
        '<button type="button" class="ec-chip ' + (!P_POUR ? 'on' : '') + '" onclick="setPour(\'\')">Pour nous deux</button>';
      el('fNatures').innerHTML = '<button type="button" class="ec-chip ' + (!F_KIND ? 'on' : '') + '" onclick="setFiltre(\'\')">Tout</button>' +
        Object.keys(NATURES).map(function (k) {
          const n = NATURES[k];
          const nb = SUJETS.filter(function (s) { return s.kind === k && s.statut !== 'fait'; }).length;
          return '<button type="button" class="ec-chip ' + (F_KIND === k ? 'on' : '') + '" style="--kc:' + n.couleur + '" onclick="setFiltre(\'' + k + '\')">' +
            icon(n.icone, 13) + escHtml(n.label) + (nb ? ' ' + nb : '') + '</button>';
        }).join('');
    }

    // Les compteurs portent désormais sur TOUT l'ERP, pas seulement sur les sujets écrits ici :
    // c'est ce qui fait de cet écran la bible de qui fait quoi plutôt qu'un chat de plus.
    function rendreKpis() {
      const c = A.compter(ATTENTES);
      const pourMoi = A.pourQui(ATTENTES, MOI.key).length;
      const pourAutre = A.pourQui(ATTENTES, autre(MOI.key)).length;
      el('kpis').innerHTML =
        '<div class="kpi ticked danger"><div class="kpi-label">Personne dessus</div><div class="kpi-value">' + c.sansPersonne + '</div><div class="kpi-sub">à attribuer — rien n’avance sans ça</div></div>' +
        '<div class="kpi ticked accent"><div class="kpi-label">Ça t’attend</div><div class="kpi-value">' + pourMoi + '</div><div class="kpi-sub">réponse ou action de ta part</div></div>' +
        '<div class="kpi ticked"><div class="kpi-label">Chez ' + escHtml(nomDe(autre(MOI.key))) + '</div><div class="kpi-value">' + pourAutre + '</div><div class="kpi-sub">la balle est dans son camp</div></div>' +
        '<div class="kpi ticked gold"><div class="kpi-label">Critique</div><div class="kpi-value">' + c.critique + '</div><div class="kpi-sub">conflit, client qui attend, retard</div></div>';
      if (window.SSUI.animateKpis) window.SSUI.animateKpis(el('kpis'));
    }

    // ── Ce qui attend ────────────────────────────────────────────────────────────────────────
    function ligneAttente(it) {
      const s = A.SOURCES[it.source] || {};
      const j = A.joursDepuis(it.depuis);
      const clAge = j >= A.SEUILS.ATTENTE_TRES_LONGUE_J ? 'tresvieux' : (j >= A.SEUILS.ATTENTE_LONGUE_J ? 'vieux' : '');
      const id = window.SSUI.jsAttr(it.id);
      // Attribuer d'un clic, sans quitter l'écran : c'est le saut vers une autre page qui casse
      // le geste et fait qu'on remet à plus tard. Ce qui n'est pas attribuable renvoie à sa fiche.
      let actions = '';
      if (it.peutPrendre && !it.qui) {
        actions = '<button class="btn btn-primary btn-sm" onclick="attribuer(' + id + ',\'' + MOI.key + '\')">Je prends</button>' +
          '<button class="btn btn-ghost btn-sm" onclick="attribuer(' + id + ',\'' + autre(MOI.key) + '\')">Pour ' + escHtml(nomDe(autre(MOI.key))) + '</button>';
      } else if (it.peutPrendre && it.qui === MOI.key) {
        actions = '<button class="btn btn-ghost btn-sm" onclick="attribuer(' + id + ',\'' + autre(MOI.key) + '\')">Passer à ' + escHtml(nomDe(autre(MOI.key))) + '</button>';
      }
      if (it.href) actions += '<button class="btn btn-ghost btn-sm" onclick="location.href=\'' + it.href + '\'">Ouvrir</button>';
      return '<div class="at-item ' + (it.qui ? '' : 'orphelin') + '" style="--uc:' + (s.couleur || 'var(--accent)') + '">' +
        '<div class="at-corps">' +
          '<div class="at-l1">' +
            '<span class="at-src" style="--sc:' + (s.couleur || 'var(--accent)') + '">' + escHtml(s.label || it.source) + '</span>' +
            '<span class="at-quoi">' + escHtml(it.quoi) + '</span>' +
            '<span class="at-nom">' + escHtml(it.titre) + '</span>' +
            '<span class="at-age ' + clAge + '">' + escHtml(A.delai(it.depuis)) + '</span>' +
          '</div>' +
          (it.detail ? '<div class="at-detail">' + escHtml(it.detail) + '</div>' : '') +
        '</div>' +
        '<div class="at-actions">' + actions + '</div>' +
        '</div>';
    }

    function rendreAttentes() {
      const orphelins = A.sansPersonne(ATTENTES);
      const miennes = A.pourQui(ATTENTES, MOI.key);
      const autres = A.pourQui(ATTENTES, autre(MOI.key));
      let html = '';
      // L'ordre n'est pas décoratif : ce que PERSONNE n'a pris passe avant tout le reste, parce
      // que c'est exactement ce dont chacun croit que l'autre s'occupe.
      if (orphelins.length) {
        html += '<div class="at-bloc"><div class="at-titre alerte">' + icon('warning', 13) +
          ' Personne ne s’en occupe <span class="n">(' + orphelins.length + ')</span></div>' +
          '<div class="at-liste">' + orphelins.map(ligneAttente).join('') + '</div></div>';
      }
      if (miennes.length) {
        html += '<div class="at-bloc"><div class="at-titre">' + icon('user', 13) +
          ' Ça t’attend <span class="n">(' + miennes.length + ')</span></div>' +
          '<div class="at-liste">' + miennes.map(ligneAttente).join('') + '</div></div>';
      }
      if (autres.length) {
        html += '<div class="at-bloc"><div class="at-titre">' + icon('clock', 13) +
          ' Chez ' + escHtml(nomDe(autre(MOI.key))) + ' <span class="n">(' + autres.length + ')</span>' +
          ' <button class="at-plie" onclick="basculerAutre()">' + (PLIE_AUTRE ? 'voir' : 'masquer') + '</button></div>' +
          (PLIE_AUTRE ? '' : '<div class="at-liste">' + autres.map(ligneAttente).join('') + '</div>') + '</div>';
      }
      if (!orphelins.length && !miennes.length) {
        html = '<div class="at-vide">' + icon('check', 20) + ' Rien ne bloque : tout ce qui est en cours a un nom dessus.</div>' + html;
      }
      el('attenteHost').innerHTML = html;
    }
    window.basculerAutre = function () { PLIE_AUTRE = !PLIE_AUTRE; rendreAttentes(); };

    /** Attribue un élément À SA SOURCE — chaque module range l'information à un endroit différent,
     *  c'est précisément ce qui rendait l'attribution introuvable depuis un écran commun. */
    window.attribuer = async function (itemId, qui) {
      const it = ATTENTES.filter(function (x) { return x.id === itemId; })[0];
      if (!it) return;
      let res = null;
      try {
        if (it.source === 'rdv') {
          const r = await SS.getRdv(it.rdv_id);
          if (!r || !r.id) { toast('Demande introuvable — recharge la page.', 'error'); return; }
          r.assigned_to = qui;
          r.date_modification = new Date().toISOString();
          res = await SS.saveRdv(r);
        } else if (it.source === 'sav') {
          const d = await SS.getDevis(it.devis_id);
          const t = ((d && d.sav_tickets) || []).filter(function (x) { return String(x.id) === String(it.ticket_id); })[0];
          if (!t) { toast('Ticket introuvable — recharge la page.', 'error'); return; }
          // On renvoie le ticket ENTIER : le serveur le reconstruit champ par champ, omettre une
          // clé l'effacerait.
          res = await SS.saveSavTicket(it.devis_id, Object.assign({}, t, { pour: qui }));
        } else if (it.source === 'echange') {
          const s = SUJETS.filter(function (x) { return x.id === it.sujet_id; })[0];
          if (!s) { toast('Sujet introuvable — recharge la page.', 'error'); return; }
          res = await SS.saveSujet(Object.assign({}, s, { pour: qui }));
        } else if (it.source === 'planning') {
          const d = await SS.getDevis(it.devis_id);
          if (!d || !d.id) { toast('Dossier introuvable — recharge la page.', 'error'); return; }
          if (it.nature === 'depannage') {
            // Les intervenants sont saisis en clair : on préserve les tiers (« Jean (intérim) »).
            const anciens = (d.depannage && d.depannage.techniciens) || [];
            const tiers = anciens.filter(function (t) {
              const k = String(t || '').trim().toLowerCase();
              return k !== 'nicolas' && k !== 'yannick';
            });
            d.depannage = Object.assign({}, d.depannage || {}, { techniciens: [nomDe(qui)].concat(tiers) });
          } else {
            d.chantier = Object.assign({}, d.chantier || {}, { equipe: qui });
          }
          d.date_modification = new Date().toISOString();
          res = await SS.saveDevis(d);
        }
      } catch (e) {
        toast('Attribution impossible : ' + e.message, 'error', 7000); return;
      }
      if (res && res.ok === false) { toast(res.error || 'Non enregistré — réessaie.', 'error', 7000); return; }
      if (res && res.conflict) { window.SSUI.showSaveConflict(function () { location.reload(); }); return; }
      toast(qui === MOI.key ? 'C’est pour toi' : 'Confié à ' + nomDe(qui), 'ok');
      charger();
    };

    function avatar(k) {
      const couleur = k === 'yannick' ? 'var(--accent-2)' : 'var(--accent)';
      return '<span class="ec-ava" style="--ac:' + couleur + '">' + escHtml(nomDe(k).slice(0, 1)) + '</span>';
    }

    function carte(s) {
      const n = NATURES[s.kind] || NATURES.afaire;
      const pourMoi = s.awaiting === MOI.key && s.statut !== 'fait';
      const id = window.SSUI.jsAttr(s.id);
      const enRetard = s.echeance && s.echeance < new Date().toISOString().slice(0, 10) && s.statut !== 'fait';
      const meta = [
        nomDe(s.auteur),
        relTime(s.date_creation),
        s.pour ? 'pour ' + nomDe(s.pour) : 'pour nous deux',
        s.echeance ? (enRetard ? '⚠ ' : '') + 'pour le ' + fmtDate(s.echeance) : '',
      ].filter(Boolean).join(' · ');
      const lienClient = s.client_nom
        ? ' · <a class="ec-lien" href="clients.html?q=' + encodeURIComponent(s.client_nom) + '">' + escHtml(s.client_nom) + '</a>'
        : '';
      return '<div class="ec-suj ' + (pourMoi ? 'pour-moi' : '') + ' ' + (s.statut === 'fait' ? 'est-fait' : '') + '" style="--kc:' + n.couleur + '" id="suj-' + escHtml(s.id) + '">' +
        '<div class="ec-tete">' +
          '<span class="ec-nat">' + escHtml(n.label) + '</span>' +
          '<span class="ec-titre">' + escHtml(s.titre) + '</span>' +
          (s.statut === 'fait'
            ? '<span class="ec-balle" style="color:var(--ok);border-color:color-mix(in srgb,var(--ok) 45%,transparent)">Fait</span>'
            : (s.awaiting ? '<span class="ec-balle ' + (pourMoi ? 'moi' : '') + '">' + (pourMoi ? 'À toi de jouer' : 'Chez ' + escHtml(nomDe(s.awaiting))) + '</span>' : '')) +
        '</div>' +
        '<div class="ec-meta">' + escHtml(meta) + lienClient + '</div>' +
        (s.corps ? '<div class="ec-corps">' + escHtml(s.corps) + '</div>' : '') +
        (s.decision ? '<div class="ec-decision">' + icon('check', 13) +
          '<div><b>Décidé :</b> ' + escHtml(s.decision) +
          '<div class="qd">' + escHtml(nomDe(s.decision_par) + (s.decision_le ? ' · ' + relTime(s.decision_le) : '')) + '</div></div></div>' : '') +
        ((s.reponses || []).length ? '<div class="ec-fil">' + s.reponses.map(function (r) {
          return '<div class="ec-rep">' + avatar(r.auteur) + '<div><div class="txt">' + escHtml(r.texte) + '</div>' +
            '<div class="qd">' + escHtml(nomDe(r.auteur) + ' · ' + relTime(r.date)) + '</div></div></div>';
        }).join('') + '</div>' : '') +
        '<div class="ec-actions">' +
          (s.statut === 'fait'
            ? '<button class="btn btn-ghost btn-sm" onclick="rouvrir(' + id + ')">' + icon('reply', 13) + ' Rouvrir</button>'
            : '<button class="btn btn-ghost btn-sm" onclick="ouvrirReponse(' + id + ')">' + icon('message', 13) + ' Répondre</button>' +
              '<button class="btn btn-ghost btn-sm" onclick="marquerFait(' + id + ')">' + icon('check', 13) + ' C’est fait</button>') +
          (s.devis_id ? '<button class="btn btn-ghost btn-sm" onclick="location.href=\'vue.html?id=' + encodeURIComponent(s.devis_id) + '\'">' + icon('window', 13) + ' Le dossier</button>' : '') +
          '<button class="btn btn-ghost btn-sm" style="margin-left:auto;color:var(--danger);border-color:color-mix(in srgb,var(--danger) 35%,transparent)" onclick="supprimer(' + id + ')">Supprimer</button>' +
        '</div>' +
        '<div class="ec-repbox ' + (DECIDE === s.id ? 'on' : '') + '" id="dec-' + escHtml(s.id) + '">' +
          '<textarea class="textarea" id="dt-' + escHtml(s.id) + '" style="min-height:58px" placeholder="' +
            (s.kind === 'question' ? 'Ce qui a été décidé (obligatoire sur une question)…' : 'Ce qui a été décidé, ou fait (facultatif)…') + '"></textarea>' +
          '<div class="ec-fin">' +
            '<button class="btn btn-ghost btn-sm" onclick="ouvrirDecision(' + id + ')">Annuler</button>' +
            '<button class="btn btn-primary btn-sm" style="margin-left:auto" onclick="classerAvecDecision(' + id + ')">Classer</button>' +
          '</div>' +
        '</div>' +
        '<div class="ec-repbox ' + (REPOND === s.id ? 'on' : '') + '" id="rep-' + escHtml(s.id) + '">' +
          '<textarea class="textarea" id="rt-' + escHtml(s.id) + '" placeholder="Ta réponse…" style="min-height:58px"></textarea>' +
          '<div class="ec-fin">' +
            '<label class="chip" style="cursor:pointer"><input type="checkbox" id="rl-' + escHtml(s.id) + '" style="vertical-align:-1px"> Et je lui redemande</label>' +
            '<button class="btn btn-primary btn-sm" style="margin-left:auto" onclick="envoyerReponse(' + id + ')">Envoyer</button>' +
          '</div>' +
        '</div>' +
        '</div>';
    }

    // ── Actions ──────────────────────────────────────────────────────────────────────────────
    window.setKind = function (k) { P_KIND = k; rendrePuces(); };
    window.setPour = function (p) { P_POUR = p; rendrePuces(); };
    window.setFiltre = function (k) { F_KIND = k; rendre(); };

    window.publier = async function () {
      const brut = el('pTitre').value.trim();
      if (!brut) { toast('Écris quelque chose d’abord.', 'warn'); return; }
      // Première ligne = titre, le reste = corps. Personne n'a envie de remplir deux champs pour
      // noter une idée en dix secondes.
      const lignes = brut.split('\n');
      const titre = lignes[0].trim().slice(0, 200);
      const corps = lignes.slice(1).join('\n').trim();
      const nomClient = el('pClient').value.trim();
      const lie = CLIENTS.filter(function (c) { return c.nom.toLowerCase() === nomClient.toLowerCase(); })[0];
      const s = {
        id: 'SUJ-' + new Date().getFullYear() + '-' + Math.random().toString(36).slice(2, 8).toUpperCase(),
        kind: P_KIND, pour: P_POUR, statut: 'ouvert',
        titre: titre, corps: corps,
        client_nom: nomClient, client_key: (lie && lie.key) || '', devis_id: DEVIS_LIE,
        echeance: el('pEcheance').value || '',
      };
      const btn = el('btnPublier'); btn.disabled = true;
      const res = await SS.saveSujet(s);
      btn.disabled = false;
      if (res.ok === false) { toast(res.error || 'Non publié.', 'error', 7000); return; }
      el('pTitre').value = ''; el('pClient').value = ''; el('pEcheance').value = '';
      DEVIS_LIE = ''; el('pContexte').innerHTML = '';
      toast(P_POUR ? 'Envoyé à ' + nomDe(P_POUR) : 'Publié', 'ok');
      SUJETS = (await SS.listSujets()) || [];
      rendre();
    };

    window.ouvrirReponse = function (id) {
      REPOND = REPOND === id ? '' : id;
      rendre();
      const t = el('rt-' + id);
      if (t) t.focus();
    };

    window.envoyerReponse = async function (id) {
      const champ = el('rt-' + id);
      const texte = (champ && champ.value.trim()) || '';
      if (!texte) { toast('Ta réponse est vide.', 'warn'); return; }
      const relanceCase = el('rl-' + id);
      const s = SUJETS.filter(function (x) { return x.id === id; })[0];
      // « Et je lui redemande » repasse explicitement la balle. Sans cette case, répondre libère
      // l'attente : c'est le comportement voulu neuf fois sur dix.
      const relance = (relanceCase && relanceCase.checked && s) ? (s.auteur === MOI.key ? autre(MOI.key) : s.auteur) : '';
      const res = await SS.repondreSujet(id, { texte: texte, relance: relance });
      if (res.ok === false) { toast(res.error || 'Réponse non enregistrée.', 'error', 7000); return; }
      REPOND = '';
      toast('Réponse envoyée', 'ok');
      SUJETS = (await SS.listSujets()) || [];
      rendre();
    };

    // ── La décision ──────────────────────────────────────────────────────────────────────────
    // C'est elle qui fait la différence entre une messagerie et une mémoire commune : « on avait
    // dit quoi pour les coulisses de Depaepe ? » doit avoir une réponse dans l'ERP, pas dans un
    // SMS perdu. On la demande AU MOMENT de classer — après, personne ne revient l'écrire.
    window.ouvrirDecision = function (id) {
      DECIDE = DECIDE === id ? '' : id;
      rendre();
      const t = el('dt-' + id);
      if (t) t.focus();
    };
    window.classerAvecDecision = async function (id) {
      const champ = el('dt-' + id);
      const texte = (champ && champ.value.trim()) || '';
      const s = SUJETS.filter(function (x) { return x.id === id; })[0];
      if (!s) return;
      // Sur une QUESTION, la décision est le résultat même : la classer sans rien noter, c'est
      // perdre exactement ce qu'on voulait garder. Ailleurs elle reste facultative.
      if (!texte && s.kind === 'question') {
        toast('Écris ce qui a été décidé — c’est tout l’intérêt de classer une question.', 'warn', 6000);
        if (champ) champ.focus();
        return;
      }
      DECIDE = '';
      await majStatut(id, 'fait', texte);
    };

    async function majStatut(id, statut, decision) {
      const s = SUJETS.filter(function (x) { return x.id === id; })[0];
      if (!s) return;
      // On étale le sujet et on ne change que le statut : une énumération de champs perdrait
      // silencieusement ce qu'elle ne connaît pas (règle 2 du guide). Les RÉPONSES, elles, ne
      // passent jamais par ici — le serveur les conserve et elles ont leur propre route.
      const patch = { statut: statut };
      if (decision) patch.decision = decision;
      const res = await SS.saveSujet(Object.assign({}, s, patch));
      if (res.ok === false) { toast(res.error || 'Non enregistré.', 'error', 7000); return; }
      toast(statut === 'fait' ? 'Classé' : 'Rouvert', 'ok');
      SUJETS = (await SS.listSujets()) || [];
      rendre();
    }
    window.marquerFait = function (id) { ouvrirDecision(id); };
    window.rouvrir = function (id) { majStatut(id, 'ouvert'); };

    window.supprimer = async function (id) {
      const s = SUJETS.filter(function (x) { return x.id === id; })[0];
      if (!s || !confirm('Supprimer « ' + s.titre +' » et toutes ses réponses ?')) return;
      const res = await SS.deleteSujet(id);
      if (res.ok === false) { toast(res.error || 'Suppression impossible.', 'error', 7000); return; }
      toast('Supprimé', 'ok');
      SUJETS = (await SS.listSujets()) || [];
      rendre();
    };

    // Ctrl+Entrée publie : on note une idée en passant, sans lâcher le clavier.
    el('pTitre').addEventListener('keydown', function (ev) {
      if ((ev.ctrlKey || ev.metaKey) && ev.key === 'Enter') { ev.preventDefault(); publier(); }
    });

    charger();
  </script>
</body>
</html>
