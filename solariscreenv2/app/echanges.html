    window.publier = async function () {
      const brut = el('pTitre').value.trim();
      if (!brut) { toast('Écris quelque chose d’abord.', 'warn'); el('pTitre').focus(); return; }
      // Première ligne = titre, le reste = corps. Personne n'a envie de remplir deux champs pour
      // noter une idée en dix secondes. La fabrique vit dans ui.js : le tableau de bord écrit
      // aussi des sujets (« un mot à l'autre »), et les deux doivent poser les mêmes champs.
      const cl = clientDepuisNom(el('pClient').value);
      // Le menu, quand il est là, fait foi — « Aucun dossier en particulier » compris.
      const dossier = !el('pDossier').hidden ? el('pDossier').value : DEVIS_LIE;
      const s = window.SSUI.nouveauSujet(brut, {
        kind: P_KIND, pour: P_POUR,
        client_nom: cl.client_nom, client_key: cl.client_key, devis_id: dossier,
        echeance: el('pEcheance').value || '',
      });
      const btn = el('btnPublier'); btn.disabled = true;
      const res = await SS.saveSujet(s);
      btn.disabled = false;
      if (!res || res.ok === false) { toast((res && res.error) || 'Non publié.', 'error', 7000); return; }
      el('pTitre').value = ''; el('pClient').value = ''; el('pEcheance').value = '';
      DEVIS_LIE = ''; majDossiersPoster();
      // Les photos partent MAINTENANT : la route ciblée a besoin de l'identifiant, qui n'existait
      // pas avant l'enregistrement. Chaque échec est dit — une photo qu'on croit jointe et qui ne
      // l'est pas vaut moins que pas de photo du tout.
      if (PHOTOS_EN_ATTENTE.length) {
        toast('Envoi de ' + PHOTOS_EN_ATTENTE.length + ' photo(s)…', 'ok', 2500);
        for (const ph of PHOTOS_EN_ATTENTE) {
          const url = await window.SSUI.compressAndUploadPhoto(ph.fichier, s.id, 1600, 0.82).catch(function () { return null; });
          if (!url) { toast('Une photo n’a pas pu être envoyée.', 'error', 6000); continue; }
          const r = await SS.addSujetPhoto(s.id, { url: url });
          if (r.ok === false) toast(r.error || 'Photo non jointe.', 'error', 6000);
        }
        PHOTOS_EN_ATTENTE = [];
        rendreVignettes();
      }
      el('poster').classList.remove('ouvert');
      toast(P_POUR ? 'Envoyé à ' + nomDe(P_POUR) : 'Publié', 'ok');
      recharger();
    };

    /* Le destinataire en cours de correction. Il ne peut pas vivre dans le DOM comme les autres
       champs : c'est un groupe de boutons, pas un input, donc il n'a pas de `value` à relire.
       Remis à null à chaque ouverture — sinon le choix fait sur un sujet suivrait sur le suivant. */
    let EDITE_POUR = null;
    window.choisirPourEdition = function (id, v) { EDITE_POUR = v; rendre(); };

    window.ouvrirEdition = function (id) {
      EDITE_POUR = null;
      EDITE = EDITE === id ? '' : id;
      EDITE_REP = '';
      if (EDITE) OUVERTES.add(id);
      rendre();
      const t = el('et-' + id);
      if (t) { t.focus(); t.setSelectionRange(t.value.length, t.value.length); }
    };

    window.enregistrerEdition = async function (id) {
      const champ = el('et-' + id);
      const brut = (champ && champ.value.trim()) || '';
      if (!brut) { toast('Il faut au moins une phrase.', 'warn'); return; }
      const s = sujetDe(id);
      if (!s) return;
      const lignes = brut.split('\n');
      // ⚠️ On ETALE le sujet existant (règle 2 du guide) : une énumération de champs perdrait en
      // silence tout ce qu'elle ne connaît pas — l'échéance, le client lié, la décision déjà prise.
      const champClient = el('ec-' + id);
      const champEcheance = el('ee-' + id);
      const champDossier = el('ed-dos-' + id);
      const res = await enregistrer(s, Object.assign({
        titre: lignes[0].trim().slice(0, 200),
        corps: lignes.slice(1).join('\n').trim(),
      }, champClient ? clientDepuisNom(champClient.value) : {},
         champDossier && !champDossier.hidden ? { devis_id: champDossier.value || '' } : (champClient && !champClient.value.trim() ? { devis_id: '' } : {}),
         champEcheance ? { echeance: champEcheance.value || '' } : {},
         EDITE_POUR === null ? {} : { pour: EDITE_POUR }));
      if (!res) return;
      EDITE = ''; EDITE_POUR = null;
      toast('Corrigé', 'ok');
      recharger();
    };

    /** Joindre des photos à un sujet DÉJÀ publié. Pas de file d'attente ici, contrairement à la
     *  publication : l'identifiant existe, donc l'envoi part tout de suite. */
    window.joindrePhotos = async function (id, input) {
      const fichiers = [...(input.files || [])];
      input.value = '';
      if (!fichiers.length) return;
      toast('Envoi de ' + fichiers.length + ' photo(s)…', 'ok', 2500);
      for (const f of fichiers) {
        if (!/^image\//.test(f.type)) { toast('« ' + f.name + ' » n’est pas une image.', 'warn'); continue; }
        const url = await window.SSUI.compressAndUploadPhoto(f, id, 1600, 0.82).catch(function () { return null; });
        // Chaque échec est DIT : une photo qu'on croit jointe et qui ne l'est pas vaut moins que
        // pas de photo du tout.
        if (!url) { toast('Une photo n’a pas pu être envoyée.', 'error', 6000); continue; }
        const r = await SS.addSujetPhoto(id, { url: url });
        if (r.ok === false) toast(r.error || 'Photo non jointe.', 'error', 6000);
      }
      recharger();
    };

    window.editerReponse = function (rid) { EDITE_REP = rid; EDITE = ''; rendre(); const t = el('re-' + rid); if (t) { t.focus(); t.setSelectionRange(t.value.length, t.value.length); } };
    window.annulerEditionReponse = function () { EDITE_REP = ''; rendre(); };

    window.enregistrerReponse = async function (id, rid) {
      const champ = el('re-' + rid);
      const texte = (champ && champ.value.trim()) || '';
      if (!texte) { toast('Une réponse vide ne corrige rien.', 'warn'); return; }
      const res = await SS.modifierReponse(id, rid, texte);
      if (!res || res.ok === false) { toast((res && res.error) || 'Correction non enregistrée.', 'error', 7000); return; }
      EDITE_REP = '';
      toast('Corrigé', 'ok');
      recharger();
    };

    /** Ouvre la zone de réponse — dans la carte, ou (`zone` = 'a') dans la ligne de « ce qui attend ». */
    window.ouvrirReponse = function (id, zone) {
      if (zone === 'a') { AT_REPOND = AT_REPOND === id ? '' : id; AT_DECIDE = ''; }
      else { REPOND = REPOND === id ? '' : id; EDITE = ''; EDITE_REP = ''; DECIDE = ''; if (REPOND) OUVERTES.add(id); }
      rendre();
      const t = el((zone === 'a' ? 'art-' : 'rt-') + id);
      if (t) t.focus();
    };

    window.envoyerReponse = async function (id, zone) {
      const p = zone === 'a' ? 'a' : '';
      const champ = el(p + 'rt-' + id);
      const texte = (champ && champ.value.trim()) || '';
      if (!texte) { toast('Ta réponse est vide.', 'warn'); if (champ) champ.focus(); return; }
      const relanceCase = el(p + 'rl-' + id);
      const s = sujetDe(id);
      // « Et je lui redemande » repasse explicitement la balle. Sans cette case, répondre libère
      // l'attente : c'est le comportement voulu neuf fois sur dix.
      const relance = (relanceCase && relanceCase.checked && s) ? (s.auteur === MOI.key ? autre(MOI.key) : s.auteur) : '';
      const res = await SS.repondreSujet(id, { texte: texte, relance: relance });
      if (!res || res.ok === false) { toast((res && res.error) || 'Réponse non enregistrée.', 'error', 7000); return; }
      if (zone === 'a') AT_REPOND = ''; else REPOND = '';
      toast('Réponse envoyée', 'ok');
      recharger();
    };

    /* F — « Lui rappeler » : un rappel daté et signé dans le fil, la balle reste chez l'autre. Il
       remonte le sujet dans sa liste ; l'ancienneté, elle, continue de courir (« balle_le »). */
    window.rappeler = async function (id) {
      const s = sujetDe(id);
      if (!s || !EC.peutRappeler(s, MOI.key)) return;
      const res = await SS.repondreSujet(id, { texte: EC.TEXTE_RAPPEL, rappel: true });
      if (!res || res.ok === false) { toast((res && res.error) || 'Rappel non enregistré.', 'error', 7000); return; }
      toast('Rappel ajouté au fil — c’est toujours chez ' + nomDe(s.awaiting), 'ok');
      recharger();
    };

    // ── La décision ──────────────────────────────────────────────────────────────────────────
    // C'est elle qui fait la différence entre une messagerie et une mémoire commune : « on avait
    // dit quoi pour les coulisses de Depaepe ? » doit avoir une réponse dans l'ERP, pas dans un
    // SMS perdu. On la demande AU MOMENT de classer — après, personne ne revient l'écrire.
    window.ouvrirDecision = function (id, zone) {
      if (zone === 'a') { AT_DECIDE = AT_DECIDE === id ? '' : id; AT_REPOND = ''; }
      else { DECIDE = DECIDE === id ? '' : id; REPOND = ''; EDITE = ''; if (DECIDE) OUVERTES.add(id); }
      rendre();
      const t = el((zone === 'a' ? 'adt-' : 'dt-') + id);
      if (t) t.focus();
    };
    window.classerAvecDecision = async function (id, zone) {
      const champ = el((zone === 'a' ? 'adt-' : 'dt-') + id);
      const texte = (champ && champ.value.trim()) || '';
      const s = sujetDe(id);
      if (!s) return;
      // Sur une QUESTION, la décision est le résultat même : la classer sans rien noter, c'est
      // perdre exactement ce qu'on voulait garder. Ailleurs elle reste facultative.
      if (!texte && s.kind === 'question') {
        toast('Écris ce qui a été décidé — c’est tout l’intérêt de classer une question.', 'warn', 6000);
        if (champ) champ.focus();
        return;
      }
      if (await majStatut(id, 'fait', texte)) { if (zone === 'a') AT_DECIDE = ''; else DECIDE = ''; recharger(); }
    };

    async function majStatut(id, statut, decision) {
      const s = sujetDe(id);
      if (!s) return false;
      // On étale le sujet et on ne change que le statut : une énumération de champs perdrait
      // silencieusement ce qu'elle ne connaît pas (règle 2 du guide). Les RÉPONSES, elles, ne
      // passent jamais par ici — le serveur les conserve et elles ont leur propre route.
      const patch = { statut: statut };
      if (decision) patch.decision = decision;
      if (!(await enregistrer(s, patch))) return false;
      toast(statut === 'fait' ? 'Classé' : 'Rouvert', 'ok');
      return true;
    }
    window.marquerFait = function (id) { ouvrirDecision(id); };
    // La revue vit dans « Ce qui attend » ; la décision s'écrit sur la carte, dans « Les échanges » :
    // on y emmène, sinon la zone s'ouvrirait dans un onglet caché et le bouton aurait l'air mort.
    window.classerDepuisRevue = function (id) { allerAuSujet(id); ouvrirDecision(id); };
    window.rouvrir = async function (id) { if (await majStatut(id, 'ouvert')) recharger(); };

    // On passe TOUTES les photos du sujet et l index du clic : les fleches servent alors a passer
    // d une photo a l autre sans refermer -- c est le geste naturel quand il y en a plusieurs.
    window.voirPhotos = function (id, index) {
      const s = sujetDe(id);
      if (!s) return;
      window.SSUI.ouvrirPhotos((s.photos || []).map(function (p) { return p.url; }), index);
    };

    window.supprimerPhoto = async function (id, photoId) {
      if (!confirm('Supprimer cette photo ?')) return;
      const res = await SS.removeSujetPhoto(id, photoId);
      if (!res || res.ok === false) { toast((res && res.error) || 'Non supprimée.', 'error', 7000); return; }
      toast('Photo supprimée', 'ok');
      recharger();
    };

    window.supprimer = async function (id) {
      const s = sujetDe(id);
      if (!s || !confirm('Supprimer « ' + s.titre + ' » ?')) return;
      const res = await SS.deleteSujet(id);
      if (!res || res.ok === false) { toast((res && res.error) || 'Suppression impossible.', 'error', 9000); return; }
      toast('Supprimé', 'ok');
      recharger();
    };

    // Ctrl+Entrée publie : on note une idée en passant, sans lâcher le clavier.
    el('pTitre').addEventListener('keydown', function (ev) {
      if ((ev.ctrlKey || ev.metaKey) && ev.key === 'Enter') { ev.preventDefault(); publier(); }
    });

    charger();
  </script>
</body>
</html>
