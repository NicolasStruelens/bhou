<!DOCTYPE html>
<html lang="fr" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>SolariScreen — Échanges</title>
  <link rel="manifest" href="../manifest.webmanifest">
  <meta name="theme-color" content="#0b1224" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#f4f6fb" media="(prefers-color-scheme: light)">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="SolariScreen">
  <link rel="apple-touch-icon" href="../assets/img/apple-touch-icon.png">
  <link rel="icon" type="image/svg+xml" href="../assets/img/logo-solariscreen.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600;700&family=Orbitron:wght@600;800&display=swap" rel="stylesheet">
  <script src="../assets/js/theme.js"></script>
  <link rel="stylesheet" href="../assets/css/tokens.css">
  <link rel="stylesheet" href="../assets/css/theme-dark.css">
  <link rel="stylesheet" href="../assets/css/theme-light.css">
  <link rel="stylesheet" href="../assets/css/theme-cyberpunk.css">
  <link rel="stylesheet" href="../assets/css/theme-zen.css">
  <link rel="stylesheet" href="../assets/css/theme-ardoise.css">
  <link rel="stylesheet" href="../assets/css/base.css">
  <style>
    /* ── C — Écrire en une ligne ───────────────────────────────────────────────────────────────
       Écrire reste la chose la plus facile de la page : la zone est en haut, ouverte. Mais ses
       options (nature, destinataire, client, dossier, date, photo) prenaient 458 px sur téléphone
       AVANT qu'on ait écrit un mot. Elles s'ouvrent au premier mot (ou au focus) et se referment
       quand la zone est vide et qu'on la quitte. */
    .ec-poster { border: 1px solid var(--border); border-radius: var(--r-md); background: var(--surface); padding: var(--sp-3) var(--sp-4); margin-bottom: var(--sp-4); }
    .ec-poster .textarea { min-height: 42px; height: 42px; resize: none; transition: height var(--t-fast); }
    /* Fermée, la zone ne défile pas : une barre de défilement dans un champ d'une ligne ressemble à une panne. */
    .ec-poster:not(.ouvert) .textarea { overflow: hidden; }
    .ec-poster.ouvert .textarea { height: auto; min-height: 72px; resize: vertical; }
    .ec-poster .ec-plus { display: none; }
    .ec-poster.ouvert .ec-plus { display: block; }
    .ec-contexte { margin-top: var(--sp-2); font-family: var(--font-mono); font-size: var(--fs-2xs); color: var(--accent-2); }
    .ec-contexte:empty { display: none; }
    .ec-opts { display: flex; flex-wrap: wrap; gap: var(--sp-2); align-items: center; margin-top: var(--sp-3); }
    .ec-opts .sep { width: 1px; height: 22px; background: var(--border); flex: none; }
    .ec-fin { display: flex; flex-wrap: wrap; gap: var(--sp-2); align-items: center; margin-top: var(--sp-3); }
    .ec-fin .input, .ec-fin .select { height: auto; padding: 0.4rem 0.6rem; font-size: var(--fs-champ); line-height: 1.25; }
    .ec-lie { flex: 1 1 220px; min-width: 160px; }
    .ec-dossier { flex: 1 1 220px; min-width: 160px; }
    .ec-dossier[hidden] { display: none; }
    .ec-envoi { margin-left: auto; }

    /* Une puce = une nature ou un destinataire. Hauteur explicite : `pointer: coarse` de base.css
       ne couvre pas les composants maison, ils resteraient à 21 px sur un vrai téléphone. */
    .ec-chip { display: inline-flex; align-items: center; gap: 0.35rem; min-height: 34px; padding: 0.3rem 0.65rem;
      border: 1px solid var(--border-strong); border-radius: var(--r-pill); background: none; color: var(--text-muted);
      font-size: var(--fs-xs); cursor: pointer; white-space: nowrap; }
    .ec-chip.on { border-color: var(--kc, var(--accent)); color: var(--kc, var(--accent)); background: color-mix(in srgb, var(--kc, var(--accent)) 12%, transparent); }

    /* ── B — Trois onglets ─────────────────────────────────────────────────────────────────────
       Le premier sujet tombait sous 1 400 px d'attentes (2 149 px sur téléphone). Chaque onglet porte
       son nombre ; aucun ne pose d'étape d'historique : « retour » quitte la page. */
    .ec-onglets { display: flex; flex-wrap: wrap; gap: 0; border: 1px solid var(--border-strong); border-radius: var(--r-md);
      overflow: hidden; background: var(--surface); margin-bottom: var(--sp-4); width: fit-content; max-width: 100%; }
    .ec-onglets button { border: 0; background: transparent; color: var(--text-muted); font: inherit; font-weight: 600;
      font-size: var(--fs-sm); padding: 0.55rem 1rem; cursor: pointer; display: inline-flex; gap: 0.4rem; align-items: center; white-space: nowrap; }
    /* Un libellé court pour le téléphone : « Ce qui attend » passait sur deux lignes, son nombre à part. */
    .ec-onglets .lc { display: none; }
    .ec-onglets button .n { font-family: var(--font-mono); font-size: var(--fs-2xs); color: var(--text-subtle); }
    .ec-onglets button[aria-selected="true"] { background: color-mix(in srgb, var(--accent) 16%, transparent); color: var(--text); box-shadow: inset 0 -2px 0 var(--accent); }
    .ec-onglets button[aria-selected="true"] .n { color: var(--accent); }
    .ec-onglets button:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }

    /* ── Ce qui attend (les quatre modules réunis) ─────────────────────────────────────────── */
    /* ⚠️ UN COMPTEUR QUI NE DÉSIGNE RIEN FAIT CHERCHER. « C'est quoi la situation critique ? »
       (Nicolas, 12/10/2026, capture à l'appui) : le bandeau annonçait « 1 situation critique » et
       les trois lignes en dessous étaient rigoureusement identiques à l'œil. Rien ne portait
       l'urgence : le liseré de gauche dit la SOURCE, l'âge dit l'ÂGE — et à 9, 10 et 11 jours les
       trois étaient rouges. Il fallait donc connaître les seuils d'`attente.js` par cœur pour
       répondre. **Un écran qui compte doit désigner**, sinon on cherche, et au bout de deux fois
       on ne cherche plus. */
    .at-critique { display: block; width: 100%; text-align: left; margin-bottom: var(--sp-4);
      padding: var(--sp-2) var(--sp-3); border-radius: var(--r-sm); font-family: var(--font-mono);
      font-size: var(--fs-2xs); text-transform: uppercase; letter-spacing: 0.06em;
      color: var(--danger); border: 1px solid color-mix(in srgb, var(--danger) 40%, transparent);
      background: color-mix(in srgb, var(--danger) 8%, transparent); line-height: 1.5;
      cursor: pointer; }
    .at-critique:hover, .at-critique:focus-visible {
      background: color-mix(in srgb, var(--danger) 15%, transparent);
      border-color: color-mix(in srgb, var(--danger) 70%, transparent); }
    .at-critique svg { vertical-align: -2px; margin-right: 6px; }
    /* ⚠️ L'ACTION PORTE SON MOT. Un bandeau cliquable sans rien qui le dise, personne ne
       clique dessus — et sur téléphone il n'y a pas de survol pour le découvrir. */
    .at-aller { text-decoration: underline; font-weight: 700; white-space: nowrap; }
    /* Hauteur de cible tactile : le bloc `pointer: coarse` de base.css ne couvre que `.btn`. */
    @media (pointer: coarse) { .at-critique { min-height: 44px; } }

    /* ⚠️ LA PASTILLE NOMME L'URGENCE, elle ne se contente pas de la colorier. C'est la même
       règle que les raccourcis sans légende : une couleur seule se devine, un mot se lit. Et elle
       ne touche NI le liseré NI le fond de la ligne, qui disent déjà autre chose (la source, et
       « personne ne s'en occupe ») : deux sens sur un même signe, et les deux se perdent. */
    .at-urg { flex: 0 0 auto; font-family: var(--font-mono); font-size: var(--fs-3xs);
      text-transform: uppercase; letter-spacing: 0.06em; padding: 0.1rem 0.45rem;
      border-radius: var(--r-sm); background: var(--danger); color: var(--on-accent);
      font-weight: 700; }
    /* ⚠️ LA PULSATION MARQUE UN ÉVÉNEMENT, PAS UN ÉTAT : elle dure le temps d'arriver et
       s'éteint seule. Un halo permanent sur la ligne critique redeviendrait du décor, et on
       cesserait de le voir — exactement ce qu'on vient de corriger. */
    .at-item.at-vise { animation: at-vise 1.4s ease-out 1; }
    @keyframes at-vise {
      0%   { box-shadow: 0 0 0 0 color-mix(in srgb, var(--danger) 55%, transparent); }
      70%  { box-shadow: 0 0 0 10px color-mix(in srgb, var(--danger) 0%, transparent); }
      100% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--danger) 0%, transparent); }
    }
    /* Sans mouvement, la visée doit quand même se voir : un cadre, qu'on retire au même moment. */
    @media (prefers-reduced-motion: reduce) {
      .at-item.at-vise { animation: none; outline: 2px solid var(--danger); outline-offset: 2px; }
    }
    .at-bloc { margin-bottom: var(--sp-5); }
    .at-titre { display: flex; align-items: center; gap: var(--sp-2); font-family: var(--font-mono); font-size: var(--fs-2xs);
      text-transform: uppercase; letter-spacing: 0.08em; color: var(--text-subtle); margin-bottom: var(--sp-3); }
    .at-titre .n { color: var(--text-muted); }
    .at-titre.alerte { color: var(--danger); }
    .at-liste { display: flex; flex-direction: column; gap: var(--sp-2); }
    .at-item { display: flex; align-items: flex-start; gap: var(--sp-3); flex-wrap: wrap;
      border: 1px solid var(--border); border-left: 3px solid var(--uc, var(--border-strong)); border-radius: var(--r-md);
      background: var(--surface); padding: var(--sp-3) var(--sp-4); }
    .at-item.orphelin { border-left-color: var(--danger); background: color-mix(in srgb, var(--danger) 5%, var(--surface)); }
    .at-corps { flex: 1 1 14ch; min-width: 14ch; }
    .at-l1 { display: flex; align-items: baseline; gap: var(--sp-2); flex-wrap: wrap; }
    .at-quoi { font-weight: 600; color: var(--text); }
    .at-nom { font-family: var(--font-mono); font-size: var(--fs-2xs); color: var(--text-muted); }
    .at-src { flex: 0 0 auto; font-family: var(--font-mono); font-size: var(--fs-3xs); text-transform: uppercase;
      letter-spacing: 0.06em; padding: 0.1rem 0.45rem; border-radius: var(--r-sm); color: var(--sc, var(--accent));
      border: 1px solid color-mix(in srgb, var(--sc, var(--accent)) 40%, transparent); }
    .at-detail { font-size: var(--fs-xs); color: var(--text-subtle); margin-top: 0.2rem;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .at-age { font-family: var(--font-mono); font-size: var(--fs-3xs); color: var(--text-subtle); }
    .at-age.vieux { color: var(--warn); }
    .at-age.tresvieux { color: var(--danger); font-weight: 700; }
    .at-actions { display: flex; gap: var(--sp-2); flex-wrap: wrap; flex: 0 0 auto; }
    /* D — la réponse donnée SUR PLACE, dans la ligne de « ce qui attend ». */
    .at-boite { flex: 1 1 100%; }
    .at-plie { background: none; border: none; color: var(--text-subtle); font-family: var(--font-mono);
      font-size: var(--fs-2xs); cursor: pointer; text-decoration: underline; padding: 0; }
    .at-vide { border: 1px dashed var(--border-strong); border-radius: var(--r-md); padding: var(--sp-5);
      text-align: center; color: var(--text-subtle); font-size: var(--fs-sm); }

    /* ── Liste ─────────────────────────────────────────────────────────────────────────────── */
    /* Repère bref après un saut depuis la recherche : sans lui, on atterrit au milieu d'une liste
       sans savoir laquelle des cartes on était venu lire. */
    .ec-suj.vise { box-shadow: 0 0 0 2px var(--accent); }
    /* Un lien d'action dans une ligne de metadonnees : il doit se lire comme du texte, pas comme
       un bouton — sinon la ligne « Nicolas · il y a 2 h » se met a ressembler a une barre d'outils. */
    .ec-lien-bouton { background: none; border: none; padding: 0; font: inherit; color: var(--accent);
      cursor: pointer; text-decoration: underline; text-underline-offset: 2px; }
    .ec-lien-bouton:hover { color: var(--accent-2); }
    /* ⚠️ Au doigt, ces liens font 13 à 15 px de haut : intouchables. On élargit la CIBLE à 44 px par
       un pseudo-élément plutôt que par du padding — le padding décalerait la ligne de métadonnées.
       Le pseudo n'étend que la HAUTEUR (left/right à 0) : une extension horizontale compterait
       dans le scrollWidth des ancêtres, piège déjà payé sur la pastille de probabilité. */
    @media (pointer: coarse) {
      .ec-lien-bouton, .ec-meta a, .at-plie { position: relative; }
      .ec-lien-bouton::after, .ec-meta a::after, .at-plie::after { content: ''; position: absolute; left: 0; right: 0; top: 50%;
        height: 44px; transform: translateY(-50%); }
      .ec-voirfaits { min-height: 44px; }
      .ec-onglets button { min-height: 44px; }
    }

    /* Vignettes : assez grandes pour reconnaitre la photo sans l'ouvrir, assez petites pour qu'une
       serie n'ecrase pas le texte du sujet. */
    .ec-vign { display: flex; flex-wrap: wrap; gap: var(--sp-2); margin-top: var(--sp-2); }
    .ec-ph { position: relative; width: 84px; height: 84px; border-radius: var(--r-sm);
      overflow: hidden; border: 1px solid var(--border); background: var(--surface-2); }
    .ec-ph img { width: 100%; height: 100%; object-fit: cover; display: block; }
    /* La vignette est un BOUTON (elle ouvre la visionneuse, elle ne navigue pas) : on lui retire
       toute apparence de bouton pour qu elle reste une image. */
    .ec-ph-voir { display: block; width: 100%; height: 100%; padding: 0; border: none;
      background: none; cursor: zoom-in; }
    /* Vise la CROIX par sa classe, pas « tout bouton de la vignette » : `.ec-ph button` attrapait
       aussi le bouton-vignette ajouté ensuite et, plus spécifique que `.ec-ph-voir`, le réduisait
       à 20x20 en position absolue -- la photo disparaissait, il ne restait que la croix.
       C est le piege deja paye avec ` section .btn` : viser par classe, jamais par descendance. */
    .ec-ph .ec-ph-suppr { position: absolute; top: 2px; right: 2px; width: 20px; height: 20px; padding: 0;
      border-radius: 50%; border: none; cursor: pointer; line-height: 1;
      background: color-mix(in srgb, var(--danger) 85%, transparent); color: #fff; font-size: 12px; }
    @media (pointer: coarse) { .ec-ph .ec-ph-suppr { width: 28px; height: 28px; font-size: 14px; } }
    .ec-ph-att { opacity: 0.75; }
    .ec-bar { display: flex; flex-wrap: wrap; gap: var(--sp-2); align-items: center; margin-bottom: var(--sp-4); }
    .ec-bar .rech { flex: 1 1 200px; min-width: 160px; }
    .ec-liste { display: flex; flex-direction: column; gap: var(--sp-3); }
    .ec-suj { border: 1px solid var(--border); border-left: 3px solid var(--kc, var(--accent)); border-radius: var(--r-md);
      background: var(--surface); padding: var(--sp-3) var(--sp-4); }
    .ec-suj.pour-moi { box-shadow: 0 0 0 1px color-mix(in srgb, var(--accent) 35%, transparent); }
    .ec-suj.est-fait { opacity: 0.6; }
    /* A — La tête de carte est UN bouton : toute la ligne se touche pour déplier (un petit chevron
       seul serait une cible de 14 px). */
    .ec-tete { display: flex; align-items: flex-start; gap: var(--sp-2); flex-wrap: wrap; width: 100%;
      background: none; border: 0; padding: 0; text-align: left; font: inherit; color: inherit; cursor: pointer; }
    .ec-tete:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: var(--r-sm); }
    .ec-chev { flex: none; color: var(--text-subtle); display: inline-flex; transition: transform var(--t-fast); margin-top: 2px; }
    .ec-suj.ouverte .ec-chev { transform: rotate(90deg); }
    /* Le titre porte le sens : on lui donne un plancher et on refuse aux badges de grandir,
       sinon c'est lui qui cède et on lit une lettre et demie. */
    .ec-titre { font-weight: 700; color: var(--text); flex: 1 1 12ch; min-width: 12ch; }
    .ec-suj.est-fait .ec-titre { text-decoration: line-through; }
    .ec-nat { flex: 0 0 auto; font-family: var(--font-mono); font-size: var(--fs-3xs); text-transform: uppercase;
      letter-spacing: 0.06em; padding: 0.15rem 0.5rem; border-radius: var(--r-sm); color: var(--kc, var(--accent));
      border: 1px solid color-mix(in srgb, var(--kc, var(--accent)) 45%, transparent); }
    .ec-meta { font-family: var(--font-mono); font-size: var(--fs-3xs); color: var(--text-subtle); margin-top: 0.3rem; overflow-wrap: anywhere; }
    .ec-meta .ec-lien { color: var(--accent-2); }
    .ec-dernier { font-size: var(--fs-xs); color: var(--text-muted); margin-top: 0.35rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .ec-dernier b { color: var(--text); font-weight: 600; }
    .ec-corps { font-size: var(--fs-sm); color: var(--text-muted); margin-top: var(--sp-2); white-space: pre-wrap; line-height: 1.55; }
    .ec-balle { display: inline-flex; align-items: center; gap: 0.3rem; flex: 0 0 auto; font-family: var(--font-mono);
      font-size: var(--fs-3xs); text-transform: uppercase; letter-spacing: 0.06em; padding: 0.15rem 0.5rem;
      border-radius: var(--r-pill); color: var(--warn); border: 1px solid color-mix(in srgb, var(--warn) 45%, transparent); }
    .ec-balle.moi { color: var(--accent); border-color: color-mix(in srgb, var(--accent) 55%, transparent);
      background: color-mix(in srgb, var(--accent) 12%, transparent); }

    .ec-fil { margin-top: var(--sp-3); border-top: 1px solid var(--border); padding-top: var(--sp-3); display: flex; flex-direction: column; gap: var(--sp-2); }
    .ec-rep { display: flex; gap: var(--sp-2); }
    .ec-ava { width: 26px; height: 26px; flex: none; border-radius: 50%; display: grid; place-items: center;
      font-family: var(--font-mono); font-size: var(--fs-3xs); font-weight: 700; color: var(--on-accent); background: var(--ac, var(--accent)); }
    .ec-rep .txt { font-size: var(--fs-sm); color: var(--text); white-space: pre-wrap; line-height: 1.5; }
    .ec-rep.rappel .txt { font-style: italic; color: var(--text-muted); }
    .ec-rep .qd { font-family: var(--font-mono); font-size: var(--fs-3xs); color: var(--text-subtle); margin-top: 0.15rem; }
    /* La décision : mise en avant, c'est ce qu'on vient relire des semaines plus tard. */
    .ec-decision { display: flex; gap: var(--sp-2); align-items: flex-start; margin-top: var(--sp-3);
      padding: var(--sp-3); border-radius: var(--r-sm); font-size: var(--fs-sm); color: var(--text);
      border: 1px solid color-mix(in srgb, var(--ok) 40%, transparent);
      background: color-mix(in srgb, var(--ok) 8%, transparent); }
    .ec-decision svg { color: var(--ok); flex: none; margin-top: 2px; }
    .ec-decision .qd { font-family: var(--font-mono); font-size: var(--fs-3xs); color: var(--text-subtle); margin-top: 0.2rem; }
    .ec-actions { display: flex; flex-wrap: wrap; gap: var(--sp-2); margin-top: var(--sp-3); }
    .ec-plusl { display: flex; flex-wrap: wrap; gap: var(--sp-2); margin-top: var(--sp-2); padding-top: var(--sp-2); border-top: 1px dashed var(--border); }
    .ec-repbox { margin-top: var(--sp-3); }
    .ec-avert { margin-top: var(--sp-2); font-size: var(--fs-xs); color: var(--warn); }
    .ec-avert:empty { display: none; }

    /* ── G — Le registre des décisions ── */
    .ec-dec { border: 1px solid var(--border); border-left: 3px solid var(--ok); border-radius: var(--r-md); background: var(--surface);
      padding: var(--sp-3) var(--sp-4); }
    .ec-dec .txt { font-size: var(--fs-sm); color: var(--text); white-space: pre-wrap; line-height: 1.5; }
    .ec-dec .qd { font-family: var(--font-mono); font-size: var(--fs-3xs); color: var(--text-subtle); margin-top: 0.3rem; overflow-wrap: anywhere; }

    @media (max-width: 560px) {
      .ec-envoi { margin-left: 0; width: 100%; justify-content: center; }
      .ec-lie, .ec-dossier { flex: 1 1 100%; }
      .ec-opts .sep { display: none; }
      /* La revue porte QUATRE actions, une de plus que le bandeau des attentes. À 390 px la rangée
         ne se repliait pas (.at-actions est en flex: 0 0 auto) et poussait la page de 78 px. On lui
         rend toute la largeur ici seulement : le bandeau des attentes, lui, tient à trois. */
      #revueHost .at-actions, .at-item .at-actions { flex: 1 1 100%; }
      .ec-onglets { width: 100%; }
      /* La tête d'une carte : les pastilles sur une ligne (la balle à droite), le titre en dessous sur
         toute la largeur. Coincé entre les deux, il passait sur trois lignes (100 px de tête). */
      .ec-titre { order: 3; flex: 1 1 100%; }
      .ec-tete .ec-balle { margin-left: auto; }
      .ec-onglets button { flex: 1 1 0; justify-content: center; padding: 0.55rem 0.4rem; font-size: var(--fs-xs); }
      .ec-onglets .ll { display: none; }
      .ec-onglets .lc { display: inline; }
    }
    @media (pointer: coarse) {
      .ec-chip { min-height: 38px; }
    }
  </style>
</head>
<body>
  <div class="fx-grid"></div>

  <header class="app-header">
    <div class="brand">
      <span class="brand-logo"><img src="../assets/img/logo-solariscreen.svg" alt="" onerror="this.style.display='none'"></span>
      <div>
        <h1><a href="dashboard.html">SOLARISCREEN</a></h1>
        <div class="module">Échanges</div>
      </div>
    </div>
    <div class="header-actions">
      <span id="quickNav"></span>
      <span id="themeToggle"></span>
      <a class="btn btn-ghost btn-sm" href="dashboard.html"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg> Dashboard</a>
    </div>
  </header>

  <main class="container">
    <!-- ÉCRIRE EN PREMIER. Cette zone était sous les compteurs, sous les trois bandes d'attente et
         sous la revue des idées : il fallait dérouler toute la page pour déposer une pensée de dix
         secondes. Un outil où l'on hésite à écrire ne sert plus à rien : la zone passe donc avant
         tout — et depuis le 27/10/2026 elle tient en une ligne tant qu'on n'a rien écrit (C). -->
    <div class="ec-poster" id="poster">
      <textarea class="textarea" id="pTitre" rows="1" placeholder="Une question, une idée, une tâche…" title="Ctrl+Entrée pour envoyer"></textarea>
      <div class="ec-plus" id="pPlus">
        <div class="ec-opts" id="pNatures"></div>
        <div class="ec-fin">
          <span class="ec-opts" id="pPour" style="margin-top:0"></span>
          <span class="sep"></span>
          <input class="input ec-lie" id="pClient" list="dlClients" placeholder="Lié à un client (facultatif)" autocomplete="off">
          <select class="select ec-dossier" id="pDossier" hidden aria-label="Dossier du client"></select>
          <input class="input" id="pEcheance" type="date" title="Pour quand (facultatif)" style="max-width:160px">
          <button type="button" class="btn btn-ghost btn-sm" id="btnPhoto" onclick="document.getElementById('pPhoto').click()" title="Joindre une ou plusieurs photos">Photo</button>
          <input type="file" id="pPhoto" accept="image/*" multiple hidden onchange="ajouterPhotos(this)">
          <button class="btn btn-primary btn-sm ec-envoi" id="btnPublier" onclick="publier()">Publier</button>
        </div>
        <div class="ec-vign" id="pVignettes"></div>
        <div class="ec-contexte" id="pContexte"></div>
      </div>
      <datalist id="dlClients"></datalist>
    </div>

    <div class="ec-onglets" role="tablist" aria-label="Échanges">
      <button type="button" role="tab" id="ongAttente" aria-controls="panAttente" aria-selected="true" onclick="choisirOnglet('attente')"><span class="ll">Ce qui attend</span><span class="lc">Attend</span> <span class="n" id="nAttente"></span></button>
      <button type="button" role="tab" id="ongEchanges" aria-controls="panEchanges" aria-selected="false" tabindex="-1" onclick="choisirOnglet('echanges')"><span class="ll">Les échanges</span><span class="lc">Échanges</span> <span class="n" id="nEchanges"></span></button>
      <button type="button" role="tab" id="ongDecisions" aria-controls="panDecisions" aria-selected="false" tabindex="-1" onclick="choisirOnglet('decisions')"><span class="ll">Décisions</span><span class="lc">Décisions</span> <span class="n" id="nDecisions"></span></button>
    </div>

    <div id="panAttente" role="tabpanel" aria-labelledby="ongAttente">
      <!-- CE QUI ATTEND — les quatre modules réunis (demandes de RDV, planning, SAV, échanges).
           Chacun savait déjà dire « ça attend quelqu'un », mais chacun dans son coin : il fallait
           ouvrir quatre écrans pour le savoir, donc on ne le faisait pas. Ici, tout est au même
           endroit ET chaque ligne porte son action : attribuer — ou répondre (D) — sans changer de page. -->
      <div id="attenteHost"><div class="skl" style="height:90px"></div></div>
      <!-- REVUE DES IDÉES — ce qui dort depuis deux semaines. Une chose que personne n'attend et qui
           n'a pas d'échéance ne remonte nulle part : c'est voulu, mais elle s'enterre toute seule. -->
      <div id="revueHost"></div>
    </div>

    <div id="panEchanges" role="tabpanel" aria-labelledby="ongEchanges" hidden>
      <div class="ec-bar">
        <div class="ec-opts" id="fNatures" style="margin-top:0"></div>
        <input class="input rech" id="rech" type="search" placeholder="Rechercher…" oninput="rendre()">
        <label class="chip ec-voirfaits" style="cursor:pointer;display:inline-flex;align-items:center;gap:0.35rem;"><input type="checkbox" id="voirFaits" onchange="rendre()"> Voir ce qui est fait</label>
      </div>
      <div id="host"><div class="ec-liste" aria-busy="true"><div class="skl" style="height:90px"></div><div class="skl" style="height:90px"></div></div></div>
    </div>

    <div id="panDecisions" role="tabpanel" aria-labelledby="ongDecisions" hidden>
      <div class="ec-bar">
        <input class="input rech" id="rechDec" type="search" placeholder="Chercher une décision, un client…" oninput="rendreDecisions()">
      </div>
      <div id="decHost"></div>
    </div>
  </main>

  <script src="../assets/js/ui.js"></script>
  <script src="../assets/js/nav.js"></script>
  <script src="../assets/js/fetes.js"></script>
  <script src="../assets/js/api.js"></script>
  <!-- `attente.js` agrège les quatre sources (demandes, planning, SAV, échanges) et a besoin du
       moteur du temps pour les conflits et les rendez-vous orphelins ; `config.js` lui donne la
       trame, sans laquelle personne n'est jamais disponible. -->
  <script src="../assets/js/config.js"></script>
  <script src="../assets/js/planning.js"></script>
  <script src="../assets/js/attente.js"></script>
  <script src="../assets/js/echanges.js"></script>
  <script>
    const SS = window.SS;
    const EC = window.SSEchanges;
    const { el, icon, toast, escHtml, fmtDate, relTime, qp } = window.SSUI;
    const jsAttr = window.SSUI.jsAttr;
    const SELLER_LABELS = window.SSUI.SELLER_LABELS;   // source unique du vocabulaire : ui.js
    window.SSTheme.mountThemeToggle(document.getElementById('themeToggle'));
    window.SSNav.mount(document.getElementById('quickNav'));

    // Vocabulaire des natures. Quatre, pas davantage : au-delà on hésite au moment d'écrire,
    // et un outil où l'on hésite à écrire ne sert plus à rien.
    const NATURES = {
      afaire:   { label: 'À faire',    icone: 'check',   couleur: 'var(--accent)' },
      question: { label: 'Question',   icone: 'help',    couleur: 'var(--warn)' },
      idee:     { label: 'Idée',       icone: 'sparkle', couleur: 'var(--accent-2)' },
      attente:  { label: 'En attente', icone: 'clock',   couleur: 'var(--text-subtle)' },
    };
    const PERSONNES = EC.PERSONNES;

    const A = window.SSAttente;
    let SUJETS = [];
    let ATTENTES = [];        // les quatre sources réunies (voir assets/js/attente.js)
    let CRIT_I = 0;           // rang de la prochaine situation critique à viser (voir voirCritique)
    let PLIE_AUTRE = true;    // ce qui est chez l'autre : replié par défaut, ce n'est pas mon travail
    let MOI = { key: '', name: '' };
    let CLIENTS = [];
    let DEVIS = [];           // pour proposer les dossiers d'un client (E)
    let P_KIND = 'afaire';
    let P_POUR = '';
    let F_KIND = '';                 // filtre de nature, vide = toutes
    let REPOND = '';                 // sujet dont la zone de réponse est ouverte (dans la carte)
    let DECIDE = '';                 // sujet dont la zone « ce qui a été décidé » est ouverte
    let AT_REPOND = '', AT_DECIDE = '';   // D — les mêmes zones, ouvertes dans « ce qui attend »
    const OUVERTES = new Set();      // A — les cartes dépliées
    const PLUS = new Set();          // les cartes dont « Plus » est ouvert
    const AVERT = {};                // le message d'un conflit, affiché DANS la carte concernée

    const autre = EC.autre;
    function nomDe(k) { return SELLER_LABELS[k] || k || '—'; }
    function sujetDe(id) { return SUJETS.filter(function (x) { return x.id === id; })[0] || null; }
    function rafraichirMenu() { try { if (window.SSNav && SSNav.rafraichirCompteurs) SSNav.rafraichirCompteurs().catch(function () {}); } catch (e) {} }

    async function charger() {
      try { MOI = await window.SSNav.getIdentity(); } catch (e) { MOI = { key: '' }; }
      // Les quatre sources en une fois. `charger()` de SSAttente rapatrie déjà les sujets : on
      // réutilise ce qu'il a lu plutôt que de redemander la même liste au serveur.
      let paquet = null;
      try { paquet = await A.charger(); } catch (e) { console.warn('[Échanges] attentes indisponibles:', e.message); }
      ATTENTES = (paquet && paquet.items) || [];
      SUJETS = (paquet && paquet.sources && paquet.sources.sujets) || (await SS.listSujets()) || [];
      // Destinataire par défaut : l'AUTRE. Un sujet qu'on s'adresse à soi-même n'attend personne,
      // et c'est presque toujours à l'autre qu'on écrit.
      if (!P_POUR) P_POUR = MOI.key ? autre(MOI.key) : '';
      rendre();
      chargerClients();
    }
    /** Relit sujets ET attentes après un geste : la ligne de « ce qui attend » doit suivre la carte. */
    async function recharger() {
      let paquet = null;
      try { paquet = await A.charger(); } catch (e) { paquet = null; }
      if (paquet && paquet.items) ATTENTES = paquet.items;
      SUJETS = (paquet && paquet.sources && paquet.sources.sujets) || (await SS.listSujets()) || SUJETS;
      rendre();
      rafraichirMenu();
    }

    /* ── B — LES ONGLETS ─────────────────────────────────────────────────────────────────────
       Retenus par appareil (`ss_echanges_onglet`). Arriver sur un sujet précis (recherche globale,
       lien « Ouvrir ») ouvre « Les échanges ». Aucune étape d'historique. */
    const ONGLETS = { attente: ['ongAttente', 'panAttente'], echanges: ['ongEchanges', 'panEchanges'], decisions: ['ongDecisions', 'panDecisions'] };
    let ONGLET = (function () { try { const o = localStorage.getItem('ss_echanges_onglet'); return ONGLETS[o] ? o : 'attente'; } catch (e) { return 'attente'; } })();
    if (qp('sujet') || /^#suj-/.test(location.hash)) ONGLET = 'echanges';
    window.choisirOnglet = function (o, sansMemoire) {
      ONGLET = ONGLETS[o] ? o : 'attente';
      Object.keys(ONGLETS).forEach(function (k) {
        const actif = k === ONGLET;
        el(ONGLETS[k][0]).setAttribute('aria-selected', actif ? 'true' : 'false');
        el(ONGLETS[k][0]).tabIndex = actif ? 0 : -1;
        el(ONGLETS[k][1]).hidden = !actif;
      });
      if (!sansMemoire) { try { localStorage.setItem('ss_echanges_onglet', ONGLET); } catch (e) {} }
    };
    document.querySelector('.ec-onglets').addEventListener('keydown', function (e) {
      if (e.key !== 'ArrowLeft' && e.key !== 'ArrowRight') return;
      e.preventDefault();
      const l = Object.keys(ONGLETS), i = l.indexOf(ONGLET);
      choisirOnglet(l[(i + (e.key === 'ArrowRight' ? 1 : l.length - 1)) % l.length]);
      el(ONGLETS[ONGLET][0]).focus();
    });
    choisirOnglet(ONGLET, true);

    // Arriver depuis la recherche globale (Ctrl+K) ou un lien « Ouvrir ». Une décision vit sur un sujet
    // CLASSÉ, donc masqué par défaut : il faut décocher le filtre avant de chercher à faire défiler,
    // sinon on atterrit sur une page qui semble ne pas contenir ce qu'on vient d'y chercher.
    window.allerAuSujet = function (cible) {
      const x = sujetDe(cible);
      if (!x) { toast('Ce sujet n’existe plus.', 'warn'); return; }
      choisirOnglet('echanges', true);
      if (x.statut === 'fait' && !el('voirFaits').checked) el('voirFaits').checked = true;
      // Un filtre ou une recherche qui le cache ne doit pas faire croire qu'il n'existe pas.
      if (F_KIND && x.kind !== F_KIND) F_KIND = '';
      if (el('rech').value && !EC.correspond(x, el('rech').value, nomDe)) el('rech').value = '';
      OUVERTES.add(cible);
      rendre();
      const noeud = document.getElementById('suj-' + cible);
      if (!noeud) return;
      noeud.classList.add('vise');
      setTimeout(function () { noeud.classList.remove('vise'); }, 2600);
      // Différé d'un tick : un défilement lancé avant que la page se pose vise une position qui
      // n'existe déjà plus. Instantané et non « smooth » : c'est un saut vers une cible, pas un effet.
      setTimeout(function () { noeud.scrollIntoView({ block: 'center' }); }, 0);
    };
    function allerAuSujetDeLAdresse() {
      const cible = qp('sujet') || (/^#suj-/.test(location.hash) ? decodeURIComponent(location.hash.slice(5)) : '');
      if (cible) allerAuSujet(cible);
    }

    // Arriver ici depuis un dossier, une demande ou un ticket : le contexte est deja pose et le
    // curseur est dans le champ. Sans ca il fallait revenir aux Echanges et RETAPER le nom du
    // client -- trois gestes pour une question de dix secondes, donc on ne la posait pas.
    let DEVIS_LIE = '';
    function prefixerDepuisUrl() {
      const c = qp('client');
      if (c) el('pClient').value = c;
      DEVIS_LIE = qp('devis') || '';
      const pour = qp('pour');
      if (pour === 'nicolas' || pour === 'yannick') P_POUR = pour;
      const kind = qp('kind');
      if (NATURES[kind]) P_KIND = kind;
      const titre = qp('titre');
      if (titre) el('pTitre').value = titre;
      if (!DEVIS_LIE && !c && !titre) return;
      ouvrirPoster();
      rendrePuces();
      majDossiersPoster();
      el('pTitre').focus();
    }
    function majContexte() {
      el('pContexte').innerHTML = DEVIS_LIE && el('pDossier').hidden
        ? icon('window', 12) + ' Rattaché au dossier #' + escHtml(DEVIS_LIE) + ' <button type="button" class="at-plie" onclick="detacherDossier()">détacher</button>'
        : '';
    }
    window.detacherDossier = function () { DEVIS_LIE = ''; majContexte(); };

    /** Annuaire pour le champ « lié à un client » — et les devis, pour proposer leurs dossiers (E). */
    async function chargerClients() {
      // LES DEUX SOURCES. La liste ne venait que des DEVIS : un client du CRM qui n'a pas encore
      // de devis n'apparaissait jamais dans la saisie, alors que c'est justement sur lui qu'on a
      // le plus de choses a noter -- un prospect a rappeler, une visite a caler.
      const [devis, fiches] = await Promise.all([
        SS.listDevis().catch(function () { return []; }),
        SS.listClients ? SS.listClients().catch(function () { return []; }) : Promise.resolve([]),
      ]);
      DEVIS = devis || [];
      const vus = new Set();
      CLIENTS = [];
      const ajouter = function (prenom, nom) {
        const complet = ((prenom || '') + ' ' + (nom || '')).trim();
        if (!complet || vus.has(complet)) return;
        vus.add(complet);
        // clientKeyOf prend (prenom, nom) -- pas l'objet client : lui passer la fiche entiere
        // produisait la cle « |[object object] », qui ne rapproche evidemment aucune fiche CRM.
        CLIENTS.push({ nom: complet, key: window.SSUI.clientKeyOf(prenom, nom) });
      };
      // Le CRM d'abord : c'est la liste de reference, les devis ne font que la completer.
      (fiches || []).forEach(function (c) { ajouter(c.prenom, c.nom); });
      DEVIS.forEach(function (d) { const c = d.client || {}; ajouter(c.prenom, c.nom); });
      CLIENTS.sort(function (a, b) { return a.nom.localeCompare(b.nom, 'fr'); });
      el('dlClients').innerHTML = CLIENTS.map(function (c) { return '<option value="' + escHtml(c.nom) + '"></option>'; }).join('');
      prefixerDepuisUrl();
      allerAuSujetDeLAdresse();
    }

    /** Un nom tapé → le client de la liste, s'il existe. Un nom inconnu reste écrit TEL QUEL
     *  mais sans clé : le lien vers le CRM ne marchera pas, et c'est voulu — mieux vaut garder
     *  ce que la personne a écrit que de l'effacer parce qu'on ne le reconnaît pas.
     *  Vider le champ détache le client : c'est la seule façon de revenir en arrière. */
    function clientDepuisNom(nom) {
      const propre = (nom || '').trim();
      const lie = CLIENTS.filter(function (c) { return c.nom.toLowerCase() === propre.toLowerCase(); })[0];
      return { client_nom: propre, client_key: (lie && lie.key) || '' };
    }

    /* ── E — LE DOSSIER DU CLIENT ────────────────────────────────────────────────────────────
       En choisissant le client, ses dossiers sont proposés (avec leur résumé, règle 9). Le menu
       n'apparaît que s'il y a quelque chose à choisir. `courant` : le dossier déjà rattaché. */
    function optionsDossiers(nomClient, courant) {
      const cl = clientDepuisNom(nomClient);
      const l = EC.dossiersDuClient(DEVIS, cl.client_key, cl.client_nom);
      if (courant && !l.some(function (d) { return d.id === courant; })) l.unshift({ id: courant, libelle: 'Dossier #' + courant });
      return l.length
        ? '<option value="">Aucun dossier en particulier</option>' + l.map(function (d) {
            return '<option value="' + escHtml(d.id) + '"' + (d.id === courant ? ' selected' : '') + '>' + escHtml(d.libelle) + '</option>';
          }).join('')
        : '';
    }
    function majDossiersPoster() {
      const s = el('pDossier');
      const html = optionsDossiers(el('pClient').value, DEVIS_LIE);
      s.innerHTML = html;
      s.hidden = !html;
      majContexte();
    }
    el('pClient').addEventListener('input', majDossiersPoster);
    el('pDossier').addEventListener('change', majContexte);
    window.majDossiersEdition = function (id) {
      const s = el('ed-dos-' + id), c = el('ec-' + id);
      if (!s || !c) return;
      const x = sujetDe(id);
      const html = optionsDossiers(c.value, (x && x.devis_id) || '');
      s.innerHTML = html;
      s.hidden = !html;
    };

    /* ── C — LA ZONE D'ÉCRITURE QUI S'OUVRE AU PREMIER MOT ───────────────────────────────── */
    function ouvrirPoster() { el('poster').classList.add('ouvert'); }
    function posterVide() {
      return !el('pTitre').value.trim() && !el('pClient').value.trim() && !el('pEcheance').value && !PHOTOS_EN_ATTENTE.length && !DEVIS_LIE;
    }
    el('pTitre').addEventListener('focus', ouvrirPoster);
    el('pTitre').addEventListener('input', ouvrirPoster);
    // On la referme quand elle est vide et que le focus la QUITTE (un clic sur une puce reste dedans).
    el('poster').addEventListener('focusout', function () {
      setTimeout(function () {
        if (el('poster').contains(document.activeElement)) return;
        if (posterVide()) el('poster').classList.remove('ouvert');
      }, 150);
    });

    /* ── LES BROUILLONS NE SE PERDENT PLUS ───────────────────────────────────────────────────
       Chaque rendu réécrit les cartes : une correction en cours REVENAIT au texte enregistré dès
       qu'on choisissait « Pour Yannick », et une réponse tapée disparaissait si l'on touchait à la
       recherche ou à un filtre. On relève ce qui est en train d'être écrit avant chaque rendu, et on
       le repose après (le curseur compris). Les brouillons sont GARDÉS tant que leur zone est ouverte,
       même si la carte disparaît un instant (une recherche qui ne la trouve plus) : ils reviennent
       avec elle. Une zone fermée (envoyée, annulée) emporte son brouillon. */
    const CHAMPS_BROUILLON = /^(et|ec|ee|ed-dos|rt|rl|dt|re|art|arl|adt)-(.+)$/;
    const BROUILLONS = {};
    function brouillonVivant(id) {
      const m = CHAMPS_BROUILLON.exec(id);
      if (!m) return false;
      const z = m[1], cle = m[2];
      if (z === 'et' || z === 'ec' || z === 'ee' || z === 'ed-dos') return EDITE === cle;
      if (z === 'rt' || z === 'rl') return REPOND === cle;
      if (z === 'dt') return DECIDE === cle;
      if (z === 're') return EDITE_REP === cle;
      if (z === 'art' || z === 'arl') return AT_REPOND === cle;
      return AT_DECIDE === cle;
    }
    function relever() {
      document.querySelectorAll('main textarea[id], main input[id], main select[id]').forEach(function (c) {
        if (!CHAMPS_BROUILLON.test(c.id)) return;
        BROUILLONS[c.id] = c.type === 'checkbox' ? { coche: c.checked } : { v: c.value };
      });
      Object.keys(BROUILLONS).forEach(function (id) { if (!brouillonVivant(id)) delete BROUILLONS[id]; });
      const a = document.activeElement;
      return { champs: BROUILLONS, focus: a && a.id && CHAMPS_BROUILLON.test(a.id) ? { id: a.id, s: a.selectionStart, e: a.selectionEnd } : null };
    }
    function reposer(b) {
      const ids = Object.keys(b.champs).filter(brouillonVivant);
      ids.forEach(function (id) {
        const c = document.getElementById(id);
        if (!c || c.tagName === 'SELECT') return;
        if ('coche' in b.champs[id]) c.checked = b.champs[id].coche;
        else c.value = b.champs[id].v;
      });
      // Les dossiers proposés suivent le client EN COURS de saisie, pas celui enregistré : on les
      // recalcule avant de reposer le dossier choisi.
      if (EDITE) majDossiersEdition(EDITE);
      ids.forEach(function (id) {
        const c = document.getElementById(id);
        if (!c || c.tagName !== 'SELECT') return;
        if ([].some.call(c.options, function (o) { return o.value === b.champs[id].v; })) c.value = b.champs[id].v;
      });
      if (b.focus) {
        const f = document.getElementById(b.focus.id);
        if (f) { f.focus(); try { if (b.focus.s != null) f.setSelectionRange(b.focus.s, b.focus.e); } catch (e) {} }
      }
    }

    // ── Rendu ────────────────────────────────────────────────────────────────────────────────
    function rendre() {
      const b = relever();
      rendrePuces();
      rendreAttentes();
      rendreRevue();
      rendreListe();
      rendreDecisions();
      rendreCompteurs();
      reposer(b);
    }
    function rendreCompteurs() {
      const c = EC.compteurs(SUJETS, ATTENTES, MOI.key);
      el('nAttente').textContent = c.attente ? '· ' + c.attente : '';
      el('nEchanges').textContent = c.echanges ? '· ' + c.echanges : '';
      el('nDecisions').textContent = c.decisions ? '· ' + c.decisions : '';
    }
    function rendreListe() {
      const q = el('rech').value || '';
      const voirFaits = el('voirFaits').checked;
      const liste = SUJETS.filter(function (s) {
        // Un sujet que l'autre vient de classer pendant qu'on y travaillait (conflit) reste à l'écran :
        // la carte dit ce qui s'est passé — il ne disparaît pas sous nos yeux.
        if (!voirFaits && s.statut === 'fait' && !AVERT[s.id]) return false;
        if (F_KIND && s.kind !== F_KIND) return false;
        return EC.correspond(s, q, nomDe);
      });
      // Ce qui m'attend passe devant : c'est la seule question qu'on se pose en ouvrant la page.
      liste.sort(function (a, b) {
        const am = (a.awaiting === MOI.key && a.statut !== 'fait') ? 0 : 1;
        const bm = (b.awaiting === MOI.key && b.statut !== 'fait') ? 0 : 1;
        if (am !== bm) return am - bm;
        return String(b.date_modification || '').localeCompare(String(a.date_modification || ''));
      });
      if (!liste.length) {
        el('host').innerHTML = '<div class="empty"><div class="big">' + icon('message', 40) + '</div>' +
          (SUJETS.length ? 'Rien ne correspond à ce filtre.' :
            'Rien pour l’instant.<br>Écris ce que tu as en tête là-haut : une chose à faire, une question pour ' +
            escHtml(nomDe(autre(MOI.key))) + ', ou une idée à garder.') + '</div>';
        return;
      }
      el('host').innerHTML = '<div class="ec-liste">' + liste.map(carte).join('') + '</div>';
    }

    function rendrePuces() {
      el('pNatures').innerHTML = Object.keys(NATURES).map(function (k) {
        const n = NATURES[k];
        return '<button type="button" class="ec-chip ' + (P_KIND === k ? 'on' : '') + '" style="--kc:' + n.couleur + '" onclick="setKind(\'' + k + '\')">' +
          icon(n.icone, 13) + escHtml(n.label) + '</button>';
      }).join('');
      el('pPour').innerHTML = PERSONNES.map(function (p) {
        return '<button type="button" class="ec-chip ' + (P_POUR === p ? 'on' : '') + '" onclick="setPour(\'' + p + '\')">' +
          escHtml('Pour ' + nomDe(p)) + '</button>';
      }).join('') +
        '<button type="button" class="ec-chip ' + (!P_POUR ? 'on' : '') + '" onclick="setPour(\'\')">Pour nous deux</button>';
      el('fNatures').innerHTML = '<button type="button" class="ec-chip ' + (!F_KIND ? 'on' : '') + '" onclick="setFiltre(\'\')">Tout</button>' +
        Object.keys(NATURES).map(function (k) {
          const n = NATURES[k];
          const nb = SUJETS.filter(function (s) { return s.kind === k && s.statut !== 'fait'; }).length;
          return '<button type="button" class="ec-chip ' + (F_KIND === k ? 'on' : '') + '" style="--kc:' + n.couleur + '" onclick="setFiltre(\'' + k + '\')">' +
            icon(n.icone, 13) + escHtml(n.label) + (nb ? ' ' + nb : '') + '</button>';
        }).join('');
    }

    // ── Revue des idées ───────────────────────────────────────────────────────
    // SSAttente écarte volontairement un sujet que personne n'attend et qui n'a pas d'échéance :
    // c'est une idée en réserve, pas quelque chose qui bloque. Sans contrepartie, ces sujets-là ne
    // remontent JAMAIS — or ce sont justement les « choses à mettre en place », celles qu'on dépose
    // ici parce qu'elles n'ont pas de client. Ce bandeau est cette contrepartie : passé le seuil il
    // les ressort avec la seule question qui compte, on en fait quoi ?
    // « Garder » écrit `revu_le` et repousse d'autant : sans ça le bandeau harcèlerait pour une idée
    // qu'on veut précisément laisser mûrir, et on apprendrait à ne plus le lire.
    // Seuil abaisse a 14 jours LE TEMPS DE PRENDRE LE PLI : a 60 jours, un module tout neuf
    // n'affiche rien pendant deux mois et on oublie que le bandeau existe. A remonter vers 60 une
    // fois l'habitude installee -- un bandeau qui ressort une idee deposee la semaine derniere
    // devient du bruit, et on apprend vite a ne plus le lire.
    const REVUE_J = 14;
    function libelleSeuil() {
      if (REVUE_J >= 55) return 'deux mois';
      if (REVUE_J >= 26) return 'un mois';
      return REVUE_J >= 14 ? 'deux semaines' : REVUE_J + ' jours';
    }
    function enReserve() {
      const auj = window.SSUI.aujourdhui();
      return SUJETS.filter(function (x) {
        if (x.statut === 'fait') return false;
        const enRetard = x.echeance && x.echeance < auj;
        if (x.awaiting || enRetard) return false;   // déjà porté par « ce qui attend »
        return A.joursDepuis(x.revu_le || x.date_creation) >= REVUE_J;
      });
    }
    function rendreRevue() {
      const liste = enReserve();
      if (!liste.length) { el('revueHost').innerHTML = ''; return; }
      const lautre = autre(MOI.key);
      el('revueHost').innerHTML =
        '<div class="at-bloc"><div class="at-titre">' + icon('sparkle', 14) +
        ' En réserve depuis plus de ' + libelleSeuil() + ' <span class="at-nom">— on en fait quoi ?</span></div>' +
        '<div class="at-liste">' + liste.map(function (x) {
          const id = jsAttr(x.id);
          const n = NATURES[x.kind] || NATURES.idee;
          return '<div class="at-item">' +
            '<span class="at-src">' + escHtml(n.label) + '</span>' +
            '<div class="at-corps"><div class="at-quoi">' + escHtml(x.titre) + '</div>' +
            (x.corps ? '<div class="at-detail">' + escHtml(x.corps.slice(0, 140)) + '</div>' : '') +
            '<div class="at-age">' + escHtml(nomDe(x.auteur)) + ' · ' + relTime(x.revu_le || x.date_creation) + '</div></div>' +
            '<div class="at-actions">' +
              '<button class="btn btn-ghost btn-sm" onclick="revuePour(' + id + ', ' + jsAttr(MOI.key) + ')">' + icon('check', 13) + ' Je prends</button>' +
              '<button class="btn btn-ghost btn-sm" onclick="revuePour(' + id + ', ' + jsAttr(lautre) + ')">' + icon('user', 13) + ' Pour ' + escHtml(nomDe(lautre)) + '</button>' +
              '<button class="btn btn-ghost btn-sm" onclick="revueGarder(' + id + ')">' + icon('clock', 13) + ' Garder</button>' +
              '<button class="btn btn-ghost btn-sm" onclick="classerDepuisRevue(' + id + ')">' + icon('x', 13) + ' Classer</button>' +
            '</div></div>';
        }).join('') + '</div></div>';
    }
    // Prendre une idée, c'est en faire une TÂCHE avec un nom dessus : une chose sans nom n'avance
    // pas, c'est tout le principe du module. Le serveur en déduit `awaiting` et elle remonte.
    window.revuePour = async function (id, qui) {
      const x = sujetDe(id);
      if (!x) return;
      if (!(await enregistrer(x, { pour: qui, kind: 'afaire' }))) return;
      toast(qui === MOI.key ? 'C’est pour toi' : 'Pour ' + nomDe(qui), 'ok');
      recharger();
    };
    window.revueGarder = async function (id) {
      const x = sujetDe(id);
      if (!x) return;
      if (!(await enregistrer(x, { revu_le: window.SSUI.aujourdhui() }))) return;
      toast('Gardée — on en reparle dans ' + libelleSeuil(), 'ok');
      recharger();
    };

    /* ── ENREGISTRER UN SUJET, EN DISANT CE QU'ON A LU ──────────────────────────────────────
       Chaque geste renvoie le sujet tel que l'écran l'a lu : sans « _attendu », une page restée
       ouverte rouvrait en silence un sujet que l'autre venait de classer (règle 52). En cas de
       conflit, la version de l'autre remplace la nôtre À L'ÉCRAN, on le dit DANS la carte, et le
       texte qu'on était en train d'écrire reste là : recommencer, c'est enregistrer en connaissance
       de cause. */
    async function enregistrer(base, patch) {
      const res = await SS.saveSujet(Object.assign({}, base, patch, { _attendu: base.edite_le || '' }));
      if (res && res.conflict) {
        if (res.actuel && res.actuel.id) SUJETS = SUJETS.map(function (x) { return x.id === res.actuel.id ? res.actuel : x; });
        AVERT[base.id] = res.error || 'L’autre vient de modifier ce sujet.';
        toast(AVERT[base.id], 'warn', 9000);
        rendre();
        return null;
      }
      if (!res || res.ok === false) { toast((res && res.error) || 'Non enregistré.', 'error', 7000); return null; }
      delete AVERT[base.id];
      return res;
    }

    // ── Ce qui attend ────────────────────────────────────────────────────────────────────────
    /* D — Une ligne « Échange » se répond ou se classe SUR PLACE : la carte du sujet était 1 400 px
       plus bas, dans un autre bloc. La boîte s'ouvre dans la ligne ; c'est la même réponse, la même
       décision, par les mêmes routes. */
    function boiteAttente(it) {
      const s = sujetDe(it.sujet_id);
      if (!s) return '';
      const id = jsAttr(s.id), k = escHtml(s.id);
      if (AT_REPOND === s.id) {
        return '<div class="at-boite">' +
          '<textarea class="textarea" id="art-' + k + '" placeholder="Ta réponse…" style="min-height:58px"></textarea>' +
          '<div class="ec-fin" style="margin-top:0.4rem">' +
            '<label class="chip" style="cursor:pointer"><input type="checkbox" id="arl-' + k + '" style="vertical-align:-1px"> Et je lui redemande</label>' +
            '<button class="btn btn-ghost btn-sm" onclick="fermerBoitesAttente()">Annuler</button>' +
            '<button class="btn btn-primary btn-sm" style="margin-left:auto" onclick="envoyerReponse(' + id + ', \'a\')">Envoyer</button>' +
          '</div></div>';
      }
      if (AT_DECIDE === s.id) {
        return '<div class="at-boite">' +
          '<textarea class="textarea" id="adt-' + k + '" style="min-height:58px" placeholder="' +
            (s.kind === 'question' ? 'Ce qui a été décidé (obligatoire sur une question)…' : 'Ce qui a été décidé, ou fait (facultatif)…') + '"></textarea>' +
          '<div class="ec-fin" style="margin-top:0.4rem">' +
            '<button class="btn btn-ghost btn-sm" onclick="fermerBoitesAttente()">Annuler</button>' +
            '<button class="btn btn-primary btn-sm" style="margin-left:auto" onclick="classerAvecDecision(' + id + ', \'a\')">Classer</button>' +
          '</div></div>';
      }
      return '';
    }
    function ligneAttente(it) {
      const s = A.SOURCES[it.source] || {};
      const j = A.joursDepuis(it.depuis);
      const clAge = j >= A.SEUILS.ATTENTE_TRES_LONGUE_J ? 'tresvieux' : (j >= A.SEUILS.ATTENTE_LONGUE_J ? 'vieux' : '');
      const id = jsAttr(it.id);
      // `data-crit` est ce que vise le bandeau : un marqueur de STRUCTURE, pas une classe de
      // style, pour que changer l'apparence de la pastille ne casse jamais le saut.
      const crit = estCritique(it);
      const suj = it.source === 'echange' ? sujetDe(it.sujet_id) : null;
      // Attribuer d'un clic, sans quitter l'écran : c'est le saut vers une autre page qui casse
      // le geste et fait qu'on remet à plus tard. Ce qui n'est pas attribuable renvoie à sa fiche.
      let actions = '';
      if (it.peutPrendre && !it.qui) {
        actions = '<button class="btn btn-primary btn-sm" onclick="attribuer(' + id + ',' + jsAttr(MOI.key) + ')">Je prends</button>' +
          '<button class="btn btn-ghost btn-sm" onclick="attribuer(' + id + ',' + jsAttr(autre(MOI.key)) + ')">Pour ' + escHtml(nomDe(autre(MOI.key))) + '</button>';
      } else if (it.peutPrendre && it.qui === MOI.key) {
        actions = '<button class="btn btn-ghost btn-sm" onclick="attribuer(' + id + ',' + jsAttr(autre(MOI.key)) + ')">Passer à ' + escHtml(nomDe(autre(MOI.key))) + '</button>';
      }
      if (suj && suj.statut !== 'fait' && it.qui === MOI.key) {
        // D — répondre ou classer d'ici.
        actions = '<button class="btn btn-primary btn-sm" onclick="ouvrirReponse(' + jsAttr(suj.id) + ', \'a\')">' + icon('message', 13) + ' Répondre</button>' +
          '<button class="btn btn-ghost btn-sm" onclick="ouvrirDecision(' + jsAttr(suj.id) + ', \'a\')">' + icon('check', 13) + ' C’est fait</button>';
      }
      if (suj && EC.peutRappeler(suj, MOI.key)) {
        actions += '<button class="btn btn-ghost btn-sm" onclick="rappeler(' + jsAttr(suj.id) + ')">' + icon('clock', 13) + ' Lui rappeler</button>';
      }
      if (suj) actions += '<button class="btn btn-ghost btn-sm" onclick="allerAuSujet(' + jsAttr(suj.id) + ')">Ouvrir</button>';
      else if (it.href) actions += '<button class="btn btn-ghost btn-sm" onclick="location.href=' + jsAttr(it.href) + '">Ouvrir</button>';
      return '<div class="at-item ' + (it.qui ? '' : 'orphelin') + '"' + (crit ? ' data-crit="1"' : '') +
        (suj ? ' data-sujet="' + escHtml(suj.id) + '"' : '') +
        ' style="--uc:' + (s.couleur || 'var(--accent)') + '">' +
        '<div class="at-corps">' +
          '<div class="at-l1">' +
            // Le mot vient de `attente.js` et pas d'ici : le vocabulaire vit à un seul endroit
            // (règle 10), sinon l'écran et le moteur finissent par ne plus dire la même chose.
            (crit ? '<span class="at-urg">' + escHtml(A.URGENCE_LABEL[A.URGENCE.CRITIQUE]) + '</span>' : '') +
            '<span class="at-src" style="--sc:' + (s.couleur || 'var(--accent)') + '">' + escHtml(s.label || it.source) + '</span> ' +
            '<span class="at-quoi">' + escHtml(it.quoi) + '</span> ' +
            '<span class="at-nom">' + escHtml(it.titre) + '</span> ' +
            '<span class="at-age ' + clAge + '">' + escHtml(A.delai(it.depuis)) + '</span>' +
          '</div>' +
          (it.detail ? '<div class="at-detail">' + escHtml(it.detail) + '</div>' : '') +
        '</div>' +
        '<div class="at-actions">' + actions + '</div>' +
        (suj ? boiteAttente(it) : '') +
        '</div>';
    }

    function rendreAttentes() {
      const orphelins = A.sansPersonne(ATTENTES);
      const miennes = A.pourQui(ATTENTES, MOI.key);
      const autres = A.pourQui(ATTENTES, autre(MOI.key));
      let html = '';
      // « Critique » survit ici, mais seulement QUAND IL Y EN A. Un gros « 0 » permanent n'apprend
      // rien et occupe la place de ce qui compte.
      const nbCritique = A.compter(ATTENTES).critique;
      if (nbCritique) {
        html += '<button type="button" class="at-critique" onclick="voirCritique()">' +
          icon('warning', 13) + ' <strong>' + nbCritique +
          '</strong> ' + (nbCritique > 1 ? 'situations critiques' : 'situation critique') +
          ' <span class="at-nom">— conflit, client qui attend, retard</span> ' +
          '<span class="at-aller">' + (nbCritique > 1 ? 'Les voir' : 'La voir') + ' →</span></button>';
      }
      // La visée repart du début à chaque rendu : les lignes sont neuves, l'ancien rang ne
      // désignerait plus la même.
      CRIT_I = 0;
      // L'ordre n'est pas décoratif : ce que PERSONNE n'a pris passe avant tout le reste, parce
      // que c'est exactement ce dont chacun croit que l'autre s'occupe.
      if (orphelins.length) {
        html += '<div class="at-bloc"><div class="at-titre alerte">' + icon('warning', 13) +
          ' Personne ne s’en occupe <span class="n">(' + orphelins.length + ')</span></div>' +
          '<div class="at-liste">' + orphelins.map(ligneAttente).join('') + '</div></div>';
      }
      if (miennes.length) {
        html += '<div class="at-bloc"><div class="at-titre">' + icon('user', 13) +
          ' Ça t’attend <span class="n">(' + miennes.length + ')</span></div>' +
          '<div class="at-liste">' + miennes.map(ligneAttente).join('') + '</div></div>';
      }
      if (autres.length) {
        html += '<div class="at-bloc"><div class="at-titre">' + icon('clock', 13) +
          ' Chez ' + escHtml(nomDe(autre(MOI.key))) + ' <span class="n">(' + autres.length + ')</span>' +
          ' <button class="at-plie" onclick="basculerAutre()">' + (PLIE_AUTRE ? 'voir' : 'masquer') + '</button></div>' +
          (PLIE_AUTRE ? '' : '<div class="at-liste">' + autres.map(ligneAttente).join('') + '</div>') + '</div>';
      }
      if (!orphelins.length && !miennes.length) {
        html = '<div class="at-vide">' + icon('check', 20) + ' Rien ne bloque : tout ce qui est en cours a un nom dessus.</div>' + html;
      }
      el('attenteHost').innerHTML = html;
    }
    window.basculerAutre = function () { PLIE_AUTRE = !PLIE_AUTRE; rendre(); };
    window.fermerBoitesAttente = function () { AT_REPOND = ''; AT_DECIDE = ''; rendre(); };

    /* Le seuil vit dans `attente.js` — ici on ne fait que le lire. Écrire `>= 3` en dur, c'est
       la garantie que l'écran et le compteur divergeront le jour où l'échelle bougera. */
    function estCritique(it) { return it && it.urgence >= A.URGENCE.CRITIQUE; }

    /** Emmène sur la situation critique. Plusieurs ? Chaque clic passe à la suivante : un bouton
     *  qui ramène toujours au même endroit alors que le compteur en annonce trois passe pour
     *  cassé. */
    window.voirCritique = function () {
      /* ⚠️ LE BLOC DE L'AUTRE PEUT ÊTRE REPLIÉ, et il compte dans le total. Sans ce dépliage, le
         bouton promettrait « la voir » et ne sauterait nulle part — une promesse d'écran doit
         être tenable. Le rendu qui suit recrée les lignes, donc on cherche APRÈS. */
      if (PLIE_AUTRE && A.pourQui(ATTENTES, autre(MOI.key)).some(estCritique)) {
        PLIE_AUTRE = false;
        rendre();
      }
      const cibles = [].slice.call(document.querySelectorAll('#attenteHost .at-item[data-crit]'));
      if (!cibles.length) return;
      /* Deux clics rapprochés laissaient DEUX lignes allumées en même temps — la pulsation dure
         1,5 s, et on peut recliquer avant. Une visée qui en désigne deux ne désigne plus rien :
         c'est le défaut qu'on est en train de corriger, en plus petit. */
      [].forEach.call(document.querySelectorAll('.at-item.at-vise'), function (e) { e.classList.remove('at-vise'); });
      const n = cibles[CRIT_I % cibles.length];
      CRIT_I++;
      n.scrollIntoView({ behavior: 'smooth', block: 'center' });
      /* Retirer puis forcer un calcul de style avant de remettre : sans ce reflux, un deuxième
         clic sur la MÊME ligne ne rejouerait pas l'animation, et le bouton aurait l'air inerte. */
      n.classList.remove('at-vise');
      void n.offsetWidth;
      n.classList.add('at-vise');
      setTimeout(function () { n.classList.remove('at-vise'); }, 1500);
    };

    /** Attribue un élément À SA SOURCE — chaque module range l'information à un endroit différent,
     *  c'est précisément ce qui rendait l'attribution introuvable depuis un écran commun. */
    window.attribuer = async function (itemId, qui) {
      const it = ATTENTES.filter(function (x) { return x.id === itemId; })[0];
      if (!it) return;
      let res = null;
      try {
        if (it.source === 'rdv') {
          const r = await SS.getRdv(it.rdv_id);
          if (!r || !r.id) { toast('Demande introuvable — recharge la page.', 'error'); return; }
          r.assigned_to = qui;
          r.date_modification = new Date().toISOString();
          res = await SS.saveRdv(r);
        } else if (it.source === 'sav') {
          const d = await SS.getDevis(it.devis_id);
          const t = ((d && d.sav_tickets) || []).filter(function (x) { return String(x.id) === String(it.ticket_id); })[0];
          if (!t) { toast('Ticket introuvable — recharge la page.', 'error'); return; }
          // On renvoie le ticket ENTIER : le serveur le reconstruit champ par champ, omettre une
          // clé l'effacerait.
          res = await SS.saveSavTicket(it.devis_id, Object.assign({}, t, { pour: qui }));
        } else if (it.source === 'echange') {
          const s = sujetDe(it.sujet_id);
          if (!s) { toast('Sujet introuvable — recharge la page.', 'error'); return; }
          if (!(await enregistrer(s, { pour: qui }))) return;
          res = { ok: true };
        } else if (it.source === 'planning') {
          const d = await SS.getDevis(it.devis_id);
          if (!d || !d.id) { toast('Dossier introuvable — recharge la page.', 'error'); return; }
          if (it.nature === 'depannage') {
            // Les intervenants sont saisis en clair : on préserve les tiers (« Jean (intérim) »).
            const anciens = (d.depannage && d.depannage.techniciens) || [];
            const tiers = anciens.filter(function (t) {
              const k = String(t || '').trim().toLowerCase();
              return k !== 'nicolas' && k !== 'yannick';
            });
            d.depannage = Object.assign({}, d.depannage || {}, { techniciens: [nomDe(qui)].concat(tiers) });
          } else {
            d.chantier = Object.assign({}, d.chantier || {}, { equipe: qui });
          }
          d.date_modification = new Date().toISOString();
          res = await SS.saveDevis(d);
        }
      } catch (e) {
        toast('Attribution impossible : ' + e.message, 'error', 7000); return;
      }
      if (res && res.ok === false) { toast(res.error || 'Non enregistré — réessaie.', 'error', 7000); return; }
      if (res && res.conflict) { window.SSUI.showSaveConflict(function () { location.reload(); }); return; }
      toast(qui === MOI.key ? 'C’est pour toi' : 'Confié à ' + nomDe(qui), 'ok');
      recharger();
    };

    function avatar(k) {
      const couleur = k === 'yannick' ? 'var(--accent-2)' : 'var(--accent)';
      return '<span class="ec-ava" style="--ac:' + couleur + '">' + escHtml(nomDe(k).slice(0, 1)) + '</span>';
    }

    /* ── A — UNE CARTE ───────────────────────────────────────────────────────────────────────
       Repliée : la nature, le titre, qui a la balle ; qui, quand, pour qui, le client, le dossier ;
       et la dernière parole du fil. Dépliée (toucher la tête) : le détail, les photos, la décision,
       le fil et les gestes — les secondaires (Modifier, Le dossier, Supprimer) derrière « Plus ».
       Une carte dont une zone est ouverte reste dépliée. */
    function carte(s) {
      const n = NATURES[s.kind] || NATURES.afaire;
      const r = EC.resume(s, MOI.key);
      const pourMoi = r.balle === 'moi';
      const id = jsAttr(s.id), k = escHtml(s.id);
      const ouverte = OUVERTES.has(s.id) || REPOND === s.id || DECIDE === s.id || EDITE === s.id ||
        (s.reponses || []).some(function (x) { return x && x.id === EDITE_REP; }) || !!AVERT[s.id];
      const enRetard = s.echeance && s.echeance < window.SSUI.aujourdhui() && s.statut !== 'fait';
      // Repliée, la carte ne répète pas « pour … » : la pastille de la balle le dit déjà.
      const meta = [
        nomDe(s.auteur),
        relTime(s.date_creation),
        ouverte ? (s.pour ? 'pour ' + nomDe(s.pour) : 'pour nous deux') : '',
        s.echeance ? (enRetard ? 'en retard, ' : '') + 'pour le ' + fmtDate(s.echeance) : '',
        // Une correction se VOIT. Deux personnes partagent ce fil : pouvoir reecrire un message
        // sans que rien ne le dise transformerait une memoire commune en terrain mouvant.
        s.modifie_le ? 'modifié ' + relTime(s.modifie_le) + (s.modifie_par && s.modifie_par !== s.auteur ? ' par ' + nomDe(s.modifie_par) : '') : '',
      ].filter(Boolean).join(' · ');
      const lienClient = s.client_nom
        ? ' · <a class="ec-lien" href="clients.html?q=' + encodeURIComponent(s.client_nom) + '">' + escHtml(s.client_nom) + '</a>'
        : '';
      const lienDossier = s.devis_id
        ? ' · <a class="ec-lien" href="vue.html?id=' + encodeURIComponent(s.devis_id) + '">dossier #' + escHtml(s.devis_id) + '</a>'
        : '';
      const balle = s.statut === 'fait'
        ? '<span class="ec-balle" style="color:var(--ok);border-color:color-mix(in srgb,var(--ok) 45%,transparent)">Fait</span>'
        : (s.awaiting ? '<span class="ec-balle ' + (pourMoi ? 'moi' : '') + '">' + (pourMoi ? 'À toi de jouer' : 'Chez ' + escHtml(nomDe(s.awaiting)) + ' · ' + escHtml(String(A.delai(r.depuis)).replace(/^depuis /, ''))) + '</span>' : '');
      const d = r.derniere;
      const dernier = d
        ? '<div class="ec-dernier"><b>' + escHtml(nomDe(d.auteur)) + '</b> : « ' + escHtml(String(d.texte || '').replace(/\s+/g, ' ').slice(0, 140)) + ' » · ' +
          escHtml(relTime(d.date)) + (r.nbReponses > 1 ? ' · ' + r.nbReponses + ' réponses' : '') + '</div>'
        : (s.corps ? '<div class="ec-dernier">' + escHtml(s.corps.replace(/\s+/g, ' ').slice(0, 140)) + '</div>' : '');
      let html = '<div class="ec-suj ' + (pourMoi ? 'pour-moi ' : '') + (s.statut === 'fait' ? 'est-fait ' : '') + (ouverte ? 'ouverte' : 'repliee') +
        '" style="--kc:' + n.couleur + '" id="suj-' + k + '" data-id="' + k + '">' +
        '<button type="button" class="ec-tete" aria-expanded="' + (ouverte ? 'true' : 'false') + '" onclick="basculerCarte(' + id + ')">' +
          '<span class="ec-chev">' + icon('chevronright', 14) + '</span>' +
          '<span class="ec-nat">' + escHtml(n.label) + '</span> ' +
          '<span class="ec-titre">' + escHtml(s.titre) + '</span> ' + balle +
        '</button>' +
        '<div class="ec-meta">' + escHtml(meta) + lienClient + lienDossier + '</div>';
      if (!ouverte) return html + dernier + '</div>';

      html += (AVERT[s.id] ? '<div class="ec-avert">' + icon('warning', 12) + ' ' + escHtml(AVERT[s.id]) + '</div>' : '') +
        (s.corps ? '<div class="ec-corps">' + escHtml(s.corps) + '</div>' : '') +
        ((s.photos || []).length
          ? '<div class="ec-vign">' + s.photos.map(function (ph, i) {
              // On ouvre DANS la page : partir sur un autre onglet faisait perdre sa place dans
              // la liste, et il fallait revenir en arriere pour continuer a lire.
              return '<div class="ec-ph"><button type="button" class="ec-ph-voir" title="Ouvrir en grand" ' +
                'onclick="voirPhotos(' + id + ', ' + i + ')">' +
                '<img src="' + escHtml(ph.url) + '" alt="" loading="lazy"></button>' +
                '<button type="button" class="ec-ph-suppr" title="Supprimer cette photo" onclick="supprimerPhoto(' + id + ', ' + jsAttr(ph.id) + ')">✕</button></div>';
            }).join('') + '</div>'
          : '') +
        (s.decision ? '<div class="ec-decision">' + icon('check', 13) +
          '<div><b>Décidé :</b> ' + escHtml(s.decision) +
          '<div class="qd">' + escHtml(nomDe(s.decision_par) + (s.decision_le ? ' · ' + relTime(s.decision_le) : '')) + '</div></div></div>' : '') +
        ((s.reponses || []).length ? '<div class="ec-fil">' + s.reponses.map(function (rp) {
          const rid = jsAttr(rp.id);
          // ⚠️ Le bouton n'apparait QUE sur ses propres reponses — et le serveur le verifie de son
          // cote (403), parce qu'une garde qui ne vit que dans l'ecran n'est pas une garde.
          // Corriger sa faute de frappe est normal ; reecrire ce que l'autre a dit ne l'est pas.
          const sien = rp.auteur === MOI.key && rp.id;
          if (EDITE_REP === rp.id) {
            return '<div class="ec-rep">' + avatar(rp.auteur) + '<div style="flex:1;min-width:0">' +
              '<textarea class="textarea" id="re-' + escHtml(rp.id) + '" style="min-height:58px">' + escHtml(rp.texte) + '</textarea>' +
              '<div class="ec-fin" style="margin-top:0.4rem">' +
                '<button class="btn btn-ghost btn-sm" onclick="annulerEditionReponse()">Annuler</button>' +
                '<button class="btn btn-primary btn-sm" style="margin-left:auto" onclick="enregistrerReponse(' + id + ', ' + rid + ')">Enregistrer</button>' +
              '</div></div></div>';
          }
          return '<div class="ec-rep' + (rp.rappel ? ' rappel' : '') + '">' + avatar(rp.auteur) + '<div><div class="txt">' + escHtml(rp.texte) + '</div>' +
            '<div class="qd">' + escHtml((rp.rappel ? 'Rappel de ' : '') + nomDe(rp.auteur) + ' · ' + relTime(rp.date) + (rp.modifie_le ? ' · modifié ' + relTime(rp.modifie_le) : '')) +
            (sien && !rp.rappel ? ' · <button type="button" class="ec-lien-bouton" onclick="editerReponse(' + rid + ')">Modifier</button>' : '') +
            '</div></div></div>';
        }).join('') + '</div>' : '');

      // Les gestes : les deux qu'on fait tous les jours, le rappel quand il a lieu d'être, et « Plus ».
      const plus = PLUS.has(s.id);
      html += '<div class="ec-actions">' +
          (s.statut === 'fait'
            ? '<button class="btn btn-ghost btn-sm" onclick="rouvrir(' + id + ')">' + icon('reply', 13) + ' Rouvrir</button>'
            : '<button class="btn btn-ghost btn-sm" onclick="ouvrirReponse(' + id + ')">' + icon('message', 13) + ' Répondre</button>' +
              '<button class="btn btn-ghost btn-sm" onclick="marquerFait(' + id + ')">' + icon('check', 13) + ' C’est fait</button>') +
          (EC.peutRappeler(s, MOI.key) ? '<button class="btn btn-ghost btn-sm" onclick="rappeler(' + id + ')">' + icon('clock', 13) + ' Lui rappeler</button>' : '') +
          '<button class="btn btn-ghost btn-sm" aria-expanded="' + (plus ? 'true' : 'false') + '" onclick="basculerPlus(' + id + ')">Plus ' + icon(plus ? 'chevrondown' : 'chevronright', 12) + '</button>' +
        '</div>' +
        (plus ? '<div class="ec-plusl">' +
          '<button class="btn btn-ghost btn-sm" onclick="ouvrirEdition(' + id + ')">' + icon('edit', 13) + ' Modifier</button>' +
          (s.devis_id ? '<button class="btn btn-ghost btn-sm" onclick="location.href=' + jsAttr('vue.html?id=' + encodeURIComponent(s.devis_id)) + '">' + icon('window', 13) + ' Le dossier</button>' : '') +
          (EC.peutSupprimer(s, MOI.key)
            ? '<button class="btn btn-ghost btn-sm" style="margin-left:auto;color:var(--danger);border-color:color-mix(in srgb,var(--danger) 35%,transparent)" onclick="supprimer(' + id + ')">Supprimer</button>'
            : '<span class="at-nom" style="margin-left:auto;align-self:center" title="Ce sujet porte ce que l’autre a écrit : on le classe, on ne le supprime pas.">porte la parole de ' + escHtml(nomDe(autre(MOI.key))) + ' : se classe</span>') +
        '</div>' : '');

      /* La boite de correction. Meme convention que la publication : PREMIERE LIGNE = le titre,
         le reste = le corps. Personne n'a envie de jongler entre deux champs pour corriger une
         faute, et deux conventions differentes pour la meme chose, c'est une de trop. */
      if (EDITE === s.id) {
        const courant = EDITE_POUR !== null ? EDITE_POUR : (s.pour || '');
        const dossiers = optionsDossiers(s.client_nom || '', s.devis_id || '');
        html += '<div class="ec-repbox">' +
          '<textarea class="textarea" id="et-' + k + '" style="min-height:92px" ' +
            'placeholder="Première ligne : le titre. Les suivantes : le détail.">' +
            escHtml(s.titre + (s.corps ? '\n' + s.corps : '')) + '</textarea>' +
          '<div class="ec-fin" style="margin-top:0.5rem">' +
            '<input class="input ec-lie" id="ec-' + k + '" list="dlClients" autocomplete="off" oninput="majDossiersEdition(' + id + ')" ' +
              'placeholder="Lié à un client (vider pour détacher)" value="' + escHtml(s.client_nom || '') + '">' +
            '<select class="select ec-dossier" id="ed-dos-' + k + '"' + (dossiers ? '' : ' hidden') + ' aria-label="Dossier du client">' + dossiers + '</select>' +
          '</div>' +
          /* Destinataire et échéance. Ils ne se posaient qu'à la publication : un sujet créé
             « pour nous deux » ne pouvait plus être confié à quelqu'un, et une échéance oubliée
             restait oubliée (règle 15). */
          '<div class="ec-fin" style="margin-top:0.5rem">' +
            ['nicolas', 'yannick', ''].map(function (v) {
              return '<button type="button" class="chip ' + (courant === v ? 'active' : '') + '" ' +
                'onclick="choisirPourEdition(' + id + ', ' + jsAttr(v) + ')">' +
                (v ? 'Pour ' + nomDe(v) : 'Pour nous deux') + '</button>';
            }).join('') +
            '<input class="input" type="date" id="ee-' + k + '" style="margin-left:auto;max-width:190px" ' +
              'title="Échéance (vider pour l’enlever)" value="' + escHtml(s.echeance || '') + '">' +
          '</div>' +
          '<div class="ec-fin">' +
            '<button type="button" class="btn btn-ghost btn-sm" onclick="document.getElementById(\'ep-' + k + '\').click()" title="Joindre une photo à ce sujet">' + icon('camera', 13) + ' Photo</button>' +
            '<input type="file" id="ep-' + k + '" accept="image/*" multiple hidden onchange="joindrePhotos(' + id + ', this)">' +
            '<button class="btn btn-ghost btn-sm" onclick="ouvrirEdition(' + id + ')">Annuler</button>' +
            '<button class="btn btn-primary btn-sm" style="margin-left:auto" onclick="enregistrerEdition(' + id + ')">Enregistrer</button>' +
          '</div>' +
        '</div>';
      }
      if (DECIDE === s.id) {
        html += '<div class="ec-repbox">' +
          '<textarea class="textarea" id="dt-' + k + '" style="min-height:58px" placeholder="' +
            (s.kind === 'question' ? 'Ce qui a été décidé (obligatoire sur une question)…' : 'Ce qui a été décidé, ou fait (facultatif)…') + '"></textarea>' +
          '<div class="ec-fin">' +
            '<button class="btn btn-ghost btn-sm" onclick="ouvrirDecision(' + id + ')">Annuler</button>' +
            '<button class="btn btn-primary btn-sm" style="margin-left:auto" onclick="classerAvecDecision(' + id + ')">Classer</button>' +
          '</div>' +
        '</div>';
      }
      if (REPOND === s.id) {
        html += '<div class="ec-repbox">' +
          '<textarea class="textarea" id="rt-' + k + '" placeholder="Ta réponse…" style="min-height:58px"></textarea>' +
          '<div class="ec-fin">' +
            '<label class="chip" style="cursor:pointer"><input type="checkbox" id="rl-' + k + '" style="vertical-align:-1px"> Et je lui redemande</label>' +
            '<button class="btn btn-primary btn-sm" style="margin-left:auto" onclick="envoyerReponse(' + id + ')">Envoyer</button>' +
          '</div>' +
        '</div>';
      }
      return html + '</div>';
    }

    // ── G — Le registre des décisions ─────────────────────────────────────────────────────
    window.rendreDecisions = function () {
      const l = EC.decisions(SUJETS, el('rechDec').value || '');
      el('decHost').innerHTML = l.length
        ? '<div class="ec-liste">' + l.map(function (x) {
            return '<div class="ec-dec" data-id="' + escHtml(x.id) + '"><div class="txt">' + escHtml(x.decision) + '</div>' +
              '<div class="qd">' + escHtml([nomDe(x.par), x.le ? fmtDate(x.le) : '', x.client_nom].filter(Boolean).join(' · ')) +
              ' · <button type="button" class="ec-lien-bouton" onclick="allerAuSujet(' + jsAttr(x.id) + ')">« ' + escHtml(x.titre.slice(0, 80)) + ' »</button></div></div>';
          }).join('') + '</div>'
        : '<div class="empty"><div class="big">' + icon('check', 40) + '</div>' +
          (EC.decisions(SUJETS, '').length ? 'Aucune décision ne correspond.' : 'Aucune décision écrite pour l’instant.<br>Elles s’écrivent en classant un sujet (« C’est fait »).') + '</div>';
    };

    // ── Actions ──────────────────────────────────────────────────────────────────────────────
    window.setKind = function (k) { P_KIND = k; rendrePuces(); };
    window.setPour = function (p) { P_POUR = p; rendrePuces(); };
    window.setFiltre = function (k) { F_KIND = k; rendre(); };
    window.basculerCarte = function (id) {
      if (OUVERTES.has(id)) { OUVERTES.delete(id); if (REPOND === id) REPOND = ''; if (DECIDE === id) DECIDE = ''; if (EDITE === id) EDITE = ''; }
      else OUVERTES.add(id);
      rendre();
    };
    window.basculerPlus = function (id) { if (PLUS.has(id)) PLUS.delete(id); else PLUS.add(id); rendre(); };

    // Sujet et reponse en cours de correction. Un seul a la fois, comme REPOND et DECIDE :
    // deux boites ouvertes en meme temps, on ne sait plus laquelle on est en train de remplir.
    let EDITE = '', EDITE_REP = '';

    // Photos CHOISIES mais pas encore envoyees : elles attendent l'identifiant du sujet.
    let PHOTOS_EN_ATTENTE = [];
    window.ajouterPhotos = function (input) {
      const fichiers = [...(input.files || [])];
      input.value = '';                       // sinon rechoisir le meme fichier ne declenche rien
      fichiers.forEach(function (f) {
        if (!/^image\//.test(f.type)) { toast('« ' + f.name + ' » n’est pas une image.', 'warn'); return; }
        const lecteur = new FileReader();
        lecteur.onload = function () { PHOTOS_EN_ATTENTE.push({ fichier: f, apercu: lecteur.result }); rendreVignettes(); };
        lecteur.readAsDataURL(f);
      });
    };
    window.retirerPhotoEnAttente = function (i) { PHOTOS_EN_ATTENTE.splice(i, 1); rendreVignettes(); };
    function rendreVignettes() {
      el('pVignettes').innerHTML = PHOTOS_EN_ATTENTE.map(function (p, i) {
        return '<div class="ec-ph ec-ph-att"><img src="' + p.apercu + '" alt="">' +
          '<button type="button" class="ec-ph-suppr" title="Retirer" onclick="retirerPhotoEnAttente(' + i + ')">✕</button></div>';
      }).join('');
    }
