<!DOCTYPE html>
<html lang="fr" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>SolariScreen — Planning</title>
  <!-- ── Installation sur l'écran d'accueil (Android + iPhone) — aucun service worker ── -->
  <link rel="manifest" href="../manifest.webmanifest">
  <meta name="theme-color" content="#0b1224" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#f4f6fb" media="(prefers-color-scheme: light)">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="SolariScreen">
  <link rel="apple-touch-icon" href="../assets/img/apple-touch-icon.png">
  <link rel="icon" type="image/svg+xml" href="../assets/img/logo-solariscreen.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600;700&family=Orbitron:wght@600;800&display=swap" rel="stylesheet">
  <script src="../assets/js/theme.js"></script>
  <link rel="stylesheet" href="../assets/css/tokens.css">
  <link rel="stylesheet" href="../assets/css/theme-dark.css">
  <link rel="stylesheet" href="../assets/css/theme-light.css">
  <link rel="stylesheet" href="../assets/css/theme-cyberpunk.css">
  <link rel="stylesheet" href="../assets/css/theme-zen.css">
  <link rel="stylesheet" href="../assets/css/theme-ardoise.css">
  <link rel="stylesheet" href="../assets/css/base.css">
  <style>
    /* ── Barre d'outils ─────────────────────────────────────────────────────────────────────── */
    .pl-bar { display: flex; align-items: center; gap: var(--sp-3); flex-wrap: wrap; margin-bottom: var(--sp-4); }
    .pl-seg { display: inline-flex; border: 1px solid var(--border-strong); border-radius: var(--r-sm); overflow: hidden; }
    .pl-seg button { background: none; border: none; color: var(--text-muted); font-family: var(--font-mono); font-size: var(--fs-2xs);
      text-transform: uppercase; letter-spacing: 0.06em; padding: 0.4rem 0.7rem; cursor: pointer; display: inline-flex; align-items: center; gap: 0.35rem; }
    .pl-seg button.active { background: var(--accent); color: var(--on-accent); }
    .pl-nav { display: inline-flex; align-items: center; gap: var(--sp-2); }
    .pl-nav .pl-fleche { width: 32px; height: 32px; flex: none; display: grid; place-items: center; background: none;
      border: 1px solid var(--border-strong); border-radius: var(--r-sm); color: var(--text-muted); cursor: pointer; }
    .pl-nav .pl-fleche:hover { border-color: var(--accent); color: var(--accent); }
    .pl-periode { font-family: var(--font-display); font-size: var(--fs-md); color: var(--text); min-width: 10ch; }
    .pl-spacer { flex: 1 1 auto; }

    /* ── Conflits et avertissements ─────────────────────────────────────────────────────────── */
    .pl-alertes { display: grid; gap: var(--sp-2); margin-bottom: var(--sp-4); }
    .pl-alerte { display: flex; align-items: flex-start; gap: var(--sp-2); padding: var(--sp-3) var(--sp-4);
      border: 1px solid color-mix(in srgb, var(--danger) 45%, transparent); border-left: 3px solid var(--danger);
      border-radius: var(--r-sm); background: color-mix(in srgb, var(--danger) 8%, transparent); font-size: var(--fs-sm); }
    .pl-alerte.warn { border-color: color-mix(in srgb, var(--warn) 45%, transparent); border-left-color: var(--warn);
      background: color-mix(in srgb, var(--warn) 8%, transparent); }
    .pl-alerte svg { flex: none; margin-top: 2px; color: var(--danger); }
    .pl-alerte.warn svg { color: var(--warn); }
    .pl-alerte b { color: var(--text); }

    /* ── Résumé de la période et charge à six semaines ──────────────────────────────────────── */
    /* UNE LIGNE au lieu de cinq tuiles (26/10/2026). Sur téléphone, les tuiles empilées
       repoussaient la journée à 954 px : sous le bas d'un écran de 812, on ouvrait le planning
       sans voir sa journée. Les mêmes chiffres tiennent dans une phrase et deux barres. */
    .pl-resume { display: flex; flex-wrap: wrap; align-items: center; gap: var(--sp-2) var(--sp-4);
      padding: var(--sp-3) var(--sp-4); margin-bottom: var(--sp-3); border: 1px solid var(--border);
      border-radius: var(--r-md); background: var(--surface); font-size: var(--fs-sm); color: var(--text-muted); }
    .pl-resume b { color: var(--text); font-weight: 700; }
    .pl-ch { display: inline-flex; align-items: center; gap: 0.45rem; white-space: nowrap; }
    .pl-ch .nom { color: var(--text); font-weight: 600; }
    .pl-ch small { font-family: var(--font-mono); font-size: var(--fs-3xs); color: var(--text-subtle); }
    .pl-barre { display: inline-block; width: 64px; height: 6px; flex: none; border-radius: 999px; background: var(--surface-3); overflow: hidden; }
    .pl-barre i { display: block; height: 100%; border-radius: inherit; background: var(--accent); }
    .pl-barre.plein i { background: var(--warn); }
    .pl-resume .attention { display: inline-flex; align-items: center; gap: 0.3rem; color: var(--danger); font-weight: 600; }
    .pl-6s { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: var(--sp-2); margin-bottom: var(--sp-4); }
    .pl-6s button { display: flex; flex-direction: column; gap: 3px; min-width: 0; padding: 0.4rem 0.5rem; text-align: left;
      background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-sm); color: inherit; cursor: pointer; }
    .pl-6s button:hover { border-color: var(--accent); }
    .pl-6s button.on { border-color: var(--accent); box-shadow: 0 0 0 1px color-mix(in srgb, var(--accent) 35%, transparent); }
    .pl-6s .sem { font-family: var(--font-mono); font-size: var(--fs-3xs); color: var(--text-subtle); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .pl-6s .lg { display: flex; align-items: center; gap: 4px; font-family: var(--font-mono); font-size: var(--fs-3xs); color: var(--text-muted); white-space: nowrap; }
    .pl-6s .lg .pl-barre { width: auto; flex: 1 1 auto; min-width: 12px; height: 5px; }
    .pl-alertes:empty { display: none; }
    .pl-plus { display: none; }
    .pl-lien { background: none; border: 0; padding: 0; font: inherit; color: var(--accent); text-decoration: underline;
      text-underline-offset: 2px; cursor: pointer; }

    /* ── Vue SEMAINE : une ligne par personne ─────────────────────────────────────────────────── */
    /* (26/10/2026, variante A choisie par Nicolas sur maquette.) Sept cartes empilées disaient
       « qu'y a-t-il ce jour-là » ; pour savoir QUI était pris QUAND, il fallait les lire une à une.
       Une ligne par personne, coupée en matin et après-midi, le dit d'un coup d'œil.
       ⚠️ Les colonnes s'alignent par « subgrid » : chaque jour est une colonne qui PARTAGE les
       lignes de la grille, donc le couloir de Nicolas est à la même hauteur les sept jours, même
       quand un jour est plus chargé. Sous 900 px, la même structure se replie jour par jour — la
       feuille de style seule en décide, aucune branche JavaScript sur la largeur (règle 24). */
    .pl-sem { display: grid; grid-template-columns: 70px repeat(7, minmax(0, 1fr)); column-gap: 6px; row-gap: 5px; }
    .pl-labels, .pl-jc { display: grid; grid-template-rows: subgrid; grid-row: 1 / -1; min-width: 0; }
    .pl-l { display: flex; align-items: center; min-width: 0; font-size: var(--fs-2xs); font-weight: 600; color: var(--text-muted); }
    .pl-l.mini { font-family: var(--font-mono); font-size: var(--fs-3xs); font-weight: 400; text-transform: uppercase;
      letter-spacing: 0.06em; color: var(--text-subtle); }
    .pl-l.orph { color: var(--danger); }
    .pl-jh { display: flex; align-items: baseline; gap: 0.35rem; padding: 0 2px 4px; border-bottom: 2px solid var(--border); }
    .pl-jh .j { font-family: var(--font-mono); font-size: var(--fs-2xs); text-transform: uppercase; letter-spacing: 0.08em; color: var(--text-subtle); }
    .pl-jh .n { font-family: var(--font-display); font-size: var(--fs-md); color: var(--text); }
    /* Le mois suit le numéro : poussé à droite, il se lisait comme celui du jour SUIVANT. */
    .pl-jh .mois { font-size: var(--fs-3xs); color: var(--text-subtle); }
    .pl-jc.is-today .pl-jh { border-bottom-color: var(--accent); }
    .pl-jc.is-today .pl-jh .n { color: var(--accent); }
    .pl-jc.is-passe { opacity: 0.55; }
    /* La météo du jour : vide tant que la prévision n'est pas arrivée, et alors elle ne dit rien. */
    .pl-mj { display: flex; align-items: center; gap: 4px; min-height: 18px; min-width: 0; overflow: hidden;
      font-family: var(--font-mono); font-size: var(--fs-3xs); color: var(--text-subtle); white-space: nowrap; }
    .pl-mj > span { overflow: hidden; text-overflow: ellipsis; }
    .pl-mj.ko { color: var(--danger); font-weight: 700; }
    .pl-cell { display: flex; gap: 4px; min-width: 0; padding: 3px; border: 1px solid var(--border); border-radius: var(--r-sm); background: var(--surface); }
    .pl-jc.is-we .pl-cell { background: var(--surface-2); }
    .pl-cell .lane-l { display: none; }
    .pl-ccorps { display: flex; flex-direction: column; gap: 3px; flex: 1 1 auto; min-width: 0; }
    .pl-demis { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 3px; flex: 1 1 auto; }
    .pl-demi { display: flex; flex-direction: column; gap: 3px; min-width: 0; min-height: 34px; border-radius: 4px; }
    /* Hachuré = ne travaille pas. Le MOTIF dit « fermé » : la couleur, ici, dit la nature du
       rendez-vous (règle 21 bis), elle ne peut pas porter un second sens. */
    .pl-demi.hors { background: repeating-linear-gradient(135deg, transparent 0 7px, color-mix(in srgb, var(--border-strong) 55%, transparent) 7px 8px); }
    .pl-cell.orph { border-style: dashed; border-color: color-mix(in srgb, var(--danger) 50%, transparent);
      background: color-mix(in srgb, var(--danger) 5%, var(--surface)); }
    .pl-cell.orph.vide { border-color: transparent; background: none; }
    .pl-dispo { flex: 1 1 auto; min-height: 24px; min-width: 0; padding: 2px; border: 1px dashed color-mix(in srgb, var(--ok) 55%, transparent);
      border-radius: 4px; background: none; color: var(--ok); font-family: var(--font-mono); font-size: var(--fs-3xs); cursor: pointer;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .pl-dispo:hover, .pl-dispo:focus-visible { background: color-mix(in srgb, var(--ok) 12%, transparent); }
    .pl-chip { display: block; width: 100%; min-width: 0; padding: 3px 5px; text-align: left; cursor: pointer; color: inherit;
      font-size: var(--fs-3xs); line-height: 1.3; border: 1px solid color-mix(in srgb, var(--c, var(--accent)) 35%, var(--border));
      border-left: 3px solid var(--c, var(--accent)); border-radius: 4px; background: color-mix(in srgb, var(--c, var(--accent)) 10%, var(--surface)); }
    .pl-chip:hover { border-color: var(--c, var(--accent)); }
    /* Le NOM identifie le rendez-vous : dans une demi-journée de 70 px il sortait en « Bernade… ».
       Il passe sur deux lignes avant de se couper. */
    .pl-chip .t { display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; overflow: hidden;
      font-size: var(--fs-2xs); font-weight: 700; color: var(--text); overflow-wrap: break-word; hyphens: auto; }
    .pl-chip .h { font-family: var(--font-mono); font-weight: 400; color: var(--c, var(--accent)); }
    .pl-chip .s { display: block; font-family: var(--font-mono); color: var(--text-subtle); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .pl-chip .ko-t { display: block; font-family: var(--font-mono); font-weight: 700; color: var(--danger); }
    .pl-chip .ko-t:empty { display: none; }
    .pl-chip.ko { border-color: var(--danger); border-style: dashed; border-left-style: solid; }
    .pl-chip.is-indispo { --c: var(--text-subtle); background: repeating-linear-gradient(45deg, var(--surface-2) 0 5px, var(--surface-3) 5px 10px); }
    .pl-leg { display: flex; flex-wrap: wrap; gap: var(--sp-2) var(--sp-4); margin-top: var(--sp-3); font-size: var(--fs-2xs); color: var(--text-subtle); }
    .pl-leg .sw { display: inline-block; width: 14px; height: 10px; margin-right: 5px; vertical-align: -1px; border-radius: 2px; }
    .pl-leg .sw.libre { border: 1px dashed color-mix(in srgb, var(--ok) 55%, transparent); }
    .pl-leg .sw.hors { border: 1px solid var(--border); background: repeating-linear-gradient(135deg, transparent 0 3px, color-mix(in srgb, var(--border-strong) 55%, transparent) 3px 4px); }

    /* Météo prévue d'un rendez-vous (vue Jour) : vide tant que la réponse n'est pas là. */
    .pl-meteo { display: block; font-family: var(--font-mono); font-size: var(--fs-3xs); color: var(--text-subtle); }
    .pl-meteo:empty { display: none; }
    .pl-meteo.ko { color: var(--danger); font-weight: 700; }
    .pl-vide { font-size: var(--fs-3xs); color: var(--text-subtle); font-style: italic; }

    /* ── Vue MOIS ───────────────────────────────────────────────────────────────────────────── */
    .pl-mois { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 2px; background: var(--border); border: 1px solid var(--border); border-radius: var(--r-md); overflow: hidden; }
    .pl-mois .entete { background: var(--surface-2); padding: 0.4rem; text-align: center; font-family: var(--font-mono);
      font-size: var(--fs-3xs); text-transform: uppercase; letter-spacing: 0.06em; color: var(--text-subtle); }
    .pl-case { background: var(--surface); min-height: 74px; padding: 0.35rem; display: flex; flex-direction: column; gap: 0.25rem;
      border: none; text-align: left; cursor: pointer; color: inherit; }
    .pl-case:hover { background: var(--surface-2); }
    .pl-case.hors { opacity: 0.4; }
    .pl-case.is-we { background: var(--surface-2); }
    .pl-case.is-today .num { color: var(--accent); font-weight: 800; }
    .pl-case .num { font-family: var(--font-mono); font-size: var(--fs-2xs); color: var(--text-muted); }
    .pl-case .pts { display: flex; flex-wrap: wrap; gap: 2px; }
    .pl-case .pt { width: 100%; height: 3px; border-radius: 2px; background: var(--c, var(--accent)); }
    .pl-case .mini { font-size: var(--fs-3xs); color: var(--text-subtle); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    /* ── Vue JOUR ───────────────────────────────────────────────────────────────────────────── */
    .pl-jour { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(320px, 100%), 1fr)); gap: var(--sp-3); }
    .pl-pers { border: 1px solid var(--border); border-radius: var(--r-md); background: var(--surface); padding: var(--sp-4); }
    .pl-persh { display: flex; align-items: center; gap: var(--sp-2); margin-bottom: var(--sp-3); padding-bottom: var(--sp-2); border-bottom: 1px solid var(--border); }
    .pl-persh .nom { font-family: var(--font-display); font-size: var(--fs-md); color: var(--text); }
    .pl-persh .taux { margin-left: auto; font-family: var(--font-mono); font-size: var(--fs-2xs); color: var(--text-subtle); }
    .pl-suite { display: flex; flex-direction: column; gap: var(--sp-2); }
    .pl-bloc { display: flex; gap: var(--sp-3); align-items: stretch; }
    .pl-bloc .heures { font-family: var(--font-mono); font-size: var(--fs-2xs); color: var(--text-subtle); width: 14ch; flex: none; padding-top: 0.15rem; white-space: nowrap; }
    .pl-bloc .corps { flex: 1 1 auto; border-left: 3px solid var(--c, var(--border-strong)); padding: 0.4rem 0 0.4rem var(--sp-3); }
    .pl-bloc.libre .corps { border-left-style: dashed; border-left-color: color-mix(in srgb, var(--ok) 55%, transparent); }
    .pl-bloc .nomc { font-weight: 600; color: var(--text); }
    .pl-bloc .detail { font-size: var(--fs-xs); color: var(--text-muted); margin-top: 0.15rem; }
    .pl-bloc .lieu { font-family: var(--font-mono); font-size: var(--fs-3xs); color: var(--text-subtle); margin-top: 0.15rem; }
    .pl-bloc .lieu a { color: var(--accent-2); }
    .pl-bloc .libtxt { color: var(--ok); font-size: var(--fs-sm); }
    .pl-actions { display: flex; flex-wrap: wrap; gap: var(--sp-2); margin-top: var(--sp-2); }
    .pl-route { margin-bottom: var(--sp-3); }

    /* ── À planifier ────────────────────────────────────────────────────────────────────────── */
    .pl-titre { display: flex; align-items: center; gap: var(--sp-2); font-family: var(--font-mono); font-size: var(--fs-2xs);
      text-transform: uppercase; letter-spacing: 0.08em; color: var(--text-subtle); margin: var(--sp-6) 0 var(--sp-3); }
    .pl-titre .n { color: var(--text-muted); }
    .pl-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(300px, 100%), 1fr)); gap: var(--sp-3); }
    .pl-carte { border: 1px solid var(--border); border-radius: var(--r-md); background: var(--surface); padding: var(--sp-4); }
    .pl-carte .tete { display: flex; justify-content: space-between; align-items: flex-start; gap: var(--sp-2); }
    .pl-carte .cli { font-weight: 700; min-width: 6ch; }
    .pl-carte .badge { flex: 0 0 auto; }
    .pl-carte .adr { font-family: var(--font-mono); font-size: var(--fs-2xs); color: var(--text-subtle); margin-top: 0.2rem; }
    .pl-carte .adr a { color: var(--accent-2); }
    .pl-carte .res { font-size: var(--fs-xs); color: var(--text-muted); margin-top: var(--sp-2); }
    .pl-carte .champs { display: grid; grid-template-columns: 1fr 1fr; gap: var(--sp-2); margin-top: var(--sp-3); }
    .pl-carte .champs .field { margin: 0; }
    .pl-carte .champs .plein { grid-column: 1 / -1; }
    .pl-carte .actions { display: flex; gap: var(--sp-2); margin-top: var(--sp-3); flex-wrap: wrap; }
    /* Les dates proposées : l'équipe est libre assez longtemps et la météo ne s'y oppose pas. */
    .pl-prop { margin-top: var(--sp-3); padding-top: var(--sp-2); border-top: 1px dashed var(--border); }
    .pl-prop-t { display: flex; align-items: center; gap: 0.35rem; flex-wrap: wrap; font-family: var(--font-mono); font-size: var(--fs-3xs);
      text-transform: uppercase; letter-spacing: 0.06em; color: var(--text-subtle); }
    .pl-pills { display: flex; flex-wrap: wrap; gap: 6px; margin: 6px 0 4px; }
    .pl-pill { padding: 0.3rem 0.6rem; border: 1px solid color-mix(in srgb, var(--ok) 55%, transparent); border-radius: var(--r-sm);
      background: none; color: var(--ok); font-family: var(--font-mono); font-size: var(--fs-2xs); cursor: pointer; }
    .pl-pill:hover, .pl-pill:focus-visible { background: color-mix(in srgb, var(--ok) 12%, transparent); }

    /* ── Fenêtres ───────────────────────────────────────────────────────────────────────────── */
    .modal-bg { position: fixed; inset: 0; background: rgba(0,0,0,0.55); z-index: 1000; display: none; align-items: center; justify-content: center; padding: var(--sp-4); }
    .modal-bg.open { display: flex; }
    .modal { background: var(--surface); border: 1px solid var(--border-strong); border-radius: var(--r-md); box-shadow: var(--shadow);
      width: 620px; max-width: 100%; max-height: 92vh; display: flex; flex-direction: column; }
    .mhead { display: flex; align-items: center; gap: var(--sp-2); padding: var(--sp-4) var(--sp-5); border-bottom: 1px solid var(--border);
      font-family: var(--font-display); font-size: var(--fs-md); color: var(--accent); }
    .mhead .mid { font-family: var(--font-mono); font-size: var(--fs-2xs); color: var(--text-subtle); margin-left: auto; }
    .mbody { padding: var(--sp-5); overflow: auto; }
    /* Qui s'en occupe : des cases à cocher pour un dépannage (on peut être deux), un choix unique
       pour une pose ou une visite. Hauteur explicite — `pointer: coarse` ne couvre pas ce composant. */
    .qui-box { display: flex; flex-wrap: wrap; gap: var(--sp-2); }
    .qui-opt { display: inline-flex; align-items: center; gap: 0.4rem; min-height: 38px; padding: 0.3rem 0.7rem;
      border: 1px solid var(--border-strong); border-radius: var(--r-sm); cursor: pointer; font-size: var(--fs-sm); color: var(--text-muted); }
    .qui-opt.on { border-color: var(--accent); color: var(--text); background: color-mix(in srgb, var(--accent) 12%, transparent); }
    .ev-lieu { font-family: var(--font-mono); font-size: var(--fs-2xs); color: var(--text-subtle); margin-top: var(--sp-2); }
    .ev-lieu a { color: var(--accent-2); }
    .ev-note { font-size: var(--fs-xs); color: var(--text-muted); margin-top: var(--sp-3); line-height: 1.5; }
    .mfoot { display: flex; justify-content: flex-end; gap: var(--sp-2); padding: var(--sp-4) var(--sp-5); border-top: 1px solid var(--border); flex-wrap: wrap; }
    .m2 { display: grid; grid-template-columns: 1fr 1fr; gap: var(--sp-3); }

    /* Trame hebdomadaire : une ligne par jour, une colonne par personne. */
    .tr-table { width: 100%; border-collapse: collapse; }
    .tr-table th, .tr-table td { padding: 0.35rem 0.4rem; border-bottom: 1px solid var(--border); text-align: left; }
    .tr-table th { font-family: var(--font-mono); font-size: var(--fs-3xs); text-transform: uppercase; letter-spacing: 0.06em; color: var(--text-subtle); font-weight: 400; }
    .tr-table td:first-child { font-size: var(--fs-sm); color: var(--text-muted); }
    /* JAMAIS de `height` fixe ici : `.select` porte déjà 0,65 rem de padding en haut ET en bas,
       soit ~37 px de contenu. Forcer 34 px poussait le texte hors de la boîte et « Journée »
       s'affichait coupé en deux dans le sens de la hauteur. On resserre le padding, la hauteur
       suit toute seule. `line-height` est fixé explicitement pour la même raison : hérité, il vaut
       1,6 et réclame plus de place que le padding n'en laisse — le bas des lettres se fait rogner,
       et pas de la même façon selon le navigateur. */
    .tr-table .select { padding: 0.4rem 0.5rem; font-size: var(--fs-champ); line-height: 1.25; height: auto; }
    /* Sur téléphone, le JOUR passe au-dessus de ses deux menus. En trois colonnes, à 375 px,
       chaque menu ne gardait que ~52 px pour son texte : « Pas disponible » et « Après-midi »
       sortaient déjà coupés, et « Journée » aussi une fois les champs à 16 px (anti-zoom iOS).
       Deux colonnes seulement : ~140 px par menu, les quatre libellés tiennent en entier.
       `minmax(0, 1fr)` et non `1fr` : une piste `1fr` nue s'élargit jusqu'au contenu. */
    @media (max-width: 640px) {
      .tr-table, .tr-table thead, .tr-table tbody { display: block; }
      .tr-table tr { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); column-gap: var(--sp-2); }
      .tr-table th:first-child { display: none; }
      .tr-table th, .tr-table td { padding-left: 0; padding-right: 0; }
      .tr-table td:first-child { grid-column: 1 / -1; border-bottom: 0; padding-bottom: 0; }
      /* La flèche du menu garde sa propre marge (~20 px) : le padding de droite ne sert à rien,
         et ces 8 px sont ce qui manquait à « Pas disponible » pour tenir à 375 px. */
      .tr-table .select { padding-left: 0.4rem; padding-right: 0; }
      /* Et 8 px de plus par menu : sans eux, « Pas disponible » ne tenait qu'à 0,5 px près à
         375 px, et plus du tout sur un Android de 360 px. */
      #mTrameBody { padding-left: var(--sp-4); padding-right: var(--sp-4); }
    }
    .ex-ligne { display: flex; align-items: center; gap: var(--sp-2); border: 1px solid var(--border); border-left: 3px solid var(--border-strong);
      border-radius: var(--r-sm); padding: 0.4rem var(--sp-2); margin-bottom: 0.4rem; background: var(--surface-2); font-size: var(--fs-sm); }
    .ex-ligne.dispo { border-left-color: var(--ok); }
    .ex-ligne .qui { font-family: var(--font-mono); font-size: var(--fs-2xs); color: var(--text-muted); }
    .ex-ligne .quand { color: var(--text); }
    .ex-ligne .motif { color: var(--text-subtle); font-size: var(--fs-xs); }
    .ex-ligne .sup { margin-left: auto; width: 30px; height: 30px; flex: none; display: grid; place-items: center; background: none;
      border: 1px solid var(--border-strong); border-radius: var(--r-sm); color: var(--text-muted); cursor: pointer; }
    .ex-ligne .sup:hover { border-color: var(--danger); color: var(--danger); }

    /* « Caler ici » : ce qui attend une date, en options ; le détail apparaît sous le choix. */
    .cl-plage { font-size: var(--fs-sm); color: var(--ok); }
    .cl-grp { margin: var(--sp-4) 0 var(--sp-2); font-family: var(--font-mono); font-size: var(--fs-3xs); text-transform: uppercase;
      letter-spacing: 0.08em; color: var(--text-subtle); }
    .cl-opt { display: block; width: 100%; margin-bottom: 6px; padding: 0.5rem 0.7rem; text-align: left; cursor: pointer; color: inherit;
      border: 1px solid var(--border-strong); border-radius: var(--r-sm); background: none; }
    .cl-opt:hover { border-color: var(--accent); }
    .cl-opt.on { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 10%, transparent); }
    .cl-opt .t { display: flex; align-items: center; gap: 0.35rem; font-weight: 600; color: var(--text); }
    .cl-opt .s { display: block; margin-top: 2px; font-size: var(--fs-xs); color: var(--text-muted); }
    .cl-detail { margin-top: var(--sp-4); padding-top: var(--sp-3); border-top: 1px solid var(--border); }
    .cl-bloquer { margin-top: var(--sp-4); }
    .ev-avert { margin-top: var(--sp-3); font-size: var(--fs-sm); font-weight: 600; color: var(--danger); }

    /* ── Téléphone ──────────────────────────────────────────────────────────────────────────── */
    /* Une grille de 7 colonnes sur 375 px donne des colonnes de 45 px : illisible. La semaine
       s'empile donc en 7 blocs. Le mois, lui, tient : ses cases ne portent que des pastilles. */
    @media (max-width: 900px) {
      /* Jour par jour : chaque jour devient une carte, et chaque couloir y porte son nom. */
      .pl-sem { display: flex; flex-direction: column; gap: var(--sp-3); }
      .pl-labels { display: none; }
      .pl-jc { display: flex; flex-direction: column; gap: 5px; padding: var(--sp-2); border: 1px solid var(--border);
        border-radius: var(--r-md); background: var(--surface); }
      .pl-jc.is-today { border-color: var(--accent); }
      .pl-jc.is-passe { display: none; }   /* la semaine en cours se lit à partir d'aujourd'hui */
      .pl-jh .mois { margin-left: 0; }
      .pl-cell { padding: 0; border: none; background: none; }
      .pl-jc.is-we .pl-cell { background: none; }
      .pl-cell .lane-l { display: flex; align-items: center; width: 54px; flex: none; font-size: var(--fs-2xs); font-weight: 600; color: var(--text-muted); }
      .pl-cell.orph { padding: 3px; }
      .pl-cell.orph .lane-l { color: var(--danger); }
      .pl-cell.orph.vide { display: none; }
    }
    @media (max-width: 560px) {
      .pl-bar { gap: var(--sp-2); }
      .pl-periode { font-size: var(--fs-sm); min-width: 0; }
      .pl-spacer { display: none; }
      .pl-case { min-height: 58px; }
      .pl-case .mini { display: none; }
      /* LA JOURNÉE DOIT ÊTRE DANS LE PREMIER ÉCRAN. Mesuré à 375 × 812 : barre d'outils, résumé,
         six semaines et alertes la poussaient à 780 px. Les six semaines tiennent sur UNE rangée
         qu'on fait glisser du doigt (la page, elle, ne déborde pas) ; le résumé laisse aux alertes
         ce qu'elles disent déjà (« à attribuer », « hors des jours ») ; les alertes se resserrent
         sans rien cacher. */
      .pl-6s { display: flex; overflow-x: auto; overscroll-behavior-x: contain; scrollbar-width: none; gap: 6px; }
      .pl-6s::-webkit-scrollbar { display: none; }
      .pl-6s button { flex: 0 0 104px; }
      .pl-resume { padding: var(--sp-2) var(--sp-3); gap: 4px var(--sp-3); font-size: var(--fs-xs); }
      .pl-resume .attention, .pl-ch small { display: none; }
      .pl-alerte { padding: var(--sp-2) var(--sp-3); font-size: var(--fs-xs); line-height: 1.4; }
      /* Deux alertes, puis un bouton qui DIT combien il en reste : quatre alertes repoussaient la
         journée sous l'écran. Rien n'est caché sans le dire (même principe que « voir les N » du
         tableau de bord). La feuille de style décide de la largeur ; le script ne fait que compter. */
      #alertes:not(.tout) > .pl-alerte:nth-child(n+3) { display: none; }
      .pl-plus:not([hidden]) { display: block; width: 100%; margin: calc(-1 * var(--sp-2)) 0 var(--sp-4); padding: 0.45rem;
        border: 1px dashed var(--border-strong); border-radius: var(--r-sm); background: none; color: var(--text-muted);
        font-family: var(--font-mono); font-size: var(--fs-2xs); cursor: pointer; }
      .m2 { grid-template-columns: 1fr; }
      .pl-carte .champs { grid-template-columns: 1fr; }
      .pl-carte .champs .plein { grid-column: auto; }   /* span dans une grille à 1 colonne = colonne fantôme */
      /* Sous 560 px, « 08:00 → 12:00 » et le contenu du créneau ne tiennent plus côte à côte :
         l'heure passe au-dessus. Surtout pas de largeur rognée — le texte se casserait
         lettre par lettre, exactement comme le titre du bon d'intervention. */
      .pl-bloc { flex-direction: column; gap: 0.15rem; }
      .pl-bloc .heures { width: auto; }
      .pl-bloc .corps { border-left-width: 2px; padding-left: var(--sp-2); }
    }
    /* Composants maison : `@media (pointer: coarse)` de base.css ne couvre que `.btn` et consorts,
       ceux-ci resteraient à 21 px de haut sur un vrai téléphone. */
    @media (pointer: coarse) {
      .pl-seg button { min-height: 38px; }
      .pl-fleche { width: 38px; height: 38px; }
      .pl-dispo { min-height: 32px; }
      .pl-chip { min-height: 32px; }
      .pl-6s button, .cl-opt, .pl-pill { min-height: 40px; }
      .ex-ligne .sup { width: 38px; height: 38px; }
    }
  </style>
</head>

  <!-- ══════════ Un rendez-vous : qui s'en occupe, quand, combien de temps ══════════ -->
  <!-- Répond à « comment j'attribue une tâche à Yannick ? ». L'attribution vivait dans TROIS
       écrans différents selon la nature du travail — fiche devis pour une pose, demande de RDV
       pour une visite, simulateur pour un dépannage — et aucun n'était atteignable depuis le

  <!-- ══════════ Caler quelque chose dans un créneau libre ══════════ -->
  <div class="modal-bg" id="mCalerBg">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="mCalerTitre">
      <div class="mhead"><span id="mCalerIc"></span><span id="mCalerTitre">Caler ici</span></div>
