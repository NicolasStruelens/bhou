  <script src="../assets/js/ui.js"></script>
  <script src="../assets/js/nav.js"></script>
  <script src="../assets/js/fetes.js"></script>
  <script src="../assets/js/api.js"></script>
  <script src="../assets/js/config.js"></script>
  <!-- company.js : l'adresse du siège, lieu de la météo d'un jour sans rendez-vous. -->
  <script src="../assets/js/company.js"></script>
  <script src="../assets/js/planning.js"></script>
  <script src="../assets/js/attente.js"></script>
  <script>
    const SS = window.SS;
    const P = window.SSPlanning;
    const { el, icon, toast, escHtml, fmtDate, qp } = window.SSUI;
    const SELLER_LABELS = window.SSUI.SELLER_LABELS;   // source unique du vocabulaire : ui.js
    window.SSTheme.mountThemeToggle(document.getElementById('themeToggle'));
    window.SSNav.mount(document.getElementById('quickNav'));

    const PERSONNES = ['nicolas', 'yannick'];
    const MOIS = ['janvier', 'février', 'mars', 'avril', 'mai', 'juin', 'juillet', 'août', 'septembre', 'octobre', 'novembre', 'décembre'];
    // Abréviations d'usage : couper à quatre lettres donnait « octo. » et confondait juin et juillet.
    const MOIS_COURT = ['janv.', 'févr.', 'mars', 'avr.', 'mai', 'juin', 'juil.', 'août', 'sept.', 'oct.', 'nov.', 'déc.'];

    // État de l'écran. `ANCRE` est la date de référence : la vue s'organise autour d'elle.
    // Sur téléphone, la vue du matin est celle du JOUR : on part sur un chantier, on veut savoir
    // ce qu'il y a aujourd'hui, pas relire la semaine. Au bureau, la semaine reste la bonne entrée.
    // Un choix déjà fait par l'utilisateur l'emporte toujours sur cette valeur de départ.
    let VUE = qp('vue') || localStorage.getItem('ss_planning_vue') || (window.innerWidth <= 560 ? 'jour' : 'semaine');
    let QUI = localStorage.getItem('ss_planning_qui') || 'tous';
    let ANCRE = qp('date') || P.aujourdhui();
    let EVS = [];          // événements de la fenêtre affichée
    let TOUS_EVS = [];     // tous les événements connus (les conflits ne s'arrêtent pas au dimanche)
    let DISPOS = [];
    let REGLAGES = null;
    let A_PLANIFIER = [], A_COMMANDER = [];
    let IDENTITE = { key: '' };
    let SOURCES = { devis: [], rdvs: [], dispos: [] };   // la matière brute : « Caler ici » y cherche ce qui attend une date
    const jsAttr = window.SSUI.jsAttr;

    if (['semaine', 'mois', 'jour'].indexOf(VUE) < 0) VUE = 'semaine';

    // ── Bornes de la période affichée ────────────────────────────────────────────────────────
    function bornes() {
      if (VUE === 'jour') return { du: ANCRE, au: ANCRE };
      if (VUE === 'semaine') { const l = P.lundiDe(ANCRE); return { du: l, au: P.plusJours(l, 6) }; }
      // Mois : la grille déborde sur les jours voisins pour commencer un lundi et finir un dimanche.
      const d = P.dateDe(ANCRE);
      const premier = P.ymd(new Date(d.getFullYear(), d.getMonth(), 1));
      const dernier = P.ymd(new Date(d.getFullYear(), d.getMonth() + 1, 0));
      return { du: P.lundiDe(premier), au: P.plusJours(P.lundiDe(dernier), 6) };
    }
    function titrePeriode() {
      const b = bornes();
      if (VUE === 'jour') {
        const d = P.dateDe(ANCRE);
        return P.JOURS[P.indexJour(ANCRE)].long + ' ' + d.getDate() + ' ' + MOIS[d.getMonth()];
      }
      if (VUE === 'semaine') {
        const a = P.dateDe(b.du), z = P.dateDe(b.au);
        // Une semaine à cheval sur deux mois porte son mois de chaque côté. Mettre les deux noms
        // à la fin donnait « 28 → 4 septembre – octobre », qui ne veut rien dire.
        if (a.getMonth() === z.getMonth()) return a.getDate() + ' → ' + z.getDate() + ' ' + MOIS[a.getMonth()];
        return a.getDate() + ' ' + MOIS_COURT[a.getMonth()] + ' → ' + z.getDate() + ' ' + MOIS_COURT[z.getMonth()];
      }
      const d = P.dateDe(ANCRE);
      return MOIS[d.getMonth()] + ' ' + d.getFullYear();
    }

    // ── Chargement ───────────────────────────────────────────────────────────────────────────
    async function charger() {
      const r = await P.charger();                    // aucune borne : les conflits débordent la semaine
      TOUS_EVS = r.evenements;
      DISPOS = r.sources.dispos;
      REGLAGES = r.reglages;
      A_PLANIFIER = r.aPlanifier;
      A_COMMANDER = r.aCommander || [];
      SOURCES = r.sources || SOURCES;
      try { IDENTITE = await window.SSNav.getIdentity(); } catch (e) { IDENTITE = { key: '' }; }
      rendre();
    }

    function evsPeriode() {
      const b = bornes();
      return TOUS_EVS.filter(function (e) {
        if (e.date < b.du || e.date > b.au) return false;
        if (QUI === 'tous') return true;
        // Un événement sans personne assignée reste visible dans une vue filtrée : c'est
        // justement celui dont personne ne s'occupe, le cacher serait le meilleur moyen de l'oublier.
        return !e.qui.length || e.qui.indexOf(QUI) >= 0;
      });
    }
    function personnesVues() { return QUI === 'tous' ? PERSONNES : [QUI]; }

    // ── Rendu ────────────────────────────────────────────────────────────────────────────────
    function rendre() {
      EVS = evsPeriode();
      el('periode').textContent = titrePeriode();
      rendreSegments();
      rendreResume();
      rendreAlertes();
      if (VUE === 'semaine') el('vueHost').innerHTML = vueSemaine();
      else if (VUE === 'mois') el('vueHost').innerHTML = vueMois();
      else el('vueHost').innerHTML = vueJour();
      el('basHost').innerHTML = sectionAPlanifier();
      chargerMeteo();
      chargerPropositions();
    }

    /** « samedi 31 octobre » et « sam 31 oct. » : les deux formes qu'on lit sur un planning. */
    function jourLong(j) { const d = P.dateDe(j); return P.JOURS[P.indexJour(j)].long.toLowerCase() + ' ' + d.getDate() + ' ' + MOIS[d.getMonth()]; }
    function jourCourt(j) { const d = P.dateDe(j); return P.JOURS[P.indexJour(j)].court.toLowerCase() + ' ' + d.getDate() + ' ' + MOIS_COURT[d.getMonth()]; }
    function nomDe(c) { return (((c && c.prenom) || '') + ' ' + ((c && c.nom) || '')).trim() || 'Sans nom'; }

    // ── Météo prévue (Open-Meteo, 16 jours) ──────────────────────────────────────────────────
    /* Trois usages, UNE prévision par ville (SSUI.previsionJours la garde en mémoire) :
       • l'en-tête de chaque jour de la semaine — c'est là que se décide « on pose samedi ? » ;
       • la ligne météo de chaque rendez-vous de la vue Jour ;
       • l'ALERTE quand une pose prévue tombe sous la pluie ou le grand vent (SSPlanning.meteoPose).
         Elle ne se voyait qu'en ouvrant le bon jour, c'est-à-dire trop tard.
       Silencieuse si le réseau ne répond pas, coupée si le réglage d'affichage la masque. */
    function lieuSociete() {
      // « Avenue de la Gare 60, 1401 Baulers » → code postal et ville, lus dans company.js.
      const m = /(\d{4})\s+([^,]+)$/.exec(String((window.SS_COMPANY || {}).address || '').trim());
      return m ? { cp: m[1], ville: m[2].trim() } : null;
    }
    function meteoCourte(w) {
      return (Number(w.pluie) >= 0.5 ? Math.round(Number(w.pluie)) + ' mm' : 'sec') + ' ' + Math.round(w.tmax) + '°';
    }
    function prevision(lieu) {
      return (lieu && window.SSUI.previsionJours) ? window.SSUI.previsionJours(lieu.ville, lieu.cp) : Promise.resolve(null);
    }
    function chargerMeteo() {
      const aff = (REGLAGES && REGLAGES.affichage) || {};
      if (aff.meteo === false) return;
      const auj = P.aujourdhui(), limite = P.plusJours(auj, 15);
      const dansHorizon = function (j) { return j >= auj && j <= limite; };
      if (VUE === 'semaine') {
        const base = lieuSociete(), b = bornes();
        P.jours(b.du, b.au).filter(dansHorizon).forEach(function (j) {
          // Le lieu du jour : celui de la POSE (c'est elle que la météo menace), sinon du premier
          // rendez-vous, sinon le siège.
          const du = TOUS_EVS.filter(function (e) { return e.date === j && e.ville && e.source !== 'indispo'; })
            .sort(function (a, c) { return (a.source === 'pose' ? 0 : 1) - (c.source === 'pose' ? 0 : 1); })[0];
          const lieu = du ? { ville: du.ville, cp: du.cp } : base;
          // Le ROUGE n'existe que les jours où une pose est prévue : c'est elle que la pluie menace.
          // Un autre jour, la pluie reste une information — l'alarme crierait pour rien.
          const pose = TOUS_EVS.some(function (e) { return e.date === j && e.source === 'pose'; });
          prevision(lieu).then(function (jours) {
            const w = jours && jours[j], box = el('mj-' + j);
            if (!w || !box) return;
            const mp = P.meteoPose(w);
            const alerte = pose && !mp.ok;
            box.classList.toggle('ko', alerte);
            box.title = 'Prévision à ' + lieu.ville + ' : ' + w.label + (mp.ok ? '' : ' — ' + mp.raison) + (alerte ? ' — pose prévue ce jour-là' : '');
            const detail = alerte ? ' · ' + mp.raison : (Number(w.pluie) >= 0.5 ? ' · ' + Math.round(Number(w.pluie)) + ' mm' : '');
            box.innerHTML = icon(window.SSUI.weatherIconName(w.code), 12) + '<span>' + Math.round(w.tmax) + '°' + escHtml(detail) + '</span>';
          }).catch(function () { /* la météo ne fait jamais échouer un planning */ });
        });
      }
      EVS.filter(function (e) { return e.source !== 'indispo' && e.ville && dansHorizon(e.date) && el('meteo-' + e.id); }).forEach(function (e) {
        prevision({ ville: e.ville, cp: e.cp }).then(function (jours) {
          const w = jours && jours[e.date], box = el('meteo-' + e.id);
          if (!w || !box) return;
          const mp = P.meteoPose(w);
          box.textContent = w.label + ' ' + Math.round(w.tmin) + '° / ' + Math.round(w.tmax) + '°' + (mp.ok ? '' : ' — ' + mp.raison);
          box.classList.toggle('ko', !mp.ok && e.source === 'pose');
        }).catch(function () {});
      });
      // Les POSES des seize prochains jours, quelle que soit la vue : l'alerte ne dépend pas de la
      // période qu'on regarde.
      TOUS_EVS.filter(function (e) { return e.source === 'pose' && e.ville && dansHorizon(e.date); }).forEach(function (e) {
        prevision({ ville: e.ville, cp: e.cp }).then(function (jours) {
          const mp = P.meteoPose(jours && jours[e.date]);
          if (mp.ok) return;
          document.querySelectorAll('[data-meteo="' + e.id + '"]').forEach(function (n) { n.textContent = mp.raison; });
          alerteMeteo(e, mp);
        }).catch(function () {});
      });
    }
    function alerteMeteo(e, mp) {
      const hote = el('alertes');
      if (!hote || hote.querySelector('[data-id="' + e.id + '"]')) return;
      const d = document.createElement('div');
      d.className = 'pl-alerte warn';
      d.setAttribute('data-id', e.id);
      d.innerHTML = icon('rain', 15) + '<div><b>Pose prévue sous ' + escHtml(mp.raison) + ' — ' + escHtml(e.titre) + '</b><br>' +
        escHtml(jourLong(e.date) + (e.ville ? ' · ' + e.ville : '')) +
        ' · <button type="button" class="pl-lien" onclick="ouvrirEvenement(' + jsAttr(e.id) + ')">déplacer</button></div>';
      hote.appendChild(d);
      majPlusAlertes();
    }

    function rendreSegments() {
      el('btnPrec').innerHTML = icon('chevronright', 15);
      el('btnPrec').style.transform = 'rotate(180deg)';
      el('btnSuiv').innerHTML = icon('chevronright', 15);
      el('btnTrame').innerHTML = icon('clock', 13) + ' Disponibilités';
      el('btnIndispo').innerHTML = icon('lock', 13) + ' Bloquer du temps';
      const vues = [['semaine', 'Semaine'], ['mois', 'Mois'], ['jour', 'Jour']];
      el('segVue').innerHTML = vues.map(function (v) {
        return '<button class="' + (VUE === v[0] ? 'active' : '') + '" onclick="setVue(\'' + v[0] + '\')">' + v[1] + '</button>';
      }).join('');
      const quis = [['tous', 'Tous']].concat(PERSONNES.map(function (p) { return [p, SELLER_LABELS[p] || p]; }));
      el('segQui').innerHTML = quis.map(function (q) {
        return '<button class="' + (QUI === q[0] ? 'active' : '') + '" onclick="setQui(\'' + q[0] + '\')">' + escHtml(q[1]) + '</button>';
      }).join('');
    }

    /** Le résumé de la période en UNE ligne, et la charge des six prochaines semaines (G). */
    function rendreResume() {
      const b = bornes(), auj = P.aujourdhui();
      const nb = function (src) { return EVS.filter(function (e) { return e.source === src; }).length; };
      const mot = function (src) { const n = nb(src), x = P.NATURES[src]; return '<b>' + n + '</b> ' + (n > 1 ? x.pluriel : x.label).toLowerCase(); };
      const bouts = ['<span>' + [mot('pose'), mot('visite'), mot('depannage')].join(' · ') + '</span>'];
      // Taux de remplissage : « peut-on encore prendre un chantier ? » sans ouvrir chaque dossier.
      personnesVues().forEach(function (p) {
        const c = P.charge(p, b.du, b.au, TOUS_EVS, DISPOS, REGLAGES);
        bouts.push('<span class="pl-ch"><span class="nom">' + escHtml(SELLER_LABELS[p] || p) + '</span>' + barre(c) +
          '<span>' + (c.capacite ? c.pct + ' %' : '—') + '</span><small>' +
          escHtml(c.capacite ? c.occupe + ' h / ' + c.capacite + ' h' : 'pas de disponibilité') + '</small></span>');
      });
      const futurs = EVS.filter(function (e) { return e.date >= auj && e.source !== 'indispo'; });
      const orph = futurs.filter(function (e) { return !e.qui.length; }).length;
      const hors = futurs.filter(function (e) { return P.horsTrame(e, DISPOS, REGLAGES).length; }).length;
      if (orph) bouts.push('<span class="attention">' + icon('warning', 13) + ' ' + orph + ' à attribuer</span>');
      if (hors) bouts.push('<span class="attention">' + icon('warning', 13) + ' ' + hors + ' hors des jours de travail</span>');
      el('resume').innerHTML = '<div class="pl-resume">' + bouts.join('') + '</div>';

      // G — « quand a-t-on de la place ? » sans feuilleter semaine par semaine.
      const lundi = P.lundiDe(auj), courante = VUE === 'semaine' ? P.lundiDe(ANCRE) : '';
      const parP = {};
      personnesVues().forEach(function (p) { parP[p] = P.chargeSemaines(p, lundi, 6, TOUS_EVS, DISPOS, REGLAGES); });
      el('sixSem').innerHTML = [0, 1, 2, 3, 4, 5].map(function (i) {
        const du = P.plusJours(lundi, 7 * i), d = P.dateDe(du);
        return '<button type="button" class="' + (du === courante ? 'on' : '') + '" onclick="allerSemaine(\'' + du + '\')" title="' +
          escHtml('Semaine du ' + d.getDate() + ' ' + MOIS[d.getMonth()] + ' — cliquer pour l’afficher') + '">' +
          '<span class="sem">' + (i === 0 ? 'Cette semaine' : 'Sem. du ' + d.getDate() + ' ' + MOIS_COURT[d.getMonth()]) + '</span>' +
          personnesVues().map(function (p) {
            const c = parP[p][i];
            return '<span class="lg"><span>' + escHtml((SELLER_LABELS[p] || p).slice(0, 3)) + '</span>' + barre(c) +
              '<span>' + (c.capacite ? c.pct + '%' : '—') + '</span></span>';
          }).join('') + '</button>';
      }).join('');
    }
    function barre(c) {
      const pct = c.capacite ? Math.min(100, c.pct) : 0;
      return '<span class="pl-barre' + (c.pct >= 85 ? ' plein' : '') + '"><i style="width:' + pct + '%"></i></span>';
    }

    // Les alertes ne recalculent plus leurs propres règles : elles lisent SSAttente, la source
    // unique du « qui doit agir » (assets/js/attente.js). Conflit, rendez-vous sans personne et
    // rendez-vous passé sans suite doivent se dire EXACTEMENT de la même façon ici, dans l'écran
    // Échanges et dans le badge du menu — sinon les trois finiront par se contredire, comme
    // l'avaient fait TYPE_LABEL en treize copies et l'argent dû sur trois écrans.
    // `inclureVisites` : ici on les garde, c'est l'écran du planning. L'écran commun les exclut,
    // parce que les demandes de RDV les signalent déjà.
    function rendreAlertes() {
      const A = window.SSAttente;
      let html = '';
      if (A) {
        const items = A.depuisPlanning(TOUS_EVS, A_PLANIFIER, REGLAGES, { inclureVisites: true }, A_COMMANDER)
          .filter(function (i) { return i.quoi.indexOf('sans date de pose') < 0; });   // déjà listé plus bas
        html = items.slice(0, 6).map(function (i) {
          const grave = i.urgence >= A.URGENCE.CRITIQUE;
          const qui = i.qui ? (SELLER_LABELS[i.qui] || i.qui) : 'Personne';
          return '<div class="pl-alerte ' + (grave ? '' : 'warn') + '">' + icon(grave ? 'warning' : 'clock', 15) +
            '<div><b>' + escHtml(i.quoi) + ' — ' + escHtml(i.titre) + '</b><br>' +
            escHtml([qui, i.detail, A.delai(i.depuis)].filter(Boolean).join(' · ')) + '</div></div>';
        }).join('');
      }
      /* « HORS DE SES JOURS » se calcule ICI et pas dans attente.js : il a besoin des exceptions de
         disponibilité (congés, « ce samedi-là je peux »), que ni le tableau de bord ni le menu ne
         chargent. C'est un garde-fou du PLANNING, comme l'était l'avertissement de conflit avant
         qu'attente.js ne le reprenne. */
      const auj = P.aujourdhui();
      html += TOUS_EVS.filter(function (e) { return e.date >= auj && e.source !== 'indispo'; })
        .map(function (e) { return { e: e, h: P.horsTrame(e, DISPOS, REGLAGES) }; })
        .filter(function (x) { return x.h.length; }).slice(0, 4)
        .map(function (x) {
          const qui = x.h.map(function (h) { return (SELLER_LABELS[h.qui] || h.qui) + (h.raison === 'jour' ? ' ne travaille pas ce jour-là' : ' déborde de sa journée'); }).join(' · ');
          return '<div class="pl-alerte warn">' + icon('warning', 15) + '<div><b>' + escHtml(qui) + ' — ' + escHtml(x.e.titre) + '</b><br>' +
            escHtml(nature(x.e) + ' · ' + jourLong(x.e.date)) +
            ' · <button type="button" class="pl-lien" onclick="ouvrirEvenement(' + jsAttr(x.e.id) + ')">réattribuer</button></div></div>';
        }).join('');
      el('alertes').classList.remove('tout');
      el('alertes').innerHTML = html;     // la météo y ajoute les siennes en arrivant
      majPlusAlertes();
    }
    function majPlusAlertes() {
      const zone = el('alertes'), btn = el('alertesPlus');
      const reste = zone.querySelectorAll('.pl-alerte').length - 2;
      btn.hidden = reste <= 0;
      btn.textContent = zone.classList.contains('tout') ? 'Réduire les alertes'
        : (reste > 1 ? 'Voir les ' + reste + ' autres alertes' : 'Voir l’autre alerte');
    }
    window.basculerAlertes = function () { el('alertes').classList.toggle('tout'); majPlusAlertes(); };
    function nature(e) { return (P.NATURES[e.source] || {}).label || e.source; }

    // ── Vue SEMAINE : une ligne par personne ─────────────────────────────────────────────────
    function vueSemaine() {
      const b = bornes(), auj = P.aujourdhui();
      // Ce que personne n'a pris a SON couloir : le ranger chez quelqu'un par défaut, c'était
      // mentir sur sa charge et sur sa fenêtre « Qui s'en occupe ».
      const orph = EVS.filter(function (e) { return !e.qui.length && e.source !== 'indispo'; });
      const couloirs = personnesVues().map(function (p) { return { k: p, l: SELLER_LABELS[p] || p }; });
      if (orph.length) couloirs.push({ k: '', l: 'À attribuer', orph: true });
      const etiquettes = '<div class="pl-labels" aria-hidden="true"><div></div><div class="pl-l mini">Météo</div>' +
        couloirs.map(function (c) { return '<div class="pl-l' + (c.orph ? ' orph' : '') + '">' + escHtml(c.l) + '</div>'; }).join('') + '</div>';
      const colonnes = P.jours(b.du, b.au).map(function (j) {
        const d = P.dateDe(j);
        const cls = [P.estWeekend(j) ? 'is-we' : '', j === auj ? 'is-today' : '', j < auj ? 'is-passe' : ''].filter(Boolean).join(' ');
        return '<div class="pl-jc ' + cls + '">' +
          '<div class="pl-jh"><span class="j">' + P.JOURS[P.indexJour(j)].court + '</span><span class="n">' + d.getDate() + '</span>' +
            '<span class="mois">' + MOIS_COURT[d.getMonth()] + '</span></div>' +
          '<div class="pl-mj" id="mj-' + j + '"></div>' +
          couloirs.map(function (c) { return c.orph ? celluleOrphelins(j, orph) : cellule(c.k, j); }).join('') +
          '</div>';
      }).join('');
      return '<div class="pl-sem" style="grid-template-rows:auto auto repeat(' + couloirs.length + ', minmax(48px, auto))">' +
        etiquettes + colonnes + '</div>' + legende();
    }
    function legende() {
      return '<div class="pl-leg">' + ['pose', 'visite', 'depannage'].map(function (k) {
        return '<span><i class="sw" style="background:' + P.NATURES[k].couleur + '"></i>' + P.NATURES[k].label + '</span>';
      }).join('') + '<span><i class="sw libre"></i>libre — cliquer pour y caler quelque chose</span>' +
        '<span><i class="sw hors"></i>ne travaille pas</span></div>';
    }
    /** Les morceaux de `blocs` qui tombent dans la demi-journée `h`. */
    function recoupe(blocs, h) {
      return (blocs || []).map(function (b) { return { debut: Math.max(b.debut, h.debut), fin: Math.min(b.fin, h.fin) }; })
        .filter(function (b) { return b.fin > b.debut; });
    }
    const minutes = function (l) { return l.reduce(function (s, b) { return s + (b.fin - b.debut); }, 0); };
    /** « 13–17 h », « 10:30–12 h » : l'heure ronde s'écrit sans ses minutes. */
    function plage(b) {
      const h = function (m) { const s = P.minHhmm(m); return s.slice(3) === '00' ? String(parseInt(s, 10)) : s; };
      return h(b.debut) + '–' + h(b.fin) + ' h';
    }
    /** Une personne, un jour : ce qui est pris, ce qui est libre, ce qui n'est pas travaillé. */
    function cellule(p, j) {
      const passe = j < P.aujourdhui();
      const dj = P.demiJournees(REGLAGES);
      const theo = P.blocsTheoriques(p, j, DISPOS, REGLAGES);
      const libres = passe ? [] : P.libres(p, j, TOUS_EVS, DISPOS, 0, REGLAGES);
      const touche = function (o, h) { return o.debut < h.fin && o.fin > h.debut; };
      const enTravers = [], parDemi = { matin: [], apresmidi: [] };
      TOUS_EVS.filter(function (e) { return e.date === j && e.qui.indexOf(p) >= 0; }).forEach(function (e) {
        const o = P.occupation(e, REGLAGES);
        const m = touche(o, dj.matin), a = touche(o, dj.apresmidi);
        if (m && a) enTravers.push(e); else if (a) parDemi.apresmidi.push(e); else parDemi.matin.push(e);
      });
      const nom = SELLER_LABELS[p] || p;
      const demi = function (k) {
        const h = dj[k];
        const contenu = parDemi[k].map(chip).join('');
        const theoH = recoupe(theo, h);
        if (!theoH.length) {
          return '<div class="pl-demi hors" title="' + escHtml(nom + ' ne travaille pas ' + (k === 'matin' ? 'le matin' : 'l’après-midi')) + '">' + contenu + '</div>';
        }
        // Un trou de moins d'une heure n'est pas une place : on ne le propose pas.
        const libH = recoupe(libres, h).filter(function (x) { return x.fin - x.debut >= 60; });
        const entier = libH.length === 1 && minutes(libH) === minutes(theoH);
        return '<div class="pl-demi">' + contenu + libH.map(function (x) {
          return boutonLibre(p, j, x, entier ? 'libre' : plage(x));
        }).join('') + '</div>';
      };
      return '<div class="pl-cell"><span class="lane-l">' + escHtml(nom.slice(0, 3)) + '</span><div class="pl-ccorps">' +
        enTravers.map(chip).join('') + '<div class="pl-demis">' + demi('matin') + demi('apresmidi') + '</div></div></div>';
    }
    function celluleOrphelins(j, orph) {
      const l = orph.filter(function (e) { return e.date === j; });
      return '<div class="pl-cell orph' + (l.length ? '' : ' vide') + '"><span class="lane-l">À attribuer</span>' +
        '<div class="pl-ccorps">' + l.map(chip).join('') + '</div></div>';
    }
    function boutonLibre(p, j, b, texte) {
      const de = P.minHhmm(b.debut), a = P.minHhmm(b.fin);
      return '<button type="button" class="pl-dispo" onclick="ouvrirCaler({qui:\'' + p + '\',date:\'' + j + '\',debut:\'' + de + '\',fin:\'' + a + '\'})" ' +
        'title="' + escHtml((SELLER_LABELS[p] || p) + ' libre de ' + de + ' à ' + a + ' — cliquer pour y caler quelque chose') + '">' + escHtml(texte) + '</button>';
    }
    /** Un rendez-vous dans la grille. Un clic l'ouvre : c'est là qu'on change qui, quand, combien. */
    function chip(e) {
      const n = P.NATURES[e.source] || {};
      const indispo = e.source === 'indispo';
      const hors = P.horsTrame(e, DISPOS, REGLAGES).map(function (h) {
        return (SELLER_LABELS[h.qui] || h.qui) + (h.raison === 'jour' ? ' ne travaille pas ce jour-là' : ' : hors de ses heures');
      }).join(' · ');
      const qui = e.qui.length ? e.qui.map(function (q) { return (SELLER_LABELS[q] || q).slice(0, 3); }).join('+')
        : (e.source === 'pose' ? 'équipe ?' : 'personne');
      const clic = indispo ? 'modifierIndispo(' + jsAttr(String(e.ref)) + ')' : 'ouvrirEvenement(' + jsAttr(e.id) + ')';
      return '<button type="button" class="pl-chip' + (hors ? ' ko' : '') + (indispo ? ' is-indispo' : '') + '" style="--c:' + n.couleur + '" onclick="' + clic + '" ' +
        'title="' + escHtml(nature(e) + ' — ' + e.titre + (e.adresse ? ' — ' + e.adresse : '') + (hors ? ' — ' + hors : '') + ' · cliquer pour modifier') + '">' +
        '<span class="t">' + (e.heure ? '<span class="h">' + escHtml(e.heure) + '</span> ' : '') + escHtml(e.titre) + '</span>' +
        '<span class="s">' + escHtml(indispo ? (e.detail || 'Indisponible') : [n.label, P.fmtDuree(e.duree_h), qui].filter(Boolean).join(' · ')) + '</span>' +
        (hors ? '<span class="ko-t">' + escHtml(hors) + '</span>' : '') +
        (e.source === 'pose' ? '<span class="ko-t" data-meteo="' + escHtml(e.id) + '"></span>' : '') +
        '</button>';
    }

    // ── Vue MOIS ─────────────────────────────────────────────────────────────────────────────
    function vueMois() {
      const b = bornes();
      const auj = P.aujourdhui();
      const moisAffiche = P.dateDe(ANCRE).getMonth();
      const entetes = P.JOURS.map(function (j) { return '<div class="entete">' + j.court + '</div>'; }).join('');
      const cases = P.jours(b.du, b.au).map(function (j) {
        const d = P.dateDe(j);
        const evs = EVS.filter(function (e) { return e.date === j; });
        const cls = [
          d.getMonth() !== moisAffiche ? 'hors' : '',
          P.estWeekend(j) ? 'is-we' : '',
          j === auj ? 'is-today' : '',
        ].filter(Boolean).join(' ');
        const pastilles = evs.slice(0, 4).map(function (e) {
          return '<span class="pt" style="--c:' + (P.NATURES[e.source] || {}).couleur + '" title="' + escHtml(nature(e) + ' — ' + e.titre) + '"></span>';
        }).join('');
        const premier = evs[0];
        return '<button class="pl-case ' + cls + '" onclick="ouvrirJour(\'' + j + '\')">' +
          '<span class="num">' + d.getDate() + '</span>' +
          (pastilles ? '<span class="pts">' + pastilles + '</span>' : '') +
          (premier ? '<span class="mini">' + escHtml(premier.titre) + (evs.length > 1 ? ' +' + (evs.length - 1) : '') + '</span>' : '') +
          '</button>';
      }).join('');
      return '<div class="pl-mois">' + entetes + cases + '</div>';
    }

    // ── Vue JOUR ─────────────────────────────────────────────────────────────────────────────
    // La suite chronologique de la journée, personne par personne : ce qui est pris et, entre les
    // deux, ce qui est libre. C'est la vue du matin, avant de partir — d'où l'itinéraire de la
    // journée, et Appeler / Y aller sur chaque rendez-vous (E) : sur la route, c'est UN appui.
    function vueJour() {
      const b = bornes();
      return '<div class="pl-jour">' + personnesVues().map(function (p) {
        const c = P.charge(p, b.du, b.au, TOUS_EVS, DISPOS, REGLAGES);
        const sesEvs = TOUS_EVS.filter(function (e) { return e.date === ANCRE && e.qui.indexOf(p) >= 0; });
        const pris = sesEvs.map(function (e) { return { ev: e, o: P.occupation(e, REGLAGES) }; });
        const libres = P.libres(p, ANCRE, TOUS_EVS, DISPOS, 0.5, REGLAGES)
          .map(function (bl) { return { ev: null, o: bl }; });
        const suite = pris.concat(libres).sort(function (x, y) { return x.o.debut - y.o.debut; });
        const arrets = sesEvs.filter(function (e) { return e.source !== 'indispo' && e.adresse; });
        const route = P.itineraire(arrets);
        return '<div class="pl-pers">' +
          '<div class="pl-persh">' + icon('user', 15) + '<span class="nom">' + escHtml(SELLER_LABELS[p] || p) + '</span>' +
            '<span class="taux">' + (c.capacite ? c.occupe + ' h / ' + c.capacite + ' h' : 'non disponible') + '</span></div>' +
          (route ? '<a class="btn btn-ghost btn-sm pl-route" href="' + escHtml(route) + '" target="_blank" rel="noopener">' + icon('route', 13) +
            ' Itinéraire du jour · ' + arrets.length + ' arrêt' + (arrets.length > 1 ? 's' : '') + '</a>' : '') +
          (suite.length ? '<div class="pl-suite">' + suite.map(function (s) { return blocJour(p, s); }).join('') + '</div>'
                        : '<div class="pl-vide">Rien de prévu, et aucune disponibilité déclarée ce jour-là.</div>') +
          '</div>';
      }).join('') + rendreOrphelinsDuJour() + '</div>';
    }

    function blocJour(qui, s) {
      const heures = P.minHhmm(s.o.debut) + ' → ' + P.minHhmm(s.o.fin);
      if (!s.ev) {
        const passe = ANCRE < P.aujourdhui();
        return '<div class="pl-bloc libre"><div class="heures">' + heures + '</div>' +
          '<div class="corps"><span class="libtxt">Libre — ' + escHtml(P.fmtDuree((s.o.fin - s.o.debut) / 60)) + '</span>' +
          (passe ? '' : '<div class="detail"><button class="btn btn-ghost btn-sm" onclick="ouvrirCaler({qui:\'' + qui + '\',date:\'' + ANCRE + '\',debut:\'' + P.minHhmm(s.o.debut) + '\',fin:\'' + P.minHhmm(s.o.fin) + '\'})">' + icon('calendar', 13) + ' Caler ici</button></div>') +
          '</div></div>';
      }
      const e = s.ev, n = P.NATURES[e.source] || {};
      const hors = P.horsTrame(e, DISPOS, REGLAGES).map(function (h) { return (SELLER_LABELS[h.qui] || h.qui) + (h.raison === 'jour' ? ' ne travaille pas ce jour-là' : ' : hors de ses heures'); }).join(' · ');
      const maps = e.adresse ? 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(e.adresse) : '';
      const yAller = e.adresse ? 'https://www.google.com/maps/dir/?api=1&travelmode=driving&destination=' + encodeURIComponent(e.adresse) : '';
      const tel = String(e.tel || '').replace(/[^\d+]/g, '');
      return '<div class="pl-bloc" style="--c:' + n.couleur + '"><div class="heures">' + heures + '</div>' +
        '<div class="corps">' +
        '<div class="nomc">' + escHtml(e.titre) + ' <span class="w" style="color:' + n.couleur + ';font-family:var(--font-mono);font-size:var(--fs-3xs)">' + escHtml(nature(e)) + '</span></div>' +
        (e.detail ? '<div class="detail">' + escHtml(e.detail) + '</div>' : '') +
        (e.adresse ? '<div class="lieu">' + (maps ? '<a href="' + maps + '" target="_blank" rel="noopener">' + escHtml(e.adresse) + '</a>' : escHtml(e.adresse)) + '</div>' : '') +
        (hors ? '<div class="lieu" style="color:var(--danger);font-weight:700">' + escHtml(hors) + '</div>' : '') +
        '<div class="lieu pl-meteo" id="meteo-' + escHtml(e.id) + '"></div>' +
        (e.source === 'indispo'
          ? '<div class="detail"><button class="btn btn-ghost btn-sm" onclick="modifierIndispo(' + jsAttr(String(e.ref)) + ')">Modifier</button></div>'
          : '<div class="pl-actions">' +
              '<button class="btn btn-ghost btn-sm" onclick="ouvrirEvenement(' + jsAttr(e.id) + ')">' + icon('users', 13) + ' Qui s’en occupe</button>' +
              (tel ? '<a class="btn btn-ghost btn-sm" href="tel:' + escHtml(tel) + '">' + icon('phone', 13) + ' Appeler</a>' : '') +
              (yAller ? '<a class="btn btn-ghost btn-sm" href="' + escHtml(yAller) + '" target="_blank" rel="noopener">' + icon('pin', 13) + ' Y aller</a>' : '') +
              '<button class="btn btn-ghost btn-sm" onclick="agenda(' + jsAttr(e.id) + ')">' + icon('calendar', 13) + ' Agenda</button>' +
            '</div>') +
        '</div></div>';
    }

    /** Les rendez-vous du jour que personne n'a pris : ils n'apparaissent dans aucune colonne. */
    function rendreOrphelinsDuJour() {
      const orph = EVS.filter(function (e) { return e.date === ANCRE && !e.qui.length && e.source !== 'indispo'; });
      if (!orph.length) return '';
      return '<div class="pl-pers">' +
        '<div class="pl-persh">' + icon('warning', 15) + '<span class="nom">À attribuer</span></div>' +
        '<div class="pl-suite">' + orph.map(chip).join('') + '</div></div>';
    }

    // ── À planifier (chantiers signés qui n'ont pas encore de date) ──────────────────────────
    function sectionAPlanifier() {
      if (!A_PLANIFIER.length) return '';
      return '<div class="pl-titre">' + icon('calendar', 13) + ' À planifier <span class="n">(' + A_PLANIFIER.length + ')</span></div>' +
        '<div class="pl-grid">' + A_PLANIFIER.map(carteAPlanifier).join('') + '</div>';
    }
    function carteAPlanifier(d) {
      const cl = d.client || {}, adr = cl.adresse || {};
      const adresse = [((adr.rue || '') + ' ' + (adr.numero || '')).trim(), ((adr.code_postal || '') + ' ' + (adr.ville || '')).trim()].filter(Boolean).join(', ');
      const maps = adresse ? 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(adresse) : '';
      const ch = d.chantier || {};
      const resume = (window.SSUI.resumeDevis && window.SSUI.resumeDevis(d)) || '';
      const equipes = { nicolas: 'Nicolas', yannick: 'Yannick', nicolas_yannick: 'Nicolas + Yannick', sous_traitant: 'Sous-traitant' };
      const id = window.SSUI.jsAttr(d.id);
      return '<div class="pl-carte ticked">' +
        '<div class="tete"><div><div class="cli">' + escHtml(((cl.prenom || '') + ' ' + (cl.nom || '')).trim() || '—') + '</div>' +
        '<div class="adr">' + (adresse ? (maps ? '<a href="' + maps + '" target="_blank" rel="noopener">' + escHtml(adresse) + '</a>' : escHtml(adresse)) : 'Adresse non renseignée') + '</div></div>' +
        (d.statut === 'termine' ? '<span class="badge badge-warn" title="Marqué « Terminé » alors qu\'aucune pose n\'est enregistrée.">Terminé sans pose</span>' : '<span class="badge">Sans date</span>') +
        '</div>' +
        (resume ? '<div class="res">' + escHtml(resume) + '</div>' : '') +
        '<div class="pl-prop" id="prop-' + escHtml(d.id) + '"><span class="pl-prop-t">' + icon('calendar', 12) + ' Dates possibles</span>' +
          '<span class="pl-vide">recherche…</span></div>' +
        '<div class="champs">' +
        '<div class="field"><label class="label">Date de pose</label><input class="input" type="date" value="" onchange="fixerPose(' + id + ', this.value)"></div>' +
        '<div class="field"><label class="label">Durée (h)</label><input class="input input-num" type="number" min="0" step="0.5" value="' + (ch.duree_h != null ? ch.duree_h : '') + '" onchange="setChantier(' + id + ',\'duree_h\', parseFloat(this.value) || 0)"></div>' +
        '<div class="field plein"><label class="label">Équipe</label><select class="select" onchange="setChantier(' + id + ',\'equipe\', this.value)">' +
        // ⚠️ Option VIDE en tête, et surtout pas de repli sur 'nicolas' : afficher « Nicolas »
        //    quand rien n'est enregistré fait croire que c'est fait, donc on ne touche pas au
        //    champ, donc rien ne s'enregistre jamais. Même défaut que la fiche devis, corrigé le
        //    04/10/2026 : la rémunération lit la BASE, pas l'écran.
        '<option value=""' + (ch.equipe ? '' : ' selected') + '>— à renseigner —</option>' +
        Object.keys(equipes).map(function (k) { return '<option value="' + k + '"' + (ch.equipe === k ? ' selected' : '') + '>' + equipes[k] + '</option>'; }).join('') +
        '</select></div></div>' +
        '<div class="actions"><button class="btn btn-ghost btn-sm" onclick="location.href=\'vue.html?id=' + encodeURIComponent(d.id) + '\'">' + icon('window', 14) + ' Voir la fiche</button></div>' +
        '</div>';
    }

    /** Écrit un devis : on le relit COMPLET, `modifier` n'y change que ce qui doit changer, et on
     *  le renvoie. Le devis complet n'est chargé QU'ICI, au moment d'écrire : la liste suffit à
     *  tout afficher, inutile de rapatrier les photos de trente dossiers. */
    async function ecrireDevis(id, modifier, message) {
      const d = await SS.getDevis(id);
      if (!d) { toast('Devis introuvable — recharge la page.', 'error'); return null; }
      modifier(d);
      d.date_modification = new Date().toISOString();
      const res = await SS.saveDevis(d);
      if (res.ok === false) { toast(res.error || 'Non enregistré — réessaie.', 'error', 6000); return null; }
      if (res.conflict) { window.SSUI.showSaveConflict(function () { location.reload(); }); return null; }
      toast(res.offline ? 'Enregistré hors-ligne' : (message || 'Planification mise à jour'), res.offline ? 'warn' : 'ok');
      return d;
    }
    // Nom DISTINCT de window.setChantier : une fonction declaree au premier niveau d'un script
    // classique devient deja une propriete de window. Reassigner window.setChantier ensuite
    // faisait que l'appel interne se rappelait lui-meme -- recursion infinie, et aucune
    // planification n'etait enregistree.
    async function ecrireChantier(id, champ, valeur) {
      // On étale le chantier et on ne surcharge que ce qui change : une énumération de champs
      // perdrait silencieusement tout ce qu'elle ne connaît pas (règle 2 du guide).
      return ecrireDevis(id, function (d) { d.chantier = Object.assign({}, d.chantier || {}, { [champ]: valeur }); });
    }
    /** Ce qui cloche AVANT d'écrire : chevauchements ET personne hors de ses jours de travail.
     *  Un avertissement, jamais un blocage (règle 13 : deux petites poses le même jour, ça se fait,
     *  et un samedi exceptionnel aussi). */
    function avertissements(candidat) {
      const l = P.conflitsDe(candidat, TOUS_EVS, REGLAGES).map(function (c) {
        return (SELLER_LABELS[c.qui] || c.qui) + ' a déjà : ' + nature(c.autre) + ' ' + c.autre.titre;
      });
      P.horsTrame(candidat, DISPOS, REGLAGES).forEach(function (h) {
        l.push((SELLER_LABELS[h.qui] || h.qui) + (h.raison === 'jour' ? ' ne travaille pas ce jour-là' : ' : c’est hors de ses heures'));
      });
      return l;
    }
    function confirmerMalgre(candidat, verbe) {
      const l = avertissements(candidat);
      return !l.length || confirm('Attention, le ' + fmtDate(candidat.date) + ' :\n\n' + l.join('\n') + '\n\n' + verbe + ' quand même ?');
    }
    window.setChantier = async function (id, champ, valeur) {
      const d = await ecrireChantier(id, champ, valeur);
      if (d) charger();
    };

    /** Fixer une date de pose : on prévient AVANT d'écrire si la personne est déjà prise ce jour-là.
     *  Un avertissement, jamais un blocage — deux petites poses dans la même journée, ça se fait. */
    window.fixerPose = async function (id, date) {
      if (!date) return;
      const d = (A_PLANIFIER.filter(function (x) { return x.id === id; })[0]) || null;
      const ch = (d && d.chantier) || {};
      const candidat = {
        id: 'pose:' + id, source: 'pose', date: date, heure: '',
        duree_h: Number(ch.duree_h) || Number(P.conf(REGLAGES).duree_pose_h) || 4,
        // Sans équipe, personne n'est mobilisé : on ne vérifie pas Nicolas « par défaut ».
        qui: ch.equipe ? P.quiDeEquipe(ch.equipe) : [], titre: 'ce chantier',
      };
      if (!confirmerMalgre(candidat, 'Planifier')) return;
      const res = await ecrireChantier(id, 'date_pose', date);
      if (res) charger();
    };

    // ── Navigation ───────────────────────────────────────────────────────────────────────────
    window.setVue = function (v) { VUE = v; localStorage.setItem('ss_planning_vue', v); rendre(); };
    window.allerSemaine = function (du) { ANCRE = du; VUE = 'semaine'; localStorage.setItem('ss_planning_vue', 'semaine'); rendre(); };
    window.setQui = function (q) { QUI = q; localStorage.setItem('ss_planning_qui', q); rendre(); };
    window.allerAujourdhui = function () { ANCRE = P.aujourdhui(); rendre(); };
    window.ouvrirJour = function (j) { ANCRE = j; VUE = 'jour'; localStorage.setItem('ss_planning_vue', 'jour'); rendre(); };
    window.naviguer = function (sens) {
      if (VUE === 'jour') ANCRE = P.plusJours(ANCRE, sens);
      else if (VUE === 'semaine') ANCRE = P.plusJours(ANCRE, 7 * sens);
      else {
        const d = P.dateDe(ANCRE);
        // Le 31 : passer au mois suivant donnerait le 3 du mois d'après (31 février n'existe pas).
        // On se cale sur le 1er, qui existe dans tous les mois.
        ANCRE = P.ymd(new Date(d.getFullYear(), d.getMonth() + sens, 1));
      }
      rendre();
    };

    // ── Fenêtre « Rendez-vous » : quand, combien de temps, et QUI s'en occupe ────────────────
    // L'attribution vivait dans trois écrans selon la nature du travail — fiche devis pour une
    // pose, demande de RDV pour une visite, simulateur pour un dépannage. Aucun n'était atteignable
    // depuis le planning, c'est-à-dire depuis le seul écran qui montre qui a du temps.
    const EQUIPES = { nicolas: 'Nicolas', yannick: 'Yannick', nicolas_yannick: 'Nicolas + Yannick', sous_traitant: 'Sous-traitant' };
    let EV = null;        // événement affiché
    let EV_EDIT = null;   // ce qu'on est en train de lui faire dire

    window.ouvrirEvenement = function (id) {
      const e = TOUS_EVS.filter(function (x) { return x.id === id; })[0];
      if (!e) return;
      EV = e;
      EV_EDIT = {
        /* ⚠️ L'équipe ENREGISTRÉE, jamais déduite des personnes affichées. Elle se reconstituait
           depuis la grille, qui rangeait une pose sans équipe chez Nicolas : la fenêtre cochait
           donc « Nicolas » et l'enregistrait au premier changement de date, sans que personne
           l'ait choisi (piège « un formulaire qui affiche un défaut non enregistré ment »). */
        equipe: e.source === 'pose' ? (e.equipe || '') : '',
        assigned: e.source === 'visite' ? (e.qui[0] || '') : '',
        techs: e.qui.slice(),
      };
      const n = P.NATURES[e.source] || {};
      el('mEvIc').innerHTML = icon(n.icone || 'calendar', 16);
      el('mEvTitre').textContent = nature(e) + ' — ' + e.titre;
      el('mEvRef').textContent = e.ref || '';
      el('btnEvFiche').style.display = e.href ? '' : 'none';
      remplirEvenement();
      ouvrirFenetre('mEvBg');
    };
    window.fermerEvenement = function (o) { fermerFenetre('mEvBg', o); EV = null; EV_EDIT = null; };
    window.ouvrirFicheEv = function () { if (EV && EV.href) allerVers(EV.href); };
    window.agendaEv = function () { if (EV) agenda(EV.id); };
    window.basculerTech = function (p) {
      const i = EV_EDIT.techs.indexOf(p);
      if (i >= 0) EV_EDIT.techs.splice(i, 1); else EV_EDIT.techs.push(p);
      remplirEvenement();
    };
    window.choisirEquipe = function (k) { EV_EDIT.equipe = k; remplirEvenement(); };
    window.choisirAssigne = function (p) { EV_EDIT.assigned = p; remplirEvenement(); };

    function remplirEvenement() {
      const e = EV;
      const maps = e.adresse ? 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(e.adresse) : '';
      const opt = function (actif, onclick, texte) {
        return '<button type="button" class="qui-opt ' + (actif ? 'on' : '') + '" onclick="' + onclick + '">' +
          (actif ? icon('check', 13) : '') + escHtml(texte) + '</button>';
      };
      let quiHtml = '', note = '', avert = '';
      if (e.source === 'depannage') {
        // Un dépannage peut mobiliser les deux : cases à cocher, pas un choix unique.
        quiHtml = PERSONNES.map(function (p) {
          return opt(EV_EDIT.techs.indexOf(p) >= 0, 'basculerTech(\'' + p + '\')', SELLER_LABELS[p] || p);
        }).join('');
        note = 'Un intervenant extérieur saisi dans la fiche du dépannage est conservé tel quel.';
      } else if (e.source === 'pose') {
        quiHtml = Object.keys(EQUIPES).map(function (k) {
          return opt(EV_EDIT.equipe === k, 'choisirEquipe(\'' + k + '\')', EQUIPES[k]);
        }).join('');
        note = 'Un chantier confié à un sous-traitant n’occupe ni Nicolas ni Yannick : c’est voulu.';
        if (!EV_EDIT.equipe) avert = 'Personne n’est encore désigné pour cette pose : choisis qui la fait.';
      } else {
        quiHtml = PERSONNES.map(function (p) {
          return opt(EV_EDIT.assigned === p, 'choisirAssigne(\'' + p + '\')', SELLER_LABELS[p] || p);
        }).join('') + opt(!EV_EDIT.assigned, 'choisirAssigne(\'\')', 'Non attribué');
      }
      el('mEvBody').innerHTML =
        (e.adresse ? '<div class="ev-lieu">' + (maps ? '<a href="' + maps + '" target="_blank" rel="noopener">' + escHtml(e.adresse) + '</a>' : escHtml(e.adresse)) + '</div>' : '') +
        (e.detail ? '<div class="ev-note">' + escHtml(e.detail) + '</div>' : '') +
        (avert ? '<div class="ev-avert">' + escHtml(avert) + '</div>' : '') +
        '<div class="field" style="margin-top:var(--sp-4)"><label class="label">Qui s’en occupe</label><div class="qui-box">' + quiHtml + '</div></div>' +
        '<div class="m2" style="margin-top:var(--sp-3)">' +
        '<div class="field"><label class="label">Date</label><input class="input" type="date" id="ev_date" value="' + escHtml(e.date) + '"></div>' +
        '<div class="field"><label class="label">Heure' + (e.source === 'pose' ? ' (facultative)' : '') + '</label>' +
          '<input class="input" type="time" id="ev_heure" value="' + escHtml(e.heure || '') + '"></div>' +
        // `step` décimal obligatoire : sans lui le champ refuse la valeur qu'il affiche, et une
        // main-d'œuvre d'1 h 30 se retrouve tronquée à 1 h à chaque enregistrement.
        '<div class="field"><label class="label">Durée (h)</label><input class="input input-num" type="number" min="0" step="0.5" id="ev_duree" value="' + escHtml(String(e.duree_h || '')) + '"></div>' +
        '</div>' +
        (note ? '<div class="ev-note">' + escHtml(note) + '</div>' : '');
    }

    /** Personnes mobilisées par l'état courant de la fenêtre — sert à chercher les conflits. */
    function quiDeEdit(source) {
      if (source === 'pose') return P.quiDeEquipe(EV_EDIT.equipe);
      if (source === 'visite') return EV_EDIT.assigned ? [EV_EDIT.assigned] : [];
      return EV_EDIT.techs.slice();
    }

    window.enregistrerEvenement = async function () {
      const e = EV;
      const date = el('ev_date').value;
      const heure = el('ev_heure').value || '';
      const duree = parseFloat(el('ev_duree').value) || 0;
      if (!date) { toast('Il faut une date.', 'error'); return; }
      if (e.source === 'pose' && !EV_EDIT.equipe) { toast('Choisis qui pose ce chantier.', 'error'); return; }
      // Une visite est un rendez-vous CHEZ LE CLIENT : sans heure, elle était enregistrée à 09:00
      // sans un mot — une heure que personne n'avait annoncée au client.
      if (e.source === 'visite' && !heure) { toast('Une visite a besoin d’une heure : c’est un rendez-vous chez le client.', 'error'); el('ev_heure').focus(); return; }
      const qui = quiDeEdit(e.source);
      const candidat = { id: e.id, source: e.source, date: date, heure: heure, duree_h: duree, qui: qui, titre: e.titre };
      if (!confirmerMalgre(candidat, 'Enregistrer')) return;
      const btn = el('btnSaveEv'); btn.disabled = true;
      let res = null;
      try {
        if (e.source === 'visite') {
          const r = await SS.getRdv(e.ref);
          if (!r || !r.id) { toast('Demande introuvable — recharge la page.', 'error'); btn.disabled = false; return; }
          // On étale l'objet et on ne surcharge que ce qui change : une énumération de champs
          // perdrait silencieusement tout ce qu'elle ne connaît pas (règle 2 du guide).
          r.date_rdv = date + 'T' + heure;
          r.assigned_to = EV_EDIT.assigned;
          r.duree_h = duree || undefined;
          r.date_modification = new Date().toISOString();
          res = await SS.saveRdv(r);
        } else {
          const d = await SS.getDevis(e.ref);
          if (!d || !d.id) { toast('Devis introuvable — recharge la page.', 'error'); btn.disabled = false; return; }
          if (e.source === 'pose') {
            d.chantier = Object.assign({}, d.chantier || {}, { date_pose: date, heure_pose: heure, duree_h: duree, equipe: EV_EDIT.equipe });
          } else {
            // Les intervenants sont stockés en clair (« Nicolas », « Jean ») : on ne remplace que
            // les deux identités de l'ERP et on garde les tiers exactement comme ils sont saisis.
            d.depannage = Object.assign({}, d.depannage || {}, { date_intervention: date, heure: heure, duree_h: duree,
              techniciens: techniciensAvec(d, EV_EDIT.techs) });
          }
          d.date_modification = new Date().toISOString();
          res = await SS.saveDevis(d);
        }
      } catch (err) {
        btn.disabled = false; toast('Enregistrement impossible : ' + err.message, 'error', 7000); return;
      }
      btn.disabled = false;
      if (res && res.ok === false) { toast(res.error || 'Non enregistré — réessaie.', 'error', 7000); return; }
      if (res && res.conflict) { window.SSUI.showSaveConflict(function () { location.reload(); }); return; }
      toast(res && res.offline ? 'Enregistré hors-ligne' : 'Rendez-vous mis à jour', res && res.offline ? 'warn' : 'ok');
      fermerEvenement();
      charger();
    };

    /** Les intervenants d'un dépannage sont stockés en clair (« Nicolas », « Jean ») : on ne
     *  remplace que les deux identités de l'ERP et on garde les tiers exactement comme saisis. */
    function techniciensAvec(d, personnes) {
      const anciens = (d.depannage && d.depannage.techniciens) || [];
      const tiers = anciens.filter(function (t) {
        const k = String(t || '').trim().toLowerCase();
        return k !== 'nicolas' && k !== 'yannick';
      });
      return personnes.map(function (p) { return SELLER_LABELS[p] || p; }).concat(tiers);
    }

    // ── Fenêtre « Bloquer du temps » ─────────────────────────────────────────────────────────
    let INDISPO = null;
    window.ouvrirIndispo = function (pre) {
      const p = pre || {};
      INDISPO = {
        id: 'DISPO-' + new Date().getFullYear() + '-' + Math.random().toString(36).slice(2, 8).toUpperCase(),
        qui: p.qui || IDENTITE.key || 'nicolas',
        kind: 'indispo',
        du: p.du || ANCRE, au: p.au || p.du || ANCRE,
        journee: !p.debut,
        debut: p.debut || '', fin: p.fin || '',
        motif: '',
        nouveau: true,
      };
      remplirIndispo();
      ouvrirFenetre('mIndispoBg');
    };
    window.modifierIndispo = function (id) {
      const x = DISPOS.filter(function (d) { return String(d.id) === String(id); })[0];
      if (!x) return;
      INDISPO = Object.assign({}, x, { nouveau: false });
      remplirIndispo();
      ouvrirFenetre('mIndispoBg');
    };
    window.fermerIndispo = function (o) { fermerFenetre('mIndispoBg', o); INDISPO = null; };

    function remplirIndispo() {
      const x = INDISPO;
      el('mIndispoIc').innerHTML = icon('lock', 16);
      el('mIndispoTitre').textContent = x.nouveau ? 'Bloquer du temps' : 'Modifier l’indisponibilité';
      el('mIndispoBody').innerHTML =
        '<div class="m2">' +
        '<div class="field"><label class="label">Qui</label><select class="select" id="i_qui">' +

        '</select></div>' +

        '<div class="m2" id="i_horaires" style="' + (x.journee !== false ? 'display:none' : '') + '">' +

        '</div>' +

          '<input class="input" id="i_motif" maxlength="200" placeholder="Congé, chantier Multimedian, rendez-vous personnel…" value="' + escHtml(x.motif || '') + '"></div>';
      const foot = el('btnSaveIndispo').parentNode;
      const ancien = document.getElementById('btnSupIndispo');
      if (ancien) ancien.remove();
      if (!x.nouveau) {
        const b = document.createElement('button');
        b.className = 'btn btn-ghost btn-sm';
        b.id = 'btnSupIndispo';
        b.style.cssText = 'color:var(--danger);border-color:color-mix(in srgb,var(--danger) 40%,transparent);margin-right:auto;';
        b.textContent = 'Supprimer';
        b.onclick = supprimerIndispo;
        foot.insertBefore(b, foot.firstChild);
      }
    }
    window.majHoraires = function () {
      el('i_horaires').style.display = el('i_journee').checked ? 'none' : '';
    };

    window.enregistrerIndispo = async function () {
      const journee = el('i_journee').checked;
      const x = Object.assign({}, INDISPO, {
        qui: el('i_qui').value,
        kind: el('i_kind').value,
        du: el('i_du').value,
        au: el('i_au').value || el('i_du').value,
        journee: journee,
        debut: journee ? '' : el('i_debut').value,
        fin: journee ? '' : el('i_fin').value,
        motif: el('i_motif').value.trim(),
      });
      delete x.nouveau;
      if (!x.du) { toast('Il faut au moins une date.', 'error'); return; }
      if (x.au < x.du) { toast('La date de fin précède la date de début.', 'error'); return; }
      if (!journee && x.fin <= x.debut) { toast('L’heure de fin doit suivre l’heure de début.', 'error'); return; }
      const btn = el('btnSaveIndispo'); btn.disabled = true;
      const res = await SS.saveDispo(x);
      btn.disabled = false;
      if (res.ok === false) { toast(res.error || 'Non enregistré.', 'error', 7000); return; }
      toast(x.kind === 'dispo' ? 'Disponibilité ajoutée' : 'Temps bloqué', 'ok');
      fermerIndispo();
      charger();
    };

    async function supprimerIndispo() {
      if (!INDISPO || !confirm('Supprimer cette indisponibilité ?')) return;
      const res = await SS.deleteDispo(INDISPO.id);
      if (res.ok === false) { toast(res.error || 'Suppression impossible.', 'error', 7000); return; }
      toast('Supprimée', 'ok');
      fermerIndispo();
      charger();
    }

    // ── Fenêtre « Disponibilités » (trame hebdomadaire + exceptions en cours) ────────────────
    window.ouvrirTrame = function () {
      const c = P.conf(REGLAGES);
      const h = c.heures || {};
      el('mTrameIc').innerHTML = icon('clock', 16);
      el('mTrameBody').innerHTML =
        '<p style="font-size:var(--fs-sm);color:var(--text-muted);margin:0 0 var(--sp-4);line-height:1.55;">' +
        'Une semaine <b>ordinaire</b> : ce que chacun peut prendre en temps normal. L’ERP enlève tout seul ' +
        'ce qui est déjà planifié — poses, visites, dépannages. On ne saisit donc jamais ses créneaux libres, ' +
        'seulement les exceptions.</p>' +
        '<table class="tr-table"><thead><tr><th>Jour</th>' +
        PERSONNES.map(function (p) { return '<th>' + escHtml(SELLER_LABELS[p] || p) + '</th>'; }).join('') + '</tr></thead><tbody>' +
        P.JOURS.map(function (j) {
          return '<tr><td>' + j.long + '</td>' + PERSONNES.map(function (p) {

              Object.keys(P.FORMES_JOUR).map(function (k) {
                return '<option value="' + k + '"' + (v === k ? ' selected' : '') + '>' + escHtml(P.FORMES_JOUR[k]) + '</option>';
              }).join('') + '</select></td>';
          }).join('') + '</tr>';
        }).join('') + '</tbody></table>' +
        '<div class="pl-titre">' + icon('clock', 13) + ' Horaires de journée</div>' +
        '<div class="m2">' +
        '<div class="field"><label class="label">Début</label><input class="input" type="time" id="h_debut" value="' + escHtml(h.debut || '08:00') + '"></div>' +
        '<div class="field"><label class="label">Pause de</label><input class="input" type="time" id="h_midi" value="' + escHtml(h.midi || '12:00') + '"></div>' +
        '<div class="field"><label class="label">Reprise</label><input class="input" type="time" id="h_reprise" value="' + escHtml(h.reprise || '13:00') + '"></div>' +
        '<div class="field"><label class="label">Fin</label><input class="input" type="time" id="h_fin" value="' + escHtml(h.fin || '17:00') + '"></div>' +
        '</div>' +
        '<div class="pl-titre">' + icon('lock', 13) + ' Exceptions à venir <span class="n">(' + exceptionsAVenir().length + ')</span></div>' +
        (exceptionsAVenir().length ? exceptionsAVenir().map(ligneException).join('')
          : '<div class="pl-vide">Aucune. Le bouton « Bloquer du temps » en ajoute une.</div>');
      ouvrirFenetre('mTrameBg');
    };
    window.fermerTrame = function (o) { fermerFenetre('mTrameBg', o); };
    // Corriger une exception depuis la trame : une fenêtre RELAIE l'autre, sans toucher à
    // l'historique — un « retour » puis une nouvelle étape se croiseraient (voir « Les fenêtres »).
    window.modifierDepuisTrame = function (id) { relaisFenetre('mTrameBg'); modifierIndispo(id); };

    function exceptionsAVenir() {
      const auj = P.aujourdhui();
      return DISPOS.filter(function (x) { return String(x.au || x.du) >= auj; })
        .sort(function (a, b) { return String(a.du).localeCompare(String(b.du)); });
    }
    function ligneException(x) {
      const quand = x.du === x.au ? fmtDate(x.du) : fmtDate(x.du) + ' → ' + fmtDate(x.au);
      const heures = x.journee === false ? ' · ' + escHtml(x.debut + '–' + x.fin) : '';
      return '<div class="ex-ligne ' + (x.kind === 'dispo' ? 'dispo' : '') + '">' +
        '<span class="qui">' + escHtml((SELLER_LABELS[x.qui] || x.qui).slice(0, 3)) + '</span>' +
        '<span class="quand">' + escHtml(quand) + heures + '</span>' +
        (x.motif ? '<span class="motif">' + escHtml(x.motif) + '</span>' : '') +
        '<button class="sup" onclick="modifierDepuisTrame(' + window.SSUI.jsAttr(String(x.id)) + ')" title="Modifier">' + icon('edit', 13) + '</button>' +
        '</div>';
    }

    window.enregistrerTrame = async function () {
      const btn = el('btnSaveTrame'); btn.disabled = true;
      // On relit les réglages du serveur juste avant d'écrire : le blob est global, et l'autre a pu
      // changer une marge entre-temps. On ne renvoie donc que le bloc `planning` par-dessus la
      // version fraîche, jamais la copie chargée à l'ouverture de la page.
      let frais = null;
      try { frais = await SS.getSettings(); } catch (e) { frais = null; }
      if (!frais) { toast('Réglages illisibles — réessaie une fois connecté.', 'error', 6000); btn.disabled = false; return; }
      const trame = {};
      PERSONNES.forEach(function (p) {
        trame[p] = {};
        P.JOURS.forEach(function (j) {
          const champ = el('t_' + p + '_' + j.k);
          trame[p][j.k] = champ ? champ.value : 'non';
        });
      });
      const heures = {
        debut: el('h_debut').value || '08:00', midi: el('h_midi').value || '12:00',
        reprise: el('h_reprise').value || '13:00', fin: el('h_fin').value || '17:00',
      };
      if (heures.fin <= heures.debut) { toast('La fin de journée doit suivre le début.', 'error'); btn.disabled = false; return; }
      const conf = Object.assign({}, frais, { planning: Object.assign({}, frais.planning || {}, { trame: trame, heures: heures }) });
      const res = await window.SSConf.enregistrer(conf, 'Planning : trame de disponibilités');
      btn.disabled = false;
      if (res && res.ok === false) { toast(res.error || 'Non enregistré.', 'error', 7000); return; }
      toast('Trame enregistrée', 'ok');
      fermerTrame();
      charger();
    };

    // ── « Caler ici » : un créneau libre, et ce qui attend une date (B) ──────────────────────
    /* (26/10/2026) Cliquer un créneau libre ouvrait « Bloquer du temps » : le seul geste proposé
       RETIRAIT de la disponibilité, alors qu'on clique un trou pour le REMPLIR. La fenêtre propose
       maintenant ce qui attend une date — poses dont le matériel est reçu, dépannages sans date,
       visites à fixer — et « Bloquer ce temps » reste là, en dernier.
       ⚠️ UNE VISITE NE SE FIXE PAS D'ICI : elle se convient avec le client. Le créneau rejoint les
       PROPOSITIONS de la demande (rdv.html?open=…&creneau=…), et c'est l'écran des RDV, avec ses
       messages tout prêts, qui le lui soumet. */
    let CALER = null;
    function listesACaler() {
      return {
        poses: A_PLANIFIER.slice(),
        deps: (SOURCES.devis || []).filter(depannageSansDate),
        visites: (SOURCES.rdvs || []).filter(function (r) { return r && ['nouveau', 'a_contacter'].indexOf(r.statut) >= 0; }),
      };
    }
    function depannageSansDate(d) {
      if (!d || d.archive || String(d.type_document || '') !== 'depannage') return false;
      if (String(d.depannage_mode || '') === 'realise') return false;   // un bon d'intervention est déjà fait
      if (['refuse', 'annule', 'termine'].indexOf(d.statut) >= 0) return false;
      // La liste ne porte que `depannage_plan`, et seulement quand une date existe.
      return !((d.depannage_plan || d.depannage || {}).date_intervention);
    }
    window.ouvrirCaler = function (c) {
      CALER = { qui: c.qui, date: c.date, debut: c.debut, fin: c.fin, choix: null, equipe: '', techs: [], heure: c.debut, duree: '' };
      remplirCaler();
      ouvrirFenetre('mCalerBg');
    };
    window.fermerCaler = function (o) { fermerFenetre('mCalerBg', o); CALER = null; };
    window.choisirCaler = function (type, id) {
      const c = CALER; if (!c) return;
      lireCaler();
      c.choix = { type: type, id: id };
      const conf = P.conf(REGLAGES);
      if (type === 'pose') {
        const ch = ((A_PLANIFIER.filter(function (x) { return x.id === id; })[0]) || {}).chantier || {};
        // L'équipe ENREGISTRÉE si elle existe ; sinon la personne du couloir qu'on vient de
        // cliquer — un geste explicite, visible et modifiable avant de valider.
        c.equipe = ch.equipe || c.qui;
        c.duree = Number(ch.duree_h) || Number(conf.duree_pose_h) || 4;
      } else if (type === 'depannage') {
        c.techs = [c.qui];
        c.duree = Number(conf.duree_depannage_h) || 2;
      }
      remplirCaler();
    };
    window.calerEquipe = function (k) { if (!CALER) return; lireCaler(); CALER.equipe = k; remplirCaler(); };
    window.calerTech = function (p) {
      if (!CALER) return;
      lireCaler();
      const i = CALER.techs.indexOf(p);
      if (i >= 0) CALER.techs.splice(i, 1); else CALER.techs.push(p);
      remplirCaler();
    };
    /** Garde l'heure et la durée tapées avant de redessiner la fenêtre (sinon un clic sur
     *  « Yannick » effacerait « 14:00 »). */
    function lireCaler() {
      if (!CALER) return;
      if (el('cl_heure')) CALER.heure = el('cl_heure').value;
      if (el('cl_duree')) CALER.duree = el('cl_duree').value;
    }
    function remplirCaler() {
      const c = CALER; if (!c) return;
      const nom = SELLER_LABELS[c.qui] || c.qui;
      const conf = P.conf(REGLAGES);
      const L = listesACaler();
      el('mCalerIc').innerHTML = icon('calendar', 16);
      el('mCalerTitre').textContent = 'Libre — ' + nom + ', ' + jourLong(c.date);
      const opt = function (type, id, titre, sous) {
        const on = !!c.choix && c.choix.type === type && c.choix.id === id;
        return '<button type="button" class="cl-opt' + (on ? ' on' : '') + '" onclick="choisirCaler(' + jsAttr(type) + ',' + jsAttr(id) + ')">' +
          '<span class="t">' + (on ? icon('check', 13) : '') + escHtml(titre) + '</span>' + (sous ? '<span class="s">' + escHtml(sous) + '</span>' : '') + '</button>';
      };
      const groupe = function (titre, l) { return l.length ? '<div class="cl-grp">' + escHtml(titre) + '</div>' + l.join('') : ''; };
      let html = '<div class="cl-plage">' + escHtml(nom + ' est libre de ' + c.debut + ' à ' + c.fin + '.') + '</div>' +
        groupe('Poses à planifier — matériel reçu', L.poses.map(function (d) {
          const ch = d.chantier || {};
          return opt('pose', d.id, nomDe(d.client), [(window.SSUI.resumeDevis && window.SSUI.resumeDevis(d)) || '',
            P.fmtDuree(Number(ch.duree_h) || Number(conf.duree_pose_h) || 4), ch.equipe ? EQUIPES[ch.equipe] : 'équipe à choisir'].filter(Boolean).join(' · '));
        })) +
        groupe('Dépannages sans date', L.deps.map(function (d) {
          return opt('depannage', d.id, nomDe(d.client), (window.SSUI.resumeDevis && window.SSUI.resumeDevis(d)) || 'Dépannage');
        })) +
        groupe('Visites à fixer avec le client', L.visites.map(function (r) {
          return opt('visite', r.id, nomDe(r.client), [String(r.projet || '').slice(0, 60), 'ce créneau lui sera proposé'].filter(Boolean).join(' · '));
        }));
      if (!L.poses.length && !L.deps.length && !L.visites.length) {
        html += '<div class="pl-vide" style="margin-top:var(--sp-3)">Rien n’attend de date pour l’instant.</div>';
      }
      if (c.choix && c.choix.type !== 'visite') {
        const pose = c.choix.type === 'pose';
        const quiHtml = pose
          ? Object.keys(EQUIPES).map(function (k) {
              return '<button type="button" class="qui-opt ' + (c.equipe === k ? 'on' : '') + '" onclick="calerEquipe(\'' + k + '\')">' + (c.equipe === k ? icon('check', 13) : '') + escHtml(EQUIPES[k]) + '</button>';
            }).join('')
          : PERSONNES.map(function (p) {
              const on = c.techs.indexOf(p) >= 0;
              return '<button type="button" class="qui-opt ' + (on ? 'on' : '') + '" onclick="calerTech(\'' + p + '\')">' + (on ? icon('check', 13) : '') + escHtml(SELLER_LABELS[p] || p) + '</button>';
            }).join('');
        html += '<div class="cl-detail">' +
          '<div class="field"><label class="label">' + (pose ? 'Qui pose' : 'Qui intervient') + '</label><div class="qui-box">' + quiHtml + '</div></div>' +
          '<div class="m2" style="margin-top:var(--sp-3)">' +
          '<div class="field"><label class="label" for="cl_heure">Heure</label><input class="input" type="time" id="cl_heure" value="' + escHtml(c.heure || '') + '"></div>' +
          '<div class="field"><label class="label" for="cl_duree">Durée (h)</label><input class="input input-num" type="number" min="0.5" step="0.5" id="cl_duree" value="' + escHtml(String(c.duree || '')) + '"></div>' +
          '</div></div>';
      }
      html += '<div class="cl-bloquer"><button type="button" class="btn btn-ghost btn-sm" onclick="calerBloquer()">' + icon('lock', 13) + ' Plutôt bloquer ce temps</button></div>';
      el('mCalerBody').innerHTML = html;
      const btn = el('btnCaler');
      btn.disabled = !c.choix;
      btn.textContent = !c.choix ? 'Choisis ce que tu cales'
        : (c.choix.type === 'visite' ? 'Proposer ce créneau au client' : (c.choix.type === 'pose' ? 'Caler la pose' : 'Caler le dépannage'));
    }
    window.calerBloquer = function () {
      const c = CALER; if (!c) return;
      relaisFenetre('mCalerBg');
      CALER = null;
      ouvrirIndispo({ qui: c.qui, du: c.date, debut: c.debut, fin: c.fin });
    };
    window.validerCaler = async function () {
      const c = CALER; if (!c || !c.choix) return;
      lireCaler();
      if (c.choix.type === 'visite') {
        const dj = P.demiJournees(REGLAGES);
        const moment = P.hhmmMin(c.debut, dj.matin.debut) < dj.matin.fin ? 'matin' : 'aprem';
        SALE.mCalerBg = false;
        allerVers('rdv.html?open=' + encodeURIComponent(c.choix.id) + '&creneau=' + c.date + '&moment=' + moment);
        return;
      }
      const pose = c.choix.type === 'pose', id = c.choix.id;
      const duree = parseFloat(c.duree) || 0;
      if (!duree) { toast('Indique une durée.', 'error'); if (el('cl_duree')) el('cl_duree').focus(); return; }
      if (!pose && !c.techs.length) { toast('Choisis qui intervient.', 'error'); return; }
      const src = ((pose ? A_PLANIFIER : (SOURCES.devis || [])).filter(function (x) { return x.id === id; })[0]) || {};
      const candidat = { id: (pose ? 'pose:' : 'dep:') + id, source: pose ? 'pose' : 'depannage', date: c.date, heure: c.heure || '',
        duree_h: duree, qui: pose ? P.quiDeEquipe(c.equipe) : c.techs.slice(), titre: nomDe(src.client) };
      if (!confirmerMalgre(candidat, 'Caler')) return;
      const btn = el('btnCaler'); btn.disabled = true;
      const fait = await ecrireDevis(id, function (d) {
        if (pose) d.chantier = Object.assign({}, d.chantier || {}, { date_pose: c.date, heure_pose: c.heure || '', duree_h: duree, equipe: c.equipe });
        else d.depannage = Object.assign({}, d.depannage || {}, { date_intervention: c.date, heure: c.heure || '', duree_h: duree, techniciens: techniciensAvec(d, c.techs) });
      }, (pose ? 'Pose calée' : 'Dépannage calé') + ' — ' + jourLong(c.date));
      btn.disabled = false;
      if (!fait) return;
      fermerCaler();
      charger();
    };

    // ── Dates proposées pour chaque chantier à planifier (C) ─────────────────────────────────
    /* Les trois prochaines journées où l'équipe est libre assez longtemps d'une traite
       (SSPlanning.datesPossibles), en écartant celles où la prévision annonce pluie ou grand vent
       chez le client. Au-delà de seize jours la météo est inconnue : la date reste proposée.
       Une équipe pas encore choisie = « à deux » : c'est le cas courant d'une pose, et le
       message de confirmation le dit avant d'écrire quoi que ce soit. */
    function chargerPropositions() {
      A_PLANIFIER.forEach(function (d) {
        const hote = el('prop-' + d.id);
        if (!hote) return;
        const ch = d.chantier || {};
        const qui = ch.equipe ? P.quiDeEquipe(ch.equipe) : PERSONNES.slice();
        const titre = '<span class="pl-prop-t">' + icon('calendar', 12) + ' Dates possibles · ' +
          escHtml(ch.equipe ? EQUIPES[ch.equipe] || ch.equipe : 'à deux, équipe à confirmer') + '</span>';
        if (!qui.length) { hote.innerHTML = titre + '<span class="pl-vide">Sous-traitant : la date se convient avec lui.</span>'; return; }
        const duree = Number(ch.duree_h) || Number(P.conf(REGLAGES).duree_pose_h) || 4;
        const cands = P.datesPossibles(qui, duree, TOUS_EVS, DISPOS, REGLAGES, { limite: 10, horizon_jours: 60 });
        if (!cands.length) { hote.innerHTML = titre + '<span class="pl-vide">Aucune journée assez libre dans les 60 prochains jours.</span>'; return; }
        const adr = (d.client || {}).adresse || {};
        const montrer = function (jours) {
          if (!document.body.contains(hote)) return;   // la page a été redessinée entre-temps
          let ecartees = 0;
          const bons = [];
          cands.forEach(function (c) {
            if (bons.length >= 3) return;
            const w = jours && jours[c.date];
            if (!P.meteoPose(w).ok) { ecartees++; return; }
            bons.push({ c: c, w: w });
          });
          hote.innerHTML = titre + '<div class="pl-pills">' + bons.map(function (b) {
            return '<button type="button" class="pl-pill" onclick="calerProposition(' + jsAttr(d.id) + ',' + jsAttr(b.c.date) + ',' + jsAttr(b.c.debut) + ')" ' +
              'title="' + escHtml('Caler la pose le ' + jourLong(b.c.date) + ' — ' + b.c.libre_h + ' h libres') + '">' +
              escHtml(jourCourt(b.c.date) + (b.c.moment === 'apresmidi' ? ' · après-midi' : '') + (b.w ? ' · ' + meteoCourte(b.w) : '')) + '</button>';
          }).join('') + '</div>' +
            (ecartees ? '<span class="pl-vide">' + ecartees + ' date' + (ecartees > 1 ? 's' : '') + ' écartée' + (ecartees > 1 ? 's' : '') + ' : pluie ou vent annoncés</span>' : '') +
            (!bons.length ? '<span class="pl-vide">Les prochaines dates libres sont toutes annoncées sous la pluie ou le vent.</span>' : '');
        };
        prevision(adr.ville || adr.code_postal ? { ville: adr.ville, cp: adr.code_postal } : null).then(montrer).catch(function () { montrer(null); });
      });
    }
    window.calerProposition = async function (id, date, debut) {
      const d = A_PLANIFIER.filter(function (x) { return x.id === id; })[0];
      if (!d) return;
      const ch = d.chantier || {};
      const equipe = ch.equipe || 'nicolas_yannick';
      const duree = Number(ch.duree_h) || Number(P.conf(REGLAGES).duree_pose_h) || 4;
      // Une pose qui commence en début de journée reste « sans heure » : c'est la convention
      // (SSPlanning.occupation la cale au début de journée).
      const heure = debut === P.minHhmm(P.demiJournees(REGLAGES).matin.debut) ? '' : debut;
      if (!confirm('Caler la pose de ' + nomDe(d.client) + ' le ' + jourLong(date) + (heure ? ' à ' + heure : '') + ' ?\n\n' +
        'Équipe : ' + EQUIPES[equipe] + (ch.equipe ? '' : ' (aucune n’était choisie : la pose est calée à deux)') + '\nDurée : ' + P.fmtDuree(duree))) return;
      const candidat = { id: 'pose:' + id, source: 'pose', date: date, heure: heure, duree_h: duree, qui: P.quiDeEquipe(equipe), titre: nomDe(d.client) };
      if (!confirmerMalgre(candidat, 'Caler')) return;
      const fait = await ecrireDevis(id, function (x) {
        x.chantier = Object.assign({}, x.chantier || {}, { date_pose: date, heure_pose: heure, duree_h: duree, equipe: equipe });
      }, 'Pose calée — ' + jourLong(date));
      if (fait) charger();
    };

    // ── Ajouter à mon agenda (F) ─────────────────────────────────────────────────────────────
    /* Un fichier .ics par rendez-vous : l'agenda du téléphone l'importe. Pour Nicolas, c'est ce qui
       évite de se caler un chantier sur une journée Multimedian. Rien ne sort de l'ERP : le fichier
       est fabriqué ici et donné à l'appareil, aucun service tiers n'est appelé. */
    function telechargerIcs(texte, nom) {
      const url = URL.createObjectURL(new Blob([texte], { type: 'text/calendar;charset=utf-8' }));
      const a = document.createElement('a');
      a.href = url; a.download = nom;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(function () { URL.revokeObjectURL(url); }, 5000);
    }
    function nomFichier(e) {
      const net = String(e.titre || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[^A-Za-z0-9]+/g, '-').replace(/^-|-$/g, '').toLowerCase();
      return 'solariscreen-' + e.date + '-' + (net || 'rendez-vous') + '.ics';
    }
    window.agenda = function (id) {
      const e = TOUS_EVS.filter(function (x) { return x.id === id; })[0];
      if (!e) return;
      telechargerIcs(P.icsDe([e], REGLAGES, { base: new URL('./', location.href).href }), nomFichier(e));
      toast('Fichier agenda prêt — ouvre-le pour l’ajouter à ton agenda', 'ok', 5000);
    };

    // ── Les fenêtres : se fermer sans rien perdre, et « retour » sur téléphone ───────────────
    /* Trois défauts, déjà corrigés ailleurs dans l'ERP et restés ici :
       • un clic sur le fond fermait la fenêtre même quand le geste avait COMMENCÉ dans un champ
         (sélectionner du texte puis relâcher à côté) — la saisie partait avec ;
       • Échap pour refermer le petit calendrier d'un champ date fermait la fenêtre entière ;
       • sur téléphone, « retour » quittait le planning au lieu de fermer la fenêtre ouverte.
       Une fenêtre où l'on a tapé quelque chose demande confirmation avant de se fermer sans
       enregistrer ; les boutons « Annuler », eux, sont un choix et ferment sans rien demander. */
    const FERMER = {
      mIndispoBg: function (o) { window.fermerIndispo(o); },
      mTrameBg: function (o) { window.fermerTrame(o); },
      mEvBg: function (o) { window.fermerEvenement(o); },
      mCalerBg: function (o) { window.fermerCaler(o); },
    };
    const SALE = {};
    const RELAIS = '·relais·';
    let ETAPE = null;     // la fenêtre qui a posé une étape d'historique (téléphone seulement)
    const TEL = function () { return window.matchMedia('(max-width: 900px)').matches; };
    function ouvrirFenetre(id) {
      el(id).classList.add('open');
      SALE[id] = false;
      if (ETAPE === RELAIS) { ETAPE = id; return; }   // une fenêtre en relaie une autre : même étape
      if (TEL() && !ETAPE) { try { history.pushState({ plFenetre: id }, ''); ETAPE = id; } catch (e) {} }
    }
    function fermerFenetre(id, o) {
      el(id).classList.remove('open');
      SALE[id] = false;
      if (ETAPE === id) { ETAPE = null; if (!(o && o.retour)) { try { history.back(); } catch (e) {} } }
    }
    function relaisFenetre(id) {
      el(id).classList.remove('open');
      SALE[id] = false;
      if (ETAPE === id) ETAPE = RELAIS;
    }
    function fermerSiPropre(id) {
      if (SALE[id] && !confirm('Fermer sans enregistrer ?')) return;
      FERMER[id]();
    }
    /** Quitter la page depuis une fenêtre ouverte : l'étape d'historique part AVANT, sinon
     *  « retour » depuis la page suivante ramènerait ici, sur une fenêtre fermée. */
    function allerVers(url) {
      if (ETAPE && ETAPE !== RELAIS) {
        ETAPE = null;
        let parti = false;
        const partir = function () { if (!parti) { parti = true; location.href = url; } };
        window.addEventListener('popstate', partir, { once: true });
        setTimeout(partir, 600);   // filet : un navigateur qui ne renverrait pas l'événement
        try { history.back(); return; } catch (e) {}
      }
      location.href = url;
    }
    window.addEventListener('popstate', function () {
      if (!ETAPE || ETAPE === RELAIS) return;
      const id = ETAPE;
      if (SALE[id] && !confirm('Fermer sans enregistrer ?')) {
        try { history.pushState({ plFenetre: id }, ''); } catch (e) {}
        return;
      }
      ETAPE = null;
      FERMER[id]({ retour: true });
    });
    let FOND = null;
    Object.keys(FERMER).forEach(function (id) {
      // Le fond ne ferme que si le geste y a COMMENCÉ.
      el(id).addEventListener('mousedown', function (ev) { FOND = ev.target === el(id) ? id : null; });
      el(id).addEventListener('click', function (ev) { if (ev.target === el(id) && FOND === id) fermerSiPropre(id); FOND = null; });
      el(id).addEventListener('input', function () { SALE[id] = true; });
    });
    document.addEventListener('keydown', function (ev) {
      if (ev.key !== 'Escape') return;
      const t = ev.target || {};
      // Échap referme d'abord le calendrier ou la liste du champ : on ne ferme pas la fenêtre avec.
      if (t.tagName === 'SELECT' || /^(date|time|datetime-local|month|week)$/.test(t.type || '')) return;
      const ouverte = Object.keys(FERMER).filter(function (id) { return el(id).classList.contains('open'); }).pop();
      if (ouverte) fermerSiPropre(ouverte);
    });

    charger();
  </script>
</body>
