<!DOCTYPE html>
<html lang="fr" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>SolariScreen — Mode Terrain</title>
  <!-- ── Installation sur l'écran d'accueil (Android + iPhone) — aucun service worker ── -->
  <link rel="manifest" href="../manifest.webmanifest">
  <meta name="theme-color" content="#0b1224" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#f4f6fb" media="(prefers-color-scheme: light)">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="SolariScreen">
  <link rel="apple-touch-icon" href="../assets/img/apple-touch-icon.png">
  <link rel="icon" type="image/png" href="../assets/img/logo-solariscreen.png">
  <!-- Ajout à l'écran d'accueil iPhone : ouverture en plein écran, sans barre Safari -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600;700&family=Orbitron:wght@600;800&display=swap" rel="stylesheet">
  <script src="../assets/js/theme.js"></script>
  <link rel="stylesheet" href="../assets/css/tokens.css">
  <link rel="stylesheet" href="../assets/css/theme-dark.css">
  <link rel="stylesheet" href="../assets/css/theme-light.css">
  <link rel="stylesheet" href="../assets/css/base.css">
  <style>
    body { padding-bottom: calc(84px + env(safe-area-inset-bottom)); }
    .container { max-width: 640px; }

    /* Champs ≥16px : évite le zoom auto de Safari iOS au focus d'un input */
    .wiz-screen .input, .wiz-screen .select, .wiz-screen .textarea { font-size: 16px; }

    /* ── Fil d'étapes ── */
    .wiz-steps { display: flex; border: 1px solid var(--border); border-radius: var(--r-md); overflow: hidden; margin-bottom: var(--sp-5); }
    .wiz-step { flex: 1; text-align: center; padding: 0.6rem 0.3rem; font-family: var(--font-mono); font-size: var(--fs-2xs); text-transform: uppercase; letter-spacing: 0.04em; color: var(--text-subtle); background: var(--surface-2); cursor: pointer; border-right: 1px solid var(--border); }
    .wiz-step:last-child { border-right: none; }
    .wiz-step .n { display: inline-grid; place-items: center; width: 16px; height: 16px; border-radius: 50%; border: 1px solid currentColor; margin-right: 0.3rem; font-size: 9px; }
    .wiz-step.active { color: var(--accent); background: color-mix(in srgb, var(--accent) 10%, var(--surface)); }
    .wiz-step.done { color: var(--ok); }

    .wiz-screen { display: none; }
    .wiz-screen.active { display: block; }

    /* ── Barre d'action fixe (bas d'écran, pouce) ── */
    .wiz-bar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 200; display: flex; gap: var(--sp-3); padding: var(--sp-3) var(--sp-4) calc(var(--sp-3) + env(safe-area-inset-bottom)); background: color-mix(in srgb, var(--surface) 94%, transparent); backdrop-filter: blur(12px); border-top: 1px solid var(--border); }
    .wiz-bar .btn { flex: 1; padding: 0.85rem; font-size: var(--fs-sm); }
    .wiz-bar .btn.grow2 { flex: 2; }

    /* ── Sélecteur de type — grosses tuiles tactiles ── */
    .type-tiles { display: grid; grid-template-columns: repeat(2, 1fr); gap: var(--sp-3); }
    .type-tile { display: flex; flex-direction: column; align-items: center; gap: 0.5rem; padding: var(--sp-4) var(--sp-2); border: 1px solid var(--border); border-radius: var(--r-md); background: var(--surface-2); color: var(--text-muted); cursor: pointer; --tick-color: var(--border-strong); user-select: none; }
    .type-tile svg { width: 24px; height: 24px; }
    .type-tile span { font-family: var(--font-mono); font-size: var(--fs-2xs); text-transform: uppercase; letter-spacing: 0.03em; text-align: center; }
    .type-tile.active { border-color: var(--accent); color: var(--accent); background: color-mix(in srgb, var(--accent) 10%, var(--surface)); box-shadow: var(--glow-soft); --tick-color: var(--accent); }

    /* ── Nav ouvertures ── */
    .item-nav { display: flex; align-items: center; gap: var(--sp-3); margin-bottom: var(--sp-3); }
    .item-nav button { width: 38px; height: 38px; flex: none; display: grid; place-items: center; border: 1px solid var(--border-strong); border-radius: var(--r-sm); background: var(--surface-2); color: var(--text); cursor: pointer; }
    .item-nav button:disabled { opacity: 0.3; }
    .item-nav .item-title { flex: 1; text-align: center; font-family: var(--font-display); color: var(--accent); font-size: var(--fs-md); }
    .item-dots { display: flex; justify-content: center; gap: 0.4rem; margin: 0 0 var(--sp-5); flex-wrap: wrap; }
    .item-dot { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; font-family: var(--font-mono); font-size: var(--fs-2xs); border: 1px solid var(--border-strong); background: var(--surface-2); color: var(--text-muted); cursor: pointer; }
    .item-dot.active { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
    .item-dot.add { color: var(--accent-2); border-color: var(--accent-2); border-style: dashed; }

    .field-check-mobile { display: flex; align-items: center; gap: 0.6rem; font-size: var(--fs-sm); color: var(--text-muted); padding: 0.5rem 0; }
    .field-check-mobile input { width: 19px; height: 19px; flex: none; }

    /* ── Bouton photo géant ── */
    .photo-cta { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 0.5rem; width: 100%; padding: var(--sp-5); border: 1px dashed var(--border-strong); border-radius: var(--r-md); background: var(--surface-2); color: var(--text-muted); text-align: center; }
    .photo-cta svg { color: var(--accent-2); }
    .photo-cta span { font-family: var(--font-mono); font-size: var(--fs-xs); text-transform: uppercase; letter-spacing: 0.04em; }
    .photo-grid { display: flex; flex-wrap: wrap; gap: var(--sp-2); margin-top: var(--sp-3); }
    .photo-thumb { position: relative; width: 74px; height: 74px; border-radius: var(--r-sm); overflow: hidden; border: 1px solid var(--border-strong); }
    .photo-thumb img { width: 100%; height: 100%; object-fit: cover; }
    .photo-thumb button { position: absolute; top: 2px; right: 2px; width: 20px; height: 20px; border: none; border-radius: 50%; background: var(--danger); color: #fff; font-size: 12px; line-height: 1; }

    /* ── Recherche / sélection client ── */
    .client-hit { display: flex; align-items: center; gap: var(--sp-3); padding: var(--sp-3); border: 1px solid var(--border); border-radius: var(--r-sm); margin-bottom: var(--sp-2); cursor: pointer; }
    .client-hit:active { background: var(--surface-2); }
    .client-hit .avatar { width: 38px; height: 38px; flex: none; border-radius: 50%; display: grid; place-items: center; font-weight: 700; font-size: var(--fs-xs); background: color-mix(in srgb, var(--accent) 18%, transparent); color: var(--accent); }
    .client-hit .ci-main { min-width: 0; flex: 1; }
    .client-hit .ci-name { font-weight: 600; }
    .client-hit .ci-sub { font-size: var(--fs-2xs); color: var(--text-subtle); font-family: var(--font-mono); }

    .success-hero { text-align: center; padding: var(--sp-7) var(--sp-4); }
    .success-hero .ico { width: 64px; height: 64px; margin: 0 auto var(--sp-4); border-radius: 50%; border: 1px solid var(--ok); color: var(--ok); display: grid; place-items: center; box-shadow: 0 0 24px color-mix(in srgb, var(--ok) 40%, transparent); }
    .success-hero h2 { font-family: var(--font-display); color: var(--text); margin-bottom: var(--sp-2); }

    /* Réutilise le style du configurateur Coolscreen 8 du simulateur desktop */
    .cs8-block { border: 1px dashed var(--accent-3); border-radius: var(--r-md); padding: var(--sp-4); background: color-mix(in srgb, var(--accent-3) 6%, transparent); }
    .cs8-head { font-family: var(--font-display); font-size: var(--fs-xs); text-transform: uppercase; letter-spacing: 0.05em; color: var(--accent-3); margin-bottom: var(--sp-3); display: flex; align-items: center; gap: var(--sp-2); }
    .field-readonly { opacity: 0.7; }

    /* ── Bandeaux d'état du Mode Terrain (saisie retrouvée · envois en attente) ──
       Placés tout en haut : sur le terrain, ces deux informations priment sur le reste. */
    #terrEtat { display: flex; flex-direction: column; gap: var(--sp-2); margin-bottom: var(--sp-4); }
    .terr-banner { display: flex; align-items: center; gap: var(--sp-2); flex-wrap: wrap;
      padding: var(--sp-3); border-radius: var(--r-sm); font-size: var(--fs-sm); line-height: 1.45;
      border: 1px solid var(--bc); background: color-mix(in srgb, var(--bc) 12%, transparent); }
    .terr-banner span { flex: 1; min-width: 180px; }
    .terr-banner.brouillon { --bc: var(--accent); }
    .terr-banner.attente   { --bc: var(--warn); }
    .terr-banner svg { flex: none; color: var(--bc); }
  </style>
</head>
<body>
  <div class="fx-grid"></div>

  <header class="app-header">
    <div class="brand">
      <span class="brand-logo"><img src="../assets/img/logo-solariscreen.png" alt="" onerror="this.style.display='none'"></span>
      <div>
        <h1>SOLARISCREEN</h1>
        <div class="module">Mode Terrain</div>
      </div>
    </div>
    <div class="header-actions">
      <span id="quickNav"></span>
      <span id="themeToggle"></span>
      <a class="btn btn-ghost btn-sm" href="dashboard.html" aria-label="Retour au dashboard" title="Dashboard">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
      </a>
    </div>
  </header>

  <main class="container">
    <div class="wiz-steps">
      <div class="wiz-step" data-goto="client" onclick="goStep('client')"><span class="n">1</span>Client</div>
      <div class="wiz-step" data-goto="items" onclick="goStep('items')"><span class="n">2</span>Ouvertures</div>
      <div class="wiz-step" data-goto="recap" onclick="goStep('recap')"><span class="n">3</span>Récap</div>
    </div>

    <!-- ═══ ÉTAPE 1 : CLIENT ═══ -->
    <div class="wiz-screen" data-step="client">
      <section class="section ticked">
        <div class="section-head"><span class="section-title">Client</span></div>
        <div class="section-body">
          <div class="field">
            <label class="label" for="clientSearch">Rechercher un client existant</label>
            <input class="input" id="clientSearch" placeholder="Nom, prénom, téléphone…" oninput="renderClientHits()" autocomplete="off">
          </div>
          <div id="clientHits" class="mt-2"></div>

          <div class="grid grid-2 mt-4">
            <div class="field"><label class="label required" for="tPrenom">Prénom</label><input class="input" id="tPrenom"></div>
            <div class="field"><label class="label required" for="tNom">Nom</label><input class="input" id="tNom"></div>
            <div class="field"><label class="label" for="tTel">Téléphone(s)</label><input class="input" id="tTel" type="tel" placeholder="0475 12 34 56, 02 345 67 89"></div>
            <div class="field"><label class="label" for="tEmail">Email(s)</label><input class="input" id="tEmail" type="email" multiple placeholder="email@exemple.be, autre@exemple.be"></div>
          </div>
          <div class="grid grid-2 mt-4">
            <div class="field col-full"><label class="label" for="tRue">Rue & numéro</label><input class="input" id="tRue" placeholder="Rue"></div>
            <div class="field"><label class="label" for="tNumero">N°</label><input class="input" id="tNumero"></div>
            <div class="field"><label class="label" for="tCp">Code postal</label><input class="input" id="tCp"></div>
            <div class="field col-full"><label class="label" for="tVille">Ville</label><input class="input" id="tVille"></div>
          </div>
        </div>
      </section>
    </div>

    <!-- ═══ ÉTAPE 2 : OUVERTURES ═══ -->
    <div class="wiz-screen" data-step="items" id="itemsBody"></div>

    <!-- ═══ ÉTAPE 3 : RÉCAP ═══ -->
    <div class="wiz-screen" data-step="recap">
      <section class="section ticked" style="--tick-color:var(--accent-2);">
        <div class="section-head"><span class="section-title">Récapitulatif</span></div>
        <div class="section-body">
          <div id="trSummary" class="text-muted" style="font-size:var(--fs-sm);margin-bottom:var(--sp-4);"></div>
          <div class="field">
            <label class="label" id="tvaGroupLabelT">TVA</label>
            <div class="segmented" role="radiogroup" aria-labelledby="tvaGroupLabelT">
              <input type="radio" name="tva_pct_t" id="terrTva6" value="6" checked onchange="recalcRecap()"><label for="terrTva6">6 % (rénovation)</label>
              <input type="radio" name="tva_pct_t" id="terrTva21" value="21" onchange="recalcRecap()"><label for="terrTva21">21 %</label>
            </div>
          </div>
          <div class="field mt-4"><label class="label" for="terrAcompte">Acompte</label><div class="input-unit"><input class="input input-num" id="terrAcompte" type="number" min="0" max="100" value="50" oninput="recalcRecap()"><span class="unit">%</span></div></div>

          <p class="text-muted mt-4" style="font-size:var(--fs-2xs);">Pas de prix saisi sur le terrain — le chiffrage complet (catalogue, marges, installation) se fait au bureau via le simulateur, à partir du catalogue Harol.</p>
        </div>
      </section>
    </div>

    <!-- ═══ ÉCRAN FINAL ═══ -->
    <div class="wiz-screen" data-step="done">
      <div class="success-hero">
        <div class="ico"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg></div>
        <h2>Devis enregistré</h2>
        <p class="text-muted" id="doneSummary">—</p>
        <div class="stack mt-5" style="max-width:320px;margin:0 auto;">
          <button class="btn btn-primary" onclick="location.href='vue.html?id='+state.savedId">Voir la fiche</button>
          <button class="btn btn-ghost" onclick="resetWizard()">+ Nouveau devis (autre client)</button>
          <a class="btn btn-ghost" href="dashboard.html">Retour au dashboard</a>
        </div>
      </div>
    </div>

    <datalist id="dl-couleurs"></datalist>
    <datalist id="dl-toiles"></datalist>
    <datalist id="dl-caisson-forme"></datalist>
    <datalist id="dl-emplacements"></datalist>
    <datalist id="dl-etages"></datalist>
  </main>

  <div class="wiz-bar" id="wizBar"></div>

  <!-- ════════ LOGIQUE ════════ -->
  <script src="../assets/js/ui.js"></script>
  <script src="../assets/js/nav.js"></script>
  <script src="../assets/js/calc.js"></script>
  <script src="../assets/js/products.js"></script>
  <script src="../assets/js/api.js"></script>
  <script src="../assets/js/postal-be.js"></script>
  <script>
    const { computeDevis } = window.SSCalc;
    const SS = window.SS;
    const { mountThemeToggle } = window.SSTheme;
    const { fmtEur, el, setText, setVal, getVal, getNum, toast, generateDevisId, qp, icon } = window.SSUI;
    mountThemeToggle(document.getElementById('themeToggle'));
    window.SSNav.mount(document.getElementById('quickNav'));

    // ── Avertissement si on quitte la page avec des modifications non enregistrées ──
    let dirty = false;
    window.markDirty = () => { dirty = true; brouillonPlusTard(); };
    document.addEventListener('input', window.markDirty);
    document.addEventListener('change', window.markDirty);
    window.addEventListener('beforeunload', (e) => {
      if (!dirty) return;
      e.preventDefault();
      e.returnValue = '';
    });

    /* ═══════════════════════════════════════════════════════════════════════════════════════
       BROUILLON AUTOMATIQUE
       ─────────────────────────────────────────────────────────────────────────────────────
       Chez un client, la saisie ne vivait QUE dans la mémoire de la page. Or sur iPhone, aller
       prendre une photo puis revenir suffit à faire recharger l'onglet : toute la visite était
       perdue, et l'avertissement « quitter la page » n'y peut rien — le système ne le demande
       pas quand c'est LUI qui ferme. On écrit donc en continu dans le téléphone.
       ⚠️ `pagehide` et `visibilitychange` sont les SEULS moments fiables sur iOS : `beforeunload`
       n'est pas déclenché quand Safari récupère de la mémoire.
       ═══════════════════════════════════════════════════════════════════════════════════════ */
    const LS_BROUILLON = 'ss_terrain_brouillon';
    let brouillonTimer = null, brouillonAlerteQuota = false;
    function brouillonPlusTard() {
      clearTimeout(brouillonTimer);
      brouillonTimer = setTimeout(ecrireBrouillon, 700);   // on regroupe les frappes
    }
    function instantane() {
      // On lit les cartes affichées pour ne pas perdre ce qui vient d'être tapé et pas encore collecté.
      try { const c = document.querySelector('.item-card'); if (c && state.items[currentItemIdx]) collectItem(state.items[currentItemIdx], c); } catch (e) {}
      return {
        v: 1, quand: new Date().toISOString(), etape: step, itemIdx: currentItemIdx,
        state: { id: state.id, version: state.version, date_creation: state.date_creation, statut: state.statut,
                 items: state.items, isExisting: !!state.isExisting, loadedDateModification: state.loadedDateModification || null },
        client: collectClientFields(),
        params: {
          tva: document.querySelector('input[name="tva_pct_t"]:checked')?.value || '6',
          acompte: getVal('terrAcompte'), surplus: getVal('terrSurplus'),
        },
      };
    }
    function ecrireBrouillon() {
      if (!dirty) return;
      const b = instantane();
      try {
        localStorage.setItem(LS_BROUILLON, JSON.stringify(b));
      } catch (e) {
        // Quota dépassé : ce sont les photos en base64 (une photo non encore envoyée pèse lourd).
        // On sauve alors la saisie SANS les images — mieux vaut perdre des vignettes que le devis.
        try {
          const allege = JSON.parse(JSON.stringify(b));
          allege.state.items.forEach(i => { i.photos = (i.photos || []).filter(p => String(p).slice(0, 5) !== 'data:'); });
          allege.photosAllegees = true;
          localStorage.setItem(LS_BROUILLON, JSON.stringify(allege));
          if (!brouillonAlerteQuota) { brouillonAlerteQuota = true; toast('Mémoire du téléphone pleine : le brouillon est gardé sans les photos non encore envoyées.', 'warn', 7000); }
        } catch (e2) { console.warn('[terrain] brouillon impossible:', e2.message); }
      }
    }
    function effacerBrouillon() { try { localStorage.removeItem(LS_BROUILLON); } catch (e) {} }
    // Moments critiques : l'app passe en arrière-plan ou la page se ferme.
    document.addEventListener('visibilitychange', () => { if (document.hidden) ecrireBrouillon(); });
    window.addEventListener('pagehide', ecrireBrouillon);

    const {
      ITEM_TYPES, EMPLACEMENTS_SUGGESTIONS, ETAGES_SUGGESTIONS, MOTEURS, COULEURS_RAL, TOILES_CATALOGUE,
      CS8_VARIANTES, CS8_COMBINAISONS, CS8_COLLECTIONS, CS8_MOTEURS,
      CS8_CAISSON_FORMES, CS8_COLMATAGE, caissonMesuresFor,
      TS_SPECS, tsMoteursFor, tsEclairageFor, TS_MANOEUVRES, TS_MOTEUR_SORTES, TS_CABLE_LONGUEURS, TS_CABLE_COULEURS, TS_COLLECTIONS,
      VR_CAISSONS, VR_MOTEURS, VR_COULEURS_LAMES, VR_LAMES, vrHauteurMaxFor,
    } = window.SSProducts;

    const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
    const keyOf = (prenom, nom) => (String(nom || '').trim() + '|' + String(prenom || '').trim()).toLowerCase().replace(/\s+/g, ' ');

    const state = {
      id: qp('id') || generateDevisId(),
      version: '3.0',
      date_creation: new Date().toISOString().slice(0, 10),
      statut: 'brouillon',
      items: [],
      savedId: null,
    };

    const STEPS = ['client', 'items', 'recap'];
    let step = 'client';
    let currentItemIdx = 0;
    let _uid = 0;
    let DIRECTORY = [];

    // ── RÉPERTOIRE CLIENT (fiches CRM + clients déjà présents sur d'anciens devis) ──
    async function buildClientDirectory() {
      const [clients, devisList] = await Promise.all([SS.listClients(), SS.listDevis()]);
      const map = new Map();
      (devisList || []).forEach(d => {
        const prenom = d.client_prenom || (d.client && d.client.prenom) || '';
        const nom = d.client_nom || (d.client && d.client.nom) || '';
        if (!prenom && !nom) return;
        const key = keyOf(prenom, nom);
        if (!map.has(key)) map.set(key, { key, prenom, nom, telephone: '', email: '', adresse: {} });
        const e = map.get(key);
        const c = d.client || {};
        if (c.telephone && !e.telephone) e.telephone = c.telephone;
        if (c.email && !e.email) e.email = c.email;
        if (c.adresse && !e.adresse.rue && !e.adresse.ville && (c.adresse.rue || c.adresse.ville)) e.adresse = c.adresse;
      });
      (clients || []).forEach(o => {
        const e = map.get(o.key) || { key: o.key, prenom: o.prenom, nom: o.nom, telephone: '', email: '', adresse: {} };
        e.prenom = o.prenom || e.prenom; e.nom = o.nom || e.nom;
        e.telephone = o.telephone || e.telephone; e.email = o.email || e.email;
        if (o.adresse && (o.adresse.rue || o.adresse.ville)) e.adresse = o.adresse;
        map.set(o.key, e);
      });
      return [...map.values()];
    }

    window.renderClientHits = function () {
      const q = getVal('clientSearch').trim().toLowerCase();
      const host = el('clientHits');
      if (!q) { host.innerHTML = ''; return; }
      const rows = DIRECTORY.filter(c => `${c.prenom} ${c.nom} ${c.telephone} ${c.email}`.toLowerCase().includes(q)).slice(0, 6);
      host.innerHTML = rows.length ? rows.map(c => `
        <div class="client-hit" onclick="pickClient(${SSUI.jsAttr(c.key)})">
          <div class="avatar">${esc(((c.prenom[0] || '') + (c.nom[0] || '')).toUpperCase())}</div>
          <div class="ci-main"><div class="ci-name">${esc(c.prenom)} ${esc(c.nom)}</div><div class="ci-sub">${esc(c.telephone || c.email || '—')}</div></div>

          <div class="field"><label class="label">N° de toile</label><input class="input" data-f="toile_num" value="${item.toile_num || ''}" placeholder="Ex: 0101"></div>
          <div class="field"><label class="label">Couleur toile</label><input class="input" data-f="toile_couleur" value="${item.toile_couleur || ''}" placeholder="Ex: grey / grey"></div>
          <div class="field"><label class="label">Caisson — forme</label><input class="input" data-f="caisson_forme" list="dl-caisson-forme" value="${item.caisson_forme || ''}" placeholder="Ex: Carré"></div>

          <div class="field"><label class="label">Couleur coulisses (RAL)</label><input class="input" data-f="couleur_coulisses" list="dl-couleurs" value="${item.couleur_coulisses || ''}" placeholder="Ex: idem caisson"></div>

        <div class="stack" style="gap:0;margin-top:var(--sp-2);">
          <label class="field-check-mobile"><input type="checkbox" data-f="emetteur" ${item.emetteur ? 'checked' : ''}> Émetteur inclus</label>
          <label class="field-check-mobile"><input type="checkbox" data-f="panneau_solaire_separe" ${item.panneau_solaire_separe ? 'checked' : ''}> Panneau solaire séparé</label>
          <label class="field-check-mobile"><input type="checkbox" data-f="allongement_caisson" ${item.allongement_caisson ? 'checked' : ''}> Allongement caisson</label>

        </div>

    // Bloc de configuration détaillé Tente solaire (fiches produit Harol BX270/LUX, réf. 03/2026)
    function tenteSolaireBlockHtml(item) {
      if (item.type !== 'tente_solaire') return '';

      const opt = (arr, cur) => arr.map(v => `<option value="${v}" ${cur === v ? 'selected' : ''}>${v}</option>`).join('');

      return `
      <div class="cs8-block mt-4">

          <div class="field"><label class="label">Câble — longueur</label><select class="select" data-f="cable_longueur"><option value="">—</option>${opt(TS_CABLE_LONGUEURS, item.cable_longueur)}</select></div>
          <div class="field"><label class="label">Câble — couleur</label><select class="select" data-f="cable_couleur"><option value="">—</option>${opt(TS_CABLE_COULEURS, item.cable_couleur)}</select></div>
          <div class="field col-full"><label class="label">Collection toile</label><select class="select" data-f="collection"><option value="">—</option>${opt(TS_COLLECTIONS, item.collection)}</select></div>
          <div class="field col-full"><label class="label">Couleur toile</label><input class="input" data-f="toile_couleur" value="${item.toile_couleur || ''}" placeholder="Ex: gris"></div>

        </div>
        <div class="stack" style="gap:0;margin-top:var(--sp-2);">
          <label class="field-check-mobile"><input type="checkbox" data-f="telecommande" ${item.telecommande ? 'checked' : ''}> Avec commande à distance</label>
          <label class="field-check-mobile"><input type="checkbox" data-f="couple" ${item.couple ? 'checked' : ''}> Couplé (raccord jusqu'à 12 m)</label>
          <label class="field-check-mobile"><input type="checkbox" data-f="lambrequin_fixe" ${item.lambrequin_fixe ? 'checked' : ''}> Lambrequin fixe</label>
          ${specs.lambrequin_vario ? `<label class="field-check-mobile"><input type="checkbox" data-f="lambrequin_vario" ${item.lambrequin_vario ? 'checked' : ''}> Lambrequin Vario (moteur io)</label>` : ''}
          <label class="field-check-mobile"><input type="checkbox" data-f="detecteur" ${item.detecteur ? 'checked' : ''}> Détecteur soleil/vent/pluie</label>
          <label class="field-check-mobile"><input type="checkbox" data-f="spots_storelight" ${item.spots_storelight ? 'checked' : ''}> Spots LED Storelight</label>
          <label class="field-check-mobile"><input type="checkbox" data-f="chauffage_storelight" ${item.chauffage_storelight ? 'checked' : ''}> Chauffage Storelight</label>
        </div>
      </div>`;
    }
    window.onTSModeleChange = function (id) {
      const it = state.items.find(i => i._id === id);
      const card = document.querySelector(`[data-id="${id}"]`);
      if (!it || !card) return;
      collectItem(it, card);
      renderItemsStep();
    };

    // Bloc de configuration détaillé VR150 Pure (fiche prix Harol 06/2026)
    function voletBlockHtml(item) {
      if (item.type !== 'volet_roulant') return '';
      const opt = (arr, cur) => arr.map(v => `<option value="${v}" ${cur === v ? 'selected' : ''}>${v}</option>`).join('');
      const caissonOpts = VR_CAISSONS.map(c => `<option value="${c.taille}" ${item.caisson_mesure === c.taille ? 'selected' : ''}>${c.taille} mm (max. ${c.hauteur_max} mm)</option>`).join('');
      const hmax = vrHauteurMaxFor(item.caisson_mesure);
      return `
      <div class="cs8-block mt-4">
        <div class="cs8-head">${icon('sliders', 14)} Configuration VR150 Pure</div>
        <div class="grid grid-2 mt-3">
          <div class="field"><label class="label">Type de lame</label><select class="select" data-f="lame_type"><option value="">—</option>${opt(VR_LAMES, item.lame_type)}</select></div>
          <div class="field"><label class="label">Caisson (mm)</label><select class="select" data-f="caisson_mesure"><option value="">—</option>${caissonOpts}</select></div>
          <div class="field"><label class="label">Moteur</label><select class="select" data-f="moteur"><option value="">—</option>${opt(VR_MOTEURS, item.moteur)}</select></div>
          <div class="field col-full"><label class="label">Couleur lames (RAL)</label><select class="select" data-f="couleur_lame"><option value="">—</option>${opt(VR_COULEURS_LAMES, item.couleur_lame)}</select></div>
        </div>
        <div class="stack" style="gap:0;margin-top:var(--sp-2);">
          <label class="field-check-mobile"><input type="checkbox" data-f="borstels" ${item.borstels ? 'checked' : ''}> Brosses (au lieu de joints)</label>
        </div>
        ${hmax ? `<p class="text-muted mt-2" style="font-size:var(--fs-2xs);">Hauteur max. (axe Ø60 mm) : ${hmax} mm — largeur max. 4000 mm.</p>` : ''}
      </div>`;
    }

    window.onCS8VarianteChange = function (id) {
      const sel = el('cms-' + id); if (!sel) return;
      const variante = document.querySelector(`[data-id="${id}"] [data-f="variante"]`)?.value;
      const opt = (arr, cur) => arr.map(v => `<option value="${v}" ${cur === v ? 'selected' : ''}>${v}</option>`).join('');
      sel.innerHTML = '<option value="">—</option>' + opt(caissonMesuresFor(variante), sel.value);
    };

    const TYPE_ICONS = { screen: 'window', volet_roulant: 'list', tablier_volet: 'grid', tente_solaire: 'sliders' };
    function itemCardHtml(item) {
      const tiles = Object.entries(ITEM_TYPES).map(([v, l]) => `
        <div class="type-tile ticked ${item.type === v ? 'active' : ''}" onclick="setItemType('${item._id}','${v}')">
          ${icon(TYPE_ICONS[v] || 'grid', 22)}<span>${l}</span>
        </div>`).join('');
      const photos = (item.photos || []).map((p, pi) => `<div class="photo-thumb"><img src="${p}" alt=""><button onclick="removePhoto('${item._id}',${pi})">✕</button></div>`).join('');
      return `
      <div class="item-card ticked" data-id="${item._id}" style="border:1px solid var(--border);border-radius:var(--r-md);background:var(--surface-2);padding:var(--sp-4);">
        <div class="field"><label class="label">Type d'ouverture</label><div class="type-tiles">${tiles}</div></div>
        <div class="grid grid-2 mt-4">${modeleFieldHtml(item)}${moteurFieldHtml(item)}</div>
        <div class="grid grid-2 mt-3">
          <div class="field"><label class="label">Largeur (mm)</label><input class="input input-num" inputmode="numeric" data-f="largeur" value="${item.largeur || ''}"></div>
          ${item.type === 'tente_solaire'
            // Tente solaire = largeur × PROJECTION (la hauteur n'a pas de sens). Le champ est
            // remonté ici et retiré du bloc de configuration (un seul input data-f="projection").
            ? `<div class="field"><label class="label">Projection (mm)</label><input class="input input-num" inputmode="numeric" data-f="projection" value="${item.projection || ''}" placeholder="${(TS_SPECS[item.modele] || {}).projection_max ? 'Max ' + TS_SPECS[item.modele].projection_max : ''}"></div>`
            : `<div class="field"><label class="label">Hauteur (mm)</label><input class="input input-num" inputmode="numeric" data-f="hauteur" value="${item.hauteur || ''}"></div>`}
          <div class="field"><label class="label">Emplacement</label><input class="input" data-f="emplacement" list="dl-emplacements" value="${item.emplacement || ''}" placeholder="Ex: Salon"></div>
          <div class="field"><label class="label">Étage</label><input class="input" data-f="etage" list="dl-etages" value="${item.etage || ''}" placeholder="RDC"></div>
        </div>
        ${item.type !== 'screen' ? `
        <div class="grid grid-2 mt-3">
          <div class="field"><label class="label">Couleur (RAL)</label><input class="input" data-f="couleur" list="dl-couleurs" value="${item.couleur || ''}" placeholder="Ex: 7016"></div>
          ${!['volet_roulant', 'tente_solaire'].includes(item.type)
            // Pas de toile en texte libre pour les tentes : « Collection toile » (liste fermée)
            // est déjà dans leur bloc de configuration.
            ? `<div class="field"><label class="label">Toile / finition</label><input class="input" data-f="toile" list="dl-toiles" value="${item.toile || ''}" placeholder="Ex: Soltis Horizon 86"></div>` : ''}
        </div>` : ''}
        ${coolscreenBlockHtml(item)}
        ${tenteSolaireBlockHtml(item)}
        ${voletBlockHtml(item)}
        <div class="field mt-3"><label class="label">Quantité</label><input class="input input-num" type="number" min="1" step="1" data-f="quantite" value="${item.quantite || 1}" style="max-width:120px;"></div>
        <div class="field mt-3"><label class="label">Notes</label><input class="input" data-f="notes" value="${item.notes || ''}" placeholder="Détail utile pour le bureau…"></div>
        <div class="field mt-4">
          <label class="label">Photos</label>
          <div class="photo-grid">${photos}</div>
          <label class="photo-cta mt-3" style="cursor:pointer;display:flex;">
            ${icon('camera', 26)}<span>Prendre une photo</span>
            <input type="file" accept="image/*" capture="environment" multiple hidden onchange="addPhotos('${item._id}', this)">
          </label>
        </div>
        <button class="btn btn-danger mt-4" style="width:100%;" onclick="removeCurrentItem()">${icon('trash', 14)} Retirer cette ouverture</button>
      </div>`;
    }

    function addItemSilent(data = {}) {
      const item = { _id: 'it' + (++_uid), type: 'screen', quantite: 1, photos: [], ...data };
      if (!item.photos) item.photos = [];
      state.items.push(item);
      return item;
    }
    window.setItemType = function (id, type) {
      const it = state.items.find(i => i._id === id); if (!it) return;
      markDirty();
      it.type = type; it.modele = '';
      renderItemsStep();
    };
    window.goToItem = function (i) { if (i < 0 || i >= state.items.length) return; currentItemIdx = i; renderItemsStep(); };
    window.addItemAndGo = function () { markDirty(); addItemSilent(); currentItemIdx = state.items.length - 1; renderItemsStep(); };
    window.removeCurrentItem = function () {
      if (state.items.length <= 1) { toast('Il faut au moins une ouverture.', 'warn'); return; }
      markDirty();
      state.items.splice(currentItemIdx, 1);
      if (currentItemIdx > 0) currentItemIdx--;
      renderItemsStep();
    };
    window.addPhotos = function (id, input) {
      const it = state.items.find(i => i._id === id); if (!it) return;
      [...input.files].forEach(file => {
        window.SSUI.compressAndUploadPhoto(file, state.id).then(url => { markDirty(); it.photos.push(url); renderItemsStep(); })
          .catch(() => toast('Photo illisible, réessaie.', 'warn'));
      });
    };
    window.removePhoto = function (id, pi) { markDirty(); const it = state.items.find(i => i._id === id); if (it) { it.photos.splice(pi, 1); renderItemsStep(); } };

    function collectItem(it, root) {
      root.querySelectorAll('[data-f]').forEach(input => {
        const f = input.dataset.f;
        if (input.type === 'checkbox') it[f] = input.checked;
        else if (['quantite', 'largeur', 'hauteur', 'prix_catalogue_ht', 'projection'].includes(f)) it[f] = parseFloat(input.value) || 0;
        else it[f] = input.value;
      });
    }
    function bindItemCard(item, root) {
      root.querySelectorAll('[data-f]').forEach(input => {
        input.addEventListener('input', () => collectItem(item, root));
        input.addEventListener('change', () => collectItem(item, root));
      });
    }

    function renderItemsStep() {
      if (state.items.length === 0) addItemSilent();
      if (currentItemIdx >= state.items.length) currentItemIdx = state.items.length - 1;
      const item = state.items[currentItemIdx];
      const c = el('itemsBody');
      const dots = state.items.map((it, i) => `<div class="item-dot ${i === currentItemIdx ? 'active' : ''}" onclick="goToItem(${i})">${i + 1}</div>`).join('')
        + `<div class="item-dot add" onclick="addItemAndGo()">${icon('plus', 13)}</div>`;
      c.innerHTML = `
        <div class="item-nav">
          <button onclick="goToItem(${currentItemIdx - 1})" ${currentItemIdx === 0 ? 'disabled' : ''} aria-label="Ouverture précédente">${icon('arrowleft', 16)}</button>
          <div class="item-title">Ouverture ${currentItemIdx + 1} / ${state.items.length}</div>
          <button onclick="goToItem(${currentItemIdx + 1})" ${currentItemIdx === state.items.length - 1 ? 'disabled' : ''} aria-label="Ouverture suivante" style="transform:scaleX(-1);">${icon('arrowleft', 16)}</button>
        </div>
        <div class="item-dots">${dots}</div>
        ${itemCardHtml(item)}`;
      bindItemCard(item, c);
    }

    // ── RÉCAP ──
    function openingsCount() { return state.items.reduce((s, i) => s + (i.quantite || 1), 0); }
    function buildInput() {
      const n = openingsCount();
      return {
        items: state.items.map(i => ({ quantite: i.quantite, prix_catalogue_ht: i.prix_catalogue_ht, largeur: i.largeur, hauteur: i.hauteur })),
        sellers: { principal: 'nicolas', nicolas_pct: 18, yannick_pct: 5 },
        installation: { install_gross: 280, tech1_gross: 125, tech2_gross: 125, tools_gross: 30, install_qty: n, tech1_qty: n, tech2_qty: n, tools_qty: n },
        extras: [],
        tva_pct: parseInt(document.querySelector('input[name="tva_pct_t"]:checked')?.value || 6),
        acompte_pct: getNum('terrAcompte', 50),
        surplus_difficulte: getNum('terrSurplus', 0),
      };
    }
    window.recalcRecap = function () {
      const input = buildInput();
      const c = computeDevis(input);
      const counts = {};
      state.items.forEach(it => { counts[it.type] = (counts[it.type] || 0) + (it.quantite || 1); });
      const parts = Object.entries(counts).map(([t, n]) => `${n}× ${ITEM_TYPES[t] || t}`);
      const prenom = getVal('tPrenom').trim(), nom = getVal('tNom').trim();
      const clientTxt = (prenom || nom) ? `${prenom} ${nom}`.trim() : 'ce client';
      setText('trSummary', `${parts.join(' · ') || 'Aucune ouverture'} pour ${clientTxt}.`);
      return c;
    };

    // ── ÉTAPES ──
    function renderBar() {
      const bar = el('wizBar');
      if (step === 'client') {
        bar.innerHTML = `<button class="btn btn-primary grow2" onclick="goStep('items')">Continuer → Ouvertures</button>`;
      } else if (step === 'items') {
        bar.innerHTML = `<button class="btn btn-ghost" onclick="goStep('client')">${icon('arrowleft', 14)} Client</button><button class="btn btn-primary grow2" onclick="goStep('recap')">Voir le récap →</button>`;
      } else if (step === 'recap') {
        bar.innerHTML = `<button class="btn btn-ghost" onclick="goStep('items')">${icon('arrowleft', 14)} Ouvertures</button><button class="btn btn-primary grow2" onclick="finalizeSave()">${icon('save', 14)} Enregistrer</button>`;
      } else {
        bar.innerHTML = '';
      }
    }
    window.goStep = function (s) {
      if (!STEPS.includes(s)) s = 'done';
      step = s;
      document.querySelectorAll('.wiz-screen').forEach(sc => sc.classList.toggle('active', sc.dataset.step === s));
      document.querySelectorAll('.wiz-step').forEach(t => {
        t.classList.toggle('active', t.dataset.goto === s);
        t.classList.toggle('done', STEPS.indexOf(t.dataset.goto) < STEPS.indexOf(s));
      });
      if (s === 'items') renderItemsStep();
      if (s === 'recap') recalcRecap();
      renderBar();
      window.scrollTo(0, 0);
    };

    // ── ENREGISTREMENT ──
    window.finalizeSave = async function () {
      const client = collectClientFields();
      if (!client.prenom || !client.nom) { toast('Renseigne le prénom et le nom du client.', 'warn'); goStep('client'); return; }
      if (state.items.length === 0) { toast('Ajoute au moins une ouverture.', 'warn'); goStep('items'); return; }
      const input = buildInput();
      const c = computeDevis(input);
      const devis = {
        id: state.id, version: state.version,
        date_creation: state.date_creation,
        date_modification: new Date().toISOString(),
        statut: state.statut,
        client,
        items: state.items.map(({ _id, ...rest }) => rest),
        calculs: c,
        pricing_v2: {
          tva_pct: input.tva_pct, acompte_pct: input.acompte_pct, surplus_difficulte: input.surplus_difficulte,
          note: 'Créé via Mode Terrain',
          material: { sellers: { mode: 'fixed', principal: 'nicolas', nicolas_pct: c.nicolas_pct, yannick_pct: c.yannick_pct } },
          installation: { per_opening: input.installation, install_qty: input.installation.install_qty, tech1_qty: input.installation.tech1_qty, tech2_qty: input.installation.tech2_qty, tools_qty: input.installation.tools_qty },
          extras: c.extra_lines,
        },
      };
      // Détection de conflit : protège surtout la ré-édition d'un devis existant (?id=) sur le terrain
      // pendant que l'autre le modifie aussi au bureau.
      const finish = async (force) => {
        const res = await SS.saveDevis(devis, force ? { force: true } : { expectedDateModification: state.isExisting ? state.loadedDateModification : undefined });
        if (res.conflict) { window.SSUI.showSaveConflict(() => finish(true)); return; }
        // Échec réel : on reste sur l'écran de saisie (dirty inchangé) pour ne pas perdre la visite.
        if (res.ok === false) { toast(res.error || 'Devis NON enregistré — ne quitte pas la page, réessaie.', 'error', 9000); return; }

        // Fiche CRM : mise à jour des coordonnées sans écraser notes/tags existants
        const key = keyOf(client.prenom, client.nom);
        let existing = null;
        try { existing = await SS.getClient(key); } catch (e) {}
        // Fusion douce : on ne remplace un champ de la fiche que par une valeur NON VIDE (sinon un devis
        // sans email viderait l'email de la fiche corrigé ailleurs).
        const ea = (existing && existing.adresse) || {}, na = client.adresse || {};
        await SS.saveClient({
          // ⚠️ On repart de la fiche EXISTANTE (voir simulateur.html) : sinon cette synchro efface
          // les champs qu'elle ne connaît pas — civilité, formule, et tout champ ajouté plus tard.
          ...(existing || {}),
          key, prenom: client.prenom, nom: client.nom,
          telephone: client.telephone || (existing && existing.telephone) || '',
          email: client.email || (existing && existing.email) || '',
          adresse: { rue: na.rue || ea.rue || '', numero: na.numero || ea.numero || '', code_postal: na.code_postal || ea.code_postal || '', ville: na.ville || ea.ville || '' },
          type_bien: (existing && existing.type_bien) || '', tags: (existing && existing.tags) || [], notes: (existing && existing.notes) || '',
          date_creation: (existing && existing.date_creation) || new Date().toISOString(),
          date_modification: new Date().toISOString(),
        });

        toast(res.offline ? `Enregistré hors-ligne (cache local) — ${res.error || 'raison inconnue'}` : 'Devis enregistré ✓', res.offline ? 'warn' : 'ok', res.offline ? 8000 : 3200);
        effacerBrouillon();       // la saisie est passée dans le cache devis : le brouillon devient inutile
        majFileAttente();         // ...et on affiche aussitôt s'il reste quelque chose à envoyer
        state.savedId = state.id;
        state.isExisting = true;
        state.loadedDateModification = devis.date_modification;
        dirty = false;
        setText('doneSummary', `${client.prenom} ${client.nom} · ${state.items.length} ouverture(s) · à chiffrer au bureau`);
        goStep('done');
      };
      await finish(false);
    };

    window.resetWizard = function () {
      effacerBrouillon();
      state.id = generateDevisId(); state.date_creation = new Date().toISOString().slice(0, 10);
      state.statut = 'brouillon'; state.items = []; state.savedId = null;
      state.isExisting = false; state.loadedDateModification = null;
      ['tPrenom', 'tNom', 'tTel', 'tEmail', 'tRue', 'tNumero', 'tCp', 'tVille'].forEach(id => setVal(id, ''));
      currentItemIdx = 0;
      dirty = false;
      goStep('client');
    };

    // ── CHARGEMENT D'UN DEVIS EXISTANT (?id=) ──
    async function loadExisting(id) {
      const d = await SS.getDevis(id);
      if (!d) { toast('Devis introuvable, nouveau devis créé.', 'warn'); return; }
      state.statut = d.statut || 'brouillon';
      state.isExisting = true;
      state.loadedDateModification = d.date_modification || null;   // baseline pour la détection de conflit
      state.date_creation = d.date_creation || state.date_creation;
      const cl = d.client || {};
      setVal('tPrenom', cl.prenom); setVal('tNom', cl.nom);
      setVal('tTel', cl.telephone); setVal('tEmail', cl.email);
      setVal('tRue', cl.adresse && cl.adresse.rue); setVal('tNumero', cl.adresse && cl.adresse.numero);
      setVal('tCp', cl.adresse && cl.adresse.code_postal); setVal('tVille', cl.adresse && cl.adresse.ville);
      state.items = (d.items || []).map(it => ({ _id: 'it' + (++_uid), photos: [], ...it }));
      const p = d.pricing_v2 || {};
      const tva = p.tva_pct || (d.calculs && d.calculs.tva_pct) || 6;
      el(tva === 21 ? 'terrTva21' : 'terrTva6').checked = true;
      setVal('terrAcompte', p.acompte_pct ?? 50);
      setVal('terrSurplus', p.surplus_difficulte ?? 0);
    }

    function fillDatalist(id, values) { el(id).innerHTML = values.map(v => `<option value="${v.replace(/"/g, '&quot;')}">`).join(''); }

    // ══════════ BANDEAUX D'ÉTAT (brouillon retrouvé · envois en attente) ══════════════════════
    // Deux informations qu'on ne peut PAS laisser deviner sur le terrain : « ta saisie est
    // récupérable » et « ce devis n'est pas encore parti au serveur ».
    function zoneEtat() {
      let z = document.getElementById('terrEtat');
      if (!z) {
        z = document.createElement('div');
        z.id = 'terrEtat';
        const m = document.querySelector('main.container') || document.body;
        m.insertBefore(z, m.firstChild);
      }
      return z;
    }
    function majFileAttente() {
      const n = (window.SS && SS.pendingCount) ? SS.pendingCount() : 0;
      let b = document.getElementById('terrFile');
      if (!n) { if (b) b.remove(); return; }
      if (!b) { b = document.createElement('div'); b.id = 'terrFile'; b.className = 'terr-banner attente'; zoneEtat().appendChild(b); }
      b.innerHTML = `${icon('clock', 14)} <span><strong>${n} enregistrement${n > 1 ? 's' : ''} pas encore envoyé${n > 1 ? 's' : ''}</strong> — ils partiront automatiquement dès le retour du réseau. Ne vide pas les données de Safari d'ici là.</span>
        <button type="button" class="btn btn-ghost btn-sm" onclick="SS.syncOutbox()">Réessayer</button>`;
    }
    window.addEventListener('ss-outbox', (e) => {
      majFileAttente();
      if (e.detail && e.detail.envoyes) toast(`${e.detail.envoyes} enregistrement(s) envoyé(s) au serveur ✓`, 'ok', 5000);
    });

    function proposerBrouillon() {
      let b = null;
      try { b = JSON.parse(localStorage.getItem(LS_BROUILLON) || 'null'); } catch (e) { b = null; }
      if (!b || !b.state) return;
      // On ne propose un brouillon que s'il correspond au contexte : même devis rouvert, ou
      // nouveau devis (on adopte alors l'identifiant du brouillon pour ne pas en créer un second).
      const idUrl = qp('id');
      if (idUrl ? b.state.id !== idUrl : !!b.state.isExisting) return;
      const nb = (b.state.items || []).length;
      const qui = [b.client && b.client.prenom, b.client && b.client.nom].filter(Boolean).join(' ').trim();
      const el2 = document.createElement('div');
      el2.id = 'terrBrouillon';
      el2.className = 'terr-banner brouillon';
      el2.innerHTML = `${icon('save', 14)} <span><strong>Saisie retrouvée</strong>${qui ? ' — ' + esc(qui) : ''} · ${nb} ouverture${nb > 1 ? 's' : ''} · ${window.SSUI.relTime(b.quand)}${b.photosAllegees ? ' (photos non conservées)' : ''}</span>
        <button type="button" class="btn btn-primary btn-sm" onclick="reprendreBrouillon()">Reprendre</button>
        <button type="button" class="btn btn-ghost btn-sm" onclick="ignorerBrouillon()">Ignorer</button>`;
      zoneEtat().appendChild(el2);
    }
    window.ignorerBrouillon = () => {
      if (!confirm('Ignorer cette saisie et repartir d\'une page vierge ?\n\nElle sera définitivement effacée.')) return;
      effacerBrouillon();
      const b = document.getElementById('terrBrouillon'); if (b) b.remove();
    };
    window.reprendreBrouillon = () => {
      let b = null;
      try { b = JSON.parse(localStorage.getItem(LS_BROUILLON) || 'null'); } catch (e) {}
      if (!b) return;
      state.id = b.state.id; state.version = b.state.version; state.date_creation = b.state.date_creation;
      state.statut = b.state.statut; state.items = b.state.items || [];
      state.isExisting = !!b.state.isExisting; state.loadedDateModification = b.state.loadedDateModification;
      const c = b.client || {}, a = c.adresse || {};
      setVal('tPrenom', c.prenom); setVal('tNom', c.nom); setVal('tTel', c.telephone); setVal('tEmail', c.email);
      setVal('tRue', a.rue); setVal('tNumero', a.numero); setVal('tCp', a.code_postal); setVal('tVille', a.ville);
      const p = b.params || {};
      const r = document.querySelector(`input[name="tva_pct_t"][value="${p.tva || 6}"]`); if (r) r.checked = true;
      if (p.acompte !== undefined) setVal('terrAcompte', p.acompte);
      if (p.surplus !== undefined) setVal('terrSurplus', p.surplus);
      currentItemIdx = Math.min(b.itemIdx || 0, Math.max(0, state.items.length - 1));
      dirty = true;
      const el2 = document.getElementById('terrBrouillon'); if (el2) el2.remove();
      if (state.items.length) renderItemsStep();
      goStep(b.etape && STEPS.includes(b.etape) ? b.etape : 'client');
      toast('Saisie restaurée — vérifie les mesures avant d\'enregistrer.', 'ok', 5000);
    };

    (async () => {
      fillDatalist('dl-couleurs', COULEURS_RAL);
      fillDatalist('dl-toiles', TOILES_CATALOGUE);
      fillDatalist('dl-caisson-forme', CS8_CAISSON_FORMES);
      fillDatalist('dl-emplacements', EMPLACEMENTS_SUGGESTIONS);
      fillDatalist('dl-etages', ETAGES_SUGGESTIONS);
      // Saisie assistée code postal ↔ ville — embarquée, donc utilisable chez le client sans réseau.
      window.SSPostal && SSPostal.bindPair(el('tCp'), el('tVille'));
      DIRECTORY = await buildClientDirectory();
      if (qp('id')) await loadExisting(qp('id'));
      goStep('client');
      proposerBrouillon();
      majFileAttente();
    })();
  </script>
</body>
</html>
