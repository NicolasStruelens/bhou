<!DOCTYPE html>
<html lang="fr" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SolariScreen — Demandes de RDV</title>
  <link rel="icon" type="image/png" href="../assets/img/logo-solariscreen.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600;700&family=Orbitron:wght@600;800&display=swap" rel="stylesheet">
  <script src="../assets/js/theme.js"></script>
  <link rel="stylesheet" href="../assets/css/tokens.css">
  <link rel="stylesheet" href="../assets/css/theme-dark.css">
  <link rel="stylesheet" href="../assets/css/theme-light.css">
  <link rel="stylesheet" href="../assets/css/base.css">
  <style>
    /* ── Barre d'outils (bascule vue, recherche, filtres) ── */
    .rdv-toolbar { display: flex; align-items: center; gap: var(--sp-3); flex-wrap: wrap; margin-bottom: var(--sp-4); }
    .view-toggle { display: inline-flex; border: 1px solid var(--border-strong); border-radius: var(--r-sm); overflow: hidden; }
    .view-toggle button { background: none; border: none; color: var(--text-muted); font-family: var(--font-mono); font-size: var(--fs-2xs); text-transform: uppercase; letter-spacing: 0.06em; padding: 0.4rem 0.7rem; cursor: pointer; display: inline-flex; align-items: center; gap: 0.35rem; }
    .view-toggle button.active { background: var(--accent); color: var(--on-accent); }
    .rdv-search { flex: 1; min-width: 180px; }
    .seller-chips { display: flex; gap: var(--sp-2); }
    .chip { background: none; border: 1px solid var(--border-strong); color: var(--text-muted); font-family: var(--font-mono); font-size: var(--fs-2xs); padding: 0.35rem 0.7rem; border-radius: var(--r-sm); cursor: pointer; transition: all var(--t-fast); }
    .chip:hover { border-color: var(--accent); color: var(--accent); }
    .chip.active { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
    /* Bouton doré "Créer le devis" (la classe .btn-terrain n'est définie que dans dashboard.html). */
    .btn-terrain { border-color: var(--accent-2); color: var(--accent-2); background: color-mix(in srgb, var(--accent-2) 10%, transparent); font-weight: 700; }
    .btn-terrain:hover { background: color-mix(in srgb, var(--accent-2) 18%, transparent); box-shadow: var(--glow-soft); color: var(--accent-2); }

    /* ── Rappels « À traiter » ── */
    .rdv-brief { border: 1px solid color-mix(in srgb, var(--warn) 40%, transparent); background: color-mix(in srgb, var(--warn) 8%, transparent); border-radius: var(--r-md); padding: var(--sp-3) var(--sp-4); margin-bottom: var(--sp-4); --tick-color: var(--warn); }
    .rdv-brief h3 { font-family: var(--font-mono); font-size: var(--fs-2xs); text-transform: uppercase; letter-spacing: 0.08em; color: var(--warn); margin-bottom: var(--sp-2); display: flex; align-items: center; gap: 0.4rem; }
    .rdv-brief ul { list-style: none; display: flex; flex-direction: column; gap: 0.3rem; }
    .rdv-brief li { font-size: var(--fs-sm); display: flex; align-items: center; gap: 0.5rem; cursor: pointer; }
    .rdv-brief li:hover { color: var(--accent-2); }
    .rdv-brief li .rb-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--warn); flex: none; }

    /* ── Statut (pastille) ── */
    .st-pill { display: inline-flex; align-items: center; gap: 0.4rem; font-family: var(--font-mono); font-size: var(--fs-2xs); font-weight: 600; letter-spacing: 0.03em; text-transform: uppercase; padding: 0.28rem 0.55rem; border-radius: var(--r-sm); border: 1px solid color-mix(in srgb, var(--st, var(--border-strong)) 45%, transparent); color: var(--st, var(--text-muted)); background: color-mix(in srgb, var(--st, transparent) 10%, transparent); }
    .st-pill .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--st, var(--text-muted)); box-shadow: 0 0 6px color-mix(in srgb, var(--st, transparent) 60%, transparent); }

    /* ── Vue KANBAN ── */
    .kanban { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(240px, 1fr); gap: var(--sp-3); overflow-x: auto; padding-bottom: var(--sp-3); align-items: start; }
    .kcol { background: color-mix(in srgb, var(--surface) 60%, transparent); border: 1px solid var(--border); border-radius: var(--r-md); min-height: 120px; display: flex; flex-direction: column; }
    .kcol.drag-over { border-color: var(--accent); box-shadow: var(--glow-soft); }
    .kcol-head { display: flex; align-items: center; gap: 0.5rem; padding: var(--sp-3); border-bottom: 1px solid var(--border); position: sticky; top: 0; }
    .kcol-head .k-count { margin-left: auto; font-family: var(--font-mono); font-size: var(--fs-2xs); color: var(--text-subtle); background: var(--bg); border-radius: 999px; padding: 0.05rem 0.5rem; }
    .kcol-body { padding: var(--sp-2); display: flex; flex-direction: column; gap: var(--sp-2); min-height: 40px; }
    .rdv-card { background: var(--surface); border: 1px solid var(--border-strong); border-radius: var(--r-sm); padding: var(--sp-3); cursor: pointer; transition: border-color var(--t-fast), transform var(--t-fast); }
    .rdv-card:hover { border-color: var(--accent); transform: translateY(-1px); }
    .rdv-card.dragging { opacity: 0.5; }
    .rc-top { display: flex; align-items: center; justify-content: space-between; gap: 0.4rem; }
    .rc-name { font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .rc-meta { font-family: var(--font-mono); font-size: var(--fs-2xs); color: var(--text-subtle); margin-top: 0.25rem; display: flex; flex-wrap: wrap; gap: 0.3rem 0.6rem; }
    .rc-badges { display: flex; flex-wrap: wrap; gap: 0.25rem; margin-top: 0.4rem; }
    .who-ava { width: 20px; height: 20px; border-radius: 50%; flex: none; display: inline-flex; align-items: center; justify-content: center; font-family: var(--font-mono); font-size: 0.55rem; font-weight: 700; }
    .who-ava.nicolas { background: color-mix(in srgb, var(--accent) 18%, transparent); color: var(--accent); border: 1px solid color-mix(in srgb, var(--accent) 35%, transparent); }
    .who-ava.yannick { background: color-mix(in srgb, var(--accent-2) 18%, transparent); color: var(--accent-2); border: 1px solid color-mix(in srgb, var(--accent-2) 40%, transparent); }
    .who-ava.none { background: var(--bg); color: var(--text-subtle); border: 1px solid var(--border-strong); }

    /* ── Vue LISTE ── */
    .rdv-table { width: 100%; border-collapse: collapse; }
    .rdv-table th { text-align: left; font-family: var(--font-mono); font-size: var(--fs-2xs); text-transform: uppercase; letter-spacing: 0.06em; color: var(--text-subtle); padding: var(--sp-3); border-bottom: 1px solid var(--border); }
    .rdv-table td { padding: var(--sp-3); border-bottom: 1px solid var(--border); vertical-align: middle; }
    .rdv-table tbody tr { cursor: pointer; }
    .rdv-table tbody tr:hover { background: color-mix(in srgb, var(--accent) 5%, transparent); }
    .rdv-table .r-name { font-weight: 600; }
    .rdv-table .r-sub { font-family: var(--font-mono); font-size: var(--fs-2xs); color: var(--text-subtle); }

    .empty { text-align: center; padding: var(--sp-7) var(--sp-5); color: var(--text-muted); }
    .empty .big { display: flex; justify-content: center; margin-bottom: var(--sp-3); color: var(--text-subtle); }

    /* ── Modale fiche ── */
    .modal-bg { position: fixed; inset: 0; background: rgba(0,0,0,0.55); z-index: 1000; display: none; align-items: center; justify-content: center; padding: var(--sp-4); }
    .modal-bg.open { display: flex; }
    .modal { background: var(--surface); border: 1px solid var(--border-strong); border-radius: var(--r-md); box-shadow: var(--shadow); width: 720px; max-width: 100%; max-height: 92vh; display: flex; flex-direction: column; }
    .mhead { display: flex; align-items: center; gap: var(--sp-2); padding: var(--sp-4) var(--sp-5); border-bottom: 1px solid var(--border); font-family: var(--font-display); font-size: var(--fs-md); color: var(--accent); }
    .mhead .mid { font-family: var(--font-mono); font-size: var(--fs-2xs); color: var(--text-subtle); margin-left: auto; }
    .mhead .mclose { background: none; border: none; color: var(--text-muted); cursor: pointer; padding: 4px; }
    .mbody { padding: var(--sp-4) var(--sp-5); overflow-y: auto; }
    .mfoot { padding: var(--sp-3) var(--sp-5); border-top: 1px solid var(--border); display: flex; gap: var(--sp-2); flex-wrap: wrap; align-items: center; }
    .mfoot .spacer { flex: 1; }
    /* Recherche de client existant (lie la base clients au module RDV). */
    .client-hit { display: flex; align-items: center; gap: var(--sp-3); padding: var(--sp-3); border: 1px solid var(--border); border-radius: var(--r-sm); margin-bottom: var(--sp-2); cursor: pointer; transition: border-color var(--t-fast); }
    .client-hit:hover { border-color: var(--accent); }
    .client-hit .avatar { width: 38px; height: 38px; flex: none; border-radius: 50%; display: grid; place-items: center; font-weight: 700; font-size: var(--fs-xs); background: color-mix(in srgb, var(--accent) 18%, transparent); color: var(--accent); }
    .client-hit .ci-main { min-width: 0; flex: 1; }
    .client-hit .ci-name { font-weight: 600; }
    .client-hit .ci-sub { font-size: var(--fs-2xs); color: var(--text-subtle); font-family: var(--font-mono); }
    .form-sec { font-family: var(--font-mono); font-size: var(--fs-2xs); text-transform: uppercase; letter-spacing: 0.08em; color: var(--text-subtle); margin: var(--sp-4) 0 var(--sp-2); }
    .form-sec:first-child { margin-top: 0; }
    .radio-row { display: flex; gap: var(--sp-3); flex-wrap: wrap; }
    .radio-row label { display: inline-flex; align-items: center; gap: 0.35rem; font-size: var(--fs-sm); cursor: pointer; }
    /* Photos */
    .rdv-photos { display: flex; flex-wrap: wrap; gap: var(--sp-2); margin-top: var(--sp-2); }
    .rdv-ph { position: relative; width: 74px; height: 74px; border-radius: var(--r-sm); overflow: hidden; border: 1px solid var(--border-strong); }
    .rdv-ph img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .rdv-ph button { position: absolute; top: 2px; right: 2px; background: rgba(0,0,0,0.6); border: none; color: #fff; border-radius: 50%; width: 20px; height: 20px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
    /* Commentaires */
    .cm-thread { display: flex; flex-direction: column; gap: var(--sp-2); margin-top: var(--sp-2); }
    .cm { display: flex; gap: 0.5rem; }
    .cm .cm-text { font-size: var(--fs-sm); line-height: 1.4; }
    .cm .cm-meta { font-family: var(--font-mono); font-size: 0.6rem; color: var(--text-subtle); }
    .cm-empty { font-size: var(--fs-sm); color: var(--text-muted); }

    /* ── Créneaux proposés (prise de RDV) ── */
    .creneau { display: flex; align-items: center; gap: var(--sp-2); border: 1px solid var(--border); border-left: 3px solid var(--crc, var(--border-strong)); border-radius: var(--r-sm); padding: 0.4rem var(--sp-2); margin-bottom: 0.4rem; background: var(--surface-2); }
    .creneau .input, .creneau .select { height: 32px; font-size: var(--fs-sm); }
    .creneau .cr-date { max-width: 150px; }
    .creneau .cr-state { font-family: var(--font-mono); font-size: var(--fs-2xs); text-transform: uppercase; letter-spacing: 0.05em; color: var(--crc, var(--text-subtle)); margin-left: auto; white-space: nowrap; }
    .creneau .cr-btn { background: none; border: 1px solid var(--border-strong); color: var(--text-muted); border-radius: var(--r-sm); width: 28px; height: 28px; display: grid; place-items: center; cursor: pointer; flex: none; }
    .creneau .cr-btn:hover { border-color: var(--ok); color: var(--ok); }
    .creneau .cr-btn.del:hover { border-color: var(--danger); color: var(--danger); }
    /* ── Contacter le client (messages prêts à envoyer) ── */
    .msg-box { border: 1px solid color-mix(in srgb, var(--accent) 35%, transparent); background: color-mix(in srgb, var(--accent) 6%, transparent); border-radius: var(--r-sm); padding: var(--sp-3); }
    .msg-chan { display: flex; gap: var(--sp-2); flex-wrap: wrap; margin-top: var(--sp-2); }
    .msg-chan .btn.reco { border-color: var(--accent-2); color: var(--accent-2); font-weight: 700; }
    .msg-hint { font-size: var(--fs-2xs); color: var(--text-subtle); margin-top: 0.3rem; }
    /* Alerte délai de réponse (un lead web se rappelle vite) */
    .lead-age { font-family: var(--font-mono); font-size: var(--fs-2xs); padding: 0.1rem 0.4rem; border-radius: var(--r-sm); border: 1px solid currentColor; }
    .lead-age.warn { color: var(--warn); }
    .lead-age.danger { color: var(--danger); }
  </style>
</head>
<body>
  <div class="fx-grid"></div>

  <header class="app-header">
    <div class="brand">
      <span class="brand-logo"><img src="../assets/img/logo-solariscreen.png" alt="" onerror="this.style.display='none'"></span>
      <div>
        <h1><a href="dashboard.html">SOLARISCREEN</a></h1>
        <div class="module">Demandes de RDV</div>
      </div>
    </div>
    <div class="header-actions">
      <span id="quickNav"></span>
      <span id="themeToggle"></span>
      <a class="btn btn-ghost btn-sm" href="dashboard.html"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg> Dashboard</a>
      <button class="btn btn-primary btn-sm" onclick="openNew()"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg> Nouvelle demande</button>
    </div>
  </header>

  <main class="container">
    <div id="briefHost"></div>

    <div class="rdv-toolbar">
      <div class="view-toggle" id="viewToggle">
        <button data-view="kanban" onclick="setView('kanban')"></button>
        <button data-view="list" onclick="setView('list')"></button>
      </div>
      <input class="input rdv-search" id="search" type="search" placeholder="Rechercher un client, un tél, un e-mail…" oninput="render()">
      <div class="seller-chips" id="sellerChips"></div>
      <label class="chip" style="cursor:pointer;"><input type="checkbox" id="showAnnules" onchange="render()" style="vertical-align:-1px;"> Voir annulés</label>
    </div>

    <div id="viewHost"></div>
  </main>

  <!-- Modale fiche RDV -->
  <div class="modal-bg" id="modalBg">
    <div class="modal">
      <div class="mhead">
        <span id="mIcon"></span>
        <span id="mTitle">Demande de RDV</span>
        <span class="mid" id="mId"></span>
        <button class="mclose" onclick="closeModal()" aria-label="Fermer">✕</button>
      </div>
      <div class="mbody" id="mBody"></div>
      <div class="mfoot">
        <button class="btn btn-ghost btn-sm" id="btnDelete" onclick="deleteCurrent()" style="color:var(--danger);border-color:color-mix(in srgb,var(--danger) 40%,transparent);">Supprimer</button>
        <button class="btn btn-ghost btn-sm" id="btnCancelRdv" onclick="cancelCurrent()" style="color:var(--warn);border-color:color-mix(in srgb,var(--warn) 40%,transparent);">Annuler le RDV</button>
        <div class="spacer"></div>
        <button class="btn btn-terrain btn-sm" id="btnConvert" onclick="convertToDevis()">Créer le devis</button>
        <button class="btn btn-primary btn-sm" id="btnSave" onclick="saveCurrent()">Enregistrer</button>
      </div>
    </div>
  </div>

  <script src="../assets/js/company.js"></script>
  <script src="../assets/js/ui.js"></script>
  <script src="../assets/js/nav.js?v=rdv1"></script>
  <script src="../assets/js/api.js?v=rdv1"></script>
  <script>
    const SS = window.SS;
    const { mountThemeToggle } = window.SSTheme;
    const { fmtDate, el, toast, qp, icon, compressImage, generateDevisId, clientKeyOf, jsAttr } = window.SSUI;
    mountThemeToggle(document.getElementById('themeToggle'));
    window.SSNav.mount(document.getElementById('quickNav'));

    const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

    const STATUSES = {
      nouveau:     { label: 'Nouveau',     color: 'var(--accent)' },
      a_contacter: { label: 'À contacter', color: 'var(--warn)' },
      rdv_fixe:    { label: 'RDV fixé',    color: 'var(--accent-2)' },
      visite:      { label: 'Visité',      color: 'var(--accent-3)' },
      converti:    { label: 'Converti',    color: 'var(--ok)' },
      annule:      { label: 'Annulé',      color: 'var(--text-subtle)' },
    };
    const KANBAN_ORDER = ['nouveau', 'a_contacter', 'rdv_fixe', 'visite', 'converti'];
    const SOURCES = ['Téléphone', 'E-mail', 'Site web', 'Bouche à oreille', 'Salon / foire', 'Réseaux sociaux', 'Multimedian', 'Interne MM', 'Autre'];
    // Créneaux proposables au client : on raisonne en DEMI-JOURNÉES (c'est ainsi qu'on s'accorde au
    // téléphone), avec une heure de référence utilisée quand le créneau est accepté et devient la
    // date de visite ferme.
    const MOMENTS = [
      { k: 'matin', l: 'Matin (9h — 12h)', h: '09:00' },
      { k: 'midi', l: 'Midi (12h — 14h)', h: '12:00' },
      { k: 'aprem', l: 'Après-midi (14h — 17h)', h: '14:00' },
      { k: 'fin', l: 'Fin de journée (17h — 19h)', h: '17:00' },
    ];
    const moment = k => MOMENTS.find(m => m.k === k) || MOMENTS[0];
    const CRENEAU_STATE = {
      propose: { l: 'Proposé', color: 'var(--text-subtle)' },
      accepte: { l: 'Accepté', color: 'var(--ok)' },
      refuse: { l: 'Refusé', color: 'var(--danger)' },
    };
    // Délai de prise en charge d'un lead : au-delà, on alerte (un client qui attend appelle ailleurs).
    const LEAD_WARN_H = 4, LEAD_DANGER_H = 24;

    let RDV = [];
    let VIEW = localStorage.getItem('ss_rdv_view') || 'kanban';
    let SELLER = 'tous';
    let IDENTITY = { key: '', name: '' };
    let CURRENT = null;         // RDV en cours d'édition dans la modale
    let PENDING_PHOTOS = [];    // photos de la fiche ouverte
    let CLIENT_DIRECTORY = [];  // annuaire clients (base CRM + clients des devis) pour l'autocomplétion
    let DEVIS_IDS = new Set();  // ids des devis existants → détecte un devis lié qui a été supprimé

    // ── Chargement ──
    async function load() {
      RDV = (await SS.listRdv()) || [];
      renderSellerChips();
      renderViewToggle();
      render();
      // Identité (Nicolas/Yannick) en arrière-plan — ne bloque pas l'affichage.
      try { window.SSNav.getIdentity().then(id => { if (id) IDENTITY = id; }); } catch (e) {}
      // Annuaire clients en arrière-plan → autocomplétion « client déjà enregistré » dans la fiche.
      buildClientDirectory().then(dir => { CLIENT_DIRECTORY = dir; }).catch(() => {});
      // Ouverture directe d'une fiche (ex. depuis la recherche globale Ctrl+K : rdv.html?open=ID).
      const openId = qp('open');
      if (openId) setTimeout(() => window.openEdit(openId), 120);
    }

    // Annuaire clients = fusion de la base CRM (SS.listClients) et des clients présents sur les
    // devis existants — même logique que le simulateur, pour relier la base clients aux RDV.
    async function buildClientDirectory() {
      const [clients, devisList] = await Promise.all([SS.listClients(), SS.listDevis()]);
      DEVIS_IDS = new Set((devisList || []).map(d => String(d.id)));
      const map = new Map();
      (devisList || []).forEach(d => {
        const prenom = d.client_prenom || (d.client && d.client.prenom) || '';
        const nom = d.client_nom || (d.client && d.client.nom) || '';
        if (!prenom && !nom) return;
        const key = clientKeyOf(prenom, nom);
        if (!map.has(key)) map.set(key, { key, prenom, nom, telephone: '', email: '', adresse: {} });
        const e = map.get(key), c = d.client || {};
        if (c.telephone && !e.telephone) e.telephone = c.telephone;
        if (c.email && !e.email) e.email = c.email;
        if (c.adresse && (c.adresse.rue || c.adresse.ville) && !e.adresse.rue && !e.adresse.ville) e.adresse = c.adresse;
      });
      (clients || []).forEach(o => {
        const e = map.get(o.key) || { key: o.key, prenom: o.prenom, nom: o.nom, telephone: '', email: '', adresse: {} };
        e.prenom = o.prenom || e.prenom; e.nom = o.nom || e.nom;
        e.telephone = o.telephone || e.telephone; e.email = o.email || e.email;
        if (o.adresse && (o.adresse.rue || o.adresse.ville)) e.adresse = o.adresse;
        map.set(o.key, e);
      });
      return [...map.values()];
    }
    window.renderRdvClientHits = function () {
      const q = el('rdvClientSearch').value.trim().toLowerCase();
      const host = el('rdvClientHits');
      if (!q) { host.innerHTML = ''; return; }
      const rows = CLIENT_DIRECTORY.filter(c => `${c.prenom} ${c.nom} ${c.telephone} ${c.email} ${(c.adresse && c.adresse.ville) || ''}`.toLowerCase().includes(q)).slice(0, 6);
      host.innerHTML = rows.length ? rows.map(c => `
        <div class="client-hit" onclick="pickRdvClient(${jsAttr(c.key)})">
          <div class="avatar">${esc(((((c.prenom || '')[0]) || '') + (((c.nom || '')[0]) || '')).toUpperCase()) || '?'}</div>
          <div class="ci-main"><div class="ci-name">${esc(c.prenom)} ${esc(c.nom)}</div><div class="ci-sub">${esc(c.telephone || c.email || (c.adresse && c.adresse.ville) || '—')}</div></div>
        </div>`).join('') : '<div class="mp-empty" style="padding:0.3rem 0;">Aucun client trouvé — remplis les champs ci-dessous pour un nouveau client.</div>';
    };
    window.pickRdvClient = function (key) {
      const c = CLIENT_DIRECTORY.find(x => x.key === key); if (!c) return;
      const a = c.adresse || {};
      el('f_prenom').value = c.prenom || '';
      el('f_nom').value = c.nom || '';
      el('f_tel').value = c.telephone || '';
      el('f_email').value = c.email || '';
      el('f_rue').value = ((a.rue || '') + (a.numero ? ' ' + a.numero : '')).trim();
      el('f_ville').value = ((a.code_postal || '') + ' ' + (a.ville || '')).trim();
      el('rdvClientSearch').value = ''; el('rdvClientHits').innerHTML = '';
      toast('Client pré-rempli ✓', 'ok');
    };

    function whoAva(key) {
      const k = (key || '').toLowerCase();
      const cls = k === 'nicolas' ? 'nicolas' : (k === 'yannick' ? 'yannick' : 'none');
      const txt = k === 'nicolas' ? 'NI' : (k === 'yannick' ? 'YA' : '–');
      const title = k ? k.charAt(0).toUpperCase() + k.slice(1) : 'Non attribué';
      return `<span class="who-ava ${cls}" title="${esc(title)}">${txt}</span>`;
    }
    function stPill(statut) {
      const s = STATUSES[statut] || STATUSES.nouveau;
      return `<span class="st-pill" style="--st:${s.color}"><span class="dot"></span>${s.label}</span>`;
    }
    function clientName(r) { const c = r.client || {}; return ((c.prenom || '') + ' ' + (c.nom || '')).trim() || 'Sans nom'; }
    function daysSince(iso) { if (!iso) return 0; return Math.floor((Date.now() - new Date(iso).getTime()) / 86400000); }
    function hoursSince(iso) { if (!iso) return 0; return Math.floor((Date.now() - new Date(iso).getTime()) / 3600000); }
    function ageTxt(h) { return h < 1 ? 'moins d\'1 h' : (h < 24 ? h + ' h' : Math.floor(h / 24) + ' j'); }
    function todayStr() { return new Date().toISOString().slice(0, 10); }
    function tomorrowStr() { const d = new Date(); d.setDate(d.getDate() + 1); return d.toISOString().slice(0, 10); }

    // ── Filtrage ──
    function filtered() {
      const q = el('search').value.trim().toLowerCase();
      const showAnnules = el('showAnnules').checked;
      return RDV.filter(r => {
        if (!showAnnules && r.statut === 'annule') return false;
        if (SELLER !== 'tous' && (r.assigned_to || '') !== SELLER) return false;
        if (q) {
          const c = r.client || {};
          const hay = `${c.prenom || ''} ${c.nom || ''} ${c.telephone || ''} ${c.email || ''} ${(c.adresse && c.adresse.ville) || ''}`.toLowerCase();
          if (!hay.includes(q)) return false;
        }
        return true;
      });
    }

    // ── Rappels « À traiter » ──
    function renderBrief() {
      const items = [];
      RDV.forEach(r => {
        if (r.statut === 'annule' || r.statut === 'converti') return;
        // PERSONNE ne l'a prise en charge : c'est LA décision à trancher entre Nicolas et Yannick.
        // Un contact entrant qui attend est un contact qui appelle le concurrent → priorité maximale.
        if (!r.assigned_to) {
          const h = hoursSince(r.date_creation);
          items.push({ r, prio: h >= LEAD_DANGER_H ? 3 : (h >= LEAD_WARN_H ? 2 : 1), txt: `${clientName(r)} — personne ne l'a prise en charge (depuis ${ageTxt(h)})` });
        }
        // Visite DEMAIN : c'est le moment d'envoyer le rappel au client.
        if (r.statut === 'rdv_fixe' && r.date_rdv && r.date_rdv.slice(0, 10) === tomorrowStr()) {
          items.push({ r, prio: 2, txt: `${clientName(r)} — visite DEMAIN, pense au message de rappel` });
        }
        // À contacter / nouveau depuis > 2 j sans date de visite
        if (['nouveau', 'a_contacter'].includes(r.statut) && !r.date_rdv) {
          const d = daysSince(r.date_creation);
          if (d >= 2) items.push({ r, prio: 2, txt: `${clientName(r)} — à recontacter (demande depuis ${d} j, pas de RDV fixé)` });
        }
        // RDV fixé mais date passée sans devis
        if (r.statut === 'rdv_fixe' && r.date_rdv && r.date_rdv.slice(0, 10) < todayStr()) {
          items.push({ r, txt: `${clientName(r)} — visite passée le ${fmtDate(r.date_rdv.slice(0, 10))}, à traiter (devis ?)` });
        }
        // Visité sans devis
        if (r.statut === 'visite' && !r.devis_id) {
          items.push({ r, txt: `${clientName(r)} — visité, en attente du devis` });
        }
        // Rappel daté échu
        if (r.rappel_date && r.rappel_date <= todayStr()) {
          items.push({ r, txt: `${clientName(r)} — rappel prévu le ${fmtDate(r.rappel_date)}` });
        }
      });
      const host = el('briefHost');
      if (!items.length) { host.innerHTML = ''; return; }
      // Le plus urgent en tête (contact entrant que personne n'a pris depuis longtemps).
      items.sort((a, b) => (b.prio || 1) - (a.prio || 1));
      host.innerHTML = `<div class="rdv-brief">
        <h3>${icon('warning', 12)} À traiter (${items.length})</h3>
        <ul>${items.slice(0, 8).map(it => `<li onclick="openEdit('${it.r.id}')"><span class="rb-dot"></span>${esc(it.txt)}</li>`).join('')}</ul>
      </div>`;
    }

    // ── Rendu principal ──
    function render() {
      renderBrief();
      const rows = filtered();
      const host = el('viewHost');
      if (VIEW === 'kanban') host.innerHTML = renderKanban(rows);
      else host.innerHTML = renderList(rows);
    }

    function cardHtml(r) {
      const c = r.client || {};
      const tel = c.telephone ? `${icon('phone', 11)} ${esc(c.telephone)}` : '';
      const ville = (c.adresse && c.adresse.ville) ? `${icon('pin', 11)} ${esc(c.adresse.ville)}` : '';
      const rdvDate = r.date_rdv ? `${icon('calendar', 11)} ${esc(fmtDate(r.date_rdv.slice(0, 10)))}` : '';
      const badges = [];
      // Ancienneté d'un contact entrant que PERSONNE n'a encore pris : visible d'un coup d'œil,
      // vire à l'orange puis au rouge. C'est le principal levier de conversion sur un lead web.
      if (!r.assigned_to && !['converti', 'annule'].includes(r.statut)) {
        const h = hoursSince(r.date_creation);
        const cls = h >= LEAD_DANGER_H ? 'danger' : (h >= LEAD_WARN_H ? 'warn' : '');
        badges.push(`<span class="lead-age ${cls}" title="Personne n'a encore pris cette demande en charge">${icon('clock', 10)} ${ageTxt(h)}</span>`);
      }
      if ((r.creneaux || []).some(cr => cr.statut === 'accepte')) badges.push('<span class="badge badge-ok">Créneau retenu</span>');
      if (r.pref_contact === 'tel') badges.push('<span class="badge badge-cyan">Préf. tél</span>');
      if (r.pref_contact === 'email') badges.push('<span class="badge badge-cyan">Préf. e-mail</span>');
      if ((r.photos || []).length) badges.push(`<span class="badge">${icon('camera', 10)} ${r.photos.length}</span>`);
      if ((r.comments || []).length) badges.push(`<span class="badge">${icon('message', 10)} ${r.comments.length}</span>`);
      if (r.devis_id) badges.push('<span class="badge badge-ok">Devis lié</span>');
      return `<div class="rdv-card" draggable="true" data-id="${r.id}"
          ondragstart="dragStart(event,'${r.id}')" ondragend="dragEnd(event)" onclick="openEdit('${r.id}')">
        <div class="rc-top"><span class="rc-name">${esc(clientName(r))}</span>${whoAva(r.assigned_to)}</div>
        <div class="rc-meta">${[tel, ville, rdvDate].filter(Boolean).join('')}</div>
        ${badges.length ? `<div class="rc-badges">${badges.join('')}</div>` : ''}
      </div>`;
    }

    function renderKanban(rows) {
      // Colonne "Annulé" ajoutée seulement si la case "Voir annulés" est cochée (sinon les annulés
      // n'ont nulle part où apparaître en Kanban → la case n'avait aucun effet dans cette vue).
      const order = el('showAnnules').checked ? KANBAN_ORDER.concat('annule') : KANBAN_ORDER;
      return `<div class="kanban">${order.map(st => {
        const s = STATUSES[st];
        const cards = rows.filter(r => r.statut === st);
        return `<div class="kcol" data-statut="${st}" ondragover="allowDrop(event)" ondragleave="dragLeave(event)" ondrop="dropCard(event,'${st}')">
          <div class="kcol-head"><span class="dot" style="width:8px;height:8px;border-radius:50%;background:${s.color};display:inline-block;"></span>
            <strong style="font-size:var(--fs-sm);">${s.label}</strong><span class="k-count">${cards.length}</span></div>
          <div class="kcol-body">${cards.map(cardHtml).join('') || '<div style="padding:var(--sp-3);color:var(--text-subtle);font-size:var(--fs-2xs);text-align:center;">—</div>'}</div>
        </div>`;
      }).join('')}</div>`;
    }

    function renderList(rows) {
      if (!rows.length) return `<div class="empty"><div class="big">${icon('calendar', 40)}</div>Aucune demande de RDV.<br>Clique sur <strong>+ Nouvelle demande</strong> pour en ajouter une.</div>`;
      const sorted = rows.slice().sort((a, b) => String(b.date_modification || '').localeCompare(String(a.date_modification || '')));
      return `<div class="table-wrap" style="border:1px solid var(--border);border-radius:var(--r-md);overflow:hidden;">
        <table class="rdv-table">
          <thead><tr><th>Client</th><th>Statut</th><th>Chargé</th><th>Visite</th><th>Contact</th><th>Source</th></tr></thead>
          <tbody>${sorted.map(r => {
            const c = r.client || {};
            return `<tr onclick="openEdit('${r.id}')">
              <td><div class="r-name">${esc(clientName(r))}</div><div class="r-sub">${esc((c.adresse && c.adresse.ville) || '')}</div></td>
              <td>${stPill(r.statut)}</td>
              <td>${whoAva(r.assigned_to)}</td>
              <td class="r-sub">${r.date_rdv ? esc(fmtDate(r.date_rdv.slice(0, 10))) : '—'}</td>
              <td class="r-sub">${esc(c.telephone || c.email || '—')}${r.pref_contact ? ` · ${r.pref_contact === 'tel' ? 'préf. tél' : 'préf. e-mail'}` : ''}</td>
              <td class="r-sub">${esc(r.source || '—')}</td>
            </tr>`;
          }).join('')}</tbody>
        </table></div>`;
    }

    // ── Bascule vue ──
    function renderViewToggle() {
      const t = el('viewToggle');
      t.querySelector('[data-view="kanban"]').innerHTML = `${icon('grid', 13)} Kanban`;
      t.querySelector('[data-view="list"]').innerHTML = `${icon('list', 13)} Liste`;
      t.querySelectorAll('button').forEach(b => b.classList.toggle('active', b.dataset.view === VIEW));
    }
    window.setView = (v) => { VIEW = v; localStorage.setItem('ss_rdv_view', v); renderViewToggle(); render(); };

    function renderSellerChips() {
      const opts = [['tous', 'Tous'], ['nicolas', 'Nicolas'], ['yannick', 'Yannick'], ['', 'Non attribué']];
      el('sellerChips').innerHTML = opts.map(([v, l]) =>
        `<button class="chip ${SELLER === v ? 'active' : ''}" onclick="setSeller('${v}')">${l}</button>`).join('');
    }
    window.setSeller = (v) => { SELLER = v; renderSellerChips(); render(); };

    // ── Glisser-déposer (Kanban) ──
    let DRAG_ID = null;
    window.dragStart = (e, id) => { DRAG_ID = id; e.dataTransfer.effectAllowed = 'move'; e.currentTarget.classList.add('dragging'); };
    window.dragEnd = (e) => { e.currentTarget.classList.remove('dragging'); document.querySelectorAll('.kcol.drag-over').forEach(c => c.classList.remove('drag-over')); };
    window.allowDrop = (e) => { e.preventDefault(); e.currentTarget.classList.add('drag-over'); };
    window.dragLeave = (e) => { e.currentTarget.classList.remove('drag-over'); };
    window.dropCard = async (e, statut) => {
      e.preventDefault();
      e.currentTarget.classList.remove('drag-over');
      const r = RDV.find(x => x.id === DRAG_ID);
      DRAG_ID = null;
      if (!r || r.statut === statut) return;
      r.statut = statut;
      r.date_modification = new Date().toISOString();
      render();
      const res = await SS.saveRdv(r);
      toast(res.offline ? 'Statut enregistré (hors-ligne)' : 'Statut mis à jour ✓', res.offline ? 'warn' : 'ok', 1400);
    };

    // ── Modale : nouvelle / édition ──
    function blankRdv() {
      return { id: 'RDV-' + generateDevisId(), client: { nom: '', prenom: '', telephone: '', email: '', adresse: {} },
        statut: 'nouveau', assigned_to: IDENTITY.key || '', source: 'Téléphone', pref_contact: '', pref_visite: '',
        dates_proposees: '', creneaux: [], date_rdv: '', rappel_date: '', projet: '', comments: [], photos: [],
        date_creation: new Date().toISOString(), date_modification: new Date().toISOString() };
    }
    window.openNew = () => { CURRENT = blankRdv(); PENDING_PHOTOS = []; renderModal(true); };
    let OPEN_TOKEN = 0;
    window.openEdit = async (id) => {
      const token = ++OPEN_TOKEN;               // anti-course : deux clics rapides → seul le dernier gagne
      let r = RDV.find(x => x.id === id);
      try { const full = await SS.getRdv(id); if (full) r = full; } catch (e) {}
      if (token !== OPEN_TOKEN) return;          // un autre openEdit a démarré pendant le fetch
      if (!r) { toast('Demande introuvable', 'error'); return; }
      CURRENT = JSON.parse(JSON.stringify(r));
      CURRENT.client = CURRENT.client || {}; CURRENT.client.adresse = CURRENT.client.adresse || {};
      PENDING_PHOTOS = (CURRENT.photos || []).slice();
      renderModal(false);
    };
    window.closeModal = () => { el('modalBg').classList.remove('open'); CURRENT = null; };

    function renderModal(isNew) {
      const r = CURRENT, c = r.client, a = c.adresse || {};
      el('mIcon').innerHTML = icon('calendar', 18);
      el('mTitle').textContent = isNew ? 'Nouvelle demande de RDV' : clientName(r);
      el('mId').textContent = '#' + r.id;
      el('btnDelete').style.display = isNew ? 'none' : '';
      // « Créer le devis » n'a AUCUN sens sur une demande qu'on est en train de saisir : à ce stade on
      // enregistre un contact entrant (qui le prend en charge, quand le visiter). Le bouton n'apparaît
      // donc qu'une fois la demande enregistrée — et disparaît si elle est déjà convertie (pas de 2e devis).
      // Un devis lié PUIS SUPPRIMÉ laissait la demande verrouillée à vie (bouton masqué, aucun moyen
      // de refaire un devis) — cas constaté sur 2 demandes réelles. Si l'id ne correspond à aucun
      // devis existant, on considère la demande comme NON convertie et on rend le bouton.
      const devisPerdu = !!r.devis_id && DEVIS_IDS.size > 0 && !DEVIS_IDS.has(String(r.devis_id));
      const dejaConverti = (!!r.devis_id && !devisPerdu) || (r.statut === 'converti' && !devisPerdu);
      el('btnConvert').style.display = (isNew || dejaConverti) ? 'none' : '';
      el('btnConvert').innerHTML = `${icon('filetext', 14)} Créer le devis`;
      el('btnSave').innerHTML = isNew ? `${icon('save', 14)} Enregistrer la demande` : `${icon('save', 14)} Enregistrer`;
      // « Annuler le RDV » : caché sur une nouvelle demande, un RDV déjà annulé, ou déjà converti en devis.
      el('btnCancelRdv').style.display = (isNew || r.statut === 'annule' || r.statut === 'converti') ? 'none' : '';
      const statusOpts = Object.entries(STATUSES).map(([k, v]) => `<option value="${k}" ${r.statut === k ? 'selected' : ''}>${v.label}</option>`).join('');
      const sourceOpts = SOURCES.map(s => `<option value="${s}" ${r.source === s ? 'selected' : ''}>${s}</option>`).join('');
      el('mBody').innerHTML = `
        ${isNew ? `<div class="field" style="margin-bottom:var(--sp-2);">
          <label class="label" for="rdvClientSearch">Client déjà enregistré ?</label>
          <input class="input" id="rdvClientSearch" placeholder="Rechercher par nom, prénom, tél, ville…" oninput="renderRdvClientHits()" autocomplete="off">
          <div id="rdvClientHits" style="margin-top:var(--sp-2);"></div>
        </div>` : ''}
        <div class="form-sec">Client potentiel</div>
        <div class="grid grid-2">
          <div class="field"><label class="label">Prénom</label><input class="input" id="f_prenom" value="${esc(c.prenom)}"></div>
          <div class="field"><label class="label">Nom</label><input class="input" id="f_nom" value="${esc(c.nom)}"></div>
          <div class="field"><label class="label">Téléphone</label><input class="input" id="f_tel" value="${esc(c.telephone)}"></div>
          <div class="field"><label class="label">Email(s)</label><input class="input" id="f_email" type="email" multiple value="${esc(c.email)}" placeholder="email@exemple.be"></div>
          <div class="field"><label class="label">Rue et n°</label><input class="input" id="f_rue" value="${esc((a.rue || '') + (a.numero ? ' ' + a.numero : ''))}" placeholder="Rue des Fleurs 12"></div>
          <div class="field"><label class="label">Code postal + ville</label><input class="input" id="f_ville" value="${esc(((a.code_postal || '') + ' ' + (a.ville || '')).trim())}" placeholder="7000 Mons"></div>
        </div>

        <div class="form-sec">Suivi de la demande</div>
        <div class="grid grid-2">
          <div class="field"><label class="label">Statut</label><select class="select" id="f_statut">${statusOpts}</select></div>
          <div class="field"><label class="label">Pris en charge par</label><select class="select" id="f_assigned">
            <option value="" ${!r.assigned_to ? 'selected' : ''}>— Non attribué —</option>
            <option value="nicolas" ${r.assigned_to === 'nicolas' ? 'selected' : ''}>Nicolas</option>
            <option value="yannick" ${r.assigned_to === 'yannick' ? 'selected' : ''}>Yannick</option>
          </select>
          ${(IDENTITY.key && r.assigned_to !== IDENTITY.key) ? `<button type="button" class="btn btn-ghost btn-sm mt-1" onclick="takeCharge()">${icon('check', 13)} Je prends en charge</button>` : ''}
          </div>
          <div class="field"><label class="label">Source de la demande</label><select class="select" id="f_source">${sourceOpts}</select></div>
          <div class="field"><label class="label">Préférence de contact</label>
            <div class="radio-row" style="padding-top:0.4rem;">
              <label><input type="radio" name="prefc" value="tel" ${r.pref_contact === 'tel' ? 'checked' : ''}> Téléphone</label>
              <label><input type="radio" name="prefc" value="email" ${r.pref_contact === 'email' ? 'checked' : ''}> E-mail</label>
              <label><input type="radio" name="prefc" value="" ${!r.pref_contact ? 'checked' : ''}> Indifférent</label>
            </div>
          </div>
        </div>

        <div class="form-sec">Rendez-vous</div>
        <div class="grid grid-2">
          <div class="field" style="grid-column:span 2;"><label class="label">Préférence de visite du client</label><input class="input" id="f_prefv" value="${esc(r.pref_visite)}" placeholder="Ex : en semaine après 17h, samedi matin…"></div>
          <div class="field" style="grid-column:span 2;">
            <label class="label">Créneaux proposés au client</label>
            <div id="creneauxHost"></div>
            <button type="button" class="btn btn-ghost btn-sm" onclick="addCreneau()">${icon('plus', 13)} Ajouter un créneau</button>
            ${r.dates_proposees ? `<div class="msg-hint">Ancienne saisie libre : ${esc(r.dates_proposees)}</div>` : ''}
          </div>
          <div class="field"><label class="label">Date de visite fixée</label><input class="input" id="f_daterdv" type="datetime-local" value="${esc(r.date_rdv || '')}"></div>
          <div class="field"><label class="label">Rappel le (optionnel)</label><input class="input" id="f_rappel" type="date" value="${esc(r.rappel_date || '')}"></div>
        </div>

        <div class="form-sec">Contacter le client</div>
        <div class="msg-box">
          <div class="grid grid-2">
            <div class="field"><label class="label" for="msgType">Message à envoyer</label>
              <select class="select" id="msgType" onchange="fillMsg()">
                <option value="creneaux">Proposer des créneaux</option>
                <option value="confirmation">Confirmer le rendez-vous</option>
                <option value="rappel">Rappel la veille</option>
                <option value="relance">Relance (sans réponse)</option>
              </select>
            </div>
            <div class="field"><label class="label">Canal préféré du client</label><div id="msgReco" style="padding-top:0.55rem;font-size:var(--fs-sm);"></div></div>
          </div>
          <textarea class="textarea" id="msgText" style="min-height:130px;margin-top:var(--sp-2);"></textarea>
          <div class="msg-chan">
            <button type="button" class="btn btn-ghost btn-sm" onclick="copyMsg()">${icon('copy', 13)} Copier</button>
            <button type="button" class="btn btn-ghost btn-sm" id="msgBtnMail" onclick="sendMsg('email')">E-mail</button>
            <button type="button" class="btn btn-ghost btn-sm" id="msgBtnSms" onclick="sendMsg('sms')">SMS</button>
            <button type="button" class="btn btn-ghost btn-sm" id="msgBtnWa" onclick="sendMsg('wa')">WhatsApp</button>
          </div>
          <div class="msg-hint">Le texte est modifiable avant envoi — les créneaux saisis ci-dessus y sont repris automatiquement.</div>
        </div>

        <div class="form-sec">Projet / besoin</div>
        <div class="field"><textarea class="textarea" id="f_projet" placeholder="Ce que le client souhaite (produits, pièces, contexte…)">${esc(r.projet)}</textarea></div>

        <div class="form-sec">Photos envoyées par le client</div>
        <input type="file" id="f_photoInput" accept="image/*" multiple style="display:none;" onchange="addPhotos(this.files)">
        <button class="btn btn-ghost btn-sm" onclick="el('f_photoInput').click()">${icon('camera', 14)} Ajouter des photos</button>
        <div class="rdv-photos" id="photosHost"></div>

        <div class="form-sec">Notes internes (Nicolas / Yannick)</div>
        <div class="cm-thread" id="cmThread"></div>
        <div style="display:flex;gap:var(--sp-2);margin-top:var(--sp-2);">
          <input class="input" id="cmInput" placeholder="Ajouter une note…" style="flex:1;" onkeydown="if(event.key==='Enter')addNote()">
          <button class="btn btn-ghost btn-sm" onclick="addNote()">Ajouter</button>
        </div>`;
      renderCreneaux();
      fillMsg();
      renderPhotos();
      renderNotes();
      el('modalBg').classList.add('open');
    }

    function renderPhotos() {
      el('photosHost').innerHTML = PENDING_PHOTOS.map((src, i) =>
        `<div class="rdv-ph"><img src="${esc(src)}" alt=""><button onclick="removePhoto(${i})" title="Retirer">✕</button></div>`).join('');
    }
    window.addPhotos = async (files) => {
      const ownerId = (CURRENT && CURRENT.id) || 'rdv-tmp';
      for (const f of files) {
        try { const url = await window.SSUI.compressAndUploadPhoto(f, ownerId); PENDING_PHOTOS.push(url); } catch (e) { toast('Photo illisible', 'warn'); }
      }
      renderPhotos();
    };
    window.removePhoto = (i) => { PENDING_PHOTOS.splice(i, 1); renderPhotos(); };

    function renderNotes() {
      const notes = (CURRENT.comments || []).slice().sort((a, b) => String(a.date).localeCompare(String(b.date)));
      el('cmThread').innerHTML = notes.length ? notes.map(n => {
        const who = (n.author || 'nicolas').toLowerCase();
        return `<div class="cm">${whoAva(who)}<div><div class="cm-meta">${esc(who.charAt(0).toUpperCase() + who.slice(1))} · ${fmtDate(n.date)}</div><div class="cm-text">${esc(n.text)}</div></div></div>`;
      }).join('') : '<div class="cm-empty">Aucune note pour l’instant.</div>';
    }
    window.addNote = () => {
      const inp = el('cmInput'), text = inp.value.trim();
      if (!text) return;
      CURRENT.comments = CURRENT.comments || [];
      CURRENT.comments.push({ id: Date.now(), author: IDENTITY.key || 'nicolas', text, date: new Date().toISOString() });
      inp.value = '';
      renderNotes();
    };

    // ── Créneaux proposés ────────────────────────────────────────────────────────────────
    // But : arrêter de négocier les dates dans un champ texte libre. Chaque créneau porte un état ;
    // « accepter » un créneau fixe la visite (date + heure) et fait passer la demande en « RDV fixé ».
    function renderCreneaux() {
      const list = CURRENT.creneaux || [];
      el('creneauxHost').innerHTML = list.length ? list.map((cr, i) => {
        const st = CRENEAU_STATE[cr.statut] || CRENEAU_STATE.propose;
        return `<div class="creneau" style="--crc:${st.color};">
          <input class="input cr-date" type="date" value="${esc(cr.date || '')}" onchange="setCreneau(${i},'date',this.value)" aria-label="Date du créneau ${i + 1}">
          <select class="select" onchange="setCreneau(${i},'moment',this.value)" aria-label="Moment du créneau ${i + 1}">
            ${MOMENTS.map(m => `<option value="${m.k}" ${cr.moment === m.k ? 'selected' : ''}>${m.l}</option>`).join('')}
          </select>
          <span class="cr-state">${st.l}</span>
          <button type="button" class="cr-btn" onclick="acceptCreneau(${i})" title="Le client a retenu ce créneau" aria-label="Retenir le créneau ${i + 1}">${icon('check', 13)}</button>
          <button type="button" class="cr-btn del" onclick="removeCreneau(${i})" title="Retirer ce créneau" aria-label="Retirer le créneau ${i + 1}">${icon('x', 12)}</button>
        </div>`;
      }).join('') : '<div class="cm-empty">Aucun créneau proposé. Ajoutes-en 2 ou 3 à soumettre au client.</div>';
    }
    window.addCreneau = () => {
      CURRENT.creneaux = CURRENT.creneaux || [];
      if (CURRENT.creneaux.length >= 5) { toast('5 créneaux, c’est déjà beaucoup à proposer.', 'warn'); return; }
      // Proposition par défaut : le prochain jour ouvré, le matin (on ne propose pas un dimanche).
      const d = new Date(); d.setDate(d.getDate() + 1);
      if (d.getDay() === 0) d.setDate(d.getDate() + 1);
      else if (d.getDay() === 6) d.setDate(d.getDate() + 2);
      CURRENT.creneaux.push({ date: d.toISOString().slice(0, 10), moment: 'matin', statut: 'propose' });
      renderCreneaux(); fillMsg();
    };
    window.setCreneau = (i, field, val) => {
      if (!CURRENT.creneaux || !CURRENT.creneaux[i]) return;
      CURRENT.creneaux[i][field] = val;
      fillMsg();
    };
    window.removeCreneau = (i) => { (CURRENT.creneaux || []).splice(i, 1); renderCreneaux(); fillMsg(); };
    window.acceptCreneau = (i) => {
      const cr = (CURRENT.creneaux || [])[i];
      if (!cr || !cr.date) { toast('Renseigne d’abord la date de ce créneau.', 'warn'); return; }
      // Un seul créneau retenu : les autres redeviennent de simples propositions.
      CURRENT.creneaux.forEach((c, j) => { c.statut = (j === i) ? 'accepte' : (c.statut === 'accepte' ? 'propose' : c.statut); });
      el('f_daterdv').value = cr.date + 'T' + moment(cr.moment).h;
      el('f_statut').value = 'rdv_fixe';
      renderCreneaux(); fillMsg();
      toast('Créneau retenu → visite fixée le ' + fmtDate(cr.date) + ' (pense à enregistrer)', 'ok', 4000);
    };

    // ── Messages prêts à envoyer ─────────────────────────────────────────────────────────
    // But : ne jamais avoir à rédiger un mail de prise de RDV. Le texte est GÉNÉRÉ depuis la fiche
    // (prénom, créneaux, date fixée, personne en charge) puis reste modifiable avant envoi.
    function creneauxTexte() {
      const list = (CURRENT.creneaux || []).filter(c => c.date && c.statut !== 'refuse');
      return list.length ? list.map(c => '  • ' + fmtDate(c.date) + ' — ' + moment(c.moment).l).join('\n') : '';
    }
    function signatureTxt() {
      const who = (el('f_assigned') && el('f_assigned').value) || CURRENT.assigned_to || IDENTITY.key || '';
      const nom = who === 'yannick' ? 'Yannick' : (who === 'nicolas' ? 'Nicolas' : '');
      const co = window.SS_COMPANY || {};
      return [nom, co.name || 'SolariScreen', co.phone || '', co.website || ''].filter(Boolean).join('\n');
    }
    function buildMsg(type) {
      const c = CURRENT.client || {};
      const prenom = (el('f_prenom') ? el('f_prenom').value.trim() : c.prenom) || '';
      const hello = prenom ? `Bonjour ${prenom},` : 'Bonjour,';
      const cr = creneauxTexte();
      const fixee = (el('f_daterdv') && el('f_daterdv').value) || CURRENT.date_rdv || '';
      const heure = fixee.slice(11, 16);
      const dateTxt = fixee ? fmtDate(fixee.slice(0, 10)) + (heure ? ' à ' + heure : '') : '';
      const sig = '\n\nBien à vous,\n' + signatureTxt();
      if (type === 'confirmation') {
        return `${hello}\n\nJe vous confirme notre rendez-vous${dateTxt ? ' le ' + dateTxt : ''} à votre domicile, pour la prise de mesures et l'étude de votre projet.\n\nLa visite dure environ 30 minutes et est sans engagement. En cas d'imprévu, prévenez-moi : nous reprogrammerons sans souci.${sig}`;
      }
      if (type === 'rappel') {
        return `${hello}\n\nPetit rappel de notre rendez-vous${dateTxt ? ' du ' + dateTxt : ' de demain'} : je passe chez vous pour prendre les mesures et voir ensemble la solution la mieux adaptée.\n\nÀ très bientôt.${sig}`;
      }
      if (type === 'relance') {
        return `${hello}\n\nJe reviens vers vous concernant votre demande pour vos protections solaires. Souhaitez-vous toujours que nous convenions d'un rendez-vous ?\n\nJe reste à votre entière disposition.${sig}`;
      }
      return `${hello}\n\nMerci pour votre demande. Je vous propose de passer chez vous pour prendre les mesures et vous conseiller — c'est gratuit et sans engagement.\n\n${cr ? 'Voici mes disponibilités :\n' + cr + '\n\nQuel créneau vous conviendrait le mieux ?' : 'Quelles seraient vos disponibilités dans les prochains jours ?'}${sig}`;
    }
    window.fillMsg = () => {
      const sel = el('msgType'); if (!sel) return;
      el('msgText').value = buildMsg(sel.value);
      // Canal préféré du client : on MET EN AVANT le bouton correspondant, sans jamais bloquer les autres.
      const pref = (document.querySelector('input[name="prefc"]:checked') || {}).value || '';
      const reco = el('msgReco');
      if (reco) reco.textContent = pref === 'tel' ? 'Téléphone / SMS' : (pref === 'email' ? 'E-mail' : 'Indifférent');
      ['msgBtnMail', 'msgBtnSms', 'msgBtnWa'].forEach(id => { const b = el(id); if (b) b.classList.remove('reco'); });
      if (pref === 'email' && el('msgBtnMail')) el('msgBtnMail').classList.add('reco');
      if (pref === 'tel' && el('msgBtnSms')) el('msgBtnSms').classList.add('reco');
    };
    window.copyMsg = async () => {
      try { await navigator.clipboard.writeText(el('msgText').value); toast('Message copié ✓', 'ok'); }
      catch (e) { el('msgText').select(); toast('Sélectionné — fais Ctrl+C', 'warn'); }
    };
    window.sendMsg = (chan) => {
      const body = el('msgText').value;
      const email = (el('f_email').value || '').split(',')[0].trim();   // 1re adresse si plusieurs
      const tel = (el('f_tel').value || '').split(',')[0].replace(/[^\d+]/g, '');
      if (chan === 'email') {
        if (!email) { toast('Pas d’adresse e-mail sur cette demande.', 'warn'); return; }
        const subj = encodeURIComponent('Votre projet de protection solaire — SolariScreen');
        window.location.href = `mailto:${encodeURIComponent(email)}?subject=${subj}&body=${encodeURIComponent(body)}`;
        return;
      }
      if (!tel) { toast('Pas de numéro de téléphone sur cette demande.', 'warn'); return; }
      if (chan === 'sms') { window.location.href = `sms:${tel}?&body=${encodeURIComponent(body)}`; return; }
      // WhatsApp (wa.me) veut l'international sans « + » ni « 0 » initial (Belgique = 32).
      let wa = tel.replace(/^\+/, '');
      if (wa.startsWith('0')) wa = '32' + wa.slice(1);
      window.open(`https://wa.me/${wa}?text=${encodeURIComponent(body)}`, '_blank');
    };
    window.takeCharge = () => {
      if (!IDENTITY.key) { toast('Identité inconnue — choisis dans la liste déroulante.', 'warn'); return; }
      el('f_assigned').value = IDENTITY.key;
      if (el('f_statut').value === 'nouveau') el('f_statut').value = 'a_contacter';
      fillMsg();
      toast('Attribué à ' + (IDENTITY.key === 'yannick' ? 'Yannick' : 'Nicolas') + ' — pense à enregistrer.', 'ok');
    };

    // Rassemble le formulaire dans CURRENT
    function collect() {
      const r = CURRENT, c = r.client;
      c.prenom = el('f_prenom').value.trim();
      c.nom = el('f_nom').value.trim();
      c.telephone = el('f_tel').value.trim();
      c.email = el('f_email').value.trim();
      // Adresse : "rue n°" et "cp ville" saisis en 2 champs libres → on stocke tel quel + on tente d'extraire cp/ville
      const rue = el('f_rue').value.trim();
      const cpVille = el('f_ville').value.trim();
      const mCp = cpVille.match(/^(\d{4})\s*(.*)$/);
      c.adresse = { rue: rue, numero: '', code_postal: mCp ? mCp[1] : '', ville: mCp ? mCp[2] : cpVille };
      r.statut = el('f_statut').value;
      r.assigned_to = el('f_assigned').value;
      r.source = el('f_source').value;
      const prefc = document.querySelector('input[name="prefc"]:checked');
      r.pref_contact = prefc ? prefc.value : '';
      r.pref_visite = el('f_prefv').value.trim();
      // `dates_proposees` = ancien champ texte libre : conservé TEL QUEL pour les demandes créées
      // avant les créneaux structurés (affiché en lecture seule dans la fiche). Les créneaux, eux,
      // sont modifiés directement sur CURRENT.creneaux par leurs propres boutons.
      r.creneaux = r.creneaux || [];
      r.date_rdv = el('f_daterdv').value;
      r.rappel_date = el('f_rappel').value;
      r.projet = el('f_projet').value.trim();
      r.photos = PENDING_PHOTOS.slice();
      r.date_modification = new Date().toISOString();
    }

    window.saveCurrent = async () => {
      if (!CURRENT) return;
      collect();
      const cur = CURRENT;   // capturé AVANT l'await : fermer la modale (Échap/clic) met CURRENT=null
      const idx = RDV.findIndex(x => x.id === cur.id);
      const isNewRdv = idx === -1;
      if (idx !== -1) RDV[idx] = cur; else RDV.unshift(cur);
      const res = await SS.saveRdv(cur);
      if (res.ok === false) { toast(res.error || 'Demande NON enregistrée — réessaie.', 'error', 6000); return; }
      toast(res.offline ? 'Enregistré (hors-ligne)' : 'Demande enregistrée ✓', res.offline ? 'warn' : 'ok');
      if (isNewRdv) SS.logActivity({ action: 'rdv.create', entity_type: 'rdv', entity_id: cur.id, label: `Nouvelle demande de RDV — ${clientName(cur)}${cur.source ? ' (' + cur.source + ')' : ''}` });
      closeModal();
      render();
    };

    window.deleteCurrent = async () => {
      const cur = CURRENT;
      if (!cur || !confirm('Supprimer définitivement cette demande de RDV ?')) return;
      await SS.deleteRdv(cur.id);
      RDV = RDV.filter(x => x.id !== cur.id);
      toast('Demande supprimée', 'ok');
      closeModal();
      render();
    };

    // Désistement client : on ANNULE la demande (elle reste dans l'historique, visible via « Voir annulés »)
    // au lieu de la supprimer. Réversible : il suffit de rouvrir la fiche et de changer le statut.
    window.cancelCurrent = async () => {
      if (!CURRENT) return;
      if (!confirm('Le client s\'est désisté ? Marquer cette demande comme ANNULÉE (elle ira dans les « annulés »).')) return;
      collect();
      const cur = CURRENT;              // capturé AVANT l'await (voir saveCurrent)
      cur.statut = 'annule';
      const idx = RDV.findIndex(x => x.id === cur.id);
      if (idx !== -1) RDV[idx] = cur; else RDV.unshift(cur);
      const res = await SS.saveRdv(cur);
      if (res.ok === false) { toast(res.error || 'Annulation NON enregistrée — réessaie.', 'error', 6000); return; }
      if (SS.logActivity) SS.logActivity({ action: 'rdv.cancel', entity_type: 'rdv', entity_id: cur.id, label: `RDV annulé (désistement) — ${clientName(cur)}` });
      toast(res.offline ? 'RDV annulé (hors-ligne)' : 'RDV annulé', 'warn');
      closeModal();
      render();
    };

    // ── Conversion en devis ──
    let CONVERTING = false;
    window.convertToDevis = async () => {
      if (!CURRENT || CONVERTING) return;
      collect();
      const cur = CURRENT;   // capturé AVANT tout await (voir saveCurrent)
      if (!cur.client.nom && !cur.client.prenom) { toast('Renseigne au moins le nom du client avant de créer le devis.', 'warn'); return; }
      // Même règle que l'affichage du bouton : un devis lié mais SUPPRIMÉ ne doit plus bloquer.
      if (cur.devis_id && !(DEVIS_IDS.size > 0 && !DEVIS_IDS.has(String(cur.devis_id)))) { toast('Un devis est déjà lié à cette demande.', 'warn'); return; }
      CONVERTING = true;   // verrou synchrone : devis_id n'est posé qu'APRÈS l'await → sans lui, un double-clic crée 2 devis orphelins
      const devisId = generateDevisId();
      const now = new Date().toISOString();
      const devis = {
        id: devisId,
        client: JSON.parse(JSON.stringify(cur.client)),
        statut: 'brouillon', items: [],
        rdv_id: cur.id,
        note_projet: cur.projet || '',
        // Reprend le besoin client dans la note interne du devis (visible dans le simulateur).
        pricing_v2: cur.projet ? { note: 'Projet (via demande de RDV) : ' + cur.projet } : {},
        date_creation: now, date_modification: now,
      };
      const rDevis = await SS.saveDevis(devis);
      // Si le devis n'a pas été créé côté serveur, NE PAS marquer la demande « convertie » : elle
      // serait verrouillée (bouton masqué) et liée à un devis inexistant, sans retour arrière possible.
      if (rDevis.ok === false) {
        CONVERTING = false;   // libère le verrou pour permettre un nouvel essai
        toast(rDevis.error || 'Devis NON créé — réessaie.', 'error', 7000);
        return;
      }
      // Lie le RDV au devis + passe en "converti"
      cur.devis_id = devisId;
      cur.statut = 'converti';
      cur.date_modification = now;
      await SS.saveRdv(cur);
      const idx = RDV.findIndex(x => x.id === cur.id);
      if (idx !== -1) RDV[idx] = cur;
      SS.logActivity({ action: 'devis.create', entity_type: 'devis', entity_id: devisId, label: `Devis #${devisId} créé depuis la demande de RDV — ${clientName(cur)}` });
      toast(rDevis.offline ? 'Devis créé (hors-ligne)' : 'Devis créé — ouverture du simulateur…', rDevis.offline ? 'warn' : 'ok', 1600);
      setTimeout(() => { location.href = 'simulateur.html?id=' + encodeURIComponent(devisId); }, 500);
    };

    el('modalBg').addEventListener('click', (e) => { if (e.target === el('modalBg')) closeModal(); });
    document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && el('modalBg').classList.contains('open')) closeModal(); });

    load();
  </script>
</body>
</html>
