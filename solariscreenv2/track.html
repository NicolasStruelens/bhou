<!DOCTYPE html>
<html lang="fr" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SolariScreen — Suivi de votre commande</title>
  <link rel="icon" type="image/png" href="assets/img/logo-solariscreen.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600;700&family=Orbitron:wght@600;800&display=swap" rel="stylesheet">
  <script src="assets/js/theme.js"></script>
  <link rel="stylesheet" href="assets/css/tokens.css">
  <link rel="stylesheet" href="assets/css/theme-dark.css">
  <link rel="stylesheet" href="assets/css/theme-light.css">
  <link rel="stylesheet" href="assets/css/base.css">
  <style>
    body { min-height: 100vh; }
    .track-wrap { max-width: 600px; margin: 0 auto; padding: var(--sp-7) var(--sp-4) var(--sp-6); }

    @keyframes trackRise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    @media (prefers-reduced-motion: no-preference) {
      .track-hero, .track-card { animation: trackRise 0.55s cubic-bezier(.16,.8,.3,1) both; }
      .track-card:nth-of-type(2) { animation-delay: 0.08s; }
      .tl-step { animation: trackRise 0.5s cubic-bezier(.16,.8,.3,1) both; animation-delay: calc(0.06s * var(--i, 0)); }
      .tl-step.active .dot { animation: tlPulse 2.4s ease-in-out infinite; }
      .track-items .track-item { animation: trackRise 0.5s cubic-bezier(.16,.8,.3,1) both; }
    }
    @keyframes tlPulse {
      0%, 100% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--accent-2) 45%, transparent); }
      55% { box-shadow: 0 0 0 7px transparent; }
    }

    .track-hero { text-align: center; margin-bottom: var(--sp-6); }
    .track-hero .logo { width: 72px; height: 72px; margin: 0 auto var(--sp-4); border: 1px solid var(--accent); border-radius: var(--r-lg); display: grid; place-items: center; overflow: hidden; box-shadow: var(--glow-soft); background: var(--surface); }
    .track-hero .logo img { width: 100%; height: 100%; object-fit: cover; }
    .track-hero h1 { font-family: var(--font-display); font-size: var(--fs-xl); letter-spacing: 0.01em; }
    .track-hero p { color: var(--text-muted); font-size: var(--fs-sm); margin-top: var(--sp-2); }

    /* Carte englobante pour la timeline : la sépare visuellement du fond, comme le reste de l'appli */
    .track-card { border: 1px solid var(--border); border-radius: var(--r-lg); background: var(--surface); padding: var(--sp-5) var(--sp-4) var(--sp-4); margin-bottom: var(--sp-4); box-shadow: var(--shadow); }

    /* Timeline VERTICALE : chaque étape est une rangée (pastille + libellé), reliées par un segment
       vertical à gauche. Plus de longue ligne horizontale en travers de la carte (que Nicolas
       trouvait disgracieuse) et, en prime, aucun risque de chevauchement quand un libellé est long
       ou passe sur mobile — chaque étape occupe sa propre rangée. */
    .tl { list-style: none; margin: 0; padding: 0; }
    .tl-step { display: grid; grid-template-columns: 38px 1fr; align-items: stretch; }
    .tl-rail { display: flex; flex-direction: column; align-items: center; }
    .tl-rail .dot { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; flex: none; border: 2px solid var(--border-strong); background: var(--surface-2); color: var(--text-subtle); font-family: var(--font-mono); font-weight: 700; font-size: var(--fs-xs); transition: all var(--t-base); }
    /* Le segment vertical remplit tout l'espace restant de la rangée (flex:1) → il rejoint pile la
       pastille suivante quel que soit le nombre de lignes du libellé. Masqué sur la dernière étape. */
    .tl-rail .bar { width: 3px; flex: 1; min-height: 20px; margin: 5px 0; border-radius: 2px; background: var(--border); }
    .tl-step:last-child .tl-rail .bar { display: none; }
    .tl-body { min-width: 0; padding: 5px 0 var(--sp-5) var(--sp-3); }
    .tl-step:last-child .tl-body { padding-bottom: 5px; }
    .tl-lbl { font-family: var(--font-mono); font-size: var(--fs-sm); text-transform: uppercase; letter-spacing: 0.03em; color: var(--text-subtle); font-weight: 600; line-height: 1.25; }
    .tl-sub { font-size: var(--fs-xs); color: var(--text-subtle); margin-top: 3px; }
    /* Étapes franchies */
    .tl-step.done .dot { border-color: var(--ok); background: color-mix(in srgb, var(--ok) 18%, transparent); color: var(--ok); }
    .tl-step.done .tl-rail .bar { background: var(--ok); }
    .tl-step.done .tl-lbl { color: var(--text); }
    /* Étape en cours : mise en avant (couleur marque + halo pulsé) */
    .tl-step.active .dot { border-color: var(--accent-2); background: color-mix(in srgb, var(--accent-2) 20%, transparent); color: var(--accent-2-ink); box-shadow: var(--glow-soft); }
    .tl-step.active .tl-lbl { color: var(--accent-2-ink); font-size: var(--fs-md); font-weight: 700; }
    .tl-step.active .tl-sub { color: var(--accent-2-ink); }

    .track-eta { text-align: center; font-size: var(--fs-sm); color: var(--text-muted); margin-top: var(--sp-5); padding-top: var(--sp-4); border-top: 1px dashed var(--border); }
    .track-eta strong { color: var(--text); }

    .track-items { display: flex; flex-direction: column; gap: var(--sp-2); }
    .track-items-title { font-family: var(--font-mono); font-size: var(--fs-2xs); text-transform: uppercase; letter-spacing: 0.08em; color: var(--text-subtle); margin-bottom: var(--sp-3); }
    .track-item { display: flex; align-items: center; gap: var(--sp-3); border: 1px solid var(--border); border-radius: var(--r-sm); padding: var(--sp-3); background: var(--surface-2); }
    .track-item svg { color: var(--accent); flex: none; }

    .track-error { text-align: center; padding: var(--sp-7) var(--sp-4); color: var(--text-muted); }
    .track-foot { text-align: center; color: var(--text-subtle); font-size: var(--fs-2xs); margin-top: var(--sp-6); }
    .topbar { position: absolute; top: var(--sp-4); right: var(--sp-5); z-index: 2; }

    .track-foot a { color: var(--accent-2-ink); }
    @media (max-width: 420px) {
      .tl-step { grid-template-columns: 34px 1fr; }
      .tl-rail .dot { width: 30px; height: 30px; }
    }
  </style>
</head>
<body>
  <div class="fx-grid"></div>
  <div class="topbar"><span id="themeToggle"></span></div>

  <div class="track-wrap" id="main" style="display:none;">
    <div class="track-hero">
      <div class="logo"><img src="assets/img/logo-solariscreen.png" alt="SolariScreen" onerror="this.parentElement.textContent='SS'"></div>
      <h1 id="greeting">Suivi de votre commande</h1>
      <p>Voici où en est votre commande SolariScreen.</p>
    </div>

    <div class="track-card">
      <ol class="tl" id="trackSteps"></ol>
      <div class="track-eta" id="trackEta"></div>
    </div>

    <div class="track-card" id="trackItemsCard" style="display:none;">
      <div class="track-items-title">Votre commande</div>
      <div class="track-items" id="trackItems"></div>
    </div>

    <div class="track-foot" id="trackFoot"></div>
  </div>

  <div class="track-wrap" id="loading">
    <div class="track-error">Chargement…</div>
  </div>

  <script src="assets/js/company.js"></script>
  <script src="assets/js/ui.js"></script>
  <script>
    const { icon } = window.SSUI;
    const COMPANY = window.SS_COMPANY;
    window.SSTheme.mountThemeToggle(document.getElementById('themeToggle'));

    // Pied de page joignable (présent aussi sur l'écran d'erreur : un lien expiré ne doit pas
    // laisser le client sans moyen de nous contacter).
    function contactFootHtml() {
      const mails = [COMPANY.email, COMPANY.email2].filter(Boolean)
        .map(m => `<a href="mailto:${esc(m)}">${esc(m)}</a>`).join(' · ');
      const mail = mails ? `Une question ? ${mails}` : '';
      const tel = COMPANY.phone ? ` · <a href="tel:${esc(COMPANY.phone.replace(/\s/g, ''))}">${esc(COMPANY.phone)}</a>` : '';
      const web = COMPANY.web ? `<a href="https://${esc(COMPANY.web)}" target="_blank" rel="noopener">${esc(COMPANY.web)}</a>` : '';
      return `SolariScreen${web ? ' · ' + web : ''}${mail ? '<br>' + mail + tel : ''}`;
    }

    const TYPE_LABEL = { screen: 'Screen', volet_roulant: 'Volet', tente_solaire: 'Tente solaire', tablier_volet: 'Tablier volet', pergola: 'Pergola', store_banne: 'Store banne' };
    const STAGES = [
      { k: 'a_commander', l: 'À commander' },
      { k: 'commande', l: 'Commandé' },
      { k: 'fabrication', l: 'Fabrication' },
      { k: 'recu', l: 'Reçu' },
      { k: 'pose', l: 'Posé' },
    ];
    // Micro-statut affiché sous l'étape en cours (uniquement), pour donner du contexte au client.
    const ACTIVE_SUB = {
      a_commander: 'Votre commande est en préparation',
      commande: 'Commande transmise au fournisseur',
      fabrication: 'Vos produits sont en fabrication',
      recu: 'Matériel réceptionné — pose à planifier',
      pose: 'Installation en cours',
    };
    const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

    function showError(msg) {
      document.getElementById('loading').innerHTML = `<div class="track-error">${icon('warning', 32)}<div style="margin-top:var(--sp-3);">${esc(msg)}</div>
        <div class="track-foot" style="margin-top:var(--sp-5);">${contactFootHtml()}</div></div>`;
    }
    // « Bonjour »/« Bonsoir » selon l'heure locale du visiteur + prénom (amical) ou civilité+nom (pro).
    function computeGreeting(g) {
      const salut = new Date().getHours() >= 18 ? 'Bonsoir' : 'Bonjour';
      if (!g || (!g.prenom && !g.nom)) return `${salut} !`;
      if (g.ton === 'pro') {
        if (g.civilite && g.nom) return `${salut} ${g.civilite} ${g.nom} !`;
        const full = [g.prenom, g.nom].filter(Boolean).join(' ');
        return full ? `${salut} ${full} !` : `${salut} !`;
      }
      return g.prenom ? `${salut} ${g.prenom} !` : `${salut} !`;
    }

    (async () => {
      const token = new URLSearchParams(location.search).get('t');
      if (!token) { showError('Lien invalide.'); return; }
      let res;
      try {
        res = await fetch('/api/track?t=' + encodeURIComponent(token), { credentials: 'same-origin' }).then(r => r.json());
      } catch (e) {
        showError('Impossible de charger le suivi pour le moment. Réessayez un peu plus tard.');
        return;
      }
      if (!res || !res.ok) { showError(res && res.error || 'Lien invalide ou expiré.'); return; }
      const d = res.data;

      document.getElementById('loading').style.display = 'none';
      document.getElementById('main').style.display = '';
      document.getElementById('trackFoot').innerHTML = contactFootHtml();

      document.getElementById('greeting').textContent = computeGreeting(d.greeting || { prenom: d.prenom });

      const cc = d.commande || {};
      const idx = Math.max(0, STAGES.findIndex(s => s.k === (cc.statut || 'a_commander')));
      // Étape « Posé » atteinte = commande terminée → toutes les étapes en vert (aucune « en cours »).
      const isComplete = idx >= STAGES.length - 1;
      document.getElementById('trackSteps').innerHTML = STAGES.map((s, i) => {
        const done = i < idx || (isComplete && i === idx);
        const active = !isComplete && i === idx;
        const cls = done ? 'done' : (active ? 'active' : 'todo');
        const sub = active ? `<div class="tl-sub">${esc(ACTIVE_SUB[s.k] || 'En cours')}</div>` : '';
        return `<li class="tl-step ${cls}" style="--i:${i}">
          <div class="tl-rail"><span class="dot">${done ? icon('check', 14) : (i + 1)}</span><span class="bar"></span></div>
          <div class="tl-body"><div class="tl-lbl">${esc(s.l)}</div>${sub}</div>
        </li>`;
      }).join('');

      let etaTxt = "L'installateur planifiera prochainement la suite de votre commande.";
      if (cc.date_commande) {
        const eta = new Date(cc.date_commande);
        eta.setDate(eta.getDate() + (cc.delai_semaines || 0) * 7);
        if (!isNaN(eta) && !['recu', 'pose'].includes(cc.statut)) {
          etaTxt = `Livraison estimée : <strong>${eta.toLocaleDateString('fr-BE', { day: '2-digit', month: 'long', year: 'numeric' })}</strong>`;
        } else if (['recu', 'pose'].includes(cc.statut)) {
          etaTxt = cc.statut === 'pose' ? 'Installation terminée — merci de votre confiance !' : 'Matériel reçu, la pose sera bientôt planifiée.';
        }
      }
      document.getElementById('trackEta').innerHTML = etaTxt;

      const items = d.items || [];
      if (items.length) {
        document.getElementById('trackItemsCard').style.display = '';
        document.getElementById('trackItems').innerHTML = items.map(it => `
          <div class="track-item">${icon('window', 16)}<div>${esc(TYPE_LABEL[it.type] || it.type)}${it.modele ? ' — ' + esc(it.modele) : ''}</div></div>
        `).join('');
      }
    })();
  </script>
</body>
</html>
