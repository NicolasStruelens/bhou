<!DOCTYPE html>
<html lang="fr" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SolariScreen — Votre devis</title>
  <link rel="icon" type="image/png" href="assets/img/logo-solariscreen.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600;700&family=Orbitron:wght@600;800&display=swap" rel="stylesheet">
  <script src="assets/js/theme.js"></script>
  <link rel="stylesheet" href="assets/css/tokens.css">
  <link rel="stylesheet" href="assets/css/theme-dark.css">
  <link rel="stylesheet" href="assets/css/theme-light.css">
  <link rel="stylesheet" href="assets/css/base.css">
  <style>
    .rv-wrap { max-width: 560px; margin: 0 auto; padding: var(--sp-6) var(--sp-4); }
    .rv-hero { text-align: center; margin-bottom: var(--sp-6); }
    .rv-hero .logo { width: 64px; height: 64px; margin: 0 auto var(--sp-3); border: 1px solid var(--accent); border-radius: var(--r-lg); display: grid; place-items: center; overflow: hidden; box-shadow: var(--glow-soft); }
    .rv-hero .logo img { width: 100%; height: 100%; object-fit: cover; }
    .rv-hero h1 { font-family: var(--font-display); font-size: var(--fs-xl); }
    .rv-hero p { color: var(--text-muted); font-size: var(--fs-sm); margin-top: var(--sp-2); }

    .rv-items { display: flex; flex-direction: column; gap: var(--sp-2); margin-bottom: var(--sp-5); }
    .rv-item { border: 1px solid var(--border); border-radius: var(--r-sm); padding: var(--sp-3); background: var(--surface-2); }
    .rv-item-row { display: flex; justify-content: space-between; gap: var(--sp-3); }
    .rv-item .k { font-weight: 600; }
    .rv-item .sub { font-family: var(--font-mono); font-size: var(--fs-2xs); color: var(--text-subtle); margin-top: 0.15rem; }
    .rv-item .v { font-family: var(--font-mono); white-space: nowrap; }
    .rv-item-photos { display: flex; gap: var(--sp-2); flex-wrap: wrap; margin-top: var(--sp-3); }
    .rv-item-photos a { display: block; width: 64px; height: 64px; border-radius: var(--r-xs); overflow: hidden; border: 1px solid var(--border); }
    .rv-item-photos img { width: 100%; height: 100%; object-fit: cover; display: block; }

    /* Récapitulatif : les lignes intermédiaires (remise, installation, TVA…) qui font que le
       total tombe juste — sans elles, les produits affichés ne s'additionnaient pas au Total TVAC. */
    .rv-summary { display: flex; flex-direction: column; gap: var(--sp-1); margin: 0 var(--sp-1) var(--sp-3); }
    .rv-sum-row { display: flex; justify-content: space-between; gap: var(--sp-3); font-size: var(--fs-sm); color: var(--text-muted); }
    .rv-sum-row .v { font-family: var(--font-mono); white-space: nowrap; }
    .rv-sum-row.remise { color: var(--ok); }
    .rv-sum-row.htva { border-top: 1px solid var(--border); margin-top: var(--sp-1); padding-top: var(--sp-2); font-weight: 700; color: var(--text); }

    .rv-total { display: flex; justify-content: space-between; align-items: center; padding: var(--sp-4); border: 1px solid var(--border-strong); border-radius: var(--r-md); background: var(--surface); margin-bottom: var(--sp-3); }
    .rv-total .k { font-family: var(--font-mono); font-size: var(--fs-2xs); text-transform: uppercase; letter-spacing: 0.08em; color: var(--text-subtle); }
    .rv-total .v { font-family: var(--font-mono); font-size: 1.6rem; font-weight: 800; color: var(--accent-2); text-shadow: var(--glow-hero); }
    .rv-acompte { font-size: var(--fs-sm); color: var(--text-muted); text-align: center; margin-bottom: var(--sp-5); }
    .rv-acompte strong { color: var(--text); }

    .rv-actions { display: flex; gap: var(--sp-2); flex-wrap: wrap; margin-bottom: var(--sp-5); }
    .rv-actions .btn { flex: 1; min-width: 140px; }
    .rv-question { border: 1px dashed var(--border-strong); border-radius: var(--r-sm); padding: var(--sp-4); margin-bottom: var(--sp-5); }
    .rv-question h3 { font-size: var(--fs-sm); margin-bottom: var(--sp-2); }
    .rv-status-msg { text-align: center; padding: var(--sp-5); border-radius: var(--r-md); border: 1px solid var(--border); background: var(--surface-2); margin-bottom: var(--sp-5); }
    .rv-status-msg.ok { border-color: color-mix(in srgb, var(--ok) 45%, transparent); background: color-mix(in srgb, var(--ok) 10%, transparent); color: var(--ok); }

    .rv-thread { display: flex; flex-direction: column; gap: var(--sp-2); margin-bottom: var(--sp-3); }
    .rv-msg { max-width: 85%; padding: var(--sp-2) var(--sp-3); border-radius: var(--r-sm); font-size: var(--fs-sm); }
    .rv-msg .who { font-family: var(--font-mono); font-size: var(--fs-2xs); text-transform: uppercase; letter-spacing: 0.04em; opacity: 0.7; margin-bottom: 0.2rem; }
    .rv-msg.me { align-self: flex-end; background: color-mix(in srgb, var(--accent-2) 16%, transparent); border: 1px solid color-mix(in srgb, var(--accent-2) 35%, transparent); }
    .rv-msg.staff { align-self: flex-start; background: var(--surface-2); border: 1px solid var(--border); }

    .rv-error { text-align: center; padding: var(--sp-7) var(--sp-4); color: var(--text-muted); }
    .rv-foot { text-align: center; color: var(--text-subtle); font-size: var(--fs-2xs); margin-top: var(--sp-6); }
    .topbar { position: absolute; top: var(--sp-4); right: var(--sp-5); z-index: 2; }

    @media print {
      /* Le thème sombre met un texte quasi-blanc (--text) — Chrome n'imprime pas les couleurs de
         fond par défaut ("graphiques d'arrière-plan" décoché), donc le texte reste blanc sur une
         page imprimée blanche = invisible. On force ici une palette claire, comme document.css
         le fait déjà pour devis.html. */
      :root, [data-theme] {
        --bg: #fff; --surface: #fff; --surface-2: #f4f6fb; --border: #d8deea; --border-strong: #b9c3d6;
        --text: #1a2238; --text-muted: #4a5568; --text-subtle: #8390a6;
        --accent: #2e3b8f; --accent-2: #c98a00; --on-accent: #fff;
        --shadow: none; --glow-soft: none; --glow-hero: none; --glow-accent: none;
      }
      body { background: #fff !important; color: #1a2238 !important; }
      .topbar, .rv-actions, .rv-question, .rv-print-btn, #rvThreadWrap, .fx-grid { display: none !important; }
      .rv-item, .rv-total { border-color: #ccc !important; background: #fff !important; box-shadow: none !important; }
    }
  </style>
</head>
<body>
  <div class="fx-grid"></div>
  <div class="topbar"><span id="themeToggle"></span></div>

  <div class="rv-wrap" id="main" style="display:none;">
    <div class="rv-hero">
      <div class="logo"><img src="assets/img/logo-solariscreen.png" alt="SolariScreen" onerror="this.parentElement.textContent='SS'"></div>
      <h1 id="greeting">Votre devis SolariScreen</h1>
      <p>Voici le récapitulatif de votre devis.</p>
    </div>

    <div class="rv-items" id="rvItems"></div>
    <div class="rv-summary" id="rvSummary"></div>
    <div class="rv-total"><span class="k">Total TVAC</span><span class="v" id="rvTotal">—</span></div>
    <div class="rv-acompte" id="rvAcompte"></div>

    <div id="rvStatusMsg"></div>

    <div class="rv-actions hidden" id="rvActions">
      <button class="btn btn-primary" onclick="submitAction('accept')">J'accepte ce devis</button>
      <button class="btn btn-ghost" onclick="submitAction('decline')">Je refuse</button>
    </div>

    <div id="rvThreadWrap" class="hidden">
      <h3 style="font-size:var(--fs-sm);margin-bottom:var(--sp-2);">Vos échanges avec SolariScreen</h3>
      <div class="rv-thread" id="rvThread"></div>
    </div>

    <div class="rv-question hidden" id="rvQuestionBox">
      <h3>Une question ?</h3>
      <textarea class="textarea" id="rvQuestionText" style="min-height:70px;" placeholder="Écrivez votre question ici…"></textarea>
      <button class="btn btn-ghost btn-sm mt-2" onclick="submitAction('question')">Envoyer</button>
    </div>

    <button class="btn btn-ghost rv-print-btn" style="width:100%;margin-bottom:var(--sp-5);" onclick="printDevis()"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="vertical-align:-2px;margin-right:4px;"><polyline points="6 9 6 2 18 2 18 9"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></svg> Voir le devis complet — imprimer / PDF</button>

    <div class="rv-foot">SolariScreen · www.solariscreen.be</div>
  </div>

  <div class="rv-wrap" id="loading">
    <div class="rv-error">Chargement…</div>
  </div>

  <script src="assets/js/company.js"></script>
  <script src="assets/js/ui.js"></script>
  <script>
    const { icon, fmtEur, fmtDate, toast } = window.SSUI;
    const COMPANY = window.SS_COMPANY;
    window.SSTheme.mountThemeToggle(document.getElementById('themeToggle'));

    const TYPE_LABEL = { screen: 'Screen', volet_roulant: 'Volet', tente_solaire: 'Tente solaire', tablier_volet: 'Tablier volet', pergola: 'Pergola', store_banne: 'Store banne' };
    const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
    const token = new URLSearchParams(location.search).get('t');
    let DATA = null;

    function showError(msg) {
      document.getElementById('loading').innerHTML = `<div class="rv-error">${icon('warning', 32)}<div style="margin-top:var(--sp-3);">${esc(msg)}</div></div>`;
    }

    async function loadReview() {
      if (!token) { showError('Lien invalide.'); return; }
      let res;
      try {
        res = await fetch('/api/devis-review?t=' + encodeURIComponent(token), { credentials: 'same-origin' }).then(r => r.json());
      } catch (e) {
        showError('Impossible de charger votre devis pour le moment. Réessayez un peu plus tard.');
        return;
      }
      if (!res || !res.ok) { showError((res && res.error) || 'Lien invalide ou expiré.'); return; }
      DATA = res.data;
      document.getElementById('loading').style.display = 'none';
      document.getElementById('main').style.display = '';
      render();
    }

    function render() {
      const d = DATA;
      if (d.prenom) document.getElementById('greeting').textContent = `Bonjour ${d.prenom} !`;
      document.getElementById('rvItems').innerHTML = (d.items || []).map(it => {
        const dims = window.SSUI.dimsOf(it);
        const sousTotal = (it.prix_catalogue_ht || 0) * (it.quantite || 1);
        const photosHtml = (it.photos || []).length ? `<div class="rv-item-photos">${it.photos.map(p =>
          `<a href="${esc(p)}" target="_blank" rel="noopener"><img src="${esc(p)}" alt="Photo de l'ouverture" loading="lazy"></a>`).join('')}</div>` : '';
        return `<div class="rv-item">
          <div class="rv-item-row">
            <div><div class="k">${esc(TYPE_LABEL[it.type] || it.type)}${it.modele ? ' — ' + esc(it.modele) : ''}</div>
            <div class="sub">${[dims, it.quantite > 1 ? '× ' + it.quantite : ''].filter(Boolean).join(' · ')}</div></div>
            <div class="v">${fmtEur(sousTotal)}</div>
          </div>
          ${photosHtml}
        </div>`;
      }).join('') || '<div class="text-muted">Aucune ouverture.</div>';
      document.getElementById('rvTotal').textContent = fmtEur(d.total_ttc);
      renderSummary();
      renderThread();

      const decidable = ['envoye_client', 'relance_1', 'relance_2'].includes(d.statut) && !d.client_accepted;
      const statusBox = document.getElementById('rvStatusMsg');
      if (d.client_accepted) {
        statusBox.innerHTML = `<div class="rv-status-msg ok">Vous avez accepté ce devis — nous revenons vers vous rapidement pour finaliser votre commande.</div>`;
      } else if (d.statut === 'signe' || d.statut === 'termine') {
        statusBox.innerHTML = `<div class="rv-status-msg ok">Ce devis est déjà confirmé. Merci !</div>`;
      } else if (d.statut === 'refuse') {
        statusBox.innerHTML = `<div class="rv-status-msg">Ce devis a été marqué comme refusé.</div>`;
      } else {
        statusBox.innerHTML = '';
      }
      document.getElementById('rvActions').classList.toggle('hidden', !decidable);
      document.getElementById('rvQuestionBox').classList.toggle('hidden', false);
    }

    // Récapitulatif détaillé : rend visibles les lignes qui expliquent l'écart entre la somme des
    // produits (au prix catalogue) et le Total TVAC — installation, remises, supplément, TVA. Les
    // valeurs viennent de DATA.document.calc (déjà aplaties en nombres par le serveur, sans marge).
    // Sans le bloc « document » (vieux devis sans calculs enregistrés), on n'affiche que le total.
    function renderSummary() {
      const box = document.getElementById('rvSummary');
      const acompteBox = document.getElementById('rvAcompte');
      const doc = DATA.document;
      const c = doc && doc.calc;
      if (!c) { box.innerHTML = ''; acompteBox.innerHTML = ''; return; }
      const fournitures = (doc.items || []).reduce((s, it) => s + (it.prix_catalogue_ht || 0) * (it.quantite || 1), 0);
      const row = (k, v, cls) => `<div class="rv-sum-row ${cls || ''}"><span>${k}</span><span class="v">${v}</span></div>`;
      let rows = '';
      rows += row('Fournitures', fmtEur(fournitures));
      if (c.remise_catalogue > 0) rows += row('Remise commerciale', '− ' + fmtEur(c.remise_catalogue), 'remise');
      if (c.install_total_brut > 0) rows += row('Installation et pose', fmtEur(c.install_total_brut));
      if (c.remise_installation > 0) rows += row('Remise commerciale', '− ' + fmtEur(c.remise_installation), 'remise');
      (c.extra_lines || []).forEach(e => { if (e.total_ht) rows += row(esc(e.label || 'Option'), fmtEur(e.total_ht)); });
      if (c.surplus_difficulte > 0) rows += row('Supplément accès difficile', fmtEur(c.surplus_difficulte));
      rows += row('Total HTVA', fmtEur(c.total_ht), 'htva');
      rows += row('TVA ' + (c.tva_pct != null ? c.tva_pct : 6) + ' %', fmtEur(c.total_tva));
      box.innerHTML = rows;
      // Rappel acompte / solde (comme sur le devis officiel), hors devis informatif.
      if (!doc.informatif && c.acompte_pct > 0 && c.acompte_montant > 0) {
        const solde = (c.total_ttc || 0) - (c.acompte_montant || 0);
        acompteBox.innerHTML = `Acompte de <strong>${c.acompte_pct} %</strong> à la commande : <strong>${fmtEur(c.acompte_montant)}</strong> — solde de <strong>${fmtEur(solde)}</strong> à la pose.`;
      } else { acompteBox.innerHTML = ''; }
    }

    function renderThread() {
      const comments = (DATA.comments || []).slice().sort((a, b) => String(a.date).localeCompare(String(b.date)));
      document.getElementById('rvThreadWrap').classList.toggle('hidden', !comments.length);
      document.getElementById('rvThread').innerHTML = comments.map(c => {
        const mine = c.author === 'client';
        return `<div class="rv-msg ${mine ? 'me' : 'staff'}">
          <div class="who">${mine ? 'Vous' : 'SolariScreen'} · ${fmtDate(c.date)}</div>
          <div>${esc(c.text)}</div>
        </div>`;
      }).join('');
    }

    // ══════ LE VRAI DEVIS (même rendu que app/devis.html, via document.css) ══════
    // Reconstruit le document officiel à partir du payload `document` de l'API (filtré côté
    // serveur : jamais de marge/données internes). Miroir volontaire de renderPaper()/cgvPaper()
    // de app/devis.html — si tu modifies la mise en page là-bas, répercute ici.
    const VALIDITE_JOURS = 30;
    function addDays(iso, n) {
      const d2 = iso ? new Date(iso) : new Date();
      if (isNaN(d2)) return '';
      d2.setDate(d2.getDate() + n);
      return d2.toISOString().slice(0, 10);
    }
    function buildPaperHtml(doc) {
      const c = doc.calc, cl = doc.client || {}, adr = cl.adresse || {};
      const info = !!doc.informatif;
      let rows = '';
      (doc.items || []).forEach((it, i) => {
        const dims = window.SSUI.dimsOf(it) || '—';
        const pu = it.prix_catalogue_ht || 0, qty = it.quantite || 1;
        const coloris = (() => {
          const cais = it.couleur || '';
          const coul = it.couleur_coulisses && it.couleur_coulisses !== cais ? it.couleur_coulisses : '';
          const lame = it.couleur_lame && it.couleur_lame !== cais ? it.couleur_lame : '';
          if (!cais && !coul && !lame) return '';
          if (!coul && !lame) return cais;
          const parts = [];
          if (cais) parts.push('caisson ' + cais);
          if (coul) parts.push('coulisses ' + coul);
          if (lame) parts.push('lame ' + lame);
          return parts.join(', ');
        })();
        const meta = [it.variante, (it.combinaison && it.combinaison !== 'Simple') ? it.combinaison : '', it.manoeuvre, it.moteur, coloris, it.toile, it.emplacement, it.etage].filter(Boolean).join(' · ');
        rows += `<tr>
          <td class="num">${i + 1}</td>
          <td class="desc"><strong>${esc(TYPE_LABEL[it.type] || it.type)}${it.modele ? ' — ' + esc(it.modele) : ''}</strong>${meta ? '<small>' + esc(meta) + '</small>' : ''}</td>
          <td>${dims}</td>
          <td class="num">${qty}</td>
          <td class="num">${esc(fmtEur(pu))}</td>
          <td class="num">${esc(fmtEur(pu * qty))}</td>
        </tr>`;
      });
      if (c.remise_catalogue > 0) {
        rows += `<tr class="remise-row"><td class="num">—</td><td class="desc"><strong>Remise commerciale</strong></td><td>—</td><td>—</td><td>—</td><td class="num">− ${esc(fmtEur(c.remise_catalogue))}</td></tr>`;
      }
      let presta = '';
      if (c.install_total_brut > 0) {
        presta += `<tr><td class="num">—</td><td class="desc"><strong>Installation et pose</strong><small>Main-d'œuvre et mise en service</small></td><td>—</td><td class="num">1</td><td class="num">${esc(fmtEur(c.install_total_brut))}</td><td class="num">${esc(fmtEur(c.install_total_brut))}</td></tr>`;
      }
      if (c.remise_installation > 0) {
        presta += `<tr class="remise-row"><td class="num">—</td><td class="desc"><strong>Remise commerciale</strong></td><td>—</td><td>—</td><td>—</td><td class="num">− ${esc(fmtEur(c.remise_installation))}</td></tr>`;
      }
      (c.extra_lines || []).forEach((e) => {
        presta += `<tr><td class="num">—</td><td class="desc"><strong>${esc(e.label)}</strong></td><td>—</td><td class="num">${e.qty}</td><td class="num">${esc(fmtEur(e.unit_price_ht))}</td><td class="num">${esc(fmtEur(e.total_ht))}</td></tr>`;
      });
      if (c.surplus_difficulte > 0) {
        presta += `<tr><td class="num">—</td><td class="desc"><strong>Supplément accès difficile</strong></td><td>—</td><td class="num">1</td><td class="num">${esc(fmtEur(c.surplus_difficulte))}</td><td class="num">${esc(fmtEur(c.surplus_difficulte))}</td></tr>`;
      }
      const solde = c.total_ttc - c.acompte_montant;
      const paper = `
        ${info ? '<div class="watermark informatif">INFORMATIF</div>' : ''}
        <div class="doc-head">
          <div class="brand-block">
            <div class="logo"><img src="assets/img/logo-solariscreen.png" alt="SolariScreen"></div>
            <div>
              <div class="co-name"><span class="b">SOLARI</span><span class="g">SCREEN</span></div>
              <div class="co-tag">${esc(COMPANY.tagline)}</div>
            </div>
          </div>
          <div class="doc-meta">
            <div class="doc-title">${info ? 'DEVIS INFORMATIF' : 'DEVIS'}</div>
            <div class="doc-num">N° ${esc(doc.id)}</div>
            <div class="doc-dates">
              Date : ${fmtDate(doc.date_creation)}<br>
              ${info ? 'Estimation à titre indicatif' : 'Valable jusqu\'au ' + fmtDate(addDays(doc.date_creation, VALIDITE_JOURS))}
            </div>
          </div>
        </div>
        ${info ? '<div class="pay-note"><strong>Estimation non contractuelle</strong> — établie à partir de mesures approximatives, sans engagement. Un devis formel sera établi après prise de mesures précises sur place.</div>' : ''}
        <div class="parties">
          <div class="party">
            <h4>Émetteur</h4>
            <div class="pname">${esc(COMPANY.name)}</div>
            <div class="pline">
              ${COMPANY.legal ? esc(COMPANY.legal) + '<br>' : ''}
              ${esc(COMPANY.address)}<br>
              TVA : ${esc(COMPANY.tva)}<br>
              ${esc(COMPANY.email)}${COMPANY.email2 ? ' · ' + esc(COMPANY.email2) : ''}${COMPANY.phone ? '<br>' + esc(COMPANY.phone) : ''}
            </div>
          </div>
          <div class="party">
            <h4>Client</h4>
            <div class="pname">${esc(cl.prenom)} ${esc(cl.nom) || '—'}</div>
            <div class="pline">
              ${(adr.rue || adr.numero) ? esc(adr.rue) + ' ' + esc(adr.numero) + '<br>' : ''}
              ${(adr.code_postal || adr.ville) ? esc(adr.code_postal) + ' ' + esc(adr.ville) + '<br>' : ''}
              ${cl.telephone ? esc(cl.telephone) + '<br>' : ''}${cl.email ? esc(cl.email) : ''}
            </div>
          </div>
        </div>
        <table class="doc-table">
          <thead><tr>
            <th class="num">#</th><th>Désignation</th><th>Dimensions</th>
            <th class="num">Qté</th><th class="num">P.U. HTVA</th><th class="num">Total HTVA</th>
          </tr></thead>
          <tbody>
            ${rows ? '<tr class="cat-row"><td colspan="6">Fournitures</td></tr>' + rows : ''}
            ${presta ? '<tr class="cat-row"><td colspan="6">Prestations & options</td></tr>' + presta : ''}
          </tbody>
        </table>
        <div class="totals"><div class="box">
          <div class="t-row"><span>Total HTVA</span><span class="v">${esc(fmtEur(c.total_ht))}</span></div>
          <div class="t-row t-sub"><span>TVA ${c.tva_pct} %</span><span class="v">${esc(fmtEur(c.total_tva))}</span></div>
          <div class="t-ttc"><span class="k">Total TVAC</span><span class="v">${esc(fmtEur(c.total_ttc))}</span></div>
        </div></div>
        ${info ? '' : `
        <div class="pay-note">
          Acompte de <strong>${c.acompte_pct} %</strong> à la commande : <strong>${esc(fmtEur(c.acompte_montant))}</strong> —
          solde de <strong>${esc(fmtEur(solde))}</strong> à la livraison / pose.
          <br><span style="font-size:var(--fs-2xs);color:var(--text-muted);">Versement sur le compte ${esc(COMPANY.iban)} — communication : devis n° ${esc(doc.id)}.</span>
        </div>
        <div class="doc-ref">Devis valable ${VALIDITE_JOURS} jours · soumis à nos Conditions Générales de Vente (voir annexe)${c.tva_pct === 6 ? ' · Attestation TVA 6 % en annexe' : ''}</div>`}
        <div class="partners">
          <span class="lbl">Partenaires</span>
          <span class="partner-chip"><img src="assets/img/logo-harol.png" alt="Harol"></span>
          <span class="partner-chip"><img src="assets/img/logo-somfy.png" alt="Somfy"></span>
        </div>
        ${info ? '' : `
        <div class="signatures">
          <div class="sig-box">
            <h4>Bon pour accord — le client</h4>
            ${doc.signature && doc.signature.image
              ? `<img src="${doc.signature.image}" alt="Signature du client" style="max-width:100%;max-height:65px;margin-top:0.3rem;"><div class="hint">Signé le ${fmtDate(doc.signature.date)} — « Lu et approuvé »</div>`
              : `<div class="hint">Date et signature précédées de la mention « Lu et approuvé »</div>`}
          </div>
          <div class="sig-box"><h4>${esc(COMPANY.name)}</h4><div class="hint">Pour acceptation</div></div>
        </div>`}
        <div class="doc-foot">${esc(COMPANY.name)} · ${esc(COMPANY.web)} · TVA ${esc(COMPANY.tva)} · IBAN ${esc(COMPANY.iban)}</div>`;
      const cgv = info ? '' : `<div class="paper">
        <div class="doc-head"><div class="co-name"><span class="b">Conditions</span> <span class="g">générales de vente</span></div><div class="doc-meta"><div class="doc-num">Devis N° ${esc(doc.id)}</div></div></div>
        <div class="cgv-body">
          <h5>1. Objet &amp; commande</h5>
          Les présentes conditions régissent la vente, la livraison et l'installation des produits proposés par ${esc(COMPANY.name)}. Toute commande implique l'adhésion pleine et entière du client. Le devis est valable ${VALIDITE_JOURS} jours et doit être confirmé par écrit (devis signé ou bon de commande). ${esc(COMPANY.name)} se réserve le droit de refuser ou d'adapter l'installation si des raisons techniques ou de sécurité l'exigent.
          <h5>2. Prix &amp; paiement</h5>
          Prix en euros, TVA comprise. Sauf mention contraire sur le devis, un acompte est dû à la commande pour valider le projet et lancer la fabrication ; le solde est payable le jour de l'installation, immédiatement après la fin des travaux, par virement instantané ou paiement par carte. Tout retard de paiement entraîne de plein droit et sans mise en demeure préalable des intérêts de retard au taux légal majoré de 10 %, ainsi qu'une indemnité forfaitaire de 15 % du montant dû (minimum 150 €).
          <h5>3. Livraison &amp; installation</h5>
          Les délais sont donnés à titre indicatif et ne peuvent donner droit à des dommages-intérêts, sauf faute lourde de ${esc(COMPANY.name)}. Le client doit assurer l'accessibilité du lieu d'installation. Les installations sont réalisées selon les règles de l'art ; pour les tentes solaires, ${esc(COMPANY.name)} décide seul de la faisabilité et celles-ci ne doivent jamais rester ouvertes en cas de vent.
          <h5>4. Garantie</h5>
          Produits Harol : 5 ans · Moteurs RTS &amp; IO : 5 ans · Moteurs solaires et batteries Somfy : 7 ans · Autres moteurs solaires et batteries : 5 ans. La garantie ne couvre pas une mauvaise utilisation, l'absence d'entretien, ni les dommages causés par un tiers ou une catastrophe naturelle.
          <h5>5. Responsabilité &amp; réclamations</h5>
          ${esc(COMPANY.name)} ne peut être tenu responsable des dommages indirects, ni d'une installation électrique défectueuse du client. Toute réclamation doit être faite par écrit dans les 7 jours suivant la livraison ou l'installation.
          <h5>6. Annulation — commandes sur mesure</h5>
          Nos produits étant fabriqués sur mesure, toute annulation après confirmation de commande donne lieu à une indemnité forfaitaire : 10 % du montant TTC en cas d'annulation avant la commande des marchandises auprès du fournisseur, ou 100 % du prix TTC des marchandises sur mesure déjà commandées (hors installation et prestations non réalisées). Les acomptes versés restent acquis à ${esc(COMPANY.name)} à titre de minimum forfaitaire.
          <h5>7. Litiges</h5>
          Les présentes conditions sont soumises au droit belge. Tout litige relève des tribunaux de ${esc(COMPANY.court)}.
        </div>
      </div>`;
      return { paper, cgv };
    }

    // Impression : document DÉDIÉ généré dans une fenêtre propre (fond blanc, texte noir) —
    // totalement indépendant du thème sombre de la page. Imprimer la page elle-même
    // (window.print) dépend du moteur du navigateur pour convertir le thème sombre,
    // ce qui a déjà produit des PDF blancs chez le client — plus jamais via ce chemin-ci.
    function buildPrintHtml(d) {
      const rows = (d.items || []).map(it => {
        const dims = (it.largeur && it.hauteur) ? `${it.largeur} × ${it.hauteur} mm` : '—';
        const sousTotal = (it.prix_catalogue_ht || 0) * (it.quantite || 1);
        return `<tr><td>${esc(TYPE_LABEL[it.type] || it.type)}${it.modele ? ' — ' + esc(it.modele) : ''}</td>` +
          `<td>${dims}</td><td>${it.quantite || 1}</td><td style="text-align:right;">${esc(fmtEur(sousTotal))}</td></tr>`;
      }).join('');
      return `<!DOCTYPE html><html lang="fr"><head><meta charset="utf-8"><title>Devis SolariScreen ${esc(d.id || '')}</title>
<style>
  body { font-family: Arial, Helvetica, sans-serif; color: #1a2238; background: #fff; margin: 36px; }
  .head { display: flex; align-items: center; gap: 14px; margin-bottom: 4px; }
  .head img { width: 52px; height: 52px; border-radius: 8px; }
  h1 { font-size: 19px; margin: 0; }
  .sub { color: #4a5568; font-size: 12px; margin: 3px 0 0; }
  table { width: 100%; border-collapse: collapse; margin: 18px 0 10px; }
  th, td { border: 1px solid #c9d2e0; padding: 7px 9px; font-size: 12.5px; text-align: left; }
  th { background: #f0f3f9; font-size: 11px; text-transform: uppercase; letter-spacing: 0.04em; }
  .total { text-align: right; font-size: 16px; font-weight: bold; margin: 8px 0 0; }
  .tva { text-align: right; color: #4a5568; font-size: 11px; margin: 2px 0 0; }
  .foot { margin-top: 26px; padding-top: 10px; border-top: 1px solid #c9d2e0; color: #8390a6; font-size: 10.5px; }
</style></head><body>
<div class="head"><img src="/assets/img/logo-solariscreen.png" onerror="this.remove()"><div>
  <h1>SolariScreen — Devis ${esc(d.id || '')}</h1>
  <p class="sub">${d.prenom ? 'Client : ' + esc(d.prenom) + ' · ' : ''}Imprimé le ${new Date().toLocaleDateString('fr-BE')}</p>
</div></div>
<table><thead><tr><th>Produit</th><th>Dimensions</th><th>Qté</th><th>Prix</th></tr></thead><tbody>${rows}</tbody></table>
<p class="total">Total TVAC : ${esc(fmtEur(d.total_ttc))}</p>
<p class="tva">TVA ${d.tva_pct || 6}% comprise</p>
<p class="foot">SolariScreen · www.solariscreen.be — Récapitulatif imprimé depuis votre espace client. Le devis détaillé signé fait foi.</p>
</body></html>`;
    }
    window.printDevis = () => {
      if (!DATA) { window.print(); return; }
      const w = window.open('', '_blank');
      if (!w) { window.print(); return; } // popup bloquée → impression classique en secours
      const doc = DATA.document;
      if (doc && doc.calc) {
        // Le VRAI devis, avec la même feuille de style document.css que app/devis.html.
        // <base> obligatoire : la popup naît sur about:blank, sans lui aucun chemin relatif
        // (css, logos) ne se résout. Résolu depuis la page appelante → marche en prod ET en local.
        const base = new URL('.', location.href).href;
        const types = [...new Set((doc.items || []).map(it => TYPE_LABEL[it.type] || it.type))].join(' + ');
        const titre = ['SolariScreen', types || 'Devis', [doc.client.prenom, doc.client.nom].filter(Boolean).join(' ') || 'Client', doc.id].join(' - ');
        const { paper, cgv } = buildPaperHtml(doc);
        w.document.write(`<!DOCTYPE html><html lang="fr" data-theme="light"><head>
          <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
          <base href="${base}">
          <title>${esc(titre)}</title>
          <link rel="preconnect" href="https://fonts.googleapis.com">
          <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
          <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600;700&family=Orbitron:wght@600;800&display=swap" rel="stylesheet">
          <link rel="stylesheet" href="assets/css/tokens.css">
          <link rel="stylesheet" href="assets/css/theme-light.css">
          <link rel="stylesheet" href="assets/css/base.css">
          <link rel="stylesheet" href="assets/css/document.css">
        </head><body>
          <div class="paper-wrap"><div class="paper">${paper}</div></div>
          ${cgv ? '<div class="annex">' + cgv + '</div>' : ''}
          <script>
            // Impression une fois styles + polices + logos chargés (sinon mise en page faussée).
            window.addEventListener('load', async function () {
              try { await document.fonts.ready; } catch (e) {}
              setTimeout(function () { window.print(); }, 200);
            });
          <\/script>
        </body></html>`);
      } else {
        // Vieux devis sans calculs enregistrés : récapitulatif simple (jamais une page blanche).
        w.document.write(buildPrintHtml(DATA));
        setTimeout(() => { try { w.print(); } catch (e) {} }, 350);
      }
      w.document.close();
      w.focus();
    };

    window.submitAction = async (action) => {
      let text = '';
      if (action === 'question') {
        text = document.getElementById('rvQuestionText').value.trim();
        if (!text) { toast('Écris ta question avant d\'envoyer.', 'warn'); return; }
      }
      if (action === 'decline') {
        text = prompt('Une raison à préciser (facultatif) ?') || '';
      }
      try {
        const res = await fetch('/api/devis-review', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ token, action, text }),
        }).then(r => r.json());
        if (!res.ok) { toast(res.error || 'Erreur', 'error'); return; }
        if (action === 'question') {
          document.getElementById('rvQuestionText').value = '';
          // Affiché localement tout de suite plutôt que via un re-fetch juste après l'écriture
          // (un GET immédiat après un POST peut renvoyer une version pas encore à jour côté D1).
          DATA.comments = (DATA.comments || []).concat([{ author: 'client', text, date: new Date().toISOString() }]);
          renderThread();
          toast('Question envoyée ✓', 'ok');
        } else {
          toast('Merci pour votre réponse ✓', 'ok');
          await loadReview();
        }
      } catch (e) {
        toast('Erreur réseau, réessayez plus tard.', 'error');
      }
    };

    loadReview();
  </script>
</body>
</html>
