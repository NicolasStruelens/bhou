<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Visuels VLAN – IFAPME</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #0d1117;
    color: #e6edf3;
    font-family: 'Segoe UI', sans-serif;
    min-height: 100vh;
    padding: 40px 20px;
  }
  h1 {
    text-align: center;
    font-size: 1.4rem;
    font-weight: 600;
    color: #58a6ff;
    margin-bottom: 8px;
    letter-spacing: 1px;
  }
  p.sub {
    text-align: center;
    color: #8b949e;
    font-size: 0.85rem;
    margin-bottom: 40px;
  }
  .grid {
    display: flex;
    flex-direction: column;
    gap: 32px;
    max-width: 900px;
    margin: 0 auto;
  }
  .card {
    background: #161b22;
    border: 1px solid #30363d;
    border-radius: 12px;
    overflow: hidden;
  }
  .card img {
    width: 100%;
    display: block;
    cursor: zoom-in;
    transition: opacity .2s;
  }
  .card img:hover { opacity: .9; }
  .card-footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 18px;
    border-top: 1px solid #30363d;
  }
  .card-footer span {
    font-size: 0.9rem;
    color: #8b949e;
  }
  .btn-dl {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: #238636;
    color: #fff;
    text-decoration: none;
    padding: 7px 16px;
    border-radius: 6px;
    font-size: 0.85rem;
    font-weight: 600;
    transition: background .2s;
  }
  .btn-dl:hover { background: #2ea043; }
  /* Lightbox */
  #lb { display:none; position:fixed; inset:0; background:rgba(0,0,0,.88); z-index:999; align-items:center; justify-content:center; cursor:zoom-out; }
  #lb.active { display:flex; }
  #lb img { max-width:95vw; max-height:92vh; border-radius:8px; box-shadow:0 8px 40px #000; }
</style>
</head>
<body>

<h1>🖼️ Visuels VLAN — IFAPME</h1>
<p class="sub">Cliquez sur une image pour l'agrandir · Bouton vert pour télécharger</p>

<div class="grid">

  <div class="card">
    <img src="VM_VLAN_ELEVES.png" alt="VLAN Élèves" onclick="openLB(this)">
    <div class="card-footer">
      <span>VLAN Élèves</span>
      <a class="btn-dl" href="VM_VLAN_ELEVES.png" download>⬇ Télécharger</a>
    </div>
  </div>

  <div class="card">
    <img src="VM_VLAN_PEDA.png" alt="VLAN Pédagogique" onclick="openLB(this)">
    <div class="card-footer">
      <span>VLAN Pédagogique</span>
      <a class="btn-dl" href="VM_VLAN_PEDA.png" download>⬇ Télécharger</a>
    </div>
  </div>

  <div class="card">
    <img src="VM_VLAN_ADMIN.png" alt="VLAN Admin" onclick="openLB(this)">
    <div class="card-footer">
      <span>VLAN Admin</span>
      <a class="btn-dl" href="VM_VLAN_ADMIN.png" download>⬇ Télécharger</a>
    </div>
  </div>

</div>

<!-- Lightbox -->
<div id="lb" onclick="closeLB()">
  <img id="lb-img" src="" alt="">
</div>

<script>
  function openLB(img) {
    document.getElementById('lb-img').src = img.src;
    document.getElementById('lb').classList.add('active');
  }
  function closeLB() {
    document.getElementById('lb').classList.remove('active');
  }
  document.addEventListener('keydown', e => { if(e.key === 'Escape') closeLB(); });
</script>

</body>
</html>
