<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Racine</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="assets/css/tokens.css">
<link rel="stylesheet" href="assets/css/base.css">
<script>
  (function () {
    var saved = localStorage.getItem('racine_theme');
    if (saved) document.documentElement.setAttribute('data-theme', saved);
  })();
</script>
</head>
<body>
<canvas id="starfield"></canvas>
<div class="app-shell">

  <div class="topbar">
    <div class="brand"><span class="dot"></span>Racine</div>
    <div class="tabs">
      <button class="tab active" data-view="notes">Racine</button>
      <button class="tab" data-view="clips">Presse-papier<span class="badge" id="clipCount"></span></button>
    </div>
    <div class="topbar-right">
      <button class="theme-toggle" id="themeToggle" title="Basculer jour/nuit">🌙</button>
      <button class="btn btn-ghost" id="logoutBtn">Déconnexion</button>
    </div>
  </div>

  <main>

    <!-- ===== Vue notes ===== -->
    <section class="view active" id="view-notes">
      <div class="capture-bar">
        <div class="kind-select" id="kindSelect">
          <button class="kind-btn active" data-kind="idee">Idée</button>
          <button class="kind-btn" data-kind="todo">À faire</button>
          <button class="kind-btn" data-kind="note">Note</button>
        </div>
        <input type="text" id="captureInput" placeholder="Écris ce que tu ne dois pas oublier, puis Entrée…">
        <button class="pin-toggle" id="pinToggle" title="Marquer « à ne pas oublier »">★</button>
      </div>

      <div class="tree" id="tree"></div>
      <div class="empty-state" id="emptyState" style="display:none">
        <div class="dot-big"></div>
        <p>Rien pour l'instant. Écris ta première idée ci-dessus.</p>
      </div>
    </section>

    <!-- ===== Vue presse-papier ===== -->
    <section class="view" id="view-clips">
      <div class="clip-form">
        <textarea id="clipContent" placeholder="Colle ici une commande, un mot de passe, un texte à transférer…"></textarea>
        <div class="clip-form-row">
          <input type="text" id="clipLabel" class="field" placeholder="Étiquette (optionnel)">
          <select id="clipTtl">
            <option value="">Jamais expirer</option>
            <option value="3600000">Expire dans 1 heure</option>
            <option value="86400000">Expire dans 24 heures</option>
            <option value="604800000">Expire dans 7 jours</option>
          </select>
          <label class="file-label" for="clipFile">Joindre un petit fichier (max ~800 Ko)</label>
          <input type="file" id="clipFile" style="display:none">
          <button class="btn btn-primary" id="clipSend">Envoyer</button>
        </div>
      </div>

      <div class="clip-grid" id="clipGrid"></div>
      <div class="empty-state" id="clipEmpty" style="display:none">
        <div class="dot-big"></div>
        <p>Aucune entrée. Colle quelque chose pour le retrouver sur un autre appareil.</p>
      </div>
    </section>

  </main>
</div>

<div class="toast" id="toast"></div>

<script src="assets/js/starfield.js"></script>
<script src="assets/js/api.js"></script>
<script src="assets/js/app.js"></script>
</body>
</html>
