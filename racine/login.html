<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Racine — connexion</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="assets/css/tokens.css">
<link rel="stylesheet" href="assets/css/base.css">
<script>
  (function () {
    var saved = localStorage.getItem('racine_theme');
    if (saved) document.documentElement.setAttribute('data-theme', saved);
  })();
</script>
</head>
<body>
<canvas id="starfield"></canvas>
<div class="login-shell">
  <div class="login-card">
    <div class="brand-dot"></div>
    <h1>Racine</h1>
    <p>Ton espace pour ne rien oublier.</p>
    <form id="loginForm">
      <input class="field" type="password" id="password" placeholder="Mot de passe" autofocus autocomplete="current-password">
      <button class="btn btn-primary btn-block" type="submit">Entrer</button>
      <div class="login-error" id="loginError"></div>
    </form>
  </div>
</div>
<script src="assets/js/starfield.js"></script>
<script src="assets/js/api.js"></script>
<script>
  document.getElementById('loginForm').addEventListener('submit', function (e) {
    e.preventDefault();
    var pwd = document.getElementById('password').value;
    var errEl = document.getElementById('loginError');
    errEl.textContent = '';
    RA.login(pwd).then(function () {
      location.href = 'app.html';
    }).catch(function (err) {
      errEl.textContent = 'Mot de passe incorrect.';
    });
  });
</script>
</body>
</html>
