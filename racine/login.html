<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Racine — connexion</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#020617">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="format-detection" content="telephone=no">
<link rel="icon" type="image/png" sizes="16x16" href="assets/icons/favicon-16.png">
<link rel="icon" type="image/png" sizes="32x32" href="assets/icons/favicon-32.png">
<link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
<link rel="stylesheet" href="assets/css/tokens.css?v=11">
<link rel="stylesheet" href="assets/css/base.css?v=11">
<script>
  (function () {
    var saved = localStorage.getItem('racine_theme');
    if (saved) document.documentElement.setAttribute('data-theme', saved);
  })();
</script>
</head>
<body>
<canvas id="starfield"></canvas>
<div class="login-shell">
  <div class="login-card">
    <div class="brand-dot"></div>
    <h1><span class="brand-text">Racine</span></h1>
    <p>Ton espace pour ne rien oublier.</p>
    <form id="loginForm">
      <input class="field" type="password" id="password" placeholder="Mot de passe" autofocus autocomplete="current-password">
      <button class="btn btn-primary btn-block" type="submit">Entrer</button>
      <div class="login-error" id="loginError"></div>
    </form>
  </div>
</div>
<script src="assets/js/starfield.js?v=11"></script>
<script src="assets/js/api.js?v=11"></script>
<script>
  document.getElementById('loginForm').addEventListener('submit', function (e) {
    e.preventDefault();
    var pwd = document.getElementById('password').value;
    var errEl = document.getElementById('loginError');
    errEl.textContent = '';
    RA.login(pwd).then(function () {
      location.href = 'app.html';
    }).catch(function (err) {
      errEl.textContent = 'Mot de passe incorrect.';
    });
  });
</script>
</body>
</html>
